<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비교 분석 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .seg-ctrl { display:inline-flex; border:1px solid #E0E0E0; border-radius:6px; overflow:hidden; }
    .seg-btn { padding:6px 16px; font-size:13px; cursor:pointer; background:#fff; border:none; color:#757575; transition:all .15s; }
    .seg-btn.active { background:#00A3FF; color:#fff; font-weight:600; }
    .seg-btn:not(:last-child) { border-right:1px solid #E0E0E0; }
    .toggle-row { display:flex; flex-wrap:wrap; gap:6px 16px; padding:8px 0; }
    .toggle-chip { display:flex; align-items:center; gap:4px; font-size:12px; color:#424242; cursor:pointer; user-select:none; }
    .toggle-chip input { accent-color:#00A3FF; }
    .compare-columns { display:flex; gap:12px; margin-bottom:16px; }
    .compare-columns.cols-2 > .compare-col { flex:1; }
    .compare-columns.cols-3 > .compare-col { flex:1; }
    .compare-col { background:#fff; border-radius:12px; border:1px solid #E8E8E8; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
    .col-header { font-size:15px; font-weight:700; padding:14px 16px; background:#FAFAFA; border-bottom:1px solid #F0F0F0; text-align:center; }
    .col-header.best { color:#00A3FF; }
    .col-widget { padding:16px; border-top:1px solid #F0F0F0; }
    .col-widget:first-of-type { border-top:none; }
    .widget-label { font-size:13px; font-weight:700; color:#424242; padding:8px 0 6px; letter-spacing:0; }
    .big-score { font-size:28px; font-weight:700; line-height:1.2; }
    .big-score.best { color:#00A3FF; }
    .diff-badge { font-size:12px; color:#F44336; font-weight:500; }
    .diff-badge.good { color:#4CAF50; }
    .prev-change { font-size:12px; margin-top:4px; }
    .prev-change.up { color:#4CAF50; }
    .prev-change.down { color:#F44336; }
    .prev-change.stable { color:#757575; }
    .stat-row { display:grid; grid-template-columns:auto 1fr auto; align-items:center; padding:4px 0; font-size:13px; gap:0 6px; }
    .stat-label { color:#757575; }
    .stat-val { font-weight:600; text-align:right; }
    .stat-val.best { color:#00A3FF; }
    .diff-cell { min-width:56px; text-align:right; }
    .stacked-bar { display:flex; height:18px; border-radius:4px; overflow:hidden; margin:8px 0; }
    .stacked-bar > div { transition:width .3s; }
    .dist-legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:11px; color:#757575; }
    .dist-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:3px; vertical-align:middle; }
    .trend-icon { display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; }
    .trend-icon.up { color:#4CAF50; }
    .trend-icon.down { color:#F44336; }
    .trend-icon.stable { color:#757575; }
    .stat-row.clickable { cursor:pointer; border-radius:4px; transition:background .15s; }
    .stat-row.clickable:hover { background:#F5F5F5; }
    .target-selector { display:flex; gap:8px; flex-wrap:wrap; }
    .target-chip { padding:5px 12px; font-size:12px; border:1px solid #E0E0E0; border-radius:16px; cursor:pointer; background:#fff; transition:all .15s; user-select:none; }
    .target-chip.selected { background:#E3F2FD; border-color:#00A3FF; color:#00A3FF; font-weight:600; }
    .target-chip.disabled { opacity:.4; cursor:not-allowed; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">비교 분석</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">센터·팀 간 품질 데이터 비교 분석</p>
      </div>
      <div id="period-picker-container"></div>
    </div>

    <!-- 검색 조건 -->
    <div class="filter-section">
      <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body" style="flex-direction:column;align-items:stretch;gap:0;">
        <!-- 1행: 비교 유형 + 비교 대상 -->
        <div style="display:flex;gap:20px;align-items:flex-start;padding-bottom:12px;">
          <div style="flex-shrink:0;">
            <label class="form-label">비교 유형</label>
            <div class="seg-ctrl">
              <button class="seg-btn active" onclick="setCompareType('center')">센터 비교</button>
              <button class="seg-btn" onclick="setCompareType('team')">팀 비교</button>
            </div>
          </div>
          <div style="flex:1;min-width:0;">
            <label class="form-label">비교 대상 <span style="font-size:11px;color:#9E9E9E;">(2~3개 선택)</span></label>
            <div class="target-selector" id="target-selector"></div>
          </div>
        </div>
        <!-- 2행: 표시 항목 -->
        <div style="border-top:1px solid #F0F0F0;padding-top:12px;">
          <label class="form-label">표시 항목</label>
          <div class="toggle-row" id="widget-toggles"></div>
        </div>
      </div>
    </div>

    <!-- 비교 결과 영역 -->
    <div id="compare-result"></div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/period-picker.js"></script>
  <script>
    /* ========== 더미 데이터 ========== */
    const CENTERS = [
      { id:'ct-1', name:'서울센터', color:'#00A3FF' },
      { id:'ct-2', name:'부산센터', color:'#FF9800' },
      { id:'ct-3', name:'대구센터', color:'#9C27B0' }
    ];
    const TEAMS = [
      { id:'tm-1', name:'VIP상담팀', centerId:'ct-1', center:'서울센터', color:'#1976D2' },
      { id:'tm-2', name:'일반상담팀', centerId:'ct-1', center:'서울센터', color:'#E65100' },
      { id:'tm-3', name:'기술지원팀', centerId:'ct-1', center:'서울센터', color:'#7B1FA2' },
      { id:'tm-4', name:'아웃바운드팀', centerId:'ct-1', center:'서울센터', color:'#2E7D32' },
      { id:'tm-5', name:'고객상담1팀', centerId:'ct-2', center:'부산센터', color:'#D32F2F' },
      { id:'tm-6', name:'고객상담2팀', centerId:'ct-2', center:'부산센터', color:'#00838F' },
      { id:'tm-7', name:'영업지원팀', centerId:'ct-2', center:'부산센터', color:'#6D4C41' },
      { id:'tm-8', name:'종합상담팀', centerId:'ct-3', center:'대구센터', color:'#455A64' },
      { id:'tm-9', name:'클레임처리팀', centerId:'ct-3', center:'대구센터', color:'#C2185B' },
      { id:'tm-10', name:'신규고객팀', centerId:'ct-3', center:'대구센터', color:'#F9A825' }
    ];

    const EVAL_ITEMS = ['인사 멘트','고객 확인','경청/공감','문제 파악','해결 제시','정확성','종결 멘트'];

    const AGENT_NAMES = ['김민수','이영희','박지훈','최수진','정민호','한소영','윤재호','송미라','조현우','강서연','임도현','배수빈'];
    const DEDUCTION_REASONS = ['공감 부족','인사 누락','해결 미제시','확인 절차 생략','종결 멘트 누락','정보 오안내','고객 확인 미흡','경청 부족','안내 지연','감정 표현 부족'];

    // 센터/팀 단위 더미 통계 생성
    function genStats(id, base) {
      const currentAvg = base + (Math.random()*4 - 1);
      const prevAvg = base + (Math.random()*4 - 2);
      const totalCalls = Math.floor(800 + Math.random()*600);
      const totalEvals = Math.floor(totalCalls * (0.92 + Math.random()*0.06));
      const failCount = Math.floor(totalEvals * (0.005 + Math.random()*0.02));
      const underCount = Math.floor(totalEvals * (0.01 + Math.random()*0.03));
      const scores = [];
      for(let i=0;i<30;i++) scores.push(base + Math.random()*8 - 3 + i/30*2);
      const maxS = Math.max(...scores);
      const minS = Math.min(...scores);
      const mean = scores.reduce((a,b)=>a+b,0)/scores.length;
      const std = Math.sqrt(scores.reduce((a,b)=>a+(b-mean)**2,0)/scores.length);
      const half = Math.floor(scores.length/2);
      const firstAvg = scores.slice(0,half).reduce((a,b)=>a+b,0)/half;
      const secondAvg = scores.slice(half).reduce((a,b)=>a+b,0)/(scores.length-half);
      const trend = secondAvg > firstAvg+0.5 ? 'up' : secondAvg < firstAvg-0.5 ? 'down' : 'stable';
      const excellent = Math.floor(totalEvals*(0.2+Math.random()*0.2));
      const good = Math.floor(totalEvals*(0.3+Math.random()*0.15));
      const caution = Math.floor(totalEvals*(0.1+Math.random()*0.15));
      const low = totalEvals - excellent - good - caution;
      const items = {};
      EVAL_ITEMS.forEach(item => { items[item] = +(base - 5 + Math.random()*15).toFixed(1); });

      // 유형별 상담/평가 건수
      const ibCalls = Math.floor(totalCalls * (0.5 + Math.random()*0.2));
      const obCalls = Math.floor(totalCalls * (0.15 + Math.random()*0.1));
      const manualCalls = totalCalls - ibCalls - obCalls;
      const ibEvals = Math.floor(ibCalls * (0.92 + Math.random()*0.06));
      const obEvals = Math.floor(obCalls * (0.90 + Math.random()*0.08));
      const manualEvals = totalEvals - ibEvals - obEvals;

      // 유형별 평균 점수
      const ibScore = +(base + Math.random()*4 - 1).toFixed(1);
      const obScore = +(base - 2 + Math.random()*4).toFixed(1);
      const manualScore = +(base + 1 + Math.random()*3).toFixed(1);

      // 상담사 평균 상담 시간 (초 단위)
      const avgCallTimeSec = Math.floor(240 + Math.random()*300);

      // 최다 감점 항목 Top5
      const shuffledItems = [...EVAL_ITEMS].sort(()=>Math.random()-0.5);
      const topDeductions = shuffledItems.slice(0,5).map((item,idx) => ({
        rank: idx+1, item, count: Math.floor(30 + Math.random()*70), avgDeduction: +(1 + Math.random()*4).toFixed(1)
      })).sort((a,b)=>b.count-a.count).map((d,i)=>({...d, rank:i+1}));

      // 최다 감점 콜 Top5
      const shuffledAgents = [...AGENT_NAMES].sort(()=>Math.random()-0.5);
      const shuffledReasons = [...DEDUCTION_REASONS].sort(()=>Math.random()-0.5);
      const topDeductionCalls = shuffledAgents.slice(0,5).map((name,idx) => ({
        rank: idx+1, agent: name, score: +(40 + Math.random()*25).toFixed(1), reason: shuffledReasons[idx]
      })).sort((a,b)=>a.score-b.score).map((d,i)=>({...d, rank:i+1}));

      return {
        id, currentAvg:+currentAvg.toFixed(1), prevAvg:+prevAvg.toFixed(1),
        totalCalls, totalEvals, evalRate:+(totalEvals/totalCalls*100).toFixed(1),
        failCount, failRate:+(failCount/totalEvals*100).toFixed(1),
        underCount, underRate:+(underCount/totalEvals*100).toFixed(1),
        maxScore:+maxS.toFixed(1), minScore:+minS.toFixed(1),
        deviation:+(maxS-minS).toFixed(1), stdDev:+std.toFixed(1), trend,
        distribution:{ excellent, good, caution, low },
        itemScores: items, trendData: scores.map((s,i)=>({ day:i+1, score:+s.toFixed(1) })),
        byType: {
          ib: { calls: ibCalls, evals: ibEvals, avgScore: ibScore },
          ob: { calls: obCalls, evals: obEvals, avgScore: obScore },
          manual: { calls: manualCalls, evals: Math.max(0, manualEvals), avgScore: manualScore }
        },
        avgCallTimeSec, topDeductions, topDeductionCalls
      };
    }

    const CENTER_BASES = { 'ct-1':84, 'ct-2':80, 'ct-3':77 };
    const TEAM_BASES = { 'tm-1':86,'tm-2':79,'tm-3':82,'tm-4':77,'tm-5':80,'tm-6':76,'tm-7':80,'tm-8':77,'tm-9':73,'tm-10':76 };

    let centerStats = {};
    let teamStats = {};
    function regenerateStats() {
      CENTERS.forEach(c => { centerStats[c.id] = genStats(c.id, CENTER_BASES[c.id]); });
      TEAMS.forEach(t => { teamStats[t.id] = genStats(t.id, TEAM_BASES[t.id]); });
    }

    /* ========== 상태 ========== */
    let compareType = 'center';
    let selectedTargets = ['ct-1','ct-2'];
    let currentPeriod = 30;
    const WIDGETS = [
      { id:'trend', label:'품질 점수 추이' },
      { id:'avgScore', label:'평균 QA 점수' },
      { id:'evalCount', label:'상담 / 평가 건수' },
      { id:'issueRate', label:'이슈 발생률' },
      { id:'trendDev', label:'추세 및 편차' },
      { id:'avgCallTime', label:'상담사 평균 상담 시간' },
      { id:'distRadar', label:'점수 분포 / 종합 성과' },
      { id:'topDeduction', label:'최다 감점 항목 Top 5' },
      { id:'topDeductionCall', label:'최다 감점 콜 Top 5' }
    ];
    let visibleWidgets = new Set(WIDGETS.map(w=>w.id));
    let trendChart = null;
    let radarCharts = [];

    /* ========== 초기화 ========== */
    document.addEventListener('DOMContentLoaded', () => {
      regenerateStats();
      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod:'monthly',
        onChange(pt, info) {
          const map = { daily:1, weekly:7, monthly:30, yearly:365 };
          currentPeriod = pt==='custom' && info.from && info.to
            ? Math.max(1, Math.ceil((new Date(info.to)-new Date(info.from))/864e5))
            : (map[pt]||30);
          regenerateStats();
          renderAll();
        }
      });
      renderTargetSelector();
      renderWidgetToggles();
      renderAll();
    });

    /* ========== 비교 유형 전환 ========== */
    function setCompareType(type) {
      compareType = type;
      document.querySelectorAll('.seg-btn').forEach((b,i) => {
        b.classList.toggle('active', (i===0 && type==='center') || (i===1 && type==='team'));
      });
      selectedTargets = type==='center' ? ['ct-1','ct-2'] : ['tm-1','tm-5'];
      renderTargetSelector();
      renderAll();
    }

    /* ========== 대상 선택 UI ========== */
    function renderTargetSelector() {
      const el = document.getElementById('target-selector');
      el.style.flexDirection = '';
      el.style.gap = '';
      if (compareType === 'center') {
        el.innerHTML = CENTERS.map(item => {
          const sel = selectedTargets.includes(item.id);
          const maxed = !sel && selectedTargets.length >= 3;
          const clickAttr = maxed ? '' : 'onclick="toggleTarget(\'' + item.id + '\')"';
          return '<div class="target-chip ' + (sel?'selected':'') + ' ' + (maxed?'disabled':'') + '" ' + clickAttr + '>'
            + '<span style="width:8px;height:8px;border-radius:50%;background:' + item.color + ';display:inline-block;margin-right:4px;vertical-align:middle;"></span>' + item.name
            + '</div>';
        }).join('');
      } else {
        const grouped = {};
        CENTERS.forEach(c => { grouped[c.id] = { name: c.name, teams: [] }; });
        TEAMS.forEach(t => { grouped[t.centerId].teams.push(t); });
        el.innerHTML = Object.values(grouped).map(g => {
          const chips = g.teams.map(item => {
            const sel = selectedTargets.includes(item.id);
            const maxed = !sel && selectedTargets.length >= 3;
            const clickAttr = maxed ? '' : 'onclick="toggleTarget(\'' + item.id + '\')"';
            return '<div class="target-chip ' + (sel?'selected':'') + ' ' + (maxed?'disabled':'') + '" ' + clickAttr + '>'
              + '<span style="width:8px;height:8px;border-radius:50%;background:' + item.color + ';display:inline-block;margin-right:4px;vertical-align:middle;"></span>' + item.name
              + '</div>';
          }).join('');
          return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">'
            + '<span style="font-size:11px;color:#9E9E9E;min-width:56px;">' + g.name + '</span>' + chips + '</div>';
        }).join('');
        el.style.flexDirection = 'column';
        el.style.gap = '6px';
      }
    }

    function toggleTarget(id) {
      if (selectedTargets.includes(id)) {
        if (selectedTargets.length <= 2) { AICC_Toast.show('최소 2개를 선택해야 합니다.'); return; }
        selectedTargets = selectedTargets.filter(t=>t!==id);
      } else {
        if (selectedTargets.length >= 3) return;
        selectedTargets.push(id);
      }
      renderTargetSelector();
      renderAll();
    }

    /* ========== 표시 항목 토글 ========== */
    function renderWidgetToggles() {
      document.getElementById('widget-toggles').innerHTML = WIDGETS.map(w =>
        `<label class="toggle-chip"><input type="checkbox" ${visibleWidgets.has(w.id)?'checked':''} onchange="toggleWidget('${w.id}',this.checked)">${w.label}</label>`
      ).join('');
    }
    function toggleWidget(id, checked) {
      checked ? visibleWidgets.add(id) : visibleWidgets.delete(id);
      renderAll();
    }

    /* ========== 메인 렌더링 ========== */
    function renderAll() {
      const container = document.getElementById('compare-result');
      const stats = selectedTargets.map(id => compareType==='center' ? centerStats[id] : teamStats[id]);
      const items = selectedTargets.map(id => compareType==='center' ? CENTERS.find(c=>c.id===id) : TEAMS.find(t=>t.id===id));
      const cols = selectedTargets.length;
      const colClass = cols===3 ? 'cols-3' : 'cols-2';

      let html = '';

      // 1. 품질 점수 추이 (full width)
      if (visibleWidgets.has('trend')) {
        html += `<div class="content-card" style="margin-bottom:16px;">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">품질 점수 추이</span></div>
          <div class="content-card-body" style="height:320px;"><canvas id="trend-canvas"></canvas></div>
        </div>`;
      }

      // 사이드 바이 사이드 영역 (컬럼별 카드)
      const sideWidgetIds = ['avgScore','evalCount','issueRate','trendDev','avgCallTime','distRadar','topDeduction','topDeductionCall'];
      const sideWidgets = sideWidgetIds.filter(w=>visibleWidgets.has(w));
      if (sideWidgets.length > 0) {
        const colHtmls = items.map(()=>[]);
        const widgetRenderers = {
          avgScore: renderAvgScore, evalCount: renderEvalCount,
          issueRate: renderIssueRate, distRadar: renderDistRadar,
          trendDev: renderTrendDev, avgCallTime: renderAvgCallTime,
          topDeduction: renderTopDeduction, topDeductionCall: renderTopDeductionCall
        };
        sideWidgets.forEach(wid => {
          const ws = widgetRenderers[wid](stats, items);
          ws.forEach((h,i)=>colHtmls[i].push(h));
        });

        html += `<div class="compare-columns ${colClass}">`;
        items.forEach((item,i) => {
          const isBestOverall = stats[i].currentAvg === Math.max(...stats.map(s=>s.currentAvg));
          html += `<div class="compare-col">`;
          html += `<div class="col-header ${isBestOverall?'best':''}">${getName(item)}</div>`;
          html += colHtmls[i].join('');
          html += `</div>`;
        });
        html += `</div>`;
      }

      container.innerHTML = html;

      // 차트 렌더링
      if (visibleWidgets.has('trend')) renderTrendChart(stats, items);
      if (visibleWidgets.has('distRadar')) { renderDonutCharts(stats, items); renderRadarCharts(stats, items); }
    }

    function getName(item) {
      if (item.center && item.name) return `${item.center} · ${item.name}`;
      return item.name;
    }

    /* ========== 드릴다운 네비게이션 헬퍼 ========== */
    /*
     * goToEval(item, extraParams)
     * - 비교 분석 위젯에서 통합 평가 현황(integrated-evaluation.html)으로 이동하는 공통 함수
     * - compareType에 따라 center 또는 team 파라미터를 자동 생성
     * - extraParams로 추가 필터(issue, score_range, deduction, date 등)를 전달
     */
    function goToEval(item, extraParams) {
      const base = compareType === 'center'
        ? `center=${encodeURIComponent(item.name)}`
        : `team=${encodeURIComponent(item.name)}`;
      window.location.href = `integrated-evaluation.html?${base}${extraParams ? '&' + extraParams : ''}`;
    }

    /* ========== 위젯 렌더링 함수들 ========== */

    // 최고값 대비 차이 표시 헬퍼 (higherIsBetter=true: 높을수록 좋음)
    function bestDiff(values, idx, higherIsBetter=true) {
      const best = higherIsBetter ? Math.max(...values) : Math.min(...values);
      const val = values[idx];
      const isBest = Math.abs(val - best) < 0.01;
      if (isBest) return { isBest:true, html:'<span class="diff-cell"></span>' };
      const diff = Math.abs(val - best);
      return { isBest:false, html:`<span class="diff-cell"><span class="diff-badge">▼ ${diff.toFixed(1)}</span></span>` };
    }

    function bestDiffInt(values, idx, higherIsBetter=true) {
      const best = higherIsBetter ? Math.max(...values) : Math.min(...values);
      const val = values[idx];
      const isBest = val === best;
      if (isBest) return { isBest:true, html:'<span class="diff-cell"></span>' };
      const diff = Math.abs(val - best);
      return { isBest:false, html:`<span class="diff-cell"><span class="diff-badge">▼ ${diff.toLocaleString()}</span></span>` };
    }

    function bestDiffPct(values, idx, higherIsBetter=true) {
      const best = higherIsBetter ? Math.max(...values) : Math.min(...values);
      const val = values[idx];
      const isBest = Math.abs(val - best) < 0.01;
      if (isBest) return { isBest:true, html:'<span class="diff-cell"></span>' };
      const diff = Math.abs(val - best);
      return { isBest:false, html:`<span class="diff-cell"><span class="diff-badge">▼ ${diff.toFixed(1)}%p</span></span>` };
    }

    // 2. 평균 QA 점수 + 유형별 평가 점수
    function renderAvgScore(stats, items) {
      const avgs = stats.map(s=>s.currentAvg);
      const ibScores = stats.map(s=>s.byType.ib.avgScore);
      const obScores = stats.map(s=>s.byType.ob.avgScore);
      const manScores = stats.map(s=>s.byType.manual.avgScore);
      return stats.map((s,i) => {
        const bd = bestDiff(avgs, i);
        const change = s.currentAvg - s.prevAvg;
        const changeClass = change>0.1?'up':change<-0.1?'down':'stable';
        const changeSign = change>0?'+':'';
        const bdIb = bestDiff(ibScores, i);
        const bdOb = bestDiff(obScores, i);
        const bdMan = bestDiff(manScores, i);
        return `<div class="col-widget">
          <div class="widget-label">평균 QA 점수</div>
          <div style="display:flex;gap:16px;">
            <div style="flex:1;">
              <div style="display:flex;align-items:baseline;gap:8px;">
                <span class="big-score ${bd.isBest?'best':''}">${s.currentAvg}</span>
                <span style="font-size:14px;color:#757575;">점</span>
                ${bd.html}
              </div>
              <div class="prev-change ${changeClass}">전기간 대비 ${changeSign}${change.toFixed(1)}점</div>
            </div>
            <div style="flex:1;border-left:1px solid #F0F0F0;padding-left:16px;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:6px;">유형별 점수</div>
              <div class="stat-row"><span class="stat-label">자동 I/B</span><span class="stat-val ${bdIb.isBest?'best':''}">${s.byType.ib.avgScore}점</span>${bdIb.html}</div>
              <div class="stat-row"><span class="stat-label">자동 O/B</span><span class="stat-val ${bdOb.isBest?'best':''}">${s.byType.ob.avgScore}점</span>${bdOb.html}</div>
              <div class="stat-row"><span class="stat-label">수동</span><span class="stat-val ${bdMan.isBest?'best':''}">${s.byType.manual.avgScore}점</span>${bdMan.html}</div>
            </div>
          </div>
        </div>`;
      });
    }

    // 3. 상담/평가 건수 (좌: 총합, 우: 유형별)
    function renderEvalCount(stats, items) {
      const calls = stats.map(s=>s.totalCalls);
      const evals = stats.map(s=>s.totalEvals);
      const rates = stats.map(s=>s.evalRate);
      const ibCalls = stats.map(s=>s.byType.ib.calls);
      const obCalls = stats.map(s=>s.byType.ob.calls);
      const manCalls = stats.map(s=>s.byType.manual.calls);
      return stats.map((s,i) => {
        const bdC = bestDiffInt(calls, i);
        const bdE = bestDiffInt(evals, i);
        const bdR = bestDiff(rates, i);
        const bdIb = bestDiffInt(ibCalls, i);
        const bdOb = bestDiffInt(obCalls, i);
        const bdMan = bestDiffInt(manCalls, i);
        const ibPct = (s.byType.ib.calls/s.totalCalls*100).toFixed(1);
        const obPct = (s.byType.ob.calls/s.totalCalls*100).toFixed(1);
        const manPct = (s.byType.manual.calls/s.totalCalls*100).toFixed(1);
        return `<div class="col-widget">
          <div class="widget-label">상담 / 평가 건수</div>
          <div style="display:flex;gap:16px;">
            <div style="flex:1;">
              <div style="display:flex;align-items:baseline;gap:8px;">
                <span class="big-score ${bdE.isBest?'best':''}">${s.totalEvals.toLocaleString()}</span>
                <span style="font-size:14px;color:#757575;">건</span>
                ${bdE.html}
              </div>
              <div style="font-size:12px;color:#9E9E9E;margin-top:4px;">총 상담 ${s.totalCalls.toLocaleString()}건 · 평가율 ${s.evalRate}%</div>
            </div>
            <div style="flex:1;border-left:1px solid #F0F0F0;padding-left:16px;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:6px;">유형별 내역</div>
              <div class="stat-row"><span class="stat-label">자동 I/B</span><span class="stat-val ${bdIb.isBest?'best':''}">${s.byType.ib.calls.toLocaleString()}건 (${ibPct}%)</span>${bdIb.html}</div>
              <div class="stat-row"><span class="stat-label">자동 O/B</span><span class="stat-val ${bdOb.isBest?'best':''}">${s.byType.ob.calls.toLocaleString()}건 (${obPct}%)</span>${bdOb.html}</div>
              <div class="stat-row"><span class="stat-label">수동</span><span class="stat-val ${bdMan.isBest?'best':''}">${s.byType.manual.calls.toLocaleString()}건 (${manPct}%)</span>${bdMan.html}</div>
            </div>
          </div>
          <div class="stacked-bar" style="height:10px;margin-top:8px;">
            <div style="width:${ibPct}%;background:#2196F3;" title="자동 I/B ${ibPct}%"></div>
            <div style="width:${obPct}%;background:#FF9800;" title="자동 O/B ${obPct}%"></div>
            <div style="width:${manPct}%;background:#9C27B0;" title="수동 ${manPct}%"></div>
          </div>
          <div class="dist-legend" style="margin-top:4px;">
            <span><span class="dist-dot" style="background:#2196F3;"></span>자동 I/B</span>
            <span><span class="dist-dot" style="background:#FF9800;"></span>자동 O/B</span>
            <span><span class="dist-dot" style="background:#9C27B0;"></span>수동</span>
          </div>
        </div>`;
      });
    }

    /*
     * 이슈 발생률 드릴다운
     * - FAIL(금지어) 행 클릭 → integrated-evaluation.html?issue=fail + 센터/팀 필터
     * - 기준 미달 행 클릭 → integrated-evaluation.html?issue=under + 센터/팀 필터
     */
    function renderIssueRate(stats, items) {
      const failRates = stats.map(s=>s.failRate);
      const underRates = stats.map(s=>s.underRate);
      return stats.map((s,i) => {
        const bdF = bestDiffPct(failRates, i, false);
        const bdU = bestDiffPct(underRates, i, false);
        const normalPct = 100 - s.failRate - s.underRate;
        const itemJson = JSON.stringify({name:items[i].name}).replace(/"/g,'&quot;');
        return `<div class="col-widget">
          <div class="widget-label">이슈 발생률</div>
          <div class="stat-row clickable" onclick="goToEval(${itemJson},'issue=fail')"><span class="stat-label">FAIL(금지어)</span><span class="stat-val ${bdF.isBest?'best':''}">${s.failCount}건 (${s.failRate}%)</span>${bdF.html}</div>
          <div class="stat-row clickable" onclick="goToEval(${itemJson},'issue=under')"><span class="stat-label">기준 미달</span><span class="stat-val ${bdU.isBest?'best':''}">${s.underCount}건 (${s.underRate}%)</span>${bdU.html}</div>
          <div class="stacked-bar">
            <div style="width:${normalPct}%;background:#4CAF50;" title="정상 ${normalPct.toFixed(1)}%"></div>
            <div style="width:${s.failRate}%;background:#F44336;" title="FAIL ${s.failRate}%"></div>
            <div style="width:${s.underRate}%;background:#FF9800;" title="기준 미달 ${s.underRate}%"></div>
          </div>
          <div class="dist-legend">
            <span><span class="dist-dot" style="background:#4CAF50;"></span>정상 ${normalPct.toFixed(1)}%</span>
            <span><span class="dist-dot" style="background:#F44336;"></span>FAIL ${s.failRate}%</span>
            <span><span class="dist-dot" style="background:#FF9800;"></span>기준 미달 ${s.underRate}%</span>
          </div>
        </div>`;
      });
    }

    // 5. 점수 분포(도넛) + 종합 성과(레이더) - 5:5 배치
    const PERF_LABELS = ['QA 점수','평가 완료율','정상 비율','우수 비율','상담 효율'];

    function renderDistRadar(stats, items) {
      return stats.map((s,i) => {
        const total = s.totalEvals;
        const d = s.distribution;
        return `<div class="col-widget">
          <div style="display:flex;gap:12px;">
            <div style="flex:1;min-width:0;">
              <div class="widget-label">점수 분포</div>
              <div style="height:150px;position:relative;"><canvas id="donut-${i}"></canvas></div>
              <div class="dist-legend" style="margin-top:6px;justify-content:center;">
                <span><span class="dist-dot" style="background:#1565C0;"></span>우수 ${d.excellent}건</span>
                <span><span class="dist-dot" style="background:#4CAF50;"></span>양호 ${d.good}건</span>
                <span><span class="dist-dot" style="background:#FF9800;"></span>주의 ${d.caution}건</span>
                <span><span class="dist-dot" style="background:#F44336;"></span>미달 ${d.low}건</span>
              </div>
            </div>
            <div style="flex:1;min-width:0;">
              <div class="widget-label">종합 성과</div>
              <div style="height:190px;position:relative;"><canvas id="radar-${i}"></canvas></div>
            </div>
          </div>
        </div>`;
      });
    }

    // 7. 추세 및 편차
    function renderTrendDev(stats, items) {
      const maxScores = stats.map(s=>s.maxScore);
      const minScores = stats.map(s=>s.minScore);
      const devs = stats.map(s=>s.deviation);
      const stds = stats.map(s=>s.stdDev);
      return stats.map((s,i) => {
        const bdMax = bestDiff(maxScores, i);
        const bdMin = bestDiff(minScores, i);
        const bdDev = bestDiff(devs, i, false);
        const bdStd = bestDiff(stds, i, false);
        return `<div class="col-widget">
          <div class="widget-label">추세 및 편차</div>
          <div class="stat-row"><span class="stat-label">최고점</span><span class="stat-val ${bdMax.isBest?'best':''}">${s.maxScore}점</span>${bdMax.html}</div>
          <div class="stat-row"><span class="stat-label">최저점</span><span class="stat-val ${bdMin.isBest?'best':''}">${s.minScore}점</span>${bdMin.html}</div>
          <div class="stat-row"><span class="stat-label">편차</span><span class="stat-val ${bdDev.isBest?'best':''}">${s.deviation}</span>${bdDev.html}</div>
          <div class="stat-row"><span class="stat-label">표준편차</span><span class="stat-val ${bdStd.isBest?'best':''}">${s.stdDev}</span>${bdStd.html}</div>
          <div style="position:relative;height:12px;background:#F5F5F5;border-radius:6px;margin-top:8px;">
            <div style="position:absolute;left:${(s.minScore-60)/40*100}%;right:${(100-s.maxScore+60)/40*100}%;top:2px;height:8px;background:${items[i].color}30;border-radius:4px;"></div>
            <div style="position:absolute;left:${(s.currentAvg-60)/40*100}%;top:0;width:3px;height:12px;background:${items[i].color};border-radius:2px;transform:translateX(-1px);"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:#9E9E9E;margin-top:2px;"><span>60</span><span>100</span></div>
        </div>`;
      });
    }

    // 8. 상담사 평균 상담 시간
    function renderAvgCallTime(stats, items) {
      const times = stats.map(s=>s.avgCallTimeSec);
      return stats.map((s,i) => {
        const bdT = bestDiffInt(times, i, false);
        const min = Math.floor(s.avgCallTimeSec / 60);
        const sec = s.avgCallTimeSec % 60;
        return `<div class="col-widget">
          <div class="widget-label">상담사 평균 상담 시간</div>
          <div style="display:flex;align-items:baseline;gap:8px;">
            <span class="big-score ${bdT.isBest?'best':''}">${min}분 ${sec}초</span>
            ${bdT.html}
          </div>
          <div style="background:#F0F0F0;border-radius:4px;height:6px;margin-top:8px;">
            <div style="width:${Math.min(s.avgCallTimeSec/600*100,100)}%;background:${bdT.isBest?'#00A3FF':'#BDBDBD'};height:100%;border-radius:4px;transition:width .3s;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:#9E9E9E;margin-top:2px;"><span>0분</span><span>10분</span></div>
        </div>`;
      });
    }

    /*
     * 최다 감점 항목 Top 5 드릴다운
     * - 감점 항목 행 클릭 → integrated-evaluation.html로 이동
     * - 전달 파라미터: deduction(감점 항목명) + 센터/팀 필터
     */
    function renderTopDeduction(stats, items) {
      return stats.map((s,i) => {
        const itemJson = JSON.stringify({name:items[i].name}).replace(/"/g,'&quot;');
        const rows = s.topDeductions.map(d =>
          `<div class="stat-row clickable" style="padding:3px 0;" onclick="goToEval(${itemJson},'deduction=${encodeURIComponent(d.item)}')">
            <span class="stat-label" style="display:flex;align-items:center;gap:6px;">
              <span style="width:16px;height:16px;border-radius:50%;background:#F5F5F5;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#757575;">${d.rank}</span>
              ${d.item}
            </span>
            <span class="stat-val" style="grid-column:2/-1;">${d.count}건 <span style="color:#F44336;font-size:11px;">(-${d.avgDeduction}점)</span></span>
          </div>`
        ).join('');
        return `<div class="col-widget">
          <div class="widget-label">최다 감점 항목 Top 5</div>
          ${rows}
        </div>`;
      });
    }

    /*
     * 최다 감점 콜 Top 5 드릴다운
     * - 감점 콜 행 클릭 → integrated-evaluation.html로 이동
     * - 전달 파라미터: score_range=low + 센터/팀 필터 (저점수 평가 목록 조회)
     */
    function renderTopDeductionCall(stats, items) {
      return stats.map((s,i) => {
        const itemJson = JSON.stringify({name:items[i].name}).replace(/"/g,'&quot;');
        const rows = s.topDeductionCalls.map(d =>
          `<div class="stat-row clickable" style="padding:3px 0;" onclick="goToEval(${itemJson},'score_range=low')">
            <span class="stat-label" style="display:flex;align-items:center;gap:6px;">
              <span style="width:16px;height:16px;border-radius:50%;background:#F5F5F5;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#757575;">${d.rank}</span>
              ${d.agent}
            </span>
            <span class="stat-val" style="grid-column:2/-1;">${d.score}점 <span style="color:#9E9E9E;font-size:11px;">(${d.reason})</span></span>
          </div>`
        ).join('');
        return `<div class="col-widget">
          <div class="widget-label">최다 감점 콜 Top 5</div>
          ${rows}
        </div>`;
      });
    }

    /* ========== 차트 렌더링 ========== */
    /*
     * 품질 점수 추이 드릴다운
     * - 차트 데이터 포인트 클릭 → integrated-evaluation.html로 이동
     * - 전달 파라미터: date(클릭한 날짜) + center 또는 team(해당 라인의 센터/팀)
     */
    function renderTrendChart(stats, items) {
      const ctx = document.getElementById('trend-canvas');
      if (!ctx) return;
      if (trendChart) trendChart.destroy();
      const labels = stats[0].trendData.map(d => `Day ${d.day}`);
      const datasets = stats.map((s,i) => ({
        label: getName(items[i]),
        data: s.trendData.map(d=>d.score),
        borderColor: items[i].color,
        backgroundColor: items[i].color+'20',
        borderWidth: 2, fill:false, tension:0.3,
        pointRadius: currentPeriod<=14?4:currentPeriod<=30?2:0,
        pointHoverRadius: 5
      }));
      trendChart = new Chart(ctx, {
        type:'line', data:{ labels, datasets },
        options:{
          responsive:true, maintainAspectRatio:false,
          interaction:{ mode:'index', intersect:false },
          onClick: (evt, elements) => {
            if (elements.length > 0) {
              const dsIdx = elements[0].datasetIndex;
              const ptIdx = elements[0].index;
              const date = labels[ptIdx];
              goToEval(items[dsIdx], `date=${encodeURIComponent(date)}`);
            }
          },
          onHover: (evt, elements) => {
            evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
          },
          plugins:{
            legend:{ position:'top', labels:{ usePointStyle:true, pointStyle:'circle', padding:20, font:{size:12} }},
            tooltip:{ backgroundColor:'rgba(0,0,0,0.8)', padding:12, callbacks:{ label:c=>`${c.dataset.label}: ${c.parsed.y.toFixed(1)}점` }}
          },
          scales:{
            y:{ min:60, max:100, grid:{color:'#F0F0F0'}, ticks:{ font:{size:11}, color:'#757575', callback:v=>v+'점' }},
            x:{ grid:{display:false}, ticks:{ font:{size:11}, color:'#757575', maxTicksLimit:15, maxRotation:0 }}
          }
        }
      });
    }

    let donutCharts = [];

    /*
     * 점수 분포 도넛 차트 드릴다운
     * - 세그먼트(우수/양호/주의/미달) 클릭 → integrated-evaluation.html로 이동
     * - 전달 파라미터: score_range(excellent|good|caution|low) + 센터/팀 필터
     */
    const SCORE_RANGE_KEYS = ['excellent','good','caution','low'];

    function renderDonutCharts(stats, items) {
      donutCharts.forEach(c=>c.destroy());
      donutCharts = [];
      stats.forEach((s,i) => {
        const ctx = document.getElementById(`donut-${i}`);
        if (!ctx) return;
        const d = s.distribution;
        const chart = new Chart(ctx, {
          type:'doughnut',
          data:{
            labels:['우수','양호','주의','미달'],
            datasets:[{ data:[d.excellent, d.good, d.caution, d.low],
              backgroundColor:['#1565C0','#4CAF50','#FF9800','#F44336'], borderWidth:0 }]
          },
          options:{
            responsive:true, maintainAspectRatio:false, cutout:'60%',
            onClick: (evt, elements) => {
              if (elements.length > 0) {
                const idx = elements[0].index;
                goToEval(items[i], `score_range=${SCORE_RANGE_KEYS[idx]}`);
              }
            },
            onHover: (evt, elements) => {
              evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
            },
            plugins:{
              legend:{ display:false },
              tooltip:{ callbacks:{ label:c => `${c.label}: ${c.parsed}건 (${(c.parsed/s.totalEvals*100).toFixed(1)}%)` }}
            }
          }
        });
        donutCharts.push(chart);
      });
    }

    function renderRadarCharts(stats, items) {
      radarCharts.forEach(c=>c.destroy());
      radarCharts = [];
      /*
       * 종합 성과 레이더 차트 - 5개 축 데이터 출처
       * ──────────────────────────────────────────
       * 1. QA 점수      : currentAvg (평균 QA 점수, 0~100)
       * 2. 평가 완료율  : evalRate (총 상담 건수 대비 평가 완료 비율, 0~100%)
       * 3. 정상 비율    : 100 - failRate - underRate (FAIL·기준 미달 제외 정상 평가 비율, 0~100%)
       * 4. 우수 비율    : excellent / totalEvals * 100 (우수 등급 비율, 0~100%)
       * 5. 상담 효율    : 평균 상담 시간 기반 선형 환산 (3분=100, 10분=0, 짧을수록 높음)
       */
      stats.forEach((s,i) => {
        const ctx = document.getElementById(`radar-${i}`);
        if (!ctx) return;
        const normalRate = 100 - s.failRate - s.underRate;
        const excellentRate = s.distribution.excellent / s.totalEvals * 100;
        const callEfficiency = Math.max(0, Math.min(100, (1 - (s.avgCallTimeSec - 180) / 420) * 100));
        const perfData = [ s.currentAvg, s.evalRate, normalRate, excellentRate, callEfficiency ];
        const chart = new Chart(ctx, {
          type:'radar',
          data:{
            labels: PERF_LABELS,
            datasets:[{
              label: getName(items[i]),
              data: perfData,
              borderColor: items[i].color,
              backgroundColor: items[i].color+'30',
              borderWidth:2, pointRadius:3, pointBackgroundColor:items[i].color
            }]
          },
          options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ display:false } },
            scales:{
              r:{ min:0, max:100, ticks:{ stepSize:25, font:{size:8}, backdropColor:'transparent' },
                pointLabels:{ font:{size:9} }, grid:{color:'#E0E0E0'} }
            }
          }
        });
        radarCharts.push(chart);
      });
    }
  </script>
</body>
</html>
