                { id: 'AE-2025-01343', date: '2025-03-10', time: '11:30', duration: '06:40', score: 72, type: 'AI', confidence: 'High', issue: null },
                { id: 'AE-2025-01344', date: '2025-03-07', time: '09:10', duration: '06:20', score: 69, type: 'NLP', confidence: 'Medium', issue: null },
                { id: 'AE-2025-01350', date: '2025-03-01', time: '13:40', duration: '07:30', score: 56, type: 'AI', confidence: 'Medium', issue: '기준 미달 - 필수항목 미이행' },
                ]
                }
                ]
            }
          ]
        }
      ]
    };

    /* ========== 상태 관리 ========== */
    let currentLevel = 0; // 0=전체, 1=센터, 2=팀, 3=상담사
    let navStack = []; // [{level, label, data}]
    let activeFilter = null;

    const FILTER_LABELS = {
      urgentIssue: '긴급 이슈',
      topDeduction: '최다 감점 항목',
      lowScore: '70점 이하 콜',
      excluded: '평가 제외 상담사'
    };

    function filterByCard(filterKey) {
      if (currentLevel !== 2 && currentLevel !== 3) return;
      const ctx = navStack[navStack.length - 1]?.data;
      if (!ctx) return;

      if (currentLevel === 2) {
        const { ws, team } = ctx;
        const agents = team.agents;
        if (activeFilter === filterKey) {
          activeFilter = null;
          renderLevel2Table(ws, team, agents);
          updateCardHighlight(null);
          return;
        }
        activeFilter = filterKey;
        let filtered;
        switch (filterKey) {
          case 'urgentIssue': filtered = agents.filter(a => a.urgentIssue); break;
          case 'topDeduction': filtered = agents.filter(a => a.topDeductionItem === team.topDeduction.item); break;
          case 'lowScore': filtered = agents.filter(a => a.evaluations?.some(e => e.score <= 70)); break;
          case 'excluded': filtered = agents.filter(a => a.excluded); break;
          default: filtered = agents;
        }
        renderLevel2Table(ws, team, filtered, FILTER_LABELS[filterKey]);
        updateCardHighlight(filterKey);
        return;
      }

      // Level 3: 상담사 평가 이력 필터
      const { ws, team, agent } = ctx;
      const evals = agent.evaluations;
      if (activeFilter === filterKey) {
        activeFilter = null;
        renderLevel3Table(ws, team, agent, evals);
        updateCardHighlight(null);
        return;
      }
      activeFilter = filterKey;
      let filtered;
      const deductionMap = {};
      evals.forEach(e => {
        const items = e.deductionItems || (e.deductionItem ? [e.deductionItem] : []);
        items.forEach(item => { deductionMap[item] = (deductionMap[item] || 0) + 1; });
      });
      let topItem = '';
      let topCnt = 0;
      Object.entries(deductionMap).forEach(([item, cnt]) => { if (cnt > topCnt) { topItem = item; topCnt = cnt; } });

      switch (filterKey) {
        case 'urgentIssue': filtered = evals.filter(e => e.urgentIssue); break;
        case 'topDeduction': filtered = evals.filter(e => (e.deductionItems || (e.deductionItem ? [e.deductionItem] : [])).includes(topItem)); break;
        case 'lowScore': filtered = evals.filter(e => e.score <= 70); break;
        default: filtered = evals;
      }
      renderLevel3Table(ws, team, agent, filtered, FILTER_LABELS[filterKey]);
      updateCardHighlight(filterKey);
    }

    function updateCardHighlight(activeKey) {
      document.querySelectorAll('#kpi-cards [data-filter-key]').forEach(el => {
        const key = el.getAttribute('data-filter-key');
        const icon = el.querySelector('svg');
        if (key === activeKey) {
          el.style.border = '2px solid #3b82f6';
          el.style.boxShadow = '0 0 0 1px #3b82f6';
          if (icon) icon.setAttribute('stroke', '#3b82f6');
        } else {
          el.style.border = '';
          el.style.boxShadow = '';
          if (icon) icon.setAttribute('stroke', '#BDBDBD');
        }
      });
    }
    let dashboardSummary = null;

    // URL 파라미터(?ct=&team=) 기반 딥링크를 지원하여, 다른 페이지에서 특정 팀으로 바로 진입 가능
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      // iframe embed 모드: 페이지 제목 숨김, 배경 투명 처리
      if (params.has('embed')) {
        const titleEl = document.getElementById('da-page-title');
        if (titleEl) titleEl.style.display = 'none';
        document.body.style.background = 'transparent';
      }

      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function() { applyPeriodFilter(); }
      });

      const dsData = await AICC_DataLoader.load('dashboard-stats.json');
      if (dsData) dashboardSummary = dsData.summary;
      const wsName = params.get('ct');
      const teamName = params.get('team');

      if (wsName && teamName) {
        const ws = DUMMY.centers.find(w => w.name === wsName);
        if (ws) {
          const team = ws.teams.find(t => t.name === teamName);
          if (team) {
            drillToTeam(ws.id, team.id);
            return;
          }
        }
      }
      renderLevel0();
    });

    /* ========== 브레드크럼 ========== */
    // navStack을 순회하며 클릭 가능한 경로 링크를 생성하되, 마지막 항목만 비활성화하여 현재 위치 표시
    function updateBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      const backBtn = document.getElementById('back-btn');

      let parts = ['<span style="cursor:pointer;color:#00A3FF;" onclick="goToLevel(0)">전체</span>'];
      navStack.forEach((item, idx) => {
        const isLast = idx === navStack.length - 1;
        if (isLast) {
          parts.push(`<span style="font-weight:600;">${item.label}</span>`);
        } else {
          parts.push(`<span style="cursor:pointer;color:#00A3FF;" onclick="goToLevel(${idx + 1})">${item.label}</span>`);
        }
      });

      bc.innerHTML = parts.join('<span style="color:#BDBDBD;margin:0 2px;">/</span>');
      backBtn.style.display = currentLevel > 0 ? '' : 'none';
    }

    // navStack을 slice하여 원하는 레벨로 점프 — 브레드크럼 클릭 시 중간 레벨 복원에 사용
    function goToLevel(level) {
      if (level === 0) {
        currentLevel = 0;
        navStack = [];
        renderLevel0();
      } else if (level <= navStack.length) {
        navStack = navStack.slice(0, level);
        currentLevel = level;
        const item = navStack[level - 1];
        if (level === 1) renderLevel1(item.data);
        else if (level === 2) renderLevel2(item.data);
        else if (level === 3) renderLevel3(item.data);
      }
      updateBreadcrumb();
    }

    function goBack() {
      if (currentLevel > 0) {
        goToLevel(currentLevel - 1);
      }
    }

    /* ========== 페이지네이션 렌더링 ========== */
    function renderPagination(totalItems, currentPage, pageSize) {
      const container = document.getElementById('table-pagination');
      if (!container) return;
      const totalPages = 5;

      let html = '';
      html += `<button class="pagination-btn">&laquo;</button>`;
      for (let p = 1; p <= totalPages; p++) {
        html += `<button class="pagination-btn${p === currentPage ? ' active' : ''}">${p}</button>`;
      }
      html += `<button class="pagination-btn">&raquo;</button>`;
      html += `<span style="margin-left:16px;font-size:12px;color:#757575;">페이지당:
        <select class="form-select" style="min-width:60px;padding:2px 24px 2px 8px;">
          <option>10</option>
          <option selected>20</option>
          <option>50</option>
        </select>
      </span>`;

      container.innerHTML = html;
    }

    /* ========== KPI 카드 렌더링 ========== */
    // 범용 KPI 렌더러 — 레벨별로 다른 지표를 동일한 카드 형태로 표현하기 위해 items 배열 기반 설계
    function renderKPI(items) {
      const container = document.getElementById('kpi-cards');
      container.style.display = 'grid';
      container.style.gridTemplateColumns = '0.7fr 1.3fr 1.3fr 0.7fr';
      container.style.flexDirection = '';
      container.innerHTML = items.map(card => {
        let trendHtml = '';
        if (card.isDuration) {
          const toSec = (s) => { const p = s.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); };
          const cur = toSec(card.current), prev = toSec(card.prev);
          const diffSec = cur - prev;
          if (diffSec !== 0) {
            const arrow = diffSec < 0 ? '↓' : '↑';
            const color = diffSec < 0 ? '#4CAF50' : '#F44336';
            const absDiff = Math.abs(diffSec);
            const m = Math.floor(absDiff / 60), s = absDiff % 60;
            trendHtml = `<span style="font-size:12px;color:${color};">${arrow} ${m > 0 ? m + '분 ' : ''}${s}초</span>`;
          }
        } else if (card.current !== undefined && card.prev !== undefined) {
          trendHtml = AICC_Fmt.trend(card.current, card.prev);
        }

        if (card.isCallBreakdown) {
          const pct = (done, total) => total > 0 ? Math.round(done / total * 100) : 0;
          const bd = [
            { label: '자동/IB', total: card.autoIB, done: card.autoIB_done, totalPrev: card.autoIB_prev, donePrev: card.autoIB_done_prev },
            { label: '자동/OB', total: card.autoOB, done: card.autoOB_done, totalPrev: card.autoOB_prev, donePrev: card.autoOB_done_prev },
            { label: '수동',    total: card.manual,  done: card.manual_done, totalPrev: card.manual_prev, donePrev: card.manual_done_prev }
          ];
          const maxNum = Math.max(...bd.map(b => Math.max(b.total, b.done)));
          const curFs = maxNum >= 100000 ? 9 : maxNum >= 10000 ? 10 : 12;
          const prevMax = Math.max(...bd.map(b => Math.max(b.totalPrev, b.donePrev)));
          const prevFs = prevMax >= 100000 ? 8 : prevMax >= 10000 ? 9 : 10;
          const colHeaders = bd.map(b => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${b.label}</span>`).join('');
          const colCurrent = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#42A5F5;">${AICC_Fmt.number(b.total)}</span> <span style="color:#BDBDBD;">/</span> <span style="color:#424242;font-weight:600;">${AICC_Fmt.number(b.done)}건</span></span>`;
            const pctPart = `<span style="color:#424242;font-weight:600;">(${pct(b.done, b.total)}%)</span>`;
            return `<span style="text-align:center;font-size:${curFs}px;">${numPart}<br>${pctPart}</span>`;
          }).join('');
          const colPrev = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#90CAF9;">${AICC_Fmt.number(b.totalPrev)}</span> <span style="color:#D5D5D5;">/</span> <span style="color:#BDBDBD;">${AICC_Fmt.number(b.donePrev)}건</span></span>`;
            const pctPart = `<span style="color:#BDBDBD;">(${pct(b.donePrev, b.totalPrev)}%)</span>`;
            return `<span style="text-align:center;font-size:${prevFs}px;">${numPart}<br>${pctPart}</span>`;
          }).join('');
          return `
          <div class="kpi-card fade-in">
            <div style="display:flex;align-items:flex-start;gap:12px;">
              <div style="flex-shrink:0;">
                <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
                <div style="display:flex;align-items:baseline;gap:8px;">
                  <span style="font-size:28px;font-weight:700;">${card.value}</span>
                  ${trendHtml}
                </div>
                <div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div>
              </div>
              <div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">
                ${colHeaders}
                ${colCurrent}
                ${colPrev}
              </div>
            </div>
          </div>
          `;
        }

        if (card.isScoreBreakdown) {
          const sb = [
            { label: '자동/IB', score: card.scoreIB, scorePrev: card.scoreIB_prev },
            { label: '자동/OB', score: card.scoreOB, scorePrev: card.scoreOB_prev },
            { label: '수동',    score: card.scoreManual, scorePrev: card.scoreManual_prev }
          ];
          const sHeaders = sb.map(s => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${s.label}</span>`).join('');
          const sScores = sb.map(s => `<span style="text-align:center;font-size:12px;font-weight:600;white-space:nowrap;color:#424242;">${AICC_Fmt.score(s.score)}점</span>`).join('');
          const sPrev = sb.map(s => `<span style="text-align:center;font-size:10px;white-space:nowrap;color:#BDBDBD;">${AICC_Fmt.score(s.scorePrev)}점</span>`).join('');
          return `
          <div class="kpi-card fade-in">
            <div style="display:flex;align-items:flex-start;gap:12px;">
              <div style="flex-shrink:0;">
                <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
                <div style="display:flex;align-items:baseline;gap:8px;">
                  <span style="font-size:28px;font-weight:700;">${card.value}</span>
                  ${trendHtml}
                </div>
                <div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div>
              </div>
              <div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">
                ${sHeaders}
                ${sScores}
                ${sPrev}
              </div>
            </div>
          </div>
          `;
        }

        if (card.isTopDeduction) {
          const td = card.deductionData;
          return `
          <div class="kpi-card fade-in">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="font-size:18px;font-weight:700;color:#424242;margin-top:4px;">${td.item}</div>
            <div style="font-size:13px;color:#F44336;font-weight:600;margin-top:6px;">${td.calls}콜 (${td.pct}%)</div>
          </div>
          `;
        }

        if (card.isLowScore) {
          return `
          <div class="kpi-card fade-in">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;">
              <span style="font-size:28px;font-weight:700;color:#F44336;">${card.lowCalls}콜</span>
              <span style="font-size:14px;font-weight:600;color:#757575;">(${card.lowPct}%)</span>
            </div>
          </div>
          `;
        }

        const scoreColor = card.isScore ? `color:${AICC_Fmt.scoreColor(card.current)}` : '';
        return `
          <div class="kpi-card fade-in">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span style="font-size:28px;font-weight:700;${scoreColor}">${card.value}</span>
              ${trendHtml}
            </div>
            ${card.sub ? `<div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.sub}</div>` : ''}
            ${card.prevLabel ? `<div style="font-size:11px;color:#9E9E9E;margin-top:4px;">${card.prevLabel}: ${typeof card.prev === 'number' ? AICC_Fmt.number(card.prev) : card.prev}${card.unit || ''}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // 2행 KPI 카드 렌더링 — row1/row2 배열을 받아 #kpi-cards에 2행 그리드로 표현
    function renderKpiTwoRows(row1, row2, customGridCols) {
      const container = document.getElementById('kpi-cards');
      const cols = customGridCols || '0.9fr 1.3fr 0.9fr 0.9fr';
      const gridStyle = `display:grid;grid-template-columns:${cols};gap:16px;`;
      const searchIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;top:10px;right:10px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
      const cardOpen = (card) => {
        if (card.filterKey) {
          return `<div class="kpi-card fade-in" data-filter-key="${card.filterKey}" onclick="filterByCard('${card.filterKey}')" style="position:relative;cursor:pointer;">${searchIcon}`;
        }
        return `<div class="kpi-card fade-in">`;
      };
      const cardClose = '</div>';

      const renderRow = (items) => items.map(card => {
        let trendHtml = '';
        if (card.isDuration) {
          const toSec = (s) => { const p = s.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); };
          const cur = toSec(card.current), prev = toSec(card.prev);
          const diffSec = cur - prev;
          if (diffSec !== 0) {
            const arrow = diffSec < 0 ? '↓' : '↑';
            const color = diffSec < 0 ? '#4CAF50' : '#F44336';
            const absDiff = Math.abs(diffSec);
            const m = Math.floor(absDiff / 60), s = absDiff % 60;
            trendHtml = `<span style="font-size:12px;color:${color};">${arrow} ${m > 0 ? m + '분 ' : ''}${s}초</span>`;
          }
        } else if (card.current !== undefined && card.prev !== undefined && !card.isTopDeduction && !card.isLowScore) {
          trendHtml = AICC_Fmt.trend(card.current, card.prev);
        }
        if (card.isCallBreakdown) {
          const pct = (done, total) => total > 0 ? Math.round(done / total * 100) : 0;
          const bd = [
            { label: '자동/IB', total: card.autoIB, done: card.autoIB_done, totalPrev: card.autoIB_prev, donePrev: card.autoIB_done_prev },
            { label: '자동/OB', total: card.autoOB, done: card.autoOB_done, totalPrev: card.autoOB_prev, donePrev: card.autoOB_done_prev },
            { label: '수동',    total: card.manual,  done: card.manual_done, totalPrev: card.manual_prev, donePrev: card.manual_done_prev }
          ];
          const maxNum = Math.max(...bd.map(b => Math.max(b.total, b.done)));
          const curFs = maxNum >= 100000 ? 9 : maxNum >= 10000 ? 10 : 12;
          const prevMax = Math.max(...bd.map(b => Math.max(b.totalPrev, b.donePrev)));
          const prevFs = prevMax >= 100000 ? 8 : prevMax >= 10000 ? 9 : 10;
          const colHeaders = bd.map(b => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${b.label}</span>`).join('');
          const colCurrent = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#42A5F5;">${AICC_Fmt.number(b.total)}</span> <span style="color:#BDBDBD;">/</span> <span style="color:#424242;font-weight:600;">${AICC_Fmt.number(b.done)}건</span></span>`;
            const pctPart = `<span style="color:#424242;font-weight:600;">(${pct(b.done, b.total)}%)</span>`;
            return `<span style="text-align:center;font-size:${curFs}px;">${numPart}<br>${pctPart}</span>`;
          }).join('');
          const colPrev = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#90CAF9;">${AICC_Fmt.number(b.totalPrev)}</span> <span style="color:#D5D5D5;">/</span> <span style="color:#BDBDBD;">${AICC_Fmt.number(b.donePrev)}건</span></span>`;
            const pctPart = `<span style="color:#BDBDBD;">(${pct(b.donePrev, b.totalPrev)}%)</span>`;
            return `<span style="text-align:center;font-size:${prevFs}px;">${numPart}<br>${pctPart}</span>`;
          }).join('');
          return `${cardOpen(card)}<div style="display:flex;align-items:flex-start;gap:12px;"><div style="flex-shrink:0;"><div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:28px;font-weight:700;">${card.value}</span>${trendHtml}</div><div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div></div><div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">${colHeaders}${colCurrent}${colPrev}</div></div>${cardClose}`;
        }
        if (card.isScoreBreakdown) {
          const sb = [
            { label: '자동/IB', score: card.scoreIB, scorePrev: card.scoreIB_prev },
            { label: '자동/OB', score: card.scoreOB, scorePrev: card.scoreOB_prev },
            { label: '수동',    score: card.scoreManual, scorePrev: card.scoreManual_prev }
          ];
          const sHeaders = sb.map(s => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${s.label}</span>`).join('');
          const sScores = sb.map(s => `<span style="text-align:center;font-size:12px;font-weight:600;white-space:nowrap;color:#424242;">${AICC_Fmt.score(s.score)}점</span>`).join('');
          const sPrev = sb.map(s => `<span style="text-align:center;font-size:10px;white-space:nowrap;color:#BDBDBD;">${AICC_Fmt.score(s.scorePrev)}점</span>`).join('');
          return `${cardOpen(card)}<div style="display:flex;align-items:flex-start;gap:12px;"><div style="flex-shrink:0;"><div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:28px;font-weight:700;">${card.value}</span>${trendHtml}</div><div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div></div><div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">${sHeaders}${sScores}${sPrev}</div></div>${cardClose}`;
        }
        if (card.isTopDeduction) {
          const td = card.deductionData;
          return `${cardOpen(card)}<div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="font-size:18px;font-weight:700;color:#424242;margin-top:4px;">${td.item}</div><div style="font-size:13px;color:#F44336;font-weight:600;margin-top:6px;">${td.calls}콜 (${td.pct}%)</div>${cardClose}`;
        }
        if (card.isLowScore) {
          return `${cardOpen(card)}<div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;"><span style="font-size:28px;font-weight:700;color:#F44336;">${card.lowCalls}콜</span><span style="font-size:14px;font-weight:600;color:#757575;">(${card.lowPct}%)</span></div>${cardClose}`;
        }
        return `${cardOpen(card)}<div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:28px;font-weight:700;">${card.value}</span>${trendHtml}</div>${card.sub ? `<div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.sub}</div>` : ''}${card.prevLabel ? `<div style="font-size:11px;color:#9E9E9E;margin-top:4px;">${card.prevLabel}: ${typeof card.prev === 'number' ? AICC_Fmt.number(card.prev) : card.prev}${card.unit || ''}</div>` : ''}${cardClose}`;
      }).join('');
      container.style.display = 'flex';
      container.style.flexDirection = 'column';
      container.style.gridTemplateColumns = '';
      container.style.gap = '16px';
      container.innerHTML = `<div style="${gridStyle}">${renderRow(row1)}</div><div style="${gridStyle}">${renderRow(row2)}</div>`;
    }

    /* ========== Level 0: 센터 목록 ========== */
    // 최상위 뷰: 전체 센터를 집계하여 KPI와 테이블을 동시에 갱신

          isScoreBreakdown: true,
          scoreIB: ds.avg_score_auto_ib || 0, scoreIB_prev: ds.avg_score_auto_ib_prev || 0,
          scoreOB: ds.avg_score_auto_ob || 0, scoreOB_prev: ds.avg_score_auto_ob_prev || 0,

          <th style="text-align:center;width:10%;">평균 점수</th>
          <th style="text-align:center;width:10%;">평균 통화시간</th>

    /* ========== Level 1: 팀 목록 (센터 내) ========== */
    // 테이블 행 클릭 진입점 — navStack에 센터 컨텍스트를 push한 뒤 팀 목록 렌더링
    function drillToCenter(wsId) {
      const ws = DUMMY.centers.find(w => w.id === wsId);
      if (!ws) return;

      currentLevel = 1;
      navStack = [{ level: 1, label: ws.name, data: ws }];

    // 센터 내 팀별 비교 뷰 렌더링
    function renderLevel1(ws) {
      const teams = ws.teams;

      const kpiCards = [

      document.getElementById('table-count').textContent = `총 ${teams.length}개 팀`;

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="text-align:center;width:5%;">NO.</th>

          <th style="text-align:center;width:10%;">상담 건수</th>

          <td style="text-align:center;">${idx + 1}</td>

    /* ========== Level 2: 상담사 목록 (팀 내) ========== */
    // ws→team 2단계 navStack을 한 번에 구성 — 딥링크 및 직접 클릭 모두 지원
    function drillToTeam(wsId, teamId) {
      const ws = DUMMY.centers.find(w => w.id === wsId);
      if (!ws) return;
      const team = ws.teams.find(t => t.id === teamId);
      if (!team) return;

      currentLevel = 2;
      navStack = [
        { level: 1, label: ws.name, data: ws },
        { level: 2, label: team.name, data: { ws, team } }
      ];
      renderLevel2({ ws, team });
      updateBreadcrumb();
    }

    // 팀 내 상담사별 순위·유형 비교 뷰 렌더링
    function renderLevel2(ctx) {
      const { ws, team } = ctx;
      const agents = team.agents;

      const row1 = [
        { label: '평가 상담사', value: AICC_Fmt.number(team.agentCount), current: team.agentCount, prev: team.agentCount_prev || 0, unit: '명', prevLabel: '전월', sub: team.name },
        { label: '평가 건수', value: AICC_Fmt.number(team.totalCalls), current: team.totalCalls, prev: (team.calls_auto_ib_prev || 0) + (team.calls_auto_ob_prev || 0) + (team.calls_manual_prev || 0), unit: '건', prevLabel: '전월',
          isCallBreakdown: true,
          autoIB: team.calls_auto_ib || 0, autoIB_done: team.calls_auto_ib_done || 0,
          autoOB: team.calls_auto_ob || 0, autoOB_done: team.calls_auto_ob_done || 0,
          manual: team.calls_manual || 0, manual_done: team.calls_manual_done || 0,
          autoIB_prev: team.calls_auto_ib_prev || 0, autoIB_done_prev: team.calls_auto_ib_done_prev || 0,
          autoOB_prev: team.calls_auto_ob_prev || 0, autoOB_done_prev: team.calls_auto_ob_done_prev || 0,
          manual_prev: team.calls_manual_prev || 0, manual_done_prev: team.calls_manual_done_prev || 0 },
        { label: '긴급 이슈', value: team.urgentIssues || 0, current: team.urgentIssues || 0, prev: team.urgentIssues_prev || 0, unit: '건', prevLabel: '전월', filterKey: 'urgentIssue' },
        { label: '상담사 평균 통화시간', value: team.avgDuration || '00:00', current: team.avgDuration || '00:00', prev: team.avgDuration_prev || '00:00', unit: '', isDuration: true, prevLabel: '전월' }
      ];
      const row2 = [
        { label: '평가 제외 상담사', value: AICC_Fmt.number(team.excludedAgents || 0), current: team.excludedAgents || 0, prev: team.excludedAgents_prev || 0, unit: '명', prevLabel: '전월', filterKey: 'excluded' },
        { label: '평균 평가 점수', value: AICC_Fmt.score(team.avgScore), current: team.avgScore, prev: team.avgScore_prev || 0, unit: '점', prevLabel: '전월',
          isScoreBreakdown: true,
          scoreIB: team.avg_score_auto_ib || 0, scoreIB_prev: team.avg_score_auto_ib_prev || 0,
          scoreOB: team.avg_score_auto_ob || 0, scoreOB_prev: team.avg_score_auto_ob_prev || 0,
          scoreManual: team.avg_score_manual || 0, scoreManual_prev: team.avg_score_manual_prev || 0 },
        { label: '최다 감점 항목', isTopDeduction: true, deductionData: team.topDeduction || { item: '-', calls: 0, pct: 0 }, filterKey: 'topDeduction' },
        { label: '70점 이하 콜', isLowScore: true, lowCalls: team.lowScoreCalls || 0, lowPct: team.lowScorePct || 0, filterKey: 'lowScore' }
      ];

      renderKpiTwoRows(row1, row2);
      activeFilter = null;
      renderLevel2Table(ws, team, agents);
    }

    function renderLevel2Table(ws, team, agentList, filterLabel) {
      const titleEl = document.getElementById('table-title');
      const baseTitle = team.name + ' - 상담사별 현황';
      if (filterLabel) {
        titleEl.innerHTML = `${baseTitle} <span onclick="filterByCard(activeFilter)" style="display:inline-block;margin-left:8px;padding:2px 10px;background:#eff6ff;color:#3b82f6;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;">
          ${filterLabel} ✕</span>`;
      } else {
        titleEl.textContent = baseTitle;
      }
      document.getElementById('table-count').textContent = `총 ${agentList.length}명`;

      const table = document.querySelector('.data-table');
      table.style.tableLayout = 'fixed';

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="text-align:center;width:5%;">NO.</th>
          <th style="text-align:center;width:12%;">상담사</th>
          <th style="text-align:center;width:10%;">사번</th>
          <th style="text-align:center;width:12%;">총 상담건수</th>
          <th style="text-align:center;width:12%;">평균 통화시간</th>
          <th style="text-align:center;width:17%;">최다 감점항목</th>
          <th style="text-align:center;width:12%;">평균 점수</th>
          <th style="text-align:center;width:20%;">이슈</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = agentList.map((a, idx) => {
        let issueTd = '-';
        if (a.excluded) {
          issueTd = '<span style="display:inline-block;padding:2px 8px;background:#f3f4f6;color:#6b7280;border-radius:4px;font-size:12px;">평가 제외</span>';
        } else if (a.urgentIssue && a.issue) {
          issueTd = '<span style="display:inline-block;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:12px;">' + a.issue + '</span>' +
                    ' <span style="display:inline-block;padding:1px 6px;background:#dc2626;color:#fff;border-radius:4px;font-size:10px;font-weight:600;">긴급</span>';
        } else if (a.issue) {
          issueTd = '<span style="display:inline-block;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:12px;">' + a.issue + '</span>';
        }

        <tr onclick="drillToAgent('${ws.id}','${team.id}','${a.id}')" class="fade-in">

          <td style="text-align:center;">${a.employeeId || '-'}</td>

          <td style="text-align:center;">${a.avgDuration || '-'}</td>

      }).join('');

    /* ========== Level 3: 평가 목록 (상담사) ========== */
    // ws→team→agent 3단계 navStack을 한 번에 구성하여 모달에서 컨텍스트 참조 가능하게 함
    function drillToAgent(wsId, teamId, agentId) {
      const ws = DUMMY.centers.find(w => w.id === wsId);
      if (!ws) return;
      const team = ws.teams.find(t => t.id === teamId);
      if (!team) return;
      const agent = team.agents.find(a => a.id === agentId);
      if (!agent) return;

      currentLevel = 3;
      navStack = [
        { level: 1, label: ws.name, data: ws },
        { level: 2, label: team.name, data: { ws, team } },
        { level: 3, label: agent.name, data: { ws, team, agent } }
      ];
      renderLevel3({ ws, team, agent });
      updateBreadcrumb();
    }

    function renderLevel3(ctx) {
      const { ws, team, agent } = ctx;
      const evals = agent.evaluations;
      const avgScore = evals.reduce((s, e) => s + e.score, 0) / evals.length;
      const urgentCount = evals.filter(e => e.urgentIssue).length;
      const lowScoreCount = evals.filter(e => e.score <= 70).length;
      const lowScorePct = evals.length > 0 ? Math.round(lowScoreCount / evals.length * 100) : 0;

      // 최다 감점항목 계산 — deductionItems(배열) 우선, deductionItem(단일) 폴백
      const deductionMap = {};
      evals.forEach(e => {
        const items = e.deductionItems || (e.deductionItem ? [e.deductionItem] : []);
        items.forEach(item => { deductionMap[item] = (deductionMap[item] || 0) + 1; });
      });
      let topDeductionItem = '-', topDeductionCalls = 0;
      Object.entries(deductionMap).forEach(([item, cnt]) => {
        if (cnt > topDeductionCalls) { topDeductionItem = item; topDeductionCalls = cnt; }
      });
      const topDeductionPct = evals.length > 0 ? Math.round(topDeductionCalls / evals.length * 100) : 0;

      // 자동IB / 자동OB / 수동 건수 집계
      const autoIB = evals.filter(e => e.type !== '수동' && e.callType === 'I/B');
      const autoOB = evals.filter(e => e.type !== '수동' && e.callType === 'O/B');
      const manual = evals.filter(e => e.type === '수동');
      const avgOf = (arr) => arr.length > 0 ? arr.reduce((s, e) => s + e.score, 0) / arr.length : 0;
      const prevRand = (v, lo, hi) => Math.max(0, v + Math.floor(Math.random() * (hi - lo + 1)) + lo);

      const prevEvalCount = Math.round(evals.length * 0.9);
      const prevAvgScore = parseFloat((avgScore + (Math.random() > 0.5 ? 1.5 : -1.2)).toFixed(1));
      const prevUrgent = Math.max(0, urgentCount - 1);

      const row1 = [
        { label: '평가 건수', value: AICC_Fmt.number(evals.length) + '건', current: evals.length, prev: prevEvalCount, unit: '건', prevLabel: '전월',
          isCallBreakdown: true,
          autoIB: autoIB.length, autoIB_done: autoIB.length,
          autoOB: autoOB.length, autoOB_done: autoOB.length,
          manual: manual.length, manual_done: manual.length,
          autoIB_prev: prevRand(autoIB.length, -2, 1), autoIB_done_prev: prevRand(autoIB.length, -3, 0),
          autoOB_prev: prevRand(autoOB.length, -1, 1), autoOB_done_prev: prevRand(autoOB.length, -2, 0),
          manual_prev: prevRand(manual.length, -1, 1), manual_done_prev: prevRand(manual.length, -1, 0) },
        { label: '긴급 이슈', value: urgentCount, current: urgentCount, prev: prevUrgent, unit: '건', prevLabel: '전월', filterKey: 'urgentIssue' },
        { label: '상담사 평균 통화시간', value: agent.avgDuration || '00:00', current: agent.avgDuration || '00:00', prev: '04:50', unit: '', isDuration: true, prevLabel: '전월' }
      ];
      const row2 = [
        { label: '평균 평가 점수', value: AICC_Fmt.score(avgScore), current: avgScore, prev: prevAvgScore, unit: '점', prevLabel: '전월',
          isScoreBreakdown: true,
          scoreIB: avgOf(autoIB), scoreIB_prev: parseFloat((avgOf(autoIB) + (Math.random() > 0.5 ? 1.3 : -0.8)).toFixed(1)),
          scoreOB: avgOf(autoOB), scoreOB_prev: parseFloat((avgOf(autoOB) + (Math.random() > 0.5 ? 0.9 : -1.1)).toFixed(1)),
          scoreManual: avgOf(manual), scoreManual_prev: parseFloat((avgOf(manual) + (Math.random() > 0.5 ? 1.0 : -1.5)).toFixed(1)) },
        { label: '최다 감점 항목', isTopDeduction: true, deductionData: { item: topDeductionItem, calls: topDeductionCalls, pct: topDeductionPct }, filterKey: 'topDeduction' },
        { label: '70점 이하 콜', isLowScore: true, lowCalls: lowScoreCount, lowPct: lowScorePct, filterKey: 'lowScore' }
      ];

      renderKpiTwoRows(row1, row2, '1.4fr 0.8fr 0.8fr');
      activeFilter = null;
      renderLevel3Table(ws, team, agent, evals);
    }

    function renderLevel3Table(ws, team, agent, evalList, filterLabel) {
      const titleEl = document.getElementById('table-title');
      const baseTitle = agent.name + ' - 평가 이력';
      if (filterLabel) {
        titleEl.innerHTML = `${baseTitle} <span onclick="filterByCard(activeFilter)" style="display:inline-block;margin-left:8px;padding:2px 10px;background:#eff6ff;color:#3b82f6;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;">${filterLabel} ✕</span>`;
      } else {
        titleEl.textContent = baseTitle;
      }
      document.getElementById('table-count').textContent = `총 ${evalList.length}건`;

      const table = document.querySelector('.data-table');
      table.style.tableLayout = 'fixed';

      const callType = agent.callType || 'I/B';
      const teamLabel = team.name || '';
      const simEvalFormForTable = callType === 'O/B' ? 'O/B 텔레마케팅 평가표 v1.3'
        : teamLabel.includes('VIP') ? 'I/B VIP 평가표 v1.0' : 'I/B 일반 상담 평가표 v2.1';

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="text-align:center;width:9%;">평가 ID</th>
          <th style="text-align:center;width:11%;">일시</th>
          <th style="text-align:center;width:16%;">상담 유형</th>
          <th style="text-align:center;width:5%;">유형</th>
          <th style="text-align:center;width:6%;">평가방식</th>
          <th style="text-align:center;width:14%;">평가표</th>
          <th style="text-align:center;width:6%;">통화시간</th>
          <th style="text-align:center;width:6%;">신뢰도</th>
          <th style="text-align:center;width:6%;">점수</th>
          <th style="text-align:center;width:21%;">이슈</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = evalList.map(ev => {
        const confBadge = ev.confidence === 'High'
          ? '<span class="badge badge-active">High</span>'
          : '<span class="badge badge-pending">Mid</span>';

        const callTypeBadge = ev.callType === 'I/B'
          ? '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>'
          : '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>';

        // 이슈 셀: 긴급 배지 + 이슈 텍스트 + 감점항목 통합
        const items = ev.deductionItems || (ev.deductionItem ? [ev.deductionItem] : []);
        const deductionDisplay = items.length > 3 ? items.slice(0, 3).join(', ') + ', ...' : items.join(', ');
        const deductionTooltip = items.join(', ');
        let issueLines = [];
        if (ev.urgentIssue) {
          issueLines.push('<span style="display:inline-block;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:11px;font-weight:600;">긴급</span>' + (ev.issue ? ' <span style="font-size:11px;color:#F57F17;">' + ev.issue + '</span>' : ''));
        } else if (ev.issue) {
          issueLines.push('<span style="font-size:11px;color:#F57F17;">' + ev.issue + '</span>');
        }
        if (deductionDisplay) {
          issueLines.push('<span style="font-size:11px;color:#9E9E9E;" title="' + deductionTooltip + '">감점: ' + deductionDisplay + '</span>');
        }
        const issueHtml = issueLines.length > 0 ? issueLines.join('<br>') : '<span style="color:#9E9E9E;font-size:11px;">-</span>';

        return `
          <tr onclick="showEvalDetail('${ev.id}')" class="fade-in">
            <td style="text-align:center;font-size:12px;font-family:monospace;">${ev.id}</td>

            <td style="text-align:center;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${ev.category || '-'}">${ev.category || '-'}</td>
            <td style="text-align:center;">${ev.callType ? callTypeBadge : '-'}</td>
            <td style="text-align:center;">${AICC_Fmt.typeBadge(ev.type)}</td>
            <td style="text-align:center;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${simEvalFormForTable}">${simEvalFormForTable}</td>
            <td style="text-align:center;font-size:12px;">${ev.duration}</td>
            <td style="text-align:center;">${confBadge}</td>
            <td style="text-align:center;">${AICC_Fmt.scoreHtml(ev.score)}</td>
            <td style="text-align:left;">${issueHtml}</td>
          </tr>
        `;
      }).join('');

      renderPagination(evalList.length, 1, 5);
    }

    /* ========== 평가 상세 모달 ========== */
    // 실제 평가표 항목 구조를 반영한 시뮬레이션 데이터 — NLP/AI 방식 구분은 실제 채점 엔진 유형과 매핑
    const SIM_SCORE_ITEMS = [
      { name: '첫인사', max: 6, type: 'NLP' },
      { name: '고객 인사 화답', max: 6, type: 'AI' },
      { name: '긍/부정 공감', max: 5, type: 'AI' },
      { name: '동시 발화', max: 6, type: 'NLP' },
      { name: '양해 없는 무응답', max: 5, type: 'NLP' },
      { name: '욕설/금지어', max: 0, type: 'NLP' },
      { name: '말끊기', max: 5, type: 'NLP' },
      { name: '고객향 상담', max: 5, type: 'AI' },
      { name: '상담 어미', max: 5, type: 'NLP' },
      { name: '전문적 화법', max: 6, type: 'NLP' },
      { name: '적극성(회피)', max: 6, type: 'AI' },
      { name: '편리(재질의)', max: 6, type: 'NLP' },
      { name: '신속성', max: 6, type: 'NLP' },
      { name: '어조', max: 6, type: 'AI' },
      { name: '개인정보 확인', max: 6, type: 'NLP' },
      { name: '문제 해결', max: 6, type: 'AI' },
      { name: '쉬운 설명', max: 6, type: 'AI' },
      { name: '적극적 응대', max: 6, type: 'AI' }
    ];

    // 총점 비율(ratio)에 따라 감점 확률을 역비례 적용하여, 고득점자는 감점이 적은 현실적 분포를 시뮬레이션
    function generateSimScores(totalScore) {
      // 0.6~1.0 범위로 클램핑 — 극단적 저점수에서도 최소 60% 통과율 보장
      const ratio = Math.max(0.6, Math.min(1, totalScore / 100));
      return SIM_SCORE_ITEMS.map(item => {
        let score = item.max;
        if (item.max > 0) {
          // ratio 미만 난수일 때만 감점 — 고득점자일수록 감점 확률 낮음
          const loss = Math.random() < ratio ? 0 : Math.ceil(Math.random() * 2);
          score = Math.max(0, item.max - loss);
        }
        const diff = item.max - score;
        const status = diff === 0 ? 'pass' : diff === 1 ? 'warn' : 'fail';
        const reason = status === 'warn' && item.name === '전문적 화법' ? '비언어 발화 2회' : '';
        const confidence = item.type === 'AI' ? Math.floor(88 + Math.random() * 10) : null;
        return { name: item.name, score, max: item.max, type: item.type, status, reason, confidence };
      });
    }

    // 데모용 고정 시나리오 스크립트 — 실제 서비스에서는 STT API 응답으로 대체
    function generateSimTranscript(agentName, evalId) {
      if (evalId === 'AE-2025-00421') {

          { speaker: 'agent', time: '00:12', text: '네, 배송 확인 도와드리겠습니다. 주문번호 확인 부탁드리겠습니다.' },
          { speaker: 'customer', time: '00:18', text: '주문번호는 ORD-2025-00382입니다.' },
          { speaker: 'agent', time: '00:22', text: '확인하겠습니다. 잠시만 기다려주세요.' },
          { speaker: 'agent', time: '00:35', text: '네, 확인되었습니다. 현재 배송 중이며 내일 오전 도착 예정입니다. CJ대한통운으로 발송되었고 송장번호는 6023-4567-8901입니다.' },
          { speaker: 'customer', time: '00:48', text: '아, 감사합니다. 그런데 혹시 배송 시간 지정이 가능한가요? 오전에 집에 없을 수도 있어서요.' },
          { speaker: 'agent', time: '00:55', text: '네, 배송 시간 지정은 CJ대한통운 앱이나 웹사이트에서 직접 변경하실 수 있습니다. 송장번호로 조회하시면 배송 시간 변경 옵션이 있으실 거예요.' },
          { speaker: 'customer', time: '01:08', text: '아 그렇군요. 그리고 혹시 이 상품 교환이나 반품은 어떻게 되나요? 사이즈가 안 맞을 수도 있어서요.' },
          { speaker: 'agent', time: '01:15', text: '한정판 스니커즈의 경우 수령 후 7일 이내에 교환/반품 신청이 가능합니다. 단, 착용 흔적이 없어야 하며 택과 박스가 모두 보존되어야 합니다.' },
          { speaker: 'customer', time: '01:28', text: '네, 알겠습니다. 그러면 사이즈 교환도 같은 조건인가요?' },
          { speaker: 'agent', time: '01:33', text: '네 맞습니다. 사이즈 교환도 동일한 조건이 적용됩니다. 다만 한정판 제품 특성상 동일 사이즈 재고가 없을 경우 교환이 어려울 수 있는 점 양해 부탁드립니다.' },
          { speaker: 'customer', time: '01:48', text: '아, 재고가 없으면 교환이 안 되는 거군요. 그러면 반품만 가능한 건가요?' },
          { speaker: 'agent', time: '01:55', text: '네, 교환 재고가 없는 경우에는 반품 후 환불 처리가 진행됩니다. 환불은 반품 상품 확인 후 영업일 기준 3~5일 내에 원결제 수단으로 환불됩니다.' },
          { speaker: 'customer', time: '02:10', text: '네, 잘 알겠습니다. 일단 받아보고 사이즈 확인해볼게요.' },
          { speaker: 'agent', time: '02:15', text: '네, 알겠습니다. 혹시 추가로 도움이 필요한 부분 있으신가요?' },
          { speaker: 'customer', time: '02:22', text: '아니요, 다 확인됐습니다. 감사합니다.' },
          { speaker: 'agent', time: '02:25', text: '네, 감사합니다. 좋은 하루 되세요! 이용해 주셔서 감사합니다.' }
        ];
      }
      return [
        { speaker: 'agent', time: '00:01', text: `안녕하세요, ${agentName}입니다. 무엇을 도와드릴까요?` },
        { speaker: 'customer', time: '00:05', text: '네, 안녕하세요. 주문 건 확인 좀 부탁드릴게요.' },
        { speaker: 'agent', time: '00:10', text: '네, 주문 확인 도와드리겠습니다. 주문번호 확인 부탁드리겠습니다.' },
        { speaker: 'customer', time: '00:15', text: '주문번호는 ORD-2025-00382입니다.' },
        { speaker: 'agent', time: '00:20', text: '확인하겠습니다. 잠시만 기다려주세요. 네, 확인되었습니다. 현재 배송 중이며 내일 오전 도착 예정입니다.' },
        { speaker: 'customer', time: '00:30', text: '아, 감사합니다. 다른 건 없어요.' },
        { speaker: 'agent', time: '00:33', text: '감사합니다. 좋은 하루 되세요!' }
      ];
    }

    // 점수 구간별 피드백 분기 — 실제 서비스에서는 LLM 기반 자동 생성으로 대체 예정
    function generateSimFeedback(totalScore) {
      if (totalScore >= 95) return '전반적으로 매우 우수한 상담입니다. 고객 요구사항을 정확히 파악하고 신속하게 처리하였습니다.';
      if (totalScore >= 85) return '우수한 상담입니다. 일부 항목에서 소폭 감점이 있으나 전반적으로 양호합니다.';
      if (totalScore >= 70) return '보통 수준의 상담입니다. 고객 응대 스킬 및 문제 해결 역량 향상이 필요합니다.';
      return '개선이 필요한 상담입니다. 기본 응대 매뉴얼을 재확인하고 교육에 참여해 주세요.';
    }

    // navStack 3단계 컨텍스트(ws→team→agent)에서 메타 정보를 추출하여 모달에 표시
    function showEvalDetail(evalId) {
      let foundEval = null;
      if (navStack.length === 3) {
        const { agent } = navStack[2].data;
        foundEval = agent.evaluations.find(e => e.id === evalId);
      }
      if (!foundEval) return;

      const ev = foundEval;
      const agentName = navStack[2].data.agent.name;
      const wsName = navStack[0].label;
      const teamName = navStack[1].label;
      const callType = navStack[2].data.agent.callType || 'I/B';

      // 통화유형·팀명으로 평가표 분기 — 실제로는 센터별 설정에서 매핑
      const simEvalForm = callType === 'O/B' ? 'O/B 텔레마케팅 평가표 v1.3'
        : teamName.includes('VIP') ? 'I/B VIP 평가표 v1.0' : 'I/B 일반 상담 평가표 v2.1';
      const simConsultTypes = [
        '배송 > 배송조회 > 한정판 스니커즈', '결제 > 환불처리 > 환불지연',
        '교환/반품 > 사이즈교환', '상품문의 > 의류 > 사이즈안내',
        '기술지원 > 앱오류 > 로그인실패', '기술지원 > 결제오류 > 카드결제',
        '배송 > 배송비 > 추가배송비 외 2건', '해피콜 > 만족도조사 > 배송완료',
        'VIP관리 > 프로모션안내 > 시즌할인', '교환/반품 > 반품접수 > 불량상품',
        '상품문의 > 신발 > 재입고문의', '프로모션 > 쿠폰안내 > 생일쿠폰',
        '회원 > 정보변경 > 배송지변경', '프로모션 > 멤버십안내 > 등급혜택'
      ];
      // evalId의 숫자 부분을 해시로 사용하여 동일 평가에 항상 같은 상담유형이 할당되도록 보장
      const simConsultType = simConsultTypes[parseInt(evalId.replace(/\D/g,'')) % simConsultTypes.length];

      const simScores = generateSimScores(ev.score);
      const simTranscript = generateSimTranscript(agentName, ev.id);
      const simFeedback = generateSimFeedback(ev.score);

      // 항목별 점수 행 — 클릭 시 스크립트 해당 구간으로 이동하도록 인덱스 부여
      const scoreRows = simScores.map((d, idx) => {
        const statusCls = d.status === 'pass' ? 'score-good' : d.status === 'warn' ? 'score-warn' : 'score-danger';
        const statusText = d.status === 'pass' ? '통과' : d.status === 'warn' ? '주의' : '미달';
        const confHtml = d.confidence ? `<span style="font-size:11px;color:#757575;">${d.confidence}%</span>` : '';
        const reasonHtml = d.reason ? `<div style="font-size:10px;color:#F57F17;margin-top:2px;">${d.reason}</div>` : '';
        return `
          <tr style="cursor:pointer;" onclick="scrollToTranscript(${idx})" title="클릭하면 해당 구간으로 이동합니다">
            <td style="font-size:11px;padding:6px 4px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${d.name}</td>
            <td style="padding:6px 4px;text-align:center;">${AICC_Fmt.typeBadge(d.type)}</td>
            <td style="text-align:center;font-weight:500;font-size:11px;padding:6px 4px;">${d.score}/${d.max}</td>
            <td style="padding:6px 4px;text-align:center;">${confHtml}</td>
            <td style="padding:6px 4px;text-align:center;"><span class="${statusCls}" style="font-size:11px;">${statusText}</span>${reasonHtml}</td>
          </tr>
        `;
      }).join('');

      // 스크립트 라인 — data-idx로 항목별 점수와 매핑
      const transcriptHtml = simTranscript.map((t, idx) => {
        const isAgent = t.speaker === 'agent';
        const bg = isAgent ? '#E3F2FD' : '#F5F5F5';
        const hoverBg = isAgent ? '#B3E5FC' : '#EEEEEE';
        const label = isAgent ? '상담사' : '고객';
        return `
          <div class="transcript-line" data-idx="${idx}" style="display:flex;gap:10px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:background 0.15s;" onclick="playSegment(this, '${t.time}')" onmouseenter="this.style.background='${hoverBg}'" onmouseleave="if(!this.classList.contains('playing'))this.style.background=''">
            <div style="min-width:40px;font-size:10px;color:#757575;padding-top:2px;">${t.time}</div>
            <div style="flex:1;">
              <div style="font-size:10px;font-weight:600;color:${isAgent ? '#00A3FF' : '#424242'};margin-bottom:2px;">${label}</div>
              <div style="background:${bg};padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5;display:flex;align-items:start;gap:6px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="${isAgent ? '#00A3FF' : '#757575'}" style="flex-shrink:0;margin-top:3px;opacity:0.5;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>${t.text}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      const scoreColor = ev.score >= 80 ? 'color:#4CAF50' : ev.score >= 60 ? 'color:#FFC107' : 'color:#F44336';
      const confBadge = ev.confidence === 'High'
        ? '<span class="badge badge-active">High</span>'
        : '<span class="badge badge-pending">Mid</span>';
      const callTypeBadge = (ev.callType || callType) === 'I/B'
        ? '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>'
        : '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>';

      // 이슈 + 감점항목
      const items = ev.deductionItems || (ev.deductionItem ? [ev.deductionItem] : []);
      const deductionDisplay = items.length > 3 ? items.slice(0,3).join(', ') + ', ...' : items.join(', ');
      let issueText = '';
      if (ev.urgentIssue) issueText += '<span style="display:inline-block;padding:2px 6px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:10px;font-weight:600;">긴급</span> ';
      if (ev.issue) issueText += '<span style="font-size:11px;color:#F57F17;">' + ev.issue + '</span>';
      if (deductionDisplay) issueText += (issueText ? '<br>' : '') + '<span style="font-size:10px;color:#9E9E9E;" title="' + items.join(', ') + '">감점: ' + deductionDisplay + '</span>';
      if (!issueText) issueText = '<span style="color:#9E9E9E;font-size:11px;">-</span>';

      const infoRow = (label, value) => `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #F0F0F0;"><span style="font-size:11px;color:#9E9E9E;white-space:nowrap;">${label}</span><span style="font-size:12px;font-weight:500;text-align:right;margin-left:8px;">${value}</span></div>`;

      AICC_Modal.open({
        title: `평가 상세 - ${ev.id}`,
        size: 'xxl',
        content: `
          <div style="display:grid;grid-template-columns:300px 1fr 400px;gap:20px;height:calc(90vh - 140px);max-height:650px;">
            <!-- 왼쪽: 콜 정보 -->
            <div style="overflow-y:auto;padding-right:8px;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;">콜 정보</div>
              ${infoRow('평가 ID', '<span style="font-family:monospace;font-size:11px;">' + ev.id + '</span>')}
              ${infoRow('일시', ev.date + ' ' + ev.time)}
              ${infoRow('센터', wsName)}
              ${infoRow('팀', teamName)}
              ${infoRow('상담사', agentName)}
              ${infoRow('상담 유형', '<span style="font-size:11px;">' + (ev.category || simConsultType) + '</span>')}
              ${infoRow('유형', callTypeBadge)}
              ${infoRow('평가방식', AICC_Fmt.typeBadge(ev.type))}
              ${infoRow('평가표', '<span style="font-size:11px;">' + simEvalForm + '</span>')}
              ${infoRow('통화시간', ev.duration)}
              ${infoRow('신뢰도', confBadge)}
              ${infoRow('점수', '<strong style="font-size:16px;' + scoreColor + '">' + AICC_Fmt.score(ev.score) + '점</strong>')}
              <div style="padding:6px 0;">${infoRow('이슈', issueText)}</div>

              <div style="margin-top:12px;background:#F5F5F5;border-radius:6px;padding:10px 12px;font-size:11px;line-height:1.6;">
                <strong style="color:#424242;">AI 피드백</strong><br>
                <span style="color:#757575;">${simFeedback}</span>
              </div>
            </div>

            <!-- 중간: 스크립트 + 플레이어 -->
            <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">스크립트</div>
              <div id="transcript-container" style="flex:1;min-height:0;background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;padding:12px;overflow-y:auto;">
                ${transcriptHtml}
              </div>
              <div style="margin-top:10px;background:#F5F5F5;border:1px solid #E0E0E0;border-radius:8px;padding:10px 14px;flex-shrink:0;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <button onclick="togglePlay(this)" style="background:none;border:none;cursor:pointer;padding:0;">
                    <svg id="play-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="#424242"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  </button>
                  <div style="flex:1;">
                    <div style="width:100%;height:4px;background:#BDBDBD;border-radius:2px;position:relative;cursor:pointer;" onclick="seekBar(event)">
                      <div id="player-progress" style="width:0%;height:100%;background:#00A3FF;border-radius:2px;transition:width 0.2s;"></div>
                    </div>
                  </div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-left:30px;">
                  <span id="player-time" style="font-size:10px;color:#757575;">0:00</span>
                  <span id="player-segment-label" style="font-size:10px;color:#00A3FF;"></span>
                  <span style="font-size:10px;color:#757575;">${ev.duration || '0:00'}</span>
                </div>
              </div>
            </div>

            <!-- 오른쪽: 항목별 점수 -->
            <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">항목별 점수</div>
              <div style="flex:1;min-height:0;overflow-y:auto;">
                <table class="data-table" style="font-size:11px;table-layout:fixed;width:100%;">
                  <colgroup>
                    <col style="width:30%;">
                    <col style="width:15%;">
                    <col style="width:15%;">
                    <col style="width:15%;">
                    <col style="width:25%;">
                  </colgroup>
                  <thead>
                    <tr>
                      <th style="padding:6px 4px;text-align:center;">평가 항목</th>
                      <th style="padding:6px 4px;text-align:center;">방식</th>
                      <th style="padding:6px 4px;text-align:center;">점수</th>
                      <th style="padding:6px 4px;text-align:center;">신뢰도</th>
                      <th style="padding:6px 4px;text-align:center;">상태</th>
                    </tr>
                  </thead>
                  <tbody>${scoreRows}</tbody>
                </table>
              </div>
            </div>
          </div>
        `,
        footer: `
          <button class="btn btn-primary" onclick="openManualReview('${ev.id}')">수동 검증</button>
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
        `
      });
    }

    // 항목별 점수 행 클릭 → 스크립트 영역의 해당 구간으로 스크롤 + 자동 재생
    function scrollToTranscript(scoreIdx) {
      const container = document.getElementById('transcript-container');
      if (!container) return;
      const lines = container.querySelectorAll('.transcript-line');
      if (!lines.length) return;
      // 모달 내 점수 테이블의 tbody tr 수로 총 항목 수를 파악하여 비율 매핑
      const scoreRowCount = document.querySelectorAll('.modal-container .data-table tbody tr').length || 1;
      const mappedIdx = Math.min(Math.floor(scoreIdx * (lines.length / scoreRowCount)), lines.length - 1);
      const targetLine = lines[Math.max(0, mappedIdx)];
      if (!targetLine) return;
      targetLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const time = targetLine.querySelector('div')?.textContent?.trim() || '0:00';
      playSegment(targetLine, time);
    }

    // 모달 내 탭 전환 — 3컬럼에서는 사용하지 않지만 하위 호환 유지
    function switchDetailTab(btn, tabId) {
      btn.parentElement.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const scores = document.getElementById('scores-tab');
      const script = document.getElementById('script-tab');
      if (scores) scores.style.display = tabId === 'scores-tab' ? '' : 'none';
      if (script) script.style.display = tabId === 'script-tab' ? '' : 'none';
    }

    // 스크립트 라인 클릭 시 해당 구간 재생 시뮬레이션 — 이전 하이라이트를 해제하고 현재 라인만 활성화
    function playSegment(el, time) {
      document.querySelectorAll('.transcript-line').forEach(line => {
        line.classList.remove('playing');
        line.style.background = '';
      });
      el.classList.add('playing');
      // SVG fill 색상(#00A3FF=상담사)으로 화자를 구분하여 각기 다른 하이라이트 색상 적용
      el.style.background = el.querySelector('[fill="#00A3FF"]') ? '#B3E5FC' : '#EEEEEE';

      const label = document.getElementById('player-segment-label');
      if (label) label.textContent = '\u25B6 ' + time + ' 구간 재생 중';

      const timeEl = document.getElementById('player-time');
      if (timeEl) timeEl.textContent = time;

      const progress = document.getElementById('player-progress');
      if (progress) {
        const pct = Math.min(95, Math.max(5, Math.random() * 80 + 10));
        progress.style.width = pct + '%';
      }

      const playIcon = document.getElementById('play-btn-icon');
      if (playIcon) playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';

      AICC_Toast.show(`${time} 구간 재생 (시뮬레이션)`);
    }

    // SVG innerHTML 내 polygon(▶) / rect(⏸) 존재 여부로 재생 상태를 판별하는 토글 방식
    function togglePlay(btn) {
      const icon = document.getElementById('play-btn-icon');
      if (!icon) return;
      const isPaused = icon.innerHTML.includes('polygon');
      if (isPaused) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';
        AICC_Toast.show('재생 시작 (시뮬레이션)');
      } else {
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        AICC_Toast.show('일시 정지 (시뮬레이션)');
      }
    }

    // 프로그레스 바 클릭 위치의 상대 좌표(%)를 계산하여 재생 위치 시뮬레이션
    function seekBar(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const progress = document.getElementById('player-progress');
      if (progress) progress.style.width = pct + '%';
    }

    // 수동 검증 페이지 이동 stub — 실제 구현 시 evalId를 쿼리파라미터로 전달 예정
    function openManualReview(evalId) {
      AICC_Toast.show('수동 검증 화면으로 이동합니다. (시뮬레이션)');
    }

    /* ========== 필터 ========== */
    // 기간·유형·점수 필터 적용 stub — 실제 구현 시 현재 레벨의 데이터를 재조회하여 렌더링
    function applyPeriodFilter() {
      AICC_Toast.show('필터가 적용되었습니다. (시뮬레이션)');
    }
  </script>
</body>
</html>
