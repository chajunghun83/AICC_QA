      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">상세 분석</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">센터 / 팀 / 상담사 단위 드릴다운 분석</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="period-picker-container"></div>
      </div>
    </div>

    <!-- 브레드크럼 네비게이션 -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:12px 20px;background:white;border:1px solid #E0E0E0;border-radius:8px;">
      <button class="btn btn-secondary btn-sm" id="back-btn" onclick="goBack()" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        뒤로
      </button>
      <div id="breadcrumb" style="display:flex;align-items:center;gap:6px;font-size:13px;">
        <span style="font-weight:600;color:#00A3FF;">전체</span>
      </div>
    </div>

    <!-- KPI 카드 -->
    <div style="display:grid;grid-template-columns:0.7fr 1.3fr 1.3fr 0.7fr;gap:16px;margin-bottom:20px;" id="kpi-cards">
      <!-- JS로 동적 생성 -->
    </div>

    <!-- AI 개선 제안 롤링 바 -->
    <div id="da-suggestion-bar" style="display:none;margin-bottom:16px;padding:12px 20px;background:linear-gradient(135deg,#EDE7F6 0%,#E8EAF6 100%);border-radius:8px;border:1px solid #D1C4E9;align-items:center;gap:30px;"
         onmouseenter="daPauseSuggestionRolling()" onmouseleave="daResumeSuggestionRolling()">
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z" fill="#7C4DFF"/><rect x="9" y="19" width="6" height="2" rx="1" fill="#7C4DFF" opacity="0.6"/><circle cx="12" cy="9" r="2" fill="#fff" opacity="0.8"/></svg>
        <span style="font-size:12px;font-weight:700;color:#5E35B1;white-space:nowrap;">AI 개선 제안</span>
      </div>
      <div style="flex:1;overflow:hidden;height:20px;position:relative;">
        <div id="da-suggestion-text" style="font-size:13px;color:#424242;line-height:20px;position:absolute;width:100%;transition:all 0.4s ease;"></div>
      </div>
      <div style="display:flex;align-items:center;gap:2px;flex-shrink:0;">
        <button type="button" onclick="daPrevSuggestion()" title="이전 제안" aria-label="이전 제안" style="background:transparent;border:1px solid #D1C4E9;border-radius:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E35B1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </button>
        <span id="da-suggestion-counter" style="font-size:11px;color:#5E35B1;min-width:32px;text-align:center;font-weight:600;">1/1</span>
        <button type="button" onclick="daNextSuggestion()" title="다음 제안" aria-label="다음 제안" style="background:transparent;border:1px solid #D1C4E9;border-radius:4px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5E35B1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <button class="btn btn-sm" onclick="daOpenActionModal()" style="flex-shrink:0;background:#5E35B1;color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">조치 등록</button>
    </div>

        <span style="font-size:12px;color:#757575;" id="table-count"></span>
      </div>
      <div class="content-card-body" style="padding:0;">

          </thead>
          <tbody id="table-body">
            <!-- JS로 동적 생성 -->
          </tbody>
        </table>
      </div>
      <div id="table-pagination" class="pagination"></div>
    </div>
  </div>

    /* ========== 상태 관리 ========== */
    let currentLevel = 0; // 0=전체, 1=센터, 2=팀, 3=상담사
    let navStack = []; // [{level, label, data}]
    let activeFilter = null;

    // 상세분석 카드 클릭 → 부모(integrated-evaluation)의 하단 통합 평가 결과 테이블 필터링
    // iframe 내부 테이블은 영향 받지 않음. 활성 카드는 시각 하이라이트 + 부모 postMessage 송신.
    let daActiveCardKey = null;
    let daCurrentTopItem = null; // topDeduction 카드의 현재 1위 항목명

    const FILTER_LABELS = {
      urgentIssue: '긴급 이슈',
      topDeduction: '최다 감점 항목',
      lowScore: '70점 이하 콜',
      excluded: '평가 제외 상담사'
    };

    // 현재 노드 컨텍스트(센터·팀·상담사 이름) 반환 — 부모에 base 필터로 전달
    function getNodeContext() {
      return {
        level: currentLevel,
        center_name: navStack[0]?.label || null,
        team_name: navStack[1]?.label || null,
        agent_name: navStack[2]?.label || null
      };
    }

    // 카드/sub-cell 클릭 시 부모에 da-card-filter 메시지 송신.
    // 같은 카드 재클릭 시 kind=null 로 보내 base 필터로 복귀시킨다.
    function onCardClick(card) {
      const cardKey = card.kind || card.label || 'scope';
      const same = daActiveCardKey === cardKey;
      const effectiveKind = same ? null : (card.kind || null);
      const effectiveLabel = same ? null : (card.label || cardKey);
      daActiveCardKey = same ? null : cardKey;

      // 활성 카드 시각 하이라이트
      updateCardHighlight(daActiveCardKey);

      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({
        type: 'da-card-filter',
        ...getNodeContext(),
        kind: effectiveKind,
        deduction_item: effectiveKind === 'topDeduction' ? daCurrentTopItem : null,
        label: effectiveLabel
      }, '*');
    }

    // 노드 이동(drillTo*, goToLevel, renderLevel*)에서 호출 — 부모에 새 base 필터 알림
    function notifyNodeChange() {
      daActiveCardKey = null;
      // 카드 하이라이트는 다음 render*가 새로 그리므로 별도 호출 불필요
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({
        type: 'da-node-change',
        ...getNodeContext()
      }, '*');
    }

    function filterByCard(filterKey) {
      if (currentLevel !== 2 && currentLevel !== 3) return;
      const ctx = navStack[navStack.length - 1]?.data;
      if (!ctx) return;

      if (currentLevel === 2) {
        const { ws, team } = ctx;
        const agents = team.agents;
        if (activeFilter === filterKey) {
          activeFilter = null;
          renderLevel2Table(ws, team, agents);
          updateCardHighlight(null);
          daShowSuggestionBar();
          return;
        }
        activeFilter = filterKey;
        let filtered;
        switch (filterKey) {
          case 'urgentIssue': filtered = agents.filter(a => a.urgentIssue); break;
          case 'topDeduction': filtered = agents.filter(a => a.topDeductionItem === team.topDeduction.item); break;
          case 'lowScore': filtered = agents.filter(a => a.evaluations?.some(e => e.score <= 70)); break;
          case 'excluded': filtered = agents.filter(a => a.excluded); break;
          default: filtered = agents;
        }
        renderLevel2Table(ws, team, filtered, FILTER_LABELS[filterKey]);
        updateCardHighlight(filterKey);
        daShowSuggestionBar();
        return;
      }

      // Level 3: 상담사 평가 이력 필터
      const { ws, team, agent } = ctx;
      const evals = agent.evaluations;
      if (activeFilter === filterKey) {
        activeFilter = null;
        renderLevel3Table(ws, team, agent, evals);
        updateCardHighlight(null);
        daShowSuggestionBar();
        return;
      }
      activeFilter = filterKey;
      let filtered;
      const deductionMap = {};
      evals.forEach(e => {
        const items = e.deductionItems || (e.deductionItem ? [e.deductionItem] : []);
        items.forEach(item => { deductionMap[item] = (deductionMap[item] || 0) + 1; });
      });
      let topItem = '';
      let topCnt = 0;
      Object.entries(deductionMap).forEach(([item, cnt]) => { if (cnt > topCnt) { topItem = item; topCnt = cnt; } });

      switch (filterKey) {
        case 'urgentIssue': filtered = evals.filter(e => e.urgentIssue); break;
        case 'topDeduction': filtered = evals.filter(e => (e.deductionItems || (e.deductionItem ? [e.deductionItem] : [])).includes(topItem)); break;
        case 'lowScore': filtered = evals.filter(e => e.score <= 70); break;
        default: filtered = evals;
      }
      renderLevel3Table(ws, team, agent, filtered, FILTER_LABELS[filterKey]);
      updateCardHighlight(filterKey);
      daShowSuggestionBar();
    }

    function updateCardHighlight(activeKey) {
      // 카드 본체 하이라이트 (data-card-kind 또는 legacy data-filter-key 지원)
      document.querySelectorAll('#kpi-cards [data-card-kind], #kpi-cards [data-filter-key]').forEach(el => {
        const key = el.getAttribute('data-card-kind') || el.getAttribute('data-filter-key');
        const icon = el.querySelector(':scope > svg');
        if (key === activeKey) {
          el.style.border = '2px solid #3b82f6';
          el.style.boxShadow = '0 0 0 1px #3b82f6';
          if (icon) icon.setAttribute('stroke', '#3b82f6');
        } else {
          el.style.border = '';
          el.style.boxShadow = '';
          if (icon) icon.setAttribute('stroke', '#BDBDBD');
        }
      });
      // sub-cell 하이라이트 (data-sub-kind)
      document.querySelectorAll('#kpi-cards [data-sub-kind]').forEach(el => {
        const key = el.getAttribute('data-sub-kind');
        if (key === activeKey) {
          el.style.background = '#E3F2FD';
          el.style.outline = '1px solid #1976D2';
        } else {
          el.style.background = 'transparent';
          el.style.outline = '';
        }
      });
    }
    let dashboardSummary = null;

    // URL 파라미터(?ct=&team=) 기반 딥링크를 지원하여, 다른 페이지에서 특정 팀으로 바로 진입 가능
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      // iframe embed 모드: 페이지 제목 숨김, 배경 투명 처리
      if (params.has('embed')) {
        const titleEl = document.getElementById('da-page-title');
        if (titleEl) titleEl.style.display = 'none';
        document.body.style.background = 'transparent';
      }

      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function() { applyPeriodFilter(); }
      });

      const dsData = await AICC_DataLoader.load('dashboard-stats.json');
      if (dsData) dashboardSummary = dsData.summary;
      const wsName = params.get('ct');
      const teamName = params.get('team');

      const agentName = params.get('agent');
      if (wsName && teamName && agentName) {
        const ws = DUMMY.centers.find(w => w.name === wsName);
        if (ws) {
          const team = ws.teams.find(t => t.name === teamName);
          if (team) {
            const agent = team.agents.find(a => a.name === agentName);
            if (agent) {
              drillToAgent(ws.id, team.id, agent.id);
              return;
            }
          }
        }
      } else if (wsName && teamName) {
        const ws = DUMMY.centers.find(w => w.name === wsName);
        if (ws) {
          const team = ws.teams.find(t => t.name === teamName);
          if (team) {
            drillToTeam(ws.id, team.id);
            return;
          }
        }
      }
      renderLevel0();
    });

    /* ========== 브레드크럼 ========== */
    // navStack을 순회하며 클릭 가능한 경로 링크를 생성하되, 마지막 항목만 비활성화하여 현재 위치 표시
    function updateBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      const backBtn = document.getElementById('back-btn');

      let parts = ['<span style="cursor:pointer;color:#00A3FF;" onclick="goToLevel(0)">전체</span>'];
      navStack.forEach((item, idx) => {
        const isLast = idx === navStack.length - 1;
        if (isLast) {
          parts.push(`<span style="font-weight:600;">${item.label}</span>`);
        } else {
          parts.push(`<span style="cursor:pointer;color:#00A3FF;" onclick="goToLevel(${idx + 1})">${item.label}</span>`);
        }
      });

      bc.innerHTML = parts.join('<span style="color:#BDBDBD;margin:0 2px;">/</span>');
      backBtn.style.display = currentLevel > 0 ? '' : 'none';
    }

    // navStack을 slice하여 원하는 레벨로 점프 — 브레드크럼 클릭 시 중간 레벨 복원에 사용
    function goToLevel(level) {
      if (level === 0) {
        currentLevel = 0;
        navStack = [];
        renderLevel0();
      } else if (level <= navStack.length) {
        navStack = navStack.slice(0, level);
        currentLevel = level;
        const item = navStack[level - 1];
        if (level === 1) renderLevel1(item.data);
        else if (level === 2) renderLevel2(item.data);
        else if (level === 3) renderLevel3(item.data);
      }
      updateBreadcrumb();
    }

    function goBack() {
      if (currentLevel > 0) {
        goToLevel(currentLevel - 1);
      }
    }

    /* ========== 페이지네이션 렌더링 ========== */
    function renderPagination(totalItems, currentPage, pageSize) {
      const container = document.getElementById('table-pagination');
      if (!container) return;
      const totalPages = 5;

      let html = '';
      html += `<button class="pagination-btn">&laquo;</button>`;
      for (let p = 1; p <= totalPages; p++) {
        html += `<button class="pagination-btn${p === currentPage ? ' active' : ''}">${p}</button>`;
      }
      html += `<button class="pagination-btn">&raquo;</button>`;
      html += `<span style="margin-left:16px;font-size:12px;color:#757575;">페이지당:
        <select class="form-select" style="min-width:60px;padding:2px 24px 2px 8px;">
          <option>10</option>
          <option selected>20</option>
          <option>50</option>
        </select>
      </span>`;

      container.innerHTML = html;
    }

    /* ========== KPI 카드 렌더링 ========== */
    // 범용 KPI 렌더러 — 레벨별로 다른 지표를 동일한 카드 형태로 표현하기 위해 items 배열 기반 설계
    function renderKPI(items) {
      const container = document.getElementById('kpi-cards');
      container.style.display = 'grid';
      container.style.gridTemplateColumns = '0.7fr 1.3fr 1.3fr 0.7fr';
      container.style.flexDirection = '';
      container.innerHTML = items.map(card => {
        let trendHtml = '';
        if (card.isDuration) {
          const toSec = (s) => { const p = s.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); };
          const cur = toSec(card.current), prev = toSec(card.prev);
          const diffSec = cur - prev;
          if (diffSec !== 0) {
            const arrow = diffSec < 0 ? '↓' : '↑';
            const color = diffSec < 0 ? '#4CAF50' : '#F44336';
            const absDiff = Math.abs(diffSec);
            const m = Math.floor(absDiff / 60), s = absDiff % 60;
            trendHtml = `<span style="font-size:12px;color:${color};">${arrow} ${m > 0 ? m + '분 ' : ''}${s}초</span>`;
          }
        } else if (card.current !== undefined && card.prev !== undefined) {
          trendHtml = AICC_Fmt.trend(card.current, card.prev);
        }

        if (card.isCallBreakdown) {
          const pct = (done, total) => total > 0 ? Math.round(done / total * 100) : 0;
          const bd = [
            { label: '자동/IB', total: card.autoIB, done: card.autoIB_done, totalPrev: card.autoIB_prev, donePrev: card.autoIB_done_prev },
            { label: '자동/OB', total: card.autoOB, done: card.autoOB_done, totalPrev: card.autoOB_prev, donePrev: card.autoOB_done_prev },
            { label: '수동',    total: card.manual,  done: card.manual_done, totalPrev: card.manual_prev, donePrev: card.manual_done_prev }
          ];
          const maxNum = Math.max(...bd.map(b => Math.max(b.total, b.done)));
          const curFs = maxNum >= 100000 ? 9 : maxNum >= 10000 ? 10 : 12;
          const prevMax = Math.max(...bd.map(b => Math.max(b.totalPrev, b.donePrev)));
          const prevFs = prevMax >= 100000 ? 8 : prevMax >= 10000 ? 9 : 10;
          const colHeaders = bd.map(b => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${b.label}</span>`).join('');
          const colCurrent = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#42A5F5;">${AICC_Fmt.number(b.total)}</span> <span style="color:#BDBDBD;">/</span> <span style="color:#424242;font-weight:600;">${AICC_Fmt.number(b.done)}건</span></span>`;
            const pctPart = `<span style="color:#424242;font-weight:600;">(${pct(b.done, b.total)}%)</span>`;
            return `<span style="text-align:center;font-size:${curFs}px;">${numPart}<br>${pctPart}</span>`;
          }).join('');
          const colPrev = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#90CAF9;">${AICC_Fmt.number(b.totalPrev)}</span> <span style="color:#D5D5D5;">/</span> <span style="color:#BDBDBD;">${AICC_Fmt.number(b.donePrev)}건</span></span>`;
            const pctPart = `<span style="color:#BDBDBD;">(${pct(b.donePrev, b.totalPrev)}%)</span>`;
            return `<span style="text-align:center;font-size:${prevFs}px;">${numPart}<br>${pctPart}</span>`;
          }).join('');
          return `
          <div class="kpi-card fade-in">
            <div style="display:flex;align-items:flex-start;gap:12px;">
              <div style="flex-shrink:0;">
                <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
                <div style="display:flex;align-items:baseline;gap:8px;">
                  <span style="font-size:28px;font-weight:700;">${card.value}</span>
                  ${trendHtml}
                </div>
                <div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div>
              </div>
              <div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">
                ${colHeaders}
                ${colCurrent}
                ${colPrev}
              </div>
            </div>
          </div>
          `;
        }

        if (card.isScoreBreakdown) {
          const sb = [
            { label: '자동/IB', score: card.scoreIB, scorePrev: card.scoreIB_prev },
            { label: '자동/OB', score: card.scoreOB, scorePrev: card.scoreOB_prev },
            { label: '수동',    score: card.scoreManual, scorePrev: card.scoreManual_prev }
          ];
          const sHeaders = sb.map(s => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${s.label}</span>`).join('');
          const sScores = sb.map(s => `<span style="text-align:center;font-size:12px;font-weight:600;white-space:nowrap;color:#424242;">${AICC_Fmt.score(s.score)}점</span>`).join('');
          const sPrev = sb.map(s => `<span style="text-align:center;font-size:10px;white-space:nowrap;color:#BDBDBD;">${AICC_Fmt.score(s.scorePrev)}점</span>`).join('');
          return `
          <div class="kpi-card fade-in">
            <div style="display:flex;align-items:flex-start;gap:12px;">
              <div style="flex-shrink:0;">
                <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
                <div style="display:flex;align-items:baseline;gap:8px;">
                  <span style="font-size:28px;font-weight:700;">${card.value}</span>
                  ${trendHtml}
                </div>
                <div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div>
              </div>
              <div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">
                ${sHeaders}
                ${sScores}
                ${sPrev}
              </div>
            </div>
          </div>
          `;
        }

        if (card.isTopDeduction) {
          const td = card.deductionData;
          return `
          <div class="kpi-card fade-in">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="font-size:18px;font-weight:700;color:#424242;margin-top:4px;">${td.item}</div>
            <div style="font-size:13px;color:#F44336;font-weight:600;margin-top:6px;">${td.calls}콜 (${td.pct}%)</div>
          </div>
          `;
        }

        if (card.isLowScore) {
          return `
          <div class="kpi-card fade-in">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;">
              <span style="font-size:28px;font-weight:700;color:#F44336;">${card.lowCalls}콜</span>
              <span style="font-size:14px;font-weight:600;color:#757575;">(${card.lowPct}%)</span>
            </div>
          </div>
          `;
        }

        const scoreColor = card.isScore ? `color:${AICC_Fmt.scoreColor(card.current)}` : '';
        return `
          <div class="kpi-card fade-in">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span style="font-size:28px;font-weight:700;${scoreColor}">${card.value}</span>
              ${trendHtml}
            </div>
            ${card.sub ? `<div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.sub}</div>` : ''}
            ${card.prevLabel ? `<div style="font-size:11px;color:#9E9E9E;margin-top:4px;">${card.prevLabel}: ${typeof card.prev === 'number' ? AICC_Fmt.number(card.prev) : card.prev}${card.unit || ''}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // 2행 KPI 카드 렌더링 — row1/row2 배열을 받아 #kpi-cards에 2행 그리드로 표현
    function renderKpiTwoRows(row1, row2, customGridCols) {
      const container = document.getElementById('kpi-cards');
      const cols = customGridCols || '0.9fr 1.3fr 0.9fr 0.9fr';
      const gridStyle = `display:grid;grid-template-columns:${cols};gap:16px;`;
      const searchIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;top:10px;right:10px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`;
      // 모든 카드를 하단 통합 평가 결과 테이블 필터링용으로 클릭 가능하게 변경.
      // 작용 카드(filterKey 보유: urgentIssue/topDeduction/lowScore/excluded)는 돋보기 아이콘 표시,
      // 정보성 카드는 외관 그대로 유지하되 클릭 시 base 필터(노드 전체 콜) 전달.
      const cardOpen = (card) => {
        const kind = card.kind || card.filterKey || null;
        const payload = JSON.stringify({ kind, label: card.label || card.kind || '' }).replace(/"/g, '&quot;');
        const indicator = kind && ['urgentIssue','topDeduction','lowScore','excluded'].includes(kind) ? searchIcon : '';
        return `<div class="kpi-card fade-in" data-card-kind="${kind || 'scope'}" onclick="onCardClick(${payload})" style="position:relative;cursor:pointer;">${indicator}`;
      };
      const cardClose = '</div>';
      // sub-cell(자동/IB·자동/OB·수동) 별도 클릭 영역. 카드 본체로 이벤트 버블링 차단.
      const subCellAttr = (kind, label, tip) => {
        const payload = JSON.stringify({ kind, label }).replace(/"/g, '&quot;');
        return `onclick="event.stopPropagation(); onCardClick(${payload})" `
             + `onmouseenter="this.style.background='#F5F5F5'" `
             + `onmouseleave="this.style.background='transparent'" `
             + `title="${tip}" `
             + `style="cursor:pointer;border-radius:4px;padding:2px 4px;text-align:center;"`;
      };

      const renderRow = (items) => items.map(card => {
        let trendHtml = '';
        if (card.isDuration) {
          const toSec = (s) => { const p = s.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); };
          const cur = toSec(card.current), prev = toSec(card.prev);
          const diffSec = cur - prev;
          if (diffSec !== 0) {
            const arrow = diffSec < 0 ? '↓' : '↑';
            const color = diffSec < 0 ? '#4CAF50' : '#F44336';
            const absDiff = Math.abs(diffSec);
            const m = Math.floor(absDiff / 60), s = absDiff % 60;
            trendHtml = `<span style="font-size:12px;color:${color};">${arrow} ${m > 0 ? m + '분 ' : ''}${s}초</span>`;
          }
        } else if (card.current !== undefined && card.prev !== undefined && !card.isTopDeduction && !card.isLowScore) {
          trendHtml = AICC_Fmt.trend(card.current, card.prev);
        }
        if (card.isCallBreakdown) {
          const pct = (done, total) => total > 0 ? Math.round(done / total * 100) : 0;
          const SUB_KIND_MAP = { '자동/IB': 'autoIB', '자동/OB': 'autoOB', '수동': 'manualOnly' };
          const SUB_TIP_MAP = {
            '자동/IB': '자동 평가 I/B 콜만 필터링',
            '자동/OB': '자동 평가 O/B 콜만 필터링',
            '수동':    '수동 평가 콜만 필터링'
          };
          const bd = [
            { label: '자동/IB', total: card.autoIB, done: card.autoIB_done, totalPrev: card.autoIB_prev, donePrev: card.autoIB_done_prev },
            { label: '자동/OB', total: card.autoOB, done: card.autoOB_done, totalPrev: card.autoOB_prev, donePrev: card.autoOB_done_prev },
            { label: '수동',    total: card.manual,  done: card.manual_done, totalPrev: card.manual_prev, donePrev: card.manual_done_prev }
          ];
          const maxNum = Math.max(...bd.map(b => Math.max(b.total, b.done)));
          const curFs = maxNum >= 100000 ? 9 : maxNum >= 10000 ? 10 : 12;
          const prevMax = Math.max(...bd.map(b => Math.max(b.totalPrev, b.donePrev)));
          const prevFs = prevMax >= 100000 ? 8 : prevMax >= 10000 ? 9 : 10;
          const colHeaders = bd.map(b => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${b.label}</span>`).join('');
          // 각 sub-cell 을 클릭 가능 영역으로 — 카드 본체 클릭과 분리(stopPropagation)
          const colCurrent = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#42A5F5;">${AICC_Fmt.number(b.total)}</span> <span style="color:#BDBDBD;">/</span> <span style="color:#424242;font-weight:600;">${AICC_Fmt.number(b.done)}건</span></span>`;
            const pctPart = `<span style="color:#424242;font-weight:600;">(${pct(b.done, b.total)}%)</span>`;
            return `<span ${subCellAttr(SUB_KIND_MAP[b.label], '평가 건수 / ' + b.label, SUB_TIP_MAP[b.label])} data-sub-kind="${SUB_KIND_MAP[b.label]}">`
                 + `<span style="font-size:${curFs}px;display:inline-block;">${numPart}<br>${pctPart}</span>`
                 + `</span>`;
          }).join('');
          const colPrev = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#90CAF9;">${AICC_Fmt.number(b.totalPrev)}</span> <span style="color:#D5D5D5;">/</span> <span style="color:#BDBDBD;">${AICC_Fmt.number(b.donePrev)}건</span></span>`;
            const pctPart = `<span style="color:#BDBDBD;">(${pct(b.donePrev, b.totalPrev)}%)</span>`;
            return `<span style="text-align:center;font-size:${prevFs}px;">${numPart}<br>${pctPart}</span>`;
          }).join('');
          return `${cardOpen(card)}<div style="display:flex;align-items:flex-start;gap:12px;"><div style="flex-shrink:0;"><div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:28px;font-weight:700;">${card.value}</span>${trendHtml}</div><div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div></div><div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">${colHeaders}${colCurrent}${colPrev}</div></div>${cardClose}`;
        }
        if (card.isScoreBreakdown) {
          const SUB_KIND_MAP_S = { '자동/IB': 'autoIB', '자동/OB': 'autoOB', '수동': 'manualOnly' };
          const SUB_TIP_MAP_S = {
            '자동/IB': '자동 평가 I/B 콜만 필터링',
            '자동/OB': '자동 평가 O/B 콜만 필터링',
            '수동':    '수동 평가 콜만 필터링'
          };
          const sb = [
            { label: '자동/IB', score: card.scoreIB, scorePrev: card.scoreIB_prev },
            { label: '자동/OB', score: card.scoreOB, scorePrev: card.scoreOB_prev },
            { label: '수동',    score: card.scoreManual, scorePrev: card.scoreManual_prev }
          ];
          const sHeaders = sb.map(s => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${s.label}</span>`).join('');
          const sScores = sb.map(s => {
            return `<span ${subCellAttr(SUB_KIND_MAP_S[s.label], '평균 평가 점수 / ' + s.label, SUB_TIP_MAP_S[s.label])} data-sub-kind="${SUB_KIND_MAP_S[s.label]}">`
                 + `<span style="font-size:12px;font-weight:600;white-space:nowrap;color:#424242;">${AICC_Fmt.score(s.score)}점</span>`
                 + `</span>`;
          }).join('');
          const sPrev = sb.map(s => `<span style="text-align:center;font-size:10px;white-space:nowrap;color:#BDBDBD;">${AICC_Fmt.score(s.scorePrev)}점</span>`).join('');
          return `${cardOpen(card)}<div style="display:flex;align-items:flex-start;gap:12px;"><div style="flex-shrink:0;"><div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:28px;font-weight:700;">${card.value}</span>${trendHtml}</div><div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div></div><div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:4px;margin-top:2px;">${sHeaders}${sScores}${sPrev}</div></div>${cardClose}`;
        }
        if (card.isTopDeduction) {
          const td = card.deductionData;
          return `${cardOpen(card)}<div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="font-size:18px;font-weight:700;color:#424242;margin-top:4px;">${td.item}</div><div style="font-size:13px;color:#F44336;font-weight:600;margin-top:6px;">${td.calls}콜 (${td.pct}%)</div>${cardClose}`;
        }
        if (card.isRankBreakdown) {
          // L3 "팀 내 순위" 카드 — 좌측 큰 숫자(순위) + 우측 2컬럼(팀 평균 | 본인 평균)
          // 본인 평균: 팀 평균보다 높으면 파란색, 낮으면 빨간색으로 비교 결과 즉시 인지
          const myColor = card.myAvg > card.teamAvg ? '#1976D2' : (card.myAvg < card.teamAvg ? '#F44336' : '#424242');
          const myColorPrev = card.myAvg_prev > card.teamAvg_prev ? '#90CAF9' : (card.myAvg_prev < card.teamAvg_prev ? '#EF9A9A' : '#BDBDBD');
          const rb = [
            { label: '팀 평균',   cur: card.teamAvg, prev: card.teamAvg_prev, curColor: '#424242', prevColor: '#BDBDBD' },
            { label: '본인 평균', cur: card.myAvg,   prev: card.myAvg_prev,   curColor: myColor,   prevColor: myColorPrev }
          ];
          const rHeaders = rb.map(s => `<span style="text-align:center;font-size:11px;color:#9E9E9E;">${s.label}</span>`).join('');
          const rCur = rb.map(s => `<span style="text-align:center;font-size:12px;font-weight:600;white-space:nowrap;color:${s.curColor};">${AICC_Fmt.score(s.cur)}점</span>`).join('');
          const rPrev = rb.map(s => `<span style="text-align:center;font-size:10px;white-space:nowrap;color:${s.prevColor};">${AICC_Fmt.score(s.prev)}점</span>`).join('');
          return `${cardOpen(card)}<div style="display:flex;align-items:flex-start;gap:12px;"><div style="flex-shrink:0;"><div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:28px;font-weight:700;">${card.value}</span>${trendHtml}</div>${card.sub ? `<div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.sub}</div>` : ''}${card.prevLabel ? `<div style="font-size:11px;color:#9E9E9E;margin-top:4px;">${card.prevLabel}: ${typeof card.prev === 'number' ? AICC_Fmt.number(card.prev) : card.prev}${card.unit || ''}</div>` : ''}</div><div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(2,1fr);row-gap:4px;margin-top:2px;">${rHeaders}${rCur}${rPrev}</div></div>${cardClose}`;
        }
        if (card.isLowScore) {
          return `${cardOpen(card)}<div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;"><span style="font-size:28px;font-weight:700;color:#F44336;">${card.lowCalls}콜</span><span style="font-size:14px;font-weight:600;color:#757575;">(${card.lowPct}%)</span></div>${cardClose}`;
        }
        return `${cardOpen(card)}<div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div><div style="display:flex;align-items:baseline;gap:8px;"><span style="font-size:28px;font-weight:700;">${card.value}</span>${trendHtml}</div>${card.sub ? `<div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.sub}</div>` : ''}${card.prevLabel ? `<div style="font-size:11px;color:#9E9E9E;margin-top:4px;">${card.prevLabel}: ${typeof card.prev === 'number' ? AICC_Fmt.number(card.prev) : card.prev}${card.unit || ''}</div>` : ''}${cardClose}`;
      }).join('');
      container.style.display = 'flex';
      container.style.flexDirection = 'column';
      container.style.gridTemplateColumns = '';
      container.style.gap = '16px';
      container.innerHTML = `<div style="${gridStyle}">${renderRow(row1)}</div><div style="${gridStyle}">${renderRow(row2)}</div>`;
    }

    /* ========== Level 0: 센터 목록 ========== */
    // 최상위 뷰: 전체 센터를 집계하여 KPI와 테이블을 동시에 갱신
    function renderLevel0() {
      currentLevel = 0;
      navStack = [];
      updateBreadcrumb();

      const ws = DUMMY.centers;

      // === 정합성 원칙: Level 0 카드 = sum(DUMMY.centers) ===
      // dashboardSummary는 별도 소스라 DUMMY 합과 어긋날 수 있으므로 사용하지 않는다.
      const totalAgents = ws.reduce((s, w) => s + (w.agentCount || 0), 0);
      const totalAgentsPrev = ws.reduce((s, w) => s + (w.agentCount_prev || 0), 0);
      const totalCalls = ws.reduce((s, w) => s + (w.totalCalls || 0), 0);
      const totalEvals = ws.reduce((s, w) => s + (w.totalEvals || 0), 0);
      const sumIB = ws.reduce((s, w) => s + (w.calls_auto_ib || 0), 0);
      const sumIBDone = ws.reduce((s, w) => s + (w.calls_auto_ib_done || 0), 0);
      const sumOB = ws.reduce((s, w) => s + (w.calls_auto_ob || 0), 0);
      const sumOBDone = ws.reduce((s, w) => s + (w.calls_auto_ob_done || 0), 0);
      const sumManual = ws.reduce((s, w) => s + (w.calls_manual || 0), 0);
      const sumManualDone = ws.reduce((s, w) => s + (w.calls_manual_done || 0), 0);
      const sumIBPrev = ws.reduce((s, w) => s + (w.calls_auto_ib_prev || 0), 0);
      const sumIBDonePrev = ws.reduce((s, w) => s + (w.calls_auto_ib_done_prev || 0), 0);
      const sumOBPrev = ws.reduce((s, w) => s + (w.calls_auto_ob_prev || 0), 0);
      const sumOBDonePrev = ws.reduce((s, w) => s + (w.calls_auto_ob_done_prev || 0), 0);
      const sumManualPrev = ws.reduce((s, w) => s + (w.calls_manual_prev || 0), 0);
      const sumManualDonePrev = ws.reduce((s, w) => s + (w.calls_manual_done_prev || 0), 0);
      const totalCallsPrev = sumIBPrev + sumOBPrev + sumManualPrev;

      // 긴급/제외/70점이하/topDeduction은 센터 사전값 대신 teams 말단부터 합산하여
      // Level 1(teams 합)과 Level 0(centers→teams 합)의 종단 정합성을 보장한다.
      const allTeams = ws.flatMap(w => w.teams || []);
      const totalUrgent = allTeams.reduce((s, t) => s + (t.urgentIssues || 0), 0);
      const totalUrgentPrev = allTeams.reduce((s, t) => s + (t.urgentIssues_prev || 0), 0);
      const totalExcluded = allTeams.reduce((s, t) => s + (t.excludedAgents || 0), 0);
      const totalExcludedPrev = allTeams.reduce((s, t) => s + (t.excludedAgents_prev || 0), 0);
      const totalLowScore = allTeams.reduce((s, t) => s + (t.lowScoreCalls || 0), 0);
      const totalLowScorePct = totalEvals > 0 ? Math.round(totalLowScore / totalEvals * 100) : 0;

      // 가중 평균 점수 (각 센터 totalEvals 가중)
      const weightedAvg = totalEvals > 0
        ? ws.reduce((s, w) => s + (w.avgScore || 0) * (w.totalEvals || 0), 0) / totalEvals
        : 0;
      const weightedAvgPrev = totalEvals > 0
        ? ws.reduce((s, w) => s + (w.avgScore_prev || 0) * (w.totalEvals || 0), 0) / totalEvals
        : 0;
      const weightedAvgIB = sumIB > 0
        ? ws.reduce((s, w) => s + (w.avg_score_auto_ib || 0) * (w.calls_auto_ib || 0), 0) / sumIB : 0;
      const weightedAvgIBPrev = sumIBPrev > 0
        ? ws.reduce((s, w) => s + (w.avg_score_auto_ib_prev || 0) * (w.calls_auto_ib_prev || 0), 0) / sumIBPrev : 0;
      const weightedAvgOB = sumOB > 0
        ? ws.reduce((s, w) => s + (w.avg_score_auto_ob || 0) * (w.calls_auto_ob || 0), 0) / sumOB : 0;
      const weightedAvgOBPrev = sumOBPrev > 0
        ? ws.reduce((s, w) => s + (w.avg_score_auto_ob_prev || 0) * (w.calls_auto_ob_prev || 0), 0) / sumOBPrev : 0;
      const weightedAvgManual = sumManual > 0
        ? ws.reduce((s, w) => s + (w.avg_score_manual || 0) * (w.calls_manual || 0), 0) / sumManual : 0;
      const weightedAvgManualPrev = sumManualPrev > 0
        ? ws.reduce((s, w) => s + (w.avg_score_manual_prev || 0) * (w.calls_manual_prev || 0), 0) / sumManualPrev : 0;

      // 가중 평균 통화시간 (totalCalls 가중)
      const toSec = (s) => { const p = (s || '00:00').split(':'); return parseInt(p[0])*60 + parseInt(p[1]); };
      const fmtDur = (sec) => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.round(sec%60)).padStart(2,'0')}`;
      const avgDurSec = totalCalls > 0
        ? ws.reduce((s, w) => s + toSec(w.avgDuration) * (w.totalCalls || 0), 0) / totalCalls : 0;
      const avgDurPrevSec = totalCalls > 0
        ? ws.reduce((s, w) => s + toSec(w.avgDuration_prev) * (w.totalCalls || 0), 0) / totalCalls : 0;

      // 최다 감점 항목도 teams 말단부터 합산 (Level 1 합산과 동일 산출 보장)
      const deductMap = {};
      allTeams.forEach(t => { if (t.topDeduction) deductMap[t.topDeduction.item] = (deductMap[t.topDeduction.item] || 0) + (t.topDeduction.calls || 0); });
      let topItem = '-', topCalls = 0;
      Object.entries(deductMap).forEach(([k, v]) => { if (v > topCalls) { topItem = k; topCalls = v; } });
      const topPct = totalEvals > 0 ? Math.round(topCalls / totalEvals * 100) : 0;

      const row1 = [
        { label: '평가 상담사', kind: 'agentScope', value: AICC_Fmt.number(totalAgents), current: totalAgents, prev: totalAgentsPrev, unit: '명', prevLabel: '전월', sub: `${ws.length}개 센터` },
        { label: '평가 건수', kind: 'callScope', value: AICC_Fmt.number(totalCalls), current: totalCalls, prev: totalCallsPrev, unit: '건', prevLabel: '전월',
          isCallBreakdown: true,
          autoIB: sumIB, autoIB_done: sumIBDone,
          autoOB: sumOB, autoOB_done: sumOBDone,
          manual: sumManual, manual_done: sumManualDone,
          autoIB_prev: sumIBPrev, autoIB_done_prev: sumIBDonePrev,
          autoOB_prev: sumOBPrev, autoOB_done_prev: sumOBDonePrev,
          manual_prev: sumManualPrev, manual_done_prev: sumManualDonePrev },
        { label: '긴급 이슈', kind: 'urgentIssue', value: totalUrgent, current: totalUrgent, prev: totalUrgentPrev, unit: '건', prevLabel: '전월' },
        { label: '상담사 평균 통화시간', kind: 'durationScope', value: fmtDur(avgDurSec), current: fmtDur(avgDurSec), prev: fmtDur(avgDurPrevSec), unit: '', isDuration: true, prevLabel: '전월' }
      ];
      const row2 = [
        { label: '평가 제외 상담사', kind: 'excluded', value: AICC_Fmt.number(totalExcluded), current: totalExcluded, prev: totalExcludedPrev, unit: '명', prevLabel: '전월' },
        { label: '평균 평가 점수', kind: 'scoreScope', value: AICC_Fmt.score(weightedAvg), current: weightedAvg, prev: weightedAvgPrev, unit: '점', prevLabel: '전월',
          isScoreBreakdown: true,
          scoreIB: weightedAvgIB, scoreIB_prev: weightedAvgIBPrev,
          scoreOB: weightedAvgOB, scoreOB_prev: weightedAvgOBPrev,
          scoreManual: weightedAvgManual, scoreManual_prev: weightedAvgManualPrev },
        { label: '최다 감점 항목', kind: 'topDeduction', isTopDeduction: true, deductionData: { item: topItem, calls: topCalls, pct: topPct } },
        { label: '70점 이하 콜', kind: 'lowScore', isLowScore: true, lowCalls: totalLowScore, lowPct: totalLowScorePct }
      ];

      daCurrentTopItem = topItem !== '-' ? topItem : null;
      renderKpiTwoRows(row1, row2);
      notifyNodeChange();

      document.getElementById('table-title').textContent = '센터별 현황';
      document.getElementById('table-count').textContent = `총 ${ws.length}개`;

      const table = document.querySelector('.data-table');
      table.style.tableLayout = 'fixed';

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="text-align:center;width:5%;">NO.</th>
          <th style="text-align:center;width:35%;">센터</th>
          <th style="text-align:center;width:10%;">상담사 수</th>
          <th style="text-align:center;width:10%;">상담 건수</th>
          <th style="text-align:center;width:10%;">평가 건수</th>
          <th style="text-align:center;width:10%;">완료율</th>
          <th style="text-align:center;width:10%;">평균 점수</th>
          <th style="text-align:center;width:10%;">평균 통화시간</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = ws.map((w, idx) => `
        <tr onclick="drillToCenter('${w.id}')" class="fade-in">
          <td style="text-align:center;">${idx + 1}</td>
          <td style="font-weight:500;text-align:center;">${w.name}</td>
          <td style="text-align:center;">${AICC_Fmt.number(w.agentCount)}명</td>
          <td style="text-align:center;">${AICC_Fmt.number(w.totalCalls)}</td>
          <td style="text-align:center;">${AICC_Fmt.number(w.totalEvals)}</td>
          <td style="text-align:center;">${AICC_Fmt.percent(w.completionRate)}</td>
          <td style="text-align:center;">${AICC_Fmt.scoreHtml(w.avgScore)}</td>
          <td style="text-align:center;">${w.avgDuration || '-'}</td>
        </tr>
      `).join('');

      renderPagination(ws.length, 1, 10);
      daShowSuggestionBar();
    }

    /* ========== Level 1: 팀 목록 (센터 내) ========== */
    // 테이블 행 클릭 진입점 — navStack에 센터 컨텍스트를 push한 뒤 팀 목록 렌더링
    function drillToCenter(wsId) {
      const ws = DUMMY.centers.find(w => w.id === wsId);
      if (!ws) return;

      currentLevel = 1;
      navStack = [{ level: 1, label: ws.name, data: ws }];
      renderLevel1(ws);
      updateBreadcrumb();
    }

    // 센터 내 팀별 비교 뷰 렌더링
    // === 정합성 원칙: Level 1 카드 = sum(ws.teams) ===
    // ws 사전 집계값이 teams 합과 어긋날 수 있으므로 teams 합산을 우선 사용한다.
    function renderLevel1(ws) {
      const teams = ws.teams;

      const sumAgents = teams.reduce((s, t) => s + (t.agentCount || 0), 0);
      const sumAgentsPrev = teams.reduce((s, t) => s + (t.agentCount_prev || 0), 0);
      const sumCalls = teams.reduce((s, t) => s + (t.totalCalls || 0), 0);
      const sumEvals = teams.reduce((s, t) => s + (t.totalEvals || 0), 0);
      const sumIB = teams.reduce((s, t) => s + (t.calls_auto_ib || 0), 0);
      const sumIBDone = teams.reduce((s, t) => s + (t.calls_auto_ib_done || 0), 0);
      const sumOB = teams.reduce((s, t) => s + (t.calls_auto_ob || 0), 0);
      const sumOBDone = teams.reduce((s, t) => s + (t.calls_auto_ob_done || 0), 0);
      const sumManual = teams.reduce((s, t) => s + (t.calls_manual || 0), 0);
      const sumManualDone = teams.reduce((s, t) => s + (t.calls_manual_done || 0), 0);
      const sumIBPrev = teams.reduce((s, t) => s + (t.calls_auto_ib_prev || 0), 0);
      const sumIBDonePrev = teams.reduce((s, t) => s + (t.calls_auto_ib_done_prev || 0), 0);
      const sumOBPrev = teams.reduce((s, t) => s + (t.calls_auto_ob_prev || 0), 0);
      const sumOBDonePrev = teams.reduce((s, t) => s + (t.calls_auto_ob_done_prev || 0), 0);
      const sumManualPrev = teams.reduce((s, t) => s + (t.calls_manual_prev || 0), 0);
      const sumManualDonePrev = teams.reduce((s, t) => s + (t.calls_manual_done_prev || 0), 0);
      const sumCallsPrev = sumIBPrev + sumOBPrev + sumManualPrev;

      const sumUrgent = teams.reduce((s, t) => s + (t.urgentIssues || 0), 0);
      const sumUrgentPrev = teams.reduce((s, t) => s + (t.urgentIssues_prev || 0), 0);
      const sumExcluded = teams.reduce((s, t) => s + (t.excludedAgents || 0), 0);
      const sumExcludedPrev = teams.reduce((s, t) => s + (t.excludedAgents_prev || 0), 0);
      const sumLowScore = teams.reduce((s, t) => s + (t.lowScoreCalls || 0), 0);
      const sumLowScorePct = sumEvals > 0 ? Math.round(sumLowScore / sumEvals * 100) : 0;

      // 가중 평균 점수 (각 팀 totalEvals 가중)
      const weightedAvg = sumEvals > 0
        ? teams.reduce((s, t) => s + (t.avgScore || 0) * (t.totalEvals || 0), 0) / sumEvals : 0;
      const weightedAvgPrev = sumEvals > 0
        ? teams.reduce((s, t) => s + (t.avgScore_prev || 0) * (t.totalEvals || 0), 0) / sumEvals : 0;
      const weightedAvgIB = sumIB > 0
        ? teams.reduce((s, t) => s + (t.avg_score_auto_ib || 0) * (t.calls_auto_ib || 0), 0) / sumIB : 0;
      const weightedAvgIBPrev = sumIBPrev > 0
        ? teams.reduce((s, t) => s + (t.avg_score_auto_ib_prev || 0) * (t.calls_auto_ib_prev || 0), 0) / sumIBPrev : 0;
      const weightedAvgOB = sumOB > 0
        ? teams.reduce((s, t) => s + (t.avg_score_auto_ob || 0) * (t.calls_auto_ob || 0), 0) / sumOB : 0;
      const weightedAvgOBPrev = sumOBPrev > 0
        ? teams.reduce((s, t) => s + (t.avg_score_auto_ob_prev || 0) * (t.calls_auto_ob_prev || 0), 0) / sumOBPrev : 0;
      const weightedAvgManual = sumManual > 0
        ? teams.reduce((s, t) => s + (t.avg_score_manual || 0) * (t.calls_manual || 0), 0) / sumManual : 0;
      const weightedAvgManualPrev = sumManualPrev > 0
        ? teams.reduce((s, t) => s + (t.avg_score_manual_prev || 0) * (t.calls_manual_prev || 0), 0) / sumManualPrev : 0;

      // 가중 평균 통화시간
      const toSec = (s) => { const p = (s || '00:00').split(':'); return parseInt(p[0])*60 + parseInt(p[1]); };
      const fmtDur = (sec) => `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(Math.round(sec%60)).padStart(2,'0')}`;
      const avgDurSec = sumCalls > 0
        ? teams.reduce((s, t) => s + toSec(t.avgDuration) * (t.totalCalls || 0), 0) / sumCalls : 0;
      const avgDurPrevSec = sumCalls > 0
        ? teams.reduce((s, t) => s + toSec(t.avgDuration_prev) * (t.totalCalls || 0), 0) / sumCalls : 0;

      // 팀별 최다 감점 항목을 합산해 센터 1위 산출
      const deductMap = {};
      teams.forEach(t => { if (t.topDeduction) deductMap[t.topDeduction.item] = (deductMap[t.topDeduction.item] || 0) + (t.topDeduction.calls || 0); });
      let topItem = '-', topCalls = 0;
      Object.entries(deductMap).forEach(([k, v]) => { if (v > topCalls) { topItem = k; topCalls = v; } });
      const topPct = sumEvals > 0 ? Math.round(topCalls / sumEvals * 100) : 0;

      const row1 = [
        { label: '평가 상담사', kind: 'agentScope', value: AICC_Fmt.number(sumAgents), current: sumAgents, prev: sumAgentsPrev, unit: '명', prevLabel: '전월', sub: `${teams.length}개 팀` },
        { label: '평가 건수', kind: 'callScope', value: AICC_Fmt.number(sumCalls), current: sumCalls, prev: sumCallsPrev, unit: '건', prevLabel: '전월',
          isCallBreakdown: true,
          autoIB: sumIB, autoIB_done: sumIBDone,
          autoOB: sumOB, autoOB_done: sumOBDone,
          manual: sumManual, manual_done: sumManualDone,
          autoIB_prev: sumIBPrev, autoIB_done_prev: sumIBDonePrev,
          autoOB_prev: sumOBPrev, autoOB_done_prev: sumOBDonePrev,
          manual_prev: sumManualPrev, manual_done_prev: sumManualDonePrev },
        { label: '긴급 이슈', kind: 'urgentIssue', value: sumUrgent, current: sumUrgent, prev: sumUrgentPrev, unit: '건', prevLabel: '전월' },
        { label: '상담사 평균 통화시간', kind: 'durationScope', value: fmtDur(avgDurSec), current: fmtDur(avgDurSec), prev: fmtDur(avgDurPrevSec), unit: '', isDuration: true, prevLabel: '전월' }
      ];
      const row2 = [
        { label: '평가 제외 상담사', kind: 'excluded', value: AICC_Fmt.number(sumExcluded), current: sumExcluded, prev: sumExcludedPrev, unit: '명', prevLabel: '전월' },
        { label: '평균 평가 점수', kind: 'scoreScope', value: AICC_Fmt.score(weightedAvg), current: weightedAvg, prev: weightedAvgPrev, unit: '점', prevLabel: '전월',
          isScoreBreakdown: true,
          scoreIB: weightedAvgIB, scoreIB_prev: weightedAvgIBPrev,
          scoreOB: weightedAvgOB, scoreOB_prev: weightedAvgOBPrev,
          scoreManual: weightedAvgManual, scoreManual_prev: weightedAvgManualPrev },
        { label: '최다 감점 항목', kind: 'topDeduction', isTopDeduction: true, deductionData: { item: topItem, calls: topCalls, pct: topPct } },
        { label: '70점 이하 콜', kind: 'lowScore', isLowScore: true, lowCalls: sumLowScore, lowPct: sumLowScorePct }
      ];

      daCurrentTopItem = topItem !== '-' ? topItem : null;
      renderKpiTwoRows(row1, row2);
      notifyNodeChange();

      document.getElementById('table-title').textContent = ws.name + ' - 팀별 현황';
      document.getElementById('table-count').textContent = `총 ${teams.length}개 팀`;

      const table = document.querySelector('.data-table');
      table.style.tableLayout = 'fixed';

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="text-align:center;width:5%;">NO.</th>
          <th style="text-align:center;width:35%;">팀명</th>
          <th style="text-align:center;width:10%;">상담사 수</th>
          <th style="text-align:center;width:10%;">상담 건수</th>
          <th style="text-align:center;width:10%;">평가 건수</th>
          <th style="text-align:center;width:10%;">완료율</th>
          <th style="text-align:center;width:10%;">평균 점수</th>
          <th style="text-align:center;width:10%;">평균 통화시간</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = teams.map((t, idx) => `
        <tr onclick="drillToTeam('${ws.id}','${t.id}')" class="fade-in">
          <td style="text-align:center;">${idx + 1}</td>
          <td style="font-weight:500;text-align:center;">${t.name}</td>
          <td style="text-align:center;">${t.agentCount}명</td>
          <td style="text-align:center;">${AICC_Fmt.number(t.totalCalls)}</td>
          <td style="text-align:center;">${AICC_Fmt.number(t.totalEvals)}</td>
          <td style="text-align:center;">${AICC_Fmt.percent(t.completionRate)}</td>
          <td style="text-align:center;">${AICC_Fmt.scoreHtml(t.avgScore)}</td>
          <td style="text-align:center;">${t.avgDuration || '-'}</td>
        </tr>
      `).join('');

      renderPagination(teams.length, 1, 10);
      daShowSuggestionBar();
    }

    /* ========== Level 2: 상담사 목록 (팀 내) ========== */
    // ws→team 2단계 navStack을 한 번에 구성 — 딥링크 및 직접 클릭 모두 지원
    function drillToTeam(wsId, teamId) {
      const ws = DUMMY.centers.find(w => w.id === wsId);
      if (!ws) return;
      const team = ws.teams.find(t => t.id === teamId);
      if (!team) return;

      currentLevel = 2;
      navStack = [
        { level: 1, label: ws.name, data: ws },
        { level: 2, label: team.name, data: { ws, team } }
      ];
      renderLevel2({ ws, team });
      updateBreadcrumb();
    }

    // 팀 내 상담사별 순위·유형 비교 뷰 렌더링
    // === 정합성 원칙: Level 2 카드 = team 사전 집계값 ===
    // team.agents 배열은 표본(10명)이므로 사전 집계값(urgentIssues/topDeduction/lowScoreCalls)을
    // 사용해 Level 1 합산(= Level 2 사전값 합)과 정합 유지한다.
    function renderLevel2(ctx) {
      const { ws, team } = ctx;
      const agents = team.agents;
      const td = team.topDeduction || { item: '-', calls: 0, pct: 0 };

      const row1 = [
        { label: '평가 상담사', kind: 'agentScope', value: AICC_Fmt.number(team.agentCount), current: team.agentCount, prev: team.agentCount_prev || 0, unit: '명', prevLabel: '전월', sub: team.name },
        { label: '평가 건수', kind: 'callScope', value: AICC_Fmt.number(team.totalCalls), current: team.totalCalls, prev: (team.calls_auto_ib_prev || 0) + (team.calls_auto_ob_prev || 0) + (team.calls_manual_prev || 0), unit: '건', prevLabel: '전월',
          isCallBreakdown: true,
          autoIB: team.calls_auto_ib || 0, autoIB_done: team.calls_auto_ib_done || 0,
          autoOB: team.calls_auto_ob || 0, autoOB_done: team.calls_auto_ob_done || 0,
          manual: team.calls_manual || 0, manual_done: team.calls_manual_done || 0,
          autoIB_prev: team.calls_auto_ib_prev || 0, autoIB_done_prev: team.calls_auto_ib_done_prev || 0,
          autoOB_prev: team.calls_auto_ob_prev || 0, autoOB_done_prev: team.calls_auto_ob_done_prev || 0,
          manual_prev: team.calls_manual_prev || 0, manual_done_prev: team.calls_manual_done_prev || 0 },
        { label: '긴급 이슈', kind: 'urgentIssue', value: team.urgentIssues || 0, current: team.urgentIssues || 0, prev: team.urgentIssues_prev || 0, unit: '건', prevLabel: '전월' },
        { label: '상담사 평균 통화시간', kind: 'durationScope', value: team.avgDuration || '00:00', current: team.avgDuration || '00:00', prev: team.avgDuration_prev || '00:00', unit: '', isDuration: true, prevLabel: '전월' }
      ];
      const row2 = [
        { label: '평가 제외 상담사', kind: 'excluded', value: AICC_Fmt.number(team.excludedAgents || 0), current: team.excludedAgents || 0, prev: team.excludedAgents_prev || 0, unit: '명', prevLabel: '전월' },
        { label: '평균 평가 점수', kind: 'scoreScope', value: AICC_Fmt.score(team.avgScore), current: team.avgScore, prev: team.avgScore_prev || 0, unit: '점', prevLabel: '전월',
          isScoreBreakdown: true,
          scoreIB: team.avg_score_auto_ib || 0, scoreIB_prev: team.avg_score_auto_ib_prev || 0,
          scoreOB: team.avg_score_auto_ob || 0, scoreOB_prev: team.avg_score_auto_ob_prev || 0,
          scoreManual: team.avg_score_manual || 0, scoreManual_prev: team.avg_score_manual_prev || 0 },
        { label: '최다 감점 항목', kind: 'topDeduction', isTopDeduction: true, deductionData: td },
        { label: '70점 이하 콜', kind: 'lowScore', isLowScore: true, lowCalls: team.lowScoreCalls || 0, lowPct: team.lowScorePct || 0 }
      ];

      daCurrentTopItem = td.item !== '-' ? td.item : null;
      renderKpiTwoRows(row1, row2);
      activeFilter = null;
      renderLevel2Table(ws, team, agents);
      daShowSuggestionBar();
      notifyNodeChange();
    }

    function renderLevel2Table(ws, team, agentList, filterLabel) {
      const titleEl = document.getElementById('table-title');
      const baseTitle = team.name + ' - 상담사별 현황';
      if (filterLabel) {
        titleEl.innerHTML = `${baseTitle} <span onclick="filterByCard(activeFilter)" style="display:inline-block;margin-left:8px;padding:2px 10px;background:#eff6ff;color:#3b82f6;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;">
          ${filterLabel} ✕</span>`;
      } else {
        titleEl.textContent = baseTitle;
      }
      document.getElementById('table-count').textContent = `총 ${agentList.length}명`;

      const table = document.querySelector('.data-table');
      table.style.tableLayout = 'fixed';

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="text-align:center;width:5%;">NO.</th>
          <th style="text-align:center;width:12%;">상담사</th>
          <th style="text-align:center;width:10%;">사번</th>
          <th style="text-align:center;width:12%;">총 상담건수</th>
          <th style="text-align:center;width:12%;">평균 통화시간</th>
          <th style="text-align:center;width:17%;">최다 감점항목</th>
          <th style="text-align:center;width:12%;">평균 점수</th>
          <th style="text-align:center;width:20%;">이슈</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = agentList.map((a, idx) => {
        let issueTd = '-';
        if (a.excluded) {
          issueTd = '<span style="display:inline-block;padding:2px 8px;background:#f3f4f6;color:#6b7280;border-radius:4px;font-size:12px;">평가 제외</span>';
        } else if (a.urgentIssue && a.issue) {
          issueTd = '<span style="display:inline-block;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:12px;">' + a.issue + '</span>' +
                    ' <span style="display:inline-block;padding:1px 6px;background:#dc2626;color:#fff;border-radius:4px;font-size:10px;font-weight:600;">긴급</span>';
        } else if (a.issue) {
          issueTd = '<span style="display:inline-block;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:12px;">' + a.issue + '</span>';
        }
        return `
        <tr onclick="drillToAgent('${ws.id}','${team.id}','${a.id}')" class="fade-in">
          <td style="text-align:center;">${idx + 1}</td>
          <td style="font-weight:500;text-align:center;">${a.name}</td>
          <td style="text-align:center;">${a.employeeId || '-'}</td>
          <td style="text-align:center;">${AICC_Fmt.number(a.totalCalls)}</td>
          <td style="text-align:center;">${a.avgDuration || '-'}</td>
          <td style="text-align:center;">${a.topDeductionItem || '-'}</td>
          <td style="text-align:center;">${AICC_Fmt.scoreHtml(a.avgScore)}</td>
          <td style="text-align:center;">${issueTd}</td>
        </tr>`;
      }).join('');

      renderPagination(agentList.length, 1, 10);
    }

    /* ========== Level 3: 평가 목록 (상담사) ========== */
    // ws→team→agent 3단계 navStack을 한 번에 구성하여 모달에서 컨텍스트 참조 가능하게 함
    function drillToAgent(wsId, teamId, agentId) {
      const ws = DUMMY.centers.find(w => w.id === wsId);
      if (!ws) return;
      const team = ws.teams.find(t => t.id === teamId);
      if (!team) return;
      const agent = team.agents.find(a => a.id === agentId);
      if (!agent) return;

      currentLevel = 3;
      navStack = [
        { level: 1, label: ws.name, data: ws },
        { level: 2, label: team.name, data: { ws, team } },
        { level: 3, label: agent.name, data: { ws, team, agent } }
      ];
      renderLevel3({ ws, team, agent });
      updateBreadcrumb();
    }

    function renderLevel3(ctx) {
      const { ws, team, agent } = ctx;
      const evals = agent.evaluations;
      const avgScore = evals.reduce((s, e) => s + e.score, 0) / evals.length;
      const urgentCount = evals.filter(e => e.urgentIssue).length;
      const lowScoreCount = evals.filter(e => e.score <= 70).length;
      const lowScorePct = evals.length > 0 ? Math.round(lowScoreCount / evals.length * 100) : 0;

      // 최다 감점항목 계산 — deductionItems(배열) 우선, deductionItem(단일) 폴백
      const deductionMap = {};
      evals.forEach(e => {
        const items = e.deductionItems || (e.deductionItem ? [e.deductionItem] : []);
        items.forEach(item => { deductionMap[item] = (deductionMap[item] || 0) + 1; });
      });
      let topDeductionItem = '-', topDeductionCalls = 0;
      Object.entries(deductionMap).forEach(([item, cnt]) => {
        if (cnt > topDeductionCalls) { topDeductionItem = item; topDeductionCalls = cnt; }
      });
      const topDeductionPct = evals.length > 0 ? Math.round(topDeductionCalls / evals.length * 100) : 0;

      // 자동IB / 자동OB / 수동 건수 집계
      const autoIB = evals.filter(e => e.type !== '수동' && e.callType === 'I/B');
      const autoOB = evals.filter(e => e.type !== '수동' && e.callType === 'O/B');
      const manual = evals.filter(e => e.type === '수동');
      const avgOf = (arr) => arr.length > 0 ? arr.reduce((s, e) => s + e.score, 0) / arr.length : 0;
      const prevRand = (v, lo, hi) => Math.max(0, v + Math.floor(Math.random() * (hi - lo + 1)) + lo);

      const prevEvalCount = Math.round(evals.length * 0.9);
      const prevAvgScore = parseFloat((avgScore + (Math.random() > 0.5 ? 1.5 : -1.2)).toFixed(1));
      const prevUrgent = Math.max(0, urgentCount - 1);

      // 팀 내 순위 — 동일 팀 상담사 avgScore 내림차순 기준
      const ranked = [...team.agents].sort((a, b) => b.avgScore - a.avgScore);
      const myRank = ranked.findIndex(a => a.id === agent.id) + 1;
      const totalRank = ranked.length;
      const prevRank = Math.min(totalRank, Math.max(1, myRank + (Math.random() > 0.5 ? 1 : -1)));
      // 순위 카드 우측 영역에 표시할 비교 지표 (팀 평균 | 본인 평균)
      const myAvg = avgScore;
      const myAvgPrev = prevAvgScore;
      const teamAvg = team.avgScore;
      const teamAvgPrev = team.avgScore_prev || teamAvg;

      // 이의 제기 건수 — DUMMY에 별도 필드가 없어 agent.id 기반 결정성 헤이지 + 긴급 이슈 보정
      const hashSeed = (agent.id || '').split('').reduce((s, c) => s + c.charCodeAt(0), 0);
      const disputeCount = (hashSeed % 3) + (agent.urgentIssue ? 1 : 0);
      const disputePrev = Math.max(0, disputeCount + ((hashSeed % 2 === 0) ? -1 : 1));

      const row1 = [
        { label: '팀 내 순위', kind: 'rankScope', value: `${myRank}위`, prev: `${prevRank}위`, unit: '', prevLabel: '전월', sub: `${totalRank}명 중`,
          isRankBreakdown: true,
          myAvg, myAvg_prev: myAvgPrev,
          teamAvg, teamAvg_prev: teamAvgPrev },
        { label: '평가 건수', kind: 'callScope', value: AICC_Fmt.number(evals.length) + '건', current: evals.length, prev: prevEvalCount, unit: '건', prevLabel: '전월',
          isCallBreakdown: true,
          autoIB: autoIB.length, autoIB_done: autoIB.length,
          autoOB: autoOB.length, autoOB_done: autoOB.length,
          manual: manual.length, manual_done: manual.length,
          autoIB_prev: prevRand(autoIB.length, -2, 1), autoIB_done_prev: prevRand(autoIB.length, -3, 0),
          autoOB_prev: prevRand(autoOB.length, -1, 1), autoOB_done_prev: prevRand(autoOB.length, -2, 0),
          manual_prev: prevRand(manual.length, -1, 1), manual_done_prev: prevRand(manual.length, -1, 0) },
        { label: '긴급 이슈', kind: 'urgentIssue', value: urgentCount, current: urgentCount, prev: prevUrgent, unit: '건', prevLabel: '전월' },
        { label: '상담사 평균 통화시간', kind: 'durationScope', value: agent.avgDuration || '00:00', current: agent.avgDuration || '00:00', prev: '04:50', unit: '', isDuration: true, prevLabel: '전월' }
      ];
      const row2 = [
        { label: '이의 제기 건수', kind: 'disputeScope', value: AICC_Fmt.number(disputeCount), current: disputeCount, prev: disputePrev, unit: '건', prevLabel: '전월' },
        { label: '평균 평가 점수', kind: 'scoreScope', value: AICC_Fmt.score(avgScore), current: avgScore, prev: prevAvgScore, unit: '점', prevLabel: '전월',
          isScoreBreakdown: true,
          scoreIB: avgOf(autoIB), scoreIB_prev: parseFloat((avgOf(autoIB) + (Math.random() > 0.5 ? 1.3 : -0.8)).toFixed(1)),
          scoreOB: avgOf(autoOB), scoreOB_prev: parseFloat((avgOf(autoOB) + (Math.random() > 0.5 ? 0.9 : -1.1)).toFixed(1)),
          scoreManual: avgOf(manual), scoreManual_prev: parseFloat((avgOf(manual) + (Math.random() > 0.5 ? 1.0 : -1.5)).toFixed(1)) },
        { label: '최다 감점 항목', kind: 'topDeduction', isTopDeduction: true, deductionData: { item: topDeductionItem, calls: topDeductionCalls, pct: topDeductionPct } },
        { label: '70점 이하 콜', kind: 'lowScore', isLowScore: true, lowCalls: lowScoreCount, lowPct: lowScorePct }
      ];

      daCurrentTopItem = topDeductionItem !== '-' ? topDeductionItem : null;
      renderKpiTwoRows(row1, row2);
      activeFilter = null;
      renderLevel3Table(ws, team, agent, evals);
      daShowSuggestionBar();
      notifyNodeChange();
    }

    function renderLevel3Table(ws, team, agent, evalList, filterLabel) {
      const titleEl = document.getElementById('table-title');
      const baseTitle = agent.name + ' - 평가 이력';
      if (filterLabel) {
        titleEl.innerHTML = `${baseTitle} <span onclick="filterByCard(activeFilter)" style="display:inline-block;margin-left:8px;padding:2px 10px;background:#eff6ff;color:#3b82f6;border-radius:12px;font-size:11px;font-weight:600;cursor:pointer;">${filterLabel} ✕</span>`;
      } else {
        titleEl.textContent = baseTitle;
      }
      document.getElementById('table-count').textContent = `총 ${evalList.length}건`;

      const table = document.querySelector('.data-table');
      table.style.tableLayout = 'fixed';

      const callType = agent.callType || 'I/B';
      const teamLabel = team.name || '';
      const simEvalFormForTable = callType === 'O/B' ? 'O/B 텔레마케팅 평가표 v1.3'
        : teamLabel.includes('VIP') ? 'I/B VIP 평가표 v1.0' : 'I/B 일반 상담 평가표 v2.1';

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="text-align:center;width:9%;">평가 ID</th>
          <th style="text-align:center;width:11%;">일시</th>
          <th style="text-align:center;width:16%;">상담 유형</th>
          <th style="text-align:center;width:5%;">유형</th>
          <th style="text-align:center;width:6%;">평가방식</th>
          <th style="text-align:center;width:14%;">평가표</th>
          <th style="text-align:center;width:6%;">통화시간</th>
          <th style="text-align:center;width:6%;">신뢰도</th>
          <th style="text-align:center;width:6%;">점수</th>
          <th style="text-align:center;width:21%;">이슈</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = evalList.map(ev => {
        const confBadge = ev.confidence === 'High'
