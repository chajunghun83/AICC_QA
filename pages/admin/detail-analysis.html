          : '<span class="badge badge-pending">Mid</span>';

        const callTypeBadge = ev.callType === 'I/B'
          ? '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>'
          : '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>';

        // 이슈 셀: 긴급 배지 + 이슈 텍스트 + 감점항목 통합
        const items = ev.deductionItems || (ev.deductionItem ? [ev.deductionItem] : []);
        const deductionDisplay = items.length > 3 ? items.slice(0, 3).join(', ') + ', ...' : items.join(', ');
        const deductionTooltip = items.join(', ');
        let issueLines = [];
        if (ev.urgentIssue) {
          issueLines.push('<span style="display:inline-block;padding:2px 8px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:11px;font-weight:600;">긴급</span>' + (ev.issue ? ' <span style="font-size:11px;color:#F57F17;">' + ev.issue + '</span>' : ''));
        } else if (ev.issue) {
          issueLines.push('<span style="font-size:11px;color:#F57F17;">' + ev.issue + '</span>');
        }
        if (deductionDisplay) {
          issueLines.push('<span style="font-size:11px;color:#9E9E9E;" title="' + deductionTooltip + '">감점: ' + deductionDisplay + '</span>');
        }
        const issueHtml = issueLines.length > 0 ? issueLines.join('<br>') : '<span style="color:#9E9E9E;font-size:11px;">-</span>';

        return `
          <tr onclick="showEvalDetail('${ev.id}')" class="fade-in">
            <td style="text-align:center;font-size:12px;font-family:monospace;">${ev.id}</td>
            <td style="text-align:center;font-size:12px;white-space:nowrap;">${ev.date} ${ev.time}</td>
            <td style="text-align:center;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${ev.category || '-'}">${ev.category || '-'}</td>
            <td style="text-align:center;">${ev.callType ? callTypeBadge : '-'}</td>
            <td style="text-align:center;">${AICC_Fmt.typeBadge(ev.type)}</td>
            <td style="text-align:center;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${simEvalFormForTable}">${simEvalFormForTable}</td>
            <td style="text-align:center;font-size:12px;">${ev.duration}</td>
            <td style="text-align:center;">${confBadge}</td>
            <td style="text-align:center;">${AICC_Fmt.scoreHtml(ev.score)}</td>
            <td style="text-align:left;">${issueHtml}</td>
          </tr>
        `;
      }).join('');

      renderPagination(evalList.length, 1, 5);
    }

    /* ========== 평가 상세 모달 ========== */
    // 실제 평가표 항목 구조를 반영한 시뮬레이션 데이터 — NLP/AI 방식 구분은 실제 채점 엔진 유형과 매핑
    const SIM_SCORE_ITEMS = [
      { name: '첫인사', max: 6, type: 'NLP' },
      { name: '고객 인사 화답', max: 6, type: 'AI' },
      { name: '긍/부정 공감', max: 5, type: 'AI' },
      { name: '동시 발화', max: 6, type: 'NLP' },
      { name: '양해 없는 무응답', max: 5, type: 'NLP' },
      { name: '욕설/금지어', max: 0, type: 'NLP' },
      { name: '말끊기', max: 5, type: 'NLP' },
      { name: '고객향 상담', max: 5, type: 'AI' },
      { name: '상담 어미', max: 5, type: 'NLP' },
      { name: '전문적 화법', max: 6, type: 'NLP' },
      { name: '적극성(회피)', max: 6, type: 'AI' },
      { name: '편리(재질의)', max: 6, type: 'NLP' },
      { name: '신속성', max: 6, type: 'NLP' },
      { name: '어조', max: 6, type: 'AI' },
      { name: '개인정보 확인', max: 6, type: 'NLP' },
      { name: '문제 해결', max: 6, type: 'AI' },
      { name: '쉬운 설명', max: 6, type: 'AI' },
      { name: '적극적 응대', max: 6, type: 'AI' }
    ];

    // 총점 비율(ratio)에 따라 감점 확률을 역비례 적용하여, 고득점자는 감점이 적은 현실적 분포를 시뮬레이션
    function generateSimScores(totalScore) {
      // 0.6~1.0 범위로 클램핑 — 극단적 저점수에서도 최소 60% 통과율 보장
      const ratio = Math.max(0.6, Math.min(1, totalScore / 100));
      return SIM_SCORE_ITEMS.map(item => {
        let score = item.max;
        if (item.max > 0) {
          // ratio 미만 난수일 때만 감점 — 고득점자일수록 감점 확률 낮음
          const loss = Math.random() < ratio ? 0 : Math.ceil(Math.random() * 2);
          score = Math.max(0, item.max - loss);
        }
        const diff = item.max - score;
        const status = diff === 0 ? 'pass' : diff === 1 ? 'warn' : 'fail';
        const reason = status === 'warn' && item.name === '전문적 화법' ? '비언어 발화 2회' : '';
        const confidence = item.type === 'AI' ? Math.floor(88 + Math.random() * 10) : null;
        return { name: item.name, score, max: item.max, type: item.type, status, reason, confidence };
      });
    }

    // 데모용 고정 시나리오 스크립트 — 실제 서비스에서는 STT API 응답으로 대체
    function generateSimTranscript(agentName, evalId) {
      if (evalId === 'AE-2025-00421') {
        return [
          { speaker: 'agent', time: '00:01', text: `안녕하세요, ECS증권 ${agentName}입니다. 무엇을 도와드릴까요?` },
          { speaker: 'customer', time: '00:05', text: '네, 안녕하세요. 오늘 아침에 매수 주문 넣은 삼성전자 체결이 어떻게 되고 있는지 확인 좀 부탁드릴게요.' },
          { speaker: 'agent', time: '00:12', text: '네, 체결 확인 도와드리겠습니다. 본인 확인을 위해 성함과 생년월일 부탁드립니다.' },
          { speaker: 'customer', time: '00:18', text: '김민수, 1985년 4월 12일생입니다.' },
          { speaker: 'agent', time: '00:22', text: '확인되었습니다. 잠시만 기다려주세요.' },
          { speaker: 'agent', time: '00:35', text: '네, 확인되었습니다. 삼성전자 100주 매수 주문 정상 체결되었고, HTS 주문번호는 9876-A0143입니다. 결제일은 D+2 영업일입니다.' },
          { speaker: 'customer', time: '00:48', text: '아, 감사합니다. 그런데 혹시 매도 예약 주문이 가능한가요? 오전에 자리에 없을 수도 있어서요.' },
          { speaker: 'agent', time: '00:55', text: '네, 매도 예약 주문은 영웅문S 앱이나 홈페이지에서 직접 설정하실 수 있습니다. 시간외 거래 시간에도 예약 주문 등록이 가능합니다.' },
          { speaker: 'customer', time: '01:08', text: '아 그렇군요. 그리고 혹시 이번 매수한 종목을 다른 증권사 계좌로 이전할 수 있나요?' },
          { speaker: 'agent', time: '01:15', text: '동일 명의의 타사 증권계좌로 대체출고 가능하며, 영업일 기준 1~2일 소요됩니다. 다만 타사 계좌 이전은 별도 신청서 작성이 필요합니다.' },
          { speaker: 'customer', time: '01:28', text: '네, 알겠습니다. 그러면 매도 시 양도소득세는 어떻게 처리되나요?' },
          { speaker: 'agent', time: '01:33', text: '국내주식은 대주주 외에는 양도소득세 비과세이고, 해외주식의 경우 연 250만원 기본공제 후 22% 양도소득세가 부과됩니다. 별도 신고가 필요합니다.' },
          { speaker: 'customer', time: '01:48', text: '아, 해외주식은 따로 신고해야 하는 거군요. 신고는 언제까지인가요?' },
          { speaker: 'agent', time: '01:55', text: '네, 매년 5월 종합소득세 신고기간에 직접 신고하셔야 합니다. ECS증권 홈페이지 마이페이지에서 양도소득세 신고자료를 1월 중 게시해 드리니 참고 가능합니다.' },
          { speaker: 'customer', time: '02:10', text: '네, 잘 알겠습니다. 일단 체결 확인되어 다행입니다.' },
          { speaker: 'agent', time: '02:15', text: '네, 도움이 되어 다행입니다. 혹시 추가로 도움이 필요한 부분 있으신가요?' },
          { speaker: 'customer', time: '02:22', text: '아니요, 다 확인됐습니다. 감사합니다.' },
          { speaker: 'agent', time: '02:25', text: '네, 감사합니다. 좋은 하루 되세요. ECS증권 서포터였습니다.' }
        ];
      }
      return [
        { speaker: 'agent', time: '00:01', text: `안녕하세요, ECS증권 ${agentName}입니다. 무엇을 도와드릴까요?` },
        { speaker: 'customer', time: '00:05', text: '네, 안녕하세요. 매수 주문 체결 확인 좀 부탁드릴게요.' },
        { speaker: 'agent', time: '00:10', text: '네, 체결 확인 도와드리겠습니다. 본인 확인을 위해 성함과 생년월일 부탁드립니다.' },
        { speaker: 'customer', time: '00:15', text: '주문번호는 9876-A0143입니다.' },
        { speaker: 'agent', time: '00:20', text: '확인하겠습니다. 잠시만 기다려주세요. 네, 확인되었습니다. 정상 체결되었고 결제일은 D+2 영업일입니다.' },
        { speaker: 'customer', time: '00:30', text: '아, 감사합니다. 다른 건 없어요.' },
        { speaker: 'agent', time: '00:33', text: '감사합니다. 좋은 하루 되세요. ECS증권 서포터였습니다.' }
      ];
    }

    // 점수 구간별 피드백 분기 — 실제 서비스에서는 LLM 기반 자동 생성으로 대체 예정
    function generateSimFeedback(totalScore) {
      if (totalScore >= 95) return '전반적으로 매우 우수한 상담입니다. 고객 요구사항을 정확히 파악하고 신속하게 처리하였습니다.';
      if (totalScore >= 85) return '우수한 상담입니다. 일부 항목에서 소폭 감점이 있으나 전반적으로 양호합니다.';
      if (totalScore >= 70) return '보통 수준의 상담입니다. 고객 응대 스킬 및 문제 해결 역량 향상이 필요합니다.';
      return '개선이 필요한 상담입니다. 기본 응대 매뉴얼을 재확인하고 교육에 참여해 주세요.';
    }

    // navStack 3단계 컨텍스트(ws→team→agent)에서 메타 정보를 추출하여 모달에 표시
    function showEvalDetail(evalId) {
      let foundEval = null;
      if (navStack.length === 3) {
        const { agent } = navStack[2].data;
        foundEval = agent.evaluations.find(e => e.id === evalId);
      }
      if (!foundEval) return;

      const ev = foundEval;
      const agentName = navStack[2].data.agent.name;
      const wsName = navStack[0].label;
      const teamName = navStack[1].label;
      const callType = navStack[2].data.agent.callType || 'I/B';

      // 통화유형·팀명으로 평가표 분기 — 실제로는 센터별 설정에서 매핑
      const simEvalForm = callType === 'O/B' ? 'O/B 텔레마케팅 평가표 v1.3'
        : teamName.includes('VIP') ? 'I/B VIP 평가표 v1.0' : 'I/B 일반 상담 평가표 v2.1';
      const simConsultTypes = [
        '거래지원 > 체결조회 > 국내주식 체결', '입출금 > 출금처리 > 출금지연',
        '거래지원 > 주문정정 > 수량 정정', '상품안내 > 수수료 > 거래수수료 안내',
        '기술지원 > 영웅문 오류 > 로그인 실패', '기술지원 > 영웅문 오류 > 주문 모듈 오류',
        '거래지원 > 수수료 > 거래수수료 안내', '해피콜 > 만족도조사 > 체결완료',
        'VIP관리 > 자산관리 > 포트폴리오 상담', '민원관리 > 거래분쟁 > 시스템 장애',
        '상품안내 > 종목문의 > 공모 일정', '상품안내 > 이벤트 > 생일 우대 수수료',
        '계좌관리 > 정보변경 > 출금계좌 변경', 'VIP관리 > 등급안내 > 등급별 혜택'
      ];
      // evalId의 숫자 부분을 해시로 사용하여 동일 평가에 항상 같은 상담유형이 할당되도록 보장
      const simConsultType = simConsultTypes[parseInt(evalId.replace(/\D/g,'')) % simConsultTypes.length];

      const simScores = generateSimScores(ev.score);
      const simTranscript = generateSimTranscript(agentName, ev.id);
      const simFeedback = generateSimFeedback(ev.score);

      // 항목별 점수 행 — 클릭 시 스크립트 해당 구간으로 이동하도록 인덱스 부여
      const scoreRows = simScores.map((d, idx) => {
        const statusCls = d.status === 'pass' ? 'score-good' : d.status === 'warn' ? 'score-warn' : 'score-danger';
        const statusText = d.status === 'pass' ? '통과' : d.status === 'warn' ? '주의' : '미달';
        const confHtml = d.confidence ? `<span style="font-size:11px;color:#757575;">${d.confidence}%</span>` : '';
        const reasonHtml = d.reason ? `<div style="font-size:10px;color:#F57F17;margin-top:2px;">${d.reason}</div>` : '';
        return `
          <tr style="cursor:pointer;" onclick="scrollToTranscript(${idx})" title="클릭하면 해당 구간으로 이동합니다">
            <td style="font-size:11px;padding:6px 4px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${d.name}</td>
            <td style="padding:6px 4px;text-align:center;">${AICC_Fmt.typeBadge(d.type)}</td>
            <td style="text-align:center;font-weight:500;font-size:11px;padding:6px 4px;">${d.score}/${d.max}</td>
            <td style="padding:6px 4px;text-align:center;">${confHtml}</td>
            <td style="padding:6px 4px;text-align:center;"><span class="${statusCls}" style="font-size:11px;">${statusText}</span>${reasonHtml}</td>
          </tr>
        `;
      }).join('');

      // 스크립트 라인 — data-idx로 항목별 점수와 매핑
      const transcriptHtml = simTranscript.map((t, idx) => {
        const isAgent = t.speaker === 'agent';
        const bg = isAgent ? '#E3F2FD' : '#F5F5F5';
        const hoverBg = isAgent ? '#B3E5FC' : '#EEEEEE';
        const label = isAgent ? '상담사' : '고객';
        return `
          <div class="transcript-line" data-idx="${idx}" style="display:flex;gap:10px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:background 0.15s;" onclick="playSegment(this, '${t.time}')" onmouseenter="this.style.background='${hoverBg}'" onmouseleave="if(!this.classList.contains('playing'))this.style.background=''">
            <div style="min-width:40px;font-size:10px;color:#757575;padding-top:2px;">${t.time}</div>
            <div style="flex:1;">
              <div style="font-size:10px;font-weight:600;color:${isAgent ? '#00A3FF' : '#424242'};margin-bottom:2px;">${label}</div>
              <div style="background:${bg};padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5;display:flex;align-items:start;gap:6px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="${isAgent ? '#00A3FF' : '#757575'}" style="flex-shrink:0;margin-top:3px;opacity:0.5;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>${t.text}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      const scoreColor = ev.score >= 80 ? 'color:#4CAF50' : ev.score >= 60 ? 'color:#FFC107' : 'color:#F44336';
      const confBadge = ev.confidence === 'High'
        ? '<span class="badge badge-active">High</span>'
        : '<span class="badge badge-pending">Mid</span>';
      const callTypeBadge = (ev.callType || callType) === 'I/B'
        ? '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>'
        : '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>';

      // 이슈 + 감점항목
      const items = ev.deductionItems || (ev.deductionItem ? [ev.deductionItem] : []);
      const deductionDisplay = items.length > 3 ? items.slice(0,3).join(', ') + ', ...' : items.join(', ');
      let issueText = '';
      if (ev.urgentIssue) issueText += '<span style="display:inline-block;padding:2px 6px;background:#fee2e2;color:#dc2626;border-radius:4px;font-size:10px;font-weight:600;">긴급</span> ';
      if (ev.issue) issueText += '<span style="font-size:11px;color:#F57F17;">' + ev.issue + '</span>';
      if (deductionDisplay) issueText += (issueText ? '<br>' : '') + '<span style="font-size:10px;color:#9E9E9E;" title="' + items.join(', ') + '">감점: ' + deductionDisplay + '</span>';
      if (!issueText) issueText = '<span style="color:#9E9E9E;font-size:11px;">-</span>';

      const infoRow = (label, value) => `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #F0F0F0;"><span style="font-size:11px;color:#9E9E9E;white-space:nowrap;">${label}</span><span style="font-size:12px;font-weight:500;text-align:right;margin-left:8px;">${value}</span></div>`;

      _daExpandIframe();
      AICC_Modal.open({
        title: `평가 상세 - ${ev.id}`,
        size: 'xxl',
        onClose: _daRestoreIframe,
        content: `
          <div style="display:grid;grid-template-columns:300px 1fr 400px;gap:20px;height:calc(90vh - 140px);max-height:650px;">
            <!-- 왼쪽: 콜 정보 -->
            <div style="overflow-y:auto;padding-right:8px;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;">콜 정보</div>
              ${infoRow('평가 ID', '<span style="font-family:monospace;font-size:11px;">' + ev.id + '</span>')}
              ${infoRow('일시', ev.date + ' ' + ev.time)}
              ${infoRow('센터', wsName)}
              ${infoRow('팀', teamName)}
              ${infoRow('상담사', agentName)}
              ${infoRow('상담 유형', '<span style="font-size:11px;">' + (ev.category || simConsultType) + '</span>')}
              ${infoRow('유형', callTypeBadge)}
              ${infoRow('평가방식', AICC_Fmt.typeBadge(ev.type))}
              ${infoRow('평가표', '<span style="font-size:11px;">' + simEvalForm + '</span>')}
              ${infoRow('통화시간', ev.duration)}
              ${infoRow('신뢰도', confBadge)}
              ${infoRow('점수', '<strong style="font-size:16px;' + scoreColor + '">' + AICC_Fmt.score(ev.score) + '점</strong>')}
              <div style="padding:6px 0;">${infoRow('이슈', issueText)}</div>

              <div style="margin-top:12px;background:#F5F5F5;border-radius:6px;padding:10px 12px;font-size:11px;line-height:1.6;">
                <strong style="color:#424242;">AI 피드백</strong><br>
                <span style="color:#757575;">${simFeedback}</span>
              </div>
            </div>

            <!-- 중간: 스크립트 + 플레이어 -->
            <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">스크립트</div>
              <div id="transcript-container" style="flex:1;min-height:0;background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;padding:12px;overflow-y:auto;">
                ${transcriptHtml}
              </div>
              <div style="margin-top:10px;background:#F5F5F5;border:1px solid #E0E0E0;border-radius:8px;padding:10px 14px;flex-shrink:0;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <button onclick="togglePlay(this)" style="background:none;border:none;cursor:pointer;padding:0;">
                    <svg id="play-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="#424242"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  </button>
                  <div style="flex:1;">
                    <div style="width:100%;height:4px;background:#BDBDBD;border-radius:2px;position:relative;cursor:pointer;" onclick="seekBar(event)">
                      <div id="player-progress" style="width:0%;height:100%;background:#00A3FF;border-radius:2px;transition:width 0.2s;"></div>
                    </div>
                  </div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-left:30px;">
                  <span id="player-time" style="font-size:10px;color:#757575;">0:00</span>
                  <span id="player-segment-label" style="font-size:10px;color:#00A3FF;"></span>
                  <span style="font-size:10px;color:#757575;">${ev.duration || '0:00'}</span>
                </div>
              </div>
            </div>

            <!-- 오른쪽: 항목별 점수 -->
            <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">항목별 점수</div>
              <div style="flex:1;min-height:0;overflow-y:auto;">
                <table class="data-table" style="font-size:11px;table-layout:fixed;width:100%;">
                  <colgroup>
                    <col style="width:30%;">
                    <col style="width:15%;">
                    <col style="width:15%;">
                    <col style="width:15%;">
                    <col style="width:25%;">
                  </colgroup>
                  <thead>
                    <tr>
                      <th style="padding:6px 4px;text-align:center;">평가 항목</th>
                      <th style="padding:6px 4px;text-align:center;">방식</th>
                      <th style="padding:6px 4px;text-align:center;">점수</th>
                      <th style="padding:6px 4px;text-align:center;">신뢰도</th>
                      <th style="padding:6px 4px;text-align:center;">상태</th>
                    </tr>
                  </thead>
                  <tbody>${scoreRows}</tbody>
                </table>
              </div>
            </div>
          </div>
        `,
        footer: `
          <button class="btn btn-primary" onclick="openManualReview('${ev.id}')">수동 검증</button>
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
        `
      });
    }

    // 항목별 점수 행 클릭 → 스크립트 영역의 해당 구간으로 스크롤 + 자동 재생
    function scrollToTranscript(scoreIdx) {
      const container = document.getElementById('transcript-container');
      if (!container) return;
      const lines = container.querySelectorAll('.transcript-line');
      if (!lines.length) return;
      // 모달 내 점수 테이블의 tbody tr 수로 총 항목 수를 파악하여 비율 매핑
      const scoreRowCount = document.querySelectorAll('.modal-container .data-table tbody tr').length || 1;
      const mappedIdx = Math.min(Math.floor(scoreIdx * (lines.length / scoreRowCount)), lines.length - 1);
      const targetLine = lines[Math.max(0, mappedIdx)];
      if (!targetLine) return;
      targetLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const time = targetLine.querySelector('div')?.textContent?.trim() || '0:00';
      playSegment(targetLine, time);
    }

    // 모달 내 탭 전환 — 3컬럼에서는 사용하지 않지만 하위 호환 유지
    function switchDetailTab(btn, tabId) {
      btn.parentElement.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const scores = document.getElementById('scores-tab');
      const script = document.getElementById('script-tab');
      if (scores) scores.style.display = tabId === 'scores-tab' ? '' : 'none';
      if (script) script.style.display = tabId === 'script-tab' ? '' : 'none';
    }

    // 스크립트 라인 클릭 시 해당 구간 재생 시뮬레이션 — 이전 하이라이트를 해제하고 현재 라인만 활성화
    function playSegment(el, time) {
      document.querySelectorAll('.transcript-line').forEach(line => {
        line.classList.remove('playing');
        line.style.background = '';
      });
      el.classList.add('playing');
      // SVG fill 색상(#00A3FF=상담사)으로 화자를 구분하여 각기 다른 하이라이트 색상 적용
      el.style.background = el.querySelector('[fill="#00A3FF"]') ? '#B3E5FC' : '#EEEEEE';

      const label = document.getElementById('player-segment-label');
      if (label) label.textContent = '\u25B6 ' + time + ' 구간 재생 중';

      const timeEl = document.getElementById('player-time');
      if (timeEl) timeEl.textContent = time;

      const progress = document.getElementById('player-progress');
      if (progress) {
        const pct = Math.min(95, Math.max(5, Math.random() * 80 + 10));
        progress.style.width = pct + '%';
      }

      const playIcon = document.getElementById('play-btn-icon');
      if (playIcon) playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';

      AICC_Toast.show(`${time} 구간 재생 (시뮬레이션)`);
    }

    // SVG innerHTML 내 polygon(▶) / rect(⏸) 존재 여부로 재생 상태를 판별하는 토글 방식
    function togglePlay(btn) {
      const icon = document.getElementById('play-btn-icon');
      if (!icon) return;
      const isPaused = icon.innerHTML.includes('polygon');
      if (isPaused) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';
        AICC_Toast.show('재생 시작 (시뮬레이션)');
      } else {
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        AICC_Toast.show('일시 정지 (시뮬레이션)');
      }
    }

    // 프로그레스 바 클릭 위치의 상대 좌표(%)를 계산하여 재생 위치 시뮬레이션
    function seekBar(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const progress = document.getElementById('player-progress');
      if (progress) progress.style.width = pct + '%';
    }

    // A-035: 수동 검증 버튼 동작 — 검증 완료 상태로 변경 후 Toast 표시
    function openManualReview(evalId) {
      if (navStack.length === 3) {
        const { agent } = navStack[2].data;
        const ev = agent.evaluations.find(e => e.id === evalId);
        if (ev) {
          ev.verification_status = '검증 완료';
        }
      }
      AICC_Toast.show('수동 검증이 완료되었습니다.');
      AICC_Modal.close();
    }

    /* ========== 필터 ========== */
    // 기간·유형·점수 필터 적용 stub — 실제 구현 시 현재 레벨의 데이터를 재조회하여 렌더링
    function applyPeriodFilter() {
      AICC_Toast.show('필터가 적용되었습니다. (시뮬레이션)');
    }

    /* ══════════════════════════ AI 개선 제안 롤링 바 ══════════════════════════ */

    let daActiveSuggestions = [];
    let daSuggestionIdx = 0;
    let daSuggestionTimer = null;
    let daSuggestionPaused = false;

    // 현재 드릴다운 레벨(전체/센터/팀/상담사)과 활성 필터에 맞춰 동적으로 제안을 집계.
    // DUMMY 구조의 사전 집계 필드(avgScore, topDeduction, lowScoreCalls 등)와
    // 자식 노드의 통계를 활용한다.
    function daBuildSuggestions() {
      const out = [];
      const filterLabel = activeFilter && FILTER_LABELS[activeFilter] ? ` (필터: ${FILTER_LABELS[activeFilter]})` : '';

      if (currentLevel === 0) {
        // 전체 센터 비교
        const centers = (DUMMY.centers || []);
        if (!centers.length) return ['표시할 데이터가 없습니다.'];
        const sortedByScore = [...centers].sort((a, b) => a.avgScore - b.avgScore);
        const lowest = sortedByScore[0];
        const highest = sortedByScore[sortedByScore.length - 1];
        out.push(`전체 센터 평균 ${(centers.reduce((s, c) => s + c.avgScore, 0) / centers.length).toFixed(1)}점${filterLabel} — 센터별 편차를 정기 모니터링하세요.`);
        if (lowest && highest && lowest.id !== highest.id) {
          out.push(`최저 ${lowest.name} ${lowest.avgScore}점 vs 최고 ${highest.name} ${highest.avgScore}점 — 격차 ${(highest.avgScore - lowest.avgScore).toFixed(1)}점, 우수 사례 공유 추천.`);
        }
        // 긴급 이슈 합산
        const urgent = centers.reduce((s, c) => s + (c.urgentIssues || 0), 0);
        if (urgent > 0) out.push(`전체 긴급 이슈 ${urgent}건 — 센터별 드릴다운 후 즉시 코칭 검토 필요합니다.`);
        // 평가 제외 상담사
        const excluded = centers.reduce((s, c) => s + (c.excludedAgents || 0), 0);
        if (excluded > 0) out.push(`평가 제외 상담사 ${excluded}명 — 제외 사유 검토 및 평가 재개 일정 점검을 권장합니다.`);
        // 70점 미만 콜
        const low = centers.reduce((s, c) => s + (c.lowScoreCalls || 0), 0);
        if (low > 0) out.push(`70점 미만 콜 총 ${low}건 — 재교육 우선 대상 풀로 활용하세요.`);
        // 최다 감점 항목 (센터 단위 합산)
        const deductMap = {};
        centers.forEach(c => { if (c.topDeduction) deductMap[c.topDeduction.item] = (deductMap[c.topDeduction.item] || 0) + (c.topDeduction.calls || 0); });
        const topItem = Object.entries(deductMap).sort((a, b) => b[1] - a[1])[0];
        if (topItem) out.push(`최다 감점 항목 "${topItem[0]}" 총 ${topItem[1]}건 — 항목별 표준 매뉴얼 재배포가 효과적입니다.`);
      } else if (currentLevel === 1 && navStack[0]) {
        // 특정 센터 — 팀 비교
        const ws = navStack[0].data;
        const teams = ws.teams || [];
        out.push(`${ws.name} 평균 ${ws.avgScore}점${filterLabel} — 팀 ${teams.length}개 운영 중입니다.`);
        if (teams.length >= 2) {
          const sorted = [...teams].sort((a, b) => a.avgScore - b.avgScore);
          const low = sorted[0], high = sorted[sorted.length - 1];
          out.push(`최저 ${low.name} ${low.avgScore}점 vs 최고 ${high.name} ${high.avgScore}점 — 팀 간 격차 관리가 필요합니다.`);
        }
        if (ws.topDeduction) out.push(`센터 최다 감점 "${ws.topDeduction.item}" ${ws.topDeduction.calls}건 — 센터 단위 표준 스크립트 재교육을 권장합니다.`);
        if (ws.urgentIssues > 0) out.push(`${ws.name} 긴급 이슈 ${ws.urgentIssues}건 — 팀 드릴다운 후 즉시 조치 검토 필요합니다.`);
        if (ws.lowScoreCalls > 0) out.push(`${ws.name} 70점 미만 콜 ${ws.lowScoreCalls}건 (${ws.lowScorePct}%) — 재교육 풀에 등록을 권장합니다.`);
        if (ws.excludedAgents > 0) out.push(`평가 제외 상담사 ${ws.excludedAgents}명 — 제외 사유 검토가 필요합니다.`);
      } else if (currentLevel === 2 && navStack[1]) {
        // 특정 팀 — 상담사 비교
        const { ws, team } = navStack[1].data;
        const agents = team.agents || [];
        out.push(`${team.name} 평균 ${team.avgScore}점${filterLabel} — 상담사 ${agents.length}명 중 평가 완료율 ${team.completionRate}%.`);
        if (agents.length >= 2) {
          const sorted = [...agents].sort((a, b) => a.avgScore - b.avgScore);
          const low = sorted[0];
          out.push(`최저 점수 ${low.name} ${low.avgScore}점 — 1:1 코칭 우선 배정을 권장합니다.`);
        }
        if (team.topDeduction) out.push(`${team.name} 최다 감점 "${team.topDeduction.item}" ${team.topDeduction.calls}건 — 팀 단위 스크립트 점검이 효과적입니다.`);
        const urgentAgents = agents.filter(a => a.urgentIssue).length;
        if (urgentAgents > 0) out.push(`긴급 이슈 보유 상담사 ${urgentAgents}명 — 즉시 코칭 및 시말서 검토가 필요합니다.`);
        if (team.lowScoreCalls > 0) out.push(`${team.name} 70점 미만 콜 ${team.lowScoreCalls}건 (${team.lowScorePct}%) — 재교육 풀 등록 추천.`);
        const failAgents = agents.filter(a => /FAIL|금지어/.test(a.issue || '')).length;
        if (failAgents > 0) out.push(`FAIL 판정 상담사 ${failAgents}명 — 금지어 관련 즉시 코칭이 필요합니다.`);
        if (team.excludedAgents > 0) out.push(`평가 제외 상담사 ${team.excludedAgents}명 — 사유 확인 및 평가 재개 일정 점검 필요.`);
      } else if (currentLevel === 3 && navStack[2]) {
        // 특정 상담사 — 평가 이력 분석
        const { team, agent } = navStack[2].data;
        const evals = agent.evaluations || [];
        out.push(`${agent.name} (${team.name}) 평균 ${agent.avgScore}점${filterLabel} — 평가 ${evals.length}건 누적.`);
        if (agent.topDeductionItem) out.push(`개인 최다 감점 "${agent.topDeductionItem}" — 해당 항목 1:1 코칭이 가장 효과적입니다.`);
        const urgentEvals = evals.filter(e => e.urgentIssue).length;
        if (urgentEvals > 0) out.push(`긴급 이슈 평가 ${urgentEvals}건 — 시말서·재교육 일정 수립을 권장합니다.`);
        const lowEvals = evals.filter(e => (e.score || 0) <= 70).length;
        if (lowEvals > 0) out.push(`70점 이하 콜 ${lowEvals}건 — 패턴 분석 후 집중 코칭 주제 도출을 권장합니다.`);
        const deductionCnt = {};
        evals.forEach(e => {
          const items = e.deductionItems || (e.deductionItem ? [e.deductionItem] : []);
          items.forEach(it => { deductionCnt[it] = (deductionCnt[it] || 0) + 1; });
        });
        const top = Object.entries(deductionCnt).sort((a, b) => b[1] - a[1])[0];
        if (top && top[1] >= 2) out.push(`반복 감점 항목 "${top[0]}" ${top[1]}건 — 재발 방지 코칭 카드 작성을 권장합니다.`);
        if (agent.excluded) out.push(`현재 평가 제외 상태 — 제외 사유 검토 및 재개 시점 협의가 필요합니다.`);
      }

      // 비어있을 경우 안내 메시지
      if (!out.length) out.push('현재 레벨에서 표시할 제안이 없습니다.');
      return out.slice(0, 8);
    }

    function daShowSuggestionBar() {
      daActiveSuggestions = daBuildSuggestions();
      daSuggestionIdx = 0;
      daSuggestionPaused = false;
      const bar = document.getElementById('da-suggestion-bar');
      const textEl = document.getElementById('da-suggestion-text');
      bar.style.display = 'flex';
      textEl.style.opacity = '1';
      textEl.style.transform = 'translateY(0)';
      textEl.textContent = daActiveSuggestions[0];
      daUpdateSuggestionCounter();
      if (daSuggestionTimer) clearInterval(daSuggestionTimer);
      if (daActiveSuggestions.length > 1) {
        daSuggestionTimer = setInterval(() => { if (!daSuggestionPaused) daRollSuggestion(1); }, 4000);
      }
    }

    function daRollSuggestion(direction) {
      const dir = direction || 1;
      const textEl = document.getElementById('da-suggestion-text');
      textEl.style.opacity = '0';
      textEl.style.transform = `translateY(${dir > 0 ? -10 : 10}px)`;
      setTimeout(() => {
        const len = daActiveSuggestions.length;
        daSuggestionIdx = (daSuggestionIdx + dir + len) % len;
        textEl.textContent = daActiveSuggestions[daSuggestionIdx];
        textEl.style.transform = `translateY(${dir > 0 ? 10 : -10}px)`;
        daUpdateSuggestionCounter();
        requestAnimationFrame(() => {
          textEl.style.opacity = '1';
          textEl.style.transform = 'translateY(0)';
        });
      }, 350);
    }

    function daUpdateSuggestionCounter() {
      const el = document.getElementById('da-suggestion-counter');
      if (el) el.textContent = `${daSuggestionIdx + 1}/${daActiveSuggestions.length}`;
    }

    function daPrevSuggestion() { if (daActiveSuggestions.length) daRollSuggestion(-1); }
    function daNextSuggestion() { if (daActiveSuggestions.length) daRollSuggestion(1); }
    function daPauseSuggestionRolling() { daSuggestionPaused = true; }
    function daResumeSuggestionRolling() { daSuggestionPaused = false; }

    /* ══════════════════════════ 조건 요약 ══════════════════════════ */

    function daGetFilterSummary() {
      const lines = [];
      if (currentLevel === 0) {
        lines.push({ label: '범위', value: '전체 센터' });
      }
      if (currentLevel >= 1 && navStack[0]) {
        lines.push({ label: '센터', value: navStack[0].label });
      }
      if (currentLevel >= 2 && navStack[1]) {
        lines.push({ label: '팀', value: navStack[1].label });
      }
      if (currentLevel >= 3 && navStack[2]) {
        lines.push({ label: '상담사', value: navStack[2].label });
      }
      if (activeFilter && FILTER_LABELS[activeFilter]) {
        lines.push({ label: '필터', value: FILTER_LABELS[activeFilter] });
      }
      return lines;
    }

    function daGetFilterSummaryText() {
      return daGetFilterSummary().map(l => l.value).join(' / ') || '상세 분석';
    }

    /* ══════════════════════════ 조치 등록 모달 ══════════════════════════ */

    const _daAdmins = ['김관리자','박매니저','이팀장','최수석','정차장'];
    let _daDtp = { year:0, month:0, day:0, hour:0, minute:0, open:false };
    let daModalSuggestions = [];

    function _daInitDtp() {
      const now = new Date();
      _daDtp = { year:now.getFullYear(), month:now.getMonth(), day:now.getDate(), hour:now.getHours(), minute:Math.floor(now.getMinutes()/10)*10, open:false };
    }
    function _daDtpFmt() {
      return `${_daDtp.year}-${String(_daDtp.month+1).padStart(2,'0')}-${String(_daDtp.day).padStart(2,'0')} ${String(_daDtp.hour).padStart(2,'0')}:${String(_daDtp.minute).padStart(2,'0')}`;
    }
    function _daGetNow() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    // postMessage로 부모에게 iframe 전체화면 확장/복원을 요청하고, 페이지 콘텐츠를 숨겨 모달만 표시
    function _daExpandIframe() {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({ type: 'da-modal-expand' }, '*');
      var pc = document.getElementById('page-content');
      if (pc) pc.style.visibility = 'hidden';
    }
    function _daRestoreIframe() {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage({ type: 'da-modal-restore' }, '*');
      var pc = document.getElementById('page-content');
      if (pc) pc.style.visibility = '';
    }

    function daOpenActionModal() {
      _daInitDtp();
      daModalSuggestions = [...daActiveSuggestions];
      const filterLines = daGetFilterSummary();
      const filterHtml = filterLines.map(l => `<div style="font-size:13px;padding:2px 0;"><span style="color:#9E9E9E;font-weight:400;">${l.label}</span> <span style="margin:0 4px;color:#BDBDBD;">›</span> <span style="font-weight:500;color:#424242;">${l.value}</span></div>`).join('');
      const userName = typeof AICC_Auth !== 'undefined' ? AICC_Auth.getCurrentUser().name : '관리자';
      const statusOpts = ['미이행','진행중','완료'].map(s => `<option${s==='미이행'?' selected':''}>${s}</option>`).join('');

      const body = `
        <div style="display:flex;gap:0;height:100%;">
          <div style="flex:1;padding:20px;border-right:1px solid #EEEEEE;display:flex;flex-direction:column;max-height:520px;overflow-y:auto;">
            <div style="font-size:14px;font-weight:700;color:#212121;margin-bottom:16px;">개선 제안 정보</div>
            <div style="margin-bottom:12px;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">조건</div>
              <div>${filterHtml}</div>
            </div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                <div style="font-size:11px;color:#9E9E9E;">개선 제안 내용</div>
                <button class="btn btn-sm" onclick="_daShowAddInput()" style="border:1px solid #D1C4E9;background:#fff;color:#5E35B1;font-size:11px;padding:2px 10px;">+ 추가</button>
              </div>
              <div id="da-suggestions-box" style="font-size:13px;line-height:1.6;background:#F9F9F9;border-radius:6px;padding:12px;border:1px solid #EEEEEE;"></div>
            </div>
          </div>
          <div style="flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:520px;overflow-y:auto;overflow-x:visible;">
            <div style="font-size:14px;font-weight:700;color:#212121;">처리 관리</div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">조치 날짜</div>
              <div id="da-date-trigger" class="form-input" style="width:203px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="_daToggleDtp()">
                <span id="da-date-display">${_daGetNow()}</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" stroke="#9E9E9E" stroke-width="1.2"/><path d="M1.5 6h13" stroke="#9E9E9E" stroke-width="1.2"/><path d="M5 1v3M11 1v3" stroke="#9E9E9E" stroke-width="1.2" stroke-linecap="round"/></svg>
              </div>
              <input type="hidden" id="da-date-val" value="${_daGetNow()}">
            </div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">담당자</div>
              <div style="display:flex;gap:6px;">
                <input type="text" id="da-admin" class="form-input" style="width:203px;" value="${userName}" onfocus="this.select()">
                <button class="btn btn-sm" onclick="_daOpenAdminSearch()" style="white-space:nowrap;border:1px solid #D8DAE5;background:#fff;color:#424242;">검색</button>
              </div>
            </div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">이행 상태</div>
              <select id="da-status" class="form-select" style="width:203px;">${statusOpts}</select>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">처리 메모</div>
              <textarea id="da-memo" class="form-input" style="flex:1;min-height:80px;resize:none;" placeholder="처리 내용을 입력하세요"></textarea>
              <div style="display:flex;justify-content:flex-end;margin-top:8px;">
                <button class="btn btn-primary btn-sm" onclick="daSaveAction()">저장</button>
              </div>
            </div>
          </div>
        </div>`;

      _daExpandIframe();
      AICC_Modal.open({ title: '조치 등록 — 개선 제안', content: body, size: 'xl', onClose: _daRestoreIframe });
      _daRenderSuggestionItems();
    }

    // 개선 제안 1건을 [핵심 사실] + [권장 액션] 2단으로 분해해 가독성 강화
    function _daSplitSuggestion(text) {
      const m = String(text).match(/^(.*?)\s+[—\-–]\s+(.*)$/);
      if (m) return { head: m[1].trim(), tail: m[2].trim() };
      return { head: String(text).trim(), tail: '' };
    }

    function _daRenderSuggestionItems() {
      const box = document.getElementById('da-suggestions-box');
      if (!box) return;
      box.innerHTML = daModalSuggestions.map((c, i) => {
        const { head, tail } = _daSplitSuggestion(c);
        const tailHtml = tail
          ? `<div style="font-size:12px;color:#757575;line-height:1.45;margin-top:2px;">${tail}</div>`
          : '';
        const isLast = i === daModalSuggestions.length - 1;
        return `
          <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 4px;${isLast ? '' : 'border-bottom:1px solid #ECEFF1;'}">
            <span style="flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#EDE7F6;color:#5E35B1;font-size:11px;font-weight:700;line-height:1;">${i+1}</span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;color:#212121;font-weight:500;line-height:1.45;">${head}</div>
              ${tailHtml}
            </div>
            <span onclick="_daRemoveSuggestion(${i})" style="cursor:pointer;color:#BDBDBD;font-size:16px;line-height:1;flex-shrink:0;padding:2px 4px;transition:color 0.15s;" onmouseenter="this.style.color='#F44336'" onmouseleave="this.style.color='#BDBDBD'" title="삭제">&times;</span>
          </div>`;
      }).join('');
    }
    function _daRemoveSuggestion(idx) {
      if (daModalSuggestions.length <= 1) { AICC_Toast.show('최소 1개의 개선 제안이 필요합니다.'); return; }
      daModalSuggestions.splice(idx, 1);
      _daRenderSuggestionItems();
    }
    function _daShowAddInput() {
      const box = document.getElementById('da-suggestions-box');
      if (!box || document.getElementById('da-new-suggestion-row')) return;
      const row = document.createElement('div'); row.id = 'da-new-suggestion-row';
      row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:6px 0 0;';
      row.innerHTML = `<input type="text" id="da-new-suggestion-input" class="form-input" style="flex:1;font-size:12px;padding:4px 8px;" placeholder="개선 제안 내용을 입력하세요">
        <button class="btn btn-sm" onclick="_daConfirmAddItem()" style="white-space:nowrap;background:#5E35B1;color:#fff;border:none;font-size:11px;padding:4px 10px;">확인</button>`;
      box.appendChild(row);
      document.getElementById('da-new-suggestion-input').focus();
    }
    function _daConfirmAddItem() {
      const inp = document.getElementById('da-new-suggestion-input');
      if (!inp || !inp.value.trim()) { AICC_Toast.show('내용을 입력해주세요.'); return; }
      daModalSuggestions.push(inp.value.trim());
      _daRenderSuggestionItems();
    }

    function _daToggleDtp() {
      if (_daDtp.open) { _daCloseDtp(); return; }
      _daDtp.open = true;
      _daRenderDtp();
    }
    function _daCloseDtp() {
      _daDtp.open = false;
      const ov = document.getElementById('da-dtp-overlay');
      if (ov) ov.remove();
    }
    function _daRenderDtp() {
      let ov = document.getElementById('da-dtp-overlay');
      if (!ov) {
        ov = document.createElement('div'); ov.id = 'da-dtp-overlay';
        ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:10001;';
        ov.addEventListener('click', e => { if (e.target === ov) _daCloseDtp(); });
        document.body.appendChild(ov);
      }
      const trigger = document.getElementById('da-date-trigger');
      const rect = trigger.getBoundingClientRect();
      let top = rect.bottom + 4, left = rect.left;
      if (top + 420 > window.innerHeight) top = rect.top - 424;
      if (left + 300 > window.innerWidth) left = window.innerWidth - 308;

      const y = _daDtp.year, m = _daDtp.month;
      const daysIn = new Date(y, m+1, 0).getDate();
      const firstDay = new Date(y, m, 1).getDay();
      const todayStr = _daGetNow().split(' ')[0];

      let cal = '';
      ['일','월','화','수','목','금','토'].forEach(w => { cal += `<div class="pp-weekday">${w}</div>`; });
      for (let i = 0; i < firstDay; i++) cal += '<div class="pp-day empty"></div>';
      for (let d = 1; d <= daysIn; d++) {
        const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let cls = 'pp-day';
        if (ds === todayStr) cls += ' today';
        if (d === _daDtp.day) cls += ' selected';
        cal += `<div class="${cls}" onclick="_daDtpDay(${d})">${d}</div>`;
      }
      let hO = ''; for (let h = 0; h < 24; h++) hO += `<option value="${h}" ${h===_daDtp.hour?'selected':''}>${String(h).padStart(2,'0')}시</option>`;
      let mO = ''; for (let mi = 0; mi < 60; mi += 10) mO += `<option value="${mi}" ${mi===_daDtp.minute?'selected':''}>${String(mi).padStart(2,'0')}분</option>`;

      ov.innerHTML = `<div style="position:fixed;top:${top}px;left:${left}px;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);border:1px solid #E6E8F0;width:300px;z-index:10002;">
        <div class="pp-body" style="padding:12px;">
          <div class="pp-nav"><button type="button" class="pp-nav-btn" onclick="_daDtpNav(-1)">‹</button><span class="pp-nav-title">${y}년 ${m+1}월</span><button type="button" class="pp-nav-btn" onclick="_daDtpNav(1)">›</button></div>
          <div class="pp-cal-grid">${cal}</div>
          <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
            <span style="font-size:12px;color:#616161;font-weight:500;white-space:nowrap;">시간</span>
            <select class="form-select" style="flex:1;min-width:0;padding:4px 8px;font-size:13px;" onchange="_daDtp.hour=parseInt(this.value)">${hO}</select>
            <select class="form-select" style="flex:1;min-width:0;padding:4px 8px;font-size:13px;" onchange="_daDtp.minute=parseInt(this.value)">${mO}</select>
          </div>
        </div>
        <div class="pp-footer"><button type="button" class="pp-footer-btn" onclick="_daCloseDtp()">취소</button><button type="button" class="pp-footer-btn primary" onclick="_daDtpApply()">확인</button></div>
      </div>`;
    }
    function _daDtpNav(dir) {
      _daDtp.month += dir;
      if (_daDtp.month < 0) { _daDtp.month = 11; _daDtp.year--; }
      if (_daDtp.month > 11) { _daDtp.month = 0; _daDtp.year++; }
      const mx = new Date(_daDtp.year, _daDtp.month+1, 0).getDate();
      if (_daDtp.day > mx) _daDtp.day = mx;
      _daRenderDtp();
    }
    function _daDtpDay(d) { _daDtp.day = d; _daRenderDtp(); }
    function _daDtpApply() {
      const v = _daDtpFmt();
      document.getElementById('da-date-val').value = v;
      document.getElementById('da-date-display').textContent = v;
      _daCloseDtp();
    }

    function _daOpenAdminSearch() {
      if (document.getElementById('da-admin-overlay')) return;
      const ov = document.createElement('div'); ov.id = 'da-admin-overlay';
      ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:10000;display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = `<div style="background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.18);width:360px;max-height:420px;display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:14px;font-weight:700;">담당자 검색</span>
          <span style="cursor:pointer;font-size:18px;color:#9E9E9E;" onclick="_daCloseAdminSearch()">&times;</span>
        </div>
        <div style="padding:12px 20px;"><input type="text" id="da-admin-search-input" class="form-input" style="width:100%;" placeholder="이름을 입력하세요" oninput="_daFilterAdminList()"></div>
        <div id="da-admin-search-list" style="flex:1;overflow-y:auto;padding:0 20px 16px;min-height:280px;"></div>
      </div>`;
      ov.addEventListener('click', e => { if (e.target === ov) _daCloseAdminSearch(); });
      document.body.appendChild(ov);
      _daFilterAdminList();
      document.getElementById('da-admin-search-input').focus();
    }
    function _daFilterAdminList() {
      const q = (document.getElementById('da-admin-search-input')?.value || '').trim().toLowerCase();
      const list = _daAdmins.filter(n => n.toLowerCase().includes(q));
      const el = document.getElementById('da-admin-search-list');
      if (!el) return;
      el.innerHTML = list.length === 0
        ? '<div style="text-align:center;color:#9E9E9E;font-size:12px;padding:16px;">검색 결과가 없습니다</div>'
        : list.map(n => `<div onclick="_daSelectAdmin('${n}')" style="padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background 0.15s;" onmouseenter="this.style.background='#F5F5F5'" onmouseleave="this.style.background=''">
            <span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#E3F2FD;color:#1976D2;font-size:12px;font-weight:600;text-align:center;line-height:28px;">${n.charAt(0)}</span>
            <span>${n}</span><span style="font-size:11px;color:#9E9E9E;margin-left:auto;">관리자</span>
          </div>`).join('');
    }
    function _daSelectAdmin(name) { const inp = document.getElementById('da-admin'); if (inp) inp.value = name; _daCloseAdminSearch(); }
    function _daCloseAdminSearch() { const ov = document.getElementById('da-admin-overlay'); if (ov) ov.remove(); }

    function daSaveAction() {
      const actionDate = document.getElementById('da-date-val').value;
      if (!actionDate) { AICC_Toast.show('조치 날짜를 선택해주세요.'); return; }
      const adminName = document.getElementById('da-admin').value.trim();
      if (!adminName) { AICC_Toast.show('담당자를 입력해주세요.'); return; }
      const status = document.getElementById('da-status').value;
      const memo = document.getElementById('da-memo').value.trim();
      if (!memo) { AICC_Toast.show('처리 메모를 입력해주세요.'); return; }

      const summaryText = daGetFilterSummaryText();
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

      const newItem = {
        reportType: summaryText,
        periodFrom: todayStr,
        periodTo: todayStr,
        contents: [...daModalSuggestions],
        admin: adminName,
        status: status,
        completedDate: status === '완료' ? todayStr : '-',
        history: [{ date: actionDate, author: adminName, status: status, memo: memo }]
      };

      const stored = JSON.parse(localStorage.getItem('AICC_IMPROVEMENT_ITEMS') || '[]');
      stored.push(newItem);
      localStorage.setItem('AICC_IMPROVEMENT_ITEMS', JSON.stringify(stored));

      AICC_Modal.close();
      AICC_Toast.show('조치가 등록되었습니다. 개선 이행 관리에서 확인할 수 있습니다.');
    }
  </script>
</body>
</html>
