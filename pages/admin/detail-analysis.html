<!DOCTYPE html>

<head>

<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 페이지 제목 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">상세 분석</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">워크스페이스 / 팀 / 상담사 단위 드릴다운 분석</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="period-picker-container"></div>
        <select class="form-select" id="type-filter" onchange="applyPeriodFilter()">
          <option value="all">전체 유형</option>
          <option value="I/B">I/B (인바운드)</option>
          <option value="O/B">O/B (아웃바운드)</option>
        </select>
        <select class="form-select" id="score-range-filter" onchange="applyPeriodFilter()">
          <option value="all">전체 점수</option>
          <option value="high">80점 이상</option>
          <option value="mid">60 ~ 79점</option>
          <option value="low">60점 미만</option>
        </select>
      </div>
    </div>

    <!-- 브레드크럼 네비게이션 -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding:12px 20px;background:white;border:1px solid #E0E0E0;border-radius:8px;">
      <button class="btn btn-secondary btn-sm" id="back-btn" onclick="goBack()" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        뒤로
      </button>
      <div id="breadcrumb" style="display:flex;align-items:center;gap:6px;font-size:13px;">
        <span style="font-weight:600;color:#0F766E;">전체</span>
      </div>
    </div>

    <!-- KPI 카드 -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;" id="kpi-cards">
      <!-- JS로 동적 생성 -->
    </div>

    <!-- 데이터 테이블 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;" id="table-title">워크스페이스별 현황</span>
        <span style="font-size:12px;color:#757575;" id="table-count"></span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead id="table-head">
            <!-- JS로 동적 생성 -->
          </thead>
          <tbody id="table-body">
            <!-- JS로 동적 생성 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

    /* ========== 상태 관리 ========== */
    let currentLevel = 0; // 0=전체, 1=워크스페이스, 2=팀, 3=상담사
    let navStack = []; // [{level, label, data}]

    // URL 파라미터(?ws=&team=) 기반 딥링크를 지원하여, 다른 페이지에서 특정 팀으로 바로 진입 가능
    document.addEventListener('DOMContentLoaded', () => {
      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function() { applyPeriodFilter(); }
      });

      const params = new URLSearchParams(window.location.search);
      const wsName = params.get('ws');
      const teamName = params.get('team');

      if (wsName && teamName) {
        const ws = DUMMY.workspaces.find(w => w.name === wsName);
        if (ws) {
          const team = ws.teams.find(t => t.name === teamName);
          if (team) {
            drillToTeam(ws.id, team.id);
            return;
          }
        }
      }
      renderLevel0();
    });

    /* ========== 브레드크럼 ========== */
    // navStack을 순회하며 클릭 가능한 경로 링크를 생성하되, 마지막 항목만 비활성화하여 현재 위치 표시
    function updateBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      const backBtn = document.getElementById('back-btn');

      let parts = ['<span style="cursor:pointer;color:#0F766E;" onclick="goToLevel(0)">전체</span>'];
      navStack.forEach((item, idx) => {
        const isLast = idx === navStack.length - 1;
        if (isLast) {
          parts.push(`<span style="font-weight:600;">${item.label}</span>`);
        } else {
          parts.push(`<span style="cursor:pointer;color:#0F766E;" onclick="goToLevel(${idx + 1})">${item.label}</span>`);
        }
      });

      bc.innerHTML = parts.join('<span style="color:#BDBDBD;margin:0 2px;">/</span>');
      backBtn.style.display = currentLevel > 0 ? '' : 'none';
    }

    // navStack을 slice하여 원하는 레벨로 점프 — 브레드크럼 클릭 시 중간 레벨 복원에 사용
    function goToLevel(level) {
      if (level === 0) {
        currentLevel = 0;
        navStack = [];
        renderLevel0();
      } else if (level <= navStack.length) {
        navStack = navStack.slice(0, level);
        currentLevel = level;
        const item = navStack[level - 1];
        if (level === 1) renderLevel1(item.data);
        else if (level === 2) renderLevel2(item.data);
        else if (level === 3) renderLevel3(item.data);
      }
      updateBreadcrumb();
    }

    function goBack() {
      if (currentLevel > 0) {
        goToLevel(currentLevel - 1);
      }
    }

    /* ========== KPI 카드 렌더링 ========== */
    // 범용 KPI 렌더러 — 레벨별로 다른 지표를 동일한 카드 형태로 표현하기 위해 items 배열 기반 설계
    function renderKPI(items) {
      const container = document.getElementById('kpi-cards');
      container.innerHTML = items.map(card => {
        const scoreStyle = card.isScore ? `color:${AICC_Fmt.scoreColor(card.rawValue)}` : '';
        return `
          <div class="kpi-card fade-in">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="font-size:28px;font-weight:700;${scoreStyle}">${card.value}</div>
            ${card.sub ? `<div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.sub}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    /* ========== Level 0: 워크스페이스 목록 ========== */
    // 최상위 뷰: 전체 워크스페이스를 집계하여 KPI와 테이블을 동시에 갱신
    function renderLevel0() {
      currentLevel = 0;
      navStack = [];
      updateBreadcrumb();

      const ws = DUMMY.workspaces;
      const totalCalls = ws.reduce((s, w) => s + w.totalCalls, 0);
      const totalEvals = ws.reduce((s, w) => s + w.totalEvals, 0);
      const avgScore = ws.reduce((s, w) => s + w.avgScore, 0) / ws.length;

      renderKPI([
        { label: '총 상담 건수', value: AICC_Fmt.number(totalCalls), sub: `${ws.length}개 워크스페이스` },
        { label: '총 평가 건수', value: AICC_Fmt.number(totalEvals), sub: `완료율 ${((totalEvals / totalCalls) * 100).toFixed(1)}%` },
        { label: '전체 평균 점수', value: AICC_Fmt.score(avgScore), rawValue: avgScore, isScore: true, sub: '전 워크스페이스 기준' }
      ]);

      document.getElementById('table-title').textContent = '워크스페이스별 현황';
      document.getElementById('table-count').textContent = `총 ${ws.length}개`;

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th>워크스페이스</th>
          <th style="text-align:right">상담사 수</th>
          <th style="text-align:right">상담 건수</th>
          <th style="text-align:right">평가 건수</th>
          <th style="text-align:right">완료율</th>
          <th style="text-align:right">평균 점수</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = ws.map(w => `
        <tr onclick="drillToWorkspace('${w.id}')" class="fade-in">
          <td style="font-weight:500;">${w.name}</td>
          <td style="text-align:right;">${AICC_Fmt.number(w.agentCount)}명</td>
          <td style="text-align:right;">${AICC_Fmt.number(w.totalCalls)}</td>
          <td style="text-align:right;">${AICC_Fmt.number(w.totalEvals)}</td>
          <td style="text-align:right;">${AICC_Fmt.percent(w.completionRate)}</td>
          <td style="text-align:right;">${AICC_Fmt.scoreHtml(w.avgScore)}</td>
        </tr>
      `).join('');
    }

    /* ========== Level 1: 팀 목록 (워크스페이스 내) ========== */
    // 테이블 행 클릭 진입점 — navStack에 워크스페이스 컨텍스트를 push한 뒤 팀 목록 렌더링
    function drillToWorkspace(wsId) {
      const ws = DUMMY.workspaces.find(w => w.id === wsId);
      if (!ws) return;

      currentLevel = 1;
      navStack = [{ level: 1, label: ws.name, data: ws }];
      renderLevel1(ws);
      updateBreadcrumb();
    }

    // 워크스페이스 내 팀별 비교 뷰 렌더링
    function renderLevel1(ws) {
      const teams = ws.teams;

      renderKPI([
        { label: '팀 수', value: teams.length + '개', sub: `상담사 ${AICC_Fmt.number(ws.agentCount)}명` },
        { label: '상담 건수', value: AICC_Fmt.number(ws.totalCalls), sub: `평가 ${AICC_Fmt.number(ws.totalEvals)}건` },
        { label: '평균 점수', value: AICC_Fmt.score(ws.avgScore), rawValue: ws.avgScore, isScore: true, sub: ws.name + ' 기준' }
      ]);

      document.getElementById('table-title').textContent = ws.name + ' - 팀별 현황';
      document.getElementById('table-count').textContent = `총 ${teams.length}개 팀`;

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th>팀명</th>
          <th style="text-align:right">상담사 수</th>
          <th style="text-align:right">상담 건수</th>
          <th style="text-align:right">평가 건수</th>
          <th style="text-align:right">완료율</th>
          <th style="text-align:right">평균 점수</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = teams.map(t => `
        <tr onclick="drillToTeam('${ws.id}','${t.id}')" class="fade-in">
          <td style="font-weight:500;">${t.name}</td>
          <td style="text-align:right;">${t.agentCount}명</td>
          <td style="text-align:right;">${AICC_Fmt.number(t.totalCalls)}</td>
          <td style="text-align:right;">${AICC_Fmt.number(t.totalEvals)}</td>
          <td style="text-align:right;">${AICC_Fmt.percent(t.completionRate)}</td>
          <td style="text-align:right;">${AICC_Fmt.scoreHtml(t.avgScore)}</td>
        </tr>
      `).join('');
    }

    /* ========== Level 2: 상담사 목록 (팀 내) ========== */
    // ws→team 2단계 navStack을 한 번에 구성 — 딥링크 및 직접 클릭 모두 지원
    function drillToTeam(wsId, teamId) {
      const ws = DUMMY.workspaces.find(w => w.id === wsId);
      if (!ws) return;
      const team = ws.teams.find(t => t.id === teamId);
      if (!team) return;

      currentLevel = 2;
      navStack = [
        { level: 1, label: ws.name, data: ws },
        { level: 2, label: team.name, data: { ws, team } }
      ];
      renderLevel2({ ws, team });
      updateBreadcrumb();
    }

    // 팀 내 상담사별 순위·유형 비교 뷰 렌더링
    function renderLevel2(ctx) {
      const { ws, team } = ctx;
      const agents = team.agents;

      renderKPI([
        { label: '상담사 수', value: agents.length + '명', sub: team.name },
        { label: '상담 건수', value: AICC_Fmt.number(team.totalCalls), sub: `평가 ${AICC_Fmt.number(team.totalEvals)}건` },
        { label: '팀 평균 점수', value: AICC_Fmt.score(team.avgScore), rawValue: team.avgScore, isScore: true, sub: `완료율 ${AICC_Fmt.percent(team.completionRate)}` }
      ]);

      document.getElementById('table-title').textContent = team.name + ' - 상담사별 현황';
      document.getElementById('table-count').textContent = `총 ${agents.length}명`;

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th style="width:40px">순위</th>
          <th>상담사</th>
          <th>통화유형</th>
          <th style="text-align:right">상담 건수</th>
          <th style="text-align:right">평가 건수</th>
          <th style="text-align:right">평균 점수</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = agents.map(a => `
        <tr onclick="drillToAgent('${ws.id}','${team.id}','${a.id}')" class="fade-in">
          <td style="font-weight:600;color:#757575;text-align:center;">${a.rank}</td>
          <td style="font-weight:500;">${a.name}</td>
          <td>${a.callType === 'I/B' ? '<span class="badge badge-nlp">I/B</span>' : '<span class="badge badge-ai">O/B</span>'}</td>
          <td style="text-align:right;">${AICC_Fmt.number(a.totalCalls)}</td>
          <td style="text-align:right;">${AICC_Fmt.number(a.totalEvals)}</td>
          <td style="text-align:right;">${AICC_Fmt.scoreHtml(a.avgScore)}</td>
        </tr>
      `).join('');
    }

    /* ========== Level 3: 평가 목록 (상담사) ========== */
    // ws→team→agent 3단계 navStack을 한 번에 구성하여 모달에서 컨텍스트 참조 가능하게 함
    function drillToAgent(wsId, teamId, agentId) {
      const ws = DUMMY.workspaces.find(w => w.id === wsId);
      if (!ws) return;
      const team = ws.teams.find(t => t.id === teamId);
      if (!team) return;
      const agent = team.agents.find(a => a.id === agentId);
      if (!agent) return;

      currentLevel = 3;
      navStack = [
        { level: 1, label: ws.name, data: ws },
        { level: 2, label: team.name, data: { ws, team } },
        { level: 3, label: agent.name, data: { ws, team, agent } }
      ];
      renderLevel3({ ws, team, agent });
      updateBreadcrumb();
    }

    // 개별 상담사의 평가 이력 뷰 — 이슈 건수를 별도 KPI로 표시하여 주의 필요 상담 즉시 파악 가능
    function renderLevel3(ctx) {
      const { ws, team, agent } = ctx;
      const evals = agent.evaluations;
      const avgScore = evals.reduce((s, e) => s + e.score, 0) / evals.length;

      renderKPI([
        { label: '평가 건수', value: evals.length + '건', sub: agent.name + ' (' + team.name + ')' },
        { label: '평균 점수', value: AICC_Fmt.score(avgScore), rawValue: avgScore, isScore: true, sub: '개인 평균' },
        { label: '이슈 건수', value: evals.filter(e => e.issue).length + '건', sub: '주의 필요 항목' }
      ]);

      document.getElementById('table-title').textContent = agent.name + ' - 평가 이력';
      document.getElementById('table-count').textContent = `총 ${evals.length}건`;

      const thead = document.getElementById('table-head');
      thead.innerHTML = `
        <tr>
          <th>평가 ID</th>
          <th>일시</th>
          <th>통화시간</th>
          <th>평가방식</th>
          <th>신뢰도</th>
          <th style="text-align:right">점수</th>
          <th>이슈</th>
        </tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = evals.map(ev => {
        // 신뢰도 High/Mid에 따라 시각적 배지 구분 — 낮은 신뢰도 평가는 수동 검증 우선순위 판단에 활용
        const confBadge = ev.confidence === 'High'
          ? '<span class="badge badge-active">High</span>'
          : '<span class="badge badge-pending">Mid</span>';

        const issueHtml = ev.issue
          ? `<span style="font-size:11px;color:#F57F17;">${ev.issue}</span>`
          : '<span style="color:#9E9E9E;font-size:11px;">-</span>';

        return `
          <tr onclick="showEvalDetail('${ev.id}')" class="fade-in">
            <td style="font-size:12px;font-family:monospace;">${ev.id}</td>
            <td style="font-size:12px;">${ev.date} ${ev.time}</td>
            <td style="font-size:12px;">${ev.duration}</td>
            <td>${AICC_Fmt.typeBadge(ev.type)}</td>
            <td>${confBadge}</td>
            <td style="text-align:right;">${AICC_Fmt.scoreHtml(ev.score)}</td>
            <td style="max-width:150px;">${issueHtml}</td>
          </tr>
        `;
      }).join('');
    }

    /* ========== 평가 상세 모달 ========== */
    // 실제 평가표 항목 구조를 반영한 시뮬레이션 데이터 — NLP/AI 방식 구분은 실제 채점 엔진 유형과 매핑
    const SIM_SCORE_ITEMS = [
      { name: '첫인사', max: 6, type: 'NLP' },
      { name: '고객 인사 화답', max: 6, type: 'AI' },
      { name: '긍/부정 공감', max: 5, type: 'AI' },
      { name: '동시 발화', max: 6, type: 'NLP' },
      { name: '양해 없는 무응답', max: 5, type: 'NLP' },
      { name: '욕설/금지어', max: 0, type: 'NLP' },
      { name: '말끊기', max: 5, type: 'NLP' },
      { name: '고객향 상담', max: 5, type: 'AI' },
      { name: '상담 어미', max: 5, type: 'NLP' },
      { name: '전문적 화법', max: 6, type: 'NLP' },
      { name: '적극성(회피)', max: 6, type: 'AI' },
      { name: '편리(재질의)', max: 6, type: 'NLP' },
      { name: '신속성', max: 6, type: 'NLP' },
      { name: '어조', max: 6, type: 'AI' },
      { name: '개인정보 확인', max: 6, type: 'NLP' },
      { name: '문제 해결', max: 6, type: 'AI' },
      { name: '쉬운 설명', max: 6, type: 'AI' },
      { name: '적극적 응대', max: 6, type: 'AI' }
    ];

    // 총점 비율(ratio)에 따라 감점 확률을 역비례 적용하여, 고득점자는 감점이 적은 현실적 분포를 시뮬레이션
    function generateSimScores(totalScore) {
      // 0.6~1.0 범위로 클램핑 — 극단적 저점수에서도 최소 60% 통과율 보장
      const ratio = Math.max(0.6, Math.min(1, totalScore / 100));
      return SIM_SCORE_ITEMS.map(item => {
        let score = item.max;
        if (item.max > 0) {
          // ratio 미만 난수일 때만 감점 — 고득점자일수록 감점 확률 낮음
          const loss = Math.random() < ratio ? 0 : Math.ceil(Math.random() * 2);
          score = Math.max(0, item.max - loss);
        }
        const diff = item.max - score;
        const status = diff === 0 ? 'pass' : diff === 1 ? 'warn' : 'fail';
        const reason = status === 'warn' && item.name === '전문적 화법' ? '비언어 발화 2회' : '';
        const confidence = item.type === 'AI' ? Math.floor(88 + Math.random() * 10) : null;
        return { name: item.name, score, max: item.max, type: item.type, status, reason, confidence };
      });
    }

    // 데모용 고정 시나리오 스크립트 — 실제 서비스에서는 STT API 응답으로 대체
    function generateSimTranscript(agentName) {
      return [
        { speaker: 'agent', time: '00:01', text: `안녕하세요, ${agentName}입니다. 무엇을 도와드릴까요?` },
        { speaker: 'customer', time: '00:05', text: '네, 안녕하세요. 주문 건 확인 좀 부탁드릴게요.' },
        { speaker: 'agent', time: '00:10', text: '네, 주문 확인 도와드리겠습니다. 주문번호 확인 부탁드리겠습니다.' },
        { speaker: 'customer', time: '00:15', text: '주문번호는 ORD-2025-00382입니다.' },
        { speaker: 'agent', time: '00:20', text: '확인하겠습니다. 잠시만 기다려주세요. 네, 확인되었습니다. 현재 배송 중이며 내일 오전 도착 예정입니다.' },
        { speaker: 'customer', time: '00:30', text: '아, 감사합니다. 다른 건 없어요.' },
        { speaker: 'agent', time: '00:33', text: '감사합니다. 좋은 하루 되세요!' }
      ];
    }

    // 점수 구간별 피드백 분기 — 실제 서비스에서는 LLM 기반 자동 생성으로 대체 예정
    function generateSimFeedback(totalScore) {
      if (totalScore >= 95) return '전반적으로 매우 우수한 상담입니다. 고객 요구사항을 정확히 파악하고 신속하게 처리하였습니다.';
      if (totalScore >= 85) return '우수한 상담입니다. 일부 항목에서 소폭 감점이 있으나 전반적으로 양호합니다.';
      if (totalScore >= 70) return '보통 수준의 상담입니다. 고객 응대 스킬 및 문제 해결 역량 향상이 필요합니다.';
      return '개선이 필요한 상담입니다. 기본 응대 매뉴얼을 재확인하고 교육에 참여해 주세요.';
    }

    // navStack 3단계 컨텍스트(ws→team→agent)에서 메타 정보를 추출하여 모달에 표시
    function showEvalDetail(evalId) {
      let foundEval = null;
      if (navStack.length === 3) {
        const { agent } = navStack[2].data;
        foundEval = agent.evaluations.find(e => e.id === evalId);
      }
      if (!foundEval) return;

      const ev = foundEval;
      const agentName = navStack[2].data.agent.name;
      const wsName = navStack[0].label;
      const teamName = navStack[1].label;
      const callType = navStack[2].data.agent.callType || 'I/B';

      // 통화유형·팀명으로 평가표 분기 — 실제로는 워크스페이스별 설정에서 매핑
      const simEvalForm = callType === 'O/B' ? 'O/B 텔레마케팅 평가표 v1.3'
        : teamName.includes('VIP') ? 'I/B VIP 평가표 v1.0' : 'I/B 일반 상담 평가표 v2.1';
      const simConsultTypes = [
        '배송 > 배송조회 > 한정판 스니커즈', '결제 > 환불처리 > 환불지연',
        '교환/반품 > 사이즈교환', '상품문의 > 의류 > 사이즈안내',
        '기술지원 > 앱오류 > 로그인실패', '기술지원 > 결제오류 > 카드결제',
        '배송 > 배송비 > 추가배송비 외 2건', '해피콜 > 만족도조사 > 배송완료',
        'VIP관리 > 프로모션안내 > 시즌할인', '교환/반품 > 반품접수 > 불량상품',
        '상품문의 > 신발 > 재입고문의', '프로모션 > 쿠폰안내 > 생일쿠폰',
        '회원 > 정보변경 > 배송지변경', '프로모션 > 멤버십안내 > 등급혜택'
      ];
      // evalId의 숫자 부분을 해시로 사용하여 동일 평가에 항상 같은 상담유형이 할당되도록 보장
      const simConsultType = simConsultTypes[parseInt(evalId.replace(/\D/g,'')) % simConsultTypes.length];

      const simScores = generateSimScores(ev.score);
      const simTranscript = generateSimTranscript(agentName);
      const simFeedback = generateSimFeedback(ev.score);

      const scoreRows = simScores.map(d => {
        const statusCls = d.status === 'pass' ? 'score-good' : d.status === 'warn' ? 'score-warn' : 'score-danger';
        const statusText = d.status === 'pass' ? '통과' : d.status === 'warn' ? '주의' : '미달';
        const confHtml = d.confidence ? `<span style="font-size:11px;color:#757575;">${d.confidence}%</span>` : '';
        const reasonHtml = d.reason ? `<div style="font-size:10px;color:#F57F17;margin-top:2px;">${d.reason}</div>` : '';
        return `
          <tr style="cursor:default;">
            <td style="font-size:12px;">${d.name}</td>
            <td>${AICC_Fmt.typeBadge(d.type)}</td>
            <td style="text-align:right;font-weight:500;">${d.score} / ${d.max}</td>
            <td><span class="${statusCls}" style="font-size:12px;">${statusText}</span>${reasonHtml}</td>
            <td>${confHtml}</td>
          </tr>
        `;
      }).join('');

      const transcriptHtml = simTranscript.map(t => {
        const isAgent = t.speaker === 'agent';
        const bg = isAgent ? '#E0F2F1' : '#F5F5F5';
        const hoverBg = isAgent ? '#B2DFDB' : '#EEEEEE';
        const label = isAgent ? '상담사' : '고객';
        return `
          <div class="transcript-line" style="display:flex;gap:12px;padding:8px 0;cursor:pointer;border-radius:6px;transition:background 0.15s;" onclick="playSegment(this, '${t.time}')" onmouseenter="this.style.background='${hoverBg}'" onmouseleave="if(!this.classList.contains('playing'))this.style.background=''">
            <div style="min-width:50px;font-size:11px;color:#757575;padding-top:2px;">${t.time}</div>
            <div style="flex:1;">
              <div style="font-size:11px;font-weight:600;color:${isAgent ? '#0F766E' : '#424242'};margin-bottom:2px;">${label}</div>
              <div style="background:${bg};padding:8px 12px;border-radius:6px;font-size:13px;line-height:1.5;display:flex;align-items:start;gap:8px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="${isAgent ? '#0F766E' : '#757575'}" style="flex-shrink:0;margin-top:3px;opacity:0.5;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>${t.text}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      const scoreColor = ev.score >= 80 ? 'color:#4CAF50' : ev.score >= 60 ? 'color:#FFC107' : 'color:#F44336';

      AICC_Modal.open({
        title: `평가 상세 - ${ev.id}`,
        size: 'xl',
        content: `
          <div style="display:flex;gap:32px;margin-bottom:20px;flex-wrap:wrap;padding:16px 20px;background:#FAFAFA;border-radius:8px;border:1px solid #EEEEEE;">
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">상담사</span><strong style="font-size:14px;">${agentName}</strong></div>
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">팀</span><strong style="font-size:14px;">${wsName} &gt; ${teamName}</strong></div>
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">유형</span><span class="badge ${callType === 'I/B' ? 'badge-nlp' : 'badge-ai'}" style="font-size:12px;margin-top:2px;">${callType}</span></div>
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">일시</span><strong style="font-size:14px;">${ev.date} ${ev.time}</strong></div>
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">통화시간</span><strong style="font-size:14px;">${ev.duration}</strong></div>
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">총점</span><strong style="font-size:20px;${scoreColor}">${AICC_Fmt.score(ev.score)}점</strong></div>
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">평가표</span><strong style="font-size:13px;">${simEvalForm}</strong></div>
            <div><span style="font-size:11px;color:#9E9E9E;display:block;margin-bottom:4px;">상담유형</span><strong style="font-size:13px;">${simConsultType}</strong></div>
          </div>

          <div style="background:#F5F5F5;border-radius:6px;padding:12px 16px;margin-bottom:16px;font-size:13px;line-height:1.6;"><strong>AI 피드백:</strong> ${simFeedback}</div>

          <div class="tab-nav" style="margin-bottom:16px;">
            <div class="tab-item active" onclick="switchDetailTab(this, 'scores-tab')">항목별 점수</div>
            <div class="tab-item" onclick="switchDetailTab(this, 'script-tab')">스크립트</div>
          </div>

          <div id="scores-tab">
            <table class="data-table">
              <thead>
                <tr>
                  <th>평가 항목</th>
                  <th>방식</th>
                  <th style="text-align:right">점수</th>
                  <th>상태</th>
                  <th>신뢰도</th>
                </tr>
              </thead>
              <tbody>${scoreRows}</tbody>
            </table>
          </div>

          <div id="script-tab" style="display:none;">
            <div style="background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;padding:16px;max-height:350px;overflow-y:auto;">
              ${transcriptHtml}
            </div>
            <div style="margin-top:12px;background:#F5F5F5;border:1px solid #E0E0E0;border-radius:8px;padding:12px 16px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <button onclick="togglePlay(this)" style="background:none;border:none;cursor:pointer;padding:0;">
                  <svg id="play-btn-icon" width="22" height="22" viewBox="0 0 24 24" fill="#424242"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </button>
                <div style="flex:1;">
                  <div style="width:100%;height:4px;background:#BDBDBD;border-radius:2px;position:relative;cursor:pointer;" onclick="seekBar(event)">
                    <div id="player-progress" style="width:0%;height:100%;background:#0F766E;border-radius:2px;transition:width 0.2s;"></div>
                  </div>
                </div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding-left:34px;">
                <span id="player-time" style="font-size:11px;color:#757575;">0:00</span>
                <span id="player-segment-label" style="font-size:11px;color:#0F766E;"></span>
                <span style="font-size:11px;color:#757575;">${ev.duration || '0:00'}</span>
              </div>
            </div>
          </div>
        `,
        footer: `
          <button class="btn btn-primary" onclick="openManualReview('${ev.id}')">수동 검증</button>
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
        `
      });
    }

    // 모달 내 탭 전환 — display 토글 방식으로 탭 상태를 유지하여 재렌더링 방지
    function switchDetailTab(btn, tabId) {
      btn.parentElement.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('scores-tab').style.display = tabId === 'scores-tab' ? '' : 'none';
      document.getElementById('script-tab').style.display = tabId === 'script-tab' ? '' : 'none';
    }

    // 스크립트 라인 클릭 시 해당 구간 재생 시뮬레이션 — 이전 하이라이트를 해제하고 현재 라인만 활성화
    function playSegment(el, time) {
      document.querySelectorAll('.transcript-line').forEach(line => {
        line.classList.remove('playing');
        line.style.background = '';
      });
      el.classList.add('playing');
      // SVG fill 색상(#0F766E=상담사)으로 화자를 구분하여 각기 다른 하이라이트 색상 적용
      el.style.background = el.querySelector('[fill="#0F766E"]') ? '#B2DFDB' : '#EEEEEE';

      const label = document.getElementById('player-segment-label');
      if (label) label.textContent = '\u25B6 ' + time + ' 구간 재생 중';

      const timeEl = document.getElementById('player-time');
      if (timeEl) timeEl.textContent = time;

      const progress = document.getElementById('player-progress');
      if (progress) {
        const pct = Math.min(95, Math.max(5, Math.random() * 80 + 10));
        progress.style.width = pct + '%';
      }

      const playIcon = document.getElementById('play-btn-icon');
      if (playIcon) playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';

      AICC_Toast.show(`${time} 구간 재생 (시뮬레이션)`);
    }

    // SVG innerHTML 내 polygon(▶) / rect(⏸) 존재 여부로 재생 상태를 판별하는 토글 방식
    function togglePlay(btn) {
      const icon = document.getElementById('play-btn-icon');
      if (!icon) return;
      const isPaused = icon.innerHTML.includes('polygon');
      if (isPaused) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';
        AICC_Toast.show('재생 시작 (시뮬레이션)');
      } else {
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        AICC_Toast.show('일시 정지 (시뮬레이션)');
      }
    }

    // 프로그레스 바 클릭 위치의 상대 좌표(%)를 계산하여 재생 위치 시뮬레이션
    function seekBar(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const progress = document.getElementById('player-progress');
      if (progress) progress.style.width = pct + '%';
    }

    // 수동 검증 페이지 이동 stub — 실제 구현 시 evalId를 쿼리파라미터로 전달 예정
    function openManualReview(evalId) {
      AICC_Toast.show('수동 검증 화면으로 이동합니다. (시뮬레이션)');
    }

    /* ========== 필터 ========== */
    // 기간·유형·점수 필터 적용 stub — 실제 구현 시 현재 레벨의 데이터를 재조회하여 렌더링
    function applyPeriodFilter() {
      AICC_Toast.show('필터가 적용되었습니다. (시뮬레이션)');
    }
  </script>
</body>
</html>
