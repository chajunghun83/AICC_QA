<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이의 제기 처리함 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 페이지 제목 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">이의 제기 처리함</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">상담사 이의 제기 접수 및 처리</p>
      </div>
    </div>

    <!-- 요약 카드 3개 -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;">
      <div class="kpi-card">
        <div style="font-size:12px;color:#757575;margin-bottom:8px;">대기</div>
        <div style="display:flex;align-items:baseline;gap:8px;">
          <span style="font-size:28px;font-weight:700;color:#F57F17;">5</span>
          <span style="font-size:13px;color:#757575;">건</span>
        </div>
      </div>
      <div class="kpi-card">
        <div style="font-size:12px;color:#757575;margin-bottom:8px;">검토 중</div>
        <div style="display:flex;align-items:baseline;gap:8px;">
          <span style="font-size:28px;font-weight:700;color:#1565C0;">3</span>
          <span style="font-size:13px;color:#757575;">건</span>
        </div>
      </div>
      <div class="kpi-card">
        <div style="font-size:12px;color:#757575;margin-bottom:8px;">처리 완료</div>
        <div style="display:flex;align-items:baseline;gap:8px;">
          <span style="font-size:28px;font-weight:700;color:#2E7D32;">127</span>
          <span style="font-size:13px;color:#757575;">건</span>
        </div>
      </div>
    </div>

    <!-- 필터 -->
    <div class="filter-section">
      <div class="filter-header">
        <span>필터</span>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">기간</label>
          <div id="period-picker-container"></div>
        </div>
        <div>
          <label class="form-label">상태</label>
          <select class="form-select" id="status-filter" onchange="filterDisputes()">
            <option value="all">전체</option>
            <option value="대기">대기</option>
            <option value="검토 중">검토 중</option>
            <option value="승인">승인</option>
            <option value="반려">반려</option>
          </select>
        </div>
        <div>
          <label class="form-label">팀</label>
          <select class="form-select" id="team-filter" onchange="filterDisputes()">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">상담사</label>
          <input type="text" class="form-input" id="agent-search" placeholder="상담사명 검색" style="min-width:120px;">
        </div>
        <div>
          <label class="form-label">이의 항목</label>
          <select class="form-select" id="item-filter" onchange="filterDisputes()">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">처리자</label>
          <input type="text" class="form-input" id="handler-search" placeholder="처리자명 검색" style="min-width:120px;">
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetDisputeFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="filterDisputes()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">이의 제기 목록</span>
        <span style="font-size:12px;color:#757575;" id="total-count">총 10건</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:40px;">No</th>
              <th>제출일</th>
              <th>상담사</th>
              <th>팀</th>
              <th>평가ID</th>
              <th>이의 항목</th>
              <th style="text-align:right;">원 점수</th>
              <th>상태</th>
              <th>처리자</th>
            </tr>
          </thead>
          <tbody id="dispute-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/period-picker.js"></script>
  <script>
    // 더미 데이터
    const disputes = [
      { no: 1, date: '2025-01-15', agent: '김민수', team: '고객지원1팀', evalId: 'EVAL-2025-0412', item: '고객 응대 태도', score: 55, status: '대기', handler: '-' },
      { no: 2, date: '2025-01-15', agent: '이서연', team: '고객지원2팀', evalId: 'EVAL-2025-0398', item: '문제 해결 능력', score: 62, status: '대기', handler: '-' },
      { no: 3, date: '2025-01-14', agent: '박지훈', team: '기술지원팀', evalId: 'EVAL-2025-0385', item: '스크립트 준수', score: 48, status: '대기', handler: '-' },
      { no: 4, date: '2025-01-14', agent: '최유진', team: '고객지원1팀', evalId: 'EVAL-2025-0371', item: '통화 종료 절차', score: 70, status: '대기', handler: '-' },
      { no: 5, date: '2025-01-13', agent: '정다은', team: '영업지원팀', evalId: 'EVAL-2025-0360', item: '상품 안내 정확성', score: 58, status: '대기', handler: '-' },
      { no: 6, date: '2025-01-12', agent: '한승우', team: '고객지원2팀', evalId: 'EVAL-2025-0345', item: '고객 응대 태도', score: 65, status: '검토 중', handler: '관리자A' },
      { no: 7, date: '2025-01-11', agent: '윤하나', team: '기술지원팀', evalId: 'EVAL-2025-0330', item: '기술 정확성', score: 72, status: '검토 중', handler: '관리자B' },
      { no: 8, date: '2025-01-10', agent: '강도현', team: '고객지원1팀', evalId: 'EVAL-2025-0318', item: '문제 해결 능력', score: 60, status: '검토 중', handler: '관리자A' },
      { no: 9, date: '2025-01-08', agent: '오수빈', team: '영업지원팀', evalId: 'EVAL-2025-0290', item: '스크립트 준수', score: 75, status: '승인', handler: '관리자A' },
      { no: 10, date: '2025-01-05', agent: '임재혁', team: '고객지원2팀', evalId: 'EVAL-2025-0265', item: '통화 종료 절차', score: 68, status: '반려', handler: '관리자B' }
    ];

    // 상태값에 따라 시각적 구분을 위한 뱃지 클래스 매핑 (fallback으로 badge-pending 사용)
    function getStatusBadge(status) {
      const map = {
        '대기': 'badge-pending',
        '검토 중': 'badge-pending',
        '승인': 'badge-completed',
        '반려': 'badge-rejected'
      };
      return `<span class="badge ${map[status] || 'badge-pending'}">${status}</span>`;
    }

    // 필터 결과 또는 전체 데이터를 테이블에 반영하고 건수를 갱신
    function renderTable(data) {
      const tbody = document.getElementById('dispute-tbody');
      document.getElementById('total-count').textContent = `총 ${data.length}건`;
      tbody.innerHTML = data.map(d => `
        <tr onclick="openDetail(${d.no})">
          <td>${d.no}</td>
          <td>${AICC_Fmt.date(d.date)}</td>
          <td style="font-weight:500;">${d.agent}</td>
          <td>${d.team}</td>
          <td style="font-size:12px;color:#757575;">${d.evalId}</td>
          <td>${d.item}</td>
          <td style="text-align:right;">${AICC_Fmt.scoreHtml(d.score)}</td>
          <td>${getStatusBadge(d.status)}</td>
          <td style="color:#757575;">${d.handler}</td>
        </tr>
      `).join('');
    }

    // 다중 조건을 순차 체이닝하여 누적 필터링 — 각 조건이 독립적이므로 순서 무관
    function filterDisputes() {
      let filtered = [...disputes];
      const statusVal = document.getElementById('status-filter').value;
      if (statusVal !== 'all') filtered = filtered.filter(d => d.status === statusVal);
      const teamVal = document.getElementById('team-filter').value;
      if (teamVal !== 'all') filtered = filtered.filter(d => d.team === teamVal);
      const agentSearch = (document.getElementById('agent-search').value || '').trim().toLowerCase();
      if (agentSearch) filtered = filtered.filter(d => (d.agent || '').toLowerCase().includes(agentSearch));
      const itemVal = document.getElementById('item-filter').value;
      if (itemVal !== 'all') filtered = filtered.filter(d => d.item === itemVal);
      const handlerSearch = (document.getElementById('handler-search').value || '').trim().toLowerCase();
      if (handlerSearch) filtered = filtered.filter(d => (d.handler || '').toLowerCase().includes(handlerSearch));
      renderTable(filtered);
      AICC_Toast.show('필터가 적용되었습니다.');
    }

    // 모든 필터를 초기 상태로 복원 후 전체 데이터 재렌더링
    function resetDisputeFilter() {
      document.getElementById('status-filter').value = 'all';
      document.getElementById('team-filter').value = 'all';
      document.getElementById('agent-search').value = '';
      document.getElementById('item-filter').value = 'all';
      document.getElementById('handler-search').value = '';
      renderTable(disputes);
    }

    // 상태(대기/검토 중)에 따라 처리 액션 버튼 또는 조회 전용 모달로 분기
    function openDetail(no) {
      const d = disputes.find(x => x.no === no);
      if (!d) return;

      const reasons = {
        1: '해당 통화에서 고객이 먼저 화를 내었으며, 저는 침착하게 대응하였습니다. 녹취록을 확인하시면 고객 응대에 문제가 없음을 확인하실 수 있습니다.',
        2: '고객의 요청 사항이 시스템 제한으로 인해 즉시 처리할 수 없는 건이었습니다. 이에 대한 대안을 제시하였으나, 평가에서 반영되지 않은 것 같습니다.',
        3: '해당 건은 신규 프로모션 관련 스크립트가 아직 배포되지 않은 시점의 통화입니다. 최신 스크립트 기준으로 재평가를 요청합니다.',
        4: '통화 종료 시 고객이 먼저 전화를 끊었으며, 종료 인사를 할 기회가 없었습니다. 상황을 고려한 재평가를 요청합니다.',
        5: '상품 안내 시점에서 상품 정보가 변경 전이었습니다. 당시 기준으로는 정확한 안내를 한 것이므로 재평가를 요청합니다.',
        6: '녹취 내용을 다시 들어보시면 종합적으로 친절하게 응대한 것을 확인하실 수 있습니다.',
        7: '기술 문의에 대해 정확한 답변을 드렸으나, 일부 표현이 전문 용어 위주여서 감점된 것으로 보입니다.',
        8: '해당 건은 복합 민원으로, 1차 상담에서 해결이 어려운 건이었습니다. 에스컬레이션 절차를 적절히 따랐습니다.',
        9: '스크립트 순서를 일부 변경하여 안내하였으나, 필수 항목은 모두 포함되었습니다.',
        10: '통화 종료 전에 추가 문의 확인을 하였으나, 고객이 빠르게 끊어서 기록에 반영되지 않았습니다.'
      };

      // 처리가 완료되지 않은 건만 수정/승인/반려 액션을 허용하기 위한 분기
      const isPending = d.status === '대기' || d.status === '검토 중';

      const content = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
          <div>
            <div class="form-label">평가 ID</div>
            <div style="font-size:13px;">${d.evalId}</div>
          </div>
          <div>
            <div class="form-label">제출일</div>
            <div style="font-size:13px;">${AICC_Fmt.date(d.date)}</div>
          </div>
          <div>
            <div class="form-label">상담사</div>
            <div style="font-size:13px;font-weight:500;">${d.agent} (${d.team})</div>
          </div>
          <div>
            <div class="form-label">이의 항목</div>
            <div style="font-size:13px;">${d.item}</div>
          </div>
          <div>
            <div class="form-label">원 점수</div>
            <div style="font-size:13px;">${AICC_Fmt.scoreHtml(d.score)}</div>
          </div>
          <div>
            <div class="form-label">현재 상태</div>
            <div>${getStatusBadge(d.status)}</div>
          </div>
        </div>

        <div style="border-top:1px solid #E0E0E0;padding-top:16px;margin-bottom:20px;">
          <div class="form-label" style="margin-bottom:8px;">상담사 이의 사유</div>
          <div style="background:#F9F9F9;border:1px solid #E0E0E0;border-radius:6px;padding:14px;font-size:13px;line-height:1.7;color:#424242;">
            ${reasons[d.no]}
          </div>
        </div>

        ${isPending ? `
        <div style="border-top:1px solid #E0E0E0;padding-top:16px;">
          <div class="form-label" style="margin-bottom:8px;">처리 의견</div>
          <textarea class="form-input" style="width:100%;height:80px;resize:vertical;" placeholder="처리 의견을 입력하세요..."></textarea>
          <div style="margin-top:8px;">
            <div class="form-label" style="margin-bottom:4px;">점수 수정 (선택)</div>
            <input type="number" class="form-input" style="width:80px;" placeholder="점수" min="0" max="100">
          </div>
        </div>
        ` : `
        <div style="border-top:1px solid #E0E0E0;padding-top:16px;">
          <div class="form-label" style="margin-bottom:8px;">처리 결과</div>
          <div style="font-size:13px;color:#424242;">
            처리자: ${d.handler} | 처리일: ${AICC_Fmt.date(d.date)}
          </div>
        </div>
        `}
      `;

      const footer = isPending ? `
        <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
        <button class="btn btn-danger" onclick="handleAction(${d.no}, '반려')">반려</button>
        <button class="btn btn-secondary" style="border-color:#1565C0;color:#1565C0;" onclick="handleAction(${d.no}, '수정 승인')">수정 승인</button>
        <button class="btn btn-primary" onclick="handleAction(${d.no}, '승인')">승인</button>
      ` : `
        <button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
      `;

      AICC_Modal.open({
        title: `이의 제기 상세 - ${d.evalId}`,
        content: content,
        footer: footer,
        size: 'lg'
      });
    }

    // 모달 닫기 후 Toast로 즉시 피드백 — 실제 API 연동 시 비동기 처리로 대체 예정
    function handleAction(no, action) {
      AICC_Modal.close();
      AICC_Toast.show(`${action} 처리가 완료되었습니다.`);
    }

    // 초기 렌더링
    document.addEventListener('DOMContentLoaded', () => {
      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function() { filterDisputes(); }
      });

      // Set으로 중복 제거 후 필터 드롭다운 옵션을 데이터 기반으로 동적 생성
      const teams = [...new Set(disputes.map(d => d.team))];
      const teamSel = document.getElementById('team-filter');
      teams.forEach(t => { teamSel.innerHTML += '<option value="' + t + '">' + t + '</option>'; });

      const items = [...new Set(disputes.map(d => d.item))];
      const itemSel = document.getElementById('item-filter');
      items.forEach(i => { itemSel.innerHTML += '<option value="' + i + '">' + i + '</option>'; });

      renderTable(disputes);
    });
  </script>
</body>
</html>
