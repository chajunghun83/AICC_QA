<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>자동 평가 현황 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 페이지 제목 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">자동 평가 현황</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">AI 자동 평가 상세 현황</p>
      </div>
    </div>

    <!-- 필터 섹션 -->
    <div class="filter-section">
      <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">센터</label>
          <select class="form-select" id="ws-filter" onchange="onWsChange()">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">팀</label>
          <select class="form-select" id="team-filter" onchange="applyFilter()" disabled>
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">기간</label>
          <div id="period-picker-container"></div>
        </div>
        <div>
          <label class="form-label">상담사</label>
          <input type="text" class="form-input" id="agent-search" placeholder="상담사명 검색" style="min-width:130px;">
        </div>
        <div>
          <label class="form-label">점수 범위</label>
          <select class="form-select" id="score-filter">
            <option value="all">전체</option>
            <option value="high">80점 이상</option>
            <option value="mid">60 ~ 79점</option>
            <option value="low">60점 미만</option>
          </select>
        </div>
        <div>
          <label class="form-label">통화유형</label>
          <select class="form-select" id="type-filter">
            <option value="all">전체</option>
            <option value="I/B">I/B (인바운드)</option>
            <option value="O/B">O/B (아웃바운드)</option>
          </select>
        </div>
        <div>
          <label class="form-label">평가표</label>
          <select class="form-select" id="form-filter">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">신뢰도</label>
          <select class="form-select" id="confidence-filter">
            <option value="all">전체</option>
            <option value="High">High</option>
            <option value="Mid">Mid</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <div>
          <label class="form-label">상담유형</label>
          <input type="text" class="form-input" id="consult-search" placeholder="상담유형 검색" style="min-width:130px;">
        </div>
        <div>
          <label class="form-label">이슈 유형</label>
          <select class="form-select" id="issue-filter" onchange="applyFilter()">
            <option value="all">전체</option>
            <option value="fail">FAIL (금지어)</option>
            <option value="under">기준 미달 (평가표 기준 미만)</option>
          </select>
        </div>
        <div>
          <label class="form-label">수동 검증</label>
          <select class="form-select" id="review-filter" onchange="applyFilter()">
            <option value="all">전체</option>
            <option value="reviewed">검증 완료</option>
            <option value="unreviewed">미검증</option>
          </select>
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="applyFilter()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 상담 건별 평가 결과 리스트 -->
    <div class="content-card" style="margin-top:16px;">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">상담 건별 평가 결과</span>
        <span style="font-size:12px;color:#757575;" id="eval-count">총 0건</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('id')">평가 ID <span id="sort-icon-id" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('date')">일시 <span id="sort-icon-date" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('center')">센터 <span id="sort-icon-center" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('team')">팀 <span id="sort-icon-team" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('empid')">사번 <span id="sort-icon-empid" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('agent')">상담사 <span id="sort-icon-agent" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('consult')">상담유형 <span id="sort-icon-consult" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('duration')">통화시간 <span id="sort-icon-duration" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('type')">유형 <span id="sort-icon-type" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('form')">평가표 <span id="sort-icon-form" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('score')">점수 <span id="sort-icon-score" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="cursor:pointer;user-select:none;" onclick="toggleSort('confidence')">신뢰도 <span id="sort-icon-confidence" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th>이슈</th>
            </tr>
          </thead>
          <tbody id="eval-tbody"></tbody>
        </table>
        <div class="pagination">
          <button class="pagination-btn">&laquo;</button>
          <button class="pagination-btn active">1</button>
          <button class="pagination-btn">2</button>
          <button class="pagination-btn">&raquo;</button>
          <span style="margin-left:16px;font-size:12px;color:#757575;">페이지당:
            <select class="form-select" style="min-width:60px;padding:2px 24px 2px 8px;">
              <option>10</option>
              <option selected>20</option>
              <option>50</option>
            </select>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/period-picker.js"></script>
  <script>
    let allData = {};
    let sortKey = null;
    let sortDir = null;

    const EMPLOYEE_ID_MAP = {
      'agent001': 'S-1001', 'agent002': 'S-1002', 'agent003': 'S-1003', 'agent004': 'S-1004',
      'agent005': 'S-1005', 'agent006': 'S-1006', 'agent007': 'S-1007', 'agent008': 'S-1008',
      'agent009': 'S-1009', 'agent010': 'S-1010', 'agent011': 'S-1011', 'agent012': 'S-1012',
      'agent101': 'S-1011', 'agent102': 'S-1012',
      'agent201': 'S-1101', 'agent202': 'S-1102', 'agent203': 'S-1103', 'agent204': 'S-1104',
      'agent301': 'S-1201', 'agent302': 'S-1202', 'agent303': 'S-1203',
      'agent401': 'S-2101', 'agent402': 'S-2102', 'agent403': 'S-2103',
      'agent501': 'S-2201', 'agent502': 'S-2202',
      'agent601': 'S-3101', 'agent602': 'S-3102', 'agent603': 'S-3103',
      'agent701': 'S-3201', 'agent702': 'S-3202'
    };
    const EMPLOYEE_NAME_MAP = {
      '홍길동': 'S-1001', '이영희': 'S-1002', '김철수': 'S-1003', '박지민': 'S-1004',
      '최수진': 'S-1005', '정민호': 'S-1006', '강현우': 'S-1007', '윤서연': 'S-1008',
      '김유진': 'S-1011', '서태원': 'S-1012',
      '이도현': 'S-1101', '박서연': 'S-1102', '정하늘': 'S-1103', '한지석': 'S-1104',
      '오민재': 'S-1201', '배지훈': 'S-1202', '황현지': 'S-1203',
      '임수경': 'S-2101', '조성훈': 'S-2102', '문가영': 'S-2103',
      '백시영': 'S-2201', '권나윤': 'S-2202',
      '남궁준': 'S-3101', '류재훈': 'S-3102', '표지원': 'S-3103',
      '도현철': 'S-3201', '선우민': 'S-3202'
    };
    function getEmployeeId(ev) {
      return ev.employee_id || EMPLOYEE_ID_MAP[ev.agent_id] || EMPLOYEE_NAME_MAP[ev.agent_name] || '-';
    }

    const SORT_KEYS = ['id','date','center','team','empid','agent','consult','duration','type','form','score','confidence'];

    function toggleSort(key) {
      if (sortKey === key) {
        if (sortDir === 'asc') sortDir = 'desc';
        else { sortKey = null; sortDir = null; }
      } else {
        sortKey = key;
        sortDir = 'asc';
      }
      updateSortIcons();
      applyFilter();
    }

    function updateSortIcons() {
      SORT_KEYS.forEach(k => {
        const icon = document.getElementById('sort-icon-' + k);
        if (!icon) return;
        if (k === sortKey) {
          icon.textContent = sortDir === 'asc' ? '▲' : '▼';
          icon.style.color = '#1976D2';
        } else {
          icon.textContent = '⇅';
          icon.style.color = '#BDBDBD';
        }
      });
    }

    function applySorting(arr) {
      if (!sortKey || !sortDir) return arr;
      return [...arr].sort((a, b) => {
        let va, vb;
        switch (sortKey) {
          case 'id': va = a.id; vb = b.id; break;
          case 'date': va = (a.date||'')+(a.call_time||''); vb = (b.date||'')+(b.call_time||''); break;
          case 'empid': va = getEmployeeId(a); vb = getEmployeeId(b); break;
          case 'center': va = a.center||''; vb = b.center||''; break;
          case 'team': va = a.team||''; vb = b.team||''; break;
          case 'agent': va = a.agent_name||''; vb = b.agent_name||''; break;
          case 'consult': va = a.consultation_type||''; vb = b.consultation_type||''; break;
          case 'duration': va = a.duration||''; vb = b.duration||''; break;
          case 'type': va = a.call_type||''; vb = b.call_type||''; break;
          case 'form': va = a.eval_form||''; vb = b.eval_form||''; break;
          case 'score': return sortDir === 'asc' ? a.total_score - b.total_score : b.total_score - a.total_score;
          case 'confidence': va = a.confidence||''; vb = b.confidence||''; break;
        }
        const cmp = String(va).localeCompare(String(vb), 'ko');
        return sortDir === 'asc' ? cmp : -cmp;
      });
    }

    // 페이지 진입 시 필요한 모든 데이터를 일괄 로드하여 이후 필터·상세 조회에서 추가 요청 없이 사용
    document.addEventListener('DOMContentLoaded', async () => {
      allData = await AICC_DataLoader.loadAll([
        'dashboard-stats.json',
        'evaluations.json',
        'evaluation-forms.json',
        'evaluation-items.json',
        'centers.json'
      ]);

      const ws = allData['centers.json'];
      if (ws) {
        const select = document.getElementById('ws-filter');
        ws.forEach(w => {
          select.innerHTML += `<option value="${w.id}">${w.name}</option>`;
        });
      }

      // 대시보드 등에서 딥링크로 특정 이슈/팀 필터를 걸고 진입할 수 있도록 URL 파라미터 반영
      const params = new URLSearchParams(window.location.search);
      const issueParam = params.get('issue');
      if (issueParam) {
        document.getElementById('issue-filter').value = issueParam;
      }
      const teamParam = params.get('team');
      if (teamParam) {
        document.getElementById('team-filter').value = teamParam;
      }

      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function() { applyFilter(); }
      });

      // 평가표 필터 옵션을 실제 데이터 기반으로 동적 생성 (하드코딩 방지)
      const evals = allData['evaluations.json'];
      if (evals) {
        const formNames = [...new Set(evals.map(e => e.eval_form).filter(Boolean))];
        const formSel = document.getElementById('form-filter');
        formNames.forEach(f => { formSel.innerHTML += '<option value="' + f + '">' + f + '</option>'; });
      }

      // URL 파라미터가 있으면 필터 적용, 없으면 전체 데이터 렌더링
      if (issueParam || teamParam) {
        applyFilter();
      } else {
        renderAll();
      }
    });

    // 3단계 중첩 구조(카테고리→하위→항목)를 flat map으로 변환하여 ID 기반 O(1) 조회 지원
    function buildItemNameMap() {
      const items = allData['evaluation-items.json'];
      const map = {};
      if (!items || !items.categories) return map;
      items.categories.forEach(cat => {
        cat.children.forEach(child => {
          child.items.forEach(item => {
            map[item.id] = item.name;
          });
        });
      });
      return map;
    }

    // 평가표마다 기준 미달 기준이 다르므로, 해당 평가 건에 적용된 평가표의 기준을 동적으로 조회
    // 매칭 실패 시 업계 관행상 60점을 기본값으로 사용
    function getPassThreshold(ev) {
      const forms = allData['evaluation-forms.json'];
      if (!forms) return 60;
      // active 상태 + 동일 통화유형 + 해당 센터에 적용된 평가표만 매칭
      const matched = forms.find(f => {
        if (f.status !== 'active') return false;
        if (f.type !== ev.call_type) return false;
        return f.applied_to && f.applied_to.includes(ev.center_id);
      });
      return matched && matched.pass_threshold ? matched.pass_threshold : 60;
    }

    // 기준 미달 여부를 평가표별 동적 기준으로 판단 (고정값 비교가 아님)
    function isUnderThreshold(ev) {
      return ev.total_score < getPassThreshold(ev);
    }

    // 필터 없이 전체 데이터를 초기 렌더링하는 진입점
    function renderAll() {
      const stats = allData['dashboard-stats.json'];
      const evals = allData['evaluations.json'];

      if (evals) {
        renderEvalTable(evals);
      }
    }

    // innerHTML 일괄 교체 방식으로 대량 행을 빠르게 렌더링 (개별 DOM 조작 대비 성능 이점)
    function renderEvalTable(evals) {
      const tbody = document.getElementById('eval-tbody');
      document.getElementById('eval-count').textContent = `총 ${evals.length}건`;

      tbody.innerHTML = evals.map(ev => {
        const confBadge = ev.confidence === 'High'
          ? '<span class="badge badge-active">High</span>'
          : ev.confidence === 'Medium'
          ? '<span class="badge badge-pending">Mid</span>'
          : '<span class="badge badge-rejected">Low</span>';

        // 이슈가 많을 경우 테이블 행 높이 유지를 위해 최대 2건만 표시
        const issueHtml = ev.issues && ev.issues.length > 0
          ? ev.issues.slice(0, 2).map(i => `<div style="font-size:10px;color:#F57F17;">${i}</div>`).join('')
          : '<span style="color:#9E9E9E;font-size:11px;">-</span>';

        const reviewBadge = ev.manual_review
          ? '<span class="badge badge-active" style="font-size:10px;margin-left:4px;" title="수동 검증 완료">검증완료</span>'
          : '';

        return `
          <tr onclick="showEvalDetail('${ev.id}')">
            <td style="font-size:11px;">${ev.id}${reviewBadge}</td>
            <td style="font-size:11px;white-space:nowrap;">${ev.date} ${ev.call_time}</td>
            <td style="font-size:11px;">${ev.center}</td>
            <td style="font-size:11px;">${ev.team}</td>
            <td style="font-size:11px;">${getEmployeeId(ev)}</td>
            <td style="font-size:12px;font-weight:500;">${ev.agent_name}</td>
            <td class="col-left" style="font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${ev.consultation_type || ''}">${ev.consultation_type || '-'}</td>
            <td style="font-size:11px;white-space:nowrap;">${ev.duration}</td>
            <td><span class="badge ${ev.call_type === 'I/B' ? 'badge-nlp' : 'badge-ai'}" style="font-size:10px;">${ev.call_type}</span></td>
            <td class="col-left" style="font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${ev.eval_form || '-'}</td>
            <td>${AICC_Fmt.scoreHtml(ev.total_score)}</td>
            <td>${confBadge}</td>
            <td style="max-width:120px;">${issueHtml}</td>
          </tr>
        `;
      }).join('');
    }

    // 평가 상세 모달: 항목별 점수와 스크립트를 탭으로 분리하여 정보 과부하 방지
    function showEvalDetail(evalId) {
      const evals = allData['evaluations.json'];
      const ev = evals.find(e => e.id === evalId);
      if (!ev) return;

      const itemNameMap = buildItemNameMap();
      const scoreRows = Object.entries(ev.scores).map(([key, val], idx) => {
        const statusCls = val.status === 'pass' ? 'score-good' : val.status === 'warn' ? 'score-warn' : 'score-danger';
        const statusText = val.status === 'pass' ? '통과' : val.status === 'warn' ? '주의' : '미달';
        const confHtml = val.confidence ? `<span style="font-size:11px;color:#757575;">${val.confidence}%</span>` : '';
        const reasonHtml = val.reason ? `<div style="font-size:10px;color:#F57F17;margin-top:2px;">${val.reason}</div>` : '';
        const itemName = itemNameMap[key] || key;

        return `
          <tr style="cursor:pointer;" onclick="scrollToTranscript(${idx})" title="클릭하면 해당 구간으로 이동합니다">
            <td style="font-size:11px;padding:6px 4px;text-align:left;">${itemName}</td>
            <td style="padding:6px 4px;text-align:center;">${AICC_Fmt.typeBadge(val.type)}</td>
            <td style="text-align:center;font-weight:500;font-size:11px;padding:6px 4px;">${val.score}/${val.max}</td>
            <td style="padding:6px 4px;text-align:center;">${confHtml}</td>
            <td style="padding:6px 4px;text-align:center;"><span class="${statusCls}" style="font-size:11px;">${statusText}</span>${reasonHtml}</td>
          </tr>
        `;
      }).join('');

      const transcriptHtml = ev.transcript && ev.transcript.length > 0
        ? ev.transcript.map((t, idx) => {
            const isAgent = t.speaker === 'agent';
            const bg = isAgent ? '#E3F2FD' : '#F5F5F5';
            const hoverBg = isAgent ? '#B3E5FC' : '#EEEEEE';
            const label = isAgent ? '상담사' : '고객';
            return `
              <div class="transcript-line" data-idx="${idx}" style="display:flex;gap:10px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:background 0.15s;" onclick="playSegment(this, '${t.time}')" onmouseenter="this.style.background='${hoverBg}'" onmouseleave="if(!this.classList.contains('playing'))this.style.background=''">
                <div style="min-width:40px;font-size:10px;color:#757575;padding-top:2px;">${t.time}</div>
                <div style="flex:1;">
                  <div style="font-size:10px;font-weight:600;color:${isAgent ? '#00A3FF' : '#424242'};margin-bottom:2px;">${label}</div>
                  <div style="background:${bg};padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5;display:flex;align-items:start;gap:6px;">

        : '<p style="color:#9E9E9E;font-size:13px;text-align:center;padding:20px;">스크립트 데이터가 없습니다.</p>';

      const callTypeBadge = ev.call_type === 'I/B'

              ${infoRow('평가 ID', '<span style="font-family:monospace;font-size:11px;">' + ev.id + '</span>')}
              ${infoRow('일시', ev.date + ' ' + (ev.call_time || ''))}

              ${infoRow('통화시간', ev.duration || '-')}
              ${infoRow('신뢰도', confBadge)}
              ${infoRow('점수', '<strong style="font-size:16px;' + scoreColor + '">' + ev.total_score + '점</strong>')}

              ${ev.ai_feedback ? `<div style="margin-top:12px;background:#F5F5F5;border-radius:6px;padding:10px 12px;font-size:11px;line-height:1.6;"><strong style="color:#424242;">AI 피드백</strong><br><span style="color:#757575;">${ev.ai_feedback}</span></div>` : ''}

              ${ev.manual_review ? `

              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">스크립트</div>

    function scrollToTranscript(scoreIdx) {
      const container = document.getElementById('transcript-container');
      if (!container) return;
      const lines = container.querySelectorAll('.transcript-line');
      if (!lines.length) return;
      const scoreRowCount = document.querySelectorAll('.modal-container .data-table tbody tr').length || 1;
      const mappedIdx = Math.min(Math.floor(scoreIdx * (lines.length / scoreRowCount)), lines.length - 1);
      const targetLine = lines[Math.max(0, mappedIdx)];
      if (!targetLine) return;
      targetLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const time = targetLine.querySelector('div')?.textContent?.trim() || '0:00';
      playSegment(targetLine, time);
    }

    function playSegment(el, time) {
      document.querySelectorAll('.transcript-line').forEach(line => {
        line.classList.remove('playing');
        line.style.background = '';
      });
      el.classList.add('playing');
      // 상담사(녹색 아이콘)와 고객 라인을 구분하여 각각 다른 하이라이트 색상 적용
      el.style.background = el.querySelector('[fill="#00A3FF"]') ? '#B3E5FC' : '#EEEEEE';

      const label = document.getElementById('player-segment-label');
      if (label) label.textContent = '▶ ' + time + ' 구간 재생 중';

      const timeEl = document.getElementById('player-time');
      if (timeEl) timeEl.textContent = time;

      const progress = document.getElementById('player-progress');
      // 시뮬레이션 용도: 5~95% 범위 내 랜덤 진행률로 재생 효과 표현
      if (progress) {
        const pct = Math.min(95, Math.max(5, Math.random() * 80 + 10));
        progress.style.width = pct + '%';
      }

      const playIcon = document.getElementById('play-btn-icon');
      if (playIcon) playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';

      AICC_Toast.show(`${time} 구간 재생 (시뮬레이션)`);
    }

    // SVG 아이콘의 innerHTML로 재생/일시정지 상태를 판별하여 토글 (별도 상태 변수 없이 DOM 기반)
    function togglePlay(btn) {
      const icon = document.getElementById('play-btn-icon');
      if (!icon) return;
      // polygon=재생 아이콘(▶), rect=일시정지 아이콘(⏸)으로 현재 상태 판별
      const isPaused = icon.innerHTML.includes('polygon');
      if (isPaused) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';
        AICC_Toast.show('재생 시작 (시뮬레이션)');
      } else {
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        AICC_Toast.show('일시 정지 (시뮬레이션)');
      }
    }

    // 클릭 위치의 상대 좌표를 백분율로 변환하여 진행 바 위치 반영
    function seekBar(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const progress = document.getElementById('player-progress');
      if (progress) progress.style.width = pct + '%';
    }

    let manualReviewEvalId = null;

    // 기존 상세 모달을 닫고 수동 검증 모달을 여는 2단계 모달 전환
    // 스크립트 참조와 점수 수정을 좌우 분할 레이아웃으로 동시에 보여줌
    function openManualReview(evalId) {
      AICC_Modal.close();
      manualReviewEvalId = evalId;

      const evals = allData['evaluations.json'];
      const ev = evals.find(e => e.id === evalId);
      if (!ev) return;

      const itemNameMap = buildItemNameMap();

      const mrTranscriptHtml = ev.transcript && ev.transcript.length > 0
        ? ev.transcript.map((t, idx) => {
            const isAgent = t.speaker === 'agent';
            const bg = isAgent ? '#E3F2FD' : '#F5F5F5';
            const hoverBg = isAgent ? '#B3E5FC' : '#EEEEEE';
            const label = isAgent ? '상담사' : '고객';
            return `
              <div class="transcript-line" data-idx="${idx}" style="display:flex;gap:10px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:background 0.15s;" onclick="playSegment(this, '${t.time}')" onmouseenter="this.style.background='${hoverBg}'" onmouseleave="if(!this.classList.contains('playing'))this.style.background=''">
                <div style="min-width:40px;font-size:10px;color:#757575;padding-top:2px;">${t.time}</div>
                <div style="flex:1;">
                  <div style="font-size:10px;font-weight:600;color:${isAgent ? '#00A3FF' : '#424242'};margin-bottom:2px;">${label}</div>
                  <div style="background:${bg};padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5;display:flex;align-items:start;gap:6px;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="${isAgent ? '#00A3FF' : '#757575'}" style="flex-shrink:0;margin-top:3px;opacity:0.5;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span>${t.text}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')
        : '<p style="color:#9E9E9E;font-size:13px;text-align:center;padding:20px;">스크립트 데이터가 없습니다.</p>';

      const scoreKeys = Object.keys(ev.scores);
      const originalTotal = ev.total_score;
      const scoreRowsHtml = scoreKeys.map((key, idx) => {
        const val = ev.scores[key];
        const itemName = itemNameMap[key] || key;
        const isNlp = val.type === 'NLP';
        const statusCls = val.status === 'pass' ? 'score-good' : val.status === 'warn' ? 'score-warn' : 'score-danger';
        const statusText = val.status === 'pass' ? '통과' : val.status === 'warn' ? '주의' : '미달';
        return `
          <tr style="cursor:pointer;" onclick="scrollToTranscript(${idx})" title="클릭하면 해당 구간으로 이동합니다">
            <td style="font-size:11px;padding:6px 4px;text-align:left;">${itemName}</td>
            <td style="padding:6px 4px;text-align:center;">${AICC_Fmt.typeBadge(val.type)}</td>
            <td style="text-align:center;padding:6px 4px;white-space:nowrap;">
              <input type="number" class="mr-score-input" data-key="${key}" data-max="${val.max}" data-original="${val.score}"
                     value="${val.score}" min="0" max="${val.max}" ${isNlp ? 'disabled' : ''}
                     style="width:32px;text-align:center;padding:1px 2px;font-size:11px;border:1px solid #ddd;border-radius:3px;outline:none;${isNlp ? 'background:#F5F5F5;color:#9E9E9E;border-color:#eee;' : ''}"
                     onclick="event.stopPropagation()" onchange="recalcManualTotal()"><span style="font-size:10px;color:#9E9E9E;">/${val.max}</span>
            </td>
            <td style="padding:6px 4px;text-align:center;"><span class="${statusCls}" style="font-size:11px;">${statusText}</span></td>
          </tr>
        `;
      }).join('');

      const reviewHistory = ev.review_history || (ev.manual_review ? [ev.manual_review] : []);
      const reviewedInfo = reviewHistory.length > 0
        ? '<div style="margin-bottom:8px;"><div style="font-size:11px;font-weight:600;color:#2E7D32;margin-bottom:4px;">검증 이력</div>' +
          reviewHistory.map(h => `
            <div style="padding:6px 10px;background:#E8F5E9;border-radius:6px;font-size:11px;color:#2E7D32;margin-bottom:4px;">
              <div>${h.reviewed_at} (${h.reviewer})${h.modified_items && h.modified_items.length > 0 ? ' | 수정 ' + h.modified_items.length + '건' : ''}</div>
              ${h.comment ? '<div style="margin-top:2px;color:#1B5E20;font-style:italic;">' + h.comment + '</div>' : ''}
            </div>
          `).join('') + '</div>'
        : '';

      const mrScoreColor = ev.total_score >= 80 ? 'color:#4CAF50' : ev.total_score >= 60 ? 'color:#FFC107' : 'color:#F44336';
      const mrCallTypeBadge = ev.call_type === 'I/B'
        ? '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>'
        : '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>';

      const mrInfoRow = (label, value) => `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #F0F0F0;"><span style="font-size:11px;color:#9E9E9E;white-space:nowrap;">${label}</span><span style="font-size:12px;font-weight:500;text-align:right;margin-left:8px;">${value}</span></div>`;

      setTimeout(() => {
        AICC_Modal.open({
          title: `수동 검증 - ${ev.id}`,
          size: 'xxl',
          content: `
            <div style="display:grid;grid-template-columns:300px 1fr 400px;gap:20px;height:calc(90vh - 140px);max-height:650px;">
              <!-- 왼쪽: 콜 정보 -->
              <div style="overflow-y:auto;padding-right:8px;min-height:0;">
                <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;">콜 정보</div>
                ${mrInfoRow('평가 ID', '<span style="font-family:monospace;font-size:11px;">' + ev.id + '</span>')}
                ${mrInfoRow('일시', ev.date + ' ' + (ev.call_time || ''))}
                ${mrInfoRow('센터', ev.center || '-')}
                ${mrInfoRow('팀', ev.team || '-')}
                ${mrInfoRow('상담사', ev.agent_name || '-')}
                ${mrInfoRow('상담 유형', '<span style="font-size:11px;">' + (ev.consultation_type || '-') + '</span>')}
                ${mrInfoRow('유형', mrCallTypeBadge)}
                ${mrInfoRow('평가방식', AICC_Fmt.typeBadge(ev.eval_method || 'AI'))}
                ${mrInfoRow('평가표', '<span style="font-size:11px;">' + (ev.eval_form || '-') + '</span>')}
                ${mrInfoRow('통화시간', ev.duration || '-')}
                ${mrInfoRow('AI 총점', '<strong style="font-size:14px;color:#757575;">' + originalTotal + '점</strong>')}
                ${mrInfoRow('검증 총점', '<strong id="mr-total-score" style="font-size:14px;color:#00A3FF;">' + originalTotal + '점</strong>')}
                ${reviewedInfo}
                <div style="margin-top:10px;">
                  <label class="form-label" style="font-size:11px;">검증 코멘트</label>
                  <textarea id="mr-comment" class="form-input" style="width:100%;height:64px;resize:vertical;font-size:11px;" placeholder="검증 관련 코멘트를 입력하세요.">${ev.manual_review?.comment || ''}</textarea>
                </div>
              </div>

              <!-- 중간: 스크립트 + 플레이어 -->
              <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
                <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">스크립트</div>
                <div id="transcript-container" style="flex:1;min-height:0;background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;padding:12px;overflow-y:auto;">
                  ${mrTranscriptHtml}
                </div>
                <div style="margin-top:10px;background:#F5F5F5;border:1px solid #E0E0E0;border-radius:8px;padding:10px 14px;flex-shrink:0;">
                  <div style="display:flex;align-items:center;gap:10px;">
                    <button onclick="togglePlay(this)" style="background:none;border:none;cursor:pointer;padding:0;">
                      <svg id="play-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="#424242"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    </button>
                    <div style="flex:1;">
                      <div style="width:100%;height:4px;background:#BDBDBD;border-radius:2px;position:relative;cursor:pointer;" onclick="seekBar(event)">
                        <div id="player-progress" style="width:0%;height:100%;background:#00A3FF;border-radius:2px;transition:width 0.2s;"></div>
                      </div>
                    </div>
                  </div>
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-left:30px;">
                    <span id="player-time" style="font-size:10px;color:#757575;">0:00</span>
                    <span id="player-segment-label" style="font-size:10px;color:#00A3FF;"></span>
                    <span style="font-size:10px;color:#757575;">${ev.duration || '0:00'}</span>
                  </div>
                </div>
              </div>

              <!-- 오른쪽: 항목별 점수 (수정 가능) -->
              <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
                <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">항목별 점수 <span style="font-size:10px;font-weight:400;color:#9E9E9E;">(NLP 수정 불가)</span></div>
                <div style="flex:1;min-height:0;overflow-y:auto;">
                  <table class="data-table" style="font-size:11px;table-layout:fixed;width:100%;margin:0;">
                    <colgroup>
                      <col style="width:35%;">
                      <col style="width:15%;">
                      <col style="width:25%;">
                      <col style="width:25%;">
                    </colgroup>
                    <thead>
                      <tr>
                        <th style="padding:6px 4px;text-align:center;">평가 항목</th>
                        <th style="padding:6px 4px;text-align:center;">방식</th>
                        <th style="padding:6px 4px;text-align:center;">점수</th>
                        <th style="padding:6px 4px;text-align:center;">상태</th>
                      </tr>
                    </thead>
                    <tbody>${scoreRowsHtml}</tbody>
                  </table>
                </div>
              </div>
            </div>
          `,
          footer: `
            <button class="btn btn-primary" onclick="saveManualReview()">검증 완료</button>
            <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
          `
        });
      }, 200);
    }

    // 개별 항목 점수 변경 시 실시간 합산하여 검증 총점에 즉시 반영
    // 입력값을 0~max 범위로 클램핑하여 유효하지 않은 점수 입력 방지
    function recalcManualTotal() {
      const inputs = document.querySelectorAll('.mr-score-input');
      let total = 0;
      inputs.forEach(inp => {
        let v = parseInt(inp.value, 10);
        const max = parseInt(inp.dataset.max, 10);
        if (isNaN(v) || v < 0) v = 0;
        if (v > max) v = max;
        inp.value = v;
        total += v;
      });
      const el = document.getElementById('mr-total-score');
      if (el) el.textContent = total + '점';
    }

    // 검증 결과를 메모리 내 allData에 즉시 반영하여 모달 닫은 후 테이블에 변경사항이 보이도록 함
    // 서버 연동 시 이 시점에서 API 호출 추가 필요
    function saveManualReview() {
      if (!manualReviewEvalId) return;

      const evals = allData['evaluations.json'];
      const ev = evals.find(e => e.id === manualReviewEvalId);
      if (!ev) return;

      const inputs = document.querySelectorAll('.mr-score-input');
      const modifiedItems = [];
      let newTotal = 0;

      inputs.forEach(inp => {
        const key = inp.dataset.key;
        const original = parseInt(inp.dataset.original, 10);
        let v = parseInt(inp.value, 10);
        const max = parseInt(inp.dataset.max, 10);
        if (isNaN(v) || v < 0) v = 0;
        if (v > max) v = max;
        newTotal += v;

        // 변경된 항목만 추적하여 수정 이력 저장 및 상태 자동 재산정
        // 상태 기준: 80% 이상=통과, 50% 이상=주의, 미만=미달
        if (v !== original) {
          modifiedItems.push({ item_id: key, original_score: original, new_score: v });
          ev.scores[key].score = v;
          if (v >= max * 0.8) ev.scores[key].status = 'pass';
          else if (v >= max * 0.5) ev.scores[key].status = 'warn';
          else ev.scores[key].status = 'fail';
        }
      });

      ev.total_score = newTotal;

      const now = new Date();
      const dateStr = now.getFullYear() + '-' +
                      String(now.getMonth() + 1).padStart(2, '0') + '-' +
                      String(now.getDate()).padStart(2, '0') + ' ' +
                      String(now.getHours()).padStart(2, '0') + ':' +
                      String(now.getMinutes()).padStart(2, '0');

      const comment = document.getElementById('mr-comment')?.value?.trim() || '';

      // 기존 단일 객체 → 배열 구조 마이그레이션
      if (!ev.review_history) {
        ev.review_history = [];
        if (ev.manual_review) ev.review_history.push({...ev.manual_review});
      }

      const newReview = {
        reviewed_at: dateStr,
        reviewer: '관리자',
        modified_items: modifiedItems,
        comment: comment
      };
      ev.review_history.push(newReview);
      ev.manual_review = newReview;

      manualReviewEvalId = null;
      AICC_Modal.close();

      // 현재 적용 중인 필터를 다시 적용하여 수정된 데이터로 테이블 갱신
      const wsId = document.getElementById('ws-filter').value;
      const teamId = document.getElementById('team-filter').value;
      let filtered = evals;
      if (wsId !== 'all') filtered = filtered.filter(e => e.center_id === wsId);
      if (teamId !== 'all') filtered = filtered.filter(e => e.team_id === teamId);
      const typeVal = document.getElementById('type-filter').value;
      if (typeVal !== 'all') filtered = filtered.filter(e => e.call_type === typeVal);
      const issueVal = document.getElementById('issue-filter').value;
      if (issueVal === 'fail') filtered = filtered.filter(e => e.fail_items && e.fail_items.length > 0);
      if (issueVal === 'under') filtered = filtered.filter(e => isUnderThreshold(e));
      const reviewVal = document.getElementById('review-filter').value;
      if (reviewVal === 'reviewed') filtered = filtered.filter(e => e.manual_review);
      if (reviewVal === 'unreviewed') filtered = filtered.filter(e => !e.manual_review);
      renderEvalTable(filtered);

      AICC_Toast.show(modifiedItems.length > 0
        ? `수동 검증 완료 (${modifiedItems.length}개 항목 수정, 총점: ${newTotal}점)`
        : `수동 검증 완료 (수정 없음, 총점: ${newTotal}점)`
      );
    }

    // display 토글 방식의 간단한 탭 전환 (SPA 라우팅 불필요한 모달 내부용)
    function switchDetailTab(btn, tabId) {
      btn.parentElement.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('scores-tab').style.display = tabId === 'scores-tab' ? '' : 'none';
      document.getElementById('script-tab').style.display = tabId === 'script-tab' ? '' : 'none';
    }

    // 센터 변경 시 하위 팀 목록을 연쇄적으로 갱신 (종속 드롭다운 패턴)
    function onWsChange() {
      const wsId = document.getElementById('ws-filter').value;
      const teamFilter = document.getElementById('team-filter');

      if (wsId === 'all') {
        teamFilter.disabled = true;
        teamFilter.innerHTML = '<option value="all">전체</option>';
      } else {
        teamFilter.disabled = false;
        const ws = allData['centers.json'];
        const found = ws ? ws.find(w => w.id === wsId) : null;
        teamFilter.innerHTML = '<option value="all">전체</option>';
        if (found) {
          found.teams.forEach(t => {
            teamFilter.innerHTML += `<option value="${t.id}">${t.name}</option>`;
          });
        }
      }
      applyFilter();
    }

    // 모든 필터 조건을 순차 체이닝하여 AND 조건으로 적용
    // 각 필터는 독립적으로 'all'이면 건너뛰는 방식
    function applyFilter() {
      const wsId = document.getElementById('ws-filter').value;
      const teamId = document.getElementById('team-filter').value;

      const evals = allData['evaluations.json'];
      if (evals) {
        let filtered = evals;
        if (wsId !== 'all') filtered = filtered.filter(e => e.center_id === wsId);
        if (teamId !== 'all') filtered = filtered.filter(e => e.team_id === teamId);
        const typeVal = document.getElementById('type-filter').value;
        if (typeVal !== 'all') filtered = filtered.filter(e => e.call_type === typeVal);
        const issueVal = document.getElementById('issue-filter').value;
        if (issueVal === 'fail') filtered = filtered.filter(e => e.fail_items && e.fail_items.length > 0);
        if (issueVal === 'under') filtered = filtered.filter(e => isUnderThreshold(e));
        const reviewVal = document.getElementById('review-filter').value;
        if (reviewVal === 'reviewed') filtered = filtered.filter(e => e.manual_review);
        if (reviewVal === 'unreviewed') filtered = filtered.filter(e => !e.manual_review);
        const agentSearch = (document.getElementById('agent-search').value || '').trim().toLowerCase();
        if (agentSearch) filtered = filtered.filter(e => (e.agent_name || '').toLowerCase().includes(agentSearch));
        const scoreVal = document.getElementById('score-filter').value;
        if (scoreVal === 'high') filtered = filtered.filter(e => e.total_score >= 80);
        if (scoreVal === 'mid') filtered = filtered.filter(e => e.total_score >= 60 && e.total_score < 80);
        if (scoreVal === 'low') filtered = filtered.filter(e => e.total_score < 60);
        const formVal = document.getElementById('form-filter').value;
        if (formVal !== 'all') filtered = filtered.filter(e => e.eval_form === formVal);
        const confVal = document.getElementById('confidence-filter').value;
        if (confVal !== 'all') {
          filtered = filtered.filter(e => {
            const conf = e.confidence === 'Medium' ? 'Mid' : e.confidence;
            return conf === confVal;
          });
        }
        const consultSearch = (document.getElementById('consult-search').value || '').trim().toLowerCase();
        if (consultSearch) filtered = filtered.filter(e => (e.consultation_type || '').toLowerCase().includes(consultSearch));
        filtered = applySorting(filtered);
        renderEvalTable(filtered);
      }

      AICC_Toast.show('필터가 적용되었습니다.');
    }

    // 모든 필터를 초기 상태로 복원 후 전체 데이터 재렌더링
    function resetFilter() {
      document.getElementById('ws-filter').value = 'all';
      document.getElementById('team-filter').value = 'all';
      document.getElementById('team-filter').disabled = true;
      document.getElementById('type-filter').value = 'all';
      document.getElementById('issue-filter').value = 'all';
      document.getElementById('review-filter').value = 'all';
      document.getElementById('agent-search').value = '';
      document.getElementById('score-filter').value = 'all';
      document.getElementById('form-filter').value = 'all';
      document.getElementById('confidence-filter').value = 'all';
      document.getElementById('consult-search').value = '';
      renderAll();
    }
  </script>
