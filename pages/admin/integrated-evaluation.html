<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>통합 평가 현황 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">통합 평가 현황</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">자동 평가 · 수동 평가 통합 조회</p>
      </div>
    </div>

    <div class="tab-nav" style="margin-bottom:20px;">
      <div class="tab-item active" onclick="switchMainTab('all')">전체</div>
      <div class="tab-item" onclick="switchMainTab('detail')">상세 분석</div>
    </div>

    <!-- 전체 탭 -->
    <div id="tab-all">
      <div class="filter-section">
        <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
          <span>검색조건</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <div class="filter-body">
          <div>
            <label class="form-label">센터</label>
            <select class="form-select" id="ws-filter" onchange="onWsChange()">
              <option value="all">전체</option>
            </select>
          </div>
          <div>
            <label class="form-label">팀</label>
            <select class="form-select" id="team-filter" disabled>
              <option value="all">전체</option>
            </select>
          </div>
          <div>
            <label class="form-label">기간</label>
            <div id="period-picker-container"></div>
          </div>
          <div>
            <label class="form-label">상담사</label>
            <input type="text" class="form-input" id="agent-search" placeholder="상담사명 검색" style="min-width:130px;">
          </div>
          <div>
            <label class="form-label">점수 범위</label>
            <select class="form-select" id="score-filter">
              <option value="all">전체</option>
              <option value="excellent">90점 이상 (우수)</option>
              <option value="good">80 ~ 89점 (양호)</option>
              <option value="caution">70 ~ 79점 (주의)</option>
              <option value="low">70점 미만 (미달)</option>
            </select>
          </div>
          <div>
            <label class="form-label">통화유형</label>
            <select class="form-select" id="type-filter">
              <option value="all">전체</option>
              <option value="I/B">I/B (인바운드)</option>
              <option value="O/B">O/B (아웃바운드)</option>
            </select>
          </div>
          <div>
            <label class="form-label">평가방식</label>
            <select class="form-select" id="method-filter">
              <option value="all">전체</option>
              <option value="auto">자동</option>
              <option value="manual">수동</option>
            </select>
          </div>
          <div>
            <label class="form-label">이슈 유형</label>
            <select class="form-select" id="issue-filter">
              <option value="all">전체</option>
              <option value="fail">FAIL (금지어)</option>
              <option value="under">기준 미달 (평가표 기준 미만)</option>
            </select>
          </div>
          <div>
            <label class="form-label">&nbsp;</label>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-secondary btn-sm" onclick="resetFilter()">초기화</button>
              <button class="btn btn-primary btn-sm" onclick="applyFilter()">검색</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 개선 제안 롤링 바 -->
      <div id="suggestion-bar" style="display:none;margin-top:16px;padding:12px 20px;background:linear-gradient(135deg,#EDE7F6 0%,#E8EAF6 100%);border-radius:8px;border:1px solid #D1C4E9;align-items:center;gap:30px;">
        <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z" fill="#7C4DFF"/><rect x="9" y="19" width="6" height="2" rx="1" fill="#7C4DFF" opacity="0.6"/><circle cx="12" cy="9" r="2" fill="#fff" opacity="0.8"/></svg>
          <span style="font-size:12px;font-weight:700;color:#5E35B1;white-space:nowrap;">AI 개선 제안</span>
        </div>
        <div id="suggestion-text-wrap" style="flex:1;overflow:hidden;height:20px;position:relative;">
          <div id="suggestion-text" style="font-size:13px;color:#424242;line-height:20px;position:absolute;width:100%;transition:all 0.4s ease;"></div>
        </div>
        <button class="btn btn-sm" onclick="openActionModal()" style="flex-shrink:0;background:#5E35B1;color:#fff;border:none;padding:5px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;">조치 등록</button>
      </div>

      <div class="content-card" style="margin-top:16px;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">통합 평가 결과</span>
          <span style="font-size:12px;color:#757575;" id="eval-count">총 0건</span>
        </div>
        <div class="content-card-body" style="padding:0;">
          <table class="data-table">
            <colgroup>
              <col style="width:7%">
              <col style="width:9%">
              <col style="width:5%">
              <col style="width:5%">
              <col style="width:5%">
              <col style="width:5%">
              <col style="width:12%">
              <col style="width:5%">
              <col style="width:5%">
              <col style="width:6%">
              <col style="width:11%">
              <col style="width:5%">
              <col style="width:5%">
              <col style="width:15%">
            </colgroup>
            <thead>
              <tr>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('id')">평가 ID <span id="sort-icon-id" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('date')">일시 <span id="sort-icon-date" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('center')">센터 <span id="sort-icon-center" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('team')">팀 <span id="sort-icon-team" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('empid')">사번 <span id="sort-icon-empid" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('agent')">상담사 <span id="sort-icon-agent" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('consult')">상담 유형 <span id="sort-icon-consult" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('duration')">통화 시간 <span id="sort-icon-duration" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('type')">유형 <span id="sort-icon-type" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('method')">평가방식 <span id="sort-icon-method" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('form')">평가표 <span id="sort-icon-form" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('score')">점수 <span id="sort-icon-score" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('confidence')">신뢰도 <span id="sort-icon-confidence" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
                <th style="text-align:center;">이슈</th>
              </tr>
            </thead>
            <tbody id="eval-tbody"></tbody>
          </table>
          <div class="pagination">
            <button class="pagination-btn" onclick="goPage('first')">&laquo;</button>
            <span id="page-buttons"></span>
            <button class="pagination-btn" onclick="goPage('last')">&raquo;</button>
            <span style="margin-left:16px;font-size:12px;color:#757575;">페이지당:
              <select class="form-select" id="page-size-select" style="min-width:60px;padding:2px 24px 2px 8px;" onchange="changePageSize()">
                <option>10</option>
                <option selected>20</option>
                <option>50</option>
              </select>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- 상세 분석 탭: detail-analysis.html을 embedded 모드로 로드 -->
    <div id="tab-detail" style="display:none;">
      <iframe id="detail-iframe" style="width:100%;border:none;min-height:calc(100vh - 200px);"></iframe>
    </div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/period-picker.js"></script>
  <script>
    let allData = {};
    let allEvals = [];
    let filteredEvals = [];
    let currentPage = 1;
    let pageSize = 20;
    let deductionParam = null;
    let dateParam = null;
    let sortKey = null;
    let sortDir = null;
    let periodFilterInfo = null;

    document.addEventListener('DOMContentLoaded', async () => {
      allData = await AICC_DataLoader.loadAll([
        'evaluations.json',
        'manual-evaluations.json',
        'evaluation-forms.json',
        'evaluation-items.json',
        'centers.json'
      ]);
      mergeEvaluations();
      populateFilters();
      applyUrlParams();

      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function(type, info) { periodFilterInfo = info; }
      });

      renderTable();
    });

    // 당월 1일~말일 전체 + 전월 더미 데이터 생성
    // 대시보드 숫자(FAIL 3건, 기준미달 6건)와 일치하도록 이슈 항목을 제어
    function generateRecentEvals(sourceEvals) {
      const today = new Date();
      const year = today.getFullYear();
      const month = today.getMonth();
      const mm = String(month + 1).padStart(2, '0');
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const recentDates = [];
      for (let d = 1; d <= daysInMonth; d++) {
        recentDates.push(`${year}-${mm}-${String(d).padStart(2, '0')}`);
      }
      const prevMonth = month === 0 ? 11 : month - 1;
      const prevYear = month === 0 ? year - 1 : year;
      const pmm = String(prevMonth + 1).padStart(2, '0');
      const prevDays = new Date(prevYear, prevMonth + 1, 0).getDate();
      for (let d = 1; d <= prevDays; d++) {
        recentDates.push(`${prevYear}-${pmm}-${String(d).padStart(2, '0')}`);
      }

      const cleanSources = sourceEvals.filter(e =>
        (!e.fail_items || e.fail_items.length === 0) && e.total_score >= 70
      );
      const generated = [];
      let idCounter = 90000;
      recentDates.forEach(date => {
        const count = 2 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
          const src = cleanSources[Math.floor(Math.random() * cleanSources.length)];
          if (!src) continue;
          const scoreDelta = Math.floor(Math.random() * 11) - 3;
          const newScore = Math.max(65, Math.min(100, (src.total_score || 85) + scoreDelta));
          generated.push({
            ...src,
            id: `AE-${date.substring(0,4)}-${String(idCounter++).padStart(5, '0')}`,
            date: date,
            total_score: newScore,
            fail_items: [],
            issues: (src.issues || []).filter(x => !x.includes('FAIL') && !x.includes('기준 미달')),
            call_time: String(8 + Math.floor(Math.random() * 10)).padStart(2, '0') + ':' + String(Math.floor(Math.random() * 60)).padStart(2, '0')
          });
        }
      });

      // 대시보드 숫자와 일치하도록 당월에 FAIL 3건, 기준미달 6건 삽입
      const failAgents = [
        { name: '이영희', center: '서울센터', center_id: 'ct-seoul', team: 'VIP상담팀', team_id: 'team-vip' },
        { name: '최수진', center: '서울센터', center_id: 'ct-seoul', team: '기술지원팀', team_id: 'team-tech' },
        { name: '박지훈', center: '대구센터', center_id: 'ct-daegu', team: 'CS상담팀', team_id: 'team-cs' }
      ];
      const underAgents = [
        { name: '정민호', center: '서울센터', center_id: 'ct-seoul', team: '기술지원팀', team_id: 'team-tech' },
        { name: '김하늘', center: '부산센터', center_id: 'ct-busan', team: '일반상담팀', team_id: 'team-general' },
        { name: '오세훈', center: '서울센터', center_id: 'ct-seoul', team: '일반상담팀', team_id: 'team-general' },
        { name: '한지민', center: '대구센터', center_id: 'ct-daegu', team: 'CS상담팀', team_id: 'team-cs' },
        { name: '윤서연', center: '부산센터', center_id: 'ct-busan', team: '해피콜팀', team_id: 'team-happy' },
        { name: '장현우', center: '서울센터', center_id: 'ct-seoul', team: 'VIP상담팀', team_id: 'team-vip' }
      ];
      const baseSrc = cleanSources[0] || sourceEvals[0];
      failAgents.forEach((ag, i) => {
        const day = 5 + i * 7;
        const date = `${year}-${mm}-${String(Math.min(day, daysInMonth)).padStart(2, '0')}`;
        generated.push({
          ...baseSrc,
          id: `AE-${year}-F${String(i+1).padStart(4, '0')}`,
          date, agent_name: ag.name, center: ag.center, center_id: ag.center_id, team: ag.team, team_id: ag.team_id,
          total_score: 30 + Math.floor(Math.random() * 20),
          fail_items: ['profanity'],
          issues: ['FAIL(금지어) - 부적절한 표현 감지'],
          call_time: `${String(9 + i * 2).padStart(2, '0')}:${String(15 + i * 10).padStart(2, '0')}`
        });
      });
      underAgents.forEach((ag, i) => {
        const day = 3 + i * 4;
        const date = `${year}-${mm}-${String(Math.min(day, daysInMonth)).padStart(2, '0')}`;
        generated.push({
          ...baseSrc,
          id: `AE-${year}-U${String(i+1).padStart(4, '0')}`,
          date, agent_name: ag.name, center: ag.center, center_id: ag.center_id, team: ag.team, team_id: ag.team_id,
          total_score: 45 + Math.floor(Math.random() * 12),
          fail_items: [],
          issues: ['기준 미달 - 평가 기준점 미충족'],
          call_time: `${String(9 + i).padStart(2, '0')}:${String(20 + i * 5).padStart(2, '0')}`
        });
      });

      return generated;
    }

    // agent_id -> 사번 매핑
    const EMPLOYEE_ID_MAP = {
      'agent001': 'S-1001', 'agent002': 'S-1002', 'agent003': 'S-1003', 'agent004': 'S-1004',
      'agent005': 'S-1005', 'agent006': 'S-1006', 'agent007': 'S-1007', 'agent008': 'S-1008',
      'agent009': 'S-1009', 'agent010': 'S-1010', 'agent011': 'S-1011', 'agent012': 'S-1012'
    };
    // agent_name -> 사번 매핑 (generateRecentEvals에서 생성된 데이터용)
    const EMPLOYEE_NAME_MAP = {
      '홍길동': 'S-1001', '이영희': 'S-1002', '김철수': 'S-1003', '박지민': 'S-1004',
      '최수진': 'S-1005', '정민호': 'S-1006', '강현우': 'S-1007', '윤서연': 'S-1008',
      '박지훈': 'S-2001', '김하늘': 'S-2002', '오세훈': 'S-2003', '한지민': 'S-2004', '장현우': 'S-2005'
    };
    function assignEmployeeId(ev) {
      if (ev.employee_id) return ev;
      const eid = EMPLOYEE_ID_MAP[ev.agent_id] || EMPLOYEE_NAME_MAP[ev.agent_name] || '-';
      return { ...ev, employee_id: eid };
    }

    function mergeEvaluations() {
      const autoEvals = (allData['evaluations.json'] || []).map(e => ({
        ...e,
        fail_items: [],
        issues: (e.issues || []).filter(x => !x.includes('FAIL') && !x.includes('기준 미달')),
        total_score: Math.max(65, e.total_score || 80)
      }));
      const manualEvals = (allData['manual-evaluations.json'] || []).map(e => ({
        ...e,
        fail_items: [],
        issues: (e.issues || []).filter(x => !x.includes('FAIL') && !x.includes('기준 미달')),
        total_score: Math.max(65, e.total_score || 80)
      }));

      const recentAuto = generateRecentEvals(allData['evaluations.json'] || []);

      const tagged_auto = [...autoEvals, ...recentAuto].map(e => ({ ...assignEmployeeId(e), eval_method: 'auto' }));
      const tagged_manual = manualEvals.map(e => ({ ...assignEmployeeId(e), eval_method: 'manual' }));

      allEvals = [...tagged_auto, ...tagged_manual].sort((a, b) => {
        const da = (a.date || '') + ' ' + (a.call_time || '');
        const db = (b.date || '') + ' ' + (b.call_time || '');
        return db.localeCompare(da);
      });
    }

    function populateFilters() {
      const ws = allData['centers.json'];
      if (ws) {
        const select = document.getElementById('ws-filter');
        ws.forEach(w => {
          select.innerHTML += `<option value="${w.id}">${w.name}</option>`;
        });
      }
    }

    // 대시보드에서 딥링크로 진입 시 URL 파라미터를 필터에 반영
    function applyUrlParams() {
      const params = new URLSearchParams(window.location.search);

      const issueParam = params.get('issue');
      if (issueParam) document.getElementById('issue-filter').value = issueParam;

      // ws 파라미터(센터 ID)로 센터 필터를 먼저 설정한 뒤 팀 필터 적용
      const wsParam = params.get('ws');
      const teamParam = params.get('team');
      const centerParam = params.get('center');
      const centers = allData['centers.json'] || [];

      if (wsParam) {
        const foundCenter = centers.find(c => c.id === wsParam);
        if (foundCenter) {
          document.getElementById('ws-filter').value = foundCenter.id;
          onWsChange();
          if (teamParam) {
            const foundTeam = foundCenter.teams.find(t => t.name === teamParam);
            if (foundTeam) {
              document.getElementById('team-filter').value = foundTeam.id;
            }
          }
        }
      } else if (teamParam) {
        const teamFilter = document.getElementById('team-filter');
        for (const center of centers) {
          const found = center.teams.find(t => t.name === teamParam);
          if (found) {
            document.getElementById('ws-filter').value = center.id;
            onWsChange();
            teamFilter.value = found.id;
            break;
          }
        }
      } else if (centerParam) {
        const found = centers.find(w => w.name === centerParam);
        if (found) {
          document.getElementById('ws-filter').value = found.id;
          onWsChange();
        }
      }

      const scoreRange = params.get('score_range');
      if (scoreRange) {
        // 대시보드 점수 분포에서 넘어오는 값(excellent/good/caution/low)을 필터 옵션으로 변환
        const rangeToFilter = { excellent: 'excellent', good: 'good', caution: 'caution', low: 'low', high: 'high', mid: 'mid' };
        document.getElementById('score-filter').value = rangeToFilter[scoreRange] || scoreRange;
      }

      const methodParam = params.get('method');
      if (methodParam) {
        document.getElementById('method-filter').value = methodParam;
      }

      const typeParam = params.get('type');
      if (typeParam) {
        const map = { 'IB': 'I/B', 'OB': 'O/B' };
        document.getElementById('type-filter').value = map[typeParam] || 'all';
      }

      const agentParam = params.get('agent');
      if (agentParam) document.getElementById('agent-search').value = agentParam;

      deductionParam = params.get('deduction') || null;
      dateParam = params.get('date') || null;

      // tab=detail이면 "상세 분석" 탭을 활성화하고 iframe에 센터/팀 파라미터 전달
      const tabParam = params.get('tab');
      if (tabParam === 'detail') {
        const tabs = document.querySelectorAll('.tab-item');
        tabs.forEach(t => t.classList.remove('active'));
        if (tabs[1]) tabs[1].classList.add('active');
        document.getElementById('tab-all').style.display = 'none';
        document.getElementById('tab-detail').style.display = '';

        const iframe = document.getElementById('detail-iframe');
        let iframeSrc = 'detail-analysis.html?embed';
        const ct = params.get('ct');
        const tm = params.get('team');
        const ag = params.get('agent');
        if (ct) iframeSrc += '&ct=' + encodeURIComponent(ct);
        if (tm) iframeSrc += '&team=' + encodeURIComponent(tm);
        if (ag) iframeSrc += '&agent=' + encodeURIComponent(ag);
        iframe.src = iframeSrc;
        iframe.onload = function() { adjustIframeHeight(iframe); };
        detailIframeLoaded = true;
      }
    }

    // 3단계 중첩 구조를 flat map으로 변환해 ID 기반 O(1) 조회 지원
    function buildItemNameMap() {
      const items = allData['evaluation-items.json'];
      const map = {
        'item-greeting': '첫인사',
        'item-empathy': '공감 표현',
        'item-solution': '문제 해결',
        'item-closing': '끝인사',
        'item-forbidden': '욕설/금지어'
      };
      if (!items || !items.categories) return map;
      items.categories.forEach(cat => {
        cat.children.forEach(child => {
          child.items.forEach(item => {
            map[item.id] = item.name;
          });
        });
      });
      return map;
    }

    function getPassThreshold(ev) {
      const forms = allData['evaluation-forms.json'];
      if (!forms) return 60;
      const matched = forms.find(f => {
        if (f.status !== 'active') return false;
        if (f.type !== ev.call_type) return false;
        return f.applied_to && f.applied_to.includes(ev.center_id);
      });
      return matched && matched.pass_threshold ? matched.pass_threshold : 60;
    }

    function isUnderThreshold(ev) {
      return ev.total_score > 0 && ev.total_score < getPassThreshold(ev);
    }

    // 자동 평가의 주 평가 방식(AI/NLP)을 항목별 비율로 결정
    function getAutoMethodLabel(ev) {
      if (!ev.scores) return 'AI';
      const types = Object.values(ev.scores).map(v => v.type);
      const aiCount = types.filter(t => t === 'AI').length;
      const nlpCount = types.filter(t => t === 'NLP').length;
      return nlpCount > aiCount ? 'NLP' : 'AI';
    }

    function getMethodBadge(ev) {
      if (ev.eval_method === 'manual') {
        return '<span class="badge badge-manual">수동</span>';
      }
      return '<span class="badge badge-ai">자동</span>';
    }

    function getCallTypeBadge(callType) {
      if (callType === 'I/B') {
        return '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>';
      }
      return '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>';
    }

    function renderTable() {
      filteredEvals = getFilteredEvals();

      if (sortKey && sortDir) {
        filteredEvals.sort((a, b) => {
          let va, vb;
          switch (sortKey) {
            case 'id': va = a.id; vb = b.id; break;
            case 'date': va = (a.date||'')+(a.call_time||''); vb = (b.date||'')+(b.call_time||''); break;
            case 'empid': va = a.employee_id||''; vb = b.employee_id||''; break;
            case 'center': va = a.center||''; vb = b.center||''; break;
            case 'team': va = a.team||''; vb = b.team||''; break;
            case 'agent': va = a.agent_name||''; vb = b.agent_name||''; break;
            case 'duration': va = a.duration||''; vb = b.duration||''; break;
            case 'consult': va = a.consultation_type||''; vb = b.consultation_type||''; break;
            case 'type': va = a.call_type||''; vb = b.call_type||''; break;
            case 'method': va = a.eval_method||''; vb = b.eval_method||''; break;
            case 'form': va = a.eval_form||''; vb = b.eval_form||''; break;
            case 'score': return sortDir === 'asc' ? a.total_score - b.total_score : b.total_score - a.total_score;
            case 'confidence': va = a.confidence||''; vb = b.confidence||''; break;
          }
          const cmp = String(va).localeCompare(String(vb), 'ko');
          return sortDir === 'asc' ? cmp : -cmp;
        });
      }

      const totalPages = Math.max(1, Math.ceil(filteredEvals.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;

      document.getElementById('eval-count').textContent = `총 ${filteredEvals.length}건`;

      const start = (currentPage - 1) * pageSize;
      const pageData = filteredEvals.slice(start, start + pageSize);

      const tbody = document.getElementById('eval-tbody');
      tbody.innerHTML = pageData.map(ev => {
        const callTypeBadge = getCallTypeBadge(ev.call_type);
        const methodBadge = getMethodBadge(ev);
        const scoreHtml = ev.total_score > 0
          ? AICC_Fmt.scoreHtml(ev.total_score)
          : '<span style="color:#BDBDBD;font-size:12px;">-</span>';

        const issueHtml = ev.issues && ev.issues.length > 0
          ? ev.issues.slice(0, 2).map(i => `<div style="font-size:10px;color:#F57F17;">${i}</div>`).join('')
          : (ev.fail_items && ev.fail_items.length > 0
            ? '<div style="font-size:10px;color:#F57F17;">FAIL</div>'
            : (isUnderThreshold(ev)
              ? '<div style="font-size:10px;color:#F57F17;">기준 미달</div>'
              : '<span style="color:#9E9E9E;font-size:11px;">-</span>'));

        const conf = ev.confidence || (ev.eval_method === 'auto' ? ['High','Medium','High','High','Medium'][Math.floor(Math.random()*5)] : '-');
        const confBadge = conf === 'High' ? '<span style="display:inline-block;padding:2px 6px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:10px;font-weight:600;">High</span>'
          : conf === 'Medium' ? '<span style="display:inline-block;padding:2px 6px;background:#fff8e1;color:#f57f17;border-radius:4px;font-size:10px;font-weight:600;">Mid</span>'
          : conf === 'Low' ? '<span style="display:inline-block;padding:2px 6px;background:#fbe9e7;color:#d32f2f;border-radius:4px;font-size:10px;font-weight:600;">Low</span>'
          : '<span style="color:#9E9E9E;font-size:11px;">-</span>';

        return `<tr onclick="showEvalDetail('${ev.id}')" style="cursor:pointer;">
          <td style="font-size:11px;text-align:center;">${ev.id}</td>
          <td style="font-size:11px;white-space:nowrap;text-align:center;">${ev.date} ${ev.call_time || ''}</td>
          <td style="font-size:11px;text-align:center;">${ev.center || '-'}</td>
          <td style="font-size:11px;text-align:center;">${ev.team || '-'}</td>
          <td style="font-size:11px;text-align:center;">${ev.employee_id || '-'}</td>
          <td style="font-size:12px;text-align:center;">${ev.agent_name || '-'}</td>
          <td style="font-size:11px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;" title="${ev.consultation_type || '-'}">${ev.consultation_type || '-'}</td>
          <td style="font-size:11px;text-align:center;white-space:nowrap;">${ev.duration || '-'}</td>
          <td style="text-align:center;">${callTypeBadge}</td>
          <td style="text-align:center;">${methodBadge}</td>
          <td style="font-size:11px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;" title="${ev.eval_form || '-'}">${ev.eval_form || '-'}</td>
          <td style="text-align:center;">${scoreHtml}</td>
          <td style="text-align:center;">${confBadge}</td>
          <td style="text-align:center;font-size:11px;">${issueHtml}</td>
        </tr>`;
      }).join('');

      renderPagination(totalPages);
    }

    const SORT_KEYS = ['id','date','center','team','empid','agent','duration','consult','type','method','form','score','confidence'];

    function toggleSort(key) {
      if (sortKey === key) {
        if (sortDir === 'asc') sortDir = 'desc';
        else { sortKey = null; sortDir = null; }
      } else {
        sortKey = key;
        sortDir = 'asc';
      }
      updateSortIcons();
      currentPage = 1;
      renderTable();
    }

    function updateSortIcons() {
      SORT_KEYS.forEach(k => {
        const icon = document.getElementById('sort-icon-' + k);
        if (!icon) return;
        if (k === sortKey) {
          icon.textContent = sortDir === 'asc' ? '▲' : '▼';
          icon.style.color = '#1976D2';
        } else {
          icon.textContent = '⇅';
          icon.style.color = '#BDBDBD';
        }
      });
    }

    function renderPagination(totalPages) {
      const container = document.getElementById('page-buttons');
      let html = '';
      const maxVisible = 5;
      let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
      let endPage = Math.min(totalPages, startPage + maxVisible - 1);
      if (endPage - startPage < maxVisible - 1) startPage = Math.max(1, endPage - maxVisible + 1);

      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    }

    function goPage(page) {
      const totalPages = Math.max(1, Math.ceil(filteredEvals.length / pageSize));
      if (page === 'first') currentPage = 1;
      else if (page === 'last') currentPage = totalPages;
      else currentPage = page;
      renderTable();
    }

    function changePageSize() {
      pageSize = parseInt(document.getElementById('page-size-select').value, 10);
      currentPage = 1;
      renderTable();
    }

    // 모든 필터 조건을 순차 체이닝하여 AND 조건 적용
    function getFilteredEvals() {
      let filtered = [...allEvals];

      if (periodFilterInfo) {
        let pFrom = '', pTo = '';
        if (periodFilterInfo.type === 'daily') { pFrom = periodFilterInfo.date; pTo = periodFilterInfo.date; }
        else if (periodFilterInfo.type === 'weekly' || periodFilterInfo.type === 'custom') { pFrom = periodFilterInfo.from || ''; pTo = periodFilterInfo.to || ''; }
        else if (periodFilterInfo.type === 'monthly') { pFrom = `${periodFilterInfo.year}-${String(periodFilterInfo.month).padStart(2,'0')}-01`; pTo = `${periodFilterInfo.year}-${String(periodFilterInfo.month).padStart(2,'0')}-31`; }
        else if (periodFilterInfo.type === 'yearly') { pFrom = `${periodFilterInfo.year}-01-01`; pTo = `${periodFilterInfo.year}-12-31`; }
        if (pFrom) filtered = filtered.filter(e => (e.date || '') >= pFrom);
        if (pTo) filtered = filtered.filter(e => (e.date || '') <= pTo);
      }

      const wsId = document.getElementById('ws-filter').value;
      if (wsId !== 'all') filtered = filtered.filter(e => e.center_id === wsId);

      const teamId = document.getElementById('team-filter').value;
      if (teamId !== 'all') filtered = filtered.filter(e => e.team_id === teamId);

      const typeVal = document.getElementById('type-filter').value;
      if (typeVal !== 'all') filtered = filtered.filter(e => e.call_type === typeVal);

      const methodVal = document.getElementById('method-filter').value;
      if (methodVal === 'auto') {
        filtered = filtered.filter(e => e.eval_method === 'auto');
      } else if (methodVal === 'manual') {
        filtered = filtered.filter(e => e.eval_method === 'manual');
      }

      const issueVal = document.getElementById('issue-filter').value;
      if (issueVal === 'fail') {
        filtered = filtered.filter(e =>
          (e.fail_items && e.fail_items.length > 0) ||
          (e.issues && e.issues.some(i => i.includes('FAIL')))
        );
      }
      if (issueVal === 'under') {
        filtered = filtered.filter(e =>
          isUnderThreshold(e) ||
          (e.issues && e.issues.some(i => i.includes('기준 미달')))
        );
      }

      const agentSearch = (document.getElementById('agent-search').value || '').trim().toLowerCase();
      if (agentSearch) filtered = filtered.filter(e => (e.agent_name || '').toLowerCase().includes(agentSearch));

      const scoreVal = document.getElementById('score-filter').value;
      if (scoreVal === 'excellent') filtered = filtered.filter(e => e.total_score >= 90);
      else if (scoreVal === 'good') filtered = filtered.filter(e => e.total_score >= 80 && e.total_score < 90);
      else if (scoreVal === 'caution') filtered = filtered.filter(e => e.total_score >= 70 && e.total_score < 80);
      else if (scoreVal === 'low') filtered = filtered.filter(e => e.total_score > 0 && e.total_score < 70);

      if (deductionParam) {
        const itemNameMap = buildItemNameMap();
        filtered = filtered.filter(e => {
          if (!e.scores) return false;
          return Object.entries(e.scores).some(([key, val]) => {
            if (val.status === 'pass') return false;
            if (key === deductionParam) return true;
            const name = itemNameMap[key] || key;
            return name === deductionParam;
          });
        });
      }

      // 품질 추세 차트에서 특정 날짜 클릭 시 해당 날짜 건만 표시
      if (dateParam) {
        filtered = filtered.filter(e => e.date === dateParam);
      }

      return filtered;
    }

    function showEvalDetail(evalId) {
      const ev = allEvals.find(e => e.id === evalId);
      if (!ev) return;

      // A-033: transcript이 없을 때 시뮬레이션 스크립트 생성 (NLP 포함 전 방식 지원)
      const simTranscriptFallback = [
        { speaker: 'agent', time: '00:01', text: `안녕하세요, ${ev.agent_name || '상담사'}입니다. 무엇을 도와드릴까요?` },
        { speaker: 'customer', time: '00:05', text: '네, 안녕하세요. 문의 사항이 있어서 연락드렸습니다.' },
        { speaker: 'agent', time: '00:10', text: '네, 어떤 부분 도와드릴까요? 말씀해 주세요.' },
        { speaker: 'customer', time: '00:15', text: '주문 건 확인 좀 부탁드릴게요.' },
        { speaker: 'agent', time: '00:20', text: '네, 주문 확인 도와드리겠습니다. 주문번호 확인 부탁드리겠습니다.' },
        { speaker: 'customer', time: '00:25', text: '주문번호는 ORD-2025-00382입니다.' },
        { speaker: 'agent', time: '00:30', text: '확인하겠습니다. 잠시만 기다려주세요. 네, 확인되었습니다. 현재 배송 중이며 내일 오전 도착 예정입니다.' },
        { speaker: 'customer', time: '00:40', text: '아, 감사합니다. 다른 건 없어요.' },
        { speaker: 'agent', time: '00:43', text: '감사합니다. 좋은 하루 되세요!' }
      ];
      const activeTranscript = (ev.transcript && ev.transcript.length > 0) ? ev.transcript : simTranscriptFallback;

      const itemNameMap = buildItemNameMap();
      const scoreRows = Object.entries(ev.scores).map(([key, val], idx) => {
        const statusCls = val.status === 'pass' ? 'score-good' : val.status === 'warn' ? 'score-warn' : 'score-danger';
        const statusText = val.status === 'pass' ? '통과' : val.status === 'warn' ? '주의' : '미달';
        const confHtml = val.confidence ? `<span style="font-size:11px;color:#757575;">${val.confidence}%</span>` : '';
        const reasonHtml = val.reason ? `<div style="font-size:10px;color:#F57F17;margin-top:2px;">${val.reason}</div>` : '';
        const itemName = itemNameMap[key] || key;
        return `
          <tr style="cursor:pointer;" onclick="scrollToTranscript(${idx})" title="클릭하면 해당 구간으로 이동합니다">
            <td style="font-size:11px;padding:6px 4px;text-align:left;">${itemName}</td>
            <td style="padding:6px 4px;text-align:center;">${AICC_Fmt.typeBadge(val.type)}</td>
            <td style="text-align:center;font-weight:500;font-size:11px;padding:6px 4px;">${val.score}/${val.max}</td>
            <td style="padding:6px 4px;text-align:center;">${confHtml}</td>
            <td style="padding:6px 4px;text-align:center;"><span class="${statusCls}" style="font-size:11px;">${statusText}</span>${reasonHtml}</td>
          </tr>
        `;
      }).join('');

      const transcriptHtml = activeTranscript.length > 0
        ? activeTranscript.map((t, idx) => {
            const isAgent = t.speaker === 'agent';
            const bg = isAgent ? '#E3F2FD' : '#F5F5F5';
            const hoverBg = isAgent ? '#B3E5FC' : '#EEEEEE';
            const label = isAgent ? '상담사' : '고객';
            return `
              <div class="transcript-line" data-idx="${idx}" style="display:flex;gap:10px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:background 0.15s;" onclick="playSegment(this, '${t.time}')" onmouseenter="this.style.background='${hoverBg}'" onmouseleave="if(!this.classList.contains('playing'))this.style.background=''">
                <div style="min-width:40px;font-size:10px;color:#757575;padding-top:2px;">${t.time}</div>
                <div style="flex:1;">
                  <div style="font-size:10px;font-weight:600;color:${isAgent ? '#00A3FF' : '#424242'};margin-bottom:2px;">${label}</div>
                  <div style="background:${bg};padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5;display:flex;align-items:start;gap:6px;">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="${isAgent ? '#00A3FF' : '#757575'}" style="flex-shrink:0;margin-top:3px;opacity:0.5;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    <span>${t.text}</span>
                  </div>
                </div>
              </div>
            `;
          }).join('')
        : '<p style="color:#9E9E9E;font-size:13px;text-align:center;padding:20px;">스크립트 데이터가 없습니다.</p>';

      const scoreColor = ev.total_score >= 80 ? 'color:#4CAF50' : ev.total_score >= 60 ? 'color:#FFC107' : 'color:#F44336';
      const callTypeBadge = getCallTypeBadge(ev.call_type);
      const methodBadge = getMethodBadge(ev);
      const confBadge = ev.confidence === 'High'
        ? '<span class="badge badge-active">High</span>'
        : ev.confidence === 'Medium'
        ? '<span class="badge badge-pending">Mid</span>'
        : ev.confidence
        ? '<span class="badge badge-rejected">Low</span>'
        : '<span style="color:#9E9E9E;font-size:11px;">-</span>';

      const totalDisplay = ev.total_score > 0
        ? `<strong style="font-size:16px;${scoreColor}">${ev.total_score}점</strong>`
        : '<span style="color:#BDBDBD;">미평가</span>';

      const infoRow = (label, value) => `<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0;border-bottom:1px solid #F0F0F0;"><span style="font-size:11px;color:#9E9E9E;white-space:nowrap;">${label}</span><span style="font-size:12px;font-weight:500;text-align:right;margin-left:8px;">${value}</span></div>`;

      AICC_Modal.open({
        title: `평가 상세 - ${ev.id}`,
        size: 'xxl',
        content: `
          <div style="display:grid;grid-template-columns:300px 1fr 400px;gap:20px;height:calc(90vh - 140px);max-height:650px;">
            <div style="overflow-y:auto;padding-right:8px;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;">콜 정보</div>
              ${infoRow('평가 ID', '<span style="font-family:monospace;font-size:11px;">' + ev.id + '</span>')}
              ${infoRow('일시', ev.date + ' ' + (ev.call_time || ''))}
              ${infoRow('센터', ev.center || '-')}
              ${infoRow('팀', ev.team || '-')}
              ${infoRow('상담사', ev.agent_name || '-')}
              ${infoRow('상담 유형', '<span style="font-size:11px;">' + (ev.consultation_type || '-') + '</span>')}
              ${infoRow('유형', callTypeBadge)}
              ${infoRow('평가방식', methodBadge)}
              ${infoRow('평가표', '<span style="font-size:11px;">' + (ev.eval_form || '-') + '</span>')}
              ${infoRow('통화시간', ev.duration || '-')}
              ${ev.eval_method === 'auto' ? infoRow('신뢰도', confBadge) : ''}
              ${infoRow('점수', totalDisplay)}
              ${ev.eval_method === 'manual' && ev.manual_plan ? infoRow('평가 계획', '<span style="font-size:11px;">' + ev.manual_plan + '</span>') : ''}
              ${ev.ai_feedback ? `<div style="margin-top:12px;background:#F5F5F5;border-radius:6px;padding:10px 12px;font-size:11px;line-height:1.6;"><strong style="color:#424242;">AI 피드백</strong><br><span style="color:#757575;">${ev.ai_feedback}</span></div>` : ''}
            </div>
            <div style="display:flex;flex-direction:column;min-width:0;min-height:0;">
              <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">스크립트</div>
              <div id="transcript-container" style="flex:1;min-height:0;background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;padding:12px;overflow-y:auto;">
                ${transcriptHtml}
              </div>
              <div style="margin-top:10px;background:#F5F5F5;border:1px solid #E0E0E0;border-radius:8px;padding:10px 14px;flex-shrink:0;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <button onclick="togglePlay(this)" style="background:none;border:none;cursor:pointer;padding:0;">
                    <svg id="play-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="#424242"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                  </button>
                  <div style="flex:1;">
                    <div style="width:100%;height:4px;background:#BDBDBD;border-radius:2px;position:relative;cursor:pointer;" onclick="seekBar(event)">
                      <div id="player-progress" style="width:0%;height:100%;background:#00A3FF;border-radius:2px;transition:width 0.2s;"></div>
                    </div>
                  </div>
                </div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-left:30px;">
                  <span id="player-time" style="font-size:10px;color:#757575;">0:00</span>
                  <span id="player-segment-label" style="font-size:10px;color:#00A3FF;"></span>
                  <span style="font-size:10px;color:#757575;">${ev.duration || '0:00'}</span>
                </div>

    // A-035: 수동 검증 버튼 동작 — 검증 완료 상태로 변경 후 Toast 표시
    function openManualReview(evalId) {
      const ev = allEvals.find(e => e.id === evalId);
      if (ev) {
        ev.verification_status = '검증 완료';
      }
      AICC_Toast.show('수동 검증이 완료되었습니다.');

      renderTable();

    function scrollToTranscript(scoreIdx) {
      const container = document.getElementById('transcript-container');
      if (!container) return;
      const lines = container.querySelectorAll('.transcript-line');
      if (!lines.length) return;
      const scoreRowCount = document.querySelectorAll('.modal-container .data-table tbody tr').length || 1;
      const mappedIdx = Math.min(Math.floor(scoreIdx * (lines.length / scoreRowCount)), lines.length - 1);
      const targetLine = lines[Math.max(0, mappedIdx)];
      if (!targetLine) return;
      targetLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
      const time = targetLine.querySelector('div')?.textContent?.trim() || '0:00';
      playSegment(targetLine, time);
    }

    function playSegment(el, time) {
      document.querySelectorAll('.transcript-line').forEach(line => {
        line.classList.remove('playing');
        line.style.background = '';
      });
      el.classList.add('playing');
      el.style.background = el.querySelector('[fill="#00A3FF"]') ? '#B3E5FC' : '#EEEEEE';
      const label = document.getElementById('player-segment-label');
      if (label) label.textContent = '▶ ' + time + ' 구간 재생 중';
      const timeEl = document.getElementById('player-time');
      if (timeEl) timeEl.textContent = time;
      const progress = document.getElementById('player-progress');
      if (progress) {
        const pct = Math.min(95, Math.max(5, Math.random() * 80 + 10));
        progress.style.width = pct + '%';
      }
      const playIcon = document.getElementById('play-btn-icon');
      if (playIcon) playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';
      AICC_Toast.show(`${time} 구간 재생 (시뮬레이션)`);
    }

    function togglePlay(btn) {
      const icon = document.getElementById('play-btn-icon');
      if (!icon) return;
      const isPaused = icon.innerHTML.includes('polygon');
      if (isPaused) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16" fill="#424242"/><rect x="14" y="4" width="4" height="16" fill="#424242"/>';
        AICC_Toast.show('재생 시작 (시뮬레이션)');
      } else {
        icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
        AICC_Toast.show('일시 정지 (시뮬레이션)');
      }
    }

    function seekBar(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const progress = document.getElementById('player-progress');
      if (progress) progress.style.width = pct + '%';
    }

    let detailIframeLoaded = false;
    function switchMainTab(tab) {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-all').style.display = tab === 'all' ? '' : 'none';
      document.getElementById('tab-detail').style.display = tab === 'detail' ? '' : 'none';

      // 최초 탭 전환 시에만 iframe src를 설정하여 불필요한 초기 로딩 방지
      if (tab === 'detail' && !detailIframeLoaded) {
        const iframe = document.getElementById('detail-iframe');
        iframe.src = 'detail-analysis.html?embed';
        iframe.onload = function() { adjustIframeHeight(iframe); };
        detailIframeLoaded = true;
      }
    }

    let _iframeRO = null;
    let _iframeModalActive = false;

    function adjustIframeHeight(iframe) {
      try {
        const h = iframe.contentDocument.body.scrollHeight;
        iframe.style.height = Math.max(h, 600) + 'px';
      } catch(e) {}
      if (window.ResizeObserver && iframe.contentDocument) {
        _iframeRO = new ResizeObserver(() => {
          if (_iframeModalActive) return;
          try { iframe.style.height = iframe.contentDocument.body.scrollHeight + 'px'; } catch(e) {}
        });
        _iframeRO.observe(iframe.contentDocument.body);
      }
    }

    /* ══════════════════════════ 개선 제안 롤링 바 ══════════════════════════ */

    const suggestionPool = [

    let activeSuggestions = [];
    let suggestionIdx = 0;
    let suggestionTimer = null;

    function pickSuggestions() {
      const count = 3 + Math.floor(Math.random() * 3);
      const shuffled = [...suggestionPool].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function showSuggestionBar() {
      activeSuggestions = pickSuggestions();
      suggestionIdx = 0;
      const bar = document.getElementById('suggestion-bar');
      const textEl = document.getElementById('suggestion-text');
      bar.style.display = 'flex';
      textEl.style.opacity = '1';
      textEl.style.transform = 'translateY(0)';
      textEl.textContent = activeSuggestions[0];

      if (suggestionTimer) clearInterval(suggestionTimer);
      if (activeSuggestions.length > 1) {
        suggestionTimer = setInterval(rollSuggestion, 4000);
      }
    }

    function rollSuggestion() {
      const textEl = document.getElementById('suggestion-text');
      textEl.style.opacity = '0';
      textEl.style.transform = 'translateY(-10px)';
      setTimeout(() => {
        suggestionIdx = (suggestionIdx + 1) % activeSuggestions.length;
        textEl.textContent = activeSuggestions[suggestionIdx];
        textEl.style.transform = 'translateY(10px)';
        requestAnimationFrame(() => {
          textEl.style.opacity = '1';
          textEl.style.transform = 'translateY(0)';
        });
      }, 350);
    }

    function hideSuggestionBar() {
      document.getElementById('suggestion-bar').style.display = 'none';
      if (suggestionTimer) { clearInterval(suggestionTimer); suggestionTimer = null; }
    }

    function hasActiveFilter() {
      if (periodFilterInfo) return true;
      if (document.getElementById('ws-filter').value !== 'all') return true;
      if (document.getElementById('team-filter').value !== 'all') return true;
      if (document.getElementById('type-filter').value !== 'all') return true;
      if (document.getElementById('method-filter').value !== 'all') return true;
      if (document.getElementById('issue-filter').value !== 'all') return true;
      if (document.getElementById('score-filter').value !== 'all') return true;
      if ((document.getElementById('agent-search').value || '').trim()) return true;
      return false;

    /* ══════════════════════════ 검색 조건 요약 ══════════════════════════ */

    function getFilterSummary() {
      const lines = [];
      if (periodFilterInfo) {
        let periodText = '';
        if (periodFilterInfo.type === 'daily') periodText = periodFilterInfo.date;
        else if (periodFilterInfo.type === 'weekly') periodText = `${periodFilterInfo.from} ~ ${periodFilterInfo.to}`;
        else if (periodFilterInfo.type === 'monthly') periodText = `${periodFilterInfo.year}년 ${periodFilterInfo.month}월`;
        else if (periodFilterInfo.type === 'yearly') periodText = `${periodFilterInfo.year}년`;
        else if (periodFilterInfo.type === 'custom') periodText = `${periodFilterInfo.from || ''} ~ ${periodFilterInfo.to || ''}`;
        if (periodText) lines.push({ label: '기간', value: periodText });
      }
      const wsId = document.getElementById('ws-filter').value;
      if (wsId !== 'all') {
        lines.push({ label: '센터', value: document.getElementById('ws-filter').options[document.getElementById('ws-filter').selectedIndex].text });
      }
      const teamId = document.getElementById('team-filter').value;
      if (teamId !== 'all') {
        lines.push({ label: '팀', value: document.getElementById('team-filter').options[document.getElementById('team-filter').selectedIndex].text });
      }
      const agent = (document.getElementById('agent-search').value || '').trim();
      if (agent) lines.push({ label: '상담사', value: agent });
      const scoreVal = document.getElementById('score-filter').value;
      if (scoreVal !== 'all') {
        lines.push({ label: '점수 범위', value: document.getElementById('score-filter').options[document.getElementById('score-filter').selectedIndex].text });
      }
      const typeVal = document.getElementById('type-filter').value;
      if (typeVal !== 'all') {
        lines.push({ label: '통화유형', value: document.getElementById('type-filter').options[document.getElementById('type-filter').selectedIndex].text });
      }
      const methodVal = document.getElementById('method-filter').value;
      if (methodVal !== 'all') {
        lines.push({ label: '평가방식', value: methodVal === 'auto' ? '자동' : '수동' });
      }
      const issueVal = document.getElementById('issue-filter').value;
      if (issueVal !== 'all') {
        lines.push({ label: '이슈 유형', value: document.getElementById('issue-filter').options[document.getElementById('issue-filter').selectedIndex].text });
      }
      return lines;
    }

    function getFilterSummaryText() {
      const lines = getFilterSummary();
      return lines.length > 0 ? lines.map(l => l.value).join(' / ') : '조건 검색';
    }

    /* ══════════════════════════ 조치 등록 모달 ══════════════════════════ */

    const _admins = ['김관리자','박매니저','이팀장','최수석','정차장'];

    let _dtpState = { year: 0, month: 0, day: 0, hour: 0, minute: 0, open: false };

    function _initDtp() {
      const now = new Date();
      _dtpState = { year: now.getFullYear(), month: now.getMonth(), day: now.getDate(), hour: now.getHours(), minute: Math.floor(now.getMinutes() / 10) * 10, open: false };
    }

    function _dtpFmt() {
      return `${_dtpState.year}-${String(_dtpState.month+1).padStart(2,'0')}-${String(_dtpState.day).padStart(2,'0')} ${String(_dtpState.hour).padStart(2,'0')}:${String(_dtpState.minute).padStart(2,'0')}`;
    }

    function _getNow() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    function _toggleDtp() {
      if (_dtpState.open) { _closeDtp(); return; }
      _dtpState.open = true;
      _renderDtp();
    }

    function _closeDtp() {
      _dtpState.open = false;
      const ov = document.getElementById('act-dtp-overlay');
      if (ov) ov.remove();
    }

    function _renderDtp() {
      let ov = document.getElementById('act-dtp-overlay');
      if (!ov) {
        ov = document.createElement('div');
        ov.id = 'act-dtp-overlay';
        ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:10001;';
        ov.addEventListener('click', (e) => { if (e.target === ov) _closeDtp(); });
        document.body.appendChild(ov);
      }
      const trigger = document.getElementById('act-date-trigger');
      const rect = trigger.getBoundingClientRect();
      const pw = 300, ph = 420;
      let top = rect.bottom + 4, left = rect.left;
      if (top + ph > window.innerHeight) top = rect.top - ph - 4;
      if (left + pw > window.innerWidth) left = window.innerWidth - pw - 8;

      const y = _dtpState.year, m = _dtpState.month;
      const daysIn = new Date(y, m + 1, 0).getDate();
      const firstDay = new Date(y, m, 1).getDay();
      const todayStr = _getNow().split(' ')[0];
      const selStr = `${y}-${String(m+1).padStart(2,'0')}-${String(_dtpState.day).padStart(2,'0')}`;

      let calCells = '';
      ['일','월','화','수','목','금','토'].forEach(w => { calCells += `<div class="pp-weekday">${w}</div>`; });
      for (let i = 0; i < firstDay; i++) calCells += '<div class="pp-day empty"></div>';
      for (let d = 1; d <= daysIn; d++) {
        const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let cls = 'pp-day';
        if (ds === todayStr) cls += ' today';
        if (d === _dtpState.day) cls += ' selected';
        calCells += `<div class="${cls}" onclick="_dtpDay(${d})">${d}</div>`;
      }
      let hOpts = '';
      for (let h = 0; h < 24; h++) { hOpts += `<option value="${h}" ${h===_dtpState.hour?'selected':''}>${String(h).padStart(2,'0')}시</option>`; }
      let mOpts = '';
      for (let mi = 0; mi < 60; mi += 10) { mOpts += `<option value="${mi}" ${mi===_dtpState.minute?'selected':''}>${String(mi).padStart(2,'0')}분</option>`; }

      ov.innerHTML = `
        <div style="position:fixed;top:${top}px;left:${left}px;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);border:1px solid #E6E8F0;width:300px;">
          <div class="pp-body" style="padding:12px;">
            <div class="pp-nav">
              <button type="button" class="pp-nav-btn" onclick="_dtpNav(-1)">‹</button>
              <span class="pp-nav-title">${y}년 ${m+1}월</span>
              <button type="button" class="pp-nav-btn" onclick="_dtpNav(1)">›</button>
            </div>
            <div class="pp-cal-grid">${calCells}</div>
            <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
              <span style="font-size:12px;color:#616161;font-weight:500;white-space:nowrap;">시간</span>
              <select class="form-select" style="flex:1;min-width:0;padding:4px 8px;font-size:13px;" onchange="_dtpState.hour=parseInt(this.value)">${hOpts}</select>
              <select class="form-select" style="flex:1;min-width:0;padding:4px 8px;font-size:13px;" onchange="_dtpState.minute=parseInt(this.value)">${mOpts}</select>
            </div>
          </div>
          <div class="pp-footer">
            <button type="button" class="pp-footer-btn" onclick="_closeDtp()">취소</button>
            <button type="button" class="pp-footer-btn primary" onclick="_dtpApply()">확인</button>
          </div>
        </div>`;
    }

    function _dtpNav(dir) {
      _dtpState.month += dir;
      if (_dtpState.month < 0) { _dtpState.month = 11; _dtpState.year--; }
      if (_dtpState.month > 11) { _dtpState.month = 0; _dtpState.year++; }
      const mx = new Date(_dtpState.year, _dtpState.month + 1, 0).getDate();
      if (_dtpState.day > mx) _dtpState.day = mx;
      _renderDtp();
    }

    function _dtpDay(d) { _dtpState.day = d; _renderDtp(); }

    function _dtpApply() {
      const val = _dtpFmt();
      document.getElementById('act-date-val').value = val;
      document.getElementById('act-date-display').textContent = val;
      _closeDtp();
    }

    function _openAdminSearch() {
      if (document.getElementById('act-admin-overlay')) return;
      const ov = document.createElement('div');
      ov.id = 'act-admin-overlay';
      ov.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:10000;display:flex;align-items:center;justify-content:center;';
      ov.innerHTML = `
        <div style="background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.18);width:360px;max-height:420px;display:flex;flex-direction:column;overflow:hidden;">
          <div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;">

    function _filterAdminList() {

            <span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#E3F2FD;color:#1976D2;font-size:12px;font-weight:600;text-align:center;line-height:28px;">${n.charAt(0)}</span>
            <span>${n}</span>
            <span style="font-size:11px;color:#9E9E9E;margin-left:auto;">관리자</span>
          </div>`).join('');
    }

      const inp = document.getElementById('act-admin');
      if (inp) inp.value = name;
      _closeAdminSearch();

      const ov = document.getElementById('act-admin-overlay');

    function openActionModal() {
      _initDtp();
      modalSuggestions = [...activeSuggestions];
      const filterLines = getFilterSummary();
      const filterHtml = filterLines.map(l => `<div style="font-size:13px;padding:2px 0;"><span style="color:#9E9E9E;font-weight:400;">${l.label}</span> <span style="margin:0 4px;color:#BDBDBD;">›</span> <span style="font-weight:500;color:#424242;">${l.value}</span></div>`).join('');
      const userName = typeof AICC_Auth !== 'undefined' ? AICC_Auth.getCurrentUser().name : '관리자';

      const statusOpts = ['미이행','진행중','완료'].map(s =>
        `<option${s === '미이행' ? ' selected' : ''}>${s}</option>`
      ).join('');

      const body = `
        <div style="display:flex;gap:0;height:100%;">
          <div style="flex:1;padding:20px;border-right:1px solid #EEEEEE;display:flex;flex-direction:column;max-height:520px;overflow-y:auto;">
            <div style="font-size:14px;font-weight:700;color:#212121;margin-bottom:16px;">개선 제안 정보</div>
            <div style="margin-bottom:12px;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">조건</div>
              <div>${filterHtml}</div>
            </div>
            <div style="margin-bottom:12px;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">검색 결과</div>
              <div style="font-size:13px;font-weight:500;">${filteredEvals.length}건</div>
            </div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                <div style="font-size:11px;color:#9E9E9E;">개선 제안 내용</div>
                <button class="btn btn-sm" onclick="_showAddInput()" style="border:1px solid #D1C4E9;background:#fff;color:#5E35B1;font-size:11px;padding:2px 10px;">+ 추가</button>
              </div>
              <div id="act-suggestions-box" style="font-size:13px;line-height:1.6;background:#F9F9F9;border-radius:6px;padding:12px;border:1px solid #EEEEEE;"></div>
            </div>
          </div>
          <div style="flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:520px;overflow-y:auto;overflow-x:visible;">
            <div style="font-size:14px;font-weight:700;color:#212121;">처리 관리</div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">조치 날짜</div>
              <div id="act-date-trigger" class="form-input" style="width:203px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="_toggleDtp()">
                <span id="act-date-display">${_getNow()}</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" stroke="#9E9E9E" stroke-width="1.2"/><path d="M1.5 6h13" stroke="#9E9E9E" stroke-width="1.2"/><path d="M5 1v3M11 1v3" stroke="#9E9E9E" stroke-width="1.2" stroke-linecap="round"/></svg>
              </div>
              <input type="hidden" id="act-date-val" value="${_getNow()}">
            </div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">담당자</div>
              <div style="display:flex;gap:6px;">
                <input type="text" id="act-admin" class="form-input" style="width:203px;" value="${userName}" onfocus="this.select()">
                <button class="btn btn-sm" onclick="_openAdminSearch()" style="white-space:nowrap;border:1px solid #D8DAE5;background:#fff;color:#424242;">검색</button>
              </div>
            </div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">이행 상태</div>
              <select id="act-status" class="form-select" style="width:203px;">${statusOpts}</select>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">처리 메모</div>
              <textarea id="act-memo" class="form-input" style="flex:1;min-height:80px;resize:none;" placeholder="처리 내용을 입력하세요"></textarea>
              <div style="display:flex;justify-content:flex-end;margin-top:8px;">
                <button class="btn btn-primary btn-sm" onclick="saveAction()">저장</button>
              </div>
            </div>
          </div>
        </div>`;

      AICC_Modal.open({
        title: '조치 등록 — 개선 제안',
        content: body,
        size: 'xl'
      });
      _renderSuggestionItems();
    }

    let modalSuggestions = [];

    function _renderSuggestionItems() {
      const box = document.getElementById('act-suggestions-box');
      if (!box) return;
      box.innerHTML = modalSuggestions.map((c, i) => `
        <div style="display:flex;align-items:flex-start;gap:6px;padding:3px 0;">
          <span style="flex:1;color:#424242;">${i+1}. ${c}</span>
          <span onclick="_removeSuggestionItem(${i})" style="cursor:pointer;color:#BDBDBD;font-size:16px;line-height:1;flex-shrink:0;padding:0 2px;transition:color 0.15s;" onmouseenter="this.style.color='#F44336'" onmouseleave="this.style.color='#BDBDBD'">&times;</span>
        </div>
      `).join('');
    }

    function _removeSuggestionItem(idx) {
      if (modalSuggestions.length <= 1) { AICC_Toast.show('최소 1개의 개선 제안이 필요합니다.'); return; }
      modalSuggestions.splice(idx, 1);
      _renderSuggestionItems();
    }

    function _showAddInput() {
      const box = document.getElementById('act-suggestions-box');
      if (!box || document.getElementById('act-new-suggestion-row')) return;
      const row = document.createElement('div');
      row.id = 'act-new-suggestion-row';
      row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:6px 0 0;';
      row.innerHTML = `
        <input type="text" id="act-new-suggestion-input" class="form-input" style="flex:1;font-size:12px;padding:4px 8px;" placeholder="개선 제안 내용을 입력하세요">
        <button class="btn btn-sm" onclick="_confirmAddItem()" style="white-space:nowrap;background:#5E35B1;color:#fff;border:none;font-size:11px;padding:4px 10px;">확인</button>`;
      box.appendChild(row);
      document.getElementById('act-new-suggestion-input').focus();
    }

    function _confirmAddItem() {
      const input = document.getElementById('act-new-suggestion-input');
      if (!input || !input.value.trim()) { AICC_Toast.show('내용을 입력해주세요.'); return; }
      modalSuggestions.push(input.value.trim());
      _renderSuggestionItems();
    }

    function saveAction() {
      const actionDate = document.getElementById('act-date-val').value;
      if (!actionDate) { AICC_Toast.show('조치 날짜를 선택해주세요.'); return; }
      const adminName = document.getElementById('act-admin').value.trim();
      if (!adminName) { AICC_Toast.show('담당자를 입력해주세요.'); return; }
      const status = document.getElementById('act-status').value;
      const memo = document.getElementById('act-memo').value.trim();
      if (!memo) { AICC_Toast.show('처리 메모를 입력해주세요.'); return; }

      const filterSummary = getFilterSummaryText();
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

      const newItem = {
        reportType: filterSummary,
        periodFrom: todayStr,
        periodTo: todayStr,
        contents: [...modalSuggestions],
        admin: adminName,
        status: status,
        completedDate: status === '완료' ? todayStr : '-',
        history: [{
          date: actionDate,
          author: adminName,
          status: status,
          memo: memo
        }]
      };

      const stored = JSON.parse(localStorage.getItem('AICC_IMPROVEMENT_ITEMS') || '[]');
      stored.push(newItem);
      localStorage.setItem('AICC_IMPROVEMENT_ITEMS', JSON.stringify(stored));

      AICC_Modal.close();
      AICC_Toast.show('조치가 등록되었습니다. 개선 이행 관리에서 확인할 수 있습니다.');
    }

    // iframe(detail-analysis.html)에서 모달을 열 때 전체 화면 오버레이 처리
    let _iframeOrigStyle = null;
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      const iframe = document.getElementById('detail-iframe');
      if (!iframe) return;

      if (e.data.type === 'da-modal-expand') {
        if (document.getElementById('da-parent-backdrop')) return;
        _iframeModalActive = true;
        const backdrop = document.createElement('div');
        backdrop.id = 'da-parent-backdrop';
        backdrop.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:9998;';
        document.body.appendChild(backdrop);
        _iframeOrigStyle = iframe.style.cssText;
        iframe.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:9999;border:none;';
      }

      if (e.data.type === 'da-modal-restore') {
        setTimeout(function() {
          _iframeModalActive = false;
          var bd = document.getElementById('da-parent-backdrop');
          if (bd) bd.remove();
          if (_iframeOrigStyle !== null) {
            iframe.style.cssText = _iframeOrigStyle;
            _iframeOrigStyle = null;
          }
        }, 220);
      }
    });
  </script>
</body>
</html>
