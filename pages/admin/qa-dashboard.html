<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>QA 대시보드 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 페이지 제목 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">QA 대시보드</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">실시간 품질 모니터링</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="period-picker-container"></div>
        <select class="form-select" id="ws-filter" onchange="filterDashboard()">
          <option value="all">전체 센터</option>
        </select>
        <select class="form-select" id="team-filter" onchange="filterDashboard()" disabled>
          <option value="all">전체 팀</option>
        </select>
      </div>
    </div>

    <!-- KPI 카드 4개 -->
    <div style="display:grid;grid-template-columns:0.7fr 1.3fr 1.3fr 0.7fr;gap:16px;margin-bottom:20px;" id="kpi-cards">
      <!-- JS로 동적 생성 -->
    </div>

    <!-- 차트 영역 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
      <!-- 품질 추세 차트 -->
      <div class="content-card">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;" id="trend-title">품질 추세</span>
        </div>
        <div class="content-card-body" style="height:280px;">
          <canvas id="trend-chart"></canvas>
        </div>
      </div>
      <!-- 팀/채널 비중 -->
      <div class="content-card">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">팀별 평균 점수</span>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-sm btn-secondary channel-btn active" onclick="setChannel(this,'all')">전체</button>
            <button class="btn btn-sm btn-secondary channel-btn" onclick="setChannel(this,'IB')">I/B</button>
            <button class="btn btn-sm btn-secondary channel-btn" onclick="setChannel(this,'OB')">O/B</button>
          </div>
        </div>
        <div class="content-card-body" style="height:280px;">
          <canvas id="team-chart"></canvas>
        </div>
      </div>
    </div>

    <!-- 하단: 긴급이슈 + 점수분포 + 감점항목Top5 + 감점콜Top5 -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
      <!-- 관리자 확인 영역 -->
      <div class="content-card">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">관리자 확인 영역</span>
          <span class="badge badge-pending" id="issue-count" style="font-size:14px;padding:4px 12px;">0건</span>
        </div>
        <div class="content-card-body" id="issue-list" style="min-height:150px;">
        </div>
      </div>

      <!-- 점수 분포 (세로 배치) -->
      <div class="content-card">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">점수 분포</span>
        </div>
        <div class="content-card-body" style="display:flex;align-items:center;gap:24px;">
          <div style="width:160px;height:160px;flex-shrink:0;">
            <canvas id="distribution-chart"></canvas>
          </div>
          <div id="distribution-legend" style="flex:1;min-width:0;font-size:11px;white-space:nowrap;">
          </div>
        </div>
      </div>

      <!-- 최다 감점 항목 Top 5 -->
      <div class="content-card">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">최다 감점 항목 Top 5</span>
        </div>
        <div class="content-card-body" id="deduction-items-list" style="min-height:150px;">
        </div>
      </div>

      <!-- 최다 감점 콜 Top 5 -->
      <div class="content-card">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">최다 감점 콜 Top 5</span>
        </div>
        <div class="content-card-body" id="deduction-calls-list" style="min-height:150px;">
        </div>
      </div>
    </div>

    <!-- 팀별 평가 현황 간소 테이블 -->
    <div class="content-card" style="margin-top:16px;">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">팀별 평가 현황</span>
        <a href="integrated-evaluation.html" style="font-size:12px;color:#00A3FF;text-decoration:none;">상세 보기 &rarr;</a>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table" style="table-layout:fixed;">
          <colgroup>
            <col style="width:12%">
            <col style="width:14%">
            <col style="width:14%">
            <col style="width:14%">
            <col style="width:12%">
            <col style="width:34%">
          </colgroup>
          <thead>
            <tr>
              <th>센터</th>
              <th>팀</th>
              <th>상담 건수</th>
              <th>평가 건수</th>
              <th>평균 점수</th>
              <th class="col-left">이슈</th>
            </tr>
          </thead>
          <tbody id="team-tbody">
            <!-- JS로 동적 생성 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/period-picker.js"></script>
  <script>
    let dashboardData = null;
    let trendChart = null;
    let teamChart = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await loadDashboard();

      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function(periodType, info) { applyPeriod(periodType, info); }
      });
    });

    let centersData = null;

    /* 선택 월의 1일~말일 전체 데이터 생성 */
    function generateMonthTrendData(year, month) {
      const daysInMonth = new Date(year, month, 0).getDate();
      const result = [];
      for (let d = 1; d <= daysInMonth; d++) {
        const mm = String(month).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        result.push({
          date: `${mm}/${dd}`,
          fullDate: `${year}-${mm}-${dd}`,
          score: Math.round((80 + Math.random() * 8) * 10) / 10
        });
      }
      return result;
    }

    async function loadDashboard() {
      const data = await AICC_DataLoader.loadAll([
        'dashboard-stats.json',
        'centers.json'
      ]);

      dashboardData = data['dashboard-stats.json'];
      centersData = data['centers.json'];

      if (!dashboardData) {
        document.getElementById('kpi-cards').innerHTML = '<p style="color:#757575;grid-column:span 4;text-align:center;padding:40px;">데이터를 불러올 수 없습니다.</p>';
        return;
      }

      const now = new Date();
      dashboardData.quality_trend_monthly = generateMonthTrendData(now.getFullYear(), now.getMonth() + 1);

      if (centersData) {
        const wsSelect = document.getElementById('ws-filter');
        centersData.forEach(ws => {
          wsSelect.innerHTML += `<option value="${ws.id}">${ws.name}</option>`;
        });
      }

      renderAllWidgets();
    }

    function renderAllWidgets() {
      const cfg = periodConfig[currentPeriod || 'monthly'];
      renderKPICards(dashboardData.summary, cfg);
      renderTrendChart(dashboardData.quality_trend_monthly);
      renderTeamChart(dashboardData.team_scores);
      renderIssues(dashboardData.urgent_issues);
      renderDistribution();
      renderDeductionItems(dashboardData.improvement_needed_top5);
      renderDeductionCalls(dashboardData.fail_agents);
      renderTeamTable(dashboardData.teams);
    }

    let currentPeriod = 'monthly';

    // 기간 설정에 따라 KPI 라벨과 비교 기준을 동적으로 변경하여 하나의 함수로 모든 기간 유형을 처리
    function renderKPICards(summary, cfg) {
      const prefix = cfg ? cfg.kpiPrefix : '금일';
      const prevLabel = cfg ? cfg.prevLabel : '전일';
      const cards = [
        { label: `${prefix} 평가 상담사 수`, value: AICC_Fmt.number(summary.total_agents), prev: summary.total_agents_prev, current: summary.total_agents, unit: '명', prevLabel },
        { label: `${prefix} 평가 건수`, value: AICC_Fmt.number(summary.total_calls), prev: summary.total_calls_prev, current: summary.total_calls, unit: '건', prevLabel,
          isCallBreakdown: true,
          autoIB: summary.calls_auto_ib, autoIB_done: summary.calls_auto_ib_done,
          autoOB: summary.calls_auto_ob, autoOB_done: summary.calls_auto_ob_done,
          manual: summary.calls_manual, manual_done: summary.calls_manual_done,
          autoIB_prev: summary.calls_auto_ib_prev, autoIB_done_prev: summary.calls_auto_ib_done_prev,
          autoOB_prev: summary.calls_auto_ob_prev, autoOB_done_prev: summary.calls_auto_ob_done_prev,
          manual_prev: summary.calls_manual_prev, manual_done_prev: summary.calls_manual_done_prev },
        { label: '평균 평가 점수', value: AICC_Fmt.score(summary.avg_score), prev: summary.avg_score_prev, current: summary.avg_score, unit: '점', prevLabel,
          isScoreBreakdown: true,
          scoreIB: summary.avg_score_auto_ib, scoreIB_prev: summary.avg_score_auto_ib_prev,
          scoreOB: summary.avg_score_auto_ob, scoreOB_prev: summary.avg_score_auto_ob_prev,
          scoreManual: summary.avg_score_manual, scoreManual_prev: summary.avg_score_manual_prev },
        { label: '상담사 평균 통화시간', value: summary.avg_duration, prev: summary.avg_duration_prev, current: summary.avg_duration, unit: '', isDuration: true, prevLabel }
      ];

      const container = document.getElementById('kpi-cards');
      container.innerHTML = cards.map(card => {
        let trendHtml = '';
        if (card.isDuration) {
          const toSec = (s) => { const p = s.split(':'); return parseInt(p[0])*60 + parseInt(p[1]); };
          const cur = toSec(card.current), prev = toSec(card.prev);
          const diffSec = cur - prev;
          if (diffSec !== 0) {
            const arrow = diffSec < 0 ? '↓' : '↑';
            const color = diffSec < 0 ? '#4CAF50' : '#F44336';
            const absDiff = Math.abs(diffSec);
            const m = Math.floor(absDiff / 60), s = absDiff % 60;
            trendHtml = `<span style="font-size:12px;color:${color};">${arrow} ${m > 0 ? m + '분 ' : ''}${s}초</span>`;
          }
        } else {
          trendHtml = AICC_Fmt.trend(card.current, card.prev);
        }
        const scoreColor = card.isScore ? `color:${AICC_Fmt.scoreColor(card.current)}` : '';

        if (card.isCallBreakdown) {
          const pct = (done, total) => total > 0 ? Math.round(done / total * 100) : 0;
          const bd = [
            { label: '자동/IB', total: card.autoIB, done: card.autoIB_done, totalPrev: card.autoIB_prev, donePrev: card.autoIB_done_prev, url: 'integrated-evaluation.html?method=auto&type=IB' },
            { label: '자동/OB', total: card.autoOB, done: card.autoOB_done, totalPrev: card.autoOB_prev, donePrev: card.autoOB_done_prev, url: 'integrated-evaluation.html?method=auto&type=OB' },
            { label: '수동',    total: card.manual,  done: card.manual_done, totalPrev: card.manual_prev, donePrev: card.manual_done_prev, url: 'manual-evaluation-status.html' }
          ];
          const maxNum = Math.max(...bd.map(b => Math.max(b.total, b.done)));
          const curFs = maxNum >= 100000 ? 9 : maxNum >= 10000 ? 10 : 12;
          const prevMax = Math.max(...bd.map(b => Math.max(b.totalPrev, b.donePrev)));
          const prevFs = prevMax >= 100000 ? 8 : prevMax >= 10000 ? 9 : 10;
          const cols = bd.map(b => {
            const numPart = `<span style="white-space:nowrap;"><span style="color:#42A5F5;">${AICC_Fmt.number(b.total)}</span> <span style="color:#BDBDBD;">/</span> <span style="color:#424242;font-weight:600;">${AICC_Fmt.number(b.done)}건</span></span>`;
            const pctPart = `<span style="color:#424242;font-weight:600;">(${pct(b.done, b.total)}%)</span>`;
            const prevNumPart = `<span style="white-space:nowrap;"><span style="color:#90CAF9;">${AICC_Fmt.number(b.totalPrev)}</span> <span style="color:#D5D5D5;">/</span> <span style="color:#BDBDBD;">${AICC_Fmt.number(b.donePrev)}건</span></span>`;
            const prevPctPart = `<span style="color:#BDBDBD;">(${pct(b.donePrev, b.totalPrev)}%)</span>`;
            return `<div onclick="window.location.href='${b.url}'" style="cursor:pointer;text-align:center;padding:4px 2px;border-radius:4px;transition:background 0.15s;" onmouseenter="this.style.background='#F5F5F5'" onmouseleave="this.style.background=''">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">${b.label}</div>
              <div style="font-size:${curFs}px;">${numPart}<br>${pctPart}</div>
              <div style="font-size:${prevFs}px;margin-top:4px;">${prevNumPart}<br>${prevPctPart}</div>
            </div>`;
          }).join('');
          return `
          <div class="kpi-card">
            <div style="display:flex;align-items:flex-start;gap:12px;">
              <div style="flex-shrink:0;">
                <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
                <div style="display:flex;align-items:baseline;gap:8px;">
                  <span style="font-size:28px;font-weight:700;">${card.value}</span>
                  ${trendHtml}
                </div>
                <div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div>
              </div>
              <div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:2px;">
                ${cols}
              </div>
            </div>
          </div>
          `;
        }

        if (card.isScoreBreakdown) {
          const scoreToRange = (s) => s >= 90 ? 'excellent' : s >= 80 ? 'good' : s >= 70 ? 'caution' : 'low';
          const sb = [
            { label: '자동/IB', score: card.scoreIB, scorePrev: card.scoreIB_prev, url: `integrated-evaluation.html?method=auto&type=IB&score_range=${scoreToRange(card.scoreIB)}` },
            { label: '자동/OB', score: card.scoreOB, scorePrev: card.scoreOB_prev, url: `integrated-evaluation.html?method=auto&type=OB&score_range=${scoreToRange(card.scoreOB)}` },
            { label: '수동',    score: card.scoreManual, scorePrev: card.scoreManual_prev, url: `manual-evaluation-status.html?score_range=${scoreToRange(card.scoreManual)}` }
          ];
          const sCols = sb.map(s => `<div onclick="window.location.href='${s.url}'" style="cursor:pointer;text-align:center;padding:4px 2px;border-radius:4px;transition:background 0.15s;" onmouseenter="this.style.background='#F5F5F5'" onmouseleave="this.style.background=''">
            <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">${s.label}</div>
            <div style="font-size:12px;font-weight:600;white-space:nowrap;color:#424242;">${AICC_Fmt.score(s.score)}점</div>
            <div style="font-size:10px;white-space:nowrap;color:#BDBDBD;margin-top:4px;">${AICC_Fmt.score(s.scorePrev)}점</div>
          </div>`).join('');
          return `
          <div class="kpi-card">
            <div style="display:flex;align-items:flex-start;gap:12px;">
              <div style="flex-shrink:0;">
                <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
                <div style="display:flex;align-items:baseline;gap:8px;">
                  <span style="font-size:28px;font-weight:700;${scoreColor}">${card.value}</span>
                  ${trendHtml}
                </div>
                <div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel}: ${AICC_Fmt.number(card.prev)}${card.unit}</div>
              </div>
              <div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:2px;">
                ${sCols}
              </div>
            </div>
          </div>
          `;
        }

        return `
          <div class="kpi-card">
            <div style="font-size:12px;color:#757575;margin-bottom:8px;">${card.label}</div>
            <div style="display:flex;align-items:baseline;gap:8px;">
              <span style="font-size:28px;font-weight:700;${scoreColor}">${card.value}</span>
              ${trendHtml}
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:8px;">${card.prevLabel || '전일'}: ${typeof card.prev === 'number' ? AICC_Fmt.number(card.prev) : card.prev}${card.unit}</div>
          </div>
        `;
      }).join('');
    }

    // 기존 차트 인스턴스를 파괴 후 재생성하여 기간 전환 시 차트가 중복되지 않게 함
    function renderTrendChart(trendData) {
      const ctx = document.getElementById('trend-chart');
      if (!ctx) return;

      const trendLabels = trendData.map(d => d.date);
      if (trendChart) trendChart.destroy();
      const lineLabelPlugin = {
        id: 'lineDataLabels',
        afterDatasetsDraw(chart) {
          const { ctx: c } = chart;
          chart.data.datasets.forEach((ds, dsIdx) => {
            const meta = chart.getDatasetMeta(dsIdx);
            const total = meta.data.length;
            meta.data.forEach((pt, i) => {
              if (total >= 20 && i % 2 !== 0) return;
              const val = ds.data[i];
              c.save();
              c.font = '600 10px sans-serif';
              c.fillStyle = '#424242';
              c.textAlign = 'center';
              c.fillText(val.toFixed(1), pt.x, pt.y - 10);
              c.restore();
            });
          });
        }
      };
      trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: trendLabels,
          datasets: [{
            label: '평균 QA 점수',
            data: trendData.map(d => d.score),
            borderColor: '#00A3FF',
            backgroundColor: 'rgba(15,118,110,0.1)',
            borderWidth: 2,
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointHoverRadius: 5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          onClick: (evt, elements) => {
            if (elements.length > 0) {
              const idx = elements[0].index;
              const fullDate = trendData[idx].fullDate;
              window.location.href = `integrated-evaluation.html?date=${encodeURIComponent(fullDate)}${getWsParam()}`;
            }
          },
          onHover: (evt, elements) => {
            evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
          },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          scales: {
            y: {
              min: 70,
              max: 95,
              grid: { color: '#F0F0F0' },
              ticks: { font: { size: 11 }, color: '#757575' }
            },
            x: {
              grid: { display: false },
              ticks: {
                font: { size: 10 }, color: '#757575',
                maxTicksLimit: 16,
                autoSkip: true,
                maxRotation: 0
              }
            }
          }
        },
        plugins: [lineLabelPlugin]
      });
    }

    // 점수 구간별(80+/60+/미만) 색상을 다르게 적용하여 팀 성과를 직관적으로 구분
    function renderTeamChart(teamScores) {
      const ctx = document.getElementById('team-chart');
      if (!ctx) return;

      if (teamChart) teamChart.destroy();
      const teamNames = teamScores.map(t => t.team);
      const barLabelPlugin = {
        id: 'barDataLabels',
        afterDatasetsDraw(chart) {
          const { ctx: c } = chart;
          chart.data.datasets.forEach((ds, dsIdx) => {
            const meta = chart.getDatasetMeta(dsIdx);
            meta.data.forEach((bar, i) => {
              const val = ds.data[i];
              c.save();
              c.font = '600 11px sans-serif';
              c.fillStyle = '#424242';
              c.textAlign = 'center';
              c.fillText(val.toFixed(1), bar.x, bar.y - 8);
              c.restore();
            });
          });
        }
      };
      teamChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: teamNames,
          datasets: [{
            label: '평균 점수',
            data: teamScores.map(t => t.score),
            backgroundColor: teamScores.map(t => t.score >= 80 ? 'rgba(76,175,80,0.7)' : t.score >= 60 ? 'rgba(255,193,7,0.7)' : 'rgba(244,67,54,0.7)'),
            borderColor: teamScores.map(t => t.score >= 80 ? '#4CAF50' : t.score >= 60 ? '#FFC107' : '#F44336'),
            borderWidth: 1,
            borderRadius: 4,
            barThickness: 40
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          onClick: (evt, elements) => {
            if (elements.length > 0) {
              const idx = elements[0].index;
              const clickedTeam = teamNames[idx];
              const teamInfo = dashboardData.teams.find(t => t.team === clickedTeam);
              const centerName = teamInfo ? teamInfo.center : '';
              window.location.href = `integrated-evaluation.html?tab=detail&ct=${encodeURIComponent(centerName)}&team=${encodeURIComponent(clickedTeam)}`;
            }
          },
          onHover: (evt, elements) => {
            evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
          },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          scales: {
            y: {
              min: 0,
              max: 100,
              grid: { color: '#F0F0F0' },
              ticks: { font: { size: 11 }, color: '#757575' }
            },
            x: {
              grid: { display: false },
              ticks: { font: { size: 11 }, color: '#757575' }
            }
          }
        },
        plugins: [barLabelPlugin]
      });
    }

    function getIssuePageUrl(issue) {
      if (issue.type.includes('FAIL')) return 'integrated-evaluation.html?issue=fail';
      if (issue.type.includes('기준 미달')) return 'integrated-evaluation.html?issue=under';
      if (issue.type.includes('이의 제기')) return 'dispute-inbox.html?status=pending';
      return 'integrated-evaluation.html';
    }

    // FAIL 이슈와 일반 이슈를 시각적으로 구분(색상/아이콘)하여 긴급도를 즉시 파악 가능하게 함
    function renderIssues(issues) {
      const container = document.getElementById('issue-list');
      const countEl = document.getElementById('issue-count');

      let totalCount = issues.reduce((sum, i) => sum + (i.count || 1), 0);
      countEl.textContent = totalCount + '건';

      container.innerHTML = issues.map(issue => {
        const isUrgent = issue.type.includes('FAIL');
        const textColor = isUrgent ? '#C62828' : '#F57F17';
        const dotColor = isUrgent ? '#F44336' : '#FFC107';
        const pageUrl = getIssuePageUrl(issue);

        let detail = '';
        if (issue.agent) detail = `${issue.team} / ${issue.agent}`;
        else if (issue.team) detail = issue.team;
        else detail = `${issue.count}건 처리 대기`;

        return `
          <div onclick="window.location.href='${pageUrl}'" style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F0F0F0;cursor:pointer;transition:background 0.15s;" onmouseenter="this.style.background='#FAFAFA'" onmouseleave="this.style.background=''">
            <span style="width:8px;height:8px;border-radius:50%;background:${dotColor};flex-shrink:0;"></span>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:500;color:${textColor};">${issue.type} ${issue.count || ''}건</div>
              <div style="font-size:11px;color:#757575;">${detail}</div>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="2" style="flex-shrink:0;"><path d="m9 18 6-6-6-6"/></svg>
          </div>
        `;
      }).join('');
    }

    let distChart = null;
    // 외부에서 분포 데이터를 주입할 수 있게 하여 기간 전환 시에도 차트를 갱신할 수 있게 설계
    function renderDistribution(customDist) {
      const dist = customDist || { excellent: 32, good: 41, caution: 18, poor: 9 };
      const total = dist.excellent + dist.good + dist.caution + dist.poor;

      const segments = [
        { label: '우수 (90점 이상)',  value: dist.excellent, color: '#4CAF50', pct: Math.round(dist.excellent / total * 100) },
        { label: '양호 (80~89점)',   value: dist.good,      color: '#2196F3', pct: Math.round(dist.good / total * 100) },
        { label: '주의 (70~79점)',   value: dist.caution,   color: '#FFC107', pct: Math.round(dist.caution / total * 100) },
        { label: '미달 (70점 미만)', value: dist.poor,      color: '#F44336', pct: Math.round(dist.poor / total * 100) }
      ];

      const ctx = document.getElementById('distribution-chart');
      if (!ctx) return;
      if (distChart) distChart.destroy();
      distChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: segments.map(s => s.label),
          datasets: [{
            data: segments.map(s => s.value),
            backgroundColor: segments.map(s => s.color),
            borderWidth: 2,
            borderColor: '#fff'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          cutout: '60%',
          onHover: (evt, elements) => {
            evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
          },
          plugins: { legend: { display: false } }
        }
      });

      const scoreRangeMap = { '우수': 'excellent', '양호': 'good', '주의': 'caution', '미달': 'low' };
      document.getElementById('distribution-legend').innerHTML = segments.map(s => {
        const rangeKey = Object.keys(scoreRangeMap).find(k => s.label.includes(k)) || '';
        const linkUrl = `integrated-evaluation.html?score_range=${scoreRangeMap[rangeKey] || ''}${getWsParam()}`;
        return `
        <div onclick="window.location.href='${linkUrl}'" style="display:flex;align-items:center;gap:10px;padding:3px 0;cursor:pointer;transition:background 0.15s;" onmouseenter="this.style.background='#FAFAFA'" onmouseleave="this.style.background=''">
          <span style="width:8px;height:8px;border-radius:2px;background:${s.color};flex-shrink:0;"></span>
          <span style="font-size:11px;color:#424242;flex:1;">${s.label}</span>
          <span style="font-size:11px;font-weight:600;color:#424242;min-width:36px;text-align:right;">${s.value}건</span>
          <span style="font-size:11px;font-weight:600;color:#424242;min-width:32px;text-align:right;">${s.pct}%</span>
        </div>`;
      }).join('');

      // 도넛 차트 세그먼트 클릭 시에도 해당 점수 구간으로 이동
      const rangeKeys = ['excellent', 'good', 'caution', 'low'];
      distChart.options.onClick = (evt, elements) => {
        if (elements.length > 0) {
          const idx = elements[0].index;
          window.location.href = `integrated-evaluation.html?score_range=${rangeKeys[idx]}${getWsParam()}`;
        }
      };
    }

    function renderDeductionItems(items) {
      const container = document.getElementById('deduction-items-list');
      if (!container || !items) return;
      const totalCalls = (dashboardData && dashboardData.summary && dashboardData.summary.total_calls) || 1;
      container.innerHTML = items.slice(0, 5).map((item, i) => {
        const pct = Math.round(item.calls / totalCalls * 100);
        const linkUrl = `integrated-evaluation.html?deduction=${encodeURIComponent(item.item_id)}&team=${encodeURIComponent(item.team_id)}${getWsParam()}`;
        return `
          <div onclick="window.location.href='${linkUrl}'" style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;transition:background 0.15s;${i < 4 ? 'border-bottom:1px solid #F0F0F0;' : ''}" onmouseenter="this.style.background='#FAFAFA'" onmouseleave="this.style.background=''">
            <span style="width:18px;height:18px;border-radius:4px;background:${item.status === 'danger' ? '#FFEBEE' : '#FFF8E1'};color:${item.status === 'danger' ? '#C62828' : '#F57F17'};font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${i + 1}</span>
            <div style="flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;">
              <span style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><span style="font-weight:500;">${item.item}</span> <span style="color:#9E9E9E;font-size:11px;margin-left:6px;">(${item.category})</span></span>
              <span style="font-size:13px;font-weight:500;color:#424242;flex-shrink:0;margin-left:8px;white-space:nowrap;">${item.calls}건&nbsp;&nbsp;&nbsp;${pct}%</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderDeductionCalls(agents) {
      const container = document.getElementById('deduction-calls-list');
      if (!container || !agents) return;
      const sorted = [...agents].sort((a, b) => a.score - b.score).slice(0, 5);
      container.innerHTML = sorted.map((agent, i) => {
        const scoreColor = AICC_Fmt.scoreColor(agent.score);
        const linkUrl = `integrated-evaluation.html?tab=detail&ct=${encodeURIComponent(agent.center || '')}&team=${encodeURIComponent(agent.team)}&agent=${encodeURIComponent(agent.name)}`;
        return `
          <div onclick="window.location.href='${linkUrl}'" style="display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;transition:background 0.15s;${i < sorted.length - 1 ? 'border-bottom:1px solid #F0F0F0;' : ''}" onmouseenter="this.style.background='#FAFAFA'" onmouseleave="this.style.background=''">
            <span style="width:18px;height:18px;border-radius:4px;background:${agent.score < 60 ? '#FFEBEE' : '#FFF8E1'};color:${agent.score < 60 ? '#C62828' : '#F57F17'};font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${i + 1}</span>
            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <span style="font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${agent.center || ''} / ${agent.team} / ${agent.name}</span>
                <span style="font-size:13px;font-weight:600;color:${scoreColor};flex-shrink:0;margin-left:4px;">${agent.score}점</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderTeamTable(teams) {
      const tbody = document.getElementById('team-tbody');
      const wsId = document.getElementById('ws-filter').value;
      tbody.innerHTML = teams.map(team => {
        const issueHtml = team.issues.length > 0
          ? team.issues.map(i => `<span class="badge ${i.type.includes('FAIL') || i.type.includes('기준 미달') ? 'badge-rejected' : 'badge-pending'}" style="font-size:11px;">${i.type} ${i.count}건</span>`).join(' ')
          : '<span style="color:#9E9E9E;font-size:12px;">-</span>';

        const detailUrl = `integrated-evaluation.html?tab=detail&ct=${encodeURIComponent(team.center)}&team=${encodeURIComponent(team.team)}`;
        return `
          <tr style="cursor:pointer;" onclick="window.location.href='${detailUrl}'">
            <td style="font-size:12px;">${team.center}</td>
            <td style="font-size:12px;font-weight:500;">${team.team}</td>
            <td style="font-size:12px;">${AICC_Fmt.number(team.calls)}</td>
            <td style="font-size:12px;">${AICC_Fmt.number(team.evaluations)}</td>
            <td>${AICC_Fmt.scoreHtml(team.avg_score)}</td>
            <td class="col-left" style="font-size:12px;">${issueHtml}</td>
          </tr>
        `;
      }).join('');
    }

    // 채널(I/B, O/B) 전환 시 랜덤 변동값을 적용하여 필터링 효과를 시뮬레이션
    function setChannel(btn, channel) {
      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      // 채널 필터링 시뮬레이션 (같은 차트, 살짝 다른 데이터)
      if (dashboardData) {
        const scores = dashboardData.team_scores.map(t => ({
          ...t,
          score: channel === 'all' ? t.score : t.score + (Math.random() * 4 - 2)
        }));
        renderTeamChart(scores);
      }
    }

    const periodConfig = {
      daily:   { trendTitle: '품질 추세 (시간대별)',   kpiPrefix: '금일',    prevLabel: '전일' },
      weekly:  { trendTitle: '품질 추세 (최근 7일)',   kpiPrefix: '금주',    prevLabel: '전주' },
      monthly: { trendTitle: '품질 추세',  kpiPrefix: '금월',    prevLabel: '전월' },
      yearly:  { trendTitle: '품질 추세 (최근 12개월)', kpiPrefix: '금년',   prevLabel: '전년' },
      custom:  { trendTitle: '품질 추세 (사용자 지정)', kpiPrefix: '기간 내', prevLabel: '이전 기간' }
    };

    // 기간 유형별로 x축 라벨과 데이터 포인트 수를 다르게 생성
    function generateTrendData(period, info) {
      const base = 82;
      const variance = () => (Math.random() * 6 - 3);
      switch (period) {
        case 'daily':
          return Array.from({ length: 12 }, (_, i) => ({
            date: `${(8 + i).toString().padStart(2, '0')}:00`,
            score: Math.round((base + variance()) * 10) / 10
          }));
        case 'weekly':
          const days = ['월', '화', '수', '목', '금', '토', '일'];
          return days.map(d => ({ date: d, score: Math.round((base + variance()) * 10) / 10 }));
        case 'monthly': {
          const year = info && info.year ? info.year : new Date().getFullYear();
          const month = info && info.month ? info.month : new Date().getMonth() + 1;
          dashboardData.quality_trend_monthly = generateMonthTrendData(year, month);
          return dashboardData.quality_trend_monthly;
        }
        case 'yearly':
          const months = ['1월', '2월', '3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월'];
          return months.map(m => ({ date: m, score: Math.round((base + variance()) * 10) / 10 }));
        case 'custom':
          return Array.from({ length: 10 }, (_, i) => ({
            date: `D+${i + 1}`,
            score: Math.round((base + variance()) * 10) / 10
          }));
        default:
          return dashboardData.quality_trend_monthly;
      }
    }

    // 기간 배수(factor)를 적용하여 일/주/월/년별 KPI 수치를 현실적으로 스케일링
    function generateKPIVariation(period) {
      const s = dashboardData.summary;
      const factor = { daily: 1, weekly: 7, monthly: 30, yearly: 365, custom: 15 };
      const f = factor[period] || 1;
      const agentBase = period === 'daily' ? s.total_agents : Math.round(s.total_agents * (1 + Math.random() * 0.2));
      const callBase = period === 'daily' ? s.total_calls : Math.round(s.total_calls * f * (0.9 + Math.random() * 0.2));
      const agentPrev = period === 'daily' ? s.total_agents_prev : Math.round(agentBase * (0.93 + Math.random() * 0.1));
      const callPrev = period === 'daily' ? s.total_calls_prev : Math.round(callBase * (0.93 + Math.random() * 0.1));
      // 원본 비율을 기반으로 세분화 건수 + 진행 건수를 스케일링
      const ibRatio = s.calls_auto_ib / s.total_calls;
      const obRatio = s.calls_auto_ob / s.total_calls;
      const autoIB = Math.round(callBase * ibRatio);
      const autoOB = Math.round(callBase * obRatio);
      const manual = callBase - autoIB - autoOB;
      const doneRate = (done, total) => total > 0 ? done / total : 0.95;
      const autoIB_done = Math.round(autoIB * doneRate(s.calls_auto_ib_done, s.calls_auto_ib));
      const autoOB_done = Math.round(autoOB * doneRate(s.calls_auto_ob_done, s.calls_auto_ob));
      const manual_done = Math.round(manual * doneRate(s.calls_manual_done, s.calls_manual));
      const autoIB_prev = Math.round(callPrev * (s.calls_auto_ib_prev / s.total_calls_prev));
      const autoOB_prev = Math.round(callPrev * (s.calls_auto_ob_prev / s.total_calls_prev));
      const manual_prev = callPrev - autoIB_prev - autoOB_prev;
      const autoIB_done_prev = Math.round(autoIB_prev * doneRate(s.calls_auto_ib_done_prev, s.calls_auto_ib_prev));
      const autoOB_done_prev = Math.round(autoOB_prev * doneRate(s.calls_auto_ob_done_prev, s.calls_auto_ob_prev));
      const manual_done_prev = Math.round(manual_prev * doneRate(s.calls_manual_done_prev, s.calls_manual_prev));
      return {
        total_agents: agentBase, total_agents_prev: agentPrev,
        total_calls: callBase, total_calls_prev: callPrev,
        calls_auto_ib: autoIB, calls_auto_ib_done: autoIB_done, calls_auto_ib_prev: autoIB_prev, calls_auto_ib_done_prev: autoIB_done_prev,
        calls_auto_ob: autoOB, calls_auto_ob_done: autoOB_done, calls_auto_ob_prev: autoOB_prev, calls_auto_ob_done_prev: autoOB_done_prev,
        calls_manual: manual, calls_manual_done: manual_done, calls_manual_prev: manual_prev, calls_manual_done_prev: manual_done_prev,
        avg_score: s.avg_score, avg_score_prev: s.avg_score_prev,
        avg_score_auto_ib: s.avg_score_auto_ib, avg_score_auto_ib_prev: s.avg_score_auto_ib_prev,
        avg_score_auto_ob: s.avg_score_auto_ob, avg_score_auto_ob_prev: s.avg_score_auto_ob_prev,
        avg_score_manual: s.avg_score_manual, avg_score_manual_prev: s.avg_score_manual_prev,
        avg_duration: s.avg_duration, avg_duration_prev: s.avg_duration_prev
      };
    }


    // 기간 전환 시 분포 변화를 표현하기 위해 랜덤 데이터를 생성
    function generateDistribution() {
      const e = () => Math.round(10 + Math.random() * 40);
      const dist = { excellent: e(), good: e(), caution: Math.round(5 + Math.random() * 25), poor: Math.round(2 + Math.random() * 12) };
      return dist;
    }

    /* 현재 선택된 센터의 URL 파라미터 문자열 반환 */
    function getWsParam() {
      const wsId = document.getElementById('ws-filter').value;
      return wsId !== 'all' ? `&ws=${encodeURIComponent(wsId)}` : '';
    }

    function applyPeriod(period, info) {
      if (!dashboardData) return;
      currentPeriod = period;
      const cfg = periodConfig[period];
      document.getElementById('trend-title').textContent = cfg.trendTitle;

      const kpiData = generateKPIVariation(period);
      renderKPICards(kpiData, cfg);

      const trendData = generateTrendData(period, info);
      renderTrendChart(trendData);

      renderDistribution(generateDistribution());

      AICC_Toast.show(`${cfg.kpiPrefix} 데이터로 전환되었습니다.`);
    }

    /* 센터/팀 필터 변경 시 모든 위젯을 갱신 (A-009/A-011/A-017) */
    function filterDashboard() {
      const wsId = document.getElementById('ws-filter').value;
      const teamFilter = document.getElementById('team-filter');

      if (wsId === 'all') {
        teamFilter.disabled = true;
        teamFilter.innerHTML = '<option value="all">전체 팀</option>';
      } else {
        teamFilter.disabled = false;
        const center = centersData ? centersData.find(c => c.id === wsId) : null;
        teamFilter.innerHTML = '<option value="all">전체 팀</option>';
        if (center) {
          center.teams.forEach(t => {
            teamFilter.innerHTML += `<option value="${t.id}">${t.name}</option>`;
          });
        }
      }

      const teamId = teamFilter.value;
      let filteredTeams = dashboardData.teams;
      if (wsId !== 'all') {
        filteredTeams = filteredTeams.filter(t => t.center_id === wsId);
      }
      if (teamId !== 'all') {
        filteredTeams = filteredTeams.filter(t => t.team_id === teamId);
      }

      renderTeamTable(filteredTeams);

      const filteredScores = wsId === 'all'
        ? dashboardData.team_scores
        : dashboardData.team_scores.filter(t => {
            const teamData = filteredTeams.find(ft => ft.team === t.team);
            return !!teamData;
          });
      renderTeamChart(filteredScores.length > 0 ? filteredScores : dashboardData.team_scores);
      renderDistribution(generateDistribution());

      AICC_Toast.show('필터가 적용되었습니다.');
    }
  </script>
