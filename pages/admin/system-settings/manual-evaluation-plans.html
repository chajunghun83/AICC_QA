<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>수동 평가 계획 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">수동 평가 계획 관리</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">수동 평가 대상 선정 및 계획 관리</p>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()">+ 새 계획 추가</button>
    </div>

    <!-- 필터 -->
    <div class="filter-section">
      <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">계획명</label>
          <input type="text" class="form-input" id="plan-search" placeholder="계획명 검색" style="min-width:150px;">
        </div>
        <div>
          <label class="form-label">상태</label>
          <select class="form-select" id="plan-status-filter">
            <option value="all">전체</option>
            <option value="진행 중">진행 중</option>
            <option value="예정">예정</option>
            <option value="종료">종료</option>
          </select>
        </div>
        <div>
          <label class="form-label">반복 주기</label>
          <select class="form-select" id="repeat-filter">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">대상</label>
          <select class="form-select" id="target-search" style="min-width:120px;">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">담당자</label>
          <input type="text" class="form-input" id="assignee-search" placeholder="담당자명 검색" style="min-width:120px;">
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetPlanFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="applyPlanFilter()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">수동 평가 계획 목록</span>
        <span id="plan-count" style="font-size:12px;color:#757575;">총 4건</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:40px;">No</th>
              <th class="col-left">계획명</th>
              <th>적용 평가표</th>
              <th>평가기간</th>
              <th>반복 주기</th>
              <th>대상</th>
              <th>상세 조건</th>
              <th>담당자</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="plan-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../../assets/dummy-data/all-data.js"></script>
  <script src="../../../js/utils/data-loader.js"></script>
  <script src="../../../js/utils/auth-simulator.js"></script>
  <script src="../../../js/utils/formatters.js"></script>
  <script src="../../../js/components/sidebar.js"></script>
  <script src="../../../js/components/layout.js"></script>
  <script src="../../../js/components/modal.js"></script>
  <script src="../../../js/components/toast.js"></script>
  <script>
    let formsData = null;
    let evaluationsData = [];
    let consultTypeTree = {};
    let centersData = [
      { id: 'ws-seoul', name: '서울센터', teams: [
        { id: 'team-vip', name: 'VIP상담팀' },
        { id: 'team-general', name: '일반상담팀' },
        { id: 'team-tech', name: '기술지원팀' }
      ]},
      { id: 'ws-busan', name: '부산센터', teams: [
        { id: 'team-general2', name: '일반상담팀' },
        { id: 'team-happycall', name: '해피콜팀' }
      ]}
    ];
    let usersData = [];

    // 조건 유형별 라벨과 포맷터를 중앙 관리하여 테이블·상세 모달에서 일관된 표시 보장
    const CRITERIA_MAP = {
      workingDays:    { label: '근무일수 기준',   format: v => `${v.days}일 미만` },
      sampling:       { label: '샘플링 비율',     format: v => `${v.rate}%` },
      scoreThreshold: { label: 'AI 점수 기준',    format: v => `${v.score}점 미만` },
      confidence:     { label: 'AI 신뢰도 기준',  format: v => `${v.level} 이하` },
      specificAgents: { label: '특정 상담사 지정', format: v => (v.agents || []).join(', ') },
      consultType:    { label: '상담 유형',       format: v => v.depth === 'all' ? '전체' : `${v.depth}Depth - ${v.selected || '전체'}` },
      callSegment:    { label: '통화 구간 지정',  format: v => v.full ? '전체 구간' : `${v.start || '00:00'} ~ ${v.end || '끝'}` },
      durationRange:  { label: '통화 시간 범위',  format: v => `${v.min || 0}분 ~ ${v.max || '제한없음'}분` },
      callTimeRange:  { label: '상담 시간대',     format: v => `${v.start || '00:00'} ~ ${v.end || '23:59'}` },
      weekdays:       { label: '요일 필터',       format: v => (v.days || []).join(', ') || '전체' }
    };

    const plans = [
      {
        no: 1,
        name: '2025년 1분기 신입 상담사 수동 평가',
        periodStart: '2025-01-01',
        periodEnd: '2025-03-31',
        repeat: '매월',
        forms: ['표준 QA 평가표 v2.1'],
        target: '서울센터 > 전체',
        targetDetail: { center: '서울센터', teams: ['VIP상담팀', '일반상담팀', '기술지원팀'], inbound: true, outbound: true },
        criteriaType: 'workingDays',
        criteriaValue: { days: 30 },
        assignee: '박관리자',
        stats: { total: 45, completed: 32, pending: 13 }
      },
      {
        no: 2,
        name: '2025년 2월 품질 샘플링 검증',
        periodStart: '2025-02-01',
        periodEnd: '2025-02-28',
        repeat: '매월',
        forms: ['표준 QA 평가표 v2.1'],
        target: '서울센터 > VIP상담팀',
        targetDetail: { center: '서울센터', teams: ['VIP상담팀'], inbound: true, outbound: true },
        criteriaType: 'sampling',
        criteriaValue: { rate: 10 },
        assignee: '김팀장',
        stats: { total: 28, completed: 15, pending: 13 }
      },
      {
        no: 3,
        name: '2025년 2월 AI 저점수 재평가',
        periodStart: '2025-02-01',
        periodEnd: '2025-02-28',
        repeat: '1회성',
        forms: ['표준 QA 평가표 v2.1'],
        target: '서울센터 > 전체',
        targetDetail: { center: '서울센터', teams: ['VIP상담팀', '일반상담팀', '기술지원팀'], inbound: true, outbound: true },
        criteriaType: 'scoreThreshold',
        criteriaValue: { score: 60 },
        assignee: '이평가',
        stats: { total: 12, completed: 8, pending: 4 }
      },
      {
        no: 4,
        name: '특정 상담사 집중 모니터링',
        periodStart: '2025-01-15',
        periodEnd: '2025-03-31',
        repeat: '매월',
        forms: ['기술지원 전문 평가표'],
        target: '서울센터 > 기술지원팀',
        targetDetail: { center: '서울센터', teams: ['기술지원팀'], inbound: true, outbound: false },
        criteriaType: 'specificAgents',
        criteriaValue: { agents: ['최수진', '박상현'] },
        assignee: '박관리자',
        stats: { total: 67, completed: 52, pending: 15 }
      }
    ];

    // 기존 번호 최대값 기반으로 중복 없는 번호를 부여하기 위함
    function getNextNo() {
      return plans.length > 0 ? Math.max(...plans.map(p => p.no)) + 1 : 1;
    }

    /* ── 채널 체크박스 하이라이트 토글 ── */
    function toggleChannelHighlight(chk) {
      const label = chk.parentElement;
      if (chk.checked) {
        label.style.background = '#E3F2FD';
        label.style.border = '1px solid #00A3FF';
      } else {
        label.style.background = '';
        label.style.border = '1px solid transparent';
      }
    }

    /* ── 상태 자동 계산 ── */
    function computeStatus(plan) {
      if (plan.draft) return { status: 'pending', text: '초안' };
      const today = new Date().toISOString().slice(0, 10);
      if (today < plan.periodStart) return { status: 'pending', text: '예정' };
      if (plan.periodEnd && today > plan.periodEnd) return { status: 'completed', text: '종료' };
      // 1회성 계획은 종료일이 없으므로 시작일 경과 시 자동 종료 처리
      if (!plan.periodEnd && plan.repeat === '1회성' && today > plan.periodStart) return { status: 'completed', text: '종료' };
      return { status: 'active', text: '진행 중' };
    }

    // 상태값을 CSS 클래스로 매핑하여 badge 스타일 일관성 유지
    function statusBadge(status, text) {
      const cls = { active: 'badge-active', pending: 'badge-pending', completed: 'badge-inactive' };
      return `<span class="badge ${cls[status] || 'badge-pending'}">${text}</span>`;
    }

    // 단일 조건(레거시)과 다중 조건(신규) 모두 호환하도록 배열로 통합 처리
    function criteriaBadge(type, value, criteriaArr) {
      const list = criteriaArr || (type ? [{ type, value: value || {} }] : []);
      if (list.length === 0) return '-';
      return list.map(c => {
        const cm = CRITERIA_MAP[c.type];
        return cm ? `<span class="badge badge-active" style="font-size:11px;margin:1px 2px;">${cm.label}</span>` : '';
      }).join('');
    }

    // 테이블 셀 공간 제약상 첫 번째 평가표만 badge로 표시
    function renderFormsBadge(forms) {
      if (!forms || forms.length === 0) return '<span style="color:#BDBDBD;font-size:11px;">-</span>';
      return `<span class="badge badge-active" style="font-size:11px;">${forms[0]}</span>`;
    }

    // 전체 팀 선택 시 "전체"로 축약하여 라벨 간결화
    function buildTargetLabel(center, teams) {
      if (!center) return '미지정';
      const ws = centersData.find(w => w.name === center);
      if (ws && teams.length === ws.teams.length) return center + ' > 전체';
      if (teams.length === 0) return center;
      return center + ' > ' + teams.join(', ');
    }

    /* ── 테이블 렌더링 ── */
    function renderTable(list) {
      const data = list || plans;
      const tbody = document.getElementById('plan-tbody');
      const countEl = document.getElementById('plan-count');
      if (countEl) countEl.textContent = '총 ' + data.length + '건';

      tbody.innerHTML = data.map(p => {
        const cs = computeStatus(p);
        const period = p.periodEnd ? `${p.periodStart} ~ ${p.periodEnd}` : p.periodStart;
        return `
          <tr onclick="openDetail(${p.no})">
            <td>${p.no}</td>
            <td class="col-left" style="font-weight:500;">${p.name}</td>
            <td style="max-width:180px;">${renderFormsBadge(p.forms)}</td>
            <td style="font-size:12px;color:#757575;">${period}</td>
            <td>${p.repeat || '-'}</td>
            <td>${p.target}</td>
            <td>${criteriaBadge(p.criteriaType, p.criteriaValue, p.criteria)}</td>
            <td>${p.assignee || '-'}</td>
            <td>${statusBadge(cs.status, cs.text)}</td>
          </tr>
        `;
      }).join('');
    }

    // 모든 필터를 AND 조건으로 체이닝하여 점진적 필터링 구현
    function applyPlanFilter() {
      let filtered = [...plans];
      const nameSearch = (document.getElementById('plan-search').value || '').trim().toLowerCase();
      if (nameSearch) filtered = filtered.filter(p => p.name.toLowerCase().includes(nameSearch));
      const statusVal = document.getElementById('plan-status-filter').value;
      if (statusVal !== 'all') filtered = filtered.filter(p => computeStatus(p).text === statusVal);
      const repeatVal = document.getElementById('repeat-filter').value;
      if (repeatVal !== 'all') filtered = filtered.filter(p => p.repeat === repeatVal);
      const targetVal = document.getElementById('target-search').value;
      if (targetVal !== 'all') filtered = filtered.filter(p => (p.target || '').includes(targetVal));
      const assigneeSearch = (document.getElementById('assignee-search').value || '').trim().toLowerCase();
      if (assigneeSearch) filtered = filtered.filter(p => (p.assignee || '').toLowerCase().includes(assigneeSearch));
      renderTable(filtered);
      AICC_Toast.show('필터가 적용되었습니다.');
    }

    // 필터 초기화 후 전체 목록 즉시 갱신
    function resetPlanFilter() {
      document.getElementById('plan-search').value = '';
      document.getElementById('plan-status-filter').value = 'all';
      document.getElementById('repeat-filter').value = 'all';
      document.getElementById('target-search').value = 'all';
      document.getElementById('assignee-search').value = '';
      renderTable();
    }

    /* ── 상세 모달 ── */
    // 계획의 전체 정보를 읽기 전용으로 표시하고, 상태에 따라 편집/삭제 버튼을 조건부 노출
    function openDetail(no) {
      const p = plans.find(x => x.no === no);
      if (!p) return;

      const td = p.targetDetail;
      const cs = computeStatus(p);
      const isActive = cs.status === 'active';
      const isPending = cs.status === 'pending';
      const periodEndDisplay = p.periodEnd ? AICC_Fmt.date(p.periodEnd) : '-';
      const teamsDisplay = td.teams.map(t => td.center + ' > ' + t).join(', ');
      // 레거시(단일 조건)와 신규(다중 조건) 데이터 구조 모두 호환
      const criteriaList = p.criteria || (p.criteriaType ? [{ type: p.criteriaType, value: p.criteriaValue || {} }] : []);
      const criteriaHtml = criteriaList.length > 0
        ? criteriaList.map(c => {
            const cm = CRITERIA_MAP[c.type];
            return cm ? `<div style="display:flex;gap:8px;align-items:baseline;margin-bottom:4px;">
              <span class="badge badge-active" style="font-size:11px;flex-shrink:0;">${cm.label}</span>
              <span style="font-size:12px;color:#616161;">${cm.format(c.value || {})}</span>
            </div>` : '';
          }).join('')
        : '<span style="color:#BDBDBD;font-size:12px;">미설정</span>';

      const content = `
        <div style="overflow-y:auto;max-height:calc(90vh - 120px);">
        <div style="margin-bottom:20px;">
          <div class="form-label" style="margin-bottom:12px;font-size:13px;font-weight:700;color:#212121;">기본 정보</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <div class="form-label">계획명</div>
              <div style="font-size:13px;">${p.name}</div>
            </div>
            <div>
              <div class="form-label">반복 주기</div>
              <div style="font-size:13px;">${p.repeat}</div>
            </div>
            <div>
              <div class="form-label">시작일</div>
              <div style="font-size:13px;">${AICC_Fmt.date(p.periodStart)}</div>
            </div>
            <div>
              <div class="form-label">종료일</div>
              <div style="font-size:13px;">${periodEndDisplay}</div>
            </div>
            <div>
              <div class="form-label">상태</div>
              <div style="font-size:13px;">${statusBadge(cs.status, cs.text)}</div>
            </div>
            <div>
              <div class="form-label">평가 담당자</div>
              <div style="font-size:13px;">${p.assignee || '-'}</div>
            </div>
          </div>
        </div>

        <div style="border-top:1px solid #E0E0E0;padding-top:16px;margin-bottom:20px;">
          <div class="form-label" style="margin-bottom:12px;font-size:13px;font-weight:700;color:#212121;">대상 설정</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <div class="form-label">센터</div>
              <div style="font-size:13px;">${td.center || '-'}</div>
            </div>
            <div>
              <div class="form-label">팀</div>
              <div style="font-size:13px;">${teamsDisplay || '-'}</div>
            </div>
            <div>
              <div class="form-label">채널</div>
              <div style="display:flex;gap:8px;margin-top:4px;">
                <label style="display:flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;border-radius:4px;${td.inbound ? 'background:#E3F2FD;border:1px solid #00A3FF;' : 'border:1px solid transparent;'}">
                  <input type="checkbox" ${td.inbound ? 'checked' : ''} disabled> I/B
                </label>
                <label style="display:flex;align-items:center;gap:4px;font-size:13px;padding:4px 8px;border-radius:4px;${td.outbound ? 'background:#E3F2FD;border:1px solid #00A3FF;' : 'border:1px solid transparent;'}">
                  <input type="checkbox" ${td.outbound ? 'checked' : ''} disabled> O/B
                </label>
              </div>
            </div>
          </div>
        </div>

        <div style="border-top:1px solid #E0E0E0;padding-top:16px;margin-bottom:20px;">
          <div class="form-label" style="margin-bottom:12px;font-size:13px;font-weight:700;color:#212121;">상세 조건</div>
          <div>${criteriaHtml}</div>
        </div>

        <div style="border-top:1px solid #E0E0E0;padding-top:16px;margin-bottom:20px;">
          <div class="form-label" style="margin-bottom:12px;font-size:13px;font-weight:700;color:#212121;">적용 평가표</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            ${p.forms.length > 0 ? `<span class="badge badge-active">${p.forms[0]}</span>` : '<span style="color:#BDBDBD;font-size:12px;">미지정</span>'}
          </div>
        </div>

        <div style="border-top:1px solid #E0E0E0;padding-top:16px;">
          <div class="form-label" style="margin-bottom:12px;font-size:13px;font-weight:700;color:#212121;">실행 통계</div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;">
            <div style="background:#F9F9F9;border-radius:6px;padding:12px;text-align:center;">
              <div style="font-size:11px;color:#757575;margin-bottom:4px;">총 대상 건수</div>
              <div style="font-size:20px;font-weight:700;">${AICC_Fmt.number(p.stats.total)}</div>
            </div>
            <div style="background:#F9F9F9;border-radius:6px;padding:12px;text-align:center;">
              <div style="font-size:11px;color:#757575;margin-bottom:4px;">완료 건수</div>
              <div style="font-size:20px;font-weight:700;color:#4CAF50;">${AICC_Fmt.number(p.stats.completed)}</div>
            </div>
            <div style="background:#F9F9F9;border-radius:6px;padding:12px;text-align:center;">
              <div style="font-size:11px;color:#757575;margin-bottom:4px;">미완료 건수</div>
              <div style="font-size:20px;font-weight:700;color:#FF9800;">${AICC_Fmt.number(p.stats.pending)}</div>
            </div>
          </div>
        </div>
        </div>
      `;

      let footerBtns;
      if (isActive || isPending) {
        footerBtns = `
          <button class="btn btn-danger" onclick="handleAction(${p.no}, 'delete')">삭제</button>
          <button class="btn btn-secondary" onclick="handleAction(${p.no}, 'copy')">사본 생성</button>
          <button class="btn btn-secondary" onclick="openEditModal(${p.no})">편집</button>
        `;
      } else {
        footerBtns = `
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
          <button class="btn btn-secondary" onclick="handleAction(${p.no}, 'copy')">사본 생성</button>
        `;
      }

      AICC_Modal.open({ title: p.name, content, footer: footerBtns, size: 'lg' });
    }

    /* ── 듀얼리스트박스 ── */
    // 여러 DLB 인스턴스의 상태를 ID 기반으로 관리 (폼 내 다중 DLB 동시 사용 지원)
    const _dlb = {};

    // DLB 상태를 전역 객체에 초기화하여 외부에서 선택값 참조 가능하게 함
    function renderDlb(id, all, selected) {
      _dlb[id] = { all: [...all], selected: [...selected], filter: '' };
      return buildDlbHtml(id);
    }

    // 좌측(후보)/우측(선택) 패널 구조로 직관적 다중 선택 UX 제공
    function buildDlbHtml(id) {
      const s = _dlb[id];
      if (!s) return '';
      const avail = s.all.filter(n => !s.selected.includes(n));
      const filtered = s.filter ? avail.filter(n => n.toLowerCase().includes(s.filter.toLowerCase())) : avail;

      const leftItems = filtered.length === 0
        ? '<div style="text-align:center;color:#BDBDBD;font-size:12px;padding:20px;">항목 없음</div>'
        : filtered.map(n => `<div onclick="dlbMove('${id}',${s.all.indexOf(n)},'right')"
            style="padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;"
            onmouseover="this.style.background='#F5F5F5'" onmouseout="this.style.background=''">
            <span style="color:#BDBDBD;font-size:11px;">+</span> ${n}</div>`).join('');

      const rightItems = s.selected.length === 0
        ? '<div style="text-align:center;color:#BDBDBD;font-size:12px;padding:20px;">선택된 항목 없음</div>'
        : s.selected.map(n => `<div onclick="dlbMove('${id}',${s.all.indexOf(n)},'left')"
            style="padding:5px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;color:#00A3FF;"
            onmouseover="this.style.background='#F0FDF4'" onmouseout="this.style.background=''">
            <span style="font-size:11px;">&#10003;</span> ${n}</div>`).join('');

      return `<div style="display:flex;gap:8px;align-items:stretch;" id="${id}">
        <div style="flex:1;border:1px solid #E0E0E0;border-radius:6px;overflow:hidden;">
          <div style="padding:6px 8px;background:#FAFAFA;border-bottom:1px solid #E0E0E0;">
            <input type="text" placeholder="검색..." value="${s.filter || ''}" oninput="dlbFilter('${id}',this.value)"
              style="width:100%;border:1px solid #E0E0E0;border-radius:4px;padding:4px 8px;font-size:12px;outline:none;">
          </div>
          <div style="min-height:120px;max-height:160px;overflow-y:auto;padding:4px 0;">${leftItems}</div>
        </div>
        <div style="display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 2px;">
          <button type="button" onclick="dlbMoveAll('${id}','right')" title="전체 추가"
            style="background:#F5F5F5;border:1px solid #E0E0E0;border-radius:4px;cursor:pointer;padding:4px 6px;font-size:11px;color:#757575;">&raquo;</button>
          <button type="button" onclick="dlbMoveAll('${id}','left')" title="전체 제거"
            style="background:#F5F5F5;border:1px solid #E0E0E0;border-radius:4px;cursor:pointer;padding:4px 6px;font-size:11px;color:#757575;">&laquo;</button>
        </div>
        <div style="flex:1;border:1px solid #E0E0E0;border-radius:6px;overflow:hidden;">
          <div style="padding:6px 8px;background:#F0FDF4;border-bottom:1px solid #E0E0E0;">
            <span style="font-size:12px;font-weight:600;color:#00A3FF;">선택됨 (${s.selected.length})</span>
          </div>
          <div style="min-height:120px;max-height:160px;overflow-y:auto;padding:4px 0;">${rightItems}</div>
        </div>
      </div>`;
    }

    // 인덱스 기반 항목 이동으로 중복 선택 방지
    function dlbMove(id, idx, dir) {
      const s = _dlb[id];
      if (!s || idx < 0 || idx >= s.all.length) return;
      const name = s.all[idx];
      if (dir === 'right' && !s.selected.includes(name)) s.selected.push(name);
      else if (dir === 'left') s.selected = s.selected.filter(n => n !== name);
      dlbRefresh(id);
    }
    // 전체 선택/해제를 한번에 처리하여 대량 항목 관리 효율화
    function dlbMoveAll(id, dir) {
      const s = _dlb[id]; if (!s) return;
      s.selected = dir === 'right' ? [...s.all] : [];
      dlbRefresh(id);
    }
    // 후보 목록만 필터링 (선택된 항목에는 영향 없음)
    function dlbFilter(id, val) {
      const s = _dlb[id]; if (!s) return;
      s.filter = val; dlbRefresh(id);
    }
    // outerHTML 교체로 이벤트 핸들러 포함 완전 리렌더링
    function dlbRefresh(id) {
      const el = document.getElementById(id);
      if (el) el.outerHTML = buildDlbHtml(id);
    }
    // 외부에서 선택 상태를 읽기 위한 인터페이스 (readForm에서 사용)
    function getDlbSelected(id) {
      return _dlb[id] ? [..._dlb[id].selected] : [];
    }

    /* ── 기준별 세부 입력 영역 생성 ── */
    // 조건 유형별로 전혀 다른 입력 UI가 필요하므로 switch 분기로 개별 HTML 생성
    function buildCriteriaDetail(type, value) {
      const v = value || {};
      switch (type) {
        case 'workingDays':
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="form-label" style="margin:0;white-space:nowrap;">근무일수</label>
              <input type="number" id="criteria-days" class="form-input" style="width:80px;" value="${v.days || 30}" min="1" max="365">
              <span style="font-size:13px;color:#757575;">일 미만</span>
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">근무일수가 지정한 일수 미만인 신입 상담사를 수동 평가 대상으로 지정합니다</div>
          </div>`;
        case 'sampling':
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="form-label" style="margin:0;white-space:nowrap;">샘플링 비율</label>
              <input type="number" id="criteria-rate" class="form-input" style="width:80px;" value="${v.rate || 10}" min="1" max="100">
              <span style="font-size:13px;color:#757575;">%</span>
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">전체 상담 중 지정한 비율을 무작위 추출하여 수동 평가합니다</div>
          </div>`;
        case 'scoreThreshold':
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="form-label" style="margin:0;white-space:nowrap;">AI 점수</label>
              <input type="number" id="criteria-score" class="form-input" style="width:80px;" value="${v.score || 60}" min="0" max="100">
              <span style="font-size:13px;color:#757575;">점 미만</span>
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">AI 평가 점수가 지정한 점수 미만인 건을 수동 재평가 대상으로 지정합니다</div>
          </div>`;
        case 'confidence':
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="form-label" style="margin:0;white-space:nowrap;">신뢰도 수준</label>
              <select id="criteria-level" class="form-select" style="width:120px;">
                <option value="High" ${v.level === 'High' ? 'selected' : ''}>High</option>
                <option value="Medium" ${v.level === 'Medium' || !v.level ? 'selected' : ''}>Medium</option>
                <option value="Low" ${v.level === 'Low' ? 'selected' : ''}>Low</option>
              </select>
              <span style="font-size:13px;color:#757575;">이하</span>
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">AI 신뢰도가 선택한 수준 이하인 건을 수동 확인 대상으로 지정합니다</div>
          </div>`;
        case 'specificAgents':
          return `<div style="margin-top:8px;">
            <div style="display:flex;gap:12px;margin-bottom:8px;">
              <div style="flex:1;">
                <label class="form-label">센터</label>
                <select id="criteria-ws" class="form-select" style="width:100%;" onchange="onCriteriaWsChange()">
                  <option value="">선택하세요</option>
                  ${centersData.map(ws => `<option value="${ws.name}">${ws.name}</option>`).join('')}
                </select>
              </div>
              <div style="flex:1;">
                <label class="form-label">팀</label>
                <select id="criteria-team" class="form-select" style="width:100%;" onchange="onCriteriaTeamChange()">
                  <option value="">팀 선택</option>
                </select>
              </div>
            </div>
            <div id="criteria-agent-area"></div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">지정된 상담사의 모든 상담을 수동 평가 대상으로 지정합니다</div>
          </div>`;
        case 'consultType': {
          const depthVal = v.depth || 'all';
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              ${['all','1','2','3','4'].map(d => `
                <label style="display:flex;align-items:center;gap:3px;font-size:13px;cursor:pointer;">
                  <input type="radio" name="ct-depth" value="${d}" onchange="onConsultDepthChange()" ${depthVal === d ? 'checked' : ''}> ${d === 'all' ? '전체' : d + 'Depth'}
                </label>`).join('')}
            </div>
            <div id="ct-select-area" style="margin-top:8px;"></div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">지정한 상담 유형에 해당하는 건만 평가 대상에 포함합니다</div>
          </div>`;
        }
        case 'callSegment': {
          const isFull = v.full !== false;
          return `<div style="margin-top:8px;">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-bottom:8px;">
              <input type="checkbox" id="cs-full" onchange="onCallSegmentToggle()" ${isFull ? 'checked' : ''}> 전체 구간
            </label>
            <div id="cs-range" style="display:flex;align-items:center;gap:8px;${isFull ? 'display:none;' : ''}">
              <input type="text" id="cs-start" class="form-input" style="width:80px;" placeholder="00:00" value="${v.start || ''}">
              <span style="font-size:13px;color:#757575;">~</span>
              <input type="text" id="cs-end" class="form-input" style="width:80px;" placeholder="05:00" value="${v.end || ''}">
              <span style="font-size:12px;color:#9E9E9E;">(분:초)</span>
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">통화 녹음 중 특정 구간만 평가 대상으로 지정합니다</div>
          </div>`;
        }
        case 'durationRange':
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="form-label" style="margin:0;white-space:nowrap;">최소</label>
              <input type="number" id="dr-min" class="form-input" style="width:70px;" value="${v.min || ''}" min="0" placeholder="0">
              <span style="font-size:13px;color:#757575;">분 ~</span>
              <label class="form-label" style="margin:0;white-space:nowrap;">최대</label>
              <input type="number" id="dr-max" class="form-input" style="width:70px;" value="${v.max || ''}" min="0" placeholder="∞">
              <span style="font-size:13px;color:#757575;">분</span>
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">총 통화 시간이 지정 범위에 해당하는 건만 평가 대상에 포함합니다 (빈값 = 제한 없음)</div>
          </div>`;
        case 'callTimeRange':
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <label class="form-label" style="margin:0;white-space:nowrap;">시작</label>
              <input type="time" id="ctr-start" class="form-input" style="width:120px;" value="${v.start || ''}">
              <span style="font-size:13px;color:#757575;">~</span>
              <label class="form-label" style="margin:0;white-space:nowrap;">종료</label>
              <input type="time" id="ctr-end" class="form-input" style="width:120px;" value="${v.end || ''}">
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">해당 시간대에 발생한 상담만 평가 대상에 포함합니다 (빈값 = 전체 시간대)</div>
          </div>`;
        case 'weekdays': {
          const allDays = ['월','화','수','목','금','토','일'];
          const checked = v.days || allDays;
          return `<div style="margin-top:8px;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              ${allDays.map(d => `
                <label style="display:flex;align-items:center;gap:3px;font-size:13px;cursor:pointer;">
                  <input type="checkbox" name="wd-day" value="${d}" ${checked.includes(d) ? 'checked' : ''}> ${d}
                </label>`).join('')}
            </div>
            <div style="font-size:11px;color:#9E9E9E;margin-top:6px;">선택한 요일에 발생한 상담만 평가 대상에 포함합니다</div>
          </div>`;
        }
        default:
          return '';
      }
    }

    // 체크 해제 시 상세 영역을 비워 불필요한 잔여 입력값 제거
    function onCriteriaToggle(type) {
      const chk = document.querySelector(`input[name="pf-criteria-chk"][value="${type}"]`);
      const area = document.getElementById('criteria-detail-' + type);
      if (!area) return;
      if (chk && chk.checked) {
        area.style.display = '';
        area.innerHTML = buildCriteriaDetail(type, {});
      } else {
        area.style.display = 'none';
        area.innerHTML = '';
      }
    }

    // 선택한 depth까지 cascading select를 동적 생성하여 유연한 계층 탐색 지원
    function onConsultDepthChange() {
      const depth = document.querySelector('input[name="ct-depth"]:checked')?.value || 'all';
      const area = document.getElementById('ct-select-area');
      if (!area) return;
      if (depth === 'all') { area.innerHTML = ''; return; }
      const n = parseInt(depth);
      let html = '';
      const d1Opts = Object.keys(consultTypeTree).map(k => `<option value="${k}">${k}</option>`).join('');
      html += `<select id="ct-d1" class="form-select" style="width:100%;" onchange="onConsultDChange(1)"><option value="">1Depth 선택</option>${d1Opts}</select>`;
      for (let i = 2; i <= n; i++) {
        html += `<select id="ct-d${i}" class="form-select" style="width:100%;margin-top:6px;" onchange="onConsultDChange(${i})"><option value="">${i}Depth 선택</option></select>`;
      }
      area.innerHTML = html;
    }

    // 상위 depth 선택값을 기반으로 트리를 순회하여 하위 옵션 추출
    function getConsultOptions(level) {
      if (level === 1) return Object.keys(consultTypeTree);
      const d1 = document.getElementById('ct-d1')?.value;
      if (!d1 || !consultTypeTree[d1]) return [];
      if (level === 2) return Object.keys(consultTypeTree[d1] || {});
      const d2 = document.getElementById('ct-d2')?.value;
      if (!d2 || !consultTypeTree[d1]?.[d2]) return [];
      if (level === 3) return Object.keys(consultTypeTree[d1][d2] || {});
      const d3 = document.getElementById('ct-d3')?.value;
      if (!d3 || !consultTypeTree[d1]?.[d2]?.[d3]) return [];
      if (level === 4) {
        const node = consultTypeTree[d1][d2][d3];
        return typeof node === 'object' ? Object.keys(node) : [];
      }
      return [];
    }

    // 상위 depth 변경 시 하위 옵션을 리셋하여 잘못된 조합 방지
    function onConsultDChange(changedLevel) {
      const depth = parseInt(document.querySelector('input[name="ct-depth"]:checked')?.value || '0');
      for (let i = changedLevel + 1; i <= depth; i++) {
        const sel = document.getElementById('ct-d' + i);
        if (!sel) continue;
        const opts = getConsultOptions(i);
        sel.innerHTML = `<option value="">${i}Depth 선택</option>` + opts.map(k => `<option value="${k}">${k}</option>`).join('');
      }
    }

    // 전체 구간 선택 시 불필요한 범위 입력을 숨겨 혼동 방지
    function onCallSegmentToggle() {
      const isFull = document.getElementById('cs-full')?.checked;
      const range = document.getElementById('cs-range');
      if (range) range.style.display = isFull ? 'none' : 'flex';
    }

    // 평가 데이터의 '>' 구분자를 파싱하여 4단계 트리 구조로 변환 (cascading select용)
    function buildConsultTypeTree(evals) {
      const tree = {};
      evals.forEach(ev => {
        const ct = ev.consultation_type;
        if (!ct) return;
        const parts = ct.split('>').map(s => s.trim());
        if (!tree[parts[0]]) tree[parts[0]] = {};
        if (parts[1]) {
          if (!tree[parts[0]][parts[1]]) tree[parts[0]][parts[1]] = {};
          if (parts[2]) {
            if (!tree[parts[0]][parts[1]][parts[2]]) tree[parts[0]][parts[1]][parts[2]] = {};
            if (parts[3]) {
              tree[parts[0]][parts[1]][parts[2]][parts[3]] = true;
            }
          }
        }
      });
      return tree;
    }

    // 센터 변경 시 하위 팀·상담사 선택을 초기화하여 정합성 유지
    function onCriteriaWsChange() {
      const wsName = document.getElementById('criteria-ws')?.value;
      const teamSel = document.getElementById('criteria-team');
      if (!teamSel) return;
      if (!wsName) { teamSel.innerHTML = '<option value="">팀 선택</option>'; return; }
      const ws = centersData.find(w => w.name === wsName);
      if (!ws) return;
      teamSel.innerHTML = '<option value="">팀 선택</option>' +
        ws.teams.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
      document.getElementById('criteria-agent-area').innerHTML = '';
    }

    // 선택된 팀의 상담사를 듀얼리스트박스로 제공하여 다중 선택 지원
    function onCriteriaTeamChange() {
      const wsName = document.getElementById('criteria-ws')?.value;
      const teamName = document.getElementById('criteria-team')?.value;
      const area = document.getElementById('criteria-agent-area');
      if (!area || !wsName || !teamName) { if (area) area.innerHTML = ''; return; }
      const agents = usersData.filter(u => u.role === 'AGENT' && u.center === wsName && u.team === teamName);
      if (agents.length === 0) {
        area.innerHTML = '<span style="color:#BDBDBD;font-size:12px;">해당 팀에 상담사가 없습니다.</span>';
        return;
      }
      area.innerHTML = '<label class="form-label" style="margin-top:4px;">상담사 선택</label>' +
        renderDlb('dlb-criteria-agents', agents.map(a => a.name), agents.map(a => a.name));
    }

    /* ── 폼 HTML ── */
    // plan 유무로 생성/편집 폼을 동일 함수로 처리하여 코드 재사용
    function buildFormHtml(plan) {
      const p = plan || {};
      const td = p.targetDetail || { center: '', teams: [], inbound: true, outbound: true };
      const selectedWs = td.center || '';
      const repeatVal = p.repeat || '지속';
      const isOneTime = repeatVal === '1회성' || repeatVal === '지속';

      const wsOptions = centersData.map(ws =>
        `<option value="${ws.name}"${ws.name === selectedWs ? ' selected' : ''}>${ws.name}</option>`
      ).join('');

      let teamsHtml = '';
      if (selectedWs) {
        const ws = centersData.find(w => w.name === selectedWs);
        if (ws) {
          teamsHtml = ws.teams.map(t => `
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
              <input type="checkbox" name="pf-team" value="${t.name}" ${td.teams.includes(t.name) ? 'checked' : ''}> ${selectedWs} > ${t.name}
            </label>
          `).join('');
        }
      }

      const formsSelectHtml = getFormsSelectHtml(p.forms || []);

      const selectedCriteria = p.criteria || (p.criteriaType ? [{ type: p.criteriaType, value: p.criteriaValue || {} }] : []);
      const selectedTypes = selectedCriteria.map(c => c.type);
      const criteriaOptions = [
        { value: 'workingDays', label: '근무일수 기준' },
        { value: 'sampling', label: '샘플링 비율' },
        { value: 'scoreThreshold', label: 'AI 점수 기준' },
        { value: 'confidence', label: 'AI 신뢰도 기준' },
        { value: 'specificAgents', label: '특정 상담사 지정' },
        { value: 'consultType', label: '상담 유형 (Depth)' },
        { value: 'callSegment', label: '통화 구간 지정' },
        { value: 'durationRange', label: '통화 시간 범위' },
        { value: 'callTimeRange', label: '상담 시간대' },
        { value: 'weekdays', label: '요일 필터' }
      ];
      const criteriaCheckboxesHtml = criteriaOptions.map(o => {
        const isChecked = selectedTypes.includes(o.value);
        const cv = (selectedCriteria.find(c => c.type === o.value) || {}).value || {};
        return `
          <div style="border:1px solid #E0E0E0;border-radius:6px;padding:10px 14px;margin-bottom:6px;">
            <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;font-weight:500;">
              <input type="checkbox" name="pf-criteria-chk" value="${o.value}" onchange="onCriteriaToggle('${o.value}')" ${isChecked ? 'checked' : ''}> ${o.label}
            </label>
            <div id="criteria-detail-${o.value}" style="${isChecked ? '' : 'display:none;'}">
              ${isChecked ? buildCriteriaDetail(o.value, cv) : ''}
            </div>
          </div>`;
      }).join('');

      return `
        <div style="display:flex;flex-direction:column;gap:16px;">
          <div>
            <label class="form-label">계획명 *</label>
            <input type="text" id="pf-name" class="form-input" style="width:100%;" value="${p.name || ''}" placeholder="예: 2025년 3월 신입 상담사 수동 평가">
          </div>

          <div style="display:flex;gap:12px;">
            <div style="flex:1;">
              <label class="form-label">시작일 *</label>
              <input type="date" id="pf-start" class="form-input" style="width:100%;" value="${p.periodStart || ''}">
            </div>
            <div style="flex:1;">
              <label class="form-label">종료일${isOneTime ? '' : ' *'}</label>
              <input type="date" id="pf-end" class="form-input" style="width:100%;${isOneTime ? 'background:#F5F5F5;color:#BDBDBD;' : ''}" value="${isOneTime ? '' : (p.periodEnd || '')}" ${isOneTime ? 'disabled' : ''}>
            </div>
            <div style="flex:1;">
              <label class="form-label">반복 주기</label>
              <div style="display:flex;gap:10px;margin-top:6px;">
                <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
                  <input type="radio" name="pf-repeat" value="지속" onchange="onRepeatChange()" ${repeatVal === '지속' ? 'checked' : ''}> 지속
                </label>
                <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
                  <input type="radio" name="pf-repeat" value="1회성" onchange="onRepeatChange()" ${repeatVal === '1회성' ? 'checked' : ''}> 1회성
                </label>
                <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
                  <input type="radio" name="pf-repeat" value="매주" onchange="onRepeatChange()" ${repeatVal === '매주' ? 'checked' : ''}> 매주
                </label>
                <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;">
                  <input type="radio" name="pf-repeat" value="매월" onchange="onRepeatChange()" ${repeatVal === '매월' ? 'checked' : ''}> 매월
                </label>
              </div>
            </div>
          </div>

          <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
            <div class="form-label" style="font-weight:700;margin-bottom:10px;">대상 설정</div>
            <div style="display:flex;gap:16px;">
              <div style="flex:1;">
                <label class="form-label">센터</label>
                <select id="pf-ws" class="form-select" style="width:100%;margin-top:4px;" onchange="onCenterChange()">
                  <option value="">선택하세요</option>
                  ${wsOptions}
                </select>
              </div>
              <div style="flex:2;">
                <label class="form-label">팀</label>
                <div id="pf-teams-area" style="display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;">
                  ${teamsHtml || '<span style="color:#BDBDBD;font-size:12px;">센터를 먼저 선택하세요</span>'}
                </div>
              </div>
              <div style="flex:1;">
                <label class="form-label">채널</label>
                <div style="display:flex;gap:12px;margin-top:6px;">
                  <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 8px;border-radius:4px;${td.inbound !== false ? 'background:#E3F2FD;border:1px solid #00A3FF;' : 'border:1px solid transparent;'}">
                    <input type="checkbox" id="pf-ib" ${td.inbound !== false ? 'checked' : ''} onchange="toggleChannelHighlight(this)"> I/B
                  </label>
                  <label style="display:flex;align-items:center;gap:4px;font-size:13px;cursor:pointer;padding:4px 8px;border-radius:4px;${td.outbound !== false ? 'background:#E3F2FD;border:1px solid #00A3FF;' : 'border:1px solid transparent;'}">
                    <input type="checkbox" id="pf-ob" ${td.outbound !== false ? 'checked' : ''} onchange="toggleChannelHighlight(this)"> O/B
                  </label>
                </div>
              </div>
            </div>
          </div>

          <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
            <div class="form-label" style="font-weight:700;margin-bottom:8px;">상세 조건</div>
            <div style="max-height:340px;overflow-y:auto;padding-right:4px;">
              ${criteriaCheckboxesHtml}
            </div>
          </div>

          <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
            <div class="form-label" style="font-weight:700;margin-bottom:8px;">적용 평가표</div>
            ${formsSelectHtml}
          </div>

          <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
            <label class="form-label">평가 담당자</label>
            <input type="text" id="pf-assignee" class="form-input" style="width:100%;" value="${p.assignee || ''}" placeholder="담당자 이름을 입력하세요">
          </div>
        </div>
      `;
    }

    // 1회성/지속은 종료일 개념이 없으므로 입력 비활성화로 혼동 방지
    function onRepeatChange() {
      const repeat = document.querySelector('input[name="pf-repeat"]:checked')?.value || '지속';
      const endInput = document.getElementById('pf-end');
      if (!endInput) return;
      if (repeat === '1회성' || repeat === '지속') {
        endInput.disabled = true; endInput.value = '';
        endInput.style.background = '#F5F5F5'; endInput.style.color = '#BDBDBD';
      } else {
        endInput.disabled = false; endInput.style.background = ''; endInput.style.color = '';
      }
    }

    // 센터 변경 시 해당 센터의 팀 체크박스를 동적 반영
    function onCenterChange() {
      const wsName = document.getElementById('pf-ws')?.value;
      const area = document.getElementById('pf-teams-area');
      if (!area) return;
      if (!wsName) {
        area.innerHTML = '<span style="color:#BDBDBD;font-size:12px;">센터를 먼저 선택하세요</span>';
        return;
      }
      const ws = centersData.find(w => w.name === wsName);
      if (!ws) return;
      area.innerHTML = ws.teams.map(t => `
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;">
          <input type="checkbox" name="pf-team" value="${t.name}" checked> ${wsName} > ${t.name}
        </label>
      `).join('');
    }

    // 서버 데이터 미로드 시 하드코딩 폴백으로 기본 동작 보장
    function getFormsSelectHtml(selectedForms) {
      const formNames = [];
      if (formsData && Array.isArray(formsData)) {
        formsData.forEach(f => {
          const label = f.name + (f.version ? ' ' + f.version : '');
          formNames.push(label);
        });
      }
      if (formNames.length === 0) {
        formNames.push('표준 QA 평가표 v2.1', '기술지원 전문 평가표', '표준 QA 평가표 v2.0');
      }
      // 수동 평가 전용 평가표 옵션 추가
      ['수동 평가표 v1.0', '수동 평가표 v2.0', 'VOC 응대 평가표'].forEach(f => {
        if (!formNames.includes(f)) formNames.push(f);
      });
      const unique = [...new Set(formNames)];
      const selected = selectedForms.length > 0 ? selectedForms[0] : '';
      const options = unique.map(fn =>
        `<option value="${fn}"${fn === selected ? ' selected' : ''}>${fn}</option>`
      ).join('');
      return `<select id="pf-form" class="form-select" style="width:100%;"><option value="">평가표를 선택하세요</option>${options}</select>`;
    }

    /* ── 폼 읽기 ── */
    // 폼 전체 데이터 수집과 필수값 검증을 함께 수행하여 유효하지 않으면 null 반환
    function readForm() {
      const name = document.getElementById('pf-name')?.value?.trim();
      if (!name) { AICC_Toast.show('계획명을 입력하세요.'); return null; }

      const periodStart = document.getElementById('pf-start')?.value;
      if (!periodStart) { AICC_Toast.show('시작일을 입력하세요.'); return null; }

      const repeat = document.querySelector('input[name="pf-repeat"]:checked')?.value || '지속';
      const periodEnd = (repeat === '1회성' || repeat === '지속') ? '' : (document.getElementById('pf-end')?.value || '');
      if (repeat !== '1회성' && repeat !== '지속' && !periodEnd) { AICC_Toast.show('종료일을 입력하세요.'); return null; }

      const center = document.getElementById('pf-ws')?.value || '';
      const teams = [...document.querySelectorAll('input[name="pf-team"]:checked')].map(el => el.value);
      const inbound = document.getElementById('pf-ib')?.checked ?? true;
      const outbound = document.getElementById('pf-ob')?.checked ?? true;
      const selectedForm = document.getElementById('pf-form')?.value;
      const forms = selectedForm ? [selectedForm] : [];

      // 선택된 모든 조건 유형을 순회하며 각각의 입력값을 수집·검증
      const checkedCriteria = [...document.querySelectorAll('input[name="pf-criteria-chk"]:checked')].map(el => el.value);
      const criteria = [];
      for (const ct of checkedCriteria) {
        let val = {};
        switch (ct) {
          case 'workingDays': {
            const d = parseInt(document.getElementById('criteria-days')?.value);
            if (!d || d <= 0) { AICC_Toast.show('근무일수를 입력하세요.'); return null; }
            val = { days: d }; break;
          }
          case 'sampling': {
            const r = parseInt(document.getElementById('criteria-rate')?.value);
            if (!r || r <= 0 || r > 100) { AICC_Toast.show('샘플링 비율을 1~100% 범위로 입력하세요.'); return null; }
            val = { rate: r }; break;
          }
          case 'scoreThreshold': {
            const sc = parseInt(document.getElementById('criteria-score')?.value);
            if (sc == null || sc < 0 || sc > 100) { AICC_Toast.show('AI 점수를 0~100 범위로 입력하세요.'); return null; }
            val = { score: sc }; break;
          }
          case 'confidence': {
            val = { level: document.getElementById('criteria-level')?.value || 'Medium' }; break;
          }
          case 'specificAgents': {
            const agents = getDlbSelected('dlb-criteria-agents');
            if (agents.length === 0) { AICC_Toast.show('상담사를 선택하세요.'); return null; }
            val = { agents }; break;
          }
          case 'consultType': {
            const depth = document.querySelector('input[name="ct-depth"]:checked')?.value || 'all';
            let selected = '';
            if (depth !== 'all') {
              const parts = [];
              for (let i = 1; i <= parseInt(depth); i++) {
                const v = document.getElementById('ct-d' + i)?.value;
                if (v) parts.push(v);
              }
              selected = parts.join(' > ');
            }
            val = { depth, selected }; break;
          }
          case 'callSegment': {
            const full = document.getElementById('cs-full')?.checked !== false;
            val = { full, start: document.getElementById('cs-start')?.value || '', end: document.getElementById('cs-end')?.value || '' }; break;
          }
          case 'durationRange': {
            val = { min: document.getElementById('dr-min')?.value || '', max: document.getElementById('dr-max')?.value || '' }; break;
          }
          case 'callTimeRange': {
            val = { start: document.getElementById('ctr-start')?.value || '', end: document.getElementById('ctr-end')?.value || '' }; break;
          }
          case 'weekdays': {
            const days = [...document.querySelectorAll('input[name="wd-day"]:checked')].map(el => el.value);
            val = { days }; break;
          }
        }
        criteria.push({ type: ct, value: val });
      }

      // 레거시 호환을 위해 첫 번째 조건을 단일 필드로도 저장
      const criteriaType = criteria.length > 0 ? criteria[0].type : '';
      const criteriaValue = criteria.length > 0 ? criteria[0].value : {};

      const assignee = document.getElementById('pf-assignee')?.value?.trim() || '';
      const targetLabel = buildTargetLabel(center, teams);

      return {
        name, periodStart, periodEnd, repeat,
        target: targetLabel,
        targetDetail: { center, teams, inbound, outbound },
        forms, criteriaType, criteriaValue, criteria, assignee
      };
    }

    /* ── 새 계획 추가 ── */
    // null 전달로 빈 폼 생성 (buildFormHtml의 생성/편집 공용 구조 활용)
    function openCreateModal() {
      const html = buildFormHtml(null);
      AICC_Modal.open({
        title: '새 수동 평가 계획 추가',
        size: 'lg',
        content: html,
        footer: `
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
          <button class="btn btn-primary" onclick="saveNew()">생성</button>
        `
      });
    }

    // readForm 검증 통과 시에만 배열에 추가하여 무결성 보장
    function saveNew() {
      const vals = readForm();
      if (!vals) return;

      plans.push({
        no: getNextNo(),
        ...vals,
        stats: { total: 0, completed: 0, pending: 0 }
      });
      renderTable();
      AICC_Modal.close();
      AICC_Toast.show('수동 평가 계획이 생성되었습니다. 자동 평가 제외 관리에 연동 규칙이 추가되었습니다.');
    }

    /* ── 편집 ── */
    // 기존 모달을 닫은 후 setTimeout으로 전환 애니메이션 충돌 방지
    function openEditModal(no) {
      AICC_Modal.close();
      const p = plans.find(x => x.no === no);
      if (!p) return;

      setTimeout(() => {
        const html = buildFormHtml(p);
        AICC_Modal.open({
          title: `수동 평가 계획 편집: "${p.name}"`,
          size: 'lg',
          content: html,
          footer: `
            <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
            <button class="btn btn-primary" onclick="saveEdit(${no})">저장</button>
          `
        });
      }, 300);
    }

    function saveEdit(no) {
      const vals = readForm();
      if (!vals) return;

      const p = plans.find(x => x.no === no);
      if (!p) return;

      Object.assign(p, vals);
      delete p.draft;
      renderTable();
      AICC_Modal.close();
      AICC_Toast.show('수동 평가 계획이 수정되었습니다.');
    }

    /* ── 삭제 / 복사 ── */
    // 삭제/복사 동작을 하나의 함수로 통합하여 모달 닫기 로직 중복 방지
    function handleAction(no, action) {
      AICC_Modal.close();
      const idx = plans.findIndex(x => x.no === no);
      if (idx === -1) return;
      const p = plans[idx];

      switch (action) {
        case 'delete':
          if (!confirm('정말 삭제하시겠습니까?')) return;
          plans.splice(idx, 1);
          renderTable();
          AICC_Toast.show(`"${p.name}" 계획이 삭제되었습니다. 연동된 자동 평가 제외 규칙도 함께 삭제됩니다.`);
          break;
        case 'copy': {
          const copy = JSON.parse(JSON.stringify(p));
          copy.no = getNextNo();
          copy.name = p.name + ' (사본)';
          copy.draft = true;
          copy.stats = { total: 0, completed: 0, pending: 0 };
          plans.push(copy);
          renderTable();
          AICC_Toast.show(`"${p.name}" 사본이 생성되었습니다. (초안 상태)`);
          break;
        }
      }
    }

    /* ── 초기화 ── */
    // 비동기 데이터 로드 완료 후 필터 옵션 동적 생성 및 테이블 초기화
    document.addEventListener('DOMContentLoaded', async () => {
      formsData = await AICC_DataLoader.load('evaluation-forms.json');
      const wsRaw = await AICC_DataLoader.load('centers.json');
      if (wsRaw) centersData = wsRaw;
      const usRaw = await AICC_DataLoader.load('users.json');
      if (usRaw) usersData = usRaw;
      const evRaw = await AICC_DataLoader.load('evaluations.json');
      if (evRaw) { evaluationsData = evRaw; consultTypeTree = buildConsultTypeTree(evRaw); }

      const repeats = [...new Set(plans.map(p => p.repeat).filter(Boolean))];
      const repeatSel = document.getElementById('repeat-filter');
      repeats.forEach(r => { repeatSel.innerHTML += '<option value="' + r + '">' + r + '</option>'; });

      // 센터/팀 기반 대상 드롭다운 옵션 동적 생성
      const targetSel = document.getElementById('target-search');
      centersData.forEach(ws => {
        targetSel.innerHTML += '<option value="' + ws.name + '">' + ws.name + ' > 전체</option>';
        ws.teams.forEach(t => {
          targetSel.innerHTML += '<option value="' + ws.name + ' > ' + t.name + '">' + ws.name + ' > ' + t.name + '</option>';
        });
      });

      renderTable();
    });
  </script>
</body>
</html>
