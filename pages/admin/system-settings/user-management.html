<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 페이지 제목 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">사용자 관리</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">시스템 사용자 및 접근 범위 관리</p>
      </div>
      <button class="btn btn-primary btn-sm" onclick="openAddUserModal()">+ 사용자 등록</button>
    </div>

    <!-- 필터 -->
    <div class="filter-section">
      <div class="filter-header">
        <span>필터</span>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">센터</label>
          <select class="form-select" id="ws-filter" onchange="onWsChange()">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">팀</label>
          <select class="form-select" id="team-filter" onchange="filterUsers()">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">접속 권한</label>
          <select class="form-select" id="status-filter" onchange="filterUsers()">
            <option value="all">전체</option>
            <option value="active">활성</option>
            <option value="inactive">비활성</option>
          </select>
        </div>
        <div>
          <label class="form-label">이름</label>
          <input type="text" class="form-input" id="search-input" placeholder="이름 검색" style="min-width:120px;">
        </div>
        <div>
          <label class="form-label">이메일</label>
          <input type="text" class="form-input" id="email-search" placeholder="이메일 검색" style="min-width:150px;">
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetUserFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="filterUsers()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">사용자 목록</span>
        <span style="font-size:12px;color:#757575;" id="total-count">총 10명</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:40px;">No</th>
              <th>이름</th>
              <th>이메일</th>
              <th>센터</th>
              <th>팀</th>
              <th class="col-left">접근 범위</th>
              <th>접속 권한</th>
            </tr>
          </thead>
          <tbody id="user-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../../assets/dummy-data/all-data.js"></script>
  <script src="../../../js/utils/data-loader.js"></script>
  <script src="../../../js/utils/auth-simulator.js"></script>
  <script src="../../../js/utils/formatters.js"></script>
  <script src="../../../js/components/sidebar.js"></script>
  <script src="../../../js/components/layout.js"></script>
  <script src="../../../js/components/modal.js"></script>
  <script src="../../../js/components/toast.js"></script>
  <script>
    const PERM_TREE = [
      { id: 'admin', label: '관리자 영역', children: [
        { id: 'admin-dashboard', label: '대시보드', children: [
          { id: 'qa-dashboard', label: 'QA 대시보드' }
        ]},
        { id: 'admin-eval', label: '평가 현황', children: [
          { id: 'auto-eval-status', label: '자동 평가 현황' },
          { id: 'manual-eval-status', label: '수동 평가 현황' }
        ]},
        { id: 'admin-settings', label: '평가 설정', children: [
          { id: 'eval-forms', label: '평가표 관리', children: [
            { id: 'auto-eval-forms', label: '자동 평가표 관리' },
            { id: 'manual-eval-forms', label: '수동 평가표 관리' }
          ]},
          { id: 'eval-items', label: '평가 항목 관리' },
          { id: 'eval-plans', label: '평가 계획', children: [
            { id: 'auto-eval-plans', label: '자동 평가 계획' },
            { id: 'manual-eval-plans', label: '수동 평가 계획' }
          ]}
        ]},
        { id: 'admin-analysis', label: '분석', children: [
          { id: 'detail-analysis', label: '상세 분석' },
          { id: 'comparative-analysis', label: '비교 분석' },
          { id: 'report-gen', label: '보고서 생성' }
        ]},
        { id: 'dispute-inbox', label: '이의제기 처리함' },
        { id: 'admin-system', label: '시스템 설정', children: [
          { id: 'user-mgmt', label: '사용자 관리' },
          { id: 'system-logs', label: '시스템 로그' },
          { id: 'eval-exclusions', label: '평가 제외 설정' },
          { id: 'prompt-templates', label: '프롬프트 템플릿' }
        ]}
      ]},
      { id: 'agent', label: '상담사 영역', children: [
        { id: 'my-dashboard', label: '나의 성과 대시보드' },
        { id: 'my-evaluations', label: '나의 평가 결과' },
        { id: 'my-disputes', label: '나의 이의제기' }
      ]},
      { id: 'data-scope', label: '데이터 범위', children: [
        { id: 'data-seoul', label: '서울센터', children: [
          { id: 'data-seoul-vip', label: 'VIP상담팀' },
          { id: 'data-seoul-general', label: '일반상담팀' },
          { id: 'data-seoul-tech', label: '기술지원팀' }
        ]},
        { id: 'data-busan', label: '부산센터', children: [
          { id: 'data-busan-general', label: '일반상담팀' },
          { id: 'data-busan-happycall', label: '해피콜팀' }
        ]},
        { id: 'data-daegu', label: '대구센터', children: [
          { id: 'data-daegu-cs', label: 'CS상담팀' },
          { id: 'data-daegu-ob', label: '아웃바운드팀' }
        ]}
      ]}
    ];

    // 중첩된 트리 구조에서 모든 권한 ID를 누락 없이 수집하기 위해 재귀 순회
    function getAllIds(nodes) {
      let ids = [];
      nodes.forEach(n => { ids.push(n.id); if (n.children) ids = ids.concat(getAllIds(n.children)); });
      return ids;
    }

    const PERM_BADGE_COLORS = {
      'admin':      'background:#E3F2FD;color:#1565C0;border:1px solid #BBDEFB;',
      'agent':      'background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9;',
      'data-scope': 'background:#FFF3E0;color:#E65100;border:1px solid #FFE0B2;'
    };

    // 개별 권한 나열 대신 최상위 카테고리 단위 뱃지로 표시해 테이블 가독성 확보
    function permBadges(perms) {
      if (!perms || perms.length === 0) return '<span style="color:#BDBDBD;font-size:11px;">미설정</span>';
      const badges = [];
      PERM_TREE.forEach(top => {
        const allIds = getAllIds([top]);
        const hasAny = allIds.some(id => perms.includes(id));
        if (hasAny) {
          const style = PERM_BADGE_COLORS[top.id] || 'background:#F5F5F5;color:#757575;border:1px solid #E0E0E0;';
          badges.push(`<span class="badge" style="font-size:10px;margin:1px 2px;${style}">${top.label}</span>`);
        }
      });
      return badges.length > 0 ? badges.join('') : '<span style="color:#BDBDBD;font-size:11px;">미설정</span>';
    }

    const users = [
      { no: 1, name: '김철수', email: 'cskim@company.com', center: '서울센터', team: '전체', status: 'active', statusText: '활성', joinDate: '2023-03-15',
        permissions: getAllIds(PERM_TREE) },
      { no: 2, name: '박영희', email: 'yhpark@company.com', center: '부산센터', team: '전체', status: 'active', statusText: '활성', joinDate: '2023-05-20',
        permissions: ['admin','admin-dashboard','qa-dashboard','admin-eval','auto-eval-status','manual-eval-status','admin-analysis','detail-analysis','comparative-analysis','report-gen','dispute-inbox','data-scope','data-busan','data-busan-general','data-busan-happycall'] },
      { no: 3, name: '이준호', email: 'jhlee@company.com', center: '서울센터', team: '고객지원1팀', status: 'active', statusText: '활성', joinDate: '2023-08-01',
        permissions: ['admin','admin-dashboard','qa-dashboard','admin-eval','auto-eval-status','manual-eval-status','admin-analysis','detail-analysis','comparative-analysis','data-scope','data-seoul','data-seoul-vip','data-seoul-general'] },
      { no: 4, name: '김민수', email: 'mskim@company.com', center: '서울센터', team: '고객지원1팀', status: 'active', statusText: '활성', joinDate: '2024-01-10',
        permissions: ['agent','my-dashboard','my-evaluations','my-disputes','data-scope','data-seoul','data-seoul-vip'] },
      { no: 5, name: '이서연', email: 'sylee@company.com', center: '서울센터', team: '고객지원2팀', status: 'active', statusText: '활성', joinDate: '2024-02-15',
        permissions: ['agent','my-dashboard','my-evaluations','my-disputes','data-scope','data-seoul','data-seoul-general'] },
      { no: 6, name: '박지훈', email: 'jhpark@company.com', center: '서울센터', team: '기술지원팀', status: 'active', statusText: '활성', joinDate: '2024-03-01',
        permissions: ['agent','my-dashboard','my-evaluations','my-disputes','data-scope','data-seoul','data-seoul-tech'] },
      { no: 7, name: '최유진', email: 'yjchoi@company.com', center: '부산센터', team: '고객지원1팀', status: 'active', statusText: '활성', joinDate: '2024-04-20',
        permissions: ['agent','my-dashboard','my-evaluations','my-disputes','data-scope','data-busan','data-busan-general'] },
      { no: 8, name: '정다은', email: 'dejung@company.com', center: '부산센터', team: '영업지원팀', status: 'active', statusText: '활성', joinDate: '2024-05-10',
        permissions: ['agent','my-dashboard','my-evaluations','my-disputes','data-scope','data-busan','data-busan-happycall'] },
      { no: 9, name: '한승우', email: 'swhan@company.com', center: '서울센터', team: '고객지원2팀', status: 'inactive', statusText: '비활성', joinDate: '2024-06-01',
        permissions: ['agent','my-dashboard','my-evaluations','data-scope','data-seoul','data-seoul-general'] },
      { no: 10, name: '윤하나', email: 'hnyoon@company.com', center: '부산센터', team: '기술지원팀', status: 'inactive', statusText: '비활성', joinDate: '2024-07-15',
        permissions: ['agent','my-dashboard','my-evaluations','data-scope','data-busan','data-busan-happycall'] },
      { no: 11, name: '강민재', email: 'mjkang@company.com', center: '대구센터', team: 'CS상담팀', status: 'active', statusText: '활성', joinDate: '2024-08-01',
        permissions: ['agent','my-dashboard','my-evaluations','my-disputes','data-scope','data-daegu','data-daegu-cs'] },
      { no: 12, name: '조은서', email: 'esjo@company.com', center: '대구센터', team: '아웃바운드팀', status: 'active', statusText: '활성', joinDate: '2024-09-15',
        permissions: ['agent','my-dashboard','my-evaluations','my-disputes','data-scope','data-daegu','data-daegu-ob'] }
    ];

    // innerHTML 일괄 교체로 DOM 조작 횟수를 최소화
    function renderTable(data) {
      const tbody = document.getElementById('user-tbody');
      document.getElementById('total-count').textContent = `총 ${data.length}명`;
      tbody.innerHTML = data.map(u => `
        <tr onclick="openDetail(${u.no})">
          <td>${u.no}</td>
          <td style="font-weight:500;">${u.name}</td>
          <td style="font-size:12px;color:#757575;">${u.email || ''}</td>
          <td>${u.center}</td>
          <td>${u.team}</td>
          <td class="col-left" style="max-width:260px;">${permBadges(u.permissions)}</td>
          <td>${AICC_Fmt.statusBadge(u.status, u.statusText)}</td>
        </tr>
      `).join('');
    }

    /* 센터별 소속 팀 매핑 — 센터 변경 시 팀 드롭다운을 종속 갱신 */
    const centerTeamMap = {
      '서울센터': ['VIP상담팀','일반상담팀','기술지원팀','고객지원1팀','고객지원2팀'],
      '부산센터': ['일반상담팀','해피콜팀','고객지원1팀','영업지원팀','기술지원팀'],
      '대구센터': ['CS상담팀','아웃바운드팀']
    };

    function onWsChange() {
      const wsVal = document.getElementById('ws-filter').value;
      const teamSel = document.getElementById('team-filter');
      teamSel.innerHTML = '<option value="all">전체</option>';
      if (wsVal !== 'all' && centerTeamMap[wsVal]) {
        teamSel.disabled = false;
        centerTeamMap[wsVal].forEach(t => { teamSel.innerHTML += '<option value="' + t + '">' + t + '</option>'; });
      } else if (wsVal === 'all') {
        teamSel.disabled = false;
        const allTeams = [...new Set(users.map(u => u.team).filter(t => t && t !== '전체'))];
        allTeams.forEach(t => { teamSel.innerHTML += '<option value="' + t + '">' + t + '</option>'; });
      }
      filterUsers();
    }

    function filterUsers() {
      const statusVal = document.getElementById('status-filter').value;
      const searchVal = (document.getElementById('search-input').value || '').trim().toLowerCase();
      const wsVal = document.getElementById('ws-filter').value;
      const teamVal = document.getElementById('team-filter').value;
      const emailSearch = (document.getElementById('email-search').value || '').trim().toLowerCase();
      let filtered = users;
      if (wsVal !== 'all') filtered = filtered.filter(u => u.center === wsVal);
      if (teamVal !== 'all') filtered = filtered.filter(u => u.team === teamVal);
      if (statusVal !== 'all') filtered = filtered.filter(u => u.status === statusVal);
      if (searchVal) filtered = filtered.filter(u => u.name.toLowerCase().includes(searchVal));
      if (emailSearch) filtered = filtered.filter(u => (u.email || '').toLowerCase().includes(emailSearch));
      renderTable(filtered);
    }

    /* ── 트리 렌더링 ── */
    // 재귀 렌더링으로 트리 깊이에 무관하게 동일한 체크박스 UI 패턴 적용
    function renderPermTree(nodes, checkedIds, depth, readonly) {
      const d = depth || 0;
      const ro = !!readonly;
      return nodes.map(n => {
        const hasKids = n.children && n.children.length > 0;
        const isChecked = checkedIds.includes(n.id);
        const pad = d * 20;
        const chkId = 'perm-' + n.id;
        if (hasKids) {
          const allChildIds = getAllIds(n.children);
          const allChecked = allChildIds.every(id => checkedIds.includes(id));
          const someChecked = allChildIds.some(id => checkedIds.includes(id));
          return `
            <div style="margin-left:${pad}px;">
              <div style="display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer;" onclick="togglePermGroup(this)">
                <span class="perm-arrow" style="font-size:10px;color:#9E9E9E;width:14px;text-align:center;transition:transform .2s;transform:rotate(90deg);">▶</span>
                <input type="checkbox" id="${chkId}" data-perm-id="${n.id}" ${allChecked ? 'checked' : ''} ${(!allChecked && someChecked) ? 'data-indeterminate="true"' : ''} ${ro ? 'disabled' : `onchange="onPermCheck('${n.id}', this.checked)"`} onclick="event.stopPropagation()">
                <label for="${chkId}" style="font-size:13px;font-weight:600;cursor:pointer;" onclick="event.stopPropagation()">${n.label}</label>
              </div>
              <div class="perm-children" style="display:block;">
                ${renderPermTree(n.children, checkedIds, d + 1, ro)}
              </div>
            </div>`;
        }
        return `
          <div style="margin-left:${pad}px;">
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;">
              <span style="width:14px;"></span>
              <input type="checkbox" id="${chkId}" data-perm-id="${n.id}" ${isChecked ? 'checked' : ''} ${ro ? 'disabled' : `onchange="onPermCheck('${n.id}', this.checked)"`}>
              <label for="${chkId}" style="font-size:13px;cursor:pointer;">${n.label}</label>
            </div>
          </div>`;
      }).join('');
    }

    // 하위 노드 접기/펼치기로 깊은 트리의 시각적 복잡도 감소
    function togglePermGroup(el) {
      const arrow = el.querySelector('.perm-arrow');
      const children = el.nextElementSibling;
      if (!children) return;
      const isOpen = children.style.display !== 'none';
      children.style.display = isOpen ? 'none' : 'block';
      if (arrow) arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
    }

    // 깊이 우선 탐색으로 트리 내 특정 노드를 찾는 유틸리티
    function findNode(nodes, id) {
      for (const n of nodes) {
        if (n.id === id) return n;
        if (n.children) { const f = findNode(n.children, id); if (f) return f; }
      }
      return null;
    }

    // 자식 체크 변경 시 부모의 indeterminate 상태 갱신에 필요
    function findParent(nodes, id, parent) {
      for (const n of nodes) {
        if (n.id === id) return parent;
        if (n.children) { const f = findParent(n.children, id, n); if (f) return f; }
      }
      return null;
    }

    // 부모 체크 시 모든 자식을 일괄 토글하고, 역으로 부모 상태도 동기화
    function onPermCheck(id, checked) {
      const node = findNode(PERM_TREE, id);
      if (!node) return;
      if (node.children) {
        const allIds = getAllIds(node.children);
        allIds.forEach(cid => {
          const el = document.querySelector(`[data-perm-id="${cid}"]`);
          if (el) { el.checked = checked; el.indeterminate = false; }
        });
      }
      updateParentState(PERM_TREE, id);
    }

    // 자식 체크 상태 기반으로 부모의 checked/indeterminate를 재귀적으로 동기화
    function updateParentState(tree, changedId) {
      const parent = findParent(tree, changedId, null);
      if (!parent || !parent.children) return;
      const childIds = getAllIds(parent.children);
      const checkStates = childIds.map(cid => {
        const el = document.querySelector(`[data-perm-id="${cid}"]`);
        return el ? el.checked : false;
      });
      const allChecked = checkStates.every(Boolean);
      const someChecked = checkStates.some(Boolean);
      const parentEl = document.querySelector(`[data-perm-id="${parent.id}"]`);
      if (parentEl) {
        parentEl.checked = allChecked;
        parentEl.indeterminate = !allChecked && someChecked;
      }
      updateParentState(tree, parent.id);
    }

    // DOM에서 직접 체크 상태를 읽어 별도 상태 관리 없이 현재 권한 목록 확보
    function getCheckedPerms() {
      return [...document.querySelectorAll('[data-perm-id]')]
        .filter(el => el.checked)
        .map(el => el.dataset.permId);
    }

    // HTML attribute로는 indeterminate 설정이 불가하므로 JS로 후처리
    function initIndeterminate() {
      document.querySelectorAll('[data-indeterminate="true"]').forEach(el => {
        el.indeterminate = true;
        el.removeAttribute('data-indeterminate');
      });
    }

    /* ── 읽기 전용 모달 ── */
    // 동일한 권한 트리를 disabled 상태로 재사용해 읽기/수정 모드 간 일관성 유지
    function buildReadonlyHtml(u) {
      const treeHtml = renderPermTree(PERM_TREE, u.permissions || [], 0, true);
      return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
          <div>
            <div class="form-label">이름</div>
            <div style="font-size:14px;font-weight:500;padding:8px 0;">${u.name}</div>
          </div>
          <div>
            <div class="form-label">이메일</div>
            <div style="font-size:14px;padding:8px 0;">${u.email}</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
          <div>
            <div class="form-label">센터</div>
            <div style="font-size:14px;padding:8px 0;">${u.center}</div>
          </div>
          <div>
            <div class="form-label">팀</div>
            <div style="font-size:14px;padding:8px 0;">${u.team}</div>
          </div>
          <div>
            <div class="form-label">접속 권한</div>
            <div style="padding:8px 0;">${AICC_Fmt.statusBadge(u.status, u.statusText)}</div>
          </div>
        </div>
        <div style="margin-bottom:16px;">
          <span class="form-label">가입일</span>
          <span style="font-size:13px;color:#757575;margin-left:8px;">${AICC_Fmt.date(u.joinDate)}</span>
        </div>
        <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
          <div class="form-label" style="font-weight:700;margin-bottom:8px;">접근 범위</div>
          <div style="max-height:380px;overflow-y:auto;border:1px solid #E0E0E0;border-radius:6px;padding:12px 14px;background:#FAFAFA;">
            ${treeHtml}
          </div>
        </div>
      `;
    }

    /* ── 수정 모달 ── */
    // 수정 모달용 HTML을 별도 생성해 읽기 모드와 명확히 분리
    function buildEditHtml(u) {
      const treeHtml = renderPermTree(PERM_TREE, u.permissions || [], 0, false);
      return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
          <div>
            <div class="form-label">이름 *</div>
            <input type="text" class="form-input" id="uf-name" style="width:100%;" value="${u.name}">
          </div>
          <div>
            <div class="form-label">이메일 *</div>
            <input type="email" class="form-input" id="uf-email" style="width:100%;" value="${u.email}">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
          <div>
            <div class="form-label">센터</div>
            <select class="form-select" id="uf-ws" style="width:100%;">
              <option value="서울센터" ${u.center === '서울센터' ? 'selected' : ''}>서울센터</option>
              <option value="부산센터" ${u.center === '부산센터' ? 'selected' : ''}>부산센터</option>
            </select>
          </div>
          <div>
            <div class="form-label">팀</div>
            <select class="form-select" id="uf-team" style="width:100%;">
              <option ${u.team === '전체' ? 'selected' : ''}>전체</option>
              <option ${u.team === '고객지원1팀' ? 'selected' : ''}>고객지원1팀</option>
              <option ${u.team === '고객지원2팀' ? 'selected' : ''}>고객지원2팀</option>
              <option ${u.team === '기술지원팀' ? 'selected' : ''}>기술지원팀</option>
              <option ${u.team === '영업지원팀' ? 'selected' : ''}>영업지원팀</option>
            </select>
          </div>
          <div>
            <div class="form-label">접속 권한</div>
            <select class="form-select" id="uf-status" style="width:100%;">
              <option value="active" ${u.status === 'active' ? 'selected' : ''}>활성</option>
              <option value="inactive" ${u.status === 'inactive' ? 'selected' : ''}>비활성</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:16px;">
          <span class="form-label">가입일</span>
          <span style="font-size:13px;color:#757575;margin-left:8px;">${AICC_Fmt.date(u.joinDate)}</span>
        </div>
        <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
          <div class="form-label" style="font-weight:700;margin-bottom:8px;">접근 범위</div>
          <div style="max-height:380px;overflow-y:auto;border:1px solid #E0E0E0;border-radius:6px;padding:12px 14px;background:#FAFAFA;">
            ${treeHtml}
          </div>
        </div>
      `;
    }

    // 읽기 전용 상세 모달을 열고, DOM 렌더 완료 후 indeterminate 상태를 초기화
    function openDetail(no) {
      const u = users.find(x => x.no === no);
      if (!u) return;
      AICC_Modal.open({
        title: '사용자 상세 - ' + u.name,
        content: buildReadonlyHtml(u),
        footer: `
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
          <button class="btn btn-primary" onclick="openEditMode(${u.no})">수정</button>
        `,
        size: 'lg'
      });
      // 모달 DOM 삽입 후 indeterminate 속성을 JS로 설정해야 하므로 지연 실행
      setTimeout(initIndeterminate, 50);
    }

    // 기존 모달 닫기 후 setTimeout으로 전환 애니메이션 충돌 방지
    function openEditMode(no) {
      const u = users.find(x => x.no === no);
      if (!u) return;
      AICC_Modal.close();
      setTimeout(() => {
        AICC_Modal.open({
          title: '사용자 수정 - ' + u.name,
          content: buildEditHtml(u),
          footer: `
            <button class="btn btn-danger" onclick="handleUserAction(${u.no}, '삭제')">삭제</button>
            <div style="flex:1;"></div>
            <button class="btn btn-secondary" onclick="openDetail(${u.no})">취소</button>
            <button class="btn btn-primary" onclick="handleUserAction(${u.no}, '저장')">저장</button>
          `,
          size: 'lg'
        });
        setTimeout(initIndeterminate, 50);
      }, 200);
    }

    // 프로토타입이므로 실제 서버 요청 없이 토스트로 액션 완료 시뮬레이션
    function handleUserAction(no, action) {
      AICC_Modal.close();
      AICC_Toast.show('사용자 ' + action + '가 완료되었습니다.');
    }

    // 센터 선택 시 팀 드롭다운을 종속 갱신하는 등록 모달 전용 헬퍼
    function onRegWsChange() {
      const ws = document.getElementById('reg-ws').value;
      const teamSel = document.getElementById('reg-team');
      teamSel.innerHTML = '<option value="">팀 선택</option>';
      if (ws && centerTeamMap[ws]) {
        centerTeamMap[ws].forEach(t => { teamSel.innerHTML += '<option value="' + t + '">' + t + '</option>'; });
      }
    }

    function openAddUserModal() {
      const centerOptions = Object.keys(centerTeamMap).map(c => `<option value="${c}">${c}</option>`).join('');
      AICC_Modal.open({
        title: '사용자 등록',
        content: `<div style="display:flex;flex-direction:column;gap:14px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label class="form-label">이름 *</label><input type="text" class="form-input" id="reg-name" style="width:100%;" placeholder="이름"></div>
            <div><label class="form-label">이메일 *</label><input type="email" class="form-input" id="reg-email" style="width:100%;" placeholder="email@company.com"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label class="form-label">센터 *</label><select class="form-select" id="reg-ws" style="width:100%;" onchange="onRegWsChange()"><option value="">센터 선택</option>${centerOptions}</select></div>
            <div><label class="form-label">팀 *</label><select class="form-select" id="reg-team" style="width:100%;"><option value="">팀 선택</option></select></div>
          </div>
          <div>
            <label class="form-label">접속 권한</label>
            <select class="form-select" id="reg-status" style="width:100%;">
              <option value="active">활성</option>
              <option value="inactive">비활성</option>
            </select>
          </div>
        </div>`,
        footer: `<button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
                 <button class="btn btn-primary" onclick="saveNewUser()">등록</button>`,
        size: 'md'
      });
    }

    function saveNewUser() {
      const name = (document.getElementById('reg-name').value || '').trim();
      const email = (document.getElementById('reg-email').value || '').trim();
      const center = document.getElementById('reg-ws').value;
      const team = document.getElementById('reg-team').value;
      const status = document.getElementById('reg-status').value;
      if (!name) { AICC_Toast.show('이름을 입력하세요.'); return; }
      if (!email) { AICC_Toast.show('이메일을 입력하세요.'); return; }
      if (!center) { AICC_Toast.show('센터를 선택하세요.'); return; }
      if (!team) { AICC_Toast.show('팀을 선택하세요.'); return; }
      const newNo = users.length > 0 ? Math.max(...users.map(u => u.no)) + 1 : 1;
      const today = new Date().toISOString().slice(0, 10);
      users.push({
        no: newNo, name, email, center, team,
        status, statusText: status === 'active' ? '활성' : '비활성',
        joinDate: today, permissions: []
      });
      filterUsers();
      AICC_Modal.close();
      AICC_Toast.show('사용자가 등록되었습니다.');
    }

    // 모든 필터를 초기값으로 복원 후 전체 데이터로 테이블 재렌더링
    function resetUserFilter() {
      document.getElementById('ws-filter').value = 'all';
      document.getElementById('team-filter').value = 'all';
      document.getElementById('status-filter').value = 'all';
      document.getElementById('search-input').value = '';
      document.getElementById('email-search').value = '';
      renderTable(users);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const wsList = [...new Set(users.map(u => u.center).filter(Boolean))];
      const wsSel = document.getElementById('ws-filter');
      wsList.forEach(w => { wsSel.innerHTML += '<option value="' + w + '">' + w + '</option>'; });
      const teamList = [...new Set(users.map(u => u.team).filter(t => t && t !== '전체'))];
      const teamSel = document.getElementById('team-filter');
      teamList.forEach(t => { teamSel.innerHTML += '<option value="' + t + '">' + t + '</option>'; });
      renderTable(users);
    });
  </script>
</body>
</html>
