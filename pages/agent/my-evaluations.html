    document.addEventListener('DOMContentLoaded', () => {
      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function() { applyFilter(); }
      });

      // 데이터에서 평가표 목록을 동적 추출하여 새 평가표 추가 시 코드 수정 불필요
      const formNames = [...new Set(allEvals.map(e => e.eval_form).filter(Boolean))];
      const formSel = document.getElementById('form-filter');
      formNames.forEach(f => { formSel.innerHTML += '<option value="' + f + '">' + f + '</option>'; });

      renderEvalTable(allEvals);
    });

    // 다중 조건 AND 결합 + early return 패턴으로 불필요한 비교 최소화
    function applyFilter() {
      const scoreRange = document.getElementById('score-filter').value;
      const callType = document.getElementById('type-filter').value;
      const formVal = document.getElementById('form-filter').value;
      const issueVal = document.getElementById('issue-filter').value;
      const confVal = document.getElementById('confidence-filter').value;
      const consultSearch = (document.getElementById('consult-search').value || '').trim().toLowerCase();

      filteredEvals = allEvals.filter(ev => {
        if (scoreRange === 'high' && ev.score < 80) return false;
        if (scoreRange === 'mid' && (ev.score < 60 || ev.score >= 80)) return false;
        if (scoreRange === 'low' && ev.score >= 60) return false;
        if (callType !== 'all' && ev.type !== callType) return false;
        if (formVal !== 'all' && ev.eval_form !== formVal) return false;
        if (issueVal === 'yes' && (!ev.issue || ev.issue === '-')) return false;
        if (issueVal === 'no' && ev.issue && ev.issue !== '-') return false;
        if (confVal !== 'all' && ev.confidence !== confVal) return false;
        if (consultSearch && !(ev.consultation_type || '').toLowerCase().includes(consultSearch)) return false;
        return true;
      });

      renderEvalTable(filteredEvals);
      AICC_Toast.show('필터가 적용되었습니다.');
    }

    // 서버 재요청 없이 클라이언트 측에서 즉시 전체 데이터로 복원
    function resetFilter() {
      document.getElementById('score-filter').value = 'all';
      document.getElementById('type-filter').value = 'all';
      document.getElementById('form-filter').value = 'all';
      document.getElementById('issue-filter').value = 'all';
      document.getElementById('confidence-filter').value = 'all';
      document.getElementById('consult-search').value = '';
      filteredEvals = [...allEvals];
      renderEvalTable(filteredEvals);
    }

    // 필터 결과를 즉시 반영하고 건수를 갱신하여 사용자에게 피드백 제공
    function renderEvalTable(evals) {
      const tbody = document.getElementById('eval-tbody');
      document.getElementById('eval-count').textContent = '총 ' + evals.length + '건';

      tbody.innerHTML = evals.map(ev => {
        const typeBadge = ev.type === 'I/B'
          ? '<span class="badge badge-nlp">I/B</span>'
          : '<span class="badge badge-ai">O/B</span>';
        const confBadge = ev.confidence === 'High'
          ? '<span class="badge badge-active">High</span>'
          : ev.confidence === 'Medium'
          ? '<span class="badge badge-pending">Mid</span>'
          : '<span class="badge badge-rejected">Low</span>';
        const issueHtml = ev.issue === '-'
          ? '<span style="color:#9E9E9E;font-size:12px;">-</span>'
          : '<span style="font-size:12px;color:#F57F17;">' + ev.issue + '</span>';

        return `
          <tr onclick="showEvalDetail('${ev.id}')">
            <td style="font-size:12px;font-family:monospace;">${ev.id}</td>
            <td style="font-size:12px;">${ev.date} ${ev.time}</td>
            <td>${typeBadge}</td>
            <td style="font-size:12px;">${ev.duration}</td>
            <td>${AICC_Fmt.scoreHtml(ev.score)}</td>
            <td>${confBadge}</td>
            <td class="col-left" style="max-width:140px;">${issueHtml}</td>
          </tr>
        `;
      }).join('');
    }

    // 페이지 이동 없이 모달로 상세 정보를 표시하여 목록 컨텍스트 유지
    function showEvalDetail(evalId) {
      const ev = allEvals.find(e => e.id === evalId);
      if (!ev) return;

      const scoreRows = ev.items.map(item => {
        const statusCls = item.status === 'pass' ? 'score-good' : item.status === 'warn' ? 'score-warn' : 'score-danger';
        const statusText = item.status === 'pass' ? '통과' : item.status === 'warn' ? '주의' : '미달';
        return `
          <tr style="cursor:default;">
            <td style="font-size:12px;">${item.name}</td>
            <td>${AICC_Fmt.typeBadge(item.type)}</td>
            <td style="font-weight:500;">${item.score} / ${item.max}</td>

                  <th>평가 항목</th>
                  <th>방식</th>
                  <th>점수</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody>${scoreRows}</tbody>
            </table>
          </div>

          <div id="script-tab-${ev.id}" style="display:none;">
            <div style="background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;padding:16px;max-height:400px;overflow-y:auto;">
              ${transcriptHtml}
            </div>
          </div>
        `,
        footer: `
          <button class="btn btn-secondary" onclick="openDisputeForm('${ev.id}', ${ev.score})">이의 제기</button>
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
        `
      });
    }

    // 모달 내부 DOM으로 탭 전환 범위를 한정하여 외부 요소 간섭 방지
    function switchDetailTab(btn, tabId) {
      const allTabs = btn.parentElement.querySelectorAll('.tab-item');
      allTabs.forEach(t => t.classList.remove('active'));
      btn.classList.add('active');

      // 현재 모달 내의 탭 컨텐츠 토글
      const modal = btn.closest('.modal-body');
      const panels = modal.querySelectorAll('[id^="scores-tab-"], [id^="script-tab-"]');
      panels.forEach(p => p.style.display = 'none');
      document.getElementById(tabId).style.display = '';
    }

    // 모달 닫기→열기 시 애니메이션 충돌 방지를 위해 300ms 지연 후 새 모달 표시
    function openDisputeForm(evalId, currentScore) {
      AICC_Modal.close();

      setTimeout(() => {
        AICC_Modal.open({
          title: '이의 제기 - ' + evalId,
          size: 'md',
          content: `
            <div style="margin-bottom:16px;">
              <div style="display:flex;gap:16px;margin-bottom:16px;padding:12px;background:#F5F5F5;border-radius:6px;">
                <div><span style="font-size:12px;color:#757575;">평가 ID</span><br><strong>${evalId}</strong></div>
                <div><span style="font-size:12px;color:#757575;">현재 점수</span><br><strong>${currentScore}점</strong></div>
              </div>

              <div style="margin-bottom:12px;">
                <label class="form-label">이의 제기 항목</label>
                <select class="form-select" style="width:100%;" id="dispute-item">
                  <option value="">항목 선택</option>
                  <option value="인사 멘트">인사 멘트</option>
                  <option value="고객 확인">고객 확인</option>
                  <option value="경청/공감">경청/공감</option>
                  <option value="문제 파악">문제 파악</option>
                  <option value="해결 제시">해결 제시</option>
                  <option value="정확성">정확성</option>
                  <option value="종결 멘트">종결 멘트</option>
                </select>
              </div>

              <div style="margin-bottom:12px;">
                <label class="form-label">요청 점수</label>
                <input type="number" class="form-input" style="width:100%;" id="dispute-score" placeholder="변경 요청할 점수를 입력하세요" min="0" max="100" step="0.5">
              </div>

              <div>
                <label class="form-label">이의 제기 사유</label>
                <textarea class="form-input" style="width:100%;height:120px;resize:vertical;" id="dispute-reason" placeholder="이의 제기 사유를 상세히 작성해 주세요.&#10;예: 해당 통화에서 공감 표현을 3회 이상 사용하였으나 인식되지 않았습니다."></textarea>
              </div>
            </div>
          `,
          footer: `
            <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
            <button class="btn btn-primary" onclick="submitDispute('${evalId}')">이의 제기 제출</button>
          `
        });
      }, 300);
    }

    // 필수 입력값을 단계적으로 검증하여 누락 항목을 순차 안내
    function submitDispute(evalId) {
      const item = document.getElementById('dispute-item').value;
      const score = document.getElementById('dispute-score').value;
      const reason = document.getElementById('dispute-reason').value;

      if (!item) {
        AICC_Toast.show('이의 제기 항목을 선택해 주세요.');
        return;
      }
      if (!reason.trim()) {
        AICC_Toast.show('이의 제기 사유를 입력해 주세요.');
        return;
      }

      AICC_Modal.close();
      AICC_Toast.show('이의 제기가 제출되었습니다. (시뮬레이션)');
    }
  </script>
</body>
</html>
