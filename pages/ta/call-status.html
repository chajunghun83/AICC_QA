      if (!isFlowFiltered && flowPatterns.length > 0) {
        findingItems.push(_mkSubInsight('상담 흐름',
          flowPatterns.slice(0,3).map(f => ({
            label: f.name, count: f.count,
            filterFn: c => c.aiAnalysis && c.aiAnalysis.flowPattern === f.name,
            filterLabel: f.name
          })), canInteract && flowPatterns[0].count >= 2, ' / '));
      }

      /* [Phase 2] 3-b) 고객 의도 달성률
       *  [프로토타입] intentAchieved boolean을 집계하여 달성률 산출.
       *   미달성 건의 rootCause를 추가 집계하여 주요 원인 제시.
       *  [실제 운영] LLM이 스크립트를 분석하여 고객 의도 달성 여부를
       *   판단하고, 미달성 원인을 교차 분석한다. */
      if (!isIntentFiltered && intentRate.notAchieved > 0) {
        const failCauses = _aggByField(intentRate.notAchievedCalls.filter(c => c.aiAnalysis), c => c.aiAnalysis.rootCause);
        const topFailCause = failCauses.length > 0 ? failCauses[0].name : '-';
        findingItems.push({
          text:`고객 의도 달성률 ${intentRate.rate}%(${intentRate.achieved}/${intentRate.achieved + intentRate.notAchieved}) — 미달성 ${intentRate.notAchieved}건 주 원인: ${topFailCause}`,
          keyword: canInteract && intentRate.notAchieved >= 2 ? '의도 미달성' : null,
          filterFn: c => c.aiAnalysis && c.aiAnalysis.intentAchieved === false,
          filterLabel: '의도 미달성'
        });
      }

      /* [Phase 2] 3-c) 빈출 발화 패턴 (정보성 인사이트, 드릴다운 불가)
       *  [프로토타입] keyUtterances의 reason을 기준으로 그룹핑하여 빈출 패턴 추출.
       *  [실제 운영] LLM이 다수 콜의 핵심 발화를 교차 분석하여
       *   반복되는 고객 불만/요구 패턴을 도출한다.
       *   프롬프트: "다음 N건의 핵심 발화에서 반복되는 패턴을 찾아주세요." */
      if (total >= 5) {
        const topUtterances = _aggKeyUtterances(calls, 2);
        topUtterances.forEach(u => {
          if (u.count >= 3) {
            findingItems.push({
              text:`"${u.text.length > 25 ? u.text.substring(0,25) + '...' : u.text}" 유사 발화 ${u.count}건 — ${u.reason}`,
              keyword: null, filterFn: null, filterLabel: null
            });
          }
        });
      }

      /* 4) 소수 콜(5건 이하)일 때 개별 AI 분석 요약 제공 */
      if (total <= 5 && withAi.length > 0) {
        withAi.slice(0, 3).forEach(c => {
          findingItems.push({
            text:`[${c.id}] ${c.aiAnalysis.summary}`,
            keyword: null, filterFn: cc => cc.id === c.id, filterLabel: c.id
          });
        });
      }

      if (findingItems.length > 0) {
        insights.push({ type:'finding', label:'핵심 발견', color:'#1565C0', items: findingItems });
      }

      /* ─── 위험 신호: tags 위험 패턴 + 상담 품질 ─── */
      const warningItems = [];

      /* tags 기반 위험 패턴 — 이미 해당 tag로 필터 적용 시 생략 */
      if (!isTagFiltered) {
        const riskMap = {
          '장기미체결':'고객 이탈 위험 높음',
          '후속조치미이행':'재인입 유발 위험',
          '시스템장애':'시스템 점검 필요',
          '처리지연':'처리 프로세스 점검 필요',
          '환매지연':'고객 불만 확대 위험'
        };
        const riskTagNames = Object.keys(riskMap);
        /* [사용자 결정 A안] 위험 태그가 여러 개여도 개별 항목으로 나열하지 않고
         *  "위험 패턴 감지" 단일 헤더 + chip(태그별)으로 묶는다 */
        const riskTags = allTags.filter(t => riskTagNames.includes(t.name));
        if (riskTags.length > 0) {
          warningItems.push(_mkSubInsight('위험 패턴 감지',
            riskTags.slice(0,3).map(t => ({
              label: t.name, count: t.count,
              filterFn: c => c.aiAnalysis && (c.aiAnalysis.tags||[]).includes(t.name),
              filterLabel: t.name
            })), canInteract));
        }
      }

      /* [Phase 2] riskFlags 기반 위험 집계 — tags와 별도로 직접적인 위험 신호 표시
       *  [프로토타입] riskFlags 배열을 단순 집계한다.
       *  [실제 운영] LLM이 스크립트에서 불만/이탈/재인입 위험 신호를 감지하여
       *   riskFlags를 생성한다. 여기서는 그 결과를 집계만 한다. */
      if (!isRiskFlagFiltered && riskFlagAgg.length > 0) {
        warningItems.push(_mkSubInsight('위험 신호 감지',
          riskFlagAgg.slice(0,3).map(r => ({
            label: r.name, count: r.count,
            filterFn: c => c.aiAnalysis && (c.aiAnalysis.riskFlags||[]).includes(r.name),
            filterLabel: r.name
          })), canInteract && riskFlagAgg[0].count >= 2));
      }

      /* [Phase 2] 복합 위험: 의도 미달성 + 후속 조치 필요 — 재인입 가능성 최고 수준 */
      if (!isIntentFiltered && !isStatusFiltered) {
        const compoundRisk = withAi.filter(c =>
          c.aiAnalysis.intentAchieved === false && c.aiAnalysis.status === 'followup');
        if (compoundRisk.length >= 2) {
          warningItems.push({
            text:`의도 미달성 + 후속 조치 필요 ${compoundRisk.length}건 — 재인입 가능성 매우 높음`,
            keyword: canInteract ? '복합 위험' : null,
            filterFn: c => c.aiAnalysis && c.aiAnalysis.intentAchieved === false && c.aiAnalysis.status === 'followup',
            filterLabel: '복합 위험'
          });
        }
      }

      /* 상담 품질: 대안 미제시 */
      if (noAltCount > 0 && withAi.length > 0 && noAltCount >= Math.ceil(withAi.length * 0.2)) {
        warningItems.push({
          text:`대안 미제시 상담 ${noAltCount}건(${Math.round(noAltCount/withAi.length*100)}%) — 1차 해결 기회 손실`,
          keyword: canInteract && noAltCount >= 2 ? '대안 미제시' : null,
          filterFn: c => c.aiAnalysis && c.aiAnalysis.agentEval && !c.aiAnalysis.agentEval.alternativeProvided,
          filterLabel: '대안 미제시'
        });
      }

      /* 상담 품질: 부적절한 마무리 */
      if (badClosingCount >= 2) {
        warningItems.push({
          text:`부적절한 마무리 ${badClosingCount}건 — 재인입 유발 가능`,
          keyword: canInteract ? '부적절한 마무리' : null,
          filterFn: c => c.aiAnalysis && c.aiAnalysis.agentEval && !c.aiAnalysis.agentEval.closingProper,
          filterLabel: '부적절한 마무리'
        });
      }

      /* 상담 품질 점수 — 전체 평균 대비 낮을 때 */
      if (withAi.length > 0 && avgScore < globalAvg - 3) {
        warningItems.push({
          text:`평균 상담 품질 점수 ${avgScore}점 — 전체 평균(${globalAvg}점) 대비 ${globalAvg - avgScore}점 낮음`,
          keyword: null, filterFn: null, filterLabel: null
        });
      }

      /* 재인입 — 이미 재인입으로 필터 적용 시 생략 */
      if (!isReentryFiltered && reentCalls.length > 0) {
        const reentRate = Math.round(reentCalls.length / total * 100);
        warningItems.push({
          text:`재인입 ${reentCalls.length}건(${reentRate}%) — 이전 상담 완결 품질 점검 필요`,
          keyword: canInteract && reentCalls.length >= 2 ? '재인입' : null,
          filterFn: c => c.reentry >= 2,
          filterLabel: '재인입 콜'
        });
      }

      /* 피크 시간 — 이미 시간대 필터 적용 시 생략 */
      if (!isTimeFiltered) {
        const hd = _aggHourDist(calls);
        const peak = hd.length > 0 ? hd.reduce((a,b) => b.count > a.count ? b : a) : null;
        if (peak && peak.count >= 3) {
          warningItems.push({
            text:`콜 집중 시간대: ${peak.hour}시(${peak.count}건) — 피크 타임 대응 점검`,
            keyword: canInteract ? `${peak.hour}시` : null,
            filterFn: c => parseInt(c.time.split(':')[0],10) === peak.hour,
            filterLabel: `${peak.hour}시 콜`
          });
        }
      }

      if (warningItems.length > 0) {
        insights.push({ type:'warning', label:'위험 신호', color:'#E65100', items: warningItems });
      }

      /* ─── 조치 필요: suggestedAction 기반 구체적 제안 ─── */
      const actionItems = [];
      /* [3개 cap] 제안 조치가 많아도 상위 3개만 표시 */
      suggestedActions.filter(sa => sa.name).slice(0, 3).forEach(sa => {
        actionItems.push({
          text:`${sa.name} — 관련 콜 ${sa.count}건`,
          keyword: canInteract && sa.count >= 2 ? sa.name : null,
          filterFn: c => c.aiAnalysis && c.aiAnalysis.suggestedAction === sa.name,
          filterLabel: sa.name
        });
      });
      if (actionItems.length > 0) {
        insights.push({ type:'action', label:'조치 필요', color:'#6A1B9A', items: actionItems });
      }

      /* ─── 운영 정보: 이슈 없는 일반 콜만 있을 때 ─── */
      if (issueCalls.length === 0 && total > 0) {
        const avgDurSec = Math.round(calls.reduce((s,c) => s + parseDurationSec(c.duration), 0) / total);
        insights.push({ type:'trend', label:'운영 정보', color:'#2E7D32', items:[
          { text:`전체 ${total}건 모두 이슈 없음 — 정상 처리 현황`, keyword:null, filterFn:null, filterLabel:null },
          { text:`평균 통화시간 ${formatSecondsMMSS(avgDurSec)}`, keyword:null, filterFn:null, filterLabel:null }
        ]});
      }

      return insights;
    }

    /* ── 패널별 클릭 핸들러 ──────────────────────────────────────
     *  L1 클릭 → Top5 숨기고 L2 패널 열기
     *  L2 클릭 → L3 패널 열기
     *  L3 클릭 → 테이블만 필터 (드릴다운 없음, 토글)
     * ─────────────────────────────────────────────────────────── */
    function _onL1Click(fnIdx) {
      const entry = _regL1[fnIdx];
      if (!entry) return;
      _aiHistory = [{ label: entry.filterLabel, filterFn: entry.filterFn }];
      _aiLevel = 2;
      _drillDataL2 = null; _drillDataL3 = null;
      _l3FilterLabel = null; _renderL3FilterBadge();
      _itemFilter = null;  // 드릴 전환 시 필터 전용 선택 해제
      _applyAiTableFilter();
      _renderAiCard();
    }

    function _onL2Click(fnIdx) {
      const entry = _regL2[fnIdx];
      if (!entry) return;
      if (_aiHistory.length < 1) return;
      _aiHistory = [_aiHistory[0], { label: entry.filterLabel, filterFn: entry.filterFn }];
      _aiLevel = 3;
      _drillDataL3 = null;
      _l3FilterLabel = null; _renderL3FilterBadge();
      _itemFilter = null;  // 드릴 전환 시 필터 전용 선택 해제
      _applyAiTableFilter();
      _renderAiCard();
    }

    function _onL3Click(fnIdx) {
      const entry = _regL3[fnIdx];
      if (!entry) return;
      /* 필터 전용 선택과 상호 배타: L3 드릴 항목 클릭 시 해제 */
      if (_itemFilter) { _itemFilter = null; _refreshItemFilterActive(); }
      /* 동일 항목 재클릭 → 토글 해제 */
      if (_l3FilterLabel === entry.filterLabel) { _resetL3Filter(); return; }
      /* 테이블만 필터 */
      let data = [..._aiFilteredCalls];
      _aiHistory.forEach(h => { data = data.filter(h.filterFn); });
      filteredData = data.filter(entry.filterFn);
      _l3FilterLabel = entry.filterLabel;
      currentPage = 1;
      renderTable();
      _renderL3FilterBadge();
      /* L3 항목 하이라이트: 인라인 스타일로 직접 제어 */
      document.querySelectorAll('#ai-panel-l3-body .ai-dp-item').forEach(e => {
        e.classList.remove('l3-active');
        e.style.background = '#FAFAFA';
        e.style.borderLeftWidth = '3px';
      });
      const clicked = document.getElementById(`_onL3Click-${fnIdx}`);
      if (clicked) {
        clicked.classList.add('l3-active');
        clicked.style.background = '#E3F2FD';
        clicked.style.borderLeftWidth = '4px';
      }
    }

    /* 패널 닫기: L2 닫으면 L1로, L3 닫으면 L2로 */
    function _closeL2() {
      _aiHistory = [];
      _aiLevel = 1;
      _drillDataL2 = null; _drillDataL3 = null;
      _l3FilterLabel = null; _renderL3FilterBadge();
      _itemFilter = null;
      _applyAiTableFilter();
      _renderAiCard();
    }
    function _closeL3() {
      _aiHistory = [_aiHistory[0]];
      _aiLevel = 2;
      _drillDataL3 = null;
      _l3FilterLabel = null; _renderL3FilterBadge();
      _itemFilter = null;
      _applyAiTableFilter();
      _renderAiCard();
    }
    let _regL1 = [], _regL2 = [], _regL3 = [];
    let _l3FilterLabel = null;
    /* 필터 전용 항목 선택 상태 (드릴 없이 테이블만 필터). {levelKey, fnIdx, filterFn, filterLabel} */
    let _itemFilter = null;

    /* ── 드롭다운 sub-item(chip) 상태/핸들러 ─────────────────────────
     *  [개요] 멀티-항목 인사이트(여러 값이 콤마로 나열되던 평문)를
     *   "헤더 ▼ + chip 목록" 구조로 바꿔, 개별 chip을 선택해
     *   해당 값으로 드릴다운(또는 L3 테이블 필터)할 수 있게 한다.
     *
     *  [_subItemOpen] 레벨별 펼친 부모 항목의 registry 인덱스 Set.
     *   - 같은 레벨 내 필터 갱신 시에는 펼침 상태 유지
     *   - L1↔L2↔L3 레벨 전환 시 하위 레벨 Set을 clear (사용자 정책) */
    const _subItemOpen = { l1: new Set(), l2: new Set(), l3: new Set() };

    /* 헤더 클릭 → chip 목록 펼침/접힘 토글 (전체 재렌더 없이 DOM 직접 조작 → 깜빡임 방지) */
    function _toggleSubItems(levelKey, idx) {
      const set = _subItemOpen[levelKey];
      const willOpen = !set.has(idx);
      if (willOpen) set.add(idx); else set.delete(idx);
      const cont = document.getElementById(`_sub-${levelKey}-${idx}`);
      const chev = document.getElementById(`_chev-${levelKey}-${idx}`);
      if (cont) cont.style.display = willOpen ? 'flex' : 'none';
      if (chev) chev.style.transform = willOpen ? 'rotate(90deg)' : 'rotate(0deg)';
    }

    /* chip 클릭 → 해당 sub-item 기준 드릴다운/필터.
     *  L1 chip → L2 진입, L2 chip → L3 진입, L3 chip → 테이블 필터 토글 */
    function _onSubItemClick(levelKey, parentIdx, subIdx) {
      const reg = { l1: _regL1, l2: _regL2, l3: _regL3 }[levelKey];
      const parent = reg && reg[parentIdx];
      if (!parent || !parent.subItems) return;
      const sub = parent.subItems[subIdx];
      if (!sub) return;

      if (levelKey === 'l1') {
        _aiHistory = [{ label: sub.filterLabel, filterFn: sub.filterFn }];
        _aiLevel = 2;
        _drillDataL2 = null; _drillDataL3 = null;
        _l3FilterLabel = null; _renderL3FilterBadge();
        _itemFilter = null;
        _subItemOpen.l2.clear(); _subItemOpen.l3.clear();  // 레벨 전환 시 하위 초기화
      } else if (levelKey === 'l2') {
        if (_aiHistory.length < 1) return;
        _aiHistory = [_aiHistory[0], { label: sub.filterLabel, filterFn: sub.filterFn }];
        _aiLevel = 3;
        _drillDataL3 = null;
        _l3FilterLabel = null; _renderL3FilterBadge();
        _itemFilter = null;
        _subItemOpen.l3.clear();
      } else { // l3: 더 깊은 드릴 없음 — 테이블 필터 토글
        if (_l3FilterLabel === sub.filterLabel) { _resetL3Filter(); return; }
        let data = [..._aiFilteredCalls];
        _aiHistory.forEach(h => { data = data.filter(h.filterFn); });
        filteredData = data.filter(sub.filterFn);
        _l3FilterLabel = sub.filterLabel;
        currentPage = 1;
        renderTable();
        _renderL3FilterBadge();
        _refreshL3ChipActive();  // 재렌더 없이 chip 활성 표시만 갱신
        return;
      }
      _applyAiTableFilter();
      _renderAiCard();
    }

    /* L3 패널의 chip 활성(선택됨) 표시를 _l3FilterLabel 기준으로 동기화 */
    function _refreshL3ChipActive() {
      document.querySelectorAll('#ai-panel-l3-body .ai-dp-sub-chip').forEach(chip => {
        chip.classList.toggle('chip-active', chip.getAttribute('data-label') === _l3FilterLabel);
      });
    }

    /* ── 멀티-항목 인사이트 빌더 헬퍼 ─────────────────────────────
     *  [동작] rows(개별 값 배열)를 받아 인사이트 item을 생성한다.
     *   - canInteract=true: 헤더 + subItems(chip) 구조 (chip 클릭으로 드릴다운)
     *   - canInteract=false: 콤마 평문으로 fallback (1건 등 드릴 의미 없을 때)
     *  @param headerText  헤더 텍스트 (예: '원인 분석', '이슈 분포')
     *  @param rows        [{label, count, filterFn, filterLabel}] — slice(0,3) 적용
     *  @param canInteract 드릴 가능 여부
     *  @param joiner      평문 fallback 시 구분자 (기본 ', ') */
    function _mkSubInsight(headerText, rows, canInteract, joiner) {
      if (canInteract && rows.length > 0) {
        return { text: headerText, keyword: null, filterFn: null, filterLabel: null, subItems: rows.slice(0, 3) };
      }
      const detail = rows.map(r => `${r.label} ${r.count}건`).join(joiner || ', ');
      return { text: `${headerText}: ${detail}`, keyword: null, filterFn: null, filterLabel: null };
    }

    /** Level 3 필터 뱃지: 적용된 필터 라벨 + 초기화 버튼 표시 */
    function _renderL3FilterBadge() {
      const badge = document.getElementById('l3-filter-badge');
      if (!badge) return;
      if (!_l3FilterLabel) {
        badge.style.display = 'none';
        badge.innerHTML = '';
        return;
      }
      badge.style.display = 'inline-flex';
      badge.innerHTML = `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 10px;background:#E3F2FD;color:#1565C0;border-radius:12px;font-size:11px;font-weight:600;border:1px solid #BBDEFB;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1565C0" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        ${_l3FilterLabel}
        <span onclick="_resetL3Filter()" style="cursor:pointer;margin-left:2px;display:inline-flex;align-items:center;" title="필터 초기화">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#1565C0" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </span>
      </span>`;
    }

    /** Level 3 필터 초기화 */
    function _resetL3Filter() {
      _l3FilterLabel = null;
      _applyAiTableFilter();
      _renderL3FilterBadge();
      document.querySelectorAll('#ai-panel-l3-body .ai-dp-item').forEach(e => {
        e.classList.remove('l3-active');
        e.style.background = '#FAFAFA';
        e.style.borderLeftWidth = '3px';
      });
      /* L3 sub-chip 활성 표시도 해제 */
      document.querySelectorAll('#ai-panel-l3-body .ai-dp-sub-chip').forEach(c => c.classList.remove('chip-active'));
    }

    /* ── 필터 전용 항목 클릭 → 드릴 없이 하단 테이블만 필터 (토글) ──────
     *  드릴되지 않는(하위 뎁스가 없는) 항목도 선택해서 해당 콜 집합을
     *  하단 테이블에 노출하기 위한 핸들러. 같은 항목 재클릭 시 해제한다. */
    function _onItemFilter(levelKey, fnIdx) {
      const reg = { l1: _regL1, l2: _regL2, l3: _regL3 }[levelKey];
      const entry = reg && reg[fnIdx];
      if (!entry || !entry.filterFn) return;
      /* L3 드릴 필터와 상호 배타: 기존 L3 선택 해제 (테이블은 _applyAiTableFilter가 재구성) */
      if (_l3FilterLabel) {
        _l3FilterLabel = null; _renderL3FilterBadge();
        document.querySelectorAll('#ai-panel-l3-body .ai-dp-item').forEach(e => {
          e.classList.remove('l3-active'); e.style.background = '#FAFAFA'; e.style.borderLeftWidth = '3px';
        });
      }
      const same = _itemFilter && _itemFilter.levelKey === levelKey && _itemFilter.fnIdx === fnIdx;
      _itemFilter = same ? null : { levelKey, fnIdx, filterFn: entry.filterFn, filterLabel: entry.filterLabel };
      _applyAiTableFilter();
      _refreshItemFilterActive();
    }

    /* 필터 전용 항목 활성 표시 동기화 (재렌더 없이 인라인 토글) */
    function _refreshItemFilterActive() {
      document.querySelectorAll('[id^="_itemfilter-"]').forEach(el => {
        el.classList.remove('itemfilter-active');
        el.style.background = '#FAFAFA';
        el.style.borderLeftWidth = '3px';
        el.style.fontWeight = '';
      });
      if (_itemFilter) {
        const el = document.getElementById(`_itemfilter-${_itemFilter.levelKey}-${_itemFilter.fnIdx}`);
        if (el) {
          el.classList.add('itemfilter-active');
          el.style.background = '#E3F2FD';
          el.style.borderLeftColor = '#1565C0';
          el.style.borderLeftWidth = '4px';
          el.style.fontWeight = '600';
        }
      }
    }

    /* 상담유형 Top5 클릭 → L2 진입 (Top5에서 직접 드릴다운) */
    function _onConsultTypeClick(ctName) {
      _aiHistory = [{ label: ctName, filterFn: c => c.consultationType === ctName }];
      _aiLevel = 2;
      _drillDataL2 = null; _drillDataL3 = null;
      _l3FilterLabel = null; _renderL3FilterBadge();
      _applyAiTableFilter();
      _renderAiCard();
    }

    /* 키워드 Top5 클릭 시 해당 키워드로 드릴다운 진입 */
    function _onKeywordTop5Click(kwName) {
      _aiHistory = [{ label: kwName, filterFn: c => {
        const allKws = Object.values(c.extractedKeywords || {}).reduce((acc, arr) => acc.concat(arr || []), []);
        return allKws.some(item => item.name === kwName);
      }}];
      _aiLevel = 2;
      _drillDataL2 = null; _drillDataL3 = null;
      _l3FilterLabel = null; _renderL3FilterBadge();
      _applyAiTableFilter();
      _renderAiCard();
    }

    /* ── 콜 목록 테이블 누적 필터 적용 ─────────────────────────
     *  [정책] _aiHistory의 모든 filterFn을 순서대로 적용하여
     *   콜 목록 테이블에 표시할 데이터를 산출한다.
     *   Level 1: _aiHistory 비어 있으므로 _aiFilteredCalls 전체
     *   Level 2: history[0].filterFn 적용
     *   Level 3: history[0].filterFn → history[1].filterFn 순서 적용
     *  이전에는 마지막 필터만 적용하여 상위 필터가 유실되는
     *  버그가 있었으나, 누적 체이닝으로 수정함. */
    function _applyAiTableFilter() {
      let data = [..._aiFilteredCalls];
      _aiHistory.forEach(h => { data = data.filter(h.filterFn); });
      /* 필터 전용 항목이 선택돼 있으면 드릴 스코프에 더해 적용 */
      if (_itemFilter && _itemFilter.filterFn) data = data.filter(_itemFilter.filterFn);
      filteredData = data;
      currentPage = 1;
      renderTable();
    }

    /* ── consult_type 시나리오 (세분류 진입용) ──────────────────────
     *  [정책] 대시보드 세분류 도넛에서 클릭하여 진입한 경우.
     *   - 키워드 Top5를 집계하여 오른쪽 패널에 표시한다.
     *   - extractedKeywords 전 카테고리에서 빈도순 Top5를 추출한다.
     *   - 인사이트는 해당 세분류 콜에 대한 이슈/트렌드 분석을 제공한다.
     * ─────────────────────────────────────────────────────────── */
    function _buildConsultTypeScenario(calls) {
      const total = calls.length;
      const issueCalls = calls.filter(c => c.issueKeywords && c.issueKeywords.length > 0);
      const reentCalls = calls.filter(c => c.reentry >= 2);
      const reentRate = total > 0 ? Math.round(reentCalls.length / total * 100) : 0;
      const resolved = _completedRate(calls);
      const topIssues = _aggIssueDistribution(calls);
      const topIssue = topIssues.length > 0 ? topIssues[0].name : '-';
      const followupCalls = calls.filter(c => c.aiAnalysis && c.aiAnalysis.status === 'followup');
      const hd = _aggHourDist(calls);
      const peak = hd.length > 0 ? hd.reduce((a,b) => b.count > a.count ? b : a) : {hour:0, count:0};

      const curFilter = urlFilter ? urlFilter.filter : null;
      /* [정책] Top5 표시 분기
       *   - consult_type(세분류) → 키워드 Top5 (이미 상담유형으로 진입했으므로 키워드를 보여준다)
       *   - keyword(주요 키워드) / product_keyword / issue_keyword / new_keyword
       *     → 상담유형 Top5 (키워드로 진입했으므로 상담유형을 보여준다) */
      const showCtTop5 = ['keyword','product_keyword','issue_keyword','new_keyword'].includes(curFilter);

      /* 키워드 Top5 집계 (consult_type 전용) */
      let keywordTop5 = [], maxKwCount = 1;
      if (!showCtTop5) {
        const kwMap = {};
        calls.forEach(c => {
          Object.values(c.extractedKeywords || {}).forEach(arr => {
            (arr || []).forEach(item => {
              const name = item.name;
              if (!kwMap[name]) kwMap[name] = { name, count:0 };
              kwMap[name].count += item.count || 1;
            });
          });
        });
        keywordTop5 = Object.values(kwMap).sort((a,b) => b.count - a.count).slice(0, 5);
        maxKwCount = keywordTop5.length > 0 ? keywordTop5[0].count : 1;
      }

      /* 상담유형 Top5 집계 (product_keyword / issue_keyword / new_keyword 전용) */
      let consultTypeTop5 = [], maxCtCount = 1;
      if (showCtTop5) {
        const ctMap = {};
        calls.forEach(c => {
          const key = c.consultationType;
          if (!ctMap[key]) ctMap[key] = { name:key, count:0 };
          ctMap[key].count++;
        });
        consultTypeTop5 = Object.values(ctMap).sort((a,b) => b.count - a.count).slice(0, 5);
        maxCtCount = consultTypeTop5.length > 0 ? consultTypeTop5[0].count : 1;
      }

      const ctFlowPatterns = _aggFlowPattern(calls);
      const ctIntentRate = _aggIntentRate(calls);
      const ctFlowDetail = ctFlowPatterns.slice(0,3).map(f => `${f.name} ${f.count}건`).join(' / ');
      const ctTopFailCause = (() => {
        const fc = _aggByField(ctIntentRate.notAchievedCalls.filter(c => c.aiAnalysis), c => c.aiAnalysis.rootCause);
        return fc.length > 0 ? fc[0].name : '-';
      })();

      const filterValue = urlFilter ? urlFilter.value : '';

      return {
        level1: {
          keywordTop5: showCtTop5 ? undefined : keywordTop5,
          maxKwCount: showCtTop5 ? undefined : maxKwCount,
          consultTypeTop5: showCtTop5 ? consultTypeTop5 : undefined,
          maxCtCount: showCtTop5 ? maxCtCount : undefined,
          insights: [
            { type:'finding', label:`<b>${filterValue}</b> 핵심 발견`, color:'#1565C0', items:[
              { text:`${filterValue} 관련 콜 ${total}건 중 이슈 콜 ${issueCalls.length}건(${total > 0 ? Math.round(issueCalls.length/total*100) : 0}%)`, keyword: issueCalls.length > 0 ? '이슈 콜' : null, filterFn: issueCalls.length > 0 ? (c => c.issueKeywords && c.issueKeywords.length > 0) : null, filterLabel:'이슈 콜' },
              { text:`1차 처리 완료율 ${resolved}% — 후속 조치 필요 ${followupCalls.length}건`, keyword: followupCalls.length > 0 ? '후속 조치 필요' : null, filterFn: followupCalls.length > 0 ? (c => c.aiAnalysis && c.aiAnalysis.status === 'followup') : null, filterLabel:'후속 조치 필요' },
              ...(topIssues.length > 0 ? [{ text:`최다 이슈: ${topIssue} ${topIssues[0].count}건 — 전체 이슈의 ${issueCalls.length > 0 ? Math.round(topIssues[0].count/issueCalls.length*100) : 0}%`, keyword:topIssue !== '-' ? topIssue : null, filterFn: topIssue !== '-' ? (c => (c.issueKeywords||[]).includes(topIssue)) : null, filterLabel:topIssue }] : []),
              ...(ctFlowPatterns.length > 0 ? [_mkSubInsight('상담 흐름', ctFlowPatterns.slice(0,3).map(f => ({ label:f.name, count:f.count, filterFn: c => c.aiAnalysis && c.aiAnalysis.flowPattern === f.name, filterLabel:f.name })), ctFlowPatterns[0].count >= 2, ' / ')] : [])
            ]},
            { type:'warning', label:'위험 신호', color:'#E65100', items:[
              { text:`재인입 비율 ${reentRate}%(${reentCalls.length}건) — 이전 상담 완결 품질 점검 필요`, keyword: reentCalls.length > 0 ? '재인입' : null, filterFn: reentCalls.length > 0 ? (c => c.reentry >= 2) : null, filterLabel:'재인입 콜' },
              { text:`콜 집중 시간대: ${peak.hour}시(${peak.count}건)`, keyword:`${peak.hour}시`, filterFn: c => parseInt(c.time.split(':')[0],10) === peak.hour, filterLabel:`${peak.hour}시 콜` },
              { text:`고객 의도 달성률 ${ctIntentRate.rate}% — 미달성 ${ctIntentRate.notAchieved}건 주요 원인: ${ctTopFailCause}`, keyword: ctIntentRate.notAchieved >= 2 ? '의도 미달성' : null, filterFn: c => c.aiAnalysis && c.aiAnalysis.intentAchieved === false, filterLabel:'의도 미달성' }
            ]}
          ]
        }
      };
    }

    /* ── hour 시나리오 (시간대별 콜량 진입용) ─────────────────────────
     *  [정책] 대시보드 시간대별 콜량 차트에서 클릭하여 진입한 경우.
     *   - 키워드 Top5 + 상담유형 Top5를 동시에 상하 배치로 표시한다.
     *   - 인사이트는 해당 시간대의 콜 패턴 분석을 제공한다.
     * ─────────────────────────────────────────────────────────── */
    function _buildHourScenario(calls) {
      const total = calls.length;
      const issueCalls = calls.filter(c => c.issueKeywords && c.issueKeywords.length > 0);
      const resolved = _completedRate(calls);
      const topIssues = _aggIssueDistribution(calls);
      const topIssue = topIssues.length > 0 ? topIssues[0].name : '-';
      const followupCalls = calls.filter(c => c.aiAnalysis && c.aiAnalysis.status === 'followup');
      const reentCalls = calls.filter(c => c.reentry >= 2);
      const reentRate = total > 0 ? Math.round(reentCalls.length / total * 100) : 0;

      /* 키워드 Top5 */
      const kwMap = {};
      calls.forEach(c => {
        Object.values(c.extractedKeywords || {}).forEach(arr => {
          (arr || []).forEach(item => {
            const name = item.name;
            if (!kwMap[name]) kwMap[name] = { name, count:0 };
            kwMap[name].count += item.count || 1;
          });
        });
      });
      const keywordTop5 = Object.values(kwMap).sort((a,b) => b.count - a.count).slice(0, 5);
      const maxKwCount = keywordTop5.length > 0 ? keywordTop5[0].count : 1;

      /* 상담유형 Top5 */
      const ctMap = {};
      calls.forEach(c => {
        const key = c.consultationType;
        if (!ctMap[key]) ctMap[key] = { name:key, count:0 };
        ctMap[key].count++;
      });
      const consultTypeTop5 = Object.values(ctMap).sort((a,b) => b.count - a.count).slice(0, 5);
      const maxCtCount = consultTypeTop5.length > 0 ? consultTypeTop5[0].count : 1;

      const hourValue = urlFilter ? urlFilter.value : '?';

      return {
        level1: {
          keywordTop5, maxKwCount,
          consultTypeTop5, maxCtCount,
          insights: [
            { type:'finding', label:`<b>${hourValue}시</b> 시간대 핵심 발견`, color:'#1565C0', items:[
              { text:`${hourValue}시 콜 ${total}건 — 이슈 콜 ${issueCalls.length}건(${total > 0 ? Math.round(issueCalls.length/total*100) : 0}%)`, keyword: issueCalls.length > 0 ? '이슈 콜' : null, filterFn: issueCalls.length > 0 ? (c => c.issueKeywords && c.issueKeywords.length > 0) : null, filterLabel:'이슈 콜' },
              { text:`1차 처리 완료율 ${resolved}% — 후속 조치 필요 ${followupCalls.length}건`, keyword: followupCalls.length > 0 ? '후속 조치 필요' : null, filterFn: followupCalls.length > 0 ? (c => c.aiAnalysis && c.aiAnalysis.status === 'followup') : null, filterLabel:'후속 조치 필요' },
              ...(topIssues.length > 0 ? [{ text:`최다 이슈: ${topIssue} ${topIssues[0].count}건`, keyword:topIssue !== '-' ? topIssue : null, filterFn: topIssue !== '-' ? (c => (c.issueKeywords||[]).includes(topIssue)) : null, filterLabel:topIssue }] : [])
            ]},
            { type:'warning', label:'위험 신호', color:'#E65100', items:[
              { text:`재인입 비율 ${reentRate}%(${reentCalls.length}건)`, keyword: reentCalls.length > 0 ? '재인입' : null, filterFn: reentCalls.length > 0 ? (c => c.reentry >= 2) : null, filterLabel:'재인입 콜' }
            ]}
          ]
        }
      };
    }

    /* ── 시나리오 분기 + 캐싱 ──────────────────────────────────────
     *  [정책] URL 파라미터(urlFilter)에 따라 시나리오를 자동 분기한다.
     *   - keyword (주문번호 포함) → _buildKeywordScenario (상담유형 Top5)
     *   - consult_type(세분류) → _buildConsultTypeScenario (키워드 Top5)
     *   - product_keyword / issue_keyword / new_keyword
     *     → _buildConsultTypeScenario (상담유형 Top5)
     *   - hour → _buildHourScenario (키워드 Top5 + 상담유형 Top5 상하 배치)
     *   - 그 외 → _buildDefaultScenario (Top5 없음)
     * ─────────────────────────────────────────────────────────── */
    function _getScenario() {
      const f = urlFilter ? urlFilter.filter : null;
      const v = urlFilter ? urlFilter.value : '';
      let key;
      /* [정책] 시나리오 분기
       *   - keyword + "주문" 포함 → keyword 시나리오 (주문번호 특화 인사이트 + 상담유형 Top5)
       *   - keyword + 그 외 값  → consult_type 시나리오 (범용 인사이트 + 상담유형 Top5)
       *   - product_keyword / issue_keyword / new_keyword → consult_type 시나리오 (상담유형 Top5)
       *   - consult_type → consult_type 시나리오 (키워드 Top5) */
      if (f === 'keyword' && v.includes('주문')) key = 'keyword';
      else if (f === 'keyword') key = 'kw_general';
      else if (['consult_type','product_keyword','issue_keyword','new_keyword'].includes(f)) key = 'consult_type';
      else if (f === 'hour') key = 'hour';
      else key = 'default';

      if (!_aiCache[key]) {
        const base = (key === 'keyword' || key === 'kw_general' || key === 'consult_type' || key === 'hour') ? _aiFilteredCalls : callData;
        if (key === 'keyword') _aiCache[key] = _buildKeywordScenario(base);
        else if (key === 'kw_general') _aiCache[key] = _buildConsultTypeScenario(base);
        else if (key === 'consult_type') _aiCache[key] = _buildConsultTypeScenario(base);
        else if (key === 'hour') _aiCache[key] = _buildHourScenario(base);
        else _aiCache[key] = _buildDefaultScenario(base);
      }
      return _aiCache[key];
    }

    /* ── AI 현황분석 멀티패널 렌더링 ─────────────────────────────
     *  [정책] 멀티패널 드릴다운 방식으로 인사이트를 렌더링한다.
     *   - L1 패널: 항상 표시, 시나리오 기반 인사이트
     *   - Top5 패널: 키워드 시나리오일 때 L1 옆에 표시, L2 진입 시 숨김
     *   - L2 패널: L1 항목 클릭 시 오른쪽에 열림
     *   - L3 패널: L2 항목 클릭 시 오른쪽에 열림
     *   - 이전 레벨 콘텐츠는 유지되며, 클릭한 항목이 활성 표시됨
     * ─────────────────────────────────────────────────────────── */

    const _insightSvg = {
      finding: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
      warning: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
      trend: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>',
      action: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
      cause: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 6l-9.5 9.5-5-5L1 18"/><polyline points="17 6 23 6 23 12"/></svg>'
    };

    /* 인사이트 그룹 → HTML, 지정한 registry 배열에 핸들러 등록
     *  [정책]
     *   - 각 섹션은 최대 3개 항목만 표시 (group.items.slice(0,3))
     *   - registry 슬롯은 "클릭 가능 항목(filterFn)" 또는 "subItems 보유 항목" 모두에 배정.
     *     컨테이너 id를 `${clickFn}-${idx}`로 통일하여 _applyDrillHighlight 등과 호환.
     *   - subItems가 있으면 헤더(클릭=펼침 토글) + chip 목록(최대 3개) 렌더 */
    function _renderInsightsToHtml(insights, registry, clickFn, isL3) {
      /* clickFn → 레벨 키 도출 (_onL1Click→l1 …) */
      const levelKey = clickFn === '_onL2Click' ? 'l2' : clickFn === '_onL3Click' ? 'l3' : 'l1';
      return insights.map(group => {
        const cappedItems = group.items.slice(0, 3);
        const itemsHtml = cappedItems.map(item => {
          const hasSub = item.subItems && item.subItems.length > 0;
          const hasFilter = !hasSub && item.keyword && item.filterFn;
          /* filterFn은 있으나 keyword가 없는 항목 = 드릴 대상은 아니지만 테이블 필터는 가능한 "필터 전용" 항목 */
          const hasTableFilter = !hasSub && !hasFilter && !!item.filterFn;
          const baseStyle = `display:flex !important;align-items:center;gap:8px;padding:5px 10px;background:#FAFAFA;border-radius:6px;margin-bottom:2px;border-left:3px solid ${group.color};transition:background .15s;overflow:hidden;`;

          /* ── subItems(드롭다운) 항목 ──
           *  헤더(라벨 + 우측 chevron) 클릭 → 아래로 세로 목록 펼침/접힘.
           *  레이아웃은 CSS 우선순위 충돌을 피하려 인라인으로 column을 강제한다. */
          if (hasSub) {
            const idx = registry.length;
            registry.push({ subItems: item.subItems });
            const open = _subItemOpen[levelKey].has(idx);
            const chipsHtml = item.subItems.slice(0, 3).map((sub, sIdx) => {
              const active = isL3 && _l3FilterLabel === sub.filterLabel;
              /* L1/L2: 드릴 진입(꺾쇠) / L3: 테이블 필터(깔때기) — 단일 클릭 항목과 동일한 의미 부여 */
              const icon = isL3
                ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${group.color}" stroke-width="2" style="flex-shrink:0;opacity:0.5;margin-left:auto;"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>`
                : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${group.color}" stroke-width="2" style="flex-shrink:0;opacity:0.5;margin-left:auto;"><path d="m9 18 6-6-6-6"/></svg>`;
              return `<div class="ai-dp-sub-chip${active ? ' chip-active' : ''}" id="_subchip-${levelKey}-${idx}-${sIdx}" data-label="${sub.filterLabel}" title="${sub.label}"
                onclick="event.stopPropagation();_onSubItemClick('${levelKey}',${idx},${sIdx})"
                style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;">
                <span style="color:${group.color};font-size:7px;flex-shrink:0;line-height:1;">●</span>
                <span class="sub-label" style="flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:400;color:#616161;">${sub.label}</span>
                <span class="sub-count" style="font-size:12px;color:${group.color};margin-left:10px;white-space:nowrap;flex-shrink:0;">${sub.count}건</span>
                ${icon}
              </div>`;
            }).join('');
            return `<div class="ai-dp-item ai-dp-item--with-sub" id="${clickFn}-${idx}" style="display:flex;flex-direction:column;align-items:stretch;padding:6px 10px;background:#FAFAFA;border-radius:6px;margin-bottom:2px;border-left:3px solid ${group.color};">
              <div class="ai-dp-sub-header" onclick="_toggleSubItems('${levelKey}',${idx})" style="display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;min-width:0;">
                <span style="color:${group.color};font-size:10px;flex-shrink:0;line-height:1;">■</span>
                <span class="ai-dp-sub-header-label" style="font-size:13px;color:#424242;font-weight:600;line-height:1.45;min-width:0;">${item.text}</span>
                <svg class="ai-dp-sub-chevron" id="_chev-${levelKey}-${idx}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${group.color}" stroke-width="2" style="flex-shrink:0;opacity:0.55;transition:transform .2s ease;transform:rotate(${open ? '90deg' : '0deg'});"><path d="m9 18 6-6-6-6"/></svg>
              </div>
              <div class="ai-dp-sub-container" id="_sub-${levelKey}-${idx}" style="flex-direction:column;gap:3px;margin-top:7px;padding-left:18px;display:${open ? 'flex' : 'none'};">${chipsHtml}</div>
            </div>`;
          }

          /* ── 단일 클릭형 / 평문 항목 (기존 동작) ── */
          let displayText = item.text;
          if (hasFilter) {
            displayText = item.text.replace(new RegExp(`(${item.keyword.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'g'),
              `<span style="color:${group.color};font-weight:700;">$1</span>`);
          }
          const funnelSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${group.color}" stroke-width="2" style="flex-shrink:0;margin-left:auto;opacity:0.5;"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>`;
          const chevronSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${group.color}" stroke-width="2" style="flex-shrink:0;margin-left:auto;opacity:0.5;"><path d="m9 18 6-6-6-6"/></svg>`;
          let idAttr = '', evtAttr = '', arrowSvg = '', extraClass = '', activeInline = '';
          if (hasFilter) {
            const fnIdx = registry.length;
            registry.push({ filterFn: item.filterFn, filterLabel: item.filterLabel });
            idAttr = `id="${clickFn}-${fnIdx}"`;
            evtAttr = `onclick="${clickFn}(${fnIdx})" onmouseenter="this.style.background='#E8EAF6'" onmouseleave="if(this.classList.contains('drill-active'))this.style.background='#DCEEFB';else if(this.classList.contains('l3-active'))this.style.background='#E3F2FD';else this.style.background='#FAFAFA'"`;
            arrowSvg = isL3 ? funnelSvg : chevronSvg;
          } else if (hasTableFilter) {
            /* 필터 전용 항목: 깔때기 아이콘 + 클릭 시 테이블만 필터(_onItemFilter, 토글) */
            const fnIdx = registry.length;
            registry.push({ filterFn: item.filterFn, filterLabel: item.filterLabel });
            const isActive = !!(_itemFilter && _itemFilter.levelKey === levelKey && _itemFilter.fnIdx === fnIdx);
            idAttr = `id="_itemfilter-${levelKey}-${fnIdx}"`;
            evtAttr = `onclick="_onItemFilter('${levelKey}',${fnIdx})" onmouseenter="if(!this.classList.contains('itemfilter-active'))this.style.background='#E8EAF6'" onmouseleave="this.style.background=this.classList.contains('itemfilter-active')?'#E3F2FD':'#FAFAFA'"`;
            arrowSvg = funnelSvg;
            if (isActive) { extraClass = ' itemfilter-active'; activeInline = 'background:#E3F2FD;border-left-color:#1565C0;border-left-width:4px;font-weight:600;'; }
          }
          const clickable = hasFilter || hasTableFilter;
          const cursorStyle = clickable ? 'cursor:pointer;' : '';
          return `<div class="ai-dp-item${hasFilter ? ' clickable' : ''}${extraClass}" ${idAttr} ${evtAttr} style="${baseStyle}${cursorStyle}${activeInline}">
            <span style="color:${group.color};font-size:10px;flex-shrink:0;line-height:1;">■</span>
            <span style="font-size:13px;color:#424242;line-height:1.45;flex:1;min-width:0;">${displayText}</span>
            ${arrowSvg}
          </div>`;
        }).join('');
        return `<div style="margin-bottom:8px;">
          <div style="font-size:13px;font-weight:700;color:${group.color};margin-bottom:4px;display:flex;align-items:center;gap:6px;">
            ${_insightSvg[group.type] || ''} ${group.label}
          </div>
          <div style="display:flex;flex-direction:column;gap:2px;">${itemsHtml}</div>
        </div>`;
      }).join('');
    }

    /* 패널 열기/닫기: width(%) 기반 슬라이딩 제어 */
    const _panelTransition = 'width .4s cubic-bezier(.4,0,.2,1), opacity .3s ease, padding .35s ease';
    function _openPanel(el, widthPct, narrow) {
      if (!el) return;
      el.style.transition = _panelTransition;
      el.style.width = widthPct;
      el.style.padding = '14px 16px';
      el.style.opacity = '1';
      el.style.overflowY = 'auto'; el.style.overflowX = 'hidden';
      el.style.borderLeft = el.id !== 'ai-panel-l1' ? '1px solid #E0E0E0' : '';
      if (narrow) el.classList.add('narrow'); else el.classList.remove('narrow');
    }
    function _closePanel(el) {
      if (!el) return;
      el.style.transition = _panelTransition;
      el.style.width = '0'; el.style.padding = '0';
      el.style.opacity = '0'; el.style.overflow = 'hidden';
      el.style.borderLeft = 'none';
      el.classList.remove('narrow');
      /* 닫힌 패널의 콘텐츠를 비워 높이 잔류 방지 */
      const body = el.querySelector('[id$="-body"]');
      if (body) body.innerHTML = '';
      const hdr = el.querySelector('[id$="-hdr"]');
      if (hdr) hdr.innerHTML = '';
    }
    /* 레벨에 따른 패널 비율 일괄 설정 — L2: 35/65, L3: 25/25/50 */
    function _setPanelLayout(level) {
      const l1 = document.getElementById('ai-panel-l1');
      const l2 = document.getElementById('ai-panel-l2');
      const l3 = document.getElementById('ai-panel-l3');
      if (level === 1) {
        _openPanel(l1, '100%', false);
        _closePanel(l2); _closePanel(l3);
      } else if (level === 2) {
        _openPanel(l1, '35%', true);
        _openPanel(l2, '65%', false);
        _closePanel(l3);
      } else if (level >= 3) {
        _openPanel(l1, '25%', true);
        _openPanel(l2, '25%', true);
        _openPanel(l3, '50%', false);
      }
      _applyNarrowEllipsis();
    }
    /* 축소 패널 텍스트 말줄임: 인라인 스타일로 직접 제어 */
    function _applyNarrowEllipsis() {
      ['ai-panel-l1','ai-panel-l2','ai-panel-l3'].forEach(panelId => {
        const panel = document.getElementById(panelId);
        if (!panel) return;
        const isNarrow = panel.classList.contains('narrow');
        panel.querySelectorAll('.ai-dp-item').forEach(item => {
          /* subItem 항목은 구조가 [헤더div, chip컨테이너]라 children[1]이 텍스트가 아님.
           *  헤더 라벨에만 말줄임 적용 (chip 컨테이너 column 전환은 CSS .narrow가 처리) */
          if (item.classList.contains('ai-dp-item--with-sub')) {
            const headerLabel = item.querySelector('.ai-dp-sub-header-label');
            if (!headerLabel) return;
            if (isNarrow) {
              headerLabel.style.whiteSpace = 'nowrap';
              headerLabel.style.overflow = 'hidden';
              headerLabel.style.textOverflow = 'ellipsis';
            } else {
              headerLabel.style.whiteSpace = '';
              headerLabel.style.overflow = '';
              headerLabel.style.textOverflow = '';
            }
            return;
          }
          const textSpan = item.children[1];
          if (!textSpan) return;
          if (isNarrow) {
            textSpan.style.whiteSpace = 'nowrap';
            textSpan.style.overflow = 'hidden';
            textSpan.style.textOverflow = 'ellipsis';
          } else {
            textSpan.style.whiteSpace = '';
            textSpan.style.overflow = '';
            textSpan.style.textOverflow = '';
          }
        });
      });
    }

    /* 패널 헤더 렌더: 컨텍스트 레이블 + 건수 + 닫기 버튼 */
    function _renderPanelHeader(panelHdrId, levelClass, ctxText, count, resetFn) {
      const el = document.getElementById(panelHdrId);
      if (!el) return;
      const bgMap = { l1: '#1565C0', l2: '#00897B', l3: '#6A1B9A' };
      const bg = bgMap[levelClass] || '#1565C0';
      el.style.cssText = 'display:flex !important;align-items:center;gap:8px;margin-bottom:12px;';
      el.innerHTML = `
        <span style="font-size:13px;font-weight:700;color:#fff;padding:3px 12px;border-radius:5px;background:${bg};white-space:nowrap;">${ctxText}</span>
        <span style="font-size:12px;color:#9E9E9E;white-space:nowrap;">${count}건</span>
        ${resetFn ? `<button onclick="${resetFn}" style="margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-size:12px;color:#1565C0;cursor:pointer;padding:3px 10px;border-radius:4px;background:#E3F2FD;border:none;white-space:nowrap;" onmouseenter="this.style.background='#BBDEFB'" onmouseleave="this.style.background='#E3F2FD'">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#1565C0" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>닫기</button>` : ''}
      `;
    }

    /* 상담유형 Top5 HTML 생성 (keyword/hour 시나리오 공용) */
    function _renderCtTop5Html(list, maxCount) {
      const colors = ['#1565C0','#1976D2','#1E88E5','#42A5F5','#64B5F6'];

        <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#424242" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>

        </div>

          ${list.map((ct, idx) => {
            const pct = Math.round(ct.count / maxCount * 100);
            return `<div onclick="_onConsultTypeClick('${ct.name.replace(/'/g, "\\'")}')" style="cursor:pointer;transition:all 0.15s;border-radius:6px;padding:8px 12px;background:#fff;border:1px solid #E8EAF6;" onmouseenter="this.style.background='#E3F2FD';this.style.borderColor='#BBDEFB'" onmouseleave="this.style.background='#fff';this.style.borderColor='#E8EAF6'">

                <span style="font-size:13px;color:#424242;font-weight:600;display:flex;align-items:center;gap:5px;">
                  <span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;background:${colors[idx]};color:#fff;font-size:10px;font-weight:700;">${idx+1}</span>
                  ${ct.name}
                </span>
                <span style="font-size:13px;font-weight:700;color:${colors[idx]};">${ct.count}건</span>

              </div>
            </div>`;
          }).join('')}
        </div>`;
    }

    /* 키워드 Top5 HTML 생성 (consult_type/hour 시나리오 공용) */
    function _renderKwTop5Html(list, maxCount) {
      const colors = ['#00897B','#26A69A','#4DB6AC','#80CBC4','#B2DFDB'];
      return `
        <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#424242" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>

        </div>
        <div style="display:flex;flex-direction:column;gap:6px;">
          ${list.map((kw, idx) => {
            const pct = Math.round(kw.count / maxCount * 100);
            return `<div onclick="_onKeywordTop5Click('${kw.name.replace(/'/g, "\\'")}')" style="cursor:pointer;transition:all 0.15s;border-radius:6px;padding:8px 12px;background:#fff;border:1px solid #E0F2F1;" onmouseenter="this.style.background='#E0F2F1';this.style.borderColor='#B2DFDB'" onmouseleave="this.style.background='#fff';this.style.borderColor='#E0F2F1'">
              <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                <span style="font-size:13px;color:#424242;font-weight:600;display:flex;align-items:center;gap:5px;">
                  <span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:3px;background:${colors[idx]};color:#fff;font-size:10px;font-weight:700;">${idx+1}</span>
                  ${kw.name}
                </span>
                <span style="font-size:13px;font-weight:700;color:${colors[idx]};">${kw.count}건</span>
              </div>
              <div style="width:100%;height:5px;background:#E0F2F1;border-radius:2px;overflow:hidden;">
