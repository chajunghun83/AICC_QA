<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>상담 유형 - AICC Quality Hub</title>

  <style>
    .kw-group-header {
      padding:8px 12px;font-size:11px;font-weight:700;color:#fff;
      background:#5B9BD5;border-bottom:1px solid #4A8BC2;
      position:sticky;top:0;z-index:1;
      letter-spacing:0.5px;
    }
    .kw-item {
      padding:6px 12px 6px 22px;cursor:pointer;display:flex;
      justify-content:space-between;align-items:center;font-size:12px;
      border-bottom:1px solid #F5F5F5;transition:background .15s;
    }
    .kw-item:hover { background:#F5F9FF; }
    .kw-item.active { background:#E3F2FD;font-weight:600; }

    .type-table { width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed; }
    .type-table th {
      padding:8px 10px;text-align:center;font-weight:600;color:#757575;
      border-bottom:2px solid #E0E0E0;background:#FAFAFA;
      position:sticky;top:0;z-index:1;white-space:nowrap;
    }
    .type-table td { padding:8px 10px;border-bottom:1px solid #F0F0F0;text-align:center; }
    .type-table tr:hover td { background:#F5F9FF; }
    .type-table tr[data-clickable] { cursor:pointer; }
    .type-table col.c-depth { width:20%; }
    .type-table col.c-count { width:10%; }
    .type-table col.c-ratio { width:10%; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 헤더 + 필터 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">상담 유형</h1>

      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <div id="period-picker-container"></div>

        </select>
        <select class="form-select" id="team-filter" disabled onchange="onTeamChange()">
          <option value="all">전체 팀</option>
        </select>
      </div>
    </div>

    <div id="main-area" style="display:flex;height:calc(100vh - 160px);gap:12px;">

      <!-- 좌측 세분류 리스트 (화면 끝까지 세로 확장) -->
      <div class="content-card" style="width:230px;flex-shrink:0;display:flex;flex-direction:column;">
        <div class="content-card-header" style="padding:10px 16px;">
          <span style="font-size:14px;font-weight:600;">세분류</span>
        </div>
        <div style="padding:8px 10px;border-bottom:1px solid #EEEEEE;">
          <input type="text" id="kw-search" placeholder="세분류 검색..."
            oninput="onKeywordSearch(this.value)"
            style="width:100%;padding:6px 10px;border:1px solid #E0E0E0;border-radius:6px;font-size:12px;outline:none;">
        </div>
        <div id="keyword-list" style="flex:1;overflow-y:auto;"></div>
      </div>

      <!-- 우측: 상담유형 테이블 + 차트 (세로 분할) -->
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;">

        <!-- 상담유형 테이블 -->
        <div class="content-card" style="flex:6;display:flex;flex-direction:column;min-height:0;">
          <div class="content-card-header" style="padding:10px 16px;display:flex;align-items:center;gap:8px;">
            <span style="font-size:14px;font-weight:600;">상담 유형 리스트</span>
            <span id="selected-kw-badge" style="display:none;padding:2px 10px;background:#E3F2FD;color:#1565C0;border-radius:12px;font-size:12px;font-weight:600;"></span>
          </div>
          <div class="content-card-body" style="flex:1;overflow-y:auto;padding:0;">
            <table class="type-table">
              <colgroup>
                <col class="c-depth"><col class="c-depth"><col class="c-depth"><col class="c-depth">
                <col class="c-count"><col class="c-ratio">
              </colgroup>
              <thead>
                <tr>
                  <th>대분류</th><th>중분류</th><th>소분류</th><th>세분류</th>
                  <th>건수</th><th>비율</th>
                </tr>
              </thead>
              <tbody id="type-table-body">
                <tr><td colspan="6" style="text-align:center;padding:60px 0;color:#BDBDBD;font-size:13px;">세분류를 선택해주세요</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- 하단 차트 -->
        <div class="content-card" style="flex:4;display:flex;flex-direction:column;min-height:0;">
          <div class="content-card-header" style="padding:10px 16px;display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:14px;font-weight:600;">관련 데이터</span>
              <span id="chart-kw-badge" style="display:none;padding:2px 10px;background:#E3F2FD;color:#1565C0;border-radius:12px;font-size:12px;font-weight:600;"></span>
            </div>
            <div style="display:flex;align-items:center;gap:16px;font-size:11px;">
              <span style="display:flex;align-items:center;gap:4px;">
                <span style="width:12px;height:12px;background:rgba(0,163,255,0.7);border-radius:2px;"></span>
                <span id="legend-current">현재 기간</span>
              </span>
              <span style="display:flex;align-items:center;gap:4px;">
                <span style="width:12px;height:0;border-top:2px dashed #BDBDBD;"></span>
                <span id="legend-prev">전월 기간</span>
              </span>
            </div>
          </div>
          <div class="content-card-body" style="flex:1;padding:8px;min-height:0;">
            <canvas id="chart-keyword"></canvas>
          </div>
        </div>
      </div>
    </div>

        { name:'AI추천', count:70, children:[{name:'추천오류',count:40},{name:'맞춤추천',count:30}] }
      ]}
    ];

    /* ══════════════════════════ 데이터 가공 ══════════════════════════ */

    /* 트리에서 리프 노드 추출 → 1댑스 기준 그룹화 */
    let keywordGroups = [];
    /* 키워드명 → 상담유형 경로 매핑 (동명 키워드 다중 경로 지원) */
    let keywordTypeMap = {};
    /* 스케일 팩터 (필터 적용 시 사용) */
    let scaleFactor = 1;

    /* 동일 키워드가 다른 상담유형 경로에도 등장하는 추가 더미 매핑 */
    const extraMappings = {
      '수량정정': [
        { depth1:'환매/정정', depth2:'환매처리', depth3:'펀드환매', depth4:'수량정정', count:125 },
        { depth1:'입출금/이체', depth2:'이체취소', depth3:'부분취소', depth4:'수량정정', count:78 },
        { depth1:'이벤트/혜택', depth2:'수수료할인', depth3:'할인적용', depth4:'수량정정', count:52 },
        { depth1:'체결관리', depth2:'체결조회', depth3:'일반체결', depth4:'수량정정', count:35 }
      ],
      '체결확인': [
        { depth1:'체결관리', depth2:'체결조회', depth3:'일반체결', depth4:'체결확인', count:210 },
        { depth1:'환매/정정', depth2:'취소처리', depth3:'거래체결오류', depth4:'체결확인', count:95 },
        { depth1:'민원', depth2:'서비스불만', depth3:'대기시간', depth4:'체결확인', count:62 },
        { depth1:'HTS·MTS 오류', depth2:'기능문의', depth3:'검색기능', depth4:'체결확인', count:38 }
      ],
      '예수금확인': [
        { depth1:'입출금/이체', depth2:'예수금', depth3:'이체오류', depth4:'예수금확인', count:145 },
        { depth1:'입출금/이체', depth2:'은행이체', depth3:'타행이체', depth4:'예수금확인', count:88 },
        { depth1:'증명서/세금', depth2:'발급요청', depth3:'전자발급', depth4:'예수금확인', count:42 },
        { depth1:'이벤트/혜택', depth2:'예수금이자', depth3:'이자조회', depth4:'예수금확인', count:28 }
      ]
    };

    function buildKeywordData() {
      keywordGroups = [];
      keywordTypeMap = {};

      /* 트리를 순회하여 리프 노드(키워드)를 추출하고 1댑스 기준으로 그룹화 */
      categoryTree.forEach(cat => {
        const leaves = [];
        function collect(node, path) {
          if (!node.children || node.children.length === 0) {
            const fullPath = [...path, node.name];
            leaves.push({ name: node.name, count: node.count, fullPath: fullPath });

            if (!keywordTypeMap[node.name]) keywordTypeMap[node.name] = [];
            keywordTypeMap[node.name].push({
              depth1: fullPath[0] || '-',
              depth2: fullPath[1] || '-',
              depth3: fullPath[2] || '-',
              depth4: fullPath.length >= 4 ? fullPath[3] : '-',
              count: node.count
            });
          } else {
            node.children.forEach(c => collect(c, [...path, node.name]));
          }
        }
        collect(cat, []);
        /* [비고] 그룹 내 키워드를 건수 기준 내림차순 정렬 — 대분류 순서는 categoryTree 원본 유지 */
        leaves.sort((a, b) => b.count - a.count);
        if (leaves.length > 0) {
          keywordGroups.push({ category: cat.name, keywords: leaves });
        }
      });

      /* 추가 더미 매핑 삽입 */
      Object.keys(extraMappings).forEach(kwName => {
        if (!keywordTypeMap[kwName]) keywordTypeMap[kwName] = [];
        extraMappings[kwName].forEach(e => keywordTypeMap[kwName].push(e));
      });

      Object.keys(keywordTypeMap).forEach(key => {
        const entries = keywordTypeMap[key];
        const total = entries.reduce((s, e) => s + e.count, 0);
        entries.forEach(e => { e.ratio = Math.round(e.count / total * 1000) / 10; });
        entries.sort((a, b) => b.count - a.count);
      });
    }

    /* ══════════════════════════ 차트 시계열 데이터 ══════════════════════════ */

    function hashCode(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
      return Math.abs(h);
    }
    function seededRand(seed) { const x = Math.sin(seed + 1) * 10000; return x - Math.floor(x); }

    const trendCache = {};
    function getTrendData(kwName) {
      if (trendCache[kwName]) return trendCache[kwName];
      const total = keywordTypeMap[kwName].reduce((s, e) => s + e.count, 0);
      const seed = hashCode(kwName);

      function gen(len, avg, offset) {
        return Array.from({length: len}, (_, i) =>
          Math.max(1, Math.round(avg * (0.5 + seededRand(seed + i * 7 + offset))))
        );
      }

      const dayAvg = total / 31;
      trendCache[kwName] = {
        monthly: { current: gen(31, dayAvg, 0),   prev: gen(31, dayAvg * 0.85, 100) },
        weekly:  { current: gen(7, total / 4, 200), prev: gen(7, total / 4 * 0.85, 300) },
        daily:   { current: gen(24, dayAvg / 6, 400), prev: gen(24, dayAvg / 6 * 0.85, 500) },
        yearly:  { current: gen(12, total, 600),   prev: gen(12, total * 0.85, 700) }
      };
      return trendCache[kwName];
    }

    function getLabels(period) {
      if (period === 'daily')  return Array.from({length:24}, (_,i) => i + '시');
      if (period === 'weekly') return ['월','화','수','목','금','토','일'];
      if (period === 'yearly') return ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
      return Array.from({length:31}, (_,i) => (i+1) + '일');
    }

    /* ══════════════════════════ 키워드 리스트 렌더 ══════════════════════════ */
    /*
     * [비고] 키워드 리스트 동작 규칙
     * - 키워드 = categoryTree의 리프 노드(마지막 댑스 항목)
     * - 1댑스(대분류)는 그룹 헤더로만 사용, 선택 불가
     * - 그룹 내 키워드는 건수 기준 내림차순 정렬
     * - 검색창 입력 시 키워드명으로 자동 필터링 (oninput), 매칭 없는 그룹은 자동 숨김
     * - 동명 키워드가 여러 대분류에 존재할 경우 각각 표시 (예: 가입방법 → 회원/계정, 멤버십)
     * - 키워드 클릭 시 해당 키워드명의 모든 상담유형 경로가 우측 테이블에 표시
     */

    function renderKeywordList(filter) {
      const container = document.getElementById('keyword-list');
      const q = (filter || '').toLowerCase().trim();
      let html = '';

      keywordGroups.forEach(group => {
        const filtered = group.keywords.filter(kw =>
          q === '' || kw.name.toLowerCase().includes(q)
        );
        if (filtered.length === 0) return;

        html += '<div class="kw-group-header">' + group.category + '</div>';
        filtered.forEach(kw => {
          const isActive = selectedKeyword === kw.name;
          const scaledCount = Math.round(kw.count * scaleFactor);
          html += '<div class="kw-item' + (isActive ? ' active' : '') + '" onclick="selectKeyword(\'' + kw.name.replace(/'/g, "\\'") + '\')">'
            + '<span>' + kw.name + '</span>'
            + '<span style="color:#9E9E9E;font-size:11px;">' + AICC_Fmt.number(scaledCount) + '</span>'
            + '</div>';
        });
      });

      if (html === '') {
        html = '<div style="text-align:center;padding:40px 0;color:#BDBDBD;font-size:12px;">검색 결과가 없습니다</div>';
      }
      container.innerHTML = html;
    }

    function onKeywordSearch(val) {
      renderKeywordList(val);
    }

    function selectKeyword(kwName) {
      selectedKeyword = kwName;
      renderKeywordList(document.getElementById('kw-search').value);
      renderTypeTable();
      renderTrendChart();
    }

    /* ══════════════════════════ 상담유형 테이블 렌더 ══════════════════════════ */

    function renderTypeTable() {
      const tbody = document.getElementById('type-table-body');
      const badge = document.getElementById('selected-kw-badge');

      if (!selectedKeyword || !keywordTypeMap[selectedKeyword]) {
        badge.style.display = 'none';
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:60px 0;color:#BDBDBD;font-size:13px;">세분류를 선택해주세요</td></tr>';
        return;
      }

      badge.style.display = '';
      badge.textContent = selectedKeyword;

      const entries = keywordTypeMap[selectedKeyword];
      tbody.innerHTML = entries.map(e => {
        const sc = Math.round(e.count * scaleFactor);
        const pathStr = e.depth1 + ' > ' + e.depth2 + ' > ' + e.depth3 + (e.depth4 !== '-' ? ' > ' + e.depth4 : '');
        return '<tr data-clickable onclick="goCallStatus(\'consult_type\', \'' + pathStr.replace(/'/g, "\\'") + '\')">'
          + '<td>' + e.depth1 + '</td>'
          + '<td>' + e.depth2 + '</td>'
          + '<td>' + e.depth3 + '</td>'
          + '<td>' + (e.depth4 !== '-' ? e.depth4 : '-') + '</td>'
          + '<td>' + AICC_Fmt.number(sc) + '</td>'
          + '<td>' + e.ratio + '%</td>'
          + '</tr>';
      }).join('');
    }

    /* ══════════════════════════ 차트 렌더 ══════════════════════════ */

    // 막대 위 데이터 레이블 표시 플러그인
    const _ctBarLabelPlugin = {
      id: 'ctBarLabels',
      afterDatasetsDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        if (!meta || meta.hidden) return;
        ctx.save();
        ctx.font = 'bold 11px "Pretendard",sans-serif';
        ctx.fillStyle = '#424242';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        meta.data.forEach((bar, i) => {
          const v = chart.data.datasets[0].data[i];
          if (v == null) return;
          ctx.fillText(v.toLocaleString(), bar.x, bar.y - 4);
        });
        ctx.restore();
      }
    };

    function renderTrendChart() {
      if (trendChart) { trendChart.destroy(); trendChart = null; }

      const chartBadge = document.getElementById('chart-kw-badge');
      const canvas = document.getElementById('chart-keyword');
      if (!canvas) return;

      if (!selectedKeyword) {
        chartBadge.style.display = 'none';
        return;
      }

      chartBadge.style.display = '';
      chartBadge.textContent = selectedKeyword;

      const data = getTrendData(selectedKeyword);
      const periodData = data[currentPeriod] || data.monthly;
      const cfg = periodConfig[currentPeriod] || periodConfig.monthly;

      trendChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: getLabels(currentPeriod),
          datasets: [
            {
              label: '현재 기간',
              data: periodData.current,
              backgroundColor: 'rgba(0,163,255,0.7)',
              borderRadius: 4,
              order: 1
            },
            {
              label: cfg.prevLabel + ' 기간',
              data: periodData.prev,
              type: 'line',
              borderColor: '#BDBDBD',
              borderDash: [4,4],
              pointRadius: 2,
              pointBackgroundColor: '#BDBDBD',
              tension: 0.3,
              borderWidth: 2,
              order: 0
            }
          ]
        },
        plugins: [_ctBarLabelPlugin],
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 18 } },
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          },
          scales: {
            y: { beginAtZero: true, grid: { color: '#F0F0F0' }, ticks: { font: { size: 10 }, color: '#757575' } },
            x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#757575', maxRotation: 0 } }
          },
          onHover: (e, els) => { e.native.target.style.cursor = els.length > 0 ? 'pointer' : 'default'; },
          onClick: () => { if (selectedKeyword) goCallStatus('keyword', selectedKeyword); }
        }
      });
    }

    /* ══════════════════════════ 필터 핸들러 ══════════════════════════ */

    function applyPeriod(period) {
      currentPeriod = period;
      const cfg = periodConfig[period] || periodConfig.monthly;

      const factors = { daily:1/30, weekly:7/30, monthly:1, yearly:365/30, custom:15/30 };
      scaleFactor = factors[period] || 1;

      const legendCur = document.getElementById('legend-current');
      const legendPrv = document.getElementById('legend-prev');
      if (legendCur) legendCur.textContent = '현재 기간';
      if (legendPrv) legendPrv.textContent = cfg.prevLabel + ' 기간';

      renderKeywordList(document.getElementById('kw-search').value);
      renderTypeTable();
      renderTrendChart();
      AICC_Toast.show(cfg.kpiPrefix + ' 데이터로 전환되었습니다.');
    }

    function onCenterChange() {
      const wsId = document.getElementById('ws-filter').value;
      const teamFilter = document.getElementById('team-filter');

      if (wsId === 'all') {
        teamFilter.disabled = true;
        teamFilter.innerHTML = '<option value="all">전체 팀</option>';
      } else {
        teamFilter.disabled = false;
        if (window._centersData) {
          const center = window._centersData.find(c => c.id === wsId);
          teamFilter.innerHTML = '<option value="all">전체 팀</option>';
          if (center && center.teams) {
            center.teams.forEach(t => {
              teamFilter.innerHTML += '<option value="' + t.id + '">' + t.name + '</option>';
            });
          }
        }
      }
      AICC_Toast.show('필터가 적용되었습니다.');
    }

    function onTeamChange() {
      AICC_Toast.show('필터가 적용되었습니다.');
    }

    /* ══════════════════════════ 초기화 ══════════════════════════ */

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const data = await AICC_DataLoader.loadAll(['centers.json']);
        const centers = data['centers.json'];
        if (centers) {
          window._centersData = centers;
          const wsSelect = document.getElementById('ws-filter');
          centers.forEach(ws => {
            wsSelect.innerHTML += '<option value="' + ws.id + '">' + ws.name + '</option>';
          });
        }
      } catch(e) { console.warn('센터 데이터 로드 실패', e); }

      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function(periodType) { applyPeriod(periodType); }
      });

      buildKeywordData();
      renderKeywordList('');

      /* 첫 번째 키워드 자동 선택 */
      if (keywordGroups.length > 0 && keywordGroups[0].keywords.length > 0) {
        selectKeyword(keywordGroups[0].keywords[0].name);
      }
    });
  </script>
</body>
