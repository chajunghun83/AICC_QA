<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>개선 이행 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .status-badge {
      display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;
    }
    .status-미이행   { background:#FFEBEE;color:#C62828; }
    .status-진행중   { background:#FFF3E0;color:#E65100; }
    .status-완료     { background:#E8F5E9;color:#2E7D32; }

    .detail-btn {
      padding:4px 12px;border-radius:4px;font-size:11px;font-weight:600;
      background:#E3F2FD;color:#1565C0;border:1px solid #BBDEFB;cursor:pointer;
      transition:all 0.15s;
    }
    .detail-btn:hover { background:#BBDEFB; }

    .tl-item { display:flex;gap:12px;position:relative;padding-left:20px; }
    .tl-item::before {
      content:'';position:absolute;left:6px;top:24px;bottom:-8px;width:2px;background:#E0E0E0;
    }
    .tl-item:last-child::before { display:none; }
    .tl-dot {
      position:absolute;left:0;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid #E0E0E0;background:white;flex-shrink:0;
    }
    .tl-dot.active { border-color:#00A3FF;background:#E3F2FD; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">개선 이행 관리</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">리포트 개선 제안에 대한 이행 현황 관리</p>
      </div>
    </div>

    <!-- 검색 필터 -->
    <div class="filter-section">
      <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">기간</label>
          <div id="f-period-picker"></div>
        </div>
        <div>
          <label class="form-label">유형</label>
          <select class="form-select" id="f-report-type" style="min-width:120px;">
            <option value="all">전체</option>
            <option value="일간">일간</option>
            <option value="주간">주간</option>
            <option value="월간">월간</option>
            <option value="연간">연간</option>
          </select>
        </div>
        <div>
          <label class="form-label">담당자</label>
          <input type="text" class="form-input" id="f-admin" placeholder="담당자 검색" style="min-width:110px;">
        </div>
        <div>
          <label class="form-label">상태</label>
          <select class="form-select" id="f-status" style="min-width:120px;">
            <option value="all">전체</option>
            <option value="미이행">미이행</option>
            <option value="진행중">진행중</option>
            <option value="완료">완료</option>
          </select>
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="applyFilter()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">개선 이행 목록</span>
        <span style="font-size:12px;color:#757575;" id="item-count">총 0건</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <div style="overflow-x:auto;">
          <table class="data-table" style="min-width:1100px;">
            <colgroup>
              <col style="width:4%"><col style="width:8%"><col style="width:9%">
              <col style="width:35%"><col style="width:8%"><col style="width:7%">
              <col style="width:9%"><col style="width:7%">
            </colgroup>
            <thead>
              <tr>
                <th>NO</th><th>유형</th><th>기간</th>
                <th>개선 제안 내용</th><th>담당자</th><th>상태</th>
                <th>처리일</th><th>처리내역</th>
              </tr>
            </thead>
            <tbody id="imp-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button class="pagination-btn" onclick="goPage('first')">&laquo;</button>
          <span id="page-buttons"></span>
          <button class="pagination-btn" onclick="goPage('last')">&raquo;</button>
          <span style="margin-left:16px;font-size:12px;color:#757575;">페이지당:
            <select class="form-select" id="page-size-select" style="min-width:60px;padding:2px 24px 2px 8px;" onchange="changePageSize()">
              <option>10</option>
              <option selected>20</option>
              <option>50</option>
            </select>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/period-picker.js"></script>
  <script>
    /*
     * ══════════════════════════════════════════════════════════════════
     *  개선 이행 관리 페이지 (TA) — 데이터 소스 및 리포트 연동 시나리오
     * ══════════════════════════════════════════════════════════════════
     *
     *  [데이터 흐름]
     *  1. TA 리포트 생성기에서 "개선 제안 확정" → POST /api/improvements로 저장
     *  2. 이 페이지에서 GET /api/improvements로 목록 조회 (필터: 기간, 상태, 리포트 유형)
     *  3. 관리자가 처리내역 모달에서 담당자 배정, 상태 변경(미이행→진행중→완료), 처리 메모 입력
     *  4. PUT /api/improvements/:id { status, admin, memo } 로 업데이트
     *  5. 다음 리포트 생성 시 "전기 개선 이행 현황 > 불러오기"로 이 목록을 조회/선택
     *
     *  [테이블 데이터 구조]
     *  {
     *    no:          Number,
     *    reportType:  '일간'|'주간'|'월간',
     *    periodFrom:  'YYYY-MM-DD',
     *    periodTo:    'YYYY-MM-DD',
     *    contents:    String[],
     *    admin:       String,
     *    status:      '미이행'|'진행중'|'완료',
     *    completedDate: 'YYYY-MM-DD',
     *    history:     [{ date, admin, status, memo }]
     *  }
     * ══════════════════════════════════════════════════════════════════
     */

    /* ══════════════════════════ 더미데이터 ══════════════════════════ */

    const admins = ['김관리자','박매니저','이팀장','최수석','정차장'];

    /* [정책] TA(통화 분석) 관점의 개선 제안 — 이슈 콜·키워드·상담 흐름·재인입 등
     *  TA 리포트 생성기에서 도출되는 인사이트 기반 항목으로 구성. */
    const contentPool = [
      '체결지연 키워드 콜 전월 대비 23% 증가 — 거래소 호가 SLA 점검 및 미체결 알림 자동화 필요',
      '금감원 민원 키워드 TOP 20 신규 진입(900건/+52%) — 본부 이관 체계 가동 및 사전 대응 매뉴얼 정비 필요',
      '재인입 비율 12.4%로 전월 대비 +3.2%p 상승 — 1차 처리 완결 품질 점검 필요',
      '영업1팀 평균 묵음 시간 12% 증가 — 응대 스킬 코칭 및 시스템 응답속도 점검 필요',
      '주문번호 키워드 콜 25건 급증 — 체결지연 이슈와 동시 발생, 거래소 SLA 점검 필요',
      '환매지연 이슈 콜 후속 조치 이행률 65% — 정정처리 큐 모니터링 자동화 도입 필요',
      '오체결 콜 후속 조치 누락 12건 — 주문관리팀 검토 SLA 강화 필요',
      '평균 통화시간 8분 초과 콜 비율 18% — 콜 효율화 가이드 배포 필요',
      '신용반대매매 만기 도래 문의 급증 — 만기 사전 안내 SMS 자동화 검토 필요',
      '야간 시간대(20시 이후) 콜 비중 12% — 야간 전용 응대 가이드 마련 필요',
      '클레임 콜 본부 이관 시점 평균 5분 지연 — 이관 판단 기준 명확화 필요',
      'AI 현황분석 드릴다운 사용률 42% — 매니저 대상 활용 교육 실시 권장',
      '종목 키워드 TOP5 변화: 두산에너빌리티 신규 진입 — 관련 상담 가이드 업데이트 필요',
      '묵음 구간 평균 1분 초과 콜 비율 8% — 시스템 조회 속도 개선 검토 필요',
      'ETF 분배금 문의 콜 증가 — 분배 일정 사전 푸시 알림 자동화 필요'
    ];

    const adminMemoPool = [
      '거래소 호가 SLA 점검 회의 진행(3/15). 체결지연 알림 자동화 1차 개발 착수.',
      '금감원 민원 사전 대응 매뉴얼 본부 협의 완료. 법무팀 표준 답변 템플릿 배포 예정.',
      '재인입 콜 1차 상담 품질 분석 보고서 작성 완료. 코칭 대상 상담사 12명 선정.',
      '묵음 시간 단축 코칭 실시(3/20). 영업1팀 평균 묵음시간 9% 감소 확인.',
      '물류사·거래소 SLA 점검 결과 공유. 미체결 사전 안내 SMS 자동 발송 로직 개발 진행 중.',
      '정정처리 큐 모니터링 대시보드 구축 완료. 적체 알람 기준 5건 이상 설정.',
      '주문관리팀 후속 조치 SLA 24시간으로 단축. 위반 시 자동 알림 시스템 가동.',
      '콜 효율화 가이드 v2 배포 완료. 평균 통화시간 7.4분으로 감소 추이 확인.',
      '신용 만기 사전 안내 SMS 자동화 1단계 개발 완료. 4월 정식 가동 예정.',
      '야간 응대 가이드 초안 작성 완료. 야간조 대상 교육 일정 협의 중.'
    ];

    function formatPeriod(d) {
      if (d.reportType === '월간') {
        const parts = d.periodFrom.split('-');
        return `${parts[0]}-${parseInt(parts[1])}월`;
      }
      if (d.reportType === '주간') {
        const parts = d.periodFrom.split('-');
        const day = parseInt(parts[2]);
        const weekNum = Math.ceil(day / 7);
        const weekNames = ['첫째 주','둘째 주','셋째 주','넷째 주','다섯째 주'];
        return `${parts[0]}-${parseInt(parts[1])}월 ${weekNames[weekNum - 1] || weekNum + '주'}`;
      }
      if (d.reportType === '년간') {
        return `${d.periodFrom.split('-')[0]}년`;
      }
      return d.periodFrom;
    }

    function getNow() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    let dtpState = { year: 0, month: 0, day: 0, hour: 0, minute: 0, open: false };

    function initDtpState() {
      const now = new Date();
      dtpState.year = now.getFullYear();
      dtpState.month = now.getMonth();
      dtpState.day = now.getDate();
      dtpState.hour = now.getHours();
      dtpState.minute = Math.floor(now.getMinutes() / 10) * 10;
    }

    function dtpFmt() {
      return `${dtpState.year}-${String(dtpState.month+1).padStart(2,'0')}-${String(dtpState.day).padStart(2,'0')} ${String(dtpState.hour).padStart(2,'0')}:${String(dtpState.minute).padStart(2,'0')}`;
    }

    function toggleDatetimePicker() {
      if (dtpState.open) { closeDatetimePicker(); return; }
      dtpState.open = true;
      renderDatetimePicker();
    }

    function closeDatetimePicker() {
      dtpState.open = false;
      const overlay = document.getElementById('dtp-overlay');
      if (overlay) overlay.remove();
    }

    function renderDatetimePicker() {
      let overlay = document.getElementById('dtp-overlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'dtp-overlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:10001;';
        overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDatetimePicker(); });
        document.body.appendChild(overlay);
      }

      const trigger = document.getElementById('modal-action-date-trigger');
      const rect = trigger.getBoundingClientRect();
      const pickerW = 300, pickerH = 420;
      let top = rect.bottom + 4;
      let left = rect.left;
      if (top + pickerH > window.innerHeight) top = rect.top - pickerH - 4;
      if (left + pickerW > window.innerWidth) left = window.innerWidth - pickerW - 8;

      const y = dtpState.year, m = dtpState.month;
      const daysIn = new Date(y, m + 1, 0).getDate();
      const firstDay = new Date(y, m, 1).getDay();
      const todayStr = getNow().split(' ')[0];
      const selStr = `${y}-${String(m+1).padStart(2,'0')}-${String(dtpState.day).padStart(2,'0')}`;

      let calCells = '';
      ['일','월','화','수','목','금','토'].forEach(w => {
        calCells += `<div class="pp-weekday">${w}</div>`;
      });
      for (let i = 0; i < firstDay; i++) calCells += '<div class="pp-day empty"></div>';
      for (let d = 1; d <= daysIn; d++) {
        const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let cls = 'pp-day';
        if (ds === todayStr) cls += ' today';
        if (d === dtpState.day) cls += ' selected';
        calCells += `<div class="${cls}" onclick="dtpSelectDay(${d})">${d}</div>`;
      }

      let hourOpts = '';
      for (let h = 0; h < 24; h++) {
        const sel = h === dtpState.hour ? 'selected' : '';
        hourOpts += `<option value="${h}" ${sel}>${String(h).padStart(2,'0')}시</option>`;
      }
      let minOpts = '';
      for (let mi = 0; mi < 60; mi += 10) {
        const sel = mi === dtpState.minute ? 'selected' : '';
        minOpts += `<option value="${mi}" ${sel}>${String(mi).padStart(2,'0')}분</option>`;
      }

      overlay.innerHTML = `
        <div style="position:fixed;top:${top}px;left:${left}px;background:#fff;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,0.15);border:1px solid #E6E8F0;width:300px;">
          <div class="pp-body" style="padding:12px;">
            <div class="pp-nav">
              <button type="button" class="pp-nav-btn" onclick="dtpNav(-1)">‹</button>
              <span class="pp-nav-title">${y}년 ${m+1}월</span>
              <button type="button" class="pp-nav-btn" onclick="dtpNav(1)">›</button>
            </div>
            <div class="pp-cal-grid">${calCells}</div>
            <div style="display:flex;gap:8px;margin-top:12px;align-items:center;">
              <span style="font-size:12px;color:#616161;font-weight:500;white-space:nowrap;">시간</span>
              <select class="form-select" style="flex:1;min-width:0;padding:4px 8px;font-size:13px;" onchange="dtpState.hour=parseInt(this.value)">${hourOpts}</select>
              <select class="form-select" style="flex:1;min-width:0;padding:4px 8px;font-size:13px;" onchange="dtpState.minute=parseInt(this.value)">${minOpts}</select>
            </div>
          </div>
          <div class="pp-footer">
            <button type="button" class="pp-footer-btn" onclick="closeDatetimePicker()">취소</button>
            <button type="button" class="pp-footer-btn primary" onclick="dtpApply()">확인</button>
          </div>
        </div>
      `;
    }

    function dtpNav(dir) {
      dtpState.month += dir;
      if (dtpState.month < 0) { dtpState.month = 11; dtpState.year--; }
      if (dtpState.month > 11) { dtpState.month = 0; dtpState.year++; }
      const maxDay = new Date(dtpState.year, dtpState.month + 1, 0).getDate();
      if (dtpState.day > maxDay) dtpState.day = maxDay;
      renderDatetimePicker();
    }

    function dtpSelectDay(d) {
      dtpState.day = d;
      renderDatetimePicker();
    }

    function dtpApply() {
      const val = dtpFmt();
      document.getElementById('modal-action-date').value = val;
      document.getElementById('modal-action-date-display').textContent = val;
      closeDatetimePicker();
    }

    function openAdminSearch() {
      if (document.getElementById('admin-search-overlay')) return;
      const overlay = document.createElement('div');
      overlay.id = 'admin-search-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);z-index:10000;display:flex;align-items:center;justify-content:center;';
      overlay.innerHTML = `
        <div style="background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.18);width:360px;max-height:420px;display:flex;flex-direction:column;overflow:hidden;">
          <div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:14px;font-weight:700;">담당자 검색</span>
            <span style="cursor:pointer;font-size:18px;color:#9E9E9E;" onclick="closeAdminSearch()">&times;</span>
          </div>
          <div style="padding:12px 20px;">
            <input type="text" id="admin-search-input" class="form-input" style="width:100%;" placeholder="이름을 입력하세요" oninput="filterAdminList()">
          </div>
          <div id="admin-search-list" style="flex:1;overflow-y:auto;padding:0 20px 16px;min-height:280px;"></div>
        </div>
      `;
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closeAdminSearch(); });
      document.body.appendChild(overlay);
      filterAdminList();
      document.getElementById('admin-search-input').focus();
    }

    function filterAdminList() {
      const query = (document.getElementById('admin-search-input')?.value || '').trim().toLowerCase();
      const filtered = admins.filter(name => name.toLowerCase().includes(query));
      const listEl = document.getElementById('admin-search-list');
      if (!listEl) return;
      listEl.innerHTML = filtered.length === 0
        ? '<div style="text-align:center;color:#9E9E9E;font-size:12px;padding:16px;">검색 결과가 없습니다</div>'
        : filtered.map(name => `
          <div onclick="selectAdmin('${name}')" style="padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;transition:background 0.15s;" onmouseenter="this.style.background='#F5F5F5'" onmouseleave="this.style.background=''">
            <span style="display:inline-block;width:28px;height:28px;border-radius:50%;background:#E3F2FD;color:#1976D2;font-size:12px;font-weight:600;text-align:center;line-height:28px;">${name.charAt(0)}</span>
            <span>${name}</span>
            <span style="font-size:11px;color:#9E9E9E;margin-left:auto;">관리자</span>
          </div>
        `).join('');
    }

    function selectAdmin(name) {
      const input = document.getElementById('modal-admin');
      if (input) input.value = name;
      closeAdminSearch();
    }

    function closeAdminSearch() {
      const overlay = document.getElementById('admin-search-overlay');
      if (overlay) overlay.remove();
    }

    function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function pickContents() {
      const count = 3 + Math.floor(Math.random() * 2);
      const shuffled = [...contentPool].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }

    function generateData() {
      const data = [];
      const reportTypes = ['일간','주간','월간'];
      const statuses = ['미이행','진행중','완료','완료','완료','진행중'];
      let no = 1;

      for (let m = 0; m < 4; m++) {
        const monthStr = `2025-${String(m + 1).padStart(2, '0')}`;
        const count = 2 + Math.floor(Math.random() * 2);
        for (let i = 0; i < count; i++) {
          const reportType = pickRandom(reportTypes);
          let periodFrom, periodTo;
          if (reportType === '월간') {
            periodFrom = `${monthStr}-01`;
            periodTo = `${monthStr}-${[31,28,31,30][m]}`;
          } else if (reportType === '주간') {
            const startDay = 1 + Math.floor(Math.random() * 3) * 7;
            periodFrom = `${monthStr}-${String(startDay).padStart(2,'0')}`;
            periodTo = `${monthStr}-${String(Math.min(startDay + 6, [31,28,31,30][m])).padStart(2,'0')}`;
          } else {
            const day = 1 + Math.floor(Math.random() * [31,28,31,30][m]);
            periodFrom = `${monthStr}-${String(day).padStart(2,'0')}`;
            periodTo = periodFrom;
          }

          const status = pickRandom(statuses);
          const admin = pickRandom(admins);
          const completedDate = status === '완료'
            ? `${monthStr}-${String(10 + Math.floor(Math.random() * 18)).padStart(2, '0')}`
            : '-';

          const history = [];
          if (status !== '미이행') {
            history.push({
              date: `${monthStr}-${String(5 + Math.floor(Math.random() * 5)).padStart(2, '0')} ${String(9 + Math.floor(Math.random() * 8)).padStart(2, '0')}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}`,
              author: admin,
              status: '진행중',
              memo: pickRandom(adminMemoPool)
            });
          }
          if (status === '완료') {
            history.push({
              date: `${completedDate} ${String(9 + Math.floor(Math.random() * 8)).padStart(2, '0')}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}`,
              author: admin,
              status: '완료',
              memo: '개선 조치 완료 확인. 후속 리포트에서 지표 개선 여부 모니터링 예정.'
            });
          }

          data.push({
            no: no++,
            reportType,
            periodFrom,
            periodTo,
            contents: pickContents(),
            admin,
            status,
            completedDate,
            history
          });
        }
      }

      return data.sort((a, b) => b.no - a.no);
    }

    let allData = generateData();

    (function mergeExternalItems() {
      const stored = JSON.parse(localStorage.getItem('AICC_IMPROVEMENT_ITEMS') || '[]');
      if (stored.length === 0) return;
      let maxNo = allData.reduce((mx, d) => Math.max(mx, d.no), 0);
      stored.forEach(item => {
        maxNo++;
        allData.unshift({
          no: maxNo,
          reportType: item.reportType || '조건 검색',
          periodFrom: item.periodFrom || '',
          periodTo: item.periodTo || '',
          contents: item.contents || [],
          admin: item.admin || '',
          status: item.status || '미이행',
          completedDate: item.completedDate || '-',
          history: item.history || []
        });
      });
    })();

    let filtered = [...allData];
    let periodInfo = null;
    let currentPage = 1;
    let pageSize = 20;

    let expandedNo = null;

    const reportTypeBadge = (type) => {
      const reportLabels = { '일간':'일간 리포트', '주간':'주간 리포트', '월간':'월간 리포트', '연간':'연간 리포트' };
      const colors = { '일간':'background:#E3F2FD;color:#1565C0', '주간':'background:#E8F5E9;color:#2E7D32', '월간':'background:#F3E5F5;color:#7B1FA2', '연간':'background:#FFF3E0;color:#E65100' };
      const label = reportLabels[type] || type;
      return `<span style="padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;white-space:nowrap;${colors[type]||'background:#F5F5F5;color:#757575'}">${label}</span>`;
    };

    /* ══════════════════════════ 렌더링 ══════════════════════════ */

    function renderTable() {
      const start = (currentPage - 1) * pageSize;
      const pageData = filtered.slice(start, start + pageSize);
      document.getElementById('item-count').textContent = `총 ${filtered.length}건`;

      document.getElementById('imp-tbody').innerHTML = pageData.map(d => {
        const isExpanded = expandedNo === d.no;
        const firstContent = d.contents[0] || '';
        const periodStr = formatPeriod(d);
        return `
        <tr onclick="toggleAccordion(${d.no})" style="cursor:pointer;transition:background 0.15s;" onmouseenter="this.style.background='#FAFAFA'" onmouseleave="this.style.background=''">
          <td style="text-align:center;color:#757575;">${d.no}</td>
          <td style="text-align:center;">${reportTypeBadge(d.reportType)}</td>
          <td style="text-align:center;font-size:11px;color:#757575;white-space:nowrap;">${periodStr}</td>
          <td style="font-size:12px;padding:8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:0;text-align:left;">
            ${firstContent}${d.contents.length > 1 ? `<span style="color:#9E9E9E;font-size:10px;margin-left:6px;">[외${d.contents.length - 1}건]</span>` : ''}
          </td>
          <td style="text-align:center;">${d.admin}</td>
          <td style="text-align:center;"><span class="status-badge status-${d.status}">${d.status}</span></td>
          <td style="text-align:center;font-size:11px;color:#757575;">${d.completedDate}</td>
          <td style="text-align:center;"><button class="detail-btn" onclick="event.stopPropagation();openDetail(${d.no})">처리내역</button></td>
        </tr>
        ${isExpanded ? `<tr style="background:#FAFAFA;">
          <td colspan="3" style="padding:0;"></td>
          <td colspan="5" style="padding:2px 10px 10px 10px;text-align:left;">
            ${d.contents.map((c, i) => `<div style="font-size:12px;line-height:1.5;color:#424242;padding:3px 0;">${i+1}. ${c}</div>`).join('')}
          </td>
        </tr>` : ''}`;
      }).join('');

      renderPagination();
    }

    function toggleAccordion(no) {
      expandedNo = expandedNo === no ? null : no;
      renderTable();
    }

    function renderPagination() {
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;
      let html = '';
      const startPage = Math.max(1, currentPage - 2);
      const endPage = Math.min(totalPages, startPage + 4);
      for (let i = startPage; i <= endPage; i++) {
        html += `<button class="pagination-btn${i === currentPage ? ' active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      document.getElementById('page-buttons').innerHTML = html;
    }

    function goPage(p) {
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (p === 'first') currentPage = 1;
      else if (p === 'last') currentPage = totalPages;
      else currentPage = p;
      renderTable();
    }

    function changePageSize() {
      pageSize = parseInt(document.getElementById('page-size-select').value);
      currentPage = 1;
      renderTable();
    }

    /* ══════════════════════════ 필터 ══════════════════════════ */

    function applyFilter() {
      const reportType = document.getElementById('f-report-type').value;
      const admin = document.getElementById('f-admin').value.trim().toLowerCase();
      const status = document.getElementById('f-status').value;

      let dateFrom = '', dateTo = '';
      if (periodInfo) {
        if (periodInfo.type === 'daily') { dateFrom = periodInfo.date; dateTo = periodInfo.date; }
        else if (periodInfo.type === 'weekly' || periodInfo.type === 'custom') { dateFrom = periodInfo.from || ''; dateTo = periodInfo.to || ''; }
        else if (periodInfo.type === 'monthly') { dateFrom = `${periodInfo.year}-${String(periodInfo.month).padStart(2,'0')}-01`; dateTo = `${periodInfo.year}-${String(periodInfo.month).padStart(2,'0')}-31`; }
        else if (periodInfo.type === 'yearly') { dateFrom = `${periodInfo.year}-01-01`; dateTo = `${periodInfo.year}-12-31`; }
      }

      filtered = allData.filter(d => {
        if (dateFrom && d.periodFrom < dateFrom) return false;
        if (dateTo && d.periodTo > dateTo) return false;
        if (reportType !== 'all' && d.reportType !== reportType) return false;
        if (admin && !d.admin.toLowerCase().includes(admin)) return false;
        if (status !== 'all' && d.status !== status) return false;
        return true;
      });

      currentPage = 1;
      renderTable();
    }

    function resetFilter() {
      periodInfo = null;
      document.getElementById('f-report-type').value = 'all';
      document.getElementById('f-admin').value = '';
      document.getElementById('f-status').value = 'all';

      const pickerEl = document.getElementById('f-period-picker');
      pickerEl.innerHTML = '';
      AICC_PeriodPicker.create('f-period-picker', {
        defaultPeriod: 'monthly',
        onChange: function(type, info) { periodInfo = info; }
      });

      filtered = [...allData];
      currentPage = 1;
      renderTable();
    }

    /* ══════════════════════════ 모달 ══════════════════════════ */

    function openDetail(no) {
      const d = allData.find(x => x.no === no);
      if (!d) return;
      initDtpState();

      const statusOptions = ['미이행','진행중','완료'].map(s =>
        `<option${d.status === s ? ' selected' : ''}>${s}</option>`
      ).join('');

      const timelineHtml = d.history.length > 0
        ? d.history.map((h, i) => `
          <div class="tl-item" style="margin-bottom:10px;">
            <div class="tl-dot${i === d.history.length - 1 ? ' active' : ''}"></div>
            <div style="flex:1;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;">
                <span style="font-size:11px;color:#757575;">${h.date}</span>
                <span class="status-badge status-${h.status}" style="font-size:10px;padding:2px 8px;">${h.status}</span>
              </div>
              <div style="font-size:11px;font-weight:600;color:#424242;">${h.author}</div>
              <div style="font-size:12px;color:#616161;margin-top:2px;line-height:1.4;">${h.memo}</div>
            </div>
          </div>
        `).join('')
        : '<div style="font-size:12px;color:#9E9E9E;text-align:center;padding:16px;">처리 이력 없음</div>';

      const body = `
        <div style="display:flex;gap:0;height:100%;">
          <div style="flex:1;padding:20px;border-right:1px solid #EEEEEE;display:flex;flex-direction:column;max-height:520px;overflow-y:auto;">
            <div style="font-size:14px;font-weight:700;color:#212121;margin-bottom:16px;">개선 제안 정보</div>
            <div style="margin-bottom:12px;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">유형</div>
              <div style="font-size:13px;font-weight:500;">${d.reportType} 리포트</div>
            </div>
            <div style="margin-bottom:12px;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">기간</div>
              <div style="font-size:13px;font-weight:500;">${formatPeriod(d)}</div>
            </div>
            <div style="flex:1;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">개선 제안 내용</div>
              <div style="font-size:13px;line-height:1.6;background:#F9F9F9;border-radius:6px;padding:12px;border:1px solid #EEEEEE;">
                ${d.contents.map((c, i) => `<div style="padding:2px 0;">${i+1}. ${c}</div>`).join('')}
              </div>
            </div>
          </div>

          <div style="flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;max-height:520px;overflow-y:auto;overflow-x:visible;">
            <div style="font-size:14px;font-weight:700;color:#212121;">처리 관리</div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">조치 날짜</div>
              <div id="modal-action-date-trigger" class="form-input" style="width:203px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;" onclick="toggleDatetimePicker()">
                <span id="modal-action-date-display">${getNow()}</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="flex-shrink:0;"><rect x="1.5" y="2.5" width="13" height="12" rx="1.5" stroke="#9E9E9E" stroke-width="1.2"/><path d="M1.5 6h13" stroke="#9E9E9E" stroke-width="1.2"/><path d="M5 1v3M11 1v3" stroke="#9E9E9E" stroke-width="1.2" stroke-linecap="round"/></svg>
              </div>
              <input type="hidden" id="modal-action-date" value="${getNow()}">
            </div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">담당자</div>
              <div style="display:flex;gap:6px;">
                <input type="text" id="modal-admin" class="form-input" style="width:203px;" value="${AICC_Auth.getCurrentUser().name}" onfocus="this.select()">
                <button class="btn btn-sm" onclick="openAdminSearch()" style="white-space:nowrap;border:1px solid #D8DAE5;background:#fff;color:#424242;">검색</button>
              </div>
            </div>
            <div>
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">이행 상태</div>
              <select id="modal-status" class="form-select" style="width:203px;">${statusOptions}</select>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;">
              <div style="font-size:11px;color:#9E9E9E;margin-bottom:4px;">처리 메모</div>
              <textarea id="modal-memo" class="form-input" style="flex:1;min-height:80px;resize:none;" placeholder="처리 내용을 입력하세요"></textarea>
              <div style="display:flex;justify-content:flex-end;margin-top:8px;">
                <button class="btn btn-primary btn-sm" onclick="saveDetail(${d.no})">저장</button>
              </div>
            </div>
          </div>
        </div>

        <div style="border-top:1px solid #EEEEEE;padding:16px 20px;max-height:200px;overflow-y:auto;">
          <div style="font-size:13px;font-weight:700;color:#212121;margin-bottom:12px;">처리 이력</div>
          ${timelineHtml}
        </div>
      `;

      AICC_Modal.open({
        title: `개선 이행 관리 — NO.${d.no}`,
        content: body,
        size: 'xl'
      });
    }

    function saveDetail(no) {
      const d = allData.find(x => x.no === no);
      if (!d) return;

      const actionDate = document.getElementById('modal-action-date').value;
      if (!actionDate) { AICC_Toast.show('조치 날짜를 선택해주세요.'); return; }
      const adminName = document.getElementById('modal-admin').value.trim();
      if (!adminName) { AICC_Toast.show('담당자를 입력해주세요.'); return; }
      const newStatus = document.getElementById('modal-status').value;
      const memo = document.getElementById('modal-memo').value.trim();
      if (!memo) { AICC_Toast.show('처리 메모를 입력해주세요.'); return; }

      d.admin = adminName;
      d.status = newStatus;
      if (newStatus === '완료') {
        d.completedDate = actionDate.split(' ')[0];
      }

      d.history.push({
        date: actionDate,
        author: adminName,
        status: newStatus,
        memo
      });

      AICC_Modal.close();
      AICC_Toast.show('처리내역이 저장되었습니다.');
      renderTable();
    }

    /* ══════════════════════════ 초기화 ══════════════════════════ */

    document.addEventListener('DOMContentLoaded', () => {
      AICC_PeriodPicker.create('f-period-picker', {
        defaultPeriod: 'monthly',
        onChange: function(type, info) { periodInfo = info; }
      });
      renderTable();
    });
  </script>
</body>
</html>
