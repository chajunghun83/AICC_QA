<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>이슈 처리 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .status-badge {
      display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap;
    }
    .status-미처리    { background:#FFEBEE;color:#C62828; }
    .status-검토필요  { background:#FFF3E0;color:#E65100; }
    .status-처리완료  { background:#E8F5E9;color:#2E7D32; }
    .status-이슈없음  { background:#F5F5F5;color:#9E9E9E; }

    .detail-btn {
      padding:4px 12px;border-radius:4px;font-size:11px;font-weight:600;
      background:#E3F2FD;color:#1565C0;border:1px solid #BBDEFB;cursor:pointer;
      transition:all 0.15s;
    }
    .detail-btn:hover { background:#BBDEFB; }

    .tl-item { display:flex;gap:12px;position:relative;padding-left:20px; }
    .tl-item::before {
      content:'';position:absolute;left:6px;top:24px;bottom:-8px;width:2px;background:#E0E0E0;
    }
    .tl-item:last-child::before { display:none; }
    .tl-dot {
      position:absolute;left:0;top:6px;width:14px;height:14px;border-radius:50%;border:2px solid #E0E0E0;background:white;flex-shrink:0;
    }
    .tl-dot.active { border-color:#00A3FF;background:#E3F2FD; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 헤더 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">이슈 처리 관리</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">에스컬레이션 이슈 현황 및 처리 이력 관리</p>
      </div>
    </div>

    <!-- 검색 필터 -->
    <div class="filter-section">
      <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">일시 (시작)</label>
          <input type="date" class="form-input" id="f-date-from" style="min-width:130px;">
        </div>
        <div>
          <label class="form-label">일시 (종료)</label>
          <input type="date" class="form-input" id="f-date-to" style="min-width:130px;">
        </div>
        <div>
          <label class="form-label">콜 ID</label>
          <input type="text" class="form-input" id="f-callid" placeholder="콜 ID 검색" style="min-width:130px;">
        </div>
        <div>
          <label class="form-label">상담사</label>
          <input type="text" class="form-input" id="f-agent" placeholder="상담사명 검색" style="min-width:110px;">
        </div>
        <div>
          <label class="form-label">이슈 키워드</label>
          <input type="text" class="form-input" id="f-keyword" placeholder="키워드 검색" style="min-width:110px;">
        </div>
        <div>
          <label class="form-label">관리자</label>
          <input type="text" class="form-input" id="f-admin" placeholder="관리자 검색" style="min-width:110px;">
        </div>
        <div>
          <label class="form-label">상태</label>
          <select class="form-select" id="f-status" style="min-width:120px;">
            <option value="all">전체</option>
            <option value="미처리">미처리</option>
            <option value="검토 필요">검토 필요</option>
            <option value="처리완료">처리완료</option>
            <option value="이슈 없음">이슈 없음</option>
          </select>
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="applyFilter()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">이슈 목록</span>
        <span style="font-size:12px;color:#757575;" id="issue-count">총 0건</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <div style="overflow-x:auto;">
          <table class="data-table" style="min-width:1400px;">
            <colgroup>
              <col style="width:8%"><col style="width:9%"><col style="width:8%">
              <col style="width:5%"><col style="width:13%"><col style="width:4%">
              <col style="width:5%"><col style="width:5%"><col style="width:11%">
              <col style="width:6%"><col style="width:7%"><col style="width:6%">
              <col style="width:6%">
            </colgroup>
            <thead>
              <tr>
                <th>콜 ID</th><th>일시</th><th>센터/팀</th><th>상담사</th>
                <th>상담유형</th><th>유형</th><th>재인입</th><th>통화시간</th>
                <th>이슈 키워드</th><th>관리자</th><th>처리 완료일</th><th>상태</th>
                <th>처리내역</th>
              </tr>
            </thead>
            <tbody id="issue-tbody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button class="pagination-btn" onclick="goPage('first')">&laquo;</button>
          <span id="page-buttons"></span>
          <button class="pagination-btn" onclick="goPage('last')">&raquo;</button>
          <span style="margin-left:16px;font-size:12px;color:#757575;">페이지당:
            <select class="form-select" id="page-size-select" style="min-width:60px;padding:2px 24px 2px 8px;" onchange="changePageSize()">
              <option>10</option>
              <option selected>20</option>
              <option>50</option>
            </select>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script>
    /* ══════════════════════════ 더미데이터 ══════════════════════════ */

    const agents = ['김민수','이영희','박신입','정하은','최지우','한동해','오세진','윤서연','강태양','송미래'];
    const admins = ['박관리자','이팀장','최수석','정매니저','한차장'];
    const centers = [
      { name:'서울센터', teams:['VIP상담팀','일반상담팀','기술지원팀'] },
      { name:'부산센터', teams:['일반상담팀','해피콜팀'] },
      { name:'대구센터', teams:['일반상담팀','CS팀'] }
    ];

    const consultationTypes = [
      '주문 > 주문조회 > 주문상태 > 배송현황확인',
      '주문 > 주문변경 > 수량변경',
      '주문 > 주문취소 > 단순변심 > 전체취소',
      '결제 > 카드결제 > 결제오류 > 승인실패',
      '결제 > 결제취소 > 부분취소',
      '배송 > 배송기간 > 배송지연 > 택배지연',
      '배송 > 배송현황 > 일반배송 > 택배추적',
      '교환/반품 > 반품접수 > 상품불량 > 파손',
      '교환/반품 > 반품접수 > 상품불량 > 오배송',
      '교환/반품 > 환불처리 > 환불지연',
      '고객불만 > 서비스불만 > 응대불만',
      '고객불만 > 보상요구 > 환불요구',
      'A/S > A/S접수 > 수선요청 > 의류수선'
    ];

    const issueKeywordPool = [
      ['배송지연','택배분실'],['상품불량','포장파손'],['환불지연','결제오류'],
      ['사이즈불일치','교환지연'],['오배송','수량부족'],['응대불만','대기시간'],
      ['쿠폰오류','적립금누락'],['반품거부','환불방법'],['배송추적불가','물류지연'],
      ['이중결제','가격오류'],['상품파손','제품하자'],['포장불량','누락배송']
    ];

    /* 상담사가 에스컬레이션 시 남기는 메모 템플릿 */
    const agentMemoPool = [
      '고객이 배송 지연 건으로 강하게 불만 표시. 3회 이상 재문의하셨으며 상위 관리자 확인 요청드립니다.',
      '결제 오류로 인해 이중 결제가 발생한 건입니다. 카드사 확인 후 환불 처리가 필요합니다.',
      '상품 불량(지퍼 파손)으로 교환 요청하셨으나 재고 부족으로 처리가 어렵습니다. 관리자 판단 부탁드립니다.',
      '고객이 환불을 강하게 요구하고 있으며, 기존 정책으로는 대응이 어려운 상황입니다.',
      '오배송 건으로 고객 불만이 심합니다. 즉시 재배송과 보상 관련 관리자 승인이 필요합니다.',
      '사이즈 교환 요청이나 해당 사이즈 재고가 없어 환불 또는 다른 상품 교환으로 안내 필요합니다.',
      '고객이 응대 불만을 접수하였습니다. 상담 녹음 확인 후 적절한 조치가 필요합니다.',
      '택배 분실 건으로 택배사와 조율이 필요합니다. 고객에게 보상 안내가 필요한 상황입니다.',
      '적립금 누락 건으로 시스템 확인이 필요합니다. 고객이 다수 주문 건에서 적립금이 적용되지 않았다고 합니다.',
      '반품 거부된 건에 대해 고객이 재심사를 요청하고 있습니다. 사진 증빙 첨부되어 있으니 확인 부탁드립니다.'
    ];

    /* 관리자 처리 메모 템플릿 */
    const adminMemoPool = [
      '택배사 확인 완료. 물류센터 지연으로 인한 배송 지연 확인됨. 고객에게 사과 및 배송 완료 안내.',
      '카드사 연락하여 이중 결제 확인. 환불 처리 진행 중. 영업일 3일 내 환불 예정.',
      '재고 확인 결과 다음 주 입고 예정. 고객에게 교환 일정 안내 완료.',
      '고객 재연락 후 상황 확인. 추가 확인 필요하여 검토 중.',
      '환불 정책 예외 승인. 전액 환불 처리 완료.',
      '오배송 확인. 즉시 재배송 처리 및 사과 쿠폰 발행.',
      '상담 녹음 확인 결과 응대 미흡 확인. 해당 상담사 코칭 진행 예정.',
      '택배사와 분실 건 협의 완료. 고객 보상(동일 상품 재발송) 처리.',
      '시스템 점검 결과 적립금 오류 확인. 일괄 보정 처리 완료.',
      '사진 확인 결과 상품 하자 인정. 반품 승인 및 환불 처리 진행.',
      '고객 추가 요청사항 확인 중. 내일 중 최종 답변 예정.',
      '최종 처리 완료. 고객 확인 및 만족 응답 받음.'
    ];

    const statusList = ['미처리','검토 필요','처리완료','이슈 없음'];
    const statusCls  = { '미처리':'status-미처리', '검토 필요':'status-검토필요', '처리완료':'status-처리완료', '이슈 없음':'status-이슈없음' };

    function randItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
    function pad2(n) { return String(n).padStart(2, '0'); }

    /* 이력 생성: 상태에 따라 1~3건 */
    function generateHistory(status, agent, admin, baseDate) {
      const history = [];
      const d = new Date(baseDate);

      // v1: 상담사가 에스컬레이션
      history.push({
        version: 1,
        date: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(randInt(8,18))}:${pad2(randInt(0,59))}`,
        author: agent,
        status: '미처리',
        memo: '이슈 에스컬레이션 등록'
      });

      if (status === '미처리') return history;

      // v2: 관리자 검토
      d.setDate(d.getDate() + randInt(1, 3));
      history.push({
        version: 2,
        date: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(randInt(8,18))}:${pad2(randInt(0,59))}`,
        author: admin,
        status: '검토 필요',
        memo: adminMemoPool[Math.floor(Math.random() * 4) + 3]
      });

      if (status === '검토 필요') return history;

      // v3: 최종 처리
      d.setDate(d.getDate() + randInt(1, 4));
      const finalStatus = status;
      history.push({
        version: 3,
        date: `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(randInt(8,18))}:${pad2(randInt(0,59))}`,
        author: admin,
        status: finalStatus,
        memo: finalStatus === '처리완료'
          ? adminMemoPool[Math.floor(Math.random() * 3)]
          : '확인 결과 이슈 해당 없음으로 판단. 종결 처리.'
      });

      return history;
    }

    /* 50건 더미 데이터 생성 */
    function generateIssueData() {
      const data = [];
      for (let i = 1; i <= 50; i++) {
        const c = randItem(centers);
        const team = randItem(c.teams);
        const agent = randItem(agents);
        const admin = randItem(admins);
        const ct = randItem(consultationTypes);
        const keywords = randItem(issueKeywordPool);
        const day = pad2(randInt(1, 28));
        const hour = pad2(randInt(8, 18));
        const min = pad2(randInt(0, 59));
        const durSec = randInt(120, 2400);
        const durStr = `${pad2(Math.floor(durSec / 60))}:${pad2(durSec % 60)}`;

        /* 상태 비율: 미처리 30%, 검토필요 25%, 처리완료 35%, 이슈없음 10% */
        const r = Math.random();
        const status = r < 0.30 ? '미처리' : r < 0.55 ? '검토 필요' : r < 0.90 ? '처리완료' : '이슈 없음';

        const baseDate = `2025-03-${day}`;
        const history = generateHistory(status, agent, admin, baseDate);

        const completedEntry = history.find(h => h.status === '처리완료' || h.status === '이슈 없음');
        const completedDate = completedEntry ? completedEntry.date.split(' ')[0] : null;

        data.push({
          id: `TA-2025-${String(i).padStart(5, '0')}`,
          date: `2025-03-${day}`,
          time: `${hour}:${min}`,
          center: c.name,
          team,
          agent,
          consultationType: ct,
          callType: Math.random() > 0.35 ? 'I/B' : 'O/B',
          reentry: (() => { const rv = Math.random(); return rv < 0.5 ? 1 : rv < 0.8 ? 2 : rv < 0.95 ? 3 : 4; })(),
          duration: durStr,
          issueKeywords: keywords,
          agentMemo: randItem(agentMemoPool),
          admin,
          status,
          completedDate,
          history
        });
      }
      return data.sort((a, b) => (`${b.date} ${b.time}`).localeCompare(`${a.date} ${a.time}`));
    }

    const issueData = generateIssueData();

    /* 첫 번째 항목(정렬 후 최상단)을 최지우 고정 + 이력 3건 */
    if (issueData.length > 0) {
      const first = issueData[0];
      first.agent = '최지우';
      first.status = '처리완료';
      first.admin = '박관리자';
      first.completedDate = '2025-03-22';
      first.agentMemo = '고객이 배송 지연 건으로 강하게 불만 표시. 3회 이상 재문의하셨으며 상위 관리자 확인 요청드립니다.';
      first.history = [
        { version:1, date:'2025-03-18 09:32', author:'최지우', status:'미처리', memo:'배송 지연 건 고객 불만 접수. 3회 이상 재문의로 에스컬레이션 등록합니다.' },
        { version:2, date:'2025-03-20 14:15', author:'박관리자', status:'검토 필요', memo:'택배사 확인 중. 물류센터 지연으로 추정되며 고객 재연락 후 상세 확인 예정.' },
        { version:3, date:'2025-03-22 11:40', author:'박관리자', status:'처리완료', memo:'택배사 확인 완료. 물류센터 지연 확인. 고객에게 사과 및 배송 완료 안내, 보상 쿠폰 발행 처리.' }
      ];
    }

    let filteredData = [...issueData];
    let currentPage = 1;
    let pageSize = 20;

    /* ══════════════════════════ 전체 콜 현황 연동 ══════════════════════════ */

    function goCallStatus(keyword) {
      window.location.href = 'call-status.html?filter=keyword&value=' + encodeURIComponent(keyword);
    }

    /* ══════════════════════════ 필터 ══════════════════════════ */

    function applyFilter() {
      const fId = document.getElementById('f-callid').value.trim().toLowerCase();
      const fDateFrom = document.getElementById('f-date-from').value;
      const fDateTo = document.getElementById('f-date-to').value;
      const fAgent = document.getElementById('f-agent').value.trim().toLowerCase();
      const fKw = document.getElementById('f-keyword').value.trim().toLowerCase();
      const fAdmin = document.getElementById('f-admin').value.trim().toLowerCase();
      const fStatus = document.getElementById('f-status').value;

      filteredData = issueData.filter(d => {
        if (fId && !d.id.toLowerCase().includes(fId)) return false;
        if (fDateFrom && d.date < fDateFrom) return false;
        if (fDateTo && d.date > fDateTo) return false;
        if (fAgent && !d.agent.includes(fAgent)) return false;
        if (fKw && !d.issueKeywords.some(k => k.toLowerCase().includes(fKw))) return false;
        if (fAdmin && !d.admin.includes(fAdmin)) return false;
        if (fStatus !== 'all' && d.status !== fStatus) return false;
        return true;
      });

      currentPage = 1;
      renderTable();
      AICC_Toast.show(`검색 결과: ${filteredData.length}건`);
    }

    function resetFilter() {
      document.getElementById('f-callid').value = '';
      document.getElementById('f-date-from').value = '';
      document.getElementById('f-date-to').value = '';
      document.getElementById('f-agent').value = '';
      document.getElementById('f-keyword').value = '';
      document.getElementById('f-admin').value = '';
      document.getElementById('f-status').value = 'all';
      filteredData = [...issueData];
      currentPage = 1;
      renderTable();
      AICC_Toast.show('필터가 초기화되었습니다.');
    }

    /* ══════════════════════════ 테이블 렌더링 ══════════════════════════ */

    function renderTable() {
      document.getElementById('issue-count').textContent = `총 ${filteredData.length}건`;
      const start = (currentPage - 1) * pageSize;
      const pageData = filteredData.slice(start, start + pageSize);
      const tbody = document.getElementById('issue-tbody');

      tbody.innerHTML = pageData.map(d => {
        const typeBadge = d.callType === 'I/B'
          ? '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>'
          : '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>';

        const reentryHtml = d.reentry >= 3
          ? `<span style="display:inline-block;padding:2px 8px;background:#ffebee;color:#c62828;border-radius:4px;font-size:11px;font-weight:600;">${d.reentry}회차</span>`
          : d.reentry === 2
            ? '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">2회차</span>'
            : '-';

        const chips = d.issueKeywords.map(k =>
          `<span style="display:inline-block;padding:2px 8px;margin:1px 2px;border-radius:10px;font-size:11px;background:#FFF3F3;color:#E53935;border:1px solid #FFCDD2;">${k}</span>`
        ).join('');

        const cls = statusCls[d.status] || 'status-미처리';

        return `<tr style="cursor:pointer;" onclick="goCallStatus('${d.issueKeywords[0]}')">
          <td style="font-size:12px;">${d.id}</td>
          <td style="font-size:12px;white-space:nowrap;">${d.date} ${d.time}</td>
          <td style="font-size:12px;white-space:nowrap;">${d.center} &gt; ${d.team}</td>
          <td style="font-size:12px;">${d.agent}</td>
          <td style="font-size:11px;color:#424242;text-align:left;padding:6px 8px;">${d.consultationType}</td>
          <td>${typeBadge}</td>
          <td>${reentryHtml}</td>
          <td style="font-size:12px;white-space:nowrap;">${d.duration}</td>
          <td style="padding:6px 6px;text-align:left;">${chips}</td>
          <td style="font-size:12px;">${d.admin}</td>
          <td style="font-size:12px;white-space:nowrap;">${d.completedDate || '-'}</td>
          <td><span class="status-badge ${cls}">${d.status}</span></td>
          <td><button class="detail-btn" onclick="event.stopPropagation();openDetail('${d.id}')">상세</button></td>
        </tr>`;
      }).join('');

      renderPagination();
    }

    /* ══════════════════════════ 페이지네이션 ══════════════════════════ */

    function renderPagination() {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
      const container = document.getElementById('page-buttons');
      let html = '';
      const startP = Math.max(1, currentPage - 2);
      const endP = Math.min(totalPages, startP + 4);
      for (let p = startP; p <= endP; p++) {
        html += `<button class="pagination-btn${p === currentPage ? ' active' : ''}" onclick="goPage(${p})">${p}</button>`;
      }
      container.innerHTML = html;
    }

    function goPage(p) {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
      if (p === 'first') currentPage = 1;
      else if (p === 'last') currentPage = totalPages;
      else currentPage = Math.max(1, Math.min(totalPages, p));
      renderTable();
    }

    function changePageSize() {
      pageSize = parseInt(document.getElementById('page-size-select').value);
      currentPage = 1;
      renderTable();
    }

    /* ══════════════════════════ 처리내역 모달 ══════════════════════════ */

    function openDetail(callId) {
      const d = issueData.find(x => x.id === callId);
      if (!d) return;

      /* ── 왼쪽: 콜 정보 + 상담사 이슈 메모 ── */
      const infoRows = [
        { label:'콜 ID', value:`<span style="font-weight:600;">${d.id}</span>` },
        { label:'일시', value:`<span style="font-weight:600;">${d.date} ${d.time}</span>` },
        { label:'센터', value:d.center },
        { label:'팀', value:d.team },
        { label:'상담사', value:d.agent },
        { label:'상담 유형', value:`<span style="font-size:12px;">${d.consultationType}</span>` },
        { label:'유형', value: d.callType === 'I/B'
          ? '<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>'
          : '<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>' },
        { label:'재인입', value: d.reentry >= 2 ? `${d.reentry}회차` : '-' },
        { label:'통화시간', value:d.duration },
        { label:'이슈 키워드', value: d.issueKeywords.map(k =>
          `<span style="display:inline-block;padding:2px 8px;margin:1px;border-radius:10px;font-size:11px;background:#FFF3F3;color:#E53935;border:1px solid #FFCDD2;">${k}</span>`
        ).join(' ') }
      ];

      const infoHtml = infoRows.map(r =>
        `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0F0F0;">
          <span style="color:#757575;font-size:12px;flex-shrink:0;min-width:70px;">${r.label}</span>
          <span style="text-align:right;font-weight:500;color:#212121;font-size:13px;">${r.value}</span>
        </div>`
      ).join('');

      const leftHtml = `
        <div style="padding:20px;border-right:1px solid #EEEEEE;overflow-y:auto;display:flex;flex-direction:column;">
          <div style="font-size:14px;font-weight:700;margin-bottom:12px;color:#212121;">콜 정보</div>
          <div style="font-size:13px;">${infoHtml}</div>
          <div style="margin-top:16px;">
            <div style="font-size:13px;font-weight:700;color:#212121;margin-bottom:8px;">상담사 이슈 메모</div>
            <div style="background:#F9F9F9;border:1px solid #E0E0E0;border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.7;color:#424242;white-space:pre-wrap;">${d.agentMemo}</div>
          </div>
        </div>`;

      /* ── 오른쪽: 처리 관리 폼 ── */
      const statusOptions = ['이슈 없음','검토 필요','처리완료'].map(s =>
        `<option value="${s}"${d.status === s ? ' selected' : ''}>${s}</option>`
      ).join('');

      const rightHtml = `
        <div style="padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;">
          <div style="font-size:14px;font-weight:700;color:#212121;">처리 관리</div>
          <div>
            <label style="font-size:12px;font-weight:600;color:#757575;display:block;margin-bottom:4px;">관리자</label>
            <div style="font-size:13px;font-weight:600;color:#212121;padding:8px 12px;background:#F5F5F5;border-radius:6px;">${d.admin}</div>
          </div>
          <div>
            <label style="font-size:12px;font-weight:600;color:#757575;display:block;margin-bottom:4px;">이슈 상태</label>
            <select id="modal-status" class="form-select" style="width:100%;">${statusOptions}</select>
          </div>
          <div style="flex:1;display:flex;flex-direction:column;">
            <label style="font-size:12px;font-weight:600;color:#757575;display:block;margin-bottom:4px;">처리 메모</label>
            <textarea id="modal-memo" style="flex:1;min-height:80px;width:100%;padding:10px 12px;border:1px solid #E0E0E0;border-radius:6px;font-size:13px;line-height:1.6;resize:none;font-family:inherit;" placeholder="처리 내용을 입력하세요..."></textarea>
            <div style="display:flex;justify-content:flex-end;margin-top:8px;">
              <button class="btn btn-primary btn-sm" onclick="saveDetail('${d.id}')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                저장
              </button>
            </div>
          </div>
        </div>`;

      /* ── 하단: 버전 이력 타임라인 ── */
      const reversed = [...d.history].reverse();
      const timelineHtml = reversed.map((h, idx) => {
        const isLatest = idx === 0;
        const cls = statusCls[h.status] || 'status-미처리';
        return `<div class="tl-item" style="margin-bottom:${idx < reversed.length - 1 ? '16' : '0'}px;">
          <div class="tl-dot${isLatest ? ' active' : ''}"></div>
          <div style="flex:1;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:11px;font-weight:700;color:#00A3FF;">v${h.version}</span>
              <span style="font-size:11px;color:#757575;">${h.date}</span>
              <span style="font-size:11px;font-weight:600;color:#424242;">${h.author}</span>
              <span class="status-badge ${cls}" style="font-size:10px;padding:2px 8px;">${h.status}</span>
            </div>
            <div style="margin-top:4px;font-size:12px;color:#616161;line-height:1.5;">${h.memo}</div>
          </div>
        </div>`;
      }).join('');

      const modalBody = `
        <div style="display:grid;grid-template-columns:1fr 1fr;height:calc(80vh - 100px);max-height:560px;">
          ${leftHtml}
          ${rightHtml}
        </div>
        <div style="border-top:1px solid #E0E0E0;padding:16px 20px;max-height:320px;overflow-y:auto;">
          <div style="font-size:13px;font-weight:700;color:#212121;margin-bottom:12px;">
            처리 이력
            <span style="font-size:11px;font-weight:400;color:#757575;margin-left:6px;">총 ${d.history.length}건</span>
          </div>
          ${timelineHtml}
        </div>`;

      AICC_Modal.open({
        title: `이슈 처리 - ${d.id}`,
        content: modalBody,
        size: 'xl'
      });

      requestAnimationFrame(() => {
        const body = document.querySelector('#aicc-modal-backdrop .modal-body');
        if (body) { body.style.overflow = 'auto'; body.style.padding = '0'; }
      });
    }

    /* ══════════════════════════ 모달 저장 ══════════════════════════ */

    function saveDetail(callId) {
      const d = issueData.find(x => x.id === callId);
      if (!d) return;

      const newStatus = document.getElementById('modal-status').value;
      const newMemo = document.getElementById('modal-memo').value.trim();

      if (!newMemo) {
        AICC_Toast.show('처리 메모를 입력해주세요.');
        return;
      }

      const now = new Date();
      const dateStr = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())} ${pad2(now.getHours())}:${pad2(now.getMinutes())}`;

      d.history.push({
        version: d.history.length + 1,
        date: dateStr,
        author: d.admin,
        status: newStatus,
        memo: newMemo
      });

      d.status = newStatus;
      if ((newStatus === '처리완료' || newStatus === '이슈 없음') && !d.completedDate) {
        d.completedDate = dateStr.split(' ')[0];
      }

      filteredData = filteredData.map(fd => fd.id === callId ? d : fd);

      AICC_Modal.close();
      renderTable();
      AICC_Toast.show(`${callId} 이슈 상태가 "${newStatus}"(으)로 변경되었습니다.`);
    }

    /* ══════════════════════════ 초기화 ══════════════════════════ */

    document.addEventListener('DOMContentLoaded', () => {
      /* URL 파라미터 기반 자동 필터링 (대시보드 미처리 리스트 연동) */
      const params = new URLSearchParams(window.location.search);
      const urlStatus = params.get('status');
      if (urlStatus) {
        document.getElementById('f-status').value = urlStatus;
        applyFilter();
      } else {
        renderTable();
      }
    });
  </script>
</body>
</html>
