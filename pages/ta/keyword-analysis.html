<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>키워드 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    /* ── 분류 드릴다운 패널 ── */
    .cat-panel { flex:1; min-width:0; display:flex; flex-direction:column; }
    .cat-panel-body { flex:1; overflow-y:auto; }
    .cat-item { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; cursor:pointer; border-bottom:1px solid #F5F5F5; font-size:13px; transition:background .15s; }
    .cat-item:hover { background:#F5F9FF; }
    .cat-item.active { background:#E3F2FD; font-weight:600; color:#1565C0; }
    .cat-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cat-meta { display:flex; align-items:center; gap:6px; flex-shrink:0; }
    .cat-cnt { font-size:11px; color:#9E9E9E; }
    .cat-item.active .cat-cnt { color:#1565C0; }
    .cat-placeholder { padding:36px 12px; text-align:center; color:#BDBDBD; font-size:12px; line-height:1.6; }
    .cat-arrow-sep { display:flex; align-items:center; justify-content:center; flex-shrink:0; color:#BDBDBD; width:16px; }
    /* ── 키워드 랭킹 ── */
    .kw-rank-row { display:flex; align-items:center; gap:10px; padding:7px 14px; border-bottom:1px solid #F5F5F5; font-size:13px; transition:background .15s; }
    .kw-rank-row:hover { background:#F5F9FF; }
    .kw-rank-row.active { background:#E3F2FD; }
    .kw-rank-row.active .kw-rank-name { font-weight:600; color:#1565C0; }
    .kw-rank-no { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:4px; font-size:11px; font-weight:700; color:#fff; flex-shrink:0; }
    .kw-rank-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#424242; }
    .kw-rank-cnt { font-size:12px; font-weight:600; color:#616161; flex-shrink:0; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 헤더 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">키워드</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">키워드 분석 결과</p>
      </div>
      <!-- 상단 필터 (표시용 — 기능은 후속) -->
      <div style="display:flex;align-items:center;gap:8px;">
        <select class="form-select" disabled><option>월간 · 2026년 5월</option></select>
        <select class="form-select" disabled><option>전체 센터</option></select>
        <select class="form-select" disabled><option>전체 팀</option></select>
      </div>
    </div>

    <!-- 상단: 키워드 흐름(검색▶연관1▶연관2) + 유형(대분류Top▶세분류) + 리스크
         그룹 사이 간격(32px)을 넓혀 3개 묶음이 시각적으로 구분되도록 한다 -->
    <div style="display:flex;gap:32px;margin-bottom:12px;align-items:stretch;">
      <!-- 키워드 그룹 -->
      <div style="flex:1.5;display:flex;gap:8px;align-items:stretch;min-width:0;height:250px;">
        <!-- 검색된 키워드 (검색창 + 결과 리스트) -->
        <div class="content-card cat-panel">
          <div class="content-card-header" style="padding:9px 14px;">
            <span style="font-size:13px;font-weight:700;">검색된 키워드</span>
          </div>
          <div style="padding:8px 10px;border-bottom:1px solid #EEEEEE;">
            <input type="text" id="kw-search-input" placeholder="키워드 검색..." oninput="onKwSearch(this.value)"
              style="width:100%;padding:6px 10px;border:1px solid #E0E0E0;border-radius:6px;font-size:12px;outline:none;">
          </div>
          <div class="cat-panel-body" id="kw-search-list"></div>
        </div>
        <div class="cat-arrow-sep"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
        <!-- 연관 키워드 1 -->
        <div class="content-card cat-panel">
          <div class="content-card-header" style="padding:9px 14px;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:13px;font-weight:700;">연관 키워드 1</span>
            <span class="cat-cnt" id="rel1-count"></span>
          </div>
          <div class="cat-panel-body" id="rel1-body"></div>
        </div>
        <div class="cat-arrow-sep"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
        <!-- 연관 키워드 2 -->
        <div class="content-card cat-panel">
          <div class="content-card-header" style="padding:9px 14px;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:13px;font-weight:700;">연관 키워드 2</span>
            <span class="cat-cnt" id="rel2-count"></span>
          </div>
          <div class="cat-panel-body" id="rel2-body"></div>
        </div>
      </div>

      <!-- 문의유형 그룹 -->
      <div style="flex:1;display:flex;gap:8px;align-items:stretch;min-width:0;height:250px;">
        <div class="content-card cat-panel">
          <div class="content-card-header" style="padding:9px 14px;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:13px;font-weight:700;">상담 유형 대분류</span>
            <span class="cat-cnt" id="type-d1-count"></span>
          </div>
          <div class="cat-panel-body" id="type-d1-body"></div>
        </div>
        <div class="cat-arrow-sep"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></div>
        <div class="content-card cat-panel">
          <div class="content-card-header" style="padding:9px 14px;display:flex;align-items:center;justify-content:space-between;">
            <span style="font-size:13px;font-weight:700;">상담 유형 세분류</span>
            <span class="cat-cnt" id="type-leaf-count"></span>
          </div>
          <div class="cat-panel-body" id="type-leaf-body"></div>
        </div>
      </div>

      <!-- 리스크 키워드 (전체 고정) -->
      <div style="flex:0 0 210px;display:flex;height:250px;">
        <div class="content-card" style="flex:1;display:flex;flex-direction:column;min-width:0;">
          <div class="content-card-header" style="padding:9px 14px;">
            <span style="font-size:13px;font-weight:700;">리스크 키워드</span>
          </div>
          <div style="flex:1;overflow-y:auto;" id="risk-list"></div>
        </div>
      </div>
    </div>

    <!-- 하단: 콜 목록 테이블 -->
    <div class="content-card">
      <div class="content-card-header" style="display:flex;align-items:center;justify-content:space-between;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:14px;font-weight:600;">전체 콜 현황</span>
          <span id="sel-path-badge" style="display:none;padding:2px 10px;background:#E3F2FD;color:#1565C0;border-radius:12px;font-size:12px;font-weight:600;"></span>
        </div>
        <span style="font-size:12px;color:#757575;" id="call-count">총 0건</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <colgroup>
            <col style="width:8%"><col style="width:9%"><col style="width:6%"><col style="width:6%">
            <col style="width:5%"><col style="width:6%"><col style="width:17%"><col style="width:6%">
            <col style="width:5%"><col style="width:6%"><col style="width:5%"><col style="width:10%"><col style="width:11%">
          </colgroup>
          <thead>
            <tr>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('id')">콜 ID <span id="sort-icon-id" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('date')">일시 <span id="sort-icon-date" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('center')">센터 <span id="sort-icon-center" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('team')">팀 <span id="sort-icon-team" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('empid')">사번 <span id="sort-icon-empid" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('agent')">상담사 <span id="sort-icon-agent" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('consult')">상담 유형 <span id="sort-icon-consult" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('duration')">통화시간 <span id="sort-icon-duration" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('type')">유형 <span id="sort-icon-type" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('silence')">묵음시간 <span id="sort-icon-silence" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;cursor:pointer;user-select:none;" onclick="toggleSort('reentry')">재인입 <span id="sort-icon-reentry" style="font-size:10px;color:#BDBDBD;">⇅</span></th>
              <th style="text-align:center;">상담 키워드</th>
              <th style="text-align:center;">리스크 키워드</th>
            </tr>
          </thead>
          <tbody id="call-tbody"></tbody>
        </table>
        <div class="pagination">
          <button class="pagination-btn" onclick="goPage('first')">&laquo;</button>
          <span id="page-buttons"></span>
          <button class="pagination-btn" onclick="goPage('last')">&raquo;</button>
          <span style="margin-left:16px;font-size:12px;color:#757575;">페이지당:
            <select class="form-select" id="page-size-select" style="min-width:60px;padding:2px 24px 2px 8px;" onchange="changePageSize()">
              <option>10</option>
              <option selected>20</option>
              <option>50</option>
            </select>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script>
    /* ════════════════════════════════════════════════════════════════
     *  키워드 페이지 — 키워드 연관 네트워크 + 상담유형 분류
     *
     *  [검색 → 연관 키워드 2단계]
     *   - [검색된 키워드] 패널: 검색창에 입력 → 매칭 키워드(상담+이슈, 종목 제외) 후보.
     *   - 키워드 선택 → [연관 키워드 1] 노출 → 그 중 선택 → [연관 키워드 2] 노출.
     *   - 연관 키워드 = 같은 콜에 함께 등장(공출현, co-occurrence)하는 키워드.
     *     공출현으로 "연관 후보"를 고르고, 표시 숫자는 그 키워드 단독 보유 콜 수(_kwCount)로
     *     통일 → 패널 숫자 = 클릭 시 테이블 "총 N건"과 정합. (relatedKeywords 참조)
     *   - 의미 클러스터(KEYWORD_CLUSTERS)를 콜 생성 시 주입해 공출현이 도메인상 의미를 가짐.
     *
     *  [키워드 → 상담유형 분류] 선택 키워드 보유 콜의 consultationType을 집계.
     *   - 상담유형 대분류: parts[0] 분포(목록은 키워드 맥락, 숫자는 분류 전체 = 테이블 정합).
     *   - 대분류 클릭 → 그 대분류의 세분류(마지막 뎁스, 3뎁스면 소분류) 노출.
     *   - 세분류 클릭 → 테이블을 (대분류+세분류)로 필터(키워드 빠짐, 중·소분류 자유).
     *     (classifyKeyword / leafByD1 참조)
     *
     *  [리스크 키워드] 전체 콜 issueKeywords 집계 Top5 고정. 클릭 시 그 키워드를
     *   "검색된 키워드"로 인식하여 연관 키워드 흐름을 시작한다(onSelectRisk).
     *
     *  [선택 정책] selectedKw = 마지막으로 선택한 키워드(누적 아님). 하단 테이블은
     *   selectedKw 보유 콜이며, 상담유형 대분류/세분류 선택 시 그 분류 기준으로 좁힌다.
     *  [재사용] 콜 생성기·스크립트 템플릿·콜 상세 모달·테이블은 call-status.html에서 차용.
     * ════════════════════════════════════════════════════════════════ */

    // [[DATA]] — 기준 데이터(상담사/센터/키워드풀/스크립트템플릿/분류트리)
    const agents = ['김민수','이영희','박신입','정하은','최지우','한동해','오세진','윤서연','강태양','송미래'];
    const AGENT_EMP_ID = {
      '김민수':'S-1001','이영희':'S-1002','박신입':'S-1003','정하은':'S-1004','최지우':'S-1005',
      '한동해':'S-1006','오세진':'S-1007','윤서연':'S-1008','강태양':'S-1009','송미래':'S-1010'
    };
    const centers = [
      { name:'서울센터', teams:['VIP고객팀','주식상담팀','HTS기술지원팀'] },
      { name:'부산센터', teams:['펀드상담팀','해피콜팀'] },
      { name:'대구센터', teams:['CS상담팀','아웃바운드팀'] }
    ];

    /* 추출 키워드 풀 (call-status.html과 동일) */
    const extractedKeywordPool = {
      issue: ['환매지연','거래체결오류','환불지연','오체결','거래기록누락','체결지연','이체오류','주문이력누락','정정지연','수량불일치','응대불만','대기시간','이벤트적용오류','매도가능수량부족','거래정지안내','미체결안내누락','이중주문','주문조회불가','시스템장애','호가오류','잔고불일치'],
      consult: ['공모청약','배당락','주식분할','신규상장','야간거래','주문번호','체결조회','환매접수','정정접수','환불방법','이체확인','주문취소','계좌정보변경','주문정정','수수료','계좌해지','비밀번호변경','이벤트적용','예수금이체','간편이체','수수료확인','선물증여','수령계좌변경','체결일정','거래재개알림'],
      product: ['삼성전자','카카오','KODEX 200','NAVER','테슬라','LG에너지솔루션','SK하이닉스','현대차','KB금융','하이브','KOSEF 코스피','TIGER 미국S&P500','미래에셋글로벌리츠','ECS달러플러스MMF','현대해상 채권형ETF','한국전력','셀트리온','POSCO홀딩스','두산에너빌리티','JYP Ent.']
    };

    /* ── 스크립트 템플릿 (call-status.html에서 이식, 19종) ──
     *  각 템플릿: lines(상담 스크립트) + ai(LLM 분석 시뮬레이션) + products(종목) */
    const scriptTemplates = {
      배송지연: {
        products: ['삼성전자'],
        lines: [
          {speaker:'상담사',text:'안녕하세요, ECS증권 {team} {agent}입니다. 무엇을 도와드릴까요?'},
          {speaker:'고객',text:'아 저기, 아침에 삼성전자 100주 매수 주문 넣었는데 아직도 체결이 안 됐어요. 주문번호 9876-A0143이요.'},
          {speaker:'상담사',text:'네, 주문번호 확인해보겠습니다. HTS 주문번호 9876-A0143 맞으시죠? 잠시만 기다려주세요.'},
          {speaker:'고객',text:'호가창엔 매수 잔량으로 떠 있긴 한데... 너무 안 잡히니까 정정을 해야 하나 싶어서요. 언제쯤 될까요?'},
          {speaker:'상담사',text:'현재 호가지연으로 거래소 체결 데이터가 약 5분 정도 늦게 반영되고 있습니다. 지정가 71,200원으로 걸어두셨는데 현재가가 71,400원이라 미체결 상태입니다.'},
          {speaker:'고객',text:'아 그래요? 그럼 가격을 올려야 되나요, 아니면 그냥 기다리는 게 나아요?'},
          {speaker:'상담사',text:'장 마감 전까지 체결 가능성은 있지만, 빠른 체결을 원하시면 71,500원 정정 주문을 권장드립니다. 정정 처리 도와드릴까요?'},
          {speaker:'고객',text:'네 그럼 71,500원으로 정정해주세요. 수량은 그대로 100주요.'},

    // [[HELPERS]] — 시간 포맷·스크립트 분석 헬퍼
    function parseDurationSec(dur) {
      const [m, s] = (dur || '0:00').split(':').map(Number);
      return (m || 0) * 60 + (s || 0);
    }
    function formatSecondsMMSS(totalSec) {
      const safe = Math.max(0, Math.round(totalSec || 0));
      return `${Math.floor(safe / 60)}:${String(safe % 60).padStart(2, '0')}`;
    }
    /* 상담사 발화 역순 탐색으로 처리 상태 판정 (call-status.html과 동일) */
    function analyzeTranscript(lines) {
      const followupPatterns = ['확인 후 연락','확인 후 결과','확인하고','콜백','담당 부서','담당부서','이관','전달하겠','확인 요청','정상화 예정','오늘 중 연락','오늘 중 결과','정상화되면','재시도'];
      const agentLines = lines.filter(l => l.speaker === '상담사').map(l => l.text);
      for (let i = agentLines.length - 1; i >= 0; i--) {
        if (followupPatterns.some(p => agentLines[i].includes(p))) return 'followup';
      }
      return 'completed';
    }
    /* 상담 흐름 4단계 분류 (모달 AI 패널용, call-status.html과 동일) */
    function _analyzeCallFlow(transcript) {
      if (!transcript || transcript.length === 0) return [];
      const stages = [];
      const len = transcript.length;
      const firstCustomer = transcript.find(l => l.speaker === '고객');
      if (firstCustomer) stages.push({ label:'문제 제기', time:firstCustomer.time, text:firstCustomer.text });
      const checkLine = transcript.find((l, i) => i > 0 && l.speaker === '상담사' &&
        (l.text.includes('확인') || l.text.includes('조회') || l.text.includes('잠시만')));
      if (checkLine) stages.push({ label:'확인/조회', time:checkLine.time, text:checkLine.text });
      const midStart = Math.floor(len * 0.3);
      const responseLine = transcript.find((l, i) => i >= midStart && l.speaker === '상담사' &&
        !l.text.includes('안녕') && !l.text.includes('확인해') && !l.text.includes('잠시만') &&
        (l.text.includes('처리') || l.text.includes('안내') || l.text.includes('예정') || l.text.includes('도와') ||
         l.text.includes('연락') || l.text.includes('접수') || l.text.includes('가능') || l.text.includes('적용') ||
         l.text.includes('등록') || l.text.includes('발송') || l.text.includes('완료')));
      if (responseLine) stages.push({ label:'대응/안내', time:responseLine.time, text:responseLine.text });
      const lastAgent = [...transcript].reverse().find(l => l.speaker === '상담사');
      if (lastAgent && lastAgent !== checkLine && lastAgent !== responseLine) {
        stages.push({ label:'마무리', time:lastAgent.time, text:lastAgent.text });
      }
      return stages;
    }

    // [[CALLGEN]] — 콜 더미데이터 생성
    /* categoryTree의 모든 리프 경로를 추출 (path 전체 문자열 + depth1 + 가중치) */
    function _extractLeafPaths(tree) {
      const leaves = [];
      function walk(node, path) {
        const np = [...path, node.name];
        if (node.children && node.children.length > 0) {
          node.children.forEach(ch => walk(ch, np));
        } else {
          leaves.push({ path: np.join(' > '), depth1: np[0], weight: Math.max(1, node.count) });
        }
      }
      tree.forEach(c => walk(c, []));
      return leaves;
    }

    /* 콜 더미데이터 생성 — 리프 경로에 가중(리프 count 비례) 분산.
     *  시드 RNG로 새로고침에도 동일 데이터 보장. 상세 모달까지 풍성하게 채움. */
    function generateConsultCallData(N) {
      let _seed = 20250601;
      function rng() { _seed = (_seed * 16807) % 2147483647; return (_seed - 1) / 2147483646; }
      const pick = (arr, n) => [...arr].sort(() => 0.5 - rng()).slice(0, n);
      const mkKw = (pool, n, tLen) => pick(pool, n).map(name => ({
        name, count: Math.floor(rng() * 4) + 1,
        transcriptIdx: Array.from({length: Math.floor(rng() * 3) + 1}, () => Math.floor(rng() * tLen))
      }));
      const makeSilence = (durTotalSec, tLen) => {
        const count = Math.floor(rng() * 3) + 2;
        const segs = []; const used = new Set();
        for (let s = 0; s < count; s++) {
          const mx = Math.max(10, durTotalSec - 15);
          let st, att = 0;
          do { st = Math.floor(rng() * mx) + 5; att++; } while (used.has(Math.floor(st / 30)) && att < 20);
          used.add(Math.floor(st / 30));
          const d = Math.floor(rng() * 12) + 3;
          const en = Math.min(st + d, durTotalSec);
          segs.push({ startTime:`${Math.floor(st/60)}:${String(st%60).padStart(2,'0')}`, endTime:`${Math.floor(en/60)}:${String(en%60).padStart(2,'0')}`, duration:en-st, transcriptIdx:Math.max(0,Math.min(Math.floor(st/30),tLen-1)) });
        }
        segs.sort((a,b) => a.startTime.localeCompare(b.startTime));
        return segs;
      };

      /* 리프 경로 + 누적 가중치 테이블 */
      const leaves = _extractLeafPaths(categoryTree);
      const totalWeight = leaves.reduce((s, l) => s + l.weight, 0);
      const weightedLeaf = () => {
        let r = rng() * totalWeight;
        for (const l of leaves) { r -= l.weight; if (r <= 0) return l; }
        return leaves[leaves.length - 1];
      };

      const hourDist = [8,9,9,9,9,10,10,10,10,11,11,11,12,12,13,13,14,14,14,15,15,15,16,16,17];
      const data = [];
      for (let i = 1; i <= N; i++) {
        const leaf = weightedLeaf();
        const ct = leaf.path;
        const tplPool = TPL_BY_CATEGORY[leaf.depth1] || TPL_FALLBACK;
        const tplName = tplPool[Math.floor(rng() * tplPool.length)];
        const scenario = scriptTemplates[tplName];

        const c = centers[rng() < 0.5 ? 0 : (rng() < 0.6 ? 1 : 2)];
        const center = c.name;
        const team = c.teams[Math.floor(rng() * c.teams.length)];
        const agent = agents[Math.floor(rng() * agents.length)];
        const hour = hourDist[Math.floor(rng() * hourDist.length)];
        const day = String(Math.floor(rng() * 28) + 1).padStart(2, '0');
        const minute = String(Math.floor(rng() * 60)).padStart(2, '0');
        const callType = rng() > 0.35 ? 'I/B' : 'O/B';

        /* 위험/재인입 시나리오는 재인입 횟수를 높게 */
        const tplRisky = (scenario.ai.riskFlags || []).includes('재인입위험');
        const rr = rng();
        const reentry = tplRisky ? (rng() < 0.55 ? 2 : 3) : (rr < 0.7 ? 1 : rr < 0.92 ? 2 : rr < 0.99 ? 3 : 4);

        const durRand = rng();
        let durTotalSec;
        if (durRand < 0.15) durTotalSec = Math.floor(rng() * 60) + 30;
        else if (durRand < 0.35) durTotalSec = Math.floor(rng() * 120) + 60;
        else if (durRand < 0.6) durTotalSec = Math.floor(rng() * 120) + 180;
        else if (durRand < 0.8) durTotalSec = Math.floor(rng() * 300) + 300;
        else durTotalSec = Math.floor(rng() * 600) + 600;
        const duration = `${String(Math.floor(durTotalSec/60)).padStart(2,'0')}:${String(durTotalSec%60).padStart(2,'0')}`;

        const transcript = scenario.lines.map((line, idx) => ({
          time: `${Math.floor(idx * 0.5)}:${String((idx * 30) % 60).padStart(2,'0')}`,
          speaker: line.speaker,
          text: line.text.replace('{team}', team).replace('{agent}', agent)
        }));
        const silenceSegments = makeSilence(durTotalSec, transcript.length);
        const totalSilenceSec = silenceSegments.reduce((s, seg) => s + seg.duration, 0);

        /* 이슈 키워드: 템플릿 카테고리(있으면) 기반 */
        const issues = scenario.ai.category ? [scenario.ai.category] : [];

        const ai = JSON.parse(JSON.stringify(scenario.ai));
        ai.status = analyzeTranscript(transcript);
        ai.agentEval = { alternativeProvided: rng() > 0.3, closingProper: rng() > 0.2, score: Math.floor(rng() * 30) + 60 };

        data.push({
          id: `TA-2025-${String(i).padStart(5, '0')}`,
          date: `2025-03-${day}`,
          time: `${String(hour).padStart(2,'0')}:${minute}`,
          center, team, agent,
          employeeId: AGENT_EMP_ID[agent] || '-',
          consultationType: ct,
          callType, reentry, duration,
          totalSilence: totalSilenceSec,
          silenceRate: durTotalSec > 0 ? Math.round(totalSilenceSec / durTotalSec * 1000) / 10 : 0,
          silenceSegments,
          issueKeywords: issues,
          extractedKeywords: {
            issue: (issues.length > 0 ? issues.map(k => ({name:k, count:Math.floor(rng()*3)+1, transcriptIdx:[Math.floor(rng()*transcript.length)]})) : [])
              .concat(mkKw(extractedKeywordPool.issue, 3, transcript.length)),
            /* [의미 클러스터] 대분류에 맞는 클러스터에서 상담 키워드 3~5개 부여
             *  → 같은 클러스터 키워드가 자주 공출현 → 연관 키워드가 의미를 가짐 */
            consult: (() => {
              const cl = KEYWORD_CLUSTERS[CLUSTER_BY_CATEGORY[leaf.depth1] || '기타'] || KEYWORD_CLUSTERS['기타'];
              const n = Math.floor(rng() * 3) + 3;   // 3~5개
              return [...cl].sort(() => 0.5 - rng()).slice(0, n).map(name => ({
                name, count: Math.floor(rng() * 4) + 1, transcriptIdx: [Math.floor(rng() * transcript.length)]
              }));
            })(),
            product: (scenario.products || []).map(name => {
              const idxs = transcript.map((line, ix) => line.text.includes(name) ? ix : -1).filter(ix => ix >= 0);
              const cnt = transcript.reduce((s, line) => s + (line.text.split(name).length - 1), 0);
              return { name, count: Math.max(cnt, 1), transcriptIdx: idxs.length > 0 ? idxs : [0] };
            })
          },
          transcript,
          aiAnalysis: ai
        });
      }
      return data.sort((a, b) => (`${b.date} ${b.time}`).localeCompare(`${a.date} ${a.time}`));
    }

    const callData = generateConsultCallData(1500);

    // [[KEYWORD-LOGIC]] — 검색 / 연관 키워드(2단계) / 상담유형 분류 / 테이블 연동
    function _escq(s) { return String(s).replace(/'/g, "\\'"); }

    /* 선택 상태
     *  searchSel : 검색 패널에서 선택한 키워드
     *  rel1Sel   : 연관 키워드1에서 선택
     *  rel2Sel   : 연관 키워드2에서 선택
     *  selectedKw: 마지막으로 선택한 키워드(어느 패널이든) — 테이블·문의유형 패널의 기준 */
    let searchSel = null, rel1Sel = null, rel2Sel = null, selectedKw = null;
    let selectedD1 = null, selectedLeaf = null;   // 상담유형 대분류·세분류 선택(세분류 클릭 시 테이블 필터)

    /* 콜이 보유한 "상담+이슈" 키워드 집합(종목명 product 제외).
     *  - 상담 키워드(consult): 의미 클러스터로 주입됨
     *  - 이슈 키워드(issueKeywords): 템플릿 category
     *  연관 키워드 공출현·검색·테이블 필터 모두 이 집합 기준 → 정합 */
    function _kwOf(c) {
      const s = new Set();
      (c.issueKeywords || []).forEach(k => s.add(k));
      ((c.extractedKeywords && c.extractedKeywords.consult) || []).forEach(it => s.add(it.name));
      return s;
    }
    /* 키워드 보유 콜 수 (검색 리스트 건수 = 테이블 "총 N건"과 1:1 정합) */
    function _kwCount(kw) { return callData.filter(c => _kwOf(c).has(kw)).length; }

    /* 전체 고유 키워드(검색 대상) — 상담+이슈 키워드, 빈도 내림차순 */
    const KW_UNIVERSE = (() => {
      const m = {};
      callData.forEach(c => _kwOf(c).forEach(k => { m[k] = (m[k] || 0) + 1; }));
      return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([name, count]) => ({ name, count }));
    })();

    /* ── 연관 키워드 추출 (공출현, co-occurrence) ───────────────────────
     *  [원리] 연관 키워드는 **같은 콜에 함께 등장하는 키워드(공출현)** 로 찾는다.
     *   키워드 A를 보유한 콜들을 모아, 그 콜들에 함께 나타나는 다른 키워드 B를
     *   "연관 후보"로 수집한다(= A와 한 번이라도 공출현한 키워드). 이를 2단계로
     *   반복한다(A→연관1, 연관1→연관2).
     *  [표시·정렬 기준] 각 연관 키워드의 숫자는 **그 키워드 단독 보유 콜 수**(_kwCount)로
     *   표시·정렬한다. → 패널에 보이는 숫자가 그 키워드를 선택했을 때의 하단
     *   테이블 "총 N건"과 정확히 일치한다(공출현 횟수가 아니라 보유 콜 수).
     *  [프로토타입] 콜 생성 시 의미 클러스터(KEYWORD_CLUSTERS)를 주입해
     *   공출현이 도메인상 의미를 갖도록 했다.
     *  [실제 운영] 키워드 임베딩 유사도 또는 실제 콜 로그의 공출현 통계로 대체. */
    function relatedKeywords(kw, topN) {
      const co = new Set();
      callData.forEach(c => {
        const ks = _kwOf(c);
        if (!ks.has(kw)) return;
        ks.forEach(k => { if (k !== kw) co.add(k); });   // 공출현 후보 수집
      });
      return [...co].map(name => ({ name, count: _kwCount(name) }))   // 숫자 = 단독 보유 콜 수
        .sort((a, b) => b.count - a.count).slice(0, topN || 8);
    }

    /* ── 키워드 → 상담유형 분류 ─────────────────────────────────────────
     *  [원리] 키워드를 상담유형으로 분류하는 방법: **해당 키워드를 보유한 콜들의
     *   consultationType 경로를 집계**한다. 각 콜은 "대분류 > 중분류 > 소분류 > 세분류"
     *   경로를 가지므로, 키워드 보유 콜을 모아
     *     - parts[0]      (대분류)
     *     - parts[last]   (마지막 뎁스 = 세분류, 3뎁스면 소분류)
     *   를 각각 빈도 집계해 Top을 뽑으면 "이 키워드가 주로 어떤 상담유형에서
     *   나오는가"가 도출된다.
     *  [실제 운영] 키워드-분류 매핑 테이블 또는 LLM 분류로 대체 가능. */
    function classifyKeyword(kw) {
      /* 목록: selectedKw가 등장하는 대분류(키워드 맥락) */
      const set = new Set();
      callData.forEach(c => { if (_kwOf(c).has(kw)) set.add(c.consultationType.split(' > ')[0]); });
      /* 숫자: 그 대분류로 시작하는 콜 전체 수(키워드 무관) → 대분류 클릭 시 테이블과 정합 */
      const d1 = [...set].map(name => ({
        name, count: callData.filter(c => c.consultationType.split(' > ')[0] === name).length
      })).sort((a, b) => b.count - a.count).slice(0, 8);
      return { d1 };
    }

    /* ── 패널 렌더 헬퍼 (cat-item 스타일 재사용) ── */
    function _kwItemHtml(name, count, onclickAttr, active) {
      return `<div class="cat-item${active ? ' active' : ''}" ${onclickAttr ? `onclick="${onclickAttr}"` : 'style="cursor:default;"'}>
        <span class="cat-name">${name}</span>
        <span class="cat-meta"><span class="cat-cnt">${AICC_Fmt.number(count)}건</span></span>
      </div>`;
    }
    const _placeholder = msg => `<div class="cat-placeholder">${msg}</div>`;

    /* 검색: 입력어 포함 키워드 리스트(빈도순). 입력 전엔 안내문. */
    function onKwSearch(q) {
      const body = document.getElementById('kw-search-list');
      const query = (q || '').trim();
      if (!query) { body.innerHTML = _placeholder('키워드를 검색하세요'); return; }
      const hits = KW_UNIVERSE.filter(k => k.name.includes(query));
      body.innerHTML = hits.length === 0
        ? _placeholder('검색 결과가 없습니다')
        : hits.map(k => _kwItemHtml(k.name, k.count, `onSelectKeyword('${_escq(k.name)}','search')`, searchSel === k.name)).join('');
    }

    /* 키워드 선택 — panel: 'search' | 'rel1' | 'rel2'.
     *  마지막 선택 키워드(selectedKw)를 기준으로 테이블·상담유형 패널을 갱신한다(누적 아님). */
    function onSelectKeyword(kw, panel) {
      if (panel === 'search') { searchSel = kw; rel1Sel = null; rel2Sel = null; }
      else if (panel === 'rel1') { rel1Sel = kw; rel2Sel = null; }
      else if (panel === 'rel2') { rel2Sel = kw; }
      selectedKw = kw;
      selectedD1 = null; selectedLeaf = null;   // 키워드 바뀌면 대분류·세분류 선택 초기화
      renderKwFlow();
      renderTypePanels();
      renderRiskPanel();
      applyKwFilter();
    }

    /* 리스크 키워드 클릭 → 그 키워드를 "검색된 키워드"로 인식.
     *  검색창에 반영하고 검색 키워드 선택과 동일하게 처리 → 연관 키워드(1·2)가 도출된다. */
    function onSelectRisk(name) {
      const input = document.getElementById('kw-search-input');
      if (input) input.value = name;
      onSelectKeyword(name, 'search');
    }

    /* 검색·연관1·연관2 패널 렌더 */
    function renderKwFlow() {
      onKwSearch(document.getElementById('kw-search-input').value);   // 검색 리스트 active 갱신
      const rel1Body = document.getElementById('rel1-body');
      const rel1Cnt = document.getElementById('rel1-count');
      if (!searchSel) { rel1Body.innerHTML = _placeholder('검색 키워드를 선택하면\n표시됩니다'); rel1Cnt.textContent = ''; }
      else {
        const r1 = relatedKeywords(searchSel);
        rel1Cnt.textContent = r1.length + '개';
        rel1Body.innerHTML = r1.length === 0 ? _placeholder('연관 키워드 없음')
          : r1.map(k => _kwItemHtml(k.name, k.count, `onSelectKeyword('${_escq(k.name)}','rel1')`, rel1Sel === k.name)).join('');
      }
      const rel2Body = document.getElementById('rel2-body');
      const rel2Cnt = document.getElementById('rel2-count');
      if (!rel1Sel) { rel2Body.innerHTML = _placeholder('연관 키워드 1을 선택하면\n표시됩니다'); rel2Cnt.textContent = ''; }
      else {
        const r2 = relatedKeywords(rel1Sel);
        rel2Cnt.textContent = r2.length + '개';
        rel2Body.innerHTML = r2.length === 0 ? _placeholder('연관 키워드 없음')
          : r2.map(k => _kwItemHtml(k.name, k.count, `onSelectKeyword('${_escq(k.name)}','rel2')`, rel2Sel === k.name)).join('');
      }
    }

    /* 선택 키워드가 등장하는 (대분류 d1 내) 세분류 목록.
     *  목록은 키워드 맥락, 표시 숫자는 (대분류+세분류) 전체 콜 수(키워드 무관)
     *  → 세분류 클릭 시 테이블(키워드 빠지고 대분류+세분류 전체)의 "총 N건"과 정확히 일치. */
    function leafByD1(kw, d1) {
      const set = new Set();
      callData.forEach(c => {
        if (!_kwOf(c).has(kw)) return;
        const parts = c.consultationType.split(' > ');
        if (parts[0] !== d1) return;
        set.add(parts[parts.length - 1]);
      });
      return [...set].map(name => ({
        name,
        count: callData.filter(c => { const p = c.consultationType.split(' > '); return p[0] === d1 && p[p.length - 1] === name; }).length
      })).sort((a, b) => b.count - a.count).slice(0, 10);
    }

    /* 상담유형 패널 — 키워드 선택 시 대분류만 노출, 대분류 클릭 시 그 대분류의 세분류 노출 */
    function renderTypePanels() {
      const d1Body = document.getElementById('type-d1-body');
      const leafBody = document.getElementById('type-leaf-body');
      const d1Cnt = document.getElementById('type-d1-count');
      const leafCnt = document.getElementById('type-leaf-count');
      if (!selectedKw) {
        d1Body.innerHTML = _placeholder('키워드를 선택하면\n표시됩니다'); d1Cnt.textContent = '';
        leafBody.innerHTML = _placeholder('키워드를 선택하면\n표시됩니다'); leafCnt.textContent = '';
        return;
      }
      /* 대분류: selectedKw 보유 콜의 parts[0] 집계 (클릭 가능) */
      const { d1 } = classifyKeyword(selectedKw);
      d1Cnt.textContent = d1.length + '종';
      d1Body.innerHTML = d1.length === 0 ? _placeholder('데이터 없음')
        : d1.map(x => _kwItemHtml(x.name, x.count, `onSelectTypeD1('${_escq(x.name)}')`, selectedD1 === x.name)).join('');
      /* 세분류: 대분류 선택 시 그 대분류의 마지막 뎁스 집계 (정보 표시) */
      if (!selectedD1) {
        leafBody.innerHTML = _placeholder('대분류를 선택하면\n표시됩니다'); leafCnt.textContent = '';
      } else {
        const leaf = leafByD1(selectedKw, selectedD1);
        leafCnt.textContent = leaf.length + '종';
        leafBody.innerHTML = leaf.length === 0 ? _placeholder('데이터 없음')
          : leaf.map(x => _kwItemHtml(x.name, x.count, `onSelectLeaf('${_escq(x.name)}')`, selectedLeaf === x.name)).join('');
      }
    }

    /* 상담유형 대분류 클릭 → 세분류 드릴다운 (같은 항목 재클릭 시 접기) */
    function onSelectTypeD1(d1) {
      selectedD1 = (selectedD1 === d1) ? null : d1;
      selectedLeaf = null;            // 대분류 바뀌면 세분류 선택 해제
      renderTypePanels();
      applyKwFilter();                // 테이블을 selectedKw 전체로 복원
    }

    /* 상담유형 세분류 클릭 → 테이블을 (선택키워드 + 대분류 + 세분류)로 필터.
     *  중분류·소분류는 제한하지 않으므로 동일 대분류·세분류를 가진 모든 경로가 포함된다.
     *  같은 항목 재클릭 시 해제. */
    function onSelectLeaf(leaf) {
      selectedLeaf = (selectedLeaf === leaf) ? null : leaf;
      renderTypePanels();
      applyKwFilter();
    }

    /* 하단 테이블 필터 — 우선순위: 세분류 > 대분류 > 키워드
     *  [정책] 상담유형 대분류/세분류를 선택하면 키워드 필터는 빠지고 상담유형 기준으로만 필터한다.
     *   - 세분류 선택: 대분류로 시작 + 마지막 뎁스가 세분류 (중분류·소분류 자유 → 모든 경로 포함)
     *   - 대분류만 선택: 그 대분류로 시작하는 모든 콜
     *   - 분류 미선택(키워드만): selectedKw 보유 콜 */
    function applyKwFilter() {
      const badge = document.getElementById('sel-path-badge');
      let label = '';
      if (selectedD1 && selectedLeaf) {
        filteredData = callData.filter(c => {
          const parts = c.consultationType.split(' > ');
          return parts[0] === selectedD1 && parts[parts.length - 1] === selectedLeaf;
        });
        label = `상담 유형: ${selectedD1} > ${selectedLeaf}`;
      } else if (selectedD1) {
        filteredData = callData.filter(c => c.consultationType.split(' > ')[0] === selectedD1);
        label = `상담 유형: ${selectedD1}`;
      } else if (selectedKw) {
        filteredData = callData.filter(c => _kwOf(c).has(selectedKw));
        label = `키워드: ${selectedKw}`;
      } else {
        filteredData = [];
      }
      if (badge) {
        if (label) { badge.style.display = ''; badge.textContent = label; }
        else { badge.style.display = 'none'; }
      }
      currentPage = 1;
      renderTable();
    }

    // [[KEYWORDS]] — 리스크 키워드 패널 (전체 고정 Top5, 클릭 시 테이블 필터)
    function _aggKw(getNames) {
      const m = {};
      callData.forEach(c => { new Set(getNames(c)).forEach(n => { if (n) m[n] = (m[n] || 0) + 1; }); });
      return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([name, count]) => ({ name, count }));
    }
    /* 리스크 키워드 후보 = issueKeywords(리스크 성격) 등장 키워드.
     *  표시·정렬 숫자는 _kwCount(보유 콜 수)로 통일 → 클릭 시 하단 테이블 "총 N건"과 정합. */
    const RISK_KEYWORDS = _aggKw(c => c.issueKeywords || [])
      .map(k => ({ name: k.name, count: _kwCount(k.name) }))
      .sort((a, b) => b.count - a.count);

    function renderRiskPanel() {
      document.getElementById('risk-list').innerHTML = RISK_KEYWORDS.slice(0, 5).map((k, i) => {
        const bg = i < 3 ? '#E53935' : '#EF9A9A';
        /* 클릭 시 검색된 키워드로 이동하므로(검색 패널에 활성 표시) 리스크 패널 자체 활성은 두지 않음 */
        return `<div class="kw-rank-row" style="cursor:pointer;" onclick="onSelectRisk('${_escq(k.name)}')">
          <span class="kw-rank-no" style="background:${bg};">${i + 1}</span>
          <span class="kw-rank-name">${k.name}</span>
          <span class="kw-rank-cnt">${AICC_Fmt.number(k.count)}</span>
        </div>`;
      }).join('');
    }

    // [[TABLE]] — 콜 목록 테이블 렌더·정렬·페이지네이션 (call-status.html 차용)
    let filteredData = [...callData];
    let currentPage = 1;
    let pageSize = 20;
    let sortKey = null;
    let sortDir = null;
    const SORT_KEYS = ['id','date','center','team','empid','agent','consult','duration','type','silence','reentry'];

    function toggleSort(key) {
      if (sortKey === key) {
        if (sortDir === 'asc') sortDir = 'desc';
        else { sortKey = null; sortDir = null; }
      } else { sortKey = key; sortDir = 'asc'; }
      updateSortIcons();
      currentPage = 1;
      renderTable();
    }
    function updateSortIcons() {
      SORT_KEYS.forEach(k => {
        const icon = document.getElementById('sort-icon-' + k);
        if (!icon) return;
        if (k === sortKey) { icon.textContent = sortDir === 'asc' ? '▲' : '▼'; icon.style.color = '#1976D2'; }
        else { icon.textContent = '⇅'; icon.style.color = '#BDBDBD'; }
      });
    }

    function renderTable() {
      document.getElementById('call-count').textContent = `총 ${filteredData.length}건`;
      if (sortKey && sortDir) {
        filteredData.sort((a, b) => {
          let va, vb;
          switch (sortKey) {
            case 'id': va = a.id; vb = b.id; break;
            case 'date': va = `${a.date} ${a.time}`; vb = `${b.date} ${b.time}`; break;
            case 'center': va = a.center || ''; vb = b.center || ''; break;
            case 'team': va = a.team || ''; vb = b.team || ''; break;
            case 'empid': va = a.employeeId || ''; vb = b.employeeId || ''; break;
            case 'agent': va = a.agent || ''; vb = b.agent || ''; break;
            case 'consult': va = a.consultationType || ''; vb = b.consultationType || ''; break;
            case 'duration': return sortDir === 'asc'
              ? parseDurationSec(a.duration) - parseDurationSec(b.duration)
              : parseDurationSec(b.duration) - parseDurationSec(a.duration);
            case 'type': va = a.callType || ''; vb = b.callType || ''; break;
            case 'silence': return sortDir === 'asc' ? (a.totalSilence||0)-(b.totalSilence||0) : (b.totalSilence||0)-(a.totalSilence||0);
            case 'reentry': return sortDir === 'asc' ? (a.reentry||0)-(b.reentry||0) : (b.reentry||0)-(a.reentry||0);
            default: va = ''; vb = '';
          }
          const cmp = String(va).localeCompare(String(vb), 'ko');
          return sortDir === 'asc' ? cmp : -cmp;
        });
      }
      const start = (currentPage - 1) * pageSize;
      const pageData = filteredData.slice(start, start + pageSize);
      const tbody = document.getElementById('call-tbody');
      if (pageData.length === 0) {
        tbody.innerHTML = `<tr><td colspan="13" style="text-align:center;padding:48px 0;color:#BDBDBD;font-size:13px;">${selectedKw ? '해당 키워드의 콜이 없습니다.' : '키워드를 검색·선택하면 콜이 표시됩니다.'}</td></tr>`;
        renderPagination();
        return;
      }
      tbody.innerHTML = pageData.map(c => {
        const typeBadge = c.callType === 'I/B'
          ? `<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">${c.callType}</span>`
          : `<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">${c.callType}</span>`;
        const silenceTime = formatSecondsMMSS(c.totalSilence || 0);
        const consultItems = (c.extractedKeywords && c.extractedKeywords.consult) || [];
        const consultChip = consultItems.length > 0
          ? consultItems.slice(0, 2).map(item => `<span style="display:inline-block;padding:2px 8px;margin:1px 2px;border-radius:10px;font-size:11px;background:#E3F2FD;color:#1565C0;border:1px solid #BBDEFB;">${item.name}</span>`).join('') + (consultItems.length > 2 ? `<span style="font-size:11px;color:#888;margin-left:2px;cursor:pointer;" title="${consultItems.map(item => item.name).join(', ')}">...</span>` : '')
          : '-';
        const issueChip = c.issueKeywords.length > 0
          ? c.issueKeywords.slice(0, 2).map(k => `<span style="display:inline-block;padding:2px 8px;margin:1px 2px;border-radius:10px;font-size:11px;background:#FFF3F3;color:#E53935;border:1px solid #FFCDD2;">${k}</span>`).join('') + (c.issueKeywords.length > 2 ? `<span style="font-size:11px;color:#888;margin-left:2px;cursor:pointer;" title="${c.issueKeywords.join(', ')}">...</span>` : '')
          : '-';
        return `<tr onclick="showCallDetail('${c.id}')" style="cursor:pointer;">
          <td style="text-align:center;font-size:12px;white-space:nowrap;">${c.id}</td>
          <td style="text-align:center;font-size:12px;white-space:nowrap;">${c.date} ${c.time}</td>
          <td style="text-align:center;font-size:12px;white-space:nowrap;">${c.center}</td>
          <td style="text-align:center;font-size:12px;white-space:nowrap;">${c.team}</td>
          <td style="text-align:center;font-size:12px;">${c.employeeId}</td>
          <td style="text-align:center;font-size:12px;">${c.agent}</td>
          <td style="font-size:11px;color:#424242;padding:6px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${c.consultationType}">${c.consultationType}</td>
          <td style="text-align:center;font-size:12px;white-space:nowrap;">${c.duration}</td>
          <td style="text-align:center;">${typeBadge}</td>
          <td style="text-align:center;font-size:12px;white-space:nowrap;">${silenceTime}</td>
          <td style="text-align:center;">${c.reentry >= 3
            ? `<span style="display:inline-block;padding:2px 8px;background:#ffebee;color:#c62828;border-radius:4px;font-size:11px;font-weight:600;">${c.reentry}회차</span>`
            : c.reentry === 2
              ? `<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">2회차</span>`
              : '-'}</td>
          <td style="padding:6px 10px;">${consultChip}</td>
          <td style="padding:6px 10px;">${issueChip}</td>
        </tr>`;
      }).join('');
      renderPagination();
    }

    function renderPagination() {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
      const container = document.getElementById('page-buttons');
      let html = '';
      const startP = Math.max(1, currentPage - 2);
      const endP = Math.min(totalPages, startP + 4);
      for (let p = startP; p <= endP; p++) {
        html += `<button class="pagination-btn${p === currentPage ? ' active' : ''}" onclick="goPage(${p})">${p}</button>`;
      }
      container.innerHTML = html;
    }
    function goPage(p) {
      const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
      if (p === 'first') currentPage = 1;
      else if (p === 'last') currentPage = totalPages;
      else currentPage = Math.max(1, Math.min(totalPages, p));
      renderTable();
    }
    function changePageSize() {
      pageSize = parseInt(document.getElementById('page-size-select').value);
      currentPage = 1;
      renderTable();
    }

    // [[MODAL]] — 콜 상세 모달 (call-status.html showCallDetail 이식)
    function showCallDetail(callId) {
      const c = callData.find(x => x.id === callId);
      if (!c) return;

      const infoRows = [
        { label:'콜 ID', value:`<span style="font-weight:600;">${c.id}</span>` },
        { label:'일시', value:`<span style="font-weight:600;">${c.date} ${c.time}</span>` },
        { label:'사번', value:c.employeeId },
        { label:'센터', value:c.center },
        { label:'팀', value:c.team },
        { label:'상담사', value:c.agent },
        { label:'상담 유형', value:`<span style="font-size:12px;line-height:1.5;word-break:keep-all;">${c.consultationType}</span>`, fullWidth:true },
        { label:'유형', value: c.callType === 'I/B'
          ? `<span style="display:inline-block;padding:2px 8px;background:#e8f5e9;color:#2e7d32;border-radius:4px;font-size:11px;font-weight:600;">I/B</span>`
          : `<span style="display:inline-block;padding:2px 8px;background:#fff3e0;color:#e65100;border-radius:4px;font-size:11px;font-weight:600;">O/B</span>` },
        { label:'통화시간', value:c.duration },
        { label:'묵음시간', value:`${Math.floor(c.totalSilence/60)}:${String(c.totalSilence%60).padStart(2,'0')} <span style="font-size:11px;color:#9E9E9E;">(${c.silenceRate}%)</span>` }
      ];
      const infoHtml = `<div style="font-size:13px;">${infoRows.map(r =>
        r.fullWidth
          ? `<div style="padding:10px 0;border-bottom:1px solid #F0F0F0;"><div style="color:#757575;font-size:12px;margin-bottom:6px;">${r.label}</div><div style="font-weight:500;color:#212121;">${r.value}</div></div>`
          : `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F0F0F0;"><span style="color:#757575;font-size:12px;flex-shrink:0;">${r.label}</span><span style="text-align:right;font-weight:500;color:#212121;">${r.value}</span></div>`).join('')}</div>`;

      const scriptHtml = c.transcript.map((line, idx) => {
        const isAgent = line.speaker === '상담사';
        const bg = isAgent ? '#E3F2FD' : '#F5F5F5';
        const hoverBg = isAgent ? '#B3E5FC' : '#EEEEEE';
        const labelColor = isAgent ? '#00A3FF' : '#424242';
        const iconFill = isAgent ? '#00A3FF' : '#757575';
        return `<div id="transcript-${idx}" class="transcript-line" style="display:flex;gap:10px;padding:6px 4px;cursor:pointer;border-radius:6px;transition:background 0.15s;" onclick="playSegment(${idx})" onmouseenter="this.style.background='${hoverBg}'" onmouseleave="if(!this.classList.contains('playing'))this.style.background=''">
          <div style="min-width:40px;font-size:10px;color:#757575;padding-top:2px;">${line.time}</div>
          <div style="flex:1;">
            <div style="font-size:10px;font-weight:600;color:${labelColor};margin-bottom:2px;">${line.speaker}</div>
            <div style="background:${bg};padding:6px 10px;border-radius:6px;font-size:12px;line-height:1.5;display:flex;align-items:start;gap:6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="${iconFill}" style="flex-shrink:0;margin-top:3px;opacity:0.5;"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              <span>${line.text}</span>
            </div>
          </div>
        </div>`;
      }).join('');

      const kwCategories = [
        { key:'issue', label:'리스크 키워드', bg:'#FFF3F3', color:'#E53935', border:'#FFCDD2' },
        { key:'consult', label:'상담 키워드', bg:'#E3F2FD', color:'#1565C0', border:'#BBDEFB' },
        { key:'product', label:'종목 키워드', bg:'#F3E5F5', color:'#7B1FA2', border:'#E1BEE7' }
      ];
      const kwHtml = kwCategories.map(cat => {
        const items = c.extractedKeywords[cat.key] || [];
        if (items.length === 0) return '';
        const chips = items.map(kw =>
          `<span onclick="scrollToTranscript(${kw.transcriptIdx[0]});event.stopPropagation();" style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;margin:3px;border-radius:12px;font-size:12px;cursor:pointer;background:${cat.bg};color:${cat.color};border:1px solid ${cat.border};transition:all 0.15s;" onmouseover="this.style.boxShadow='0 2px 6px rgba(0,0,0,0.15)'" onmouseout="this.style.boxShadow='none'">
            ${kw.name}<span style="background:${cat.color};color:#fff;border-radius:8px;padding:0 5px;font-size:10px;font-weight:600;margin-left:2px;">${kw.count}</span>
          </span>`
        ).join('');
        return `<div style="margin-bottom:16px;"><div style="font-size:12px;font-weight:600;color:#424242;margin-bottom:8px;padding-left:2px;">${cat.label}</div><div style="display:flex;flex-wrap:wrap;">${chips}</div></div>`;
      }).join('');

      const silenceHtml = (() => {
        if (!c.silenceSegments || c.silenceSegments.length === 0) return '';
        const summaryMin = Math.floor(c.totalSilence / 60);
        const summarySec = String(c.totalSilence % 60).padStart(2, '0');
        const rows = c.silenceSegments.map(seg =>
          `<div onclick="scrollToTranscript(${seg.transcriptIdx})" style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;cursor:pointer;border-radius:6px;transition:background 0.15s;border-bottom:1px solid #F0F0F0;" onmouseenter="this.style.background='#FFF3F3'" onmouseleave="this.style.background=''">
            <span style="font-size:12px;color:#424242;">${seg.startTime} ~ ${seg.endTime}</span><span style="font-size:12px;font-weight:600;color:#E53935;">${seg.duration}초</span>
          </div>`
        ).join('');
        return `<div style="margin-top:20px;padding-top:16px;border-top:1px solid #EEEEEE;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px;"><span style="font-size:12px;font-weight:600;color:#424242;">묵음 구간</span><span style="font-size:11px;color:#9E9E9E;">총 ${summaryMin}:${summarySec} (${c.silenceRate}%)</span></div>
          <div style="background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;overflow:hidden;">${rows}</div>
        </div>`;
      })();

      const aiHtml = (() => {
        const ai = c.aiAnalysis;
        if (!ai) return '<div style="color:#9E9E9E;font-size:12px;padding:20px;">AI 분석 데이터 없음</div>';
        const statusBadge = ai.status === 'completed'
          ? '<span style="display:inline-block;padding:2px 8px;background:#E8F5E9;color:#2E7D32;border-radius:4px;font-size:11px;font-weight:600;">처리 완료</span>'
          : '<span style="display:inline-block;padding:2px 8px;background:#FFEBEE;color:#C62828;border-radius:4px;font-size:11px;font-weight:600;">후속 조치 필요</span>';
        const flowPatternMap = { '즉시해결':'#2E7D32', '콜백안내':'#F57F17', '이관':'#C62828', '정보안내':'#1565C0' };
        const fpColor = flowPatternMap[ai.flowPattern] || '#757575';
        const fpBadge = ai.flowPattern ? `<span style="display:inline-block;padding:2px 8px;background:${fpColor}15;color:${fpColor};border:1px solid ${fpColor}40;border-radius:4px;font-size:10px;font-weight:600;">${ai.flowPattern}</span>` : '';
        const flowStages = _analyzeCallFlow(c.transcript);
        const stageIcons = { '문제 제기':'#E53935', '확인/조회':'#F57F17', '대응/안내':'#1565C0', '마무리':'#2E7D32' };
        const flowTimelineHtml = flowStages.length > 0
          ? `<div style="margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#424242;margin-bottom:8px;display:flex;align-items:center;gap:6px;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 3" stroke="#424242" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="#424242" stroke-width="2" fill="none"/></svg>상담 흐름
              </div>
              <div style="padding-left:6px;border-left:2px solid #E0E0E0;">
                ${flowStages.map(s => {
                  const color = stageIcons[s.label] || '#757575';
                  const truncText = s.text.length > 45 ? s.text.substring(0, 45) + '...' : s.text;
                  return `<div style="padding:4px 0 4px 12px;position:relative;"><div style="position:absolute;left:-7px;top:8px;width:10px;height:10px;border-radius:50%;background:${color};border:2px solid #fff;"></div><div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;"><span style="font-size:10px;font-weight:700;color:${color};">${s.label}</span><span style="font-size:9px;color:#9E9E9E;">${s.time}</span></div><div style="font-size:11px;color:#616161;line-height:1.4;">${truncText}</div></div>`;
                }).join('')}
              </div>
            </div>` : '';
        const intentLabel = ai.customerIntent || '-';
        const intentBadge = ai.intentAchieved
          ? '<span style="font-size:10px;padding:1px 6px;background:#E8F5E9;color:#2E7D32;border-radius:3px;font-weight:600;">달성</span>'
          : '<span style="font-size:10px;padding:1px 6px;background:#FFEBEE;color:#C62828;border-radius:3px;font-weight:600;">미달성</span>';
        const intentDetail = ai.intentAchieved ? (ai.actionNote ? `처리: ${ai.actionNote}` : '') : (ai.rootCause ? `원인: ${ai.rootCause}` : '');
        const intentHtml = `<div style="margin-bottom:16px;">
          <div style="font-size:11px;font-weight:700;color:#424242;margin-bottom:8px;display:flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#424242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>고객 의도/요구사항</div>
          <div style="background:#F5F5F5;border-radius:6px;padding:10px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;"><span style="font-size:12px;font-weight:600;color:#212121;">${intentLabel}</span>${intentBadge}</div>${intentDetail ? `<div style="font-size:11px;color:#757575;line-height:1.5;">${intentDetail}</div>` : ''}</div>
        </div>`;
        const keyUtt = ai.keyUtterances || [];
        const utteranceHtml = keyUtt.length > 0
          ? `<div style="margin-bottom:16px;"><div style="font-size:11px;font-weight:700;color:#424242;margin-bottom:8px;display:flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke="#424242" stroke-width="2" fill="none"/></svg>핵심 발화</div>${keyUtt.map(u => `<div style="margin-bottom:8px;padding:8px 10px;background:#F8F9FE;border-left:3px solid #1565C0;border-radius:0 6px 6px 0;"><div style="font-size:11px;color:#212121;line-height:1.5;font-style:italic;">"${u.text}"</div><div style="font-size:10px;color:#1565C0;margin-top:3px;">${u.reason}</div></div>`).join('')}</div>` : '';
        const risks = [];
        const riskLabelMap = { '재인입위험':'재인입 발생 위험이 높습니다.', '불만표현':'고객 불만 표현이 감지되었습니다.', '이탈위험':'고객 이탈 가능성이 있습니다.' };
        (ai.riskFlags || []).forEach(f => risks.push({ flag:f, desc:riskLabelMap[f] || f }));
        if (ai.status === 'followup') risks.push({ flag:'후속조치', desc:'후속 조치가 필요한 상담입니다. 이행 여부를 확인하세요.' });
        if (c.reentry >= 2) risks.push({ flag:'재인입', desc:`재인입 ${c.reentry}회 — 이전 상담 완결 품질을 점검하세요.` });
        const riskHtml = risks.length > 0
          ? `<div><div style="font-size:11px;font-weight:700;color:#424242;margin-bottom:8px;display:flex;align-items:center;gap:6px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="#E65100" stroke-width="2" fill="none"/></svg>위험 신호</div>${risks.map(r => `<div style="display:flex;align-items:start;gap:6px;padding:6px 8px;margin-bottom:4px;background:#FFF8E1;border-radius:4px;border-left:3px solid #E65100;"><span style="font-size:10px;font-weight:700;color:#E65100;white-space:nowrap;margin-top:1px;">${r.flag}</span><span style="font-size:11px;color:#424242;line-height:1.4;">${r.desc}</span></div>`).join('')}</div>` : '';
        const tagsHtml = (ai.tags || []).length > 0
          ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px;">${ai.tags.map(t => `<span style="display:inline-block;padding:2px 8px;background:#F3E5F5;color:#7B1FA2;border-radius:10px;font-size:10px;border:1px solid #E1BEE7;">${t}</span>`).join('')}</div>` : '';
        return `
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">${statusBadge} ${fpBadge}${ai.category ? `<span style="font-size:10px;color:#9E9E9E;">${ai.category}</span>` : ''}</div>
          <div style="font-size:12px;color:#424242;line-height:1.6;margin-bottom:6px;padding:8px 0;border-bottom:1px solid #F0F0F0;">${ai.summary}</div>
          ${ai.actionNote ? `<div style="font-size:11px;color:#757575;margin-bottom:2px;">처리: ${ai.actionNote}</div>` : ''}
          ${ai.rootCause ? `<div style="font-size:11px;color:#757575;margin-bottom:2px;">원인: ${ai.rootCause}</div>` : ''}
          ${ai.suggestedAction ? `<div style="font-size:11px;color:#1565C0;font-weight:600;margin-bottom:8px;">권장: ${ai.suggestedAction}</div>` : ''}
          ${tagsHtml}
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid #F0F0F0;">${flowTimelineHtml}${intentHtml}${utteranceHtml}${riskHtml}</div>`;
      })();

      const modalBody = `
        <div style="display:grid;grid-template-columns:280px 1fr 400px 350px;gap:0;height:calc(90vh - 160px);max-height:700px;">
          <div style="padding:20px;border-right:1px solid #EEEEEE;overflow-y:auto;">
            <div style="font-size:14px;font-weight:700;margin-bottom:16px;color:#212121;">콜 정보</div>${infoHtml}
          </div>
          <div style="padding:20px;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid #EEEEEE;" id="script-panel">
            <div style="font-size:13px;font-weight:700;color:#424242;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #424242;flex-shrink:0;">스크립트</div>
            <div id="script-scroll" style="flex:1;min-height:0;background:#FAFAFA;border:1px solid #E0E0E0;border-radius:8px;padding:12px;overflow-y:auto;">${scriptHtml}</div>
            <div style="margin-top:10px;background:#F5F5F5;border:1px solid #E0E0E0;border-radius:8px;padding:10px 14px;flex-shrink:0;">
              <div style="display:flex;align-items:center;gap:10px;">
                <button onclick="togglePlay()" style="background:none;border:none;cursor:pointer;padding:0;" id="play-btn"><svg id="play-btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="#424242"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
                <div style="flex:1;"><div style="width:100%;height:4px;background:#BDBDBD;border-radius:2px;position:relative;cursor:pointer;"><div id="player-progress" style="width:0%;height:100%;background:#00A3FF;border-radius:2px;transition:width 0.2s;"></div></div></div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-left:30px;"><span style="font-size:10px;color:#757575;">0:00</span><span style="font-size:10px;color:#757575;">${c.duration}</span></div>
            </div>
          </div>
          <div style="padding:20px;border-right:1px solid #EEEEEE;overflow-y:auto;">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.87-3.13-7-7-7z" fill="#1E88E5"/><circle cx="12" cy="9" r="2" fill="#fff" opacity="0.8"/></svg><span style="font-size:14px;font-weight:700;color:#1565C0;">AI 스크립트 분석</span></div>
            ${aiHtml}
          </div>
          <div style="padding:20px;overflow-y:auto;">
            <div style="font-size:14px;font-weight:700;margin-bottom:16px;color:#212121;">추출 키워드</div>${kwHtml}${silenceHtml}
          </div>
        </div>`;

      AICC_Modal.open({
        title: `콜 상세 - ${c.id}`,
        content: modalBody,
        size: 'xxxl',
        footer: '<button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>'
      });
      requestAnimationFrame(() => {
        const body = document.querySelector('#aicc-modal-backdrop .modal-body');
        if (body) { body.style.overflow = 'auto'; body.style.padding = '0'; }
      });
    }

    function scrollToTranscript(idx) {
      const el = document.getElementById(`transcript-${idx}`);
      if (!el) return;
      el.scrollIntoView({ behavior:'smooth', block:'center' });
      document.querySelectorAll('[id^="transcript-"]').forEach(e => { e.style.boxShadow = 'none'; e.style.background = ''; });
      el.style.boxShadow = 'inset 3px 0 0 #00A3FF';
      el.style.background = '#E3F2FD';
      setTimeout(() => { el.style.boxShadow = 'none'; el.style.background = ''; }, 2500);
    }
    function playSegment(idx) { scrollToTranscript(idx); }
    let isPlaying = false;
    function togglePlay() {
      isPlaying = !isPlaying;
      const icon = document.getElementById('play-btn-icon');
      if (icon) icon.innerHTML = isPlaying ? '<rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/>' : '<polygon points="5 3 19 12 5 21 5 3"/>';
    }

    // [[INIT]] — 초기화
    /* layout.js가 DOMContentLoaded에서 body를 재구성하므로(page-content 유지),
     *  이 스크립트는 그 이후 실행되도록 동일 이벤트에 등록한다. */
    document.addEventListener('DOMContentLoaded', () => {
      renderRiskPanel();          // 리스크 키워드(전체 고정)
      onKwSearch('');             // 검색 패널: 입력 전 안내문
      renderKwFlow();             // 연관1·2 패널: placeholder
      renderTypePanels();         // 문의유형 패널: placeholder
      applyKwFilter();            // 테이블: 초기 빈 상태(키워드 미선택)
      updateSortIcons();
    });
  </script>
</body>
</html>
