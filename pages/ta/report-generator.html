<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>리포트 생성기 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">리포트 생성기</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">TA 분석 리포트 설정 및 생성</p>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start;">
      <!-- 좌측: 설정 폼 -->
      <div>
        <!-- 리포트 유형 -->
        <div class="content-card" style="margin-bottom:16px;">
          <div class="content-card-header">
            <span style="font-size:14px;font-weight:600;">리포트 유형</span>
          </div>
          <div class="content-card-body">
            <div style="display:flex;flex-direction:column;gap:8px;" id="report-type-group">
              <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;transition:all 0.15s;" class="report-type-option" onclick="selectReportType(this, 'daily')">
                <input type="radio" name="reportType" value="daily" checked style="accent-color:#00A3FF;">
                <div>
                  <div style="font-size:13px;font-weight:500;">일간 리포트</div>
                  <div style="font-size:11px;color:#757575;">오늘 기준 일별 TA 분석 요약</div>
                </div>
              </label>
              <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;transition:all 0.15s;" class="report-type-option" onclick="selectReportType(this, 'weekly')">
                <input type="radio" name="reportType" value="weekly" style="accent-color:#00A3FF;">
                <div>
                  <div style="font-size:13px;font-weight:500;">주간 리포트</div>
                  <div style="font-size:11px;color:#757575;">이번 주 추이 및 비교 분석</div>
                </div>
              </label>
              <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;transition:all 0.15s;" class="report-type-option" onclick="selectReportType(this, 'monthly')">
                <input type="radio" name="reportType" value="monthly" style="accent-color:#00A3FF;">
                <div>
                  <div style="font-size:13px;font-weight:500;">월간 리포트</div>
                  <div style="font-size:11px;color:#757575;">이번 달 종합 분석 및 개선 제안</div>
                </div>
              </label>
              <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;transition:all 0.15s;" class="report-type-option" onclick="selectReportType(this, 'yearly')">
                <input type="radio" name="reportType" value="yearly" style="accent-color:#00A3FF;">
                <div>
                  <div style="font-size:13px;font-weight:500;">연간 리포트</div>
                  <div style="font-size:11px;color:#757575;">올해 연간 TA 성과 총괄</div>
                </div>
              </label>
              <label style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #E0E0E0;border-radius:6px;cursor:pointer;transition:all 0.15s;" class="report-type-option" onclick="selectReportType(this, 'custom')">
                <input type="radio" name="reportType" value="custom" style="accent-color:#00A3FF;">
                <div>
                  <div style="font-size:13px;font-weight:500;">날짜 지정 리포트</div>
                  <div style="font-size:11px;color:#757575;">사용자 지정 기간 분석</div>
                </div>
              </label>
            </div>
            <div id="custom-date-area" style="display:none;margin-top:12px;padding:12px;background:#F9F9F9;border-radius:6px;">
              <label class="form-label">리포트 기간</label>
              <div style="display:flex;gap:8px;align-items:center;">
                <input type="date" class="form-input" id="report-from" value="2025-01-01" style="flex:1;">
                <span style="color:#757575;">~</span>
                <input type="date" class="form-input" id="report-to" value="2025-01-19" style="flex:1;">
              </div>
            </div>
          </div>
        </div>

        <!-- 범위 -->
        <div class="content-card" style="margin-bottom:16px;">
          <div class="content-card-header">
            <span style="font-size:14px;font-weight:600;">범위</span>
          </div>
          <div class="content-card-body">
            <div style="margin-bottom:12px;">
              <label class="form-label">분석 범위</label>
              <select class="form-select" id="scope-select" onchange="onScopeChange()" style="width:100%;">
                <option value="all">전체 (모든 센터)</option>
                <option value="center">센터 단위</option>
                <option value="team">팀 단위</option>
                <option value="individual">개인 단위</option>
              </select>
            </div>
            <div id="scope-detail" style="display:none;">
              <label class="form-label" id="scope-detail-label">센터</label>
              <select class="form-select" id="scope-detail-select" style="width:100%;"></select>
            </div>
          </div>
        </div>

        <!-- 포함 섹션 선택 -->
        <div class="content-card" style="margin-bottom:16px;">
          <div class="content-card-header">
            <span style="font-size:14px;font-weight:600;">포함 섹션</span>
          </div>
          <div class="content-card-body">
            <div style="display:flex;flex-direction:column;gap:6px;">
              <div style="font-size:11px;font-weight:600;color:#00A3FF;margin-bottom:2px;">개요</div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-summary" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                요약 (KPI 현황)
              </label>

              <div style="border-top:1px solid #F0F0F0;margin:6px 0;"></div>
              <div style="font-size:11px;font-weight:600;color:#00A3FF;margin-bottom:2px;">콜 분석</div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-call-trend" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                콜 건수 추이
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-hourly" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                시간대별 콜량
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-reentry" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                재인입 콜 추이
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-issue-call" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                이슈 콜 추이
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-silence" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                묵음 비율
              </label>

              <div style="border-top:1px solid #F0F0F0;margin:6px 0;"></div>
              <div style="font-size:11px;font-weight:600;color:#00A3FF;margin-bottom:2px;">키워드 분석</div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-keyword-top20" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                주요 키워드 Top 20
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-issue-keyword" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                이슈 키워드 Top 5
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-new-keyword" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                신규 키워드 Top 5
              </label>

              <div style="border-top:1px solid #F0F0F0;margin:6px 0;"></div>
              <div style="font-size:11px;font-weight:600;color:#00A3FF;margin-bottom:2px;">상담 유형</div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-consult-dist" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                상담유형 분포
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-consult-top5" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                상담유형 Top 5
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-consult-table" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                상담유형별 건수 테이블
              </label>

              <div style="border-top:1px solid #F0F0F0;margin:6px 0;"></div>
              <div style="font-size:11px;font-weight:600;color:#00A3FF;margin-bottom:2px;">팀 / 상담사</div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-team-table" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                팀별 콜 현황
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-agent" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                상담사별 분석
              </label>

              <div style="border-top:1px solid #F0F0F0;margin:6px 0;"></div>
              <div style="font-size:11px;font-weight:600;color:#00A3FF;margin-bottom:2px;">이슈 관리</div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-issue-status" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                이슈 처리 현황
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-issue-pending" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                미처리 이슈 목록
              </label>

              <!--
                [개발 시나리오 — 전기 개선 이행 현황 & 개선 제안]

                ■ 전기 개선 이행 현황
                - "불러오기" 버튼 클릭 → 개선 이행 관리 테이블에서 항목을 조회하는 모달 표시
                - 실제 구현 시: GET /api/improvements?status=&keyword= 로 목록 조회
                - 사용자가 항목을 선택 후 "선택 완료" → 선택된 항목이 리포트 프리뷰에 반영

                ■ 개선 제안
                - 리포트 생성 시 AI가 자동으로 개선 제안 항목 생성 (source: 'ai')
                - 관리자가 항목을 삭제하거나 수동으로 추가 가능 (source: 'manual')
                - "개선 제안 확정" 버튼 클릭 → 개선 이행 관리 DB에 저장
                - 실제 구현 시: POST /api/improvements { reportType, period, contents[], source[] }

                ■ 순환 흐름
                리포트 생성 → AI 개선 제안 → 관리자 편집 → 확정(저장) → 개선 이행 관리에서 처리
                → 다음 리포트 생성 시 "불러오기"로 이전 이행 현황 확인
              -->
              <div style="border-top:1px solid #F0F0F0;margin:6px 0;"></div>
              <div style="font-size:11px;font-weight:600;color:#00A3FF;margin-bottom:2px;">종합</div>
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">
                <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                  <input type="checkbox" id="sec-prev-improvement" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                  전기 개선 이행 현황
                </label>
                <span id="prev-imp-count" style="font-size:11px;color:#9E9E9E;"></span>
                <button class="btn btn-secondary" style="font-size:10px;padding:2px 8px;margin-left:auto;" onclick="openLoadImprovementModal()">불러오기</button>
              </div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-improvement" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                개선 제안
              </label>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;">
                <input type="checkbox" id="sec-appendix" checked onchange="updatePreview()" style="accent-color:#00A3FF;">
                부록 (상세 데이터)
              </label>
            </div>
          </div>
        </div>

        <!-- 액션 버튼 -->
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" onclick="generateReport()" style="flex:1;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            리포트 생성
          </button>
          <button class="btn btn-secondary" onclick="downloadReport()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            다운로드
          </button>
        </div>
      </div>

      <!-- 우측: 미리보기 -->
      <div class="content-card" style="position:sticky;top:72px;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">미리보기</span>
          <span class="badge badge-pending" id="preview-status">미생성</span>
        </div>
        <div class="content-card-body" id="preview-area" style="min-height:600px;max-height:calc(100vh - 180px);overflow-y:auto;">
          <div id="preview-placeholder" style="text-align:center;padding:60px 20px;color:#9E9E9E;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#BDBDBD" stroke-width="1.5" style="margin:0 auto 16px;display:block;">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            <div style="font-size:14px;font-weight:500;margin-bottom:4px;">리포트 미리보기</div>
            <div style="font-size:12px;">좌측에서 설정을 완료한 후 "리포트 생성" 버튼을 클릭하세요.</div>
          </div>
          <div id="preview-content" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

      if (SEC.prevImprovement) {
        if (D.prevImprovements.length === 0) {

            const c = { '일간':'background:#E3F2FD;color:#1565C0', '주간':'background:#E8F5E9;color:#2E7D32', '월간':'background:#F3E5F5;color:#7B1FA2' };

      /*
       * 18. 개선 제안

      if (SEC.improvement) {

          </div>`).join('');
        html += `<div style="margin-bottom:24px;">${secTitle('개선 제안')}${items}
          <div style="padding:10px 0;display:flex;justify-content:space-between;align-items:center;">
            <button class="btn btn-secondary btn-sm" onclick="addManualImprovement()" style="font-size:11px;">+ 항목 추가</button>
            <button class="btn btn-primary btn-sm" onclick="confirmImprovements()" style="font-size:11px;">개선 제안 확정</button>

      /* 19. 부록 */
      if (SEC.appendix) {
        html += `<div style="margin-bottom:24px;">${secTitle('부록 (상세 데이터)')}
          <div style="background:#F9F9F9;border:1px solid #E0E0E0;border-radius:6px;padding:16px;font-size:12px;color:#757575;">
            <div style="margin-bottom:8px;">- 총 콜수: ${num(s.totalCalls)}건 (I/B ${num(s.ibCalls)} / O/B ${num(s.obCalls)})</div>
            <div style="margin-bottom:8px;">- 이슈 콜: ${num(s.issueCalls)}건 (${(s.issueCalls/s.totalCalls*100).toFixed(1)}%)</div>
            <div style="margin-bottom:8px;">- 초과 콜: ${num(s.overCalls)}건 (${(s.overCalls/s.totalCalls*100).toFixed(1)}%)</div>
            <div style="margin-bottom:8px;">- 재인입 콜: ${num(s.reentryCalls)}건 (${(s.reentryCalls/s.totalCalls*100).toFixed(1)}%)</div>
            <div style="margin-bottom:8px;">- 리포트 기간: ${period.from} ~ ${period.to}</div>
            <div style="margin-bottom:8px;">- 데이터 기준: STT 텍스트 분석 + NLP 키워드 추출 결과</div>
            <div>- 본 리포트는 시스템 자동 생성 리포트입니다.</div>
          </div>
          <div style="font-size:13px;font-weight:600;color:#424242;margin:20px 0 10px;">용어 정의 / 분석 기준 안내</div>
          <table class="data-table" style="font-size:12px;">
            <thead><tr><th style="text-align:center">용어</th><th style="text-align:center">설명</th></tr></thead>
            <tbody>
              <tr><td style="text-align:center;font-weight:500;">이슈 콜</td><td style="font-size:12px;color:#757575;">이슈 키워드(금감원, 소송, 보상 요구 등)가 감지된 통화</td></tr>
              <tr><td style="text-align:center;font-weight:500;">초과 콜</td><td style="font-size:12px;color:#757575;">설정된 기준 시간을 초과한 통화 (현재 기준: 분석 기준 관리 설정값)</td></tr>
              <tr><td style="text-align:center;font-weight:500;">재인입 콜</td><td style="font-size:12px;color:#757575;">설정된 기간 내 동일 고객이 재문의한 통화 (현재 기준: 분석 기준 관리 설정값)</td></tr>
              <tr><td style="text-align:center;font-weight:500;">묵음 비율</td><td style="font-size:12px;color:#757575;">통화시간 대비 묵음시간의 비율(%). 묵음시간(초) ÷ (통화시간(분) × 60) × 100 으로 산출</td></tr>
              <tr><td style="text-align:center;font-weight:500;">모니터링 키워드</td><td style="font-size:12px;color:#757575;">STT 분석 시 감지 대상으로 등록된 키워드</td></tr>
              <tr><td style="text-align:center;font-weight:500;">제외 키워드</td><td style="font-size:12px;color:#757575;">분석에서 제외되는 일상적 표현 (예: 네, 감사합니다)</td></tr>

      html += `<div style="border-top:1px solid #E0E0E0;padding-top:12px;margin-top:20px;text-align:center;">
        <div style="font-size:11px;color:#9E9E9E;">AICC Quality Hub - TA 자동 생성 리포트</div>

      content.innerHTML = html;

      const prevLabels = { daily:'전일 기간', weekly:'전주 기간', monthly:'전월 기간', yearly:'전년 기간', custom:'이전 기간' };

      setTimeout(() => {
        if (SEC.callTrend) renderCallTrendChart(curLabel, prevLabel);
        if (SEC.hourly) renderHourlyChart(curLabel, prevLabel);

        if (SEC.issueCall) renderIssueCallChart(curLabel, prevLabel);

    /* ========== 차트 공통: 기간별 라벨 생성 ========== */
    function getTimeLabels() {
      const type = document.querySelector('input[name="reportType"]:checked').value;
      const labels = [];
      if (type === 'daily') { for (let h = 0; h < 24; h++) labels.push(`${h}시`); }
      else if (type === 'weekly') { ['월','화','수','목','금','토','일'].forEach(d => labels.push(d)); }
      else if (type === 'yearly') { for (let m = 1; m <= 12; m++) labels.push(`${m}월`); }
      else {
        const p = getReportPeriod();
        const start = new Date(p.from), end = new Date(p.to);
        const days = Math.min(Math.round((end - start) / 86400000) + 1, 31);
        for (let i = 0; i < days; i++) { const d = new Date(start); d.setDate(start.getDate() + i); labels.push(`${d.getMonth()+1}/${d.getDate()}`); }
      }
      return labels;
    }
    function randData(labels, base, range) { return labels.map(() => Math.round(base + Math.random() * range)); }

    /* ========== 콜 건수 추이 ========== */
    function renderCallTrendChart(curLabel, prevLabel) {
      const ctx = document.getElementById('chart-call-trend'); if (!ctx) return;
      const labels = getTimeLabels();
      new Chart(ctx, { type: 'bar', plugins: [ChartDataLabels], data: {
        labels, datasets: [
          { label: curLabel, data: randData(labels, 350, 200), backgroundColor: 'rgba(0,163,255,0.7)', borderRadius: 3, order: 2, datalabels: { anchor: 'end', align: 'end', offset: 2, font: { size: 9, weight: '600' }, color: '#424242' } },
          { label: prevLabel, data: randData(labels, 320, 180), type: 'line', borderColor: '#BDBDBD', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false, order: 1, datalabels: { display: false } }
        ]
      }, options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } }, interaction: { mode: 'index', intersect: false }, plugins: { legend: { reverse: true, position: 'top', labels: { font: { size: 10 }, boxWidth: 12 } }, tooltip: { enabled: false }, datalabels: {} },
        scales: { y: { beginAtZero: true, grid: { color: '#EEEEEE' }, ticks: { font: { size: 10 }, color: '#9E9E9E' } }, x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#9E9E9E', maxTicksLimit: 10 } } }
      }});
    }

    /* ========== 시간대별 콜량 ========== */
    function renderHourlyChart(curLabel, prevLabel) {
      const ctx = document.getElementById('chart-hourly'); if (!ctx) return;
      const labels = []; for (let h = 0; h < 24; h++) labels.push(`${h}시`);
      const curData = labels.map((_, i) => i >= 9 && i <= 18 ? Math.round(300 + Math.random() * 400) : Math.round(20 + Math.random() * 80));
      const prevData = labels.map((_, i) => i >= 9 && i <= 18 ? Math.round(280 + Math.random() * 380) : Math.round(15 + Math.random() * 70));
      new Chart(ctx, { type: 'bar', plugins: [ChartDataLabels], data: {
        labels, datasets: [
          { label: curLabel, data: curData, backgroundColor: 'rgba(38,166,154,0.75)', borderRadius: 2, order: 2, datalabels: { anchor: 'end', align: 'end', offset: 2, font: { size: 8, weight: '600' }, color: '#424242' } },
          { label: prevLabel, data: prevData, type: 'line', borderColor: '#BDBDBD', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false, order: 1, datalabels: { display: false } }
        ]
      }, options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } }, interaction: { mode: 'index', intersect: false }, plugins: { legend: { reverse: true, position: 'top', labels: { font: { size: 10 }, boxWidth: 12 } }, tooltip: { enabled: false }, datalabels: {} },
        scales: { y: { beginAtZero: true, grid: { color: '#EEEEEE' }, ticks: { font: { size: 9 }, color: '#9E9E9E' } }, x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#9E9E9E', maxTicksLimit: 10 } } }
      }});
    }

    /* ========== 재인입 콜 추이 ========== */
    function renderReentryChart(curLabel, prevLabel) {
      const ctx = document.getElementById('chart-reentry'); if (!ctx) return;
      const labels = getTimeLabels();
      new Chart(ctx, { type: 'bar', plugins: [ChartDataLabels], data: {
        labels, datasets: [
          { label: curLabel, data: randData(labels, 15, 25), backgroundColor: 'rgba(255,143,0,0.8)', borderRadius: 3, order: 2, datalabels: { anchor: 'end', align: 'end', offset: 2, font: { size: 9, weight: '600' }, color: '#424242' } },
          { label: prevLabel, data: randData(labels, 12, 22), type: 'line', borderColor: '#BDBDBD', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false, order: 1, datalabels: { display: false } }
        ]
      }, options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } }, interaction: { mode: 'index', intersect: false }, plugins: { legend: { reverse: true, position: 'top', labels: { font: { size: 10 }, boxWidth: 12 } }, tooltip: { enabled: false }, datalabels: {} },
        scales: { y: { beginAtZero: true, grid: { color: '#EEEEEE' }, ticks: { font: { size: 10 }, color: '#9E9E9E' } }, x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#9E9E9E', maxTicksLimit: 10 } } }
      }});
    }

    /* ========== 이슈 콜 추이 ========== */
    function renderIssueCallChart(curLabel, prevLabel) {
      const ctx = document.getElementById('chart-issue-call'); if (!ctx) return;
      const labels = getTimeLabels();
      new Chart(ctx, { type: 'bar', plugins: [ChartDataLabels], data: {
        labels, datasets: [

          { label: prevLabel, data: randData(labels, 6, 15), type: 'line', borderColor: '#BDBDBD', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false, order: 1, datalabels: { display: false } }

      }, options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } }, interaction: { mode: 'index', intersect: false }, plugins: { legend: { reverse: true, position: 'top', labels: { font: { size: 10 }, boxWidth: 12 } }, tooltip: { enabled: false }, datalabels: {} },
        scales: { y: { beginAtZero: true, grid: { color: '#EEEEEE' }, ticks: { font: { size: 10 }, color: '#9E9E9E' } }, x: { grid: { display: false }, ticks: { font: { size: 10 }, color: '#9E9E9E', maxTicksLimit: 10 } } }
      }});
    }

    /* ========== 묵음 비율 ========== */
    function renderSilenceChart(curLabel, prevLabel) {
      const ctx = document.getElementById('chart-silence'); if (!ctx) return;
      const labels = getTimeLabels();
      const curData = labels.map(() => +(3 + Math.random() * 7).toFixed(1));

      new Chart(ctx, { type: 'bar', plugins: [ChartDataLabels], data: {
        labels, datasets: [
          { label: curLabel, data: curData, backgroundColor: 'rgba(142,68,173,0.75)', borderRadius: 3, order: 2, datalabels: { anchor: 'end', align: 'end', offset: 2, font: { size: 9, weight: '600' }, color: '#424242', formatter: v => v + '%' } },

        ]
      }, options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 18 } }, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { reverse: true, position: 'top', labels: { font: { size: 10 }, boxWidth: 12 } }, tooltip: { enabled: false }, datalabels: {} },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: '묵음 비율(%)', font: { size: 9 } }, grid: { color: '#EEEEEE' }, ticks: { font: { size: 9 }, color: '#9E9E9E', callback: v => v + '%' } },
          x: { grid: { display: false }, ticks: { font: { size: 9 }, color: '#9E9E9E', maxTicksLimit: 10 } }
        }

    /* ========== 전기 개선 이행 현황 — 불러오기 모달 ========== */

    }

      _impSelectedNos = new Set(REPORT_DATA.prevImprovements.map(p => p._no));

      const body = `
        <div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
          <select id="imp-modal-status" class="form-select" style="min-width:100px;font-size:12px;">
            <option value="all">전체 상태</option>
            <option value="미이행">미이행</option>
            <option value="진행중">진행중</option>
            <option value="완료">완료</option>
          </select>
          <input type="text" id="imp-modal-keyword" class="form-input" placeholder="내용 검색" style="flex:1;font-size:12px;">
          <button class="btn btn-primary btn-sm" onclick="filterImpModal()">검색</button>
        </div>
        <div style="max-height:360px;overflow-y:auto;">
          <table style="width:100%;border-collapse:collapse;font-size:13px;">
            <thead><tr style="background:#F5F5F5;">
              <th style="padding:6px;width:5%;">NO</th>
              <th style="padding:6px;width:7%;">유형</th>
              <th style="padding:6px;width:20%;">기간</th>
              <th style="padding:6px;text-align:left;">개선 제안 내용</th>
              <th style="padding:6px;width:8%;">담당자</th>
              <th style="padding:6px;width:8%;">상태</th>
            </tr></thead>
            <tbody id="imp-modal-tbody">${renderImpRows(IMPROVEMENT_POOL)}</tbody>
          </table>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;">
          <span id="imp-sel-count" style="font-size:12px;color:#757575;">${_impSelectedNos.size}건 선택</span>
          <button class="btn btn-primary btn-sm" onclick="confirmLoadImprovement()">선택 완료</button>
        </div>`;

      AICC_Modal.open({ title: '전기 개선 이행 항목 불러오기', content: body, size: 'xl' });
    }

    function impStatusBadge(s) {
      const c = { '완료':'#E8F5E9;color:#2E7D32', '진행중':'#FFF3E0;color:#E65100', '미이행':'#FFEBEE;color:#C62828' };
      return `<span style="display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;background:${c[s]||'#F5F5F5;color:#9E9E9E'}">${s}</span>`;
    }

    function renderImpRows(list) {
      return list.map(d => {
        const sel = _impSelectedNos.has(d.no);
        return `
        <tr onclick="toggleImpRow(${d.no})" style="cursor:pointer;transition:background 0.15s;${sel ? 'background:#E3F2FD;' : ''}" onmouseenter="if(!this.dataset.sel)this.style.background='#F5F5F5'" onmouseleave="this.style.background='${sel ? '#E3F2FD' : ''}'" data-sel="${sel?1:''}">
          <td style="text-align:center;padding:8px;color:#757575;font-size:11px;vertical-align:top;">${sel ? '<span style="color:#1565C0;font-weight:700;">✓</span>' : d.no}</td>
          <td style="text-align:center;padding:8px;font-size:11px;vertical-align:top;">${d.reportType}</td>
          <td style="padding:8px;font-size:11px;color:#757575;white-space:nowrap;vertical-align:top;">${d.period}</td>
          <td style="padding:8px;font-size:12px;line-height:1.6;vertical-align:top;">
            ${d.contents.map((c, i) => `<div style="padding:1px 0;">${i+1}. ${c}</div>`).join('')}
          </td>
          <td style="text-align:center;padding:8px;font-size:11px;vertical-align:top;">${d.admin}</td>
          <td style="text-align:center;padding:8px;vertical-align:top;">${impStatusBadge(d.status)}</td>
        </tr>`;
      }).join('');
    }

    function toggleImpRow(no) {
      if (_impSelectedNos.has(no)) _impSelectedNos.delete(no);
      else _impSelectedNos.add(no);
      refreshImpModalRows();
    }

    function refreshImpModalRows() {
      const status = document.getElementById('imp-modal-status')?.value || 'all';
      const keyword = (document.getElementById('imp-modal-keyword')?.value || '').trim().toLowerCase();
      const list = IMPROVEMENT_POOL.filter(d => {
        if (status !== 'all' && d.status !== status) return false;
        if (keyword && !d.content.toLowerCase().includes(keyword)) return false;
        return true;
      });
      document.getElementById('imp-modal-tbody').innerHTML = renderImpRows(list);
      const countEl = document.getElementById('imp-sel-count');
      if (countEl) countEl.textContent = `${_impSelectedNos.size}건 선택`;
    }

    function filterImpModal() {
      refreshImpModalRows();
    }

    function confirmLoadImprovement() {
      REPORT_DATA.prevImprovements = IMPROVEMENT_POOL.filter(d => _impSelectedNos.has(d.no)).map(d => ({
        _no: d.no, reportType: d.reportType, period: d.period, contents: d.contents, admin: d.admin, status: d.status, memo: d.memo
      }));
      updatePrevImpCount();
      AICC_Modal.close();
      AICC_Toast.show(`${REPORT_DATA.prevImprovements.length}건의 항목을 불러왔습니다.`);
      if (reportGenerated) updatePreview();
    }

    /* ========== 개선 제안 — 항목 삭제/추가 ========== */

    function removeImprovement(idx) {
      REPORT_DATA.improvements.splice(idx, 1);
      if (reportGenerated) updatePreview();
    }

    function addManualImprovement() {
      AICC_Modal.open({
        title: '개선 제안 수동 추가',
        content: `<div style="padding:4px 0;">
          <div style="font-size:12px;color:#757575;margin-bottom:6px;">개선 제안 내용을 입력하세요.</div>
          <textarea id="manual-imp-input" class="form-input" style="width:100%;min-height:80px;resize:none;" placeholder="개선 제안 내용 입력"></textarea>
        </div>`,
        footer: `<button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
                 <button class="btn btn-primary" onclick="confirmAddManualImprovement()">추가</button>`
      });
    }

    function confirmAddManualImprovement() {
      const text = document.getElementById('manual-imp-input').value.trim();
      if (!text) { AICC_Toast.show('내용을 입력해주세요.'); return; }
      REPORT_DATA.improvements.push({ content: text, source: 'manual' });
      AICC_Modal.close();
      AICC_Toast.show('개선 제안이 추가되었습니다.');
      if (reportGenerated) updatePreview();
    }

    /*
     * ========== 개선 제안 확정 → 개선 이행 관리로 저장 ==========
     *
     * [트리거]    "개선 제안 확정" 버튼 클릭
     * [확인 모달] 확정할 항목 목록 + 리포트 유형/기간 정보를 표시하여 관리자 확인
     * [저장 API]  POST /api/improvements
     *             Body: {
     *               reportType: '일간' | '주간' | '월간' | ...,
     *               periodFrom: 'YYYY-MM-DD',
     *               periodTo:   'YYYY-MM-DD',
     *               contents:   ['제안1', '제안2', ...],
     *               sources:    ['ai', 'manual', ...],   // 각 항목의 출처
     *               confirmedBy: '관리자ID'
     *             }
     * [저장 후]   개선 이행 관리 테이블에 신규 레코드 생성 (상태: '미이행', 담당자: 미배정)
     *             → 개선 이행 관리 페이지에서 담당자 배정 및 이행 처리 진행
     */
    function confirmImprovements() {
      const items = REPORT_DATA.improvements;
      if (items.length === 0) { AICC_Toast.show('확정할 개선 제안 항목이 없습니다.'); return; }

      const reportType = document.querySelector('input[name="reportType"]:checked')?.value || 'monthly';
      const typeNames = { daily:'일간', weekly:'주간', monthly:'월간', yearly:'연간', custom:'기간 지정' };
      const period = getReportPeriod();

      AICC_Modal.open({
        title: '개선 제안 확정',
        content: `<div style="padding:4px 0;">
          <div style="font-size:13px;color:#424242;margin-bottom:12px;">
            현재 <strong>${items.length}건</strong>의 개선 제안을 확정하시겠습니까?
          </div>
          <div style="background:#F9F9F9;border:1px solid #EEEEEE;border-radius:6px;padding:12px;max-height:200px;overflow-y:auto;">
            ${items.map((item, i) => `<div style="font-size:12px;line-height:1.5;padding:2px 0;color:#424242;">
              ${i+1}. ${item.content}
              ${item.source === 'ai'
                ? '<span style="background:#E3F2FD;color:#1565C0;padding:1px 4px;border-radius:3px;font-size:9px;font-weight:700;margin-left:4px;">AI</span>'
                : '<span style="background:#F5F5F5;color:#757575;padding:1px 4px;border-radius:3px;font-size:9px;font-weight:700;margin-left:4px;">수동</span>'}
            </div>`).join('')}
          </div>
          <div style="font-size:11px;color:#9E9E9E;margin-top:10px;">
            확정 시 개선 이행 관리에 ${typeNames[reportType]} 리포트 (${period.from} ~ ${period.to}) 항목으로 저장됩니다.
          </div>
        </div>`,
        footer: `<button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
                 <button class="btn btn-primary" onclick="doConfirmImprovements()">확정</button>`
      });
    }

    function doConfirmImprovements() {
      AICC_Modal.close();
      AICC_Toast.show('개선 제안이 확정되어 개선 이행 관리에 저장되었습니다. (시뮬레이션)');
    }
  </script>
</body>
</html>
