<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>리포트 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">리포트 관리</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">이슈 콜 관리 및 리포트</p>
      </div>
    </div>

    <!-- 필터 -->
    <div class="filter-section">
      <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body">
        <div><label class="form-label">기간</label><div id="period-picker"></div></div>
        <div>
          <label class="form-label">이슈상태</label>
          <select class="form-select" id="status-filter">
            <option value="">전체</option>
            <option value="complete">처리완료</option>
            <option value="pending">미처리</option>
          </select>
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="AICC_Toast.show('초기화되었습니다.')">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="AICC_Toast.show('필터가 적용되었습니다.')">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI 카드 -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
      <div class="content-card" style="padding:20px;text-align:center;">
        <div style="font-size:12px;color:#757575;">전체</div>
        <div style="font-size:32px;font-weight:700;color:#212121;margin:8px 0;">127건</div>
        <div style="font-size:12px;color:#9E9E9E;">이슈 콜 총계</div>
      </div>
      <div class="content-card" style="padding:20px;text-align:center;">
        <div style="font-size:12px;color:#757575;">처리완료</div>
        <div style="font-size:32px;font-weight:700;color:#4CAF50;margin:8px 0;">104건</div>
        <div style="font-size:12px;color:#4CAF50;">처리율 81.9%</div>
      </div>
      <div class="content-card" style="padding:20px;text-align:center;">
        <div style="font-size:12px;color:#757575;">미처리</div>
        <div style="font-size:32px;font-weight:700;color:#F44336;margin:8px 0;">23건</div>
        <div style="font-size:12px;color:#F44336;">조치 필요</div>
      </div>
    </div>

    <!-- 이슈 콜 목록 -->
    <div class="content-card" style="margin-bottom:24px;">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">이슈 콜 목록</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr>
              <th>No</th>
              <th>일시</th>
              <th>상담사</th>
              <th>이슈유형</th>
              <th>상담유형</th>
              <th>처리상태</th>
              <th>처리자</th>
            </tr>
          </thead>
          <tbody id="issue-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- 이슈 키워드 규칙 -->
    <div class="content-card">
      <div class="content-card-header" style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:14px;font-weight:600;">이슈 키워드 규칙</span>
        <button class="btn btn-primary btn-sm" onclick="openAddRuleModal()">+ 규칙 추가</button>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr><th>No</th><th>이슈유형</th><th>키워드</th><th>감지방식</th><th>알림여부</th><th>등록일</th><th>관리</th></tr>
          </thead>
          <tbody id="rule-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 규칙 추가 모달 -->
  <div id="add-rule-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:12px;width:480px;box-shadow:0 8px 32px rgba(0,0,0,0.18);">
      <div style="padding:20px 24px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:16px;font-weight:700;">이슈 키워드 규칙 추가</div>
        <button onclick="closeAddRuleModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#757575;">×</button>
      </div>
      <div style="padding:20px 24px;">
        <div style="margin-bottom:16px;">
          <label class="form-label">이슈유형</label>
          <select class="form-select" style="width:100%;">
            <option>불만접수</option><option>환불요청</option><option>품질불량</option><option>법적조치</option>
          </select>
        </div>
        <div style="margin-bottom:16px;">
          <label class="form-label">키워드 (쉼표로 구분)</label>
          <input type="text" class="form-input" style="width:100%;" placeholder="예: 환불, 취소, 불만">
        </div>
        <div style="margin-bottom:16px;">
          <label class="form-label">감지방식</label>
          <select class="form-select" style="width:100%;">
            <option>포함</option><option>정확일치</option><option>시작으로</option>
          </select>
        </div>
        <div>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" checked> <span style="font-size:13px;">이슈 감지 시 알림 발송</span>
          </label>
        </div>
      </div>
      <div style="padding:16px 24px;border-top:1px solid #E0E0E0;display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-secondary" onclick="closeAddRuleModal()">취소</button>
        <button class="btn btn-primary" onclick="AICC_Toast.show('규칙이 추가되었습니다.');closeAddRuleModal()">저장</button>
      </div>
    </div>
  </div>

  <script src="../../assets/dummy-data/all-data.js"></script>
  <script src="../../js/utils/data-loader.js"></script>
  <script src="../../js/utils/auth-simulator.js"></script>
  <script src="../../js/utils/formatters.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/layout.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/period-picker.js"></script>
  <script>
    const issueCalls = [
      { no:1, date:'2025-01-27 16:42', agent:'홍길동', issueType:'불만접수', callType:'불만/클레임', status:'처리완료', handler:'김관리' },
      { no:2, date:'2025-01-27 15:18', agent:'김철수', issueType:'환불요청', callType:'결제/환불', status:'처리완료', handler:'이슈팀' },
      { no:3, date:'2025-01-27 14:05', agent:'이영희', issueType:'품질불량', callType:'교환/반품', status:'미처리', handler:'-' },
      { no:4, date:'2025-01-27 13:32', agent:'박상현', issueType:'배송사고', callType:'배송문의', status:'처리완료', handler:'물류팀' },
      { no:5, date:'2025-01-27 11:07', agent:'최수진', issueType:'법적조치', callType:'불만/클레임', status:'미처리', handler:'-' },
      { no:6, date:'2025-01-27 10:25', agent:'홍길동', issueType:'환불요청', callType:'결제/환불', status:'처리완료', handler:'김관리' },
      { no:7, date:'2025-01-26 17:02', agent:'김철수', issueType:'불만접수', callType:'불만/클레임', status:'미처리', handler:'-' },
      { no:8, date:'2025-01-26 15:38', agent:'이영희', issueType:'품질불량', callType:'교환/반품', status:'처리완료', handler:'품질팀' },
      { no:9, date:'2025-01-26 14:15', agent:'박상현', issueType:'배송사고', callType:'배송문의', status:'처리완료', handler:'물류팀' },
      { no:10, date:'2025-01-26 11:33', agent:'최수진', issueType:'불만접수', callType:'불만/클레임', status:'미처리', handler:'-' }
    ];

    const rules = [
      { no:1, issueType:'불만접수', keywords:'불만, 항의, 화남', detect:'포함', notify:true, regDate:'2025-01-10' },
      { no:2, issueType:'환불요청', keywords:'환불, 취소, 돈 돌려', detect:'포함', notify:true, regDate:'2025-01-10' },
      { no:3, issueType:'법적조치', keywords:'소비자원, 법적조치, 고소', detect:'포함', notify:true, regDate:'2025-01-15' },
      { no:4, issueType:'품질불량', keywords:'불량, 파손, 오작동', detect:'포함', notify:false, regDate:'2025-01-20' }
    ];

    const statusColors = { '처리완료':'#4CAF50', '미처리':'#F44336' };
    const statusBg = { '처리완료':'rgba(76,175,80,0.1)', '미처리':'rgba(244,67,54,0.1)' };

    function openAddRuleModal() {
      document.getElementById('add-rule-modal').style.display = 'flex';
    }
    function closeAddRuleModal() {
      document.getElementById('add-rule-modal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('issue-tbody').innerHTML = issueCalls.map(c => `
        <tr style="cursor:pointer;" onclick="AICC_Modal.open({title:'이슈 콜 상세',content:'<div style=\\'padding:8px;\\'>No: ${c.no}<br>일시: ${c.date}<br>상담사: ${c.agent}<br>이슈유형: ${c.issueType}<br>상담유형: ${c.callType}<br>상태: ${c.status}<br>처리자: ${c.handler}</div>',footer:'<button class=\\'btn btn-secondary\\' onclick=\\'AICC_Modal.close()\\'>닫기</button>',size:'sm'})">
          <td>${c.no}</td>
          <td style="font-size:12px;color:#757575;">${c.date}</td>
          <td style="font-weight:500;">${c.agent}</td>
          <td style="font-weight:500;">${c.issueType}</td>
          <td style="font-size:12px;color:#757575;">${c.callType}</td>
          <td><span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:${statusColors[c.status]};background:${statusBg[c.status]};">${c.status}</span></td>
          <td style="font-size:12px;color:#757575;">${c.handler}</td>
        </tr>
      `).join('');

      document.getElementById('rule-tbody').innerHTML = rules.map(r => `
        <tr>
          <td>${r.no}</td>
          <td style="font-weight:500;">${r.issueType}</td>
          <td style="font-size:12px;color:#757575;">${r.keywords}</td>
          <td style="font-size:12px;">${r.detect}</td>
          <td>
            <span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:${r.notify?'#4CAF50':'#9E9E9E'};background:${r.notify?'rgba(76,175,80,0.1)':'rgba(158,158,158,0.1)'};">${r.notify?'사용':'미사용'}</span>
          </td>
          <td style="font-size:12px;color:#757575;">${r.regDate}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="AICC_Toast.show('규칙을 수정합니다.')">수정</button>
            <button class="btn btn-sm" style="background:#FFF3F3;color:#F44336;border:1px solid #FFCDD2;margin-left:4px;" onclick="AICC_Toast.show('규칙이 삭제되었습니다.')">삭제</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('add-rule-modal').addEventListener('click', function(e) {
        if (e.target === this) closeAddRuleModal();
      });

      if (typeof AICC_PeriodPicker !== 'undefined') {
        AICC_PeriodPicker.create('period-picker', { mode: 'monthly' });
      }
    });
  </script>
</body>
</html>
