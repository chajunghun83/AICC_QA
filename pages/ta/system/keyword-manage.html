<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>키워드 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">키워드 관리</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">분석 키워드 등록 및 관리</p>
      </div>
    </div>

    <div class="content-card">
      <div class="content-card-body" style="padding:0;">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:2px solid #E0E0E0;">
          <div class="tab-nav" style="border-bottom:none;">
            <div class="tab-item active" onclick="switchTab('monitoring')">모니터링 키워드</div>
            <div class="tab-item" onclick="switchTab('issue')">이슈 키워드</div>
            <div class="tab-item" onclick="switchTab('risk')">리스크 키워드</div>
            <div class="tab-item" onclick="switchTab('exclude')">제외 키워드</div>
          </div>
          <button class="btn btn-primary btn-sm" style="margin:8px 0;" onclick="openAddModal()">+ 키워드 추가</button>
        </div>

        <!-- 모니터링 키워드 -->
        <div id="tab-monitoring" style="padding:20px;">
          <div style="font-size:13px;color:#757575;margin-bottom:16px;">키워드 발생 건수와 추이를 실시간으로 모니터링합니다.</div>
          <table class="data-table">
            <thead>
              <tr><th>No</th><th>키워드</th><th>분류</th><th>우선순위</th><th>알림</th><th>등록일</th><th>등록자</th><th>관리</th></tr>
            </thead>
            <tbody id="monitoring-tbody"></tbody>
          </table>
        </div>

        <!-- 이슈 키워드 -->
        <div id="tab-issue" style="display:none;padding:20px;">
          <div style="font-size:13px;color:#757575;margin-bottom:16px;">이슈 콜 분류에 사용되는 키워드를 관리합니다.</div>
          <table class="data-table">
            <thead>
              <tr><th>No</th><th>키워드</th><th>이슈유형</th><th>감지방식</th><th>알림</th><th>등록일</th><th>등록자</th><th>관리</th></tr>
            </thead>
            <tbody id="issue-tbody"></tbody>
          </table>
        </div>

        <!-- 리스크 키워드 -->
        <div id="tab-risk" style="display:none;padding:20px;">
          <div style="font-size:13px;color:#757575;margin-bottom:16px;">감지 시 즉시 알림이 발송되는 고위험 키워드입니다.</div>
          <table class="data-table">
            <thead>
              <tr><th>No</th><th>키워드</th><th>위험등급</th><th>대응지침</th><th>등록일</th><th>등록자</th><th>관리</th></tr>
            </thead>
            <tbody id="risk-tbody"></tbody>
          </table>
        </div>

        <!-- 제외 키워드 -->
        <div id="tab-exclude" style="display:none;padding:20px;">
          <div style="font-size:13px;color:#757575;margin-bottom:16px;">분석에서 제외할 불용어(stopword)를 관리합니다.</div>
          <table class="data-table">
            <thead>
              <tr><th>No</th><th>키워드</th><th>제외사유</th><th>등록일</th><th>등록자</th><th>관리</th></tr>
            </thead>
            <tbody id="exclude-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 키워드 추가 모달 -->
  <div id="add-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:12px;width:460px;box-shadow:0 8px 32px rgba(0,0,0,0.18);">
      <div style="padding:20px 24px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:16px;font-weight:700;" id="modal-title">키워드 추가</div>
        <button onclick="closeAddModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#757575;">×</button>
      </div>
      <div style="padding:20px 24px;">
        <div style="margin-bottom:16px;">
          <label class="form-label">키워드</label>
          <input type="text" class="form-input" style="width:100%;" placeholder="키워드를 입력하세요">
        </div>
        <div style="margin-bottom:16px;">
          <label class="form-label">분류/유형</label>
          <input type="text" class="form-input" style="width:100%;" placeholder="분류를 입력하세요">
        </div>
        <div style="margin-bottom:16px;">
          <label class="form-label">우선순위</label>
          <select class="form-select" style="width:100%;">
            <option>높음</option><option>보통</option><option>낮음</option>
          </select>
        </div>
        <div>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" checked> <span style="font-size:13px;">감지 시 알림 발송</span>
          </label>
        </div>
      </div>
      <div style="padding:16px 24px;border-top:1px solid #E0E0E0;display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-secondary" onclick="closeAddModal()">취소</button>
        <button class="btn btn-primary" onclick="AICC_Toast.show('키워드가 추가되었습니다.');closeAddModal()">저장</button>
      </div>
    </div>
  </div>

  <script src="../../../assets/dummy-data/all-data.js"></script>
  <script src="../../../js/utils/data-loader.js"></script>
  <script src="../../../js/utils/auth-simulator.js"></script>
  <script src="../../../js/utils/formatters.js"></script>
  <script src="../../../js/components/sidebar.js"></script>
  <script src="../../../js/components/layout.js"></script>
  <script src="../../../js/components/modal.js"></script>
  <script src="../../../js/components/toast.js"></script>
  <script src="../../../js/components/period-picker.js"></script>
  <script>
    const monitoringKeywords = [
      { no:1, keyword:'소비자원', category:'법률', priority:'높음', notify:true, regDate:'2025-01-10', registrant:'관리자' },
      { no:2, keyword:'법적조치', category:'법률', priority:'높음', notify:true, regDate:'2025-01-10', registrant:'관리자' },
      { no:3, keyword:'개인정보유출', category:'보안', priority:'높음', notify:true, regDate:'2025-01-15', registrant:'시스템' },
      { no:4, keyword:'환불거부', category:'서비스', priority:'보통', notify:true, regDate:'2025-01-20', registrant:'홍길동' },
      { no:5, keyword:'재인입', category:'서비스품질', priority:'낮음', notify:false, regDate:'2025-01-22', registrant:'김관리' }
    ];

    const issueKeywords = [
      { no:1, keyword:'환불', issueType:'환불요청', detect:'포함', notify:true, regDate:'2025-01-10', registrant:'관리자' },
      { no:2, keyword:'불만', issueType:'불만접수', detect:'포함', notify:true, regDate:'2025-01-10', registrant:'관리자' },
      { no:3, keyword:'소비자원', issueType:'법적조치', detect:'정확일치', notify:true, regDate:'2025-01-15', registrant:'관리자' },
      { no:4, keyword:'파손', issueType:'품질불량', detect:'포함', notify:false, regDate:'2025-01-18', registrant:'품질팀' }
    ];

    const riskKeywords = [
      { no:1, keyword:'법적조치', level:'높음', guide:'팀장 즉시 보고', regDate:'2025-01-10', registrant:'관리자' },
      { no:2, keyword:'소비자원', level:'높음', guide:'팀장 즉시 보고', regDate:'2025-01-10', registrant:'관리자' },
      { no:3, keyword:'해킹', level:'높음', guide:'보안팀 긴급 연락', regDate:'2025-01-15', registrant:'시스템' },
      { no:4, keyword:'개인정보유출', level:'높음', guide:'보안팀 긴급 연락', regDate:'2025-01-15', registrant:'시스템' },
      { no:5, keyword:'서비스해지', level:'보통', guide:'유지담당자 연결', regDate:'2025-01-20', registrant:'홍길동' }
    ];

    const excludeKeywords = [
      { no:1, keyword:'음', reason:'불용어', regDate:'2025-01-10', registrant:'관리자' },
      { no:2, keyword:'어', reason:'불용어', regDate:'2025-01-10', registrant:'관리자' },
      { no:3, keyword:'네', reason:'단순응답어', regDate:'2025-01-10', registrant:'관리자' },
      { no:4, keyword:'예', reason:'단순응답어', regDate:'2025-01-10', registrant:'관리자' },
      { no:5, keyword:'아니요', reason:'단순응답어', regDate:'2025-01-12', registrant:'관리자' }
    ];

    const priorityColor = { '높음':'#F44336', '보통':'#F57F17', '낮음':'#9E9E9E' };
    const priorityBg = { '높음':'rgba(244,67,54,0.1)', '보통':'rgba(245,127,23,0.1)', '낮음':'rgba(158,158,158,0.1)' };

    function badge(text, color, bg) {
      return `<span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;color:${color};background:${bg};">${text}</span>`;
    }
    function actionBtns() {
      return `<button class="btn btn-secondary btn-sm" onclick="AICC_Toast.show('수정합니다.')">수정</button>
              <button class="btn btn-sm" style="background:#FFF3F3;color:#F44336;border:1px solid #FFCDD2;margin-left:4px;" onclick="AICC_Toast.show('삭제되었습니다.')">삭제</button>`;
    }

    function switchTab(tab) {
      ['monitoring','issue','risk','exclude'].forEach(t => {
        document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
      });
      document.querySelectorAll('.tab-item').forEach((el, i) => {
        const tabs = ['monitoring','issue','risk','exclude'];
        el.classList.toggle('active', tabs[i] === tab);
      });
    }

    function openAddModal() {
      document.getElementById('add-modal').style.display = 'flex';
    }
    function closeAddModal() {
      document.getElementById('add-modal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('monitoring-tbody').innerHTML = monitoringKeywords.map(k => `
        <tr>
          <td>${k.no}</td><td style="font-weight:600;">${k.keyword}</td>
          <td style="font-size:12px;color:#757575;">${k.category}</td>
          <td>${badge(k.priority, priorityColor[k.priority], priorityBg[k.priority])}</td>
          <td>${badge(k.notify?'사용':'미사용', k.notify?'#4CAF50':'#9E9E9E', k.notify?'rgba(76,175,80,0.1)':'rgba(158,158,158,0.1)')}</td>
          <td style="font-size:12px;color:#757575;">${k.regDate}</td>
          <td style="font-size:12px;color:#757575;">${k.registrant}</td>
          <td>${actionBtns()}</td>
        </tr>
      `).join('');

      document.getElementById('issue-tbody').innerHTML = issueKeywords.map(k => `
        <tr>
          <td>${k.no}</td><td style="font-weight:600;">${k.keyword}</td>
          <td style="font-size:12px;">${k.issueType}</td>
          <td style="font-size:12px;color:#757575;">${k.detect}</td>
          <td>${badge(k.notify?'사용':'미사용', k.notify?'#4CAF50':'#9E9E9E', k.notify?'rgba(76,175,80,0.1)':'rgba(158,158,158,0.1)')}</td>
          <td style="font-size:12px;color:#757575;">${k.regDate}</td>
          <td style="font-size:12px;color:#757575;">${k.registrant}</td>
          <td>${actionBtns()}</td>
        </tr>
      `).join('');

      document.getElementById('risk-tbody').innerHTML = riskKeywords.map(k => `
        <tr>
          <td>${k.no}</td><td style="font-weight:600;">${k.keyword}</td>
          <td>${badge(k.level, priorityColor[k.level], priorityBg[k.level])}</td>
          <td style="font-size:12px;color:#757575;">${k.guide}</td>
          <td style="font-size:12px;color:#757575;">${k.regDate}</td>
          <td style="font-size:12px;color:#757575;">${k.registrant}</td>
          <td>${actionBtns()}</td>
        </tr>
      `).join('');

      document.getElementById('exclude-tbody').innerHTML = excludeKeywords.map(k => `
        <tr>
          <td>${k.no}</td><td style="font-weight:600;">${k.keyword}</td>
          <td style="font-size:12px;color:#757575;">${k.reason}</td>
          <td style="font-size:12px;color:#757575;">${k.regDate}</td>
          <td style="font-size:12px;color:#757575;">${k.registrant}</td>
          <td>${actionBtns()}</td>
        </tr>
      `).join('');

      document.getElementById('add-modal').addEventListener('click', function(e) {
        if (e.target === this) closeAddModal();
      });
    });
  </script>
</body>
</html>
