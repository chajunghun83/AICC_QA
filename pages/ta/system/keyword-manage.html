  <style>
    .kw-tabs { display:flex; gap:0; border-bottom:2px solid #E0E0E0; margin-bottom:0; }
    .kw-tab { padding:10px 24px; font-size:13px; font-weight:600; color:#9E9E9E; background:none; border:none;
              cursor:pointer; position:relative; transition:color .15s; border-bottom:2px solid transparent; margin-bottom:-2px; }
    .kw-tab:hover { color:#424242; }
    .kw-tab.active { color:#00A3FF; border-bottom-color:#00A3FF; }
    .kw-tab .tab-count { font-weight:400; font-size:11px; margin-left:4px; color:#BDBDBD; }
    .kw-tab.active .tab-count { color:#00A3FF; }

    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    .data-table { font-size:12px; table-layout:fixed; width:100%; }
    .data-table th, .data-table td { padding:10px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }

    .toggle-switch { position:relative; width:36px; height:20px; display:inline-block; vertical-align:middle; }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider { position:absolute; inset:0; background:#ccc; border-radius:10px; cursor:pointer; transition:.2s; }
    .toggle-slider::before { content:''; position:absolute; width:16px; height:16px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; }
    .toggle-switch input:checked + .toggle-slider { background:#00A3FF; }
    .toggle-switch input:checked + .toggle-slider::before { transform:translateX(16px); }

    .action-btn { background:none; border:none; cursor:pointer; padding:4px; border-radius:4px; color:#757575; transition:all .15s; }
    .action-btn:hover { background:#F5F5F5; color:#212121; }

    /* 트리 스타일 */
    .tree-node { user-select:none; }
    .tree-label { display:flex; align-items:center; gap:4px; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:12px; color:#555; transition:background .1s; }
    .tree-label:hover { background:#F5F5F5; }
    .tree-label.selected { background:#E3F2FD; color:#1976D2; }
    /* 깊이별 스타일 */
    .tree-label.depth-0 { font-size:13px; font-weight:600; color:#212121; background:#F5F7FA; border-left:3px solid #00A3FF; border-radius:0 4px 4px 0; padding:7px 10px; margin-bottom:2px; }
    .tree-label.depth-0:hover { background:#EBF0F5; }
    .tree-label.depth-0.selected { background:#DBEAFE; color:#1565C0; border-left-color:#1565C0; }
    .tree-label.depth-1 { font-size:12.5px; font-weight:500; color:#424242; }
    .tree-label.depth-1.selected { background:#E3F2FD; color:#1976D2; font-weight:600; }
    .tree-toggle { width:16px; height:16px; display:inline-flex; align-items:center; justify-content:center; font-size:10px; color:#9E9E9E; flex-shrink:0; }
    .tree-add-btn { opacity:0; margin-left:auto; background:none; border:none; cursor:pointer; font-size:14px; color:#BDBDBD; padding:0 4px; transition:opacity .15s, color .15s; }
    .tree-label:hover .tree-add-btn { opacity:1; }
    .tree-add-btn:hover { color:#00A3FF; }
    .tree-children { padding-left:18px; }
    .tree-inline-input { border:1px solid #90CAF9; border-radius:4px; padding:3px 8px; font-size:12px; outline:none; width:120px; margin:2px 0 2px 20px; }
  </style>
</head>

    let selectedRiskCategoryId = null;

    const tabLabels = { monitor:'종목명 키워드', exclude:'제외 키워드', issue:'리스크 키워드' };
    let currentTab = 'monitor';

    /* ========== 탭 전환 ========== */
    function switchTab(type) {
      currentTab = type;
      document.querySelectorAll('.kw-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === type));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${type}`));
    }

    /* ========== 트리 렌더링 ========== */
    let _addingTo = null; // 인라인 입력 활성 대상 ('root' 또는 부모 id)

    function renderTree() {
      const el = document.getElementById('product-tree');
      el.innerHTML = _buildTreeHtml(productTree, 0, {
        selectedId: selectedCategoryId,
        addingTo: _addingTo,
        clickHandler: 'selectCategory',
        addChildHandler: 'startAddChild'
      });
      if (_addingTo === 'root') el.insertAdjacentHTML('beforeend', _inlineInputHtml('root', 'confirmAddCategory', 'cancelAddCategory'));
      _updateMonitorTabCount();
      const inp = document.getElementById('tree-inline-input');
      if (inp) inp.focus();
    }

    function _buildTreeHtml(nodes, depth, ctx) {
      return nodes.map(n => {
        const hasChildren = n.children && n.children.length > 0;
        const isOpen = n.open !== false;
        const sel = ctx.selectedId === n.id ? ' selected' : '';
        const toggleIcon = hasChildren ? (isOpen ? '▼' : '▶') : '<span style="width:10px;display:inline-block;"></span>';
        let childrenHtml = '';
        if (hasChildren && isOpen) childrenHtml = `<div class="tree-children">${_buildTreeHtml(n.children, depth + 1, ctx)}</div>`;
        else if (!hasChildren && isOpen) childrenHtml = '<div class="tree-children"></div>';
        // 인라인 입력 삽입
        if (ctx.addingTo === n.id && isOpen) {
          const chDiv = childrenHtml || '<div class="tree-children"></div>';
          const confirmFn = ctx.clickHandler === 'selectRiskCategory' ? 'confirmRiskAddCategory' : 'confirmAddCategory';
          const cancelFn  = ctx.clickHandler === 'selectRiskCategory' ? 'cancelRiskAddCategory'  : 'cancelAddCategory';
          childrenHtml = chDiv.replace('</div>',  _inlineInputHtml(n.id, confirmFn, cancelFn) + '</div>');
        }
        const depthCls = depth <= 1 ? ` depth-${depth}` : '';
        return `<div class="tree-node">
          <div class="tree-label${depthCls}${sel}" onclick="${ctx.clickHandler}(${n.id}, event)">
            <span class="tree-toggle">${toggleIcon}</span>
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${n.name}</span>
            <button class="tree-add-btn" onclick="${ctx.addChildHandler}(${n.id}, event)" title="하위 분류 추가">+</button>
          </div>
          ${childrenHtml}
        </div>`;
      }).join('');
    }

    function _inlineInputHtml(parentId, confirmFn, cancelFn) {
      const pl = parentId === 'root' ? '6px' : '20px';
      const cf = confirmFn || 'confirmAddCategory';
      const xf = cancelFn  || 'cancelAddCategory';
      return `<div style="display:flex;align-items:center;gap:4px;padding:3px 0 3px ${pl};">
        <input type="text" id="tree-inline-input" class="tree-inline-input" placeholder="분류명 입력" onkeydown="if(event.key==='Enter')${cf}('${parentId}');if(event.key==='Escape')${xf}();">
        <button style="background:#00A3FF;color:#fff;border:none;border-radius:4px;padding:3px 10px;font-size:11px;cursor:pointer;white-space:nowrap;" onclick="${cf}('${parentId}')">확인</button>
        <button style="background:none;border:1px solid #E0E0E0;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;color:#757575;white-space:nowrap;" onclick="${xf}()">취소</button>
      </div>`;
    }

    function _findNode(nodes, id) {
      for (const n of nodes) {
        if (n.id === id) return n;
        if (n.children) { const f = _findNode(n.children, id); if (f) return f; }
      }
      return null;
    }

    // 노드 자신과 모든 하위 카테고리 id 수집
    function _collectCategoryIds(node) {
      if (!node) return [];
      const ids = [node.id];
      if (node.children) node.children.forEach(c => ids.push(..._collectCategoryIds(c)));
      return ids;
    }

    function selectCategory(id, e) {
      if (e.target.closest('.tree-add-btn')) return;
      const node = _findNode(productTree, id);
      if (!node) return;
      // 하위가 있으면 토글, 동시에 선택도 변경
      if (node.children && node.children.length > 0) {
        if (selectedCategoryId === id) { node.open = !node.open; }
        else { node.open = true; }
      }
      selectedCategoryId = id;
      renderTree();
      renderProductTable();
    }

    function addRootCategory() {
      _addingTo = 'root';
      renderTree();
    }

    function startAddChild(parentId, e) {
      e.stopPropagation();
      const parent = _findNode(productTree, parentId);
      if (parent) parent.open = true;
      _addingTo = parentId;
      renderTree();
    }

    function confirmAddCategory(parentId) {
      const inp = document.getElementById('tree-inline-input');
      const name = inp ? inp.value.trim() : '';
      if (!name) { AICC_Toast.show('분류명을 입력해 주세요.'); return; }
      if (parentId === 'root') {
        productTree.push({ id: ++_treeIdSeq, name, open: true, children: [] });
      } else {
        const parent = _findNode(productTree, parseInt(parentId));
        if (parent) {
          if (!parent.children) parent.children = [];
          parent.children.push({ id: ++_treeIdSeq, name, children: [] });
          parent.open = true;
        }
      }
      _addingTo = null;
      renderTree();
      AICC_Toast.show(`"${name}" 분류가 추가되었습니다.`);
    }

    function cancelAddCategory() {
      _addingTo = null;
      renderTree();
    }

    /* ========== 상품 테이블 렌더링 ========== */
    function renderProductTable() {
      const tbody = document.getElementById('monitor-tbody');
      const countEl = document.getElementById('monitor-count');

      if (!selectedCategoryId) {
        countEl.textContent = '분류를 선택하세요';
        tbody.innerHTML = '<tr><td colspan="6" style="padding:40px;color:#9E9E9E;">왼쪽 트리에서 분류를 선택하세요</td></tr>';
        return;
      }

      const node = _findNode(productTree, selectedCategoryId);
      // 선택된 카테고리 + 모든 하위 카테고리의 상품을 수집
      const allCatIds = _collectCategoryIds(node);
      const data = [];
      allCatIds.forEach(cid => { if (productData[cid]) data.push(...productData[cid].map(d => ({...d, _catId: cid}))); });

      countEl.innerHTML = `<strong>${node ? node.name : ''}</strong> — ${activeCount} / ${data.length}건 활성`;

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="padding:40px;color:#9E9E9E;">등록된 상품이 없습니다</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((d, i) => `
        <tr>
          <td>${i + 1}</td>
          <td style="font-family:monospace;font-size:11px;">${d.sku}</td>
          <td style="font-weight:500;text-align:left;padding-left:12px;">${d.name}</td>
          <td style="text-align:left;padding-left:12px;">${d.desc}</td>
          <td>
            <label class="toggle-switch">
              <input type="checkbox" ${d.active ? 'checked' : ''} onchange="toggleProduct(${d._catId},${d.no})">

            </label>

              </button>
              <button class="action-btn" onclick="deleteProduct(${d._catId},${d.no})" title="삭제">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function toggleProduct(catId, no) {
      const data = productData[catId];
      if (!data) return;
      const item = data.find(d => d.no === no);
      if (item) { item.active = !item.active; renderProductTable(); _updateMonitorTabCount();

      }
    }

    function deleteProduct(catId, no) {
      const data = productData[catId];
      if (!data) return;
      const idx = data.findIndex(d => d.no === no);
      if (idx === -1) return;
      const name = data[idx].name;
      data.splice(idx, 1);
      renderProductTable(); _updateMonitorTabCount();
      AICC_Toast.show(`"${name}" 상품이 삭제되었습니다.`);
    }

      let total = 0;
      Object.values(productData).forEach(arr => { total += arr.length; });
      document.getElementById('monitor-tab-count').textContent = `(${total})`;

      if (item) { item.active = !item.active; renderRiskTable(); _updateRiskTabCount();

    function deleteRiskKeyword(catId, no) {
      const data = riskData[catId];
      if (!data) return;
      const idx = data.findIndex(d => d.no === no);
      if (idx === -1) return;
      const kw = data[idx].keyword;
      data.splice(idx, 1);
      renderRiskTable(); _updateRiskTabCount();
      AICC_Toast.show(`"${kw}" 키워드가 삭제되었습니다.`);
    }

    function _updateRiskTabCount() {
      let total = 0;
      Object.values(riskData).forEach(arr => { total += arr.length; });
      document.getElementById('issue-tab-count').textContent = `(${total})`;

    /* ========== 엑셀 업로드 (더미) ========== */
    function handleExcelUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (!selectedCategoryId) { AICC_Toast.show('먼저 분류를 선택해 주세요.'); e.target.value = ''; return; }
      const data = productData[selectedCategoryId] || [];
      const maxNo = data.length > 0 ? Math.max(...data.map(d => d.no)) : 0;
      const dummyProducts = [
        { no: maxNo + 1, sku: 'UP-001', name: '업로드 상품 A', desc: '엑셀 업로드 상품 A', active: true },
        { no: maxNo + 2, sku: 'UP-002', name: '업로드 상품 B', desc: '엑셀 업로드 상품 B', active: true },
        { no: maxNo + 3, sku: 'UP-003', name: '업로드 상품 C', desc: '엑셀 업로드 상품 C', active: true }
      ];
      if (!productData[selectedCategoryId]) productData[selectedCategoryId] = [];
      productData[selectedCategoryId].push(...dummyProducts);
      renderProductTable(); _updateMonitorTabCount();
      AICC_Toast.show(`"${file.name}" 파일에서 ${dummyProducts.length}개 상품이 등록되었습니다.`);
      e.target.value = '';
    }

    /* ========== 제외/이슈 테이블 렌더링 ========== */
    function renderTable(type) {
      const data = [...kwData[type]].sort((a, b) => b.no - a.no);
      const tbody = document.getElementById(`${type}-tbody`);
      const countEl = document.getElementById(`${type}-count`);
      const tabCountEl = document.getElementById(`${type}-tab-count`);
      const activeCount = data.filter(d => d.active).length;

      countEl.textContent = `${activeCount} / ${data.length}건 활성`;
      tabCountEl.textContent = `(${data.length})`;

      tbody.innerHTML = data.map(d => `
        <tr>
          <td>${d.no}</td>
          <td style="font-weight:500;">${d.keyword}</td>
          <td>${d.description}</td>
          <td>${d.callType}</td>

            <label class="toggle-switch">
              <input type="checkbox" ${d.active ? 'checked' : ''} onchange="toggleActive('${type}',${d.no})">
              <span class="toggle-slider"></span>
            </label>
          </td>
          <td>
            <div style="display:flex;gap:8px;justify-content:center;">
              <button class="action-btn" onclick="openEditModal('${type}',${d.no})" title="수정">

              </button>
              <button class="action-btn" onclick="deleteRule('${type}',${d.no})" title="삭제">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function toggleActive(type, no) {
      const item = kwData[type].find(d => d.no === no);
      if (item) { item.active = !item.active; renderTable(type);
        AICC_Toast.show(`"${item.keyword}" ${item.active ? '활성화' : '비활성화'}되었습니다.`);
      }
    }

    function deleteRule(type, no) {
      const data = kwData[type];
      const idx = data.findIndex(d => d.no === no);
      if (idx === -1) return;
      const kw = data[idx].keyword;
      data.splice(idx, 1);
      renderTable(type);
      AICC_Toast.show(`"${kw}" 키워드가 삭제되었습니다.`);
    }

    /* ========== 추가/수정 모달 ========== */
    function openModal(type) {
      if (type === 'monitor' && !selectedCategoryId) {
        AICC_Toast.show('먼저 분류를 선택해 주세요.');
        return;
      }
      if (type === 'issue' && !selectedRiskCategoryId) {
        AICC_Toast.show('먼저 리스크 분류를 선택해 주세요.');
        return;
      }
      if (type === 'issue' && selectedRiskCategoryId) {
        const node = _findNode(riskTree, selectedRiskCategoryId);
        if (node && node.children && node.children.length > 0) {
          AICC_Toast.show('하위 분류(소분류)를 선택한 뒤 키워드를 추가해 주세요.');
          return;
        }
      }
      AICC_Modal.open({
        title: `${tabLabels[type]} 추가`,
        content: buildModalContent(type, null),
        footer: `
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
          <button class="btn btn-primary" onclick="saveRule('${type}', null)">저장</button>
        `,
        size: 'md'
      });
    }

    function openEditModal(type, no, catId) {
      let item;
      if (type === 'monitor') {
        const cid = catId || selectedCategoryId;
        const data = productData[cid] || [];
        item = data.find(d => d.no === no);
      } else if (type === 'issue') {
        const cid = catId || selectedRiskCategoryId;
        const data = riskData[cid] || [];
        item = data.find(d => d.no === no);
      } else {
        item = kwData[type].find(d => d.no === no);
      }
      if (!item) return;
      AICC_Modal.open({
        title: `${tabLabels[type]} 수정`,
        content: buildModalContent(type, item),
        footer: `
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
          <button class="btn btn-primary" onclick="saveRule('${type}', ${no})">저장</button>
        `,
        size: 'md'
      });
    }

    function buildModalContent(type, item) {
      if (type === 'monitor') {
        const nameVal = item ? item.name : '';
        const skuVal = item ? item.sku : '';
        const descVal = item ? item.desc : '';
        return `
          <div style="display:flex;flex-direction:column;gap:20px;">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
              <div>
                <label class="form-label">상품명</label>
                <input type="text" class="form-input" id="modal-keyword" value="${nameVal}" placeholder="예: 캐시미어 라운드 니트" style="width:100%;box-sizing:border-box;">
              </div>
              <div>
                <label class="form-label">상품코드</label>
                <input type="text" class="form-input" id="modal-sku" value="${skuVal}" placeholder="예: WK-001" style="width:100%;box-sizing:border-box;">
              </div>
            </div>
            <div>
              <label class="form-label">상품 설명</label>
              <input type="text" class="form-input" id="modal-desc" value="${descVal}" placeholder="예: 캐시미어 100% 라운드넥 니트" style="width:100%;box-sizing:border-box;">
            </div>
          </div>`;
      }

      const kwVal = item ? item.keyword : '';
      const descVal = item ? item.description : '';
      const callTypeVal = item ? item.callType : '전체';
      const placeholders = {
        exclude: { kw:'예: 네, 감사합니다, 여보세요', desc:'예: 응답 추임새, 일반 인사말' },
        issue:   { kw:'예: 금감원, 변호사, 오체결', desc:'예: 금융감독원 신고 언급, 법적 조치 표명' }
      };
      const ph = placeholders[type];
      return `
        <div style="display:flex;flex-direction:column;gap:20px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div>
              <label class="form-label">키워드 (STT 감지 문구)</label>
              <input type="text" class="form-input" id="modal-keyword" value="${kwVal}" placeholder="${ph.kw}" style="width:100%;box-sizing:border-box;">
            </div>
            <div>
              <label class="form-label">적용 상담 유형</label>
              <select class="form-select" id="modal-calltype" style="width:100%;box-sizing:border-box;">
                <option value="전체" ${callTypeVal==='전체'?'selected':''}>전체</option>
                <option value="I/B" ${callTypeVal==='I/B'?'selected':''}>I/B (인바운드)</option>
                <option value="O/B" ${callTypeVal==='O/B'?'selected':''}>O/B (아웃바운드)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="form-label">키워드 설명</label>
            <input type="text" class="form-input" id="modal-desc" value="${descVal}" placeholder="${ph.desc}" style="width:100%;box-sizing:border-box;">
          </div>
        </div>`;
    }

    function saveRule(type, editNo) {
      if (type === 'monitor') {
        const name = document.getElementById('modal-keyword').value.trim();
        const sku = document.getElementById('modal-sku').value.trim();
        const desc = document.getElementById('modal-desc').value.trim();
        if (!name) { AICC_Toast.show('상품명을 입력해 주세요.'); return; }
        if (!productData[selectedCategoryId]) productData[selectedCategoryId] = [];
        const data = productData[selectedCategoryId];
        if (editNo) {
          const item = data.find(d => d.no === editNo);
          if (item) { item.name = name; item.sku = sku; item.desc = desc; }
          AICC_Toast.show(`"${name}" 상품이 수정되었습니다.`);
        } else {
          const maxNo = data.length > 0 ? Math.max(...data.map(d => d.no)) : 0;
          data.push({ no: maxNo + 1, sku, name, desc, active: true });
          AICC_Toast.show(`"${name}" 상품이 추가되었습니다.`);
        }
        AICC_Modal.close();
        renderProductTable(); _updateMonitorTabCount();
        return;
      }

      const keyword = document.getElementById('modal-keyword').value.trim();
      const description = document.getElementById('modal-desc').value.trim();
      const callType = document.getElementById('modal-calltype').value;
      if (!keyword) { AICC_Toast.show('키워드를 입력해 주세요.'); return; }

      if (type === 'issue') {
        if (!riskData[selectedRiskCategoryId]) riskData[selectedRiskCategoryId] = [];
        const data = riskData[selectedRiskCategoryId];
        if (editNo) {
          const item = data.find(d => d.no === editNo);
          if (item) { item.keyword = keyword; item.description = description; item.callType = callType; }
          AICC_Toast.show(`"${keyword}" 키워드가 수정되었습니다.`);
        } else {
          const maxNo = data.length > 0 ? Math.max(...data.map(d => d.no)) : 0;
          data.push({ no: maxNo + 1, keyword, description, callType, active: true });
          AICC_Toast.show(`"${keyword}" 키워드가 추가되었습니다.`);
        }
        AICC_Modal.close();
        renderRiskTable(); _updateRiskTabCount();
        return;
      }

      const data = kwData[type];
      if (editNo) {
        const item = data.find(d => d.no === editNo);
        if (item) { item.keyword = keyword; item.description = description; item.callType = callType; }
        AICC_Toast.show(`"${keyword}" 키워드가 수정되었습니다.`);
      } else {
        const maxNo = data.length > 0 ? Math.max(...data.map(d => d.no)) : 0;
        data.push({ no: maxNo + 1, keyword, description, callType, active: true });
        AICC_Toast.show(`"${keyword}" 키워드가 추가되었습니다.`);
      }
      AICC_Modal.close();
      renderTable(type);
    }

    /* ========== 초기화 ========== */
    document.addEventListener('DOMContentLoaded', () => {
      renderTree();
      renderProductTable();
      renderRiskTree();
      renderRiskTable();
      renderTable('exclude');
    });
  </script>
</body>
</html>
