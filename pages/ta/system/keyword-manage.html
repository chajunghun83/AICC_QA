<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>키워드 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../../css/styles.css">
  <style>
    .kw-tabs { display:flex; gap:0; border-bottom:2px solid #E0E0E0; margin-bottom:0; }
    .kw-tab { padding:10px 24px; font-size:13px; font-weight:600; color:#9E9E9E; background:none; border:none;
              cursor:pointer; position:relative; transition:color .15s; border-bottom:2px solid transparent; margin-bottom:-2px; }
    .kw-tab:hover { color:#424242; }
    .kw-tab.active { color:#00A3FF; border-bottom-color:#00A3FF; }
    .kw-tab .tab-count { font-weight:400; font-size:11px; margin-left:4px; color:#BDBDBD; }
    .kw-tab.active .tab-count { color:#00A3FF; }

    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    .data-table { font-size:12px; table-layout:fixed; width:100%; }
    .data-table th, .data-table td { padding:10px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }

    .toggle-switch { position:relative; width:36px; height:20px; display:inline-block; vertical-align:middle; }
    .toggle-switch input { opacity:0; width:0; height:0; }
    .toggle-slider { position:absolute; inset:0; background:#ccc; border-radius:10px; cursor:pointer; transition:.2s; }
    .toggle-slider::before { content:''; position:absolute; width:16px; height:16px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s; }
    .toggle-switch input:checked + .toggle-slider { background:#00A3FF; }
    .toggle-switch input:checked + .toggle-slider::before { transform:translateX(16px); }

    .action-btn { background:none; border:none; cursor:pointer; padding:4px; border-radius:4px; color:#757575; transition:all .15s; }
    .action-btn:hover { background:#F5F5F5; color:#212121; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="margin-bottom:20px;">
      <h1 style="font-size:20px;font-weight:700;margin:0;">키워드 관리</h1>
      <p style="font-size:12px;color:#757575;margin:4px 0 0;">모니터링·제외·이슈 키워드 등록 및 관리</p>
    </div>

    <div class="content-card">
      <div class="content-card-header" style="padding-bottom:0;">
        <div class="kw-tabs">
          <button class="kw-tab active" data-tab="monitor" onclick="switchTab('monitor')">모니터링 키워드<span class="tab-count" id="monitor-tab-count"></span></button>
          <button class="kw-tab" data-tab="exclude" onclick="switchTab('exclude')">제외 키워드<span class="tab-count" id="exclude-tab-count"></span></button>
          <button class="kw-tab" data-tab="issue" onclick="switchTab('issue')">이슈 키워드<span class="tab-count" id="issue-tab-count"></span></button>
        </div>
      </div>

      <div class="content-card-body" style="padding:0;">
        <!-- 모니터링 키워드 -->
        <div class="tab-panel active" id="panel-monitor">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;">
            <span style="font-size:12px;color:#757575;" id="monitor-count"></span>
            <button class="btn btn-primary btn-sm" onclick="openModal('monitor')">+ 추가</button>
          </div>
          <table class="data-table">
            <colgroup>
              <col style="width:7%;"><col style="width:18%;"><col style="width:28%;">
              <col style="width:15%;"><col style="width:10%;"><col style="width:14%;">
            </colgroup>
            <thead><tr><th>No</th><th>키워드</th><th>키워드 설명</th><th>상담 유형</th><th>상태</th><th>관리</th></tr></thead>
            <tbody id="monitor-tbody"></tbody>
          </table>
        </div>

        <!-- 제외 키워드 -->
        <div class="tab-panel" id="panel-exclude">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;">
            <span style="font-size:12px;color:#757575;" id="exclude-count"></span>
            <button class="btn btn-primary btn-sm" onclick="openModal('exclude')">+ 추가</button>
          </div>
          <table class="data-table">
            <colgroup>
              <col style="width:7%;"><col style="width:18%;"><col style="width:28%;">
              <col style="width:15%;"><col style="width:10%;"><col style="width:14%;">
            </colgroup>
            <thead><tr><th>No</th><th>키워드</th><th>키워드 설명</th><th>상담 유형</th><th>상태</th><th>관리</th></tr></thead>
            <tbody id="exclude-tbody"></tbody>
          </table>
        </div>

        <!-- 이슈 키워드 -->
        <div class="tab-panel" id="panel-issue">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;">
            <span style="font-size:12px;color:#757575;" id="issue-count"></span>
            <button class="btn btn-primary btn-sm" onclick="openModal('issue')">+ 추가</button>
          </div>
          <table class="data-table">
            <colgroup>
              <col style="width:7%;"><col style="width:18%;"><col style="width:28%;">
              <col style="width:15%;"><col style="width:10%;"><col style="width:14%;">
            </colgroup>
            <thead><tr><th>No</th><th>키워드</th><th>키워드 설명</th><th>상담 유형</th><th>상태</th><th>관리</th></tr></thead>
            <tbody id="issue-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../assets/dummy-data/all-data.js"></script>
  <script src="../../../js/utils/data-loader.js"></script>
  <script src="../../../js/utils/auth-simulator.js"></script>
  <script src="../../../js/utils/formatters.js"></script>
  <script src="../../../js/components/sidebar.js"></script>
  <script src="../../../js/components/layout.js"></script>
  <script src="../../../js/components/modal.js"></script>
  <script src="../../../js/components/toast.js"></script>
  <script>
    /* ========== 더미 데이터 ========== */
    const kwData = {
      monitor: [
        { no:1,  keyword:'해지',           description:'해지 의사 표현',               callType:'전체', active:true },
        { no:2,  keyword:'위약금',          description:'위약금 관련 문의',              callType:'전체', active:true },
        { no:3,  keyword:'환불',           description:'환불 요청/문의',               callType:'전체', active:true },
        { no:4,  keyword:'보상',           description:'보상 요구/문의',               callType:'전체', active:true },
        { no:5,  keyword:'불만',           description:'서비스 불만 표현',              callType:'전체', active:true },
        { no:6,  keyword:'상담사 연결',      description:'상위 상담사 연결 요청',          callType:'전체', active:true },
        { no:7,  keyword:'약정',           description:'약정 기간/조건 문의',            callType:'전체', active:true },
        { no:8,  keyword:'요금제 변경',      description:'요금제 변경 요청',              callType:'I/B',  active:true },
        { no:9,  keyword:'배송 지연',       description:'배송 지연 클레임',              callType:'I/B',  active:true },
        { no:10, keyword:'교환',           description:'상품 교환 요청',               callType:'전체', active:true },
        { no:11, keyword:'반품',           description:'상품 반품 요청',               callType:'전체', active:true },
        { no:12, keyword:'A/S',           description:'제품 수리/A/S 접수',           callType:'I/B',  active:true },
        { no:13, keyword:'장애',           description:'서비스 장애 신고',              callType:'I/B',  active:true },
        { no:14, keyword:'미납',           description:'미납 요금 관련',               callType:'전체', active:true },
        { no:15, keyword:'포인트',          description:'포인트 적립/사용 문의',          callType:'전체', active:true },
        { no:16, keyword:'업그레이드',       description:'서비스/상품 업그레이드 문의',      callType:'O/B',  active:true },
        { no:17, keyword:'프로모션',         description:'프로모션/이벤트 안내',           callType:'O/B',  active:false },
        { no:18, keyword:'재가입',          description:'재가입/복원 문의',              callType:'전체', active:false }
      ],
      exclude: [
        { no:1,  keyword:'네',            description:'응답 추임새',                  callType:'전체', active:true },
        { no:2,  keyword:'예',            description:'응답 추임새',                  callType:'전체', active:true },
        { no:3,  keyword:'아',            description:'감탄사/필러',                  callType:'전체', active:true },
        { no:4,  keyword:'음',            description:'감탄사/필러',                  callType:'전체', active:true },
        { no:5,  keyword:'어',            description:'감탄사/필러',                  callType:'전체', active:true },
        { no:6,  keyword:'감사합니다',      description:'일반 인사말',                  callType:'전체', active:true },
        { no:7,  keyword:'안녕하세요',      description:'일반 인사말',                  callType:'전체', active:true },
        { no:8,  keyword:'여보세요',       description:'통화 시작 인사',                callType:'전체', active:true },
        { no:9,  keyword:'잠시만요',       description:'대기 요청 표현',                callType:'전체', active:true },
        { no:10, keyword:'알겠습니다',      description:'동의/확인 표현',                callType:'전체', active:true },
        { no:11, keyword:'그렇군요',       description:'동의/확인 표현',                callType:'전체', active:true },
        { no:12, keyword:'좋은 하루 되세요', description:'종료 인사',                    callType:'전체', active:true },
        { no:13, keyword:'수고하세요',      description:'종료 인사',                    callType:'전체', active:true },
        { no:14, keyword:'확인해 보겠습니다', description:'처리 진행 표현',                callType:'전체', active:true },
        { no:15, keyword:'말씀하세요',      description:'통화 시작 유도',                callType:'전체', active:true },
        { no:16, keyword:'그러니까',       description:'접속사/필러',                   callType:'전체', active:false },
        { no:17, keyword:'그래서',         description:'접속사/필러',                   callType:'전체', active:false }
      ],
      issue: [
        { no:1,  keyword:'고소',           description:'법적 조치 언급',               callType:'전체', active:true },
        { no:2,  keyword:'소송',           description:'법적 조치 언급',               callType:'전체', active:true },
        { no:3,  keyword:'변호사',         description:'법적 조치 언급',               callType:'전체', active:true },
        { no:4,  keyword:'소비자원',        description:'외부 기관 신고 언급',            callType:'전체', active:true },
        { no:5,  keyword:'감독기관',        description:'외부 기관 신고 언급',            callType:'전체', active:true },
        { no:6,  keyword:'방통위',         description:'외부 기관 신고 언급',            callType:'전체', active:true },
        { no:7,  keyword:'공정위',         description:'외부 기관 신고 언급',            callType:'전체', active:true },
        { no:8,  keyword:'녹취',           description:'녹취/녹음 요구',               callType:'전체', active:true },
        { no:9,  keyword:'녹음하고 있다',    description:'녹취/녹음 요구',               callType:'전체', active:true },
        { no:10, keyword:'상급자',         description:'에스컬레이션 요청',              callType:'전체', active:true },
        { no:11, keyword:'책임자',         description:'에스컬레이션 요청',              callType:'전체', active:true },
        { no:12, keyword:'팀장',           description:'에스컬레이션 요청',              callType:'전체', active:true },
        { no:13, keyword:'사장',           description:'에스컬레이션 요청',              callType:'전체', active:true },
        { no:14, keyword:'언론',           description:'미디어 노출 위협',              callType:'전체', active:true },
        { no:15, keyword:'기자',           description:'미디어 노출 위협',              callType:'전체', active:true },
        { no:16, keyword:'SNS에 올리겠다',  description:'소셜미디어 노출 위협',            callType:'전체', active:true },
        { no:17, keyword:'오배송',         description:'물류 이슈',                    callType:'I/B',  active:true },
        { no:18, keyword:'수량부족',        description:'물류 이슈',                    callType:'I/B',  active:true },
        { no:19, keyword:'사기',           description:'신뢰 손상 표현',               callType:'전체', active:false },
        { no:20, keyword:'신고',           description:'외부 기관 신고 언급',            callType:'전체', active:false }
      ]
    };

    const tabLabels = { monitor:'모니터링 키워드', exclude:'제외 키워드', issue:'이슈 키워드' };
    let currentTab = 'monitor';

    /* ========== 탭 전환 ========== */
    function switchTab(type) {
      currentTab = type;
      document.querySelectorAll('.kw-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === type));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `panel-${type}`));
    }

    /* ========== 테이블 렌더링 ========== */
    function renderTable(type) {
      const data = [...kwData[type]].sort((a, b) => b.no - a.no);
      const tbody = document.getElementById(`${type}-tbody`);
      const countEl = document.getElementById(`${type}-count`);
      const tabCountEl = document.getElementById(`${type}-tab-count`);
      const activeCount = data.filter(d => d.active).length;

      countEl.textContent = `${activeCount} / ${data.length}건 활성`;
      tabCountEl.textContent = `(${data.length})`;

      tbody.innerHTML = data.map(d => `
        <tr>
          <td>${d.no}</td>
          <td style="font-weight:500;">${d.keyword}</td>
          <td>${d.description}</td>
          <td>${d.callType}</td>
          <td>
            <label class="toggle-switch">
              <input type="checkbox" ${d.active ? 'checked' : ''} onchange="toggleActive('${type}',${d.no})">
              <span class="toggle-slider"></span>
            </label>
          </td>
          <td>
            <div style="display:flex;gap:8px;justify-content:center;">
              <button class="action-btn" onclick="openEditModal('${type}',${d.no})" title="수정">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
              </button>
              <button class="action-btn" onclick="deleteRule('${type}',${d.no})" title="삭제">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    /* ========== 상태 토글 ========== */
    function toggleActive(type, no) {
      const item = kwData[type].find(d => d.no === no);
      if (item) {
        item.active = !item.active;
        renderTable(type);
        AICC_Toast.show(`"${item.keyword}" ${item.active ? '활성화' : '비활성화'}되었습니다.`);
      }
    }

    /* ========== 삭제 ========== */
    function deleteRule(type, no) {
      const data = kwData[type];
      const idx = data.findIndex(d => d.no === no);
      if (idx === -1) return;
      const kw = data[idx].keyword;
      data.splice(idx, 1);
      renderTable(type);
      AICC_Toast.show(`"${kw}" 키워드가 삭제되었습니다.`);
    }

    /* ========== 추가/수정 모달 ========== */
    function openModal(type) {
      AICC_Modal.open({
        title: `${tabLabels[type]} 추가`,
        content: buildModalContent(type, null),
        footer: `
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
          <button class="btn btn-primary" onclick="saveRule('${type}', null)">저장</button>
        `,
        size: 'md'
      });
    }

    function openEditModal(type, no) {
      const item = kwData[type].find(d => d.no === no);
      if (!item) return;
      AICC_Modal.open({
        title: `${tabLabels[type]} 수정`,
        content: buildModalContent(type, item),
        footer: `
          <button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
          <button class="btn btn-primary" onclick="saveRule('${type}', ${no})">저장</button>
        `,
        size: 'md'
      });
    }

    function buildModalContent(type, item) {
      const kwVal = item ? item.keyword : '';
      const descVal = item ? item.description : '';
      const callTypeVal = item ? item.callType : '전체';

      const placeholders = {
        monitor: { kw:'예: 해지, 위약금, 환불', desc:'예: 해지 의사 표현, 환불 요청' },
        exclude: { kw:'예: 네, 감사합니다, 여보세요', desc:'예: 응답 추임새, 일반 인사말' },
        issue:   { kw:'예: 고소, 소비자원, 상급자', desc:'예: 법적 조치 언급, 에스컬레이션 요청' }
      };
      const ph = placeholders[type];

      return `
        <div style="display:flex;flex-direction:column;gap:20px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div>
              <label class="form-label">키워드 (STT 감지 문구)</label>
              <input type="text" class="form-input" id="modal-keyword" value="${kwVal}" placeholder="${ph.kw}" style="width:100%;box-sizing:border-box;">
            </div>
            <div>
              <label class="form-label">적용 상담 유형</label>
              <select class="form-select" id="modal-calltype" style="width:100%;box-sizing:border-box;">
                <option value="전체" ${callTypeVal==='전체'?'selected':''}>전체</option>
                <option value="I/B" ${callTypeVal==='I/B'?'selected':''}>I/B (인바운드)</option>
                <option value="O/B" ${callTypeVal==='O/B'?'selected':''}>O/B (아웃바운드)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="form-label">키워드 설명</label>
            <input type="text" class="form-input" id="modal-desc" value="${descVal}" placeholder="${ph.desc}" style="width:100%;box-sizing:border-box;">
          </div>
        </div>
      `;
    }

    function saveRule(type, editNo) {
      const keyword = document.getElementById('modal-keyword').value.trim();
      const description = document.getElementById('modal-desc').value.trim();
      const callType = document.getElementById('modal-calltype').value;

      if (!keyword) {
        AICC_Toast.show('키워드를 입력해 주세요.');
        return;
      }

      const data = kwData[type];

      if (editNo) {
        const item = data.find(d => d.no === editNo);
        if (item) {
          item.keyword = keyword;
          item.description = description;
          item.callType = callType;
        }
        AICC_Toast.show(`"${keyword}" 키워드가 수정되었습니다.`);
      } else {
        const maxNo = data.length > 0 ? Math.max(...data.map(d => d.no)) : 0;
        data.push({ no: maxNo + 1, keyword, description, callType, active: true });
        AICC_Toast.show(`"${keyword}" 키워드가 추가되었습니다.`);
      }

      AICC_Modal.close();
      renderTable(type);
    }

    /* ========== 초기화 ========== */
    document.addEventListener('DOMContentLoaded', () => {
      ['monitor','exclude','issue'].forEach(t => renderTable(t));
    });
  </script>
</body>
</html>
