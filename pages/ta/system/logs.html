<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 로그 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">시스템 로그</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">분석 처리 및 다운로드 이력</p>
      </div>
    </div>

    <div class="content-card">
      <div class="content-card-body" style="padding:0;">
        <div style="display:flex;align-items:center;padding:0 16px;border-bottom:2px solid #E0E0E0;">
          <div class="tab-nav" style="border-bottom:none;">
            <div class="tab-item active" onclick="switchTab('analysis')">분석 로그</div>
            <div class="tab-item" onclick="switchTab('download')">다운로드 이력</div>
          </div>
        </div>

        <!-- 분석 로그 -->
        <div id="tab-analysis" style="padding:20px;">
          <div style="display:flex;gap:12px;margin-bottom:16px;align-items:flex-end;">
            <div>
              <label class="form-label">기간</label>
              <div id="period-picker"></div>
            </div>
            <div>
              <label class="form-label">상태</label>
              <select class="form-select" id="log-status-filter">
                <option value="">전체</option>
                <option value="완료">완료</option>
                <option value="처리중">처리중</option>
                <option value="실패">실패</option>
              </select>
            </div>
            <button class="btn btn-primary btn-sm" onclick="AICC_Toast.show('필터가 적용되었습니다.')">검색</button>
          </div>

          <!-- 요약 KPI -->
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;">
            <div class="kpi-card" style="background:#F0F7FF;border-color:#BBDEFB;">
              <div style="font-size:12px;color:#1565C0;margin-bottom:8px;">전체 실행</div>
              <div style="display:flex;align-items:baseline;gap:8px;">
                <span style="font-size:24px;font-weight:700;color:#1565C0;">48</span>
                <span style="font-size:14px;color:#757575;">건</span>
              </div>
            </div>
            <div class="kpi-card" style="background:#F1F8E9;border-color:#C8E6C9;">
              <div style="font-size:12px;color:#2E7D32;margin-bottom:8px;">완료</div>
              <div style="display:flex;align-items:baseline;gap:8px;">
                <span style="font-size:24px;font-weight:700;color:#2E7D32;">45</span>
                <span style="font-size:14px;color:#757575;">건</span>
              </div>
            </div>
            <div class="kpi-card" style="background:#FFF3F3;border-color:#FFCDD2;">
              <div style="font-size:12px;color:#C62828;margin-bottom:8px;">실패</div>
              <div style="display:flex;align-items:baseline;gap:8px;">
                <span style="font-size:24px;font-weight:700;color:#C62828;">3</span>
                <span style="font-size:14px;color:#757575;">건</span>
              </div>
            </div>
          </div>

          <table class="data-table">
            <thead>
              <tr><th>No</th><th>실행일시</th><th>대상기간</th><th>상태</th><th>처리건수</th><th>소요시간</th><th>실행자</th></tr>
            </thead>
            <tbody id="analysis-tbody"></tbody>
          </table>
        </div>

        <!-- 다운로드 이력 -->
        <div id="tab-download" style="display:none;padding:20px;">
          <div style="display:flex;gap:12px;margin-bottom:16px;align-items:flex-end;">
            <div>
              <label class="form-label">기간</label>
              <div id="dl-period-picker"></div>
            </div>
            <div>
              <label class="form-label">요청자 검색</label>
              <input type="text" class="form-input" placeholder="요청자 이름 입력" style="min-width:140px;">
            </div>
            <button class="btn btn-primary btn-sm" onclick="AICC_Toast.show('필터가 적용되었습니다.')">검색</button>
          </div>
          <table class="data-table">
            <thead>
              <tr><th>No</th><th>다운로드일시</th><th>파일명</th><th>파일크기</th><th>요청자</th><th>상태</th></tr>
            </thead>
            <tbody id="download-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../../../assets/dummy-data/all-data.js"></script>
  <script src="../../../js/utils/data-loader.js"></script>
  <script src="../../../js/utils/auth-simulator.js"></script>
  <script src="../../../js/utils/formatters.js"></script>
  <script src="../../../js/components/sidebar.js"></script>
  <script src="../../../js/components/layout.js"></script>
  <script src="../../../js/components/modal.js"></script>
  <script src="../../../js/components/toast.js"></script>
  <script src="../../../js/components/period-picker.js"></script>
  <script>
    const analysisLogs = [
      { no:1, execTime:'2025-01-27 02:00:05', period:'2025-01-26', status:'완료', count:1842, duration:'3분 22초', executor:'스케줄러' },
      { no:2, execTime:'2025-01-26 02:00:03', period:'2025-01-25', status:'완료', count:1765, duration:'3분 10초', executor:'스케줄러' },
      { no:3, execTime:'2025-01-25 02:00:08', period:'2025-01-24', status:'완료', count:1920, duration:'3분 45초', executor:'스케줄러' },
      { no:4, execTime:'2025-01-24 02:00:04', period:'2025-01-23', status:'완료', count:1688, duration:'3분 05초', executor:'스케줄러' },
      { no:5, execTime:'2025-01-23 02:01:12', period:'2025-01-22', status:'실패', count:0, duration:'00초', executor:'스케줄러' },
      { no:6, execTime:'2025-01-23 09:15:32', period:'2025-01-22', status:'완료', count:1744, duration:'3분 18초', executor:'관리자' },
      { no:7, execTime:'2025-01-22 02:00:06', period:'2025-01-21', status:'완료', count:1801, duration:'3분 28초', executor:'스케줄러' },
      { no:8, execTime:'2025-01-21 02:00:04', period:'2025-01-20', status:'처리중', count:0, duration:'-', executor:'스케줄러' },
      { no:9, execTime:'2025-01-20 02:00:07', period:'2025-01-19', status:'완료', count:1560, duration:'2분 58초', executor:'스케줄러' },
      { no:10, execTime:'2025-01-19 14:30:22', period:'2025-01-01 ~ 2025-01-18', status:'완료', count:28450, duration:'18분 42초', executor:'홍길동' }
    ];

    const downloadLogs = [
      { no:1, dlTime:'2025-01-27 16:42:11', filename:'ta_report_20250127.xlsx', size:'2.4 MB', requester:'홍길동', status:'완료' },
      { no:2, dlTime:'2025-01-27 15:18:33', filename:'keyword_analysis_202501.xlsx', size:'1.8 MB', requester:'김철수', status:'완료' },
      { no:3, dlTime:'2025-01-27 14:05:22', filename:'call_detail_20250127.csv', size:'4.1 MB', requester:'이영희', status:'완료' },
      { no:4, dlTime:'2025-01-26 17:02:45', filename:'issue_report_202501.xlsx', size:'0.9 MB', requester:'관리자', status:'완료' },
      { no:5, dlTime:'2025-01-26 11:33:17', filename:'type_analysis_20250126.xlsx', size:'1.5 MB', requester:'홍길동', status:'완료' },
      { no:6, dlTime:'2025-01-25 09:15:08', filename:'ta_monthly_202412.xlsx', size:'3.2 MB', requester:'관리자', status:'완료' },
      { no:7, dlTime:'2025-01-24 16:22:55', filename:'agent_performance_202501.xlsx', size:'2.1 MB', requester:'박상현', status:'실패' }
    ];

    const statusBadgeMap = { '완료': 'badge-completed', '처리중': 'badge-pending', '실패': 'badge-rejected' };

    function statusBadge(status) {
      return `<span class="badge ${statusBadgeMap[status] || 'badge-inactive'}">${status}</span>`;
    }

    function switchTab(tab) {
      ['analysis','download'].forEach(t => {
        document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
      });
      document.querySelectorAll('.tab-item').forEach((el, i) => {
        const tabs = ['analysis','download'];
        el.classList.toggle('active', tabs[i] === tab);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('analysis-tbody').innerHTML = analysisLogs.map(l => `
        <tr onclick="AICC_Toast.show('No.${l.no} 분석 로그 상세')">
          <td>${l.no}</td>
          <td style="font-size:12px;color:#757575;">${l.execTime}</td>
          <td style="font-size:12px;">${l.period}</td>
          <td>${statusBadge(l.status)}</td>
          <td style="font-weight:500;">${l.count > 0 ? AICC_Fmt.number(l.count) + '건' : '-'}</td>
          <td style="font-size:12px;color:#757575;">${l.duration}</td>
          <td style="font-size:12px;color:#757575;">${l.executor}</td>
        </tr>
      `).join('');

      document.getElementById('download-tbody').innerHTML = downloadLogs.map(l => `
        <tr onclick="AICC_Toast.show('${l.filename} 다운로드 정보')">
          <td>${l.no}</td>
          <td style="font-size:12px;color:#757575;">${l.dlTime}</td>
          <td style="font-weight:500;color:#00A3FF;cursor:pointer;">${l.filename}</td>
          <td style="font-size:12px;color:#757575;">${l.size}</td>
          <td style="font-size:12px;">${l.requester}</td>
          <td>${statusBadge(l.status)}</td>
        </tr>
      `).join('');

      if (typeof AICC_PeriodPicker !== 'undefined') {
        AICC_PeriodPicker.create('period-picker', { mode: 'monthly' });
        AICC_PeriodPicker.create('dl-period-picker', { mode: 'monthly' });
      }
    });
  </script>
</body>
</html>
