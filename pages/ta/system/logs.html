<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>시스템 로그 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">시스템 로그</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">시스템 활동 기록 조회 (읽기 전용)</p>
      </div>
    </div>

    <!-- 필터 -->
    <div class="filter-section">
      <div class="filter-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none'">
        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">기간</label>
          <div id="period-picker-container"></div>
        </div>
        <div>
          <label class="form-label">사용자</label>
          <input type="text" class="form-input" id="f-user" placeholder="사용자명 검색" style="min-width:120px;">
        </div>
        <div>
          <label class="form-label">액션 유형</label>
          <select class="form-select" id="f-action" onchange="filterLogs()">
            <option value="all">전체</option>
            <option value="키워드 관리">키워드 관리</option>
            <option value="분석 기준 관리">분석 기준 관리</option>
            <option value="이슈 처리">이슈 처리</option>
            <option value="리포트 생성">리포트 생성</option>
            <option value="리포트 다운로드">리포트 다운로드</option>
            <option value="데이터 내보내기">데이터 내보내기</option>
          </select>
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="filterLogs()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">로그 목록</span>
        <span style="font-size:12px;color:#757575;" id="total-count">총 0건</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <colgroup>
            <col style="width:5%;">
            <col style="width:15%;">
            <col style="width:10%;">
            <col style="width:12%;">
            <col style="width:58%;">
          </colgroup>
          <thead>
            <tr>
              <th>No</th>
              <th>일시</th>
              <th>사용자</th>
              <th>액션</th>
              <th class="col-left">상세 내용</th>
            </tr>
          </thead>
          <tbody id="log-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../../assets/dummy-data/all-data.js"></script>
  <script src="../../../js/utils/data-loader.js"></script>
  <script src="../../../js/utils/auth-simulator.js"></script>
  <script src="../../../js/utils/formatters.js"></script>
  <script src="../../../js/components/sidebar.js"></script>
  <script src="../../../js/components/layout.js"></script>
  <script src="../../../js/components/modal.js"></script>
  <script src="../../../js/components/toast.js"></script>
  <script src="../../../js/components/period-picker.js"></script>
  <script>
    const logs = [
      { no: 1,  datetime: '2025-03-28 16:42:15', user: '박관리자', action: '리포트 다운로드', detail: '월간 리포트 PDF 다운로드 (2025-03-01 ~ 2025-03-31)', fullDetail: '월간 리포트를 PDF 형식으로 다운로드하였습니다.\n리포트 기간: 2025-03-01 ~ 2025-03-31\n범위: 전체 센터\n파일명: TA_월간리포트_202503.pdf' },
      { no: 2,  datetime: '2025-03-28 16:35:50', user: '박관리자', action: '리포트 생성',   detail: '월간 리포트 생성 (2025-03-01 ~ 2025-03-31)', fullDetail: '월간 리포트를 생성하였습니다.\n리포트 기간: 2025-03-01 ~ 2025-03-31\n범위: 전체 센터\n포함 섹션: 전체 18개 항목 선택' },
      { no: 3,  datetime: '2025-03-28 15:10:33', user: '김센터장', action: '이슈 처리',     detail: 'TA-2025-00047 이슈 상태 "처리완료"로 변경', fullDetail: '이슈 처리 관리에서 콜 ID TA-2025-00047의 상태를 "검토 필요"에서 "처리완료"로 변경하였습니다.\n처리 메모: 고객에게 보상안 안내 완료, 재문의 시 VIP 라인 안내 예정.' },
      { no: 4,  datetime: '2025-03-28 14:22:08', user: '이팀장',   action: '데이터 내보내기', detail: '전체 콜 현황 Excel 내보내기 (325건)', fullDetail: '전체 콜 현황 데이터를 Excel 형식으로 내보냈습니다.\n내보내기 건수: 325건\n필터 조건: 2025-03-01 ~ 2025-03-28, 전체 센터\n파일명: TA_콜현황_20250328.xlsx' },
      { no: 5,  datetime: '2025-03-28 11:05:44', user: '박관리자', action: '키워드 관리',   detail: '모니터링 키워드 "환불요청" 추가', fullDetail: '키워드 관리 > 모니터링 키워드에 새 키워드를 추가하였습니다.\n키워드: 환불요청\n키워드 설명: 고객이 환불을 요청하는 상담 건 모니터링\n상담 유형: 고객불만 > 환불/반품\n상태: 활성' },
      { no: 6,  datetime: '2025-03-27 17:30:22', user: '김센터장', action: '이슈 처리',     detail: 'TA-2025-00045 이슈 상태 "검토 필요"로 변경', fullDetail: '이슈 처리 관리에서 콜 ID TA-2025-00045의 상태를 "미처리"에서 "검토 필요"로 변경하였습니다.\n처리 메모: 해당 건 확인 중, 상담사 추가 면담 필요.' },
      { no: 7,  datetime: '2025-03-27 15:48:10', user: '이팀장',   action: '분석 기준 관리', detail: '묵음 기준 "0분 3초"로 변경 (기존: 0분 5초)', fullDetail: '분석 기준 관리 > 묵음 기준을 변경하였습니다.\n변경 전: 0분 5초\n변경 후: 0분 3초\n사유: 짧은 묵음도 감지하여 분석 정확도 향상' },
      { no: 8,  datetime: '2025-03-27 14:15:30', user: '박관리자', action: '키워드 관리',   detail: '이슈 키워드 "오배송" 상태 비활성화', fullDetail: '키워드 관리 > 이슈 키워드에서 키워드 상태를 변경하였습니다.\n키워드: 오배송\n변경: 활성 → 비활성\n사유: 물류 시스템 개선으로 오배송 이슈 감소' },
      { no: 9,  datetime: '2025-03-27 10:20:55', user: '김센터장', action: '리포트 생성',   detail: '주간 리포트 생성 (2025-03-17 ~ 2025-03-23)', fullDetail: '주간 리포트를 생성하였습니다.\n리포트 기간: 2025-03-17 ~ 2025-03-23\n범위: 서울센터\n포함 섹션: KPI 요약, 콜 건수 추이, 키워드 Top 20 외 12개 항목' },
      { no: 10, datetime: '2025-03-26 16:55:40', user: '이팀장',   action: '데이터 내보내기', detail: '상담유형별 건수 Excel 내보내기 (17건)', fullDetail: '상담유형별 건수 데이터를 Excel 형식으로 내보냈습니다.\n내보내기 건수: 17건 (상담유형 카테고리)\n필터 조건: 2025-03-01 ~ 2025-03-26\n파일명: TA_상담유형_20250326.xlsx' },
      { no: 11, datetime: '2025-03-26 14:30:18', user: '박관리자', action: '분석 기준 관리', detail: '분석 제외 전화번호 "02-1234-5678" 추가', fullDetail: '분석 기준 관리 > 분석 제외콜 기준에 전화번호를 추가하였습니다.\n전화번호: 02-1234-5678\n사유: 내부 테스트용 전화번호\n상태: 활성' },
      { no: 12, datetime: '2025-03-26 11:10:05', user: '김센터장', action: '이슈 처리',     detail: 'TA-2025-00041 이슈 상태 "처리완료"로 변경', fullDetail: '이슈 처리 관리에서 콜 ID TA-2025-00041의 상태를 "미처리"에서 "처리완료"로 변경하였습니다.\n처리 메모: 상담사 교육 완료, 재발 방지 조치 실시.' },
      { no: 13, datetime: '2025-03-25 17:05:33', user: '이팀장',   action: '키워드 관리',   detail: '제외 키워드 "테스트" 추가', fullDetail: '키워드 관리 > 제외 키워드에 새 키워드를 추가하였습니다.\n키워드: 테스트\n키워드 설명: 내부 테스트 통화에서 자주 사용되는 단어\n상담 유형: 전체\n상태: 활성' },
      { no: 14, datetime: '2025-03-25 14:40:28', user: '박관리자', action: '리포트 다운로드', detail: '일간 리포트 PDF 다운로드 (2025-03-24)', fullDetail: '일간 리포트를 PDF 형식으로 다운로드하였습니다.\n리포트 기간: 2025-03-24\n범위: 전체 센터\n파일명: TA_일간리포트_20250324.pdf' },
      { no: 15, datetime: '2025-03-25 10:15:50', user: '김센터장', action: '분석 기준 관리', detail: '재인입콜 기준 "5일 내"로 변경 (기존: 7일 내)', fullDetail: '분석 기준 관리 > 재인입콜 기준을 변경하였습니다.\n변경 전: 7일 내\n변경 후: 5일 내\n사유: 재인입 판단 기준을 단축하여 더 엄격하게 관리' },
      { no: 16, datetime: '2025-03-24 16:20:15', user: '이팀장',   action: '이슈 처리',     detail: 'TA-2025-00038 이슈 상태 "이슈 없음"으로 변경', fullDetail: '이슈 처리 관리에서 콜 ID TA-2025-00038의 상태를 "미처리"에서 "이슈 없음"으로 변경하였습니다.\n처리 메모: 확인 결과 정상 상담 건으로 판단됨.' },
      { no: 17, datetime: '2025-03-24 13:50:42', user: '박관리자', action: '키워드 관리',   detail: '모니터링 키워드 "배송지연" 설명 수정', fullDetail: '키워드 관리 > 모니터링 키워드의 키워드 설명을 수정하였습니다.\n키워드: 배송지연\n변경 전: 배송 지연 관련 상담\n변경 후: 택배 배송 3일 이상 지연 건 모니터링\n상담 유형: 변경 없음' },
      { no: 18, datetime: '2025-03-24 09:30:20', user: '김센터장', action: '데이터 내보내기', detail: '이슈 처리 현황 Excel 내보내기 (48건)', fullDetail: '이슈 처리 관리 데이터를 Excel 형식으로 내보냈습니다.\n내보내기 건수: 48건\n필터 조건: 2025-03-01 ~ 2025-03-24, 상태: 전체\n파일명: TA_이슈현황_20250324.xlsx' }
    ];

    const ACTION_COLORS = {
      '키워드 관리':   { bg: '#E3F2FD', color: '#1565C0', border: '#BBDEFB' },
      '분석 기준 관리': { bg: '#FFF3E0', color: '#E65100', border: '#FFE0B2' },
      '이슈 처리':     { bg: '#E8F5E9', color: '#2E7D32', border: '#C8E6C9' },
      '리포트 생성':   { bg: '#F3E5F5', color: '#7B1FA2', border: '#E1BEE7' },
      '리포트 다운로드': { bg: '#E0F7FA', color: '#00695C', border: '#B2DFDB' },
      '데이터 내보내기': { bg: '#FFF8E1', color: '#F57F17', border: '#FFF9C4' }
    };

    function getActionBadge(action) {
      const s = ACTION_COLORS[action] || { bg: '#F5F5F5', color: '#757575', border: '#E0E0E0' };
      return `<span class="badge" style="background:${s.bg};color:${s.color};border:1px solid ${s.border};">${action}</span>`;
    }

    function renderTable(data) {
      document.getElementById('total-count').textContent = `총 ${data.length}건`;
      document.getElementById('log-tbody').innerHTML = data.map(l => `
        <tr onclick="openDetail(${l.no})">
          <td>${l.no}</td>
          <td style="font-size:12px;color:#757575;white-space:nowrap;">${l.datetime}</td>
          <td style="font-weight:500;">${l.user}</td>
          <td>${getActionBadge(l.action)}</td>
          <td class="text-truncate col-left" style="max-width:0;">${l.detail}</td>
        </tr>
      `).join('');
    }

    function filterLogs() {
      const userVal = (document.getElementById('f-user').value || '').trim().toLowerCase();
      const actionVal = document.getElementById('f-action').value;

      let filtered = logs;
      if (userVal) filtered = filtered.filter(l => l.user.toLowerCase().includes(userVal));
      if (actionVal !== 'all') filtered = filtered.filter(l => l.action === actionVal);
      renderTable(filtered);
    }

    function resetFilter() {
      document.getElementById('f-user').value = '';
      document.getElementById('f-action').value = 'all';
      renderTable(logs);
    }

    function openDetail(no) {
      const l = logs.find(x => x.no === no);
      if (!l) return;

      AICC_Modal.open({
        title: `로그 상세 - #${l.no}`,
        size: 'sm',
        content: `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;">
            <div>
              <div class="form-label">일시</div>
              <div style="font-size:13px;">${l.datetime}</div>
            </div>
            <div>
              <div class="form-label">사용자</div>
              <div style="font-size:13px;font-weight:500;">${l.user}</div>
            </div>
            <div>
              <div class="form-label">액션 유형</div>
              <div>${getActionBadge(l.action)}</div>
            </div>
          </div>
          <div style="border-top:1px solid #E0E0E0;padding-top:16px;">
            <div class="form-label" style="margin-bottom:8px;">상세 내용</div>
            <div style="background:#F9F9F9;border:1px solid #E0E0E0;border-radius:6px;padding:14px;font-size:13px;line-height:1.7;color:#424242;white-space:pre-line;">
              ${l.fullDetail}
            </div>
          </div>
        `,
        footer: `<button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>`
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function() { filterLogs(); }
      });
      renderTable(logs);
    });
  </script>
</body>
</html>
