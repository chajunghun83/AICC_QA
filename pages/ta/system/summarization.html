<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>요약문구 관리 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../../css/styles.css">
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">요약문구 관리</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">분석 결과 요약 문구 설정</p>
      </div>
    </div>

    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">요약 문구 목록</span>
        <span style="font-size:12px;color:#757575;margin-left:8px;">행 클릭 시 수정 가능</span>
      </div>
      <div class="content-card-body" style="padding:0;">
        <table class="data-table">
          <thead>
            <tr>
              <th>No</th>
              <th>메뉴명</th>
              <th>요약 문구</th>
              <th>표시 지표</th>
              <th>수정일</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="summary-tbody"></tbody>
        </table>
      </div>
    </div>

    <div style="margin-top:16px;padding:16px 20px;background:#FFF8E1;border-radius:8px;border:1px solid #FFE082;">
      <div style="font-size:13px;font-weight:600;color:#F57F17;margin-bottom:4px;">사용 가이드</div>
      <div style="font-size:12px;color:#795548;line-height:1.6;">
        요약 문구에는 다음 변수를 사용할 수 있습니다:<br>
        <code style="background:#FFF3E0;padding:1px 5px;border-radius:3px;">{{total}}</code> 전체 건수,
        <code style="background:#FFF3E0;padding:1px 5px;border-radius:3px;">{{period}}</code> 분석기간,
        <code style="background:#FFF3E0;padding:1px 5px;border-radius:3px;">{{top_keyword}}</code> 최상위 키워드,
        <code style="background:#FFF3E0;padding:1px 5px;border-radius:3px;">{{issue_count}}</code> 이슈 건수
      </div>
    </div>
  </div>

  <!-- 수정 모달 -->
  <div id="edit-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1000;align-items:center;justify-content:center;">
    <div style="background:white;border-radius:12px;width:560px;box-shadow:0 8px 32px rgba(0,0,0,0.18);">
      <div style="padding:20px 24px;border-bottom:1px solid #E0E0E0;display:flex;align-items:center;justify-content:space-between;">
        <div>
          <div style="font-size:16px;font-weight:700;" id="modal-menu-name">요약 문구 수정</div>
          <div style="font-size:12px;color:#757575;margin-top:2px;">표시될 요약 문구를 작성하세요</div>
        </div>
        <button onclick="closeEditModal()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#757575;">×</button>
      </div>
      <div style="padding:20px 24px;">
        <div style="margin-bottom:16px;">
          <label class="form-label">요약 문구</label>
          <textarea id="modal-textarea" class="form-input" style="width:100%;resize:none;height:100px;font-size:14px;" placeholder="요약 문구를 입력하세요"></textarea>
        </div>
        <div style="margin-bottom:16px;">
          <label class="form-label">표시 지표</label>
          <input type="text" id="modal-metric" class="form-input" style="width:100%;" placeholder="예: 이슈율, 재인입률">
        </div>
        <div style="padding:12px 16px;background:#F5F5F5;border-radius:8px;">
          <div style="font-size:12px;color:#757575;margin-bottom:6px;">미리보기</div>
          <div id="modal-preview" style="font-size:13px;color:#212121;"></div>
        </div>
      </div>
      <div style="padding:16px 24px;border-top:1px solid #E0E0E0;display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn btn-secondary" onclick="closeEditModal()">취소</button>
        <button class="btn btn-primary" onclick="AICC_Toast.show('요약 문구가 저장되었습니다.');closeEditModal()">저장</button>
      </div>
    </div>
  </div>

  <script src="../../../assets/dummy-data/all-data.js"></script>
  <script src="../../../js/utils/data-loader.js"></script>
  <script src="../../../js/utils/auth-simulator.js"></script>
  <script src="../../../js/utils/formatters.js"></script>
  <script src="../../../js/components/sidebar.js"></script>
  <script src="../../../js/components/layout.js"></script>
  <script src="../../../js/components/modal.js"></script>
  <script src="../../../js/components/toast.js"></script>
  <script>
    const summaryData = [
      {
        no: 1,
        menu: 'TA 대시보드',
        summary: '{{period}} 기간 동안 전체 {{total}}건의 콜이 분석되었습니다. 이슈 콜은 {{issue_count}}건으로 전기간 대비 8.5% 증가하였습니다.',
        metric: '이슈율, 이슈 건수, 재인입률',
        modDate: '2025-01-20'
      },
      {
        no: 2,
        menu: '콜 상담',
        summary: '{{period}} 기간 총 {{total}}건의 콜이 처리되었습니다. 평균 통화시간은 5분 23초이며, 재인입률은 4.8%입니다.',
        metric: '전체 콜, 평균 통화시간, 재인입률, 묵음률',
        modDate: '2025-01-18'
      },
      {
        no: 3,
        menu: '상담 유형',
        summary: '상담 유형별 분석 결과, {{top_keyword}} 유형이 가장 높은 비중을 차지하고 있습니다. 총 {{total}}건 중 배송문의 및 교환/반품이 상위를 기록했습니다.',
        metric: '유형별 콜 건수, 점유율, 평균 통화시간',
        modDate: '2025-01-15'
      },
      {
        no: 4,
        menu: '키워드',
        summary: '{{period}} 기간 급상승 키워드 Top 1은 {{top_keyword}}입니다. 전기간 대비 85.2% 증가하여 집중 모니터링이 필요합니다.',
        metric: '급상승률, 고빈도 순위, 모니터링 알림',
        modDate: '2025-01-22'
      }
    ];

    function openEditModal(idx) {
      const d = summaryData[idx];
      document.getElementById('modal-menu-name').textContent = d.menu + ' - 요약 문구 수정';
      document.getElementById('modal-textarea').value = d.summary;
      document.getElementById('modal-metric').value = d.metric;
      updatePreview();
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function updatePreview() {
      const text = document.getElementById('modal-textarea').value;
      document.getElementById('modal-preview').textContent = text
        .replace(/{{period}}/g, '2025년 1월')
        .replace(/{{total}}/g, '1,842')
        .replace(/{{issue_count}}/g, '127')
        .replace(/{{top_keyword}}/g, '환불');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('summary-tbody').innerHTML = summaryData.map(d => `
        <tr style="cursor:pointer;" onclick="openEditModal(${d.no - 1})">
          <td>${d.no}</td>
          <td style="font-weight:600;">${d.menu}</td>
          <td style="font-size:12px;color:#757575;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.summary}</td>
          <td style="font-size:12px;color:#757575;">${d.metric}</td>
          <td style="font-size:12px;color:#9E9E9E;">${d.modDate}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openEditModal(${d.no - 1})">수정</button>
          </td>
        </tr>
      `).join('');

      document.getElementById('modal-textarea').addEventListener('input', updatePreview);

      document.getElementById('edit-modal').addEventListener('click', function(e) {
        if (e.target === this) closeEditModal();
      });
    });
  </script>
</body>
</html>
