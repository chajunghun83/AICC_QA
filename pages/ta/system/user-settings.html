<!DOCTYPE html>
<html lang="ko">
<head>

  <div id="page-content">

      <div>

      </div>
      <button class="btn btn-primary btn-sm" onclick="openAddUserModal()">+ 사용자 등록</button>
    </div>

    <!-- 필터 -->
    <div class="filter-section">

        <span>검색조건</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#757575" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="filter-body">
        <div>
          <label class="form-label">센터</label>
          <select class="form-select" id="ws-filter" onchange="onWsChange()">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">팀</label>
          <select class="form-select" id="team-filter" onchange="filterUsers()">
            <option value="all">전체</option>
          </select>
        </div>
        <div>
          <label class="form-label">접속 권한</label>
          <select class="form-select" id="status-filter" onchange="filterUsers()">
            <option value="all">전체</option>
            <option value="active">활성</option>
            <option value="inactive">비활성</option>
          </select>
        </div>
        <div>
          <label class="form-label">이름</label>
          <input type="text" class="form-input" id="search-input" placeholder="이름 검색" style="min-width:120px;">
        </div>
        <div>
          <label class="form-label">이메일</label>
          <input type="text" class="form-input" id="email-search" placeholder="이메일 검색" style="min-width:150px;">
        </div>
        <div>
          <label class="form-label">&nbsp;</label>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm" onclick="resetUserFilter()">초기화</button>
            <button class="btn btn-primary btn-sm" onclick="filterUsers()">검색</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 테이블 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">사용자 목록</span>
        <span style="font-size:12px;color:#757575;" id="total-count">총 0명</span>

            <tr>

              <th>이름</th>
              <th>이메일</th>
              <th>센터</th>
              <th>팀</th>
              <th>데이터 범위</th>
              <th>메뉴 권한</th>
              <th>접속 권한</th>
            </tr>
          </thead>
          <tbody id="user-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

    function getAllIds(nodes) {
      let ids = [];
      nodes.forEach(n => { ids.push(n.id); if (n.children) ids = ids.concat(getAllIds(n.children)); });
      return ids;
    }

    /* 데이터 범위: 전체 / 센터 / 센터 > 팀 계층적 표시 */
    function dataScopeBadge(perms) {
      if (!perms || perms.length === 0) return '<span style="color:#BDBDBD;font-size:11px;">미설정</span>';
      const scopeNode = PERM_TREE.find(n => n.id === 'data-scope');
      if (!scopeNode) return '';
      const allScopeIds = getAllIds(scopeNode.children);
      const allChecked = allScopeIds.every(id => perms.includes(id));
      if (allChecked) return '<span class="badge" style="font-size:10px;background:#E3F2FD;color:#1565C0;border:1px solid #BBDEFB;">전체</span>';

      const badges = [];
      scopeNode.children.forEach(center => {
        const centerTeamIds = center.children ? center.children.map(t => t.id) : [];
        const checkedTeams = center.children ? center.children.filter(t => perms.includes(t.id)) : [];
        if (checkedTeams.length === 0) return;
        const allTeamsChecked = centerTeamIds.length === checkedTeams.length;
        if (allTeamsChecked) {
          badges.push(`<span class="badge" style="font-size:10px;background:#FFF3E0;color:#E65100;border:1px solid #FFE0B2;">${center.label}</span>`);
        } else {
          checkedTeams.forEach(t => {
            badges.push(`<span class="badge" style="font-size:10px;background:#FFF3E0;color:#E65100;border:1px solid #FFE0B2;">${center.label} &gt; ${t.label}</span>`);
          });
        }
      });
      if (badges.length === 0) return '<span style="color:#BDBDBD;font-size:11px;">미설정</span>';
      if (badges.length === 1) return badges[0];
      return badges[0] + `<span style="font-size:10px;color:#9E9E9E;margin-left:4px;">외 ${badges.length - 1}건</span>`;
    }

    /* 메뉴 권한: 전체 메뉴 접근이면 '전체', 아니면 '일부 제한' */
    function menuPermBadge(perms) {
      if (!perms || perms.length === 0) return '<span style="color:#BDBDBD;font-size:11px;">미설정</span>';
      const menuNode = PERM_TREE.find(n => n.id === 'ta-menu');
      if (!menuNode) return '';
      const allMenuIds = getAllIds(menuNode.children);
      const allChecked = allMenuIds.every(id => perms.includes(id));
      if (allChecked) return '<span class="badge" style="font-size:10px;background:#E8F5E9;color:#2E7D32;border:1px solid #C8E6C9;">전체</span>';
      const hasAny = allMenuIds.some(id => perms.includes(id));
      if (!hasAny) return '<span style="color:#BDBDBD;font-size:11px;">미설정</span>';
      return '<span class="badge" style="font-size:10px;background:#FFF3E0;color:#E65100;border:1px solid #FFE0B2;">일부 제한</span>';
    }

    function renderTable(data) {
      document.getElementById('total-count').textContent = `총 ${data.length}명`;
      document.getElementById('user-tbody').innerHTML = data.map(u => `
        <tr onclick="openDetail(${u.no})">
          <td>${u.no}</td>
          <td style="font-weight:500;">${u.name}</td>
          <td style="font-size:12px;color:#757575;">${u.email}</td>
          <td>${u.center}</td>
          <td>${u.team}</td>
          <td>${dataScopeBadge(u.permissions)}</td>
          <td>${menuPermBadge(u.permissions)}</td>
          <td>${AICC_Fmt.statusBadge(u.status, u.statusText)}</td>
        </tr>
      `).join('');
    }

    function onWsChange() {
      const wsVal = document.getElementById('ws-filter').value;
      const teamSel = document.getElementById('team-filter');
      teamSel.innerHTML = '<option value="all">전체</option>';
      if (wsVal !== 'all' && centerTeamMap[wsVal]) {
        centerTeamMap[wsVal].forEach(t => { teamSel.innerHTML += `<option value="${t}">${t}</option>`; });
      } else if (wsVal === 'all') {
        const allTeams = [...new Set(users.map(u => u.team).filter(t => t && t !== '전체'))];
        allTeams.forEach(t => { teamSel.innerHTML += `<option value="${t}">${t}</option>`; });
      }
      filterUsers();
    }

    function filterUsers() {
      const wsVal = document.getElementById('ws-filter').value;
      const teamVal = document.getElementById('team-filter').value;
      const statusVal = document.getElementById('status-filter').value;
      const nameVal = (document.getElementById('search-input').value || '').trim().toLowerCase();
      const emailVal = (document.getElementById('email-search').value || '').trim().toLowerCase();
      let filtered = users;
      if (wsVal !== 'all') filtered = filtered.filter(u => u.center === wsVal);
      if (teamVal !== 'all') filtered = filtered.filter(u => u.team === teamVal);
      if (statusVal !== 'all') filtered = filtered.filter(u => u.status === statusVal);
      if (nameVal) filtered = filtered.filter(u => u.name.toLowerCase().includes(nameVal));
      if (emailVal) filtered = filtered.filter(u => (u.email || '').toLowerCase().includes(emailVal));
      renderTable(filtered);
    }

    function resetUserFilter() {
      document.getElementById('ws-filter').value = 'all';
      document.getElementById('team-filter').value = 'all';
      document.getElementById('status-filter').value = 'all';
      document.getElementById('search-input').value = '';
      document.getElementById('email-search').value = '';
      renderTable(users);
    }

    /* ── 권한 트리 렌더링 ── */
    function renderPermTree(nodes, checkedIds, depth, readonly) {
      const d = depth || 0;
      const ro = !!readonly;
      return nodes.map(n => {
        const hasKids = n.children && n.children.length > 0;
        const isChecked = checkedIds.includes(n.id);
        const pad = d * 20;
        const chkId = 'perm-' + n.id;
        if (hasKids) {
          const allChildIds = getAllIds(n.children);
          const allChecked = allChildIds.every(id => checkedIds.includes(id));
          const someChecked = allChildIds.some(id => checkedIds.includes(id));
          return `
            <div style="margin-left:${pad}px;">
              <div style="display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer;" onclick="togglePermGroup(this)">
                <span class="perm-arrow" style="font-size:10px;color:#9E9E9E;width:14px;text-align:center;transition:transform .2s;transform:rotate(90deg);">▶</span>
                <input type="checkbox" id="${chkId}" data-perm-id="${n.id}" ${allChecked ? 'checked' : ''} ${(!allChecked && someChecked) ? 'data-indeterminate="true"' : ''} ${ro ? 'disabled' : `onchange="onPermCheck('${n.id}', this.checked)"`} onclick="event.stopPropagation()">
                <label for="${chkId}" style="font-size:13px;font-weight:600;cursor:pointer;" onclick="event.stopPropagation()">${n.label}</label>
              </div>
              <div class="perm-children" style="display:block;">
                ${renderPermTree(n.children, checkedIds, d + 1, ro)}
              </div>
            </div>`;
        }
        return `
          <div style="margin-left:${pad}px;">
            <div style="display:flex;align-items:center;gap:6px;padding:3px 0;">
              <span style="width:14px;"></span>
              <input type="checkbox" id="${chkId}" data-perm-id="${n.id}" ${isChecked ? 'checked' : ''} ${ro ? 'disabled' : `onchange="onPermCheck('${n.id}', this.checked)"`}>
              <label for="${chkId}" style="font-size:13px;cursor:pointer;">${n.label}</label>
            </div>
          </div>`;
      }).join('');
    }

    function togglePermGroup(el) {
      const arrow = el.querySelector('.perm-arrow');
      const children = el.nextElementSibling;
      if (!children) return;
      const isOpen = children.style.display !== 'none';
      children.style.display = isOpen ? 'none' : 'block';
      if (arrow) arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
    }

    function findNode(nodes, id) {
      for (const n of nodes) {
        if (n.id === id) return n;
        if (n.children) { const f = findNode(n.children, id); if (f) return f; }
      }
      return null;
    }

    function findParent(nodes, id, parent) {
      for (const n of nodes) {
        if (n.id === id) return parent;
        if (n.children) { const f = findParent(n.children, id, n); if (f) return f; }
      }
      return null;
    }

    function onPermCheck(id, checked) {
      const node = findNode(PERM_TREE, id);
      if (!node) return;
      if (node.children) {
        getAllIds(node.children).forEach(cid => {
          const el = document.querySelector(`[data-perm-id="${cid}"]`);
          if (el) { el.checked = checked; el.indeterminate = false; }
        });
      }
      updateParentState(PERM_TREE, id);
    }

    function updateParentState(tree, changedId) {
      const parent = findParent(tree, changedId, null);
      if (!parent || !parent.children) return;
      const childIds = getAllIds(parent.children);
      const states = childIds.map(cid => { const el = document.querySelector(`[data-perm-id="${cid}"]`); return el ? el.checked : false; });
      const allChecked = states.every(Boolean);
      const someChecked = states.some(Boolean);
      const parentEl = document.querySelector(`[data-perm-id="${parent.id}"]`);
      if (parentEl) { parentEl.checked = allChecked; parentEl.indeterminate = !allChecked && someChecked; }
      updateParentState(tree, parent.id);
    }

    function getCheckedPerms() {
      return [...document.querySelectorAll('[data-perm-id]')].filter(el => el.checked).map(el => el.dataset.permId);
    }

    function initIndeterminate() {
      document.querySelectorAll('[data-indeterminate="true"]').forEach(el => { el.indeterminate = true; el.removeAttribute('data-indeterminate'); });
    }

    /* ── 읽기 전용 모달 ── */
    function buildReadonlyHtml(u) {
      return `
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px 20px;background:#F8FAFC;border-radius:10px;border:1px solid #E8EDF2;">
          <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#00A3FF,#0077CC);display:flex;align-items:center;justify-content:center;color:white;font-size:18px;font-weight:700;flex-shrink:0;">
            ${u.name.charAt(0)}
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:16px;font-weight:700;color:#212121;margin-bottom:2px;">${u.name}</div>
            <div style="font-size:12px;color:#757575;">${u.email}</div>
          </div>
          <div style="text-align:right;">
            ${AICC_Fmt.statusBadge(u.status, u.statusText)}
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;margin-bottom:20px;background:#FAFAFA;border-radius:8px;border:1px solid #EEEEEE;overflow:hidden;">
          <div style="padding:14px 16px;border-right:1px solid #EEEEEE;">
            <div style="font-size:10px;font-weight:600;color:#9E9E9E;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">센터</div>
            <div style="font-size:13px;font-weight:600;color:#424242;">${u.center}</div>
          </div>
          <div style="padding:14px 16px;border-right:1px solid #EEEEEE;">
            <div style="font-size:10px;font-weight:600;color:#9E9E9E;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">팀</div>
            <div style="font-size:13px;font-weight:600;color:#424242;">${u.team}</div>
          </div>
          <div style="padding:14px 16px;">
            <div style="font-size:10px;font-weight:600;color:#9E9E9E;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;">가입일</div>
            <div style="font-size:13px;font-weight:600;color:#424242;">${AICC_Fmt.date(u.joinDate)}</div>
          </div>
        </div>
        <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
          <div class="form-label" style="font-weight:700;margin-bottom:8px;">접근 범위</div>
          <div style="max-height:380px;overflow-y:auto;border:1px solid #E0E0E0;border-radius:6px;padding:12px 14px;background:#FAFAFA;">
            ${renderPermTree(PERM_TREE, u.permissions || [], 0, true)}
          </div>
        </div>`;
    }

    /* ── 수정 모달 ── */
    function buildEditHtml(u) {
      const centerOpts = Object.keys(centerTeamMap).map(c => `<option value="${c}" ${u.center === c ? 'selected' : ''}>${c}</option>`).join('');
      const teams = centerTeamMap[u.center] || [];
      const teamOpts = `<option ${u.team === '전체' ? 'selected' : ''}>전체</option>` + teams.map(t => `<option ${u.team === t ? 'selected' : ''}>${t}</option>`).join('');
      return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;">
          <div><div class="form-label">이름 *</div><input type="text" class="form-input" id="uf-name" style="width:100%;" value="${u.name}"></div>
          <div><div class="form-label">이메일 *</div><input type="email" class="form-input" id="uf-email" style="width:100%;" value="${u.email}"></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:16px;">
          <div><div class="form-label">센터</div><select class="form-select" id="uf-ws" style="width:100%;" onchange="onEditWsChange()">${centerOpts}</select></div>
          <div><div class="form-label">팀</div><select class="form-select" id="uf-team" style="width:100%;">${teamOpts}</select></div>
          <div><div class="form-label">접속 권한</div>
            <select class="form-select" id="uf-status" style="width:100%;">
              <option value="active" ${u.status === 'active' ? 'selected' : ''}>활성</option>
              <option value="inactive" ${u.status === 'inactive' ? 'selected' : ''}>비활성</option>
            </select>
          </div>
        </div>
        <div style="margin-bottom:16px;">
          <span class="form-label">가입일</span>
          <span style="font-size:13px;color:#757575;margin-left:8px;">${AICC_Fmt.date(u.joinDate)}</span>
        </div>
        <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
          <div class="form-label" style="font-weight:700;margin-bottom:8px;">접근 범위</div>
          <div style="max-height:380px;overflow-y:auto;border:1px solid #E0E0E0;border-radius:6px;padding:12px 14px;background:#FAFAFA;">
            ${renderPermTree(PERM_TREE, u.permissions || [], 0, false)}
          </div>
        </div>`;
    }

    function onEditWsChange() {
      const ws = document.getElementById('uf-ws').value;
      const teamSel = document.getElementById('uf-team');
      teamSel.innerHTML = '<option>전체</option>';
      if (ws && centerTeamMap[ws]) {
        centerTeamMap[ws].forEach(t => { teamSel.innerHTML += `<option>${t}</option>`; });
      }
    }

    function openDetail(no) {
      const u = users.find(x => x.no === no);
      if (!u) return;
      AICC_Modal.open({
        title: '사용자 상세 - ' + u.name,
        content: buildReadonlyHtml(u),
        footer: `<button class="btn btn-secondary" onclick="AICC_Modal.close()">닫기</button>
                 <button class="btn btn-primary" onclick="openEditMode(${u.no})">수정</button>`,
        size: 'lg'
      });
      setTimeout(initIndeterminate, 50);
    }

    function openEditMode(no) {
      const u = users.find(x => x.no === no);
      if (!u) return;
      AICC_Modal.close();
      setTimeout(() => {
        AICC_Modal.open({
          title: '사용자 수정 - ' + u.name,
          content: buildEditHtml(u),
          footer: `<button class="btn btn-danger" onclick="handleUserAction(${u.no}, '삭제')">삭제</button>
                   <div style="flex:1;"></div>
                   <button class="btn btn-secondary" onclick="openDetail(${u.no})">취소</button>
                   <button class="btn btn-primary" onclick="handleUserAction(${u.no}, '저장')">저장</button>`,
          size: 'lg'
        });
        setTimeout(initIndeterminate, 50);
      }, 200);
    }

    function handleUserAction(no, action) {
      AICC_Modal.close();
      AICC_Toast.show('사용자 ' + action + '가 완료되었습니다.');
    }

    /* ── 등록 모달 ── */
    function onRegWsChange() {
      const ws = document.getElementById('reg-ws').value;
      const teamSel = document.getElementById('reg-team');
      teamSel.innerHTML = '<option value="">팀 선택</option>';
      if (ws && centerTeamMap[ws]) {
        centerTeamMap[ws].forEach(t => { teamSel.innerHTML += `<option value="${t}">${t}</option>`; });
      }
    }

    function openAddUserModal() {
      const centerOptions = Object.keys(centerTeamMap).map(c => `<option value="${c}">${c}</option>`).join('');
      const treeHtml = renderPermTree(PERM_TREE, [], 0, false);
      AICC_Modal.open({
        title: '사용자 등록',
        content: `<div style="display:flex;flex-direction:column;gap:14px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label class="form-label">이름 *</label><input type="text" class="form-input" id="reg-name" style="width:100%;" placeholder="이름"></div>
            <div><label class="form-label">이메일 *</label><input type="email" class="form-input" id="reg-email" style="width:100%;" placeholder="email@company.com"></div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div><label class="form-label">센터 *</label><select class="form-select" id="reg-ws" style="width:100%;" onchange="onRegWsChange()"><option value="">센터 선택</option>${centerOptions}</select></div>
            <div><label class="form-label">팀 *</label><select class="form-select" id="reg-team" style="width:100%;"><option value="">팀 선택</option></select></div>
          </div>
          <div>
            <label class="form-label">접속 권한</label>
            <select class="form-select" id="reg-status" style="width:100%;"><option value="active">활성</option><option value="inactive">비활성</option></select>
          </div>
          <div style="border-top:1px solid #E0E0E0;padding-top:14px;">
            <div class="form-label" style="font-weight:700;margin-bottom:8px;">접근 범위</div>
            <div style="max-height:340px;overflow-y:auto;border:1px solid #E0E0E0;border-radius:6px;padding:12px 14px;background:#FAFAFA;">
              ${treeHtml}
            </div>
          </div>
        </div>`,
        footer: `<button class="btn btn-secondary" onclick="AICC_Modal.close()">취소</button>
                 <button class="btn btn-primary" onclick="saveNewUser()">등록</button>`,
        size: 'lg'
      });
    }

    function saveNewUser() {
      const name = (document.getElementById('reg-name').value || '').trim();
      const email = (document.getElementById('reg-email').value || '').trim();
      const center = document.getElementById('reg-ws').value;
      const team = document.getElementById('reg-team').value;
      const status = document.getElementById('reg-status').value;
      if (!name) { AICC_Toast.show('이름을 입력하세요.'); return; }
      if (!email) { AICC_Toast.show('이메일을 입력하세요.'); return; }
      if (!center) { AICC_Toast.show('센터를 선택하세요.'); return; }
      if (!team) { AICC_Toast.show('팀을 선택하세요.'); return; }
      const newNo = users.length > 0 ? Math.max(...users.map(u => u.no)) + 1 : 1;
      users.push({
        no: newNo, name, email, center, team,
        status, statusText: status === 'active' ? '활성' : '비활성',
        joinDate: new Date().toISOString().slice(0, 10), permissions: getCheckedPerms()
      });
      filterUsers();
      AICC_Modal.close();
      AICC_Toast.show('사용자가 등록되었습니다.');
    }

    /* ── 초기화 ── */
    document.addEventListener('DOMContentLoaded', () => {
      const wsList = [...new Set(users.map(u => u.center).filter(Boolean))];
      const wsSel = document.getElementById('ws-filter');
      wsList.forEach(w => { wsSel.innerHTML += `<option value="${w}">${w}</option>`; });
      const teamList = [...new Set(users.map(u => u.team).filter(t => t && t !== '전체'))];
      const teamSel = document.getElementById('team-filter');
      teamList.forEach(t => { teamSel.innerHTML += `<option value="${t}">${t}</option>`; });
      renderTable(users);
    });
  </script>
</body>
</html>
