<html lang="ko">

<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 페이지 헤더 + 필터 -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">대시보드</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">텍스트 분석 현황 종합 대시보드</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-sm btn-secondary" id="btn-realtime" onclick="toggleRealtime()" style="padding:6px 16px;font-weight:600;white-space:nowrap;flex-shrink:0;">실시간</button>
        <div id="period-picker-container"></div>
        <select class="form-select" id="ws-filter" onchange="onCenterChange()">
          <option value="all">전체 센터</option>
        </select>
        <select class="form-select" id="team-filter" disabled onchange="onTeamChange()">
          <option value="all">전체 팀</option>
        </select>
        <select class="form-select" id="variant-select" onchange="switchVariant()" style="min-width:90px;">
          <option value="v1">시안 1</option>
          <option value="v2">시안 2</option>
        </select>
      </div>
    </div>

    <!-- KPI 카드 4개 -->
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px;" id="kpi-cards"></div>

    <!-- 중간: 급상승 키워드 + 히트맵 2개 + 하단 4카드 -->
    <div style="display:grid;grid-template-columns:1fr 2fr 2fr;grid-template-rows:auto auto;gap:16px;margin-bottom:20px;">
      <!-- 주요 키워드 (시안1: 2행 스팬 / 시안2: 고정 높이) -->
      <div class="content-card" id="keyword-card" style="grid-row:span 2;">
        <div class="content-card-header"><span style="font-size:14px;font-weight:600;">주요 키워드 TOP 20</span></div>
        <div class="content-card-body" style="padding:0;overflow-y:auto;" id="rising-list"></div>
      </div>

      <!-- ===== 시안1: 히트맵 ===== -->
      <div class="content-card" id="variant-v1-left" style="display:flex;flex-direction:column;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">상담유형 히트맵</span>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-sm btn-primary" id="btn-depth1" onclick="switchDepth(1)">대분류</button>
            <button class="btn btn-sm btn-secondary" id="btn-depth2" onclick="switchDepth(2)">중분류</button>
          </div>
        </div>
        <div class="content-card-body" id="heatmap-left" style="height:520px;position:relative;border-radius:10px;overflow:hidden;">
          <canvas id="treemap-left-canvas"></canvas>
        </div>
      </div>
      <div class="content-card" id="variant-v1-right" style="display:flex;flex-direction:column;">
        <div class="content-card-header" style="min-height:62px;">
          <span style="font-size:14px;font-weight:600;">소분류 히트맵</span>
          <span style="font-size:12px;color:#757575;" id="heatmap-right-label">전체</span>
        </div>
        <div class="content-card-body" id="heatmap-right" style="height:520px;position:relative;border-radius:10px;overflow:hidden;">
          <canvas id="treemap-right-canvas"></canvas>
        </div>
      </div>

      <!-- ===== 시안2: 상담유형 분포 ===== -->
      <div class="content-card" id="variant-v2-chart" style="display:none;flex-direction:column;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">상담유형 분포</span>
          <div style="display:flex;align-items:center;gap:12px;font-size:11px;">
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:rgba(0,163,255,0.7);border-radius:2px;"></span>현재 기간</span>
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:#E0E0E0;border-radius:2px;"></span>전월 기간</span>
          </div>
        </div>
        <div class="content-card-body" style="height:520px;"><canvas id="consult-type-canvas"></canvas></div>
      </div>

      <!-- ===== 시안2: 우측 세로 스택 (이슈/신규/미처리) ===== -->
      <div id="variant-v2-right-stack" style="display:none;flex-direction:column;gap:8px;">
        <div class="content-card" style="flex:1;min-height:0;overflow:hidden;">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">이슈 키워드 TOP 5</span></div>
          <div class="content-card-body" style="padding:8px;" id="issue-list-v2"></div>
        </div>
        <div class="content-card" style="flex:1;min-height:0;overflow:hidden;">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">신규 키워드 TOP 5</span><span id="new-kw-info-v2" style="display:none;cursor:help;margin-left:6px;font-size:13px;color:#90CAF9;" title="실시간 모드에서는 어제 대비 오늘 새로 등장한 키워드를 표시합니다.">ⓘ</span></div>
          <div class="content-card-body" style="padding:8px;" id="freq-list-v2"></div>
        </div>
        <div class="content-card" style="flex:1;min-height:0;overflow:hidden;">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">미처리 리스트</span></div>
          <div class="content-card-body" style="padding:8px;" id="pending-list-v2"></div>
        </div>
      </div>

      <!-- 시안1 하단 4카드 -->
      <div id="variant-v1-bottom" style="grid-column:2/4;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">상담유형 Top 5</span></div>
          <div class="content-card-body" style="padding:0;" id="trend-list"></div>
        </div>
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">이슈 키워드 TOP 5</span></div>
          <div class="content-card-body" style="padding:0;" id="issue-list"></div>
        </div>
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">신규 키워드 TOP 5</span><span id="new-kw-info" style="display:none;cursor:help;margin-left:6px;font-size:13px;color:#90CAF9;" title="실시간 모드에서는 어제 대비 오늘 새로 등장한 키워드를 표시합니다.">ⓘ</span></div>
          <div class="content-card-body" style="padding:0;" id="freq-list"></div>
        </div>
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">미처리 리스트</span></div>
          <div class="content-card-body" style="padding:12px;" id="pending-list"></div>
        </div>
      </div>
    </div>

    <!-- 시간대별 콜량 -->

        <span style="font-size:14px;font-weight:600;">시간대별 콜량</span>

        </div>
      </div>
      <div class="content-card-body"><div style="height:280px;"><canvas id="hourly-chart"></canvas></div></div>
    </div>
  </div>

    function getLeafNodes(node) {
      if (!node.children || node.children.length === 0) {
        return [{ name: node.name, count: node.count }];
      }
      let leaves = [];
      node.children.forEach(c => { leaves = leaves.concat(getLeafNodes(c)); });
      return leaves;

      let leaves = [];
      categoryTree.forEach(cat => { leaves = leaves.concat(getLeafNodes(cat)); });

    function getDepth2Items() {
      const items = [];

          cat.children.forEach(child => {
            items.push({ name:child.name, count:child.count, parent:cat.name });
          });
        }
      });
      return items;
    }

    const HEATMAP_SCALE = ['#EBF4FD','#D0E8FA','#B5D4F4','#93BEF0','#6BA4E8','#4B8FDE','#378ADD','#185FA5','#0C447C','#042C53'];

    function treemapBgColor(ctx) {
      if (ctx.type !== 'data') return 'transparent';
      const value = ctx.raw.v;
      const max = ctx.dataset._maxVal || 1;
      const min = ctx.dataset._minVal || 0;
      const range = max - min || 1;
      const normalized = (value - min) / range;
      const idx = Math.min(9, Math.floor(normalized * 10));
      return HEATMAP_SCALE[idx];
    }

    function treemapTextColor(ctx) {
      if (ctx.type !== 'data') return '#212121';
      const value = ctx.raw.v;
      const max = ctx.dataset._maxVal || 1;
      const min = ctx.dataset._minVal || 0;
      const range = max - min || 1;
      const normalized = (value - min) / range;
      const idx = Math.min(9, Math.floor(normalized * 10));
      return idx <= 4 ? '#042C53' : '#EBF4FD';
    }

            tree: items,
            key: 'count',
            labels: {
              display: true,
              formatter: (ctx) => ctx.type === 'data' ? [ctx.raw._data.name, AICC_Fmt.number(ctx.raw.v)] : '',
              color: (ctx) => treemapTextColor(ctx),
              font: [{ size: 11, weight: 600 }, { size: 13, weight: 700 }],
              overflow: 'fit',
              position: 'middle'
            },
            backgroundColor: (ctx) => treemapBgColor(ctx),
            borderColor: 'rgba(255,255,255,0.5)',
            borderWidth: 1,
            borderRadius: 6,
            spacing: 1,
            _maxVal: maxCount,
            _minVal: minCount
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: {
            boxPadding: 6,
            callbacks: {
              title: (items) => items[0]?.raw?._data?.name || '',
              afterTitle: () => '',
              label: (item) => {
                const current = item.raw.v;
                const prev = Math.round(current * (0.75 + Math.random() * 0.3));
                return ['현재 : ' + AICC_Fmt.number(current) + '건', '전월 : ' + AICC_Fmt.number(prev) + '건'];
              }
            }
          }},
          onHover: (e, elements) => {
            e.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
          },
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const raw = leftTreemapChart.data.datasets[0].data[elements[0].index];
              const name = raw?._data?.name;
              if (name) selectHeatmapItem(name);
            }
          }
        }
      });
    }

    function renderRightHeatmap(catName) {
      let leaves = [];
      let label = '전체';

      if (catName && currentDepth === 1) {
        const node = findDepth1Node(catName);
        if (node) { leaves = getLeafNodes(node); label = catName; }
      } else if (catName && currentDepth === 2) {
        const result = findDepth2Node(catName);
        if (result) { leaves = getLeafNodes(result.node); label = result.parent + ' > ' + catName; }
      }

      if (leaves.length === 0) {
        leaves = getAllLeafNodes();
        label = '전체';
      }

      const sorted = [...leaves].sort((a, b) => b.count - a.count);
      const maxCount = Math.max(...sorted.map(i => i.count));
      const minCount = Math.min(...sorted.map(i => i.count));

      document.getElementById('heatmap-right-label').textContent = label;

      if (rightTreemapChart) rightTreemapChart.destroy();

      const canvas = document.getElementById('treemap-right-canvas');
      rightTreemapChart = new Chart(canvas, {
        type: 'treemap',
        data: {
          datasets: [{
            tree: sorted,
            key: 'count',
            labels: {
              display: true,
              formatter: (ctx) => ctx.type === 'data' ? [ctx.raw._data.name, AICC_Fmt.number(ctx.raw.v)] : '',
              color: (ctx) => treemapTextColor(ctx),
              font: [{ size: 10, weight: 600 }, { size: 12, weight: 700 }],
              overflow: 'fit',
              position: 'middle'
            },
            backgroundColor: (ctx) => treemapBgColor(ctx),
            borderColor: 'rgba(255,255,255,0.5)',
            borderWidth: 1,
            borderRadius: 6,
            spacing: 1,
            _maxVal: maxCount,
            _minVal: minCount
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: {
            boxPadding: 6,
            callbacks: {
              title: (items) => items[0]?.raw?._data?.name || '',
              afterTitle: () => '',
              label: (item) => {
                const current = item.raw.v;
                const prev = Math.round(current * (0.75 + Math.random() * 0.3));
                return ['현재 : ' + AICC_Fmt.number(current) + '건', '전월 : ' + AICC_Fmt.number(prev) + '건'];
              }
            }
          }},
          onHover: (e, elements) => {
            e.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
          },
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const raw = rightTreemapChart.data.datasets[0].data[elements[0].index];
              const name = raw?._data?.name;
              if (name) goCallStatus('consult_type', name);
            }
          }
        }
      });
    }

    /* ══════════════════════════ 시안2: 상담유형 분포 차트 ══════════════════════════ */

    let consultTypeChart = null;

    function renderConsultTypeChart() {
      const canvas = document.getElementById('consult-type-canvas');
      if (!canvas) return;
      if (consultTypeChart) consultTypeChart.destroy();

      const allItems = categoryTree.map(c => ({
        name: c.name,
        count: c.count,
        prev: Math.round(c.count * (0.8 + Math.random() * 0.3))
      })).sort((a, b) => b.count - a.count);
      const items = allItems.slice(0, 15);

      consultTypeChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: items.map(i => i.name),
          datasets: [
            { label: '현재 기간', data: items.map(i => i.count), backgroundColor: 'rgba(0,163,255,0.7)', borderRadius: 4, barPercentage: 0.7, categoryPercentage: 0.75 },
            { label: '전월 기간', data: items.map(i => i.prev), backgroundColor: '#E0E0E0', borderRadius: 4, barPercentage: 0.7, categoryPercentage: 0.75 }
          ]
        },
        options: {
          indexAxis: 'y',
          responsive: true, maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(0,0,0,0.8)', padding: 12,
              callbacks: {
                label: c => {
                  const item = items[c.dataIndex];
                  if (c.datasetIndex === 0) {
                    const diff = item.count - item.prev;
                    const sign = diff >= 0 ? '+' : '';
                    return `현재: ${AICC_Fmt.number(item.count)}건 (${sign}${AICC_Fmt.number(diff)})`;
                  }
                  return `전월: ${AICC_Fmt.number(item.prev)}건`;
                }
              }
            }
          },
          scales: {
            x: { beginAtZero: true, grid: { color: '#F0F0F0' }, ticks: { font: { size: 11 }, color: '#757575' } },
            y: { grid: { display: false }, ticks: { font: { size: 12 }, color: '#424242' } }
          },
          onHover: (e, elements) => { e.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default'; },
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const name = items[elements[0].index].name;
              goCallStatus('consult_type', name);
            }
          }
        }
      });
    }

    /* ══════════════════════════ 시안 전환 ══════════════════════════ */

    let v2Rendered = false;

    function renderV2BottomCards() {
      renderV2RankCard('issue-list-v2', isRealtime ? realtimeIssueData : issueData, '#F44336');
      renderV2RankCard('freq-list-v2', isRealtime ? realtimeNewKeywordData : newKeywordData, '#00A3FF');
      renderPendingListV2();
    }

    const V2_KEYWORD_HEIGHT = 620; // 시안2 키워드 카드 고정 높이(px)

    function switchVariant() {
      const v = document.getElementById('variant-select').value;
      const isV1 = v === 'v1';
      const gridContainer = document.getElementById('variant-v1-left').parentElement;
      const kwCard = document.getElementById('keyword-card');

      gridContainer.style.gridTemplateColumns = isV1 ? '1fr 2fr 2fr' : '1fr 2fr 1fr';
      gridContainer.style.gridTemplateRows = isV1 ? 'auto auto' : `${V2_KEYWORD_HEIGHT}px`;

      // 키워드 카드: v1=2행 스팬 auto, v2=고정 높이(stretch 방지)
      kwCard.style.gridRow = isV1 ? 'span 2' : '';
      kwCard.style.height = isV1 ? '' : V2_KEYWORD_HEIGHT + 'px';
      kwCard.style.maxHeight = isV1 ? '' : V2_KEYWORD_HEIGHT + 'px';
      kwCard.style.alignSelf = isV1 ? '' : 'start';

      document.getElementById('variant-v1-left').style.display = isV1 ? 'flex' : 'none';
      document.getElementById('variant-v1-right').style.display = isV1 ? 'flex' : 'none';
      document.getElementById('variant-v1-bottom').style.display = isV1 ? 'grid' : 'none';

      document.getElementById('variant-v2-chart').style.display = isV1 ? 'none' : 'flex';
      document.getElementById('variant-v2-right-stack').style.display = isV1 ? 'none' : 'flex';

      renderMainKeywords();

      if (!isV1) {
        if (!v2Rendered) {
          renderConsultTypeChart();
          v2Rendered = true;
        }
        renderV2BottomCards();
      }
    }

    /* ══════════════════════════ 시간대별 콜량 차트 ══════════════════════════ */

    function renderHourlyChart() {
      const canvas = document.getElementById('hourly-chart');
      if (!canvas) return;
      if (hourlyChart) hourlyChart.destroy();

      const cfg = periodConfig[currentPeriod] || periodConfig.monthly;
      const REALTIME_HOUR = 16;

      const datasets = [];
      if (isRealtime) {
        /* 실시간: 0~16시까지만 데이터, 17~23시는 null */
        const currentData = hourlyBase.current.map((v, i) => i <= REALTIME_HOUR ? v : null);
        datasets.push({
          label: '금일',
          data: currentData,
          backgroundColor: 'rgba(0,163,255,0.7)',
          borderRadius: 4,
          order: 1
        });
      } else {
        datasets.push({
          label: '현재 기간',
          data: hourlyBase.current,
          backgroundColor: 'rgba(0,163,255,0.7)',
          borderRadius: 4,
          order: 1
        });
        datasets.push({
          label: cfg.prevLabel + ' 기간',
          data: hourlyBase.prev,
          type: 'line',
          borderColor: '#BDBDBD',
          borderDash: [4,4],
          pointRadius: 0,
          tension: 0.3,
          borderWidth: 2,
          order: 0
        });
      }

      hourlyChart = new Chart(canvas, {
          type: 'bar',
          data: {
            labels: Array.from({length:24}, (_, i) => `${String(i).padStart(2,'0')}시`),
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { boxPadding: 6, itemSort: (a, b) => a.datasetIndex - b.datasetIndex }
          },
          scales: {
            y: { beginAtZero:true, grid:{ color:'#F0F0F0' }, ticks:{ font:{size:11}, color:'#757575' } },
            x: { grid:{ display:false }, ticks:{ font:{size:11}, color:'#757575' } }
          },
          onHover: (e, elements) => {
            e.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
          },
          onClick: (e, elements) => {
            if (elements.length > 0) {
              const idx = elements[0].index;
              goCallStatus('hour', idx);
            }
          }
          }
        });
      }

    /* ══════════════════════════ 이벤트 핸들러 ══════════════════════════ */

    function switchDepth(depth) {
      currentDepth = depth;
      selectedCatName = null;
      document.getElementById('btn-depth1').className = 'btn btn-sm ' + (depth === 1 ? 'btn-primary' : 'btn-secondary');
      document.getElementById('btn-depth2').className = 'btn btn-sm ' + (depth === 2 ? 'btn-primary' : 'btn-secondary');

      const items = depth === 1 ? getDepth1Items() : getDepth2Items();
      if (items.length > 0) {
        selectedCatName = items[0].name;
      }
      renderLeftHeatmap();
      renderRightHeatmap(selectedCatName);
    }

    function selectHeatmapItem(name) {
      selectedCatName = name;
      renderLeftHeatmap();
      renderRightHeatmap(name);
    }

    /** 전체 위젯 재렌더 */
    function renderAllWidgets() {
      const cfg = isRealtime
        ? { kpiPrefix:'금일', prevLabel:'전일' }
        : (periodConfig[currentPeriod] || periodConfig.monthly);
      renderKPICards(cfg);
      renderMainKeywords();
      renderRankList('trend-list', isRealtime ? realtimeTrendData : trendData, isRealtime);
      renderRankList('issue-list', isRealtime ? realtimeIssueData : issueData, isRealtime);
      renderRankList('freq-list', isRealtime ? realtimeNewKeywordData : newKeywordData, false);
      renderHourlyChart();
      const variant = document.getElementById('variant-select').value;
      if (variant === 'v2') { renderConsultTypeChart(); renderV2BottomCards(); }
    }

    /** 실시간 모드 토글 */
    function toggleRealtime() {
      isRealtime = !isRealtime;
      const btn = document.getElementById('btn-realtime');
      const filterWrap = document.getElementById('period-picker-container');
      const wsFilter = document.getElementById('ws-filter');
      const teamFilter = document.getElementById('team-filter');

      if (isRealtime) {
        btn.className = 'btn btn-sm btn-primary';
        btn.innerHTML = '<span style="color:#FF5252;margin-right:4px;">●</span>실시간';
        /* 필터를 시각적으로만 흐리게 표시 — 클릭하면 실시간 해제 후 필터 적용 */
        filterWrap.style.opacity = '0.5';
        wsFilter.style.opacity = '0.5';
        teamFilter.style.opacity = '0.5';
      } else {
        btn.className = 'btn btn-sm btn-secondary';
        btn.innerHTML = '실시간';
        filterWrap.style.opacity = '1';
        wsFilter.style.opacity = '1';
        wsFilter.disabled = false;
        if (wsFilter.value !== 'all') {
          teamFilter.disabled = false;
        }
        teamFilter.style.opacity = '1';
      }

      /* 실시간 모드의 신규 키워드 info 아이콘 토글 */
      const infoIcon = document.getElementById('new-kw-info');
      if (infoIcon) infoIcon.style.display = isRealtime ? 'inline' : 'none';
      const infoIconV2 = document.getElementById('new-kw-info-v2');
      if (infoIconV2) infoIconV2.style.display = isRealtime ? 'inline' : 'none';

      const prevLegend = document.getElementById('prev-legend-wrap');
      if (prevLegend) prevLegend.style.display = isRealtime ? 'none' : 'flex';
      const currentLabel = document.getElementById('current-legend-label');
      if (currentLabel) currentLabel.textContent = isRealtime ? '금일' : '현재 기간';

      renderAllWidgets();
      AICC_Toast.show(isRealtime ? '실시간 모드가 활성화되었습니다.' : '실시간 모드가 해제되었습니다.');
    }

    /** 실시간 모드 해제 (필터 조작 시 자동 호출) */
    function deactivateRealtime() {
      if (!isRealtime) return;
      isRealtime = false;
      const btn = document.getElementById('btn-realtime');
      btn.className = 'btn btn-sm btn-secondary';
      btn.innerHTML = '실시간';
      document.getElementById('period-picker-container').style.opacity = '1';
      document.getElementById('ws-filter').style.opacity = '1';
      document.getElementById('ws-filter').disabled = false;
      document.getElementById('team-filter').style.opacity = '1';

      const infoIcon = document.getElementById('new-kw-info');
      if (infoIcon) infoIcon.style.display = 'none';
      const infoIconV2 = document.getElementById('new-kw-info-v2');
      if (infoIconV2) infoIconV2.style.display = 'none';
      const prevLegend = document.getElementById('prev-legend-wrap');
      if (prevLegend) prevLegend.style.display = 'flex';
      const currentLabel = document.getElementById('current-legend-label');
      if (currentLabel) currentLabel.textContent = '현재 기간';
    }

    /** 센터 선택 시 팀 필터 캐스케이딩 */
    function onCenterChange() {
      const wasRealtime = isRealtime;
      deactivateRealtime();
      const wsId = document.getElementById('ws-filter').value;
      const teamFilter = document.getElementById('team-filter');

      if (wsId === 'all') {
        teamFilter.disabled = true;
        teamFilter.innerHTML = '<option value="all">전체 팀</option>';
      } else {
        teamFilter.disabled = false;
        if (window._centersData) {
          const center = window._centersData.find(c => c.id === wsId);
          teamFilter.innerHTML = '<option value="all">전체 팀</option>';
          if (center && center.teams) {
            center.teams.forEach(t => {
              teamFilter.innerHTML += `<option value="${t.id}">${t.name}</option>`;
            });
          }
        }
      }
      if (wasRealtime) renderAllWidgets();
      AICC_Toast.show('필터가 적용되었습니다.');
    }

    /** 팀 선택 시 실시간 해제 */
    function onTeamChange() {
      const wasRealtime = isRealtime;
      deactivateRealtime();
      if (wasRealtime) renderAllWidgets();
      AICC_Toast.show('필터가 적용되었습니다.');
    }

    /** 기간 변경 시 데이터 갱신 */
    function applyPeriod(period) {
      deactivateRealtime();
      currentPeriod = period;
      const cfg = periodConfig[period] || periodConfig.monthly;

      // KPI 스케일링
      const factor = { daily:1, weekly:7, monthly:30, yearly:365, custom:15 };
      const f = factor[period] || 30;
      const baseF = 30;
      const ratio = f / baseF;

      const orig = {
        totalCalls: { current:12161, prev:11465, ib:7892, ob:4269, ibPrev:7456, obPrev:4009 },
        issueCalls: { current:8974, prev:8977, ib:5840, ob:3134, ibPrev:5843, obPrev:3134 },
        overCalls:  { current:2185, prev:1876, ib:1420, ob:765, ibPrev:1220, obPrev:656 },
        reEntryCalls:{ current:8675, prev:8371, ib:5639, ob:3036, ibPrev:5436, obPrev:2935 }
      };

      const scale = (val) => Math.round(val * ratio * (0.9 + Math.random() * 0.2));
      Object.keys(kpiBase).forEach(key => {
        Object.keys(kpiBase[key]).forEach(prop => {
          kpiBase[key][prop] = scale(orig[key][prop]);
        });
      });

      renderAllWidgets();

      const prevEl = document.getElementById('prev-legend-label');
      if (prevEl) prevEl.textContent = cfg.prevLabel + ' 기간';

      AICC_Toast.show(`${cfg.kpiPrefix} 데이터로 전환되었습니다.`);
    }

    /* ══════════════════════════ 초기화 ══════════════════════════ */

    document.addEventListener('DOMContentLoaded', async () => {
      // 센터 데이터 로드
      try {
        const data = await AICC_DataLoader.loadAll(['centers.json']);
        const centers = data['centers.json'];
        if (centers) {
          window._centersData = centers;
          const wsSelect = document.getElementById('ws-filter');
          centers.forEach(ws => {
            wsSelect.innerHTML += `<option value="${ws.id}">${ws.name}</option>`;
          });
        }
      } catch(e) { /* 센터 데이터 로드 실패 시 무시 */ }

      // 기간 선택기
      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function(periodType) { applyPeriod(periodType); }
      });

      /* 실시간 모드에서 기간 선택기 클릭 시 즉시 해제 (드롭다운이 흐리게 뜨는 문제 방지) */
      document.getElementById('period-picker-container').addEventListener('click', function() {
        if (isRealtime) {
          deactivateRealtime();
          renderAllWidgets();
          this.style.opacity = '1';
        }
      }, true);

      // 전체 위젯 렌더
      const cfg = periodConfig.monthly;
      renderKPICards(cfg);
      renderMainKeywords();
      renderRankList('trend-list', trendData, false);
      renderRankList('issue-list', issueData, false);
      renderRankList('freq-list', newKeywordData, false);
      renderPendingList();

      // 히트맵 초기 렌더 (대분류 첫 번째 항목 선택)
      selectedCatName = categoryTree[0].name;
      renderLeftHeatmap();
      renderRightHeatmap(selectedCatName);

      renderHourlyChart();
    });
  </script>
</body>
</html>
