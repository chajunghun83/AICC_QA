<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/image/faviconV2.png">
  <title>대시보드 - AICC Quality Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@3.1.0/dist/chartjs-chart-treemap.min.js"></script>
  <link rel="stylesheet" href="../../css/styles.css">
  <style>
    .kpi-card:hover .kpi-search-icon { color: #424242 !important; }
  </style>
</head>
<body class="bg-[#F5F5F5] text-[#212121]">
  <div id="page-content">
    <!-- 페이지 헤더 + 필터 -->
    <div id="page-header-bar" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
      <div>
        <h1 style="font-size:20px;font-weight:700;margin:0;">TA 대시보드</h1>
        <p style="font-size:12px;color:#757575;margin:4px 0 0;">텍스트 분석 현황 종합 대시보드</p>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn btn-sm btn-secondary" id="btn-realtime" onclick="toggleRealtime()" style="padding:6px 16px;font-weight:600;white-space:nowrap;flex-shrink:0;">실시간</button>
        <div id="period-picker-container"></div>
        <select class="form-select" id="ws-filter" onchange="onCenterChange()">
          <option value="all">전체 센터</option>
        </select>
        <select class="form-select" id="team-filter" disabled onchange="onTeamChange()">
          <option value="all">전체 팀</option>
        </select>
        <select class="form-select" id="variant-select" onchange="switchVariant()" style="min-width:90px;">
          <option value="v1" selected>시안 1</option>
          <option value="v2">시안 2</option>
          <option value="v3">시안 3</option>
        </select>
        <button class="btn btn-sm btn-secondary" id="btn-dashboard-mode" onclick="enterDashboardMode()" style="padding:6px 12px;font-weight:600;white-space:nowrap;flex-shrink:0;display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px;"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>대시보드 모드
        </button>
      </div>
    </div>

    <!-- KPI 카드 4개 -->
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px;" id="kpi-cards"></div>

    <!-- 중간: 급상승 키워드 + 히트맵 2개 + 하단 4카드 -->
    <div style="display:grid;grid-template-columns:1fr 2fr 2fr;grid-template-rows:auto auto;gap:16px;margin-bottom:20px;">
      <!-- 주요 키워드 (시안1: 2행 스팬 / 시안2: 고정 높이) -->
      <div class="content-card" id="keyword-card" style="grid-row:span 2;">
        <div class="content-card-header"><span style="font-size:14px;font-weight:600;">주요 키워드</span></div>
        <div class="content-card-body" style="padding:0;overflow-y:auto;" id="rising-list"></div>
      </div>

      <!-- ===== 기존 시안1 원본: 사용자 기준 시안3에서 사용 ===== -->
      <div class="content-card" id="variant-v1-left" style="display:none;flex-direction:column;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">상담유형 히트맵</span>
          <div style="display:flex;gap:4px;">
            <button class="btn btn-sm btn-primary" id="btn-depth1" onclick="switchDepth(1)">대분류</button>
            <button class="btn btn-sm btn-secondary" id="btn-depth2" onclick="switchDepth(2)">중분류</button>
          </div>
        </div>
        <div class="content-card-body" id="heatmap-left" style="height:520px;position:relative;border-radius:10px;overflow:hidden;">
          <canvas id="treemap-left-canvas"></canvas>
        </div>
      </div>
      <div class="content-card" id="variant-v1-right" style="display:none;flex-direction:column;">
        <div class="content-card-header" style="min-height:62px;">
          <span style="font-size:14px;font-weight:600;">소분류 히트맵</span>
          <span style="font-size:12px;color:#757575;" id="heatmap-right-label">전체</span>
        </div>
        <div class="content-card-body" id="heatmap-right" style="height:520px;position:relative;border-radius:10px;overflow:hidden;">
          <canvas id="treemap-right-canvas"></canvas>
        </div>
      </div>

      <!-- ===== 시안2: 상담유형 분포 ===== -->
      <div class="content-card" id="variant-v2-chart" style="display:none;flex-direction:column;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">상담유형 분포</span>
          <div style="display:flex;align-items:center;gap:12px;font-size:11px;">
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:rgba(0,163,255,0.7);border-radius:2px;"></span>현재 기간</span>
            <span style="display:flex;align-items:center;gap:4px;"><span style="width:10px;height:10px;background:#E0E0E0;border-radius:2px;"></span>전월 기간</span>
          </div>
        </div>
        <div class="content-card-body" style="height:520px;"><canvas id="consult-type-canvas"></canvas></div>
      </div>

      <!-- ===== 시안2: 우측 세로 스택 (이슈/신규/미처리) ===== -->
      <div id="variant-v2-right-stack" style="display:none;flex-direction:column;gap:8px;">
        <div class="content-card" style="flex:1;min-height:0;overflow:hidden;">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">이슈 키워드</span></div>
          <div class="content-card-body" style="padding:8px;" id="issue-list-v2"></div>
        </div>
        <div class="content-card" style="flex:1;min-height:0;overflow:hidden;">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">신규 키워드</span><span id="new-kw-info-v2" style="display:none;cursor:help;margin-left:6px;font-size:13px;color:#90CAF9;" title="실시간 모드에서는 어제 대비 오늘 새로 등장한 키워드를 표시합니다.">ⓘ</span></div>
          <div class="content-card-body" style="padding:8px;" id="freq-list-v2"></div>
        </div>
        <div class="content-card" style="flex:1;min-height:0;overflow:hidden;">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">이슈 처리 현황</span></div>
          <div class="content-card-body" style="padding:8px;" id="pending-list-v2"></div>
        </div>
      </div>

      <!-- ===== 기존 시안3 원본: 사용자 기준 시안1에서 사용 ===== -->
      <div class="content-card" id="variant-v3-left" style="display:flex;flex-direction:column;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">상담 유형 Top10</span>
          <span style="font-size:12px;color:#757575;">대분류</span>
        </div>
        <div class="content-card-body" style="height:520px;position:relative;">
          <canvas id="v3-funnel-canvas"></canvas>
        </div>
      </div>
      <div class="content-card" id="variant-v3-right" style="display:flex;flex-direction:column;">
        <div class="content-card-header">
          <span style="font-size:14px;font-weight:600;">소분류</span>
          <span style="font-size:12px;color:#757575;cursor:pointer;" id="v3-donut-label" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'" onclick="window.location.href='consultation-type.html'">전체</span>
        </div>
        <div class="content-card-body" style="display:flex;flex-direction:column;gap:0;padding:12px;">
          <div style="position:relative;height:340px;"><canvas id="v3-donut-canvas"></canvas></div>
          <div id="v3-sub-rank" style="margin-top:30px;"></div>
        </div>
      </div>

      <!-- 시안1/시안3 공용 하단 4카드 -->
      <div id="variant-v1-bottom" style="grid-column:2/4;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;">
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">상품 랭킹</span></div>
          <div class="content-card-body" style="padding:0;" id="trend-list"></div>
        </div>
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">이슈 키워드</span></div>
          <div class="content-card-body" style="padding:0;" id="issue-list"></div>
        </div>
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">신규 키워드</span><span id="new-kw-info" style="display:none;cursor:help;margin-left:6px;font-size:13px;color:#90CAF9;" title="실시간 모드에서는 어제 대비 오늘 새로 등장한 키워드를 표시합니다.">ⓘ</span></div>
          <div class="content-card-body" style="padding:0;" id="freq-list"></div>
        </div>
        <div class="content-card">
          <div class="content-card-header"><span style="font-size:14px;font-weight:600;">이슈 처리 현황</span></div>
          <div class="content-card-body" style="padding:4px;" id="pending-list"></div>
        </div>
      </div>
    </div>

    <!-- 시간대별 콜량 -->
    <div class="content-card">
      <div class="content-card-header">
        <span style="font-size:14px;font-weight:600;">시간대별 콜량</span>
        <div style="display:flex;align-items:center;gap:16px;font-size:11px;">
          <span style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:12px;background:rgba(0,163,255,0.7);border-radius:2px;"></span><span id="current-legend-label">현재 기간</span></span>
          <span id="prev-legend-wrap" style="display:flex;align-items:center;gap:4px;"><span style="width:12px;height:0;border-top:2px dashed #BDBDBD;"></span><span id="prev-legend-label">전월 기간</span></span>
        </div>
      </div>
      <div class="content-card-body"><div style="height:280px;"><canvas id="hourly-chart"></canvas></div></div>
    </div>

    <!-- 대시보드 모드 닫기 버튼 (전체화면 시에만 표시) -->
    <button id="dashboard-mode-exit" onclick="exitDashboardMode()" style="display:none;position:fixed;top:16px;right:16px;z-index:99999;background:#fff;border:1px solid #E0E0E0;border-radius:50%;width:36px;height:36px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.15);align-items:center;justify-content:center;" title="대시보드 모드 종료">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#424242" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

    function getLeafNodes(node) {
      if (!node.children || node.children.length === 0) {
        return [{ name: node.name, count: node.count }];
      }
      let leaves = [];
      node.children.forEach(c => { leaves = leaves.concat(getLeafNodes(c)); });
      return leaves;
    }

    function getAllLeafNodes() {
      let leaves = [];
      categoryTree.forEach(cat => { leaves = leaves.concat(getLeafNodes(cat)); });

    function getDepth1Items() {
      return categoryTree.map(c => ({ name:c.name, count:c.count }));
    }

    function getDepth2Items() {
      const items = [];
      categoryTree.forEach(cat => {
        if (cat.children) {
          cat.children.forEach(child => {
            items.push({ name:child.name, count:child.count, parent:cat.name });
          });
        }
      });
      return items;
    }

      return categoryTree.find(c => c.name === name);

    const issuePieLabelPlugin = {
      id: 'issuePieLabels',
      afterDraw(chart) {
        const { ctx } = chart;
        const meta = chart.getDatasetMeta(0);
        const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
        if (!total) return;
        meta.data.forEach((arc, i) => {
          const d = chart.data.datasets[0].data[i];
          if (!d) return;
          const pct = Math.round(d / total * 100);
          const label = chart.data.labels[i];
          const midAngle = (arc.startAngle + arc.endAngle) / 2;
          const r = (arc.innerRadius + arc.outerRadius) / 2;
          const x = arc.x + Math.cos(midAngle) * r;
          const y = arc.y + Math.sin(midAngle) * r;
          ctx.save();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px "Pretendard",sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x, y - 7);
          ctx.font = '10px "Pretendard",sans-serif';
          ctx.fillText(`${d}건 (${pct}%)`, x, y + 7);
          ctx.restore();
        });
      }
    };

    /* 7단계 스카이블루 순차 스케일 (적음 → 많음) */
    const HEATMAP_SCALE = ['#EBF4FD','#D0E8FA','#B5D4F4','#93BEF0','#6BA4E8','#4B8FDE','#378ADD','#185FA5','#0C447C','#042C53'];

    function treemapBgColor(ctx) {
      if (ctx.type !== 'data') return 'transparent';
      const value = ctx.raw.v;
      const max = ctx.dataset._maxVal || 1;
      const min = ctx.dataset._minVal || 0;
      const range = max - min || 1;
      const normalized = (value - min) / range;
      const idx = Math.min(9, Math.floor(normalized * 10));
      return HEATMAP_SCALE[idx];
    }

    function treemapTextColor(ctx) {
      if (ctx.type !== 'data') return '#212121';
      const value = ctx.raw.v;
      const max = ctx.dataset._maxVal || 1;
      const min = ctx.dataset._minVal || 0;
      const range = max - min || 1;
      const normalized = (value - min) / range;
      const idx = Math.min(9, Math.floor(normalized * 10));
      return idx <= 4 ? '#042C53' : '#EBF4FD';
    }

    function renderRightHeatmap(catName) {
      let leaves = [];
      let label = '전체';

      if (catName && currentDepth === 1) {
        const node = findDepth1Node(catName);
        if (node) { leaves = getLeafNodes(node); label = catName; }
      } else if (catName && currentDepth === 2) {
        const result = findDepth2Node(catName);
        if (result) { leaves = getLeafNodes(result.node); label = result.parent + ' > ' + catName; }
      }

      if (leaves.length === 0) {
        leaves = getAllLeafNodes();
        label = '전체';
      }

      const sorted = [...leaves].sort((a, b) => b.count - a.count);
      const maxCount = Math.max(...sorted.map(i => i.count));
      const minCount = Math.min(...sorted.map(i => i.count));

      document.getElementById('heatmap-right-label').textContent = label;

    function renderConsultTypeChart() {
      const canvas = document.getElementById('consult-type-canvas');
      if (!canvas) return;
      if (consultTypeChart) consultTypeChart.destroy();

      const allItems = categoryTree.map(c => ({
        name: c.name,

        prev: Math.round(c.count * (0.8 + Math.random() * 0.3))
      })).sort((a, b) => b.count - a.count);
      const items = allItems.slice(0, 15);

      consultTypeChart = new Chart(canvas, {
        type: 'bar',
        data: {
          labels: items.map(i => i.name),
          datasets: [

    // 시안3 상품 랭킹 더미 데이터

    // 시안3 전환 시 하단 카드 제목/내용 변경

    /* ══════════════════════════ 시안3: 깔때기 + 도넛 ══════════════════════════ */

    const V3_COLORS = ['#4285F4','#34A853','#FBBC04','#EA4335','#FF6D01','#46BDC6','#7B68EE','#E91E90','#00ACC1','#8D6E63'];

    // 전월 대비 증감 더미 생성 (항목명 기반 고정 seed)
    const _v3PrevMap = {};
    function _v3GetPrev(name, count) {
      if (!(name in _v3PrevMap)) {
        let h = 0; for (let i = 0; i < name.length; i++) h = ((h << 5) - h + name.charCodeAt(i)) | 0;
        const r = ((Math.abs(h) % 200) - 50) / 1000;
        _v3PrevMap[name] = { ratio: r, pDiff: +(r * 100).toFixed(1) };
      }
      const p = _v3PrevMap[name];
      const prevCount = Math.round(count / (1 + p.ratio));
      const diff = +(((count - prevCount) / (prevCount || 1)) * 100).toFixed(1);
      return { prevCount, diff, pDiff: p.pDiff };
    }

    let _v3FunnelCanvas = null;
    let _v3SelectedCat = null;

    function renderV3FunnelChart() {
      const canvas = document.getElementById('v3-funnel-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const container = canvas.parentElement;
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      const sorted = [...categoryTree].sort((a, b) => b.count - a.count).slice(0, 10);
      const total = sorted.reduce((s, c) => s + c.count, 0);
      const maxCount = sorted[0].count;
      const rowH = Math.min(42, (H - 20) / sorted.length);
      const gapY = 4;
      const maxBarW = W * 0.50;
      const labelX = W * 0.02;
      const startY = 10;

      // 호버 영역 저장
      const _hitBoxes = [];

      sorted.forEach((cat, i) => {
        const y = startY + i * (rowH + gapY);
        const barW = (cat.count / maxCount) * maxBarW;
        const barX = (W * 0.52 - barW) / 2 + W * 0.01;
        const barH = rowH - 2;
        const color = V3_COLORS[i % V3_COLORS.length];
        const isSelected = _v3SelectedCat === cat.name;

        // 막대
        ctx.fillStyle = isSelected ? color : color + 'CC';
        ctx.beginPath();
        const r = 4;
        ctx.moveTo(barX + r, y);
        ctx.lineTo(barX + barW - r, y);
        ctx.quadraticCurveTo(barX + barW, y, barX + barW, y + r);
        ctx.lineTo(barX + barW, y + barH - r);
        ctx.quadraticCurveTo(barX + barW, y + barH, barX + barW - r, y + barH);
        ctx.lineTo(barX + r, y + barH);
        ctx.quadraticCurveTo(barX, y + barH, barX, y + barH - r);
        ctx.lineTo(barX, y + r);
        ctx.quadraticCurveTo(barX, y, barX + r, y);
        ctx.fill();

        if (isSelected) {
          ctx.strokeStyle = '#212121';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // 막대 내부 텍스트 (분류명)
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px -apple-system, sans-serif';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'center';
        if (barW > 60) ctx.fillText(cat.name, barX + barW / 2, y + barH / 2);

        // 우측 정보 텍스트
        const pct = ((cat.count / total) * 100).toFixed(1);
        const prev = _v3GetPrev(cat.name, cat.count);
        const arrow = prev.diff >= 0 ? '▲' : '▼';
        const diffColor = prev.diff >= 0 ? '#F44336' : '#2196F3';
        const infoText = `${cat.name}:${cat.count.toLocaleString()}건 ${pct}%`;
        const countDiff = cat.count - prev.prevCount;
        const diffText = `(${Math.abs(prev.diff).toFixed(1)}%${prev.diff >= 0 ? '상승' : '하락'} ∥ ${countDiff >= 0 ? '+' : ''}${countDiff.toLocaleString()}건)`;

        const infoX = W * 0.62;
        ctx.fillStyle = '#212121';
        ctx.font = '600 12px -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(infoText, infoX, y + barH / 2 - 7);

        ctx.fillStyle = '#757575';
        ctx.font = '11px -apple-system, sans-serif';
        ctx.fillText(diffText, infoX, y + barH / 2 + 9);

        _hitBoxes.push({ x: barX, y, w: barW, h: barH, name: cat.name });
      });

      // 클릭/호버 이벤트
      canvas.onmousemove = function(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top) * (H / rect.height);
        const hit = _hitBoxes.find(b => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h);
        canvas.style.cursor = hit ? 'pointer' : 'default';
      };
      canvas.onclick = function(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = (e.clientX - rect.left) * (W / rect.width);
        const my = (e.clientY - rect.top) * (H / rect.height);
        const hit = _hitBoxes.find(b => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h);
        if (hit) {
          _v3SelectedCat = _v3SelectedCat === hit.name ? null : hit.name;
          renderV3FunnelChart();
          renderV3DonutChart(_v3SelectedCat);
        }
      };
    }

    let _v3DonutChart = null;

    function renderV3DonutChart(catName) {
      const label = document.getElementById('v3-donut-label');
      let items = [];
      if (catName) {
        const cat = categoryTree.find(c => c.name === catName);
        if (cat && cat.children) items = cat.children;
        if (label) label.textContent = catName;
      } else {
        categoryTree.forEach(c => { if (c.children) c.children.forEach(sub => items.push(sub)); });
        if (label) label.textContent = '전체';
      }

      items = [...items].sort((a, b) => b.count - a.count).slice(0, 8);
      const total = items.reduce((s, c) => s + c.count, 0);

      const canvas = document.getElementById('v3-donut-canvas');
      if (!canvas) return;
      if (_v3DonutChart) _v3DonutChart.destroy();

      const colors = ['#4285F4','#FBBC04','#34A853','#EA4335','#FF6D01','#46BDC6','#7B68EE','#8D6E63'];

      _v3DonutChart = new Chart(canvas, {
        type: 'doughnut',
        data: {
          labels: items.map(i => i.name),
          datasets: [{ data: items.map(i => i.count), backgroundColor: colors.slice(0, items.length), borderWidth: 2, borderColor: '#fff' }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          cutout: '55%',
          layout: { padding: { top: 40, bottom: 40, left: 60, right: 60 } },
          plugins: {
            legend: { display: false },
            tooltip: { enabled: false }
          }
        },
        plugins: [{
          id: 'v3DonutOuterLabels',
          afterDraw(chart) {
            const { ctx: c, chartArea } = chart;
            const meta = chart.getDatasetMeta(0);
            const cx = (chartArea.left + chartArea.right) / 2;
            const cy = (chartArea.top + chartArea.bottom) / 2;
            c.save();
            meta.data.forEach((arc, i) => {
              const pct = ((items[i].count / total) * 100);
              if (pct < 3) return;
              const midAngle = (arc.startAngle + arc.endAngle) / 2;
              const outerR = arc.outerRadius;
              const px = cx + Math.cos(midAngle) * (outerR + 6);
              const py = cy + Math.sin(midAngle) * (outerR + 6);
              const ex = cx + Math.cos(midAngle) * (outerR + 28);
              const ey = cy + Math.sin(midAngle) * (outerR + 28);
              const isRight = Math.cos(midAngle) >= 0;
              const tx = isRight ? ex + 12 : ex - 12;
              c.beginPath();
              c.moveTo(px, py);
              c.lineTo(ex, ey);
              c.lineTo(tx, ey);
              c.strokeStyle = '#BDBDBD';
              c.lineWidth = 1;
              c.stroke();
              c.font = '600 11px -apple-system, sans-serif';
              c.fillStyle = '#424242';
              c.textBaseline = 'middle';
              c.textAlign = isRight ? 'left' : 'right';
              const lx = isRight ? tx + 4 : tx - 4;
              c.fillText(`${items[i].name} ${items[i].count.toLocaleString()}건 ${pct.toFixed(1)}%`, lx, ey);
            });
            c.restore();
          }
        }]
      });

      // 도넛 조각 클릭 시 전체콜 현황으로 이동
      canvas.onclick = function(e) {
        const points = _v3DonutChart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, true);
        if (points.length > 0) {
          const idx = points[0].index;
          goCallStatus('consult_type', items[idx].name);
        }
      };
      canvas.onmousemove = function(e) {
        const points = _v3DonutChart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, true);
        canvas.style.cursor = points.length > 0 ? 'pointer' : 'default';
      };

      _renderV3SubRank(catName, items);
    }

    function _renderV3SubRank(catName, donutItems) {
      const el = document.getElementById('v3-sub-rank');
      if (!el) return;

      let children = [];
      donutItems.forEach(sub => {
        if (sub.children) sub.children.forEach(c => children.push(c));
      });
      const maxItems = Math.min(donutItems.length, 6);
      children = children.sort((a, b) => b.count - a.count).slice(0, maxItems);

      // 6칸 고정 (데이터가 없는 슬롯은 빈칸)
      const slots = Array.from({ length: 6 }, (_, i) => children[i] || null);
      const leftSlots = slots.slice(0, 3);
      const rightSlots = slots.slice(3);

      const rowHtml = (item, idx) => {
        if (!item) return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F0F0F0;min-height:34px;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;background:#E0E0E0;color:#fff;font-size:11px;font-weight:700;">${idx + 1}</span>
          <span style="flex:1;font-size:12px;color:#BDBDBD;">-</span>
        </div>`;
        return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F0F0F0;cursor:pointer;min-height:34px;" onclick="goCallStatus('keyword','${item.name.replace(/'/g, "\\'")}')">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:4px;background:${idx < 3 ? '#424242' : '#BDBDBD'};color:#fff;font-size:11px;font-weight:700;">${idx + 1}</span>
          <span style="flex:1;font-size:12px;color:#424242;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${item.name}</span>
          <span style="font-size:12px;font-weight:600;color:#212121;white-space:nowrap;">${item.count.toLocaleString()}건</span>
        </div>`;
      };

      el.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 20px;">
          <div>${leftSlots.map((c, i) => rowHtml(c, i)).join('')}</div>
          <div>${rightSlots.map((c, i) => rowHtml(c, i + 3)).join('')}</div>
        </div>`;
    }

    /** 기간 변경 시 데이터 갱신 */
    function applyPeriod(period) {
      deactivateRealtime();
      currentPeriod = period;
      const cfg = periodConfig[period] || periodConfig.monthly;

      // KPI 스케일링
      const factor = { daily:1, weekly:7, monthly:30, yearly:365, custom:15 };
      const f = factor[period] || 30;
      const baseF = 30;
      const ratio = f / baseF;

      const orig = {
        totalCalls: { current:12161, prev:11465, ib:7892, ob:4269, ibPrev:7456, obPrev:4009 },
        issueCalls: { current:8974, prev:8977, ib:5840, ob:3134, ibPrev:5843, obPrev:3134 },
        overCalls:  { current:2185, prev:1876, ib:1420, ob:765, ibPrev:1220, obPrev:656 },
        reEntryCalls:{ current:8675, prev:8371, ib:5639, ob:3036, ibPrev:5436, obPrev:2935 }
      };

      const scale = (val) => Math.round(val * ratio * (0.9 + Math.random() * 0.2));
      Object.keys(kpiBase).forEach(key => {
        Object.keys(kpiBase[key]).forEach(prop => {
          kpiBase[key][prop] = scale(orig[key][prop]);
        });
      });

      renderAllWidgets();

      const prevEl = document.getElementById('prev-legend-label');
      if (prevEl) prevEl.textContent = cfg.prevLabel + ' 기간';

      AICC_Toast.show(`${cfg.kpiPrefix} 데이터로 전환되었습니다.`);
    }

    /* ══════════════════════════ 초기화 ══════════════════════════ */

    document.addEventListener('DOMContentLoaded', async () => {
      // 센터 데이터 로드
      try {
        const data = await AICC_DataLoader.loadAll(['centers.json']);
        const centers = data['centers.json'];
        if (centers) {
          window._centersData = centers;
          const wsSelect = document.getElementById('ws-filter');
          centers.forEach(ws => {
            wsSelect.innerHTML += `<option value="${ws.id}">${ws.name}</option>`;
          });
        }
      } catch(e) { /* 센터 데이터 로드 실패 시 무시 */ }

      // 기간 선택기
      AICC_PeriodPicker.create('period-picker-container', {
        defaultPeriod: 'monthly',
        onChange: function(periodType) { applyPeriod(periodType); }
      });

      /* 실시간 모드에서 기간 선택기 클릭 시 즉시 해제 (드롭다운이 흐리게 뜨는 문제 방지) */
      document.getElementById('period-picker-container').addEventListener('click', function() {
        if (isRealtime) {
          deactivateRealtime();
          renderAllWidgets();
          this.style.opacity = '1';
        }
      }, true);

      // 전체 위젯 렌더
      const cfg = periodConfig.monthly;
      renderKPICards(cfg);
      renderMainKeywords();
      renderRankList('trend-list', v3ProductData, false);
      renderRankList('issue-list', issueData, false);
      renderRankList('freq-list', newKeywordData, false);
      renderIssueStatusChart();

      // 히트맵 초기 렌더 (대분류 첫 번째 항목 선택)
      selectedCatName = categoryTree[0].name;
      renderLeftHeatmap();
      renderRightHeatmap(selectedCatName);

      renderHourlyChart();
      switchVariant();
    });
  </script>
</body>
</html>
